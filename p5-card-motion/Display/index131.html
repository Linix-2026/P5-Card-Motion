// 颜色辅助函数：将hex颜色字符串转为{r,g,b}对象
function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return { r: parseInt(h.substring(0,2), 16), g: parseInt(h.substring(2,4), 16), b: parseInt(h.substring(4,6), 16) };
}
// 预计算所有颜色的RGB值
const COLORS_RGB = {};
for (let [k, v] of Object.entries(COLORS)) {
  if (typeof v === 'string' && v.startsWith('#')) COLORS_RGB[k] = hexToRgb(v);
  else COLORS_RGB[k] = v;
}
// 安全fill：cFill(颜色名, [alpha])
function cFill(colorName, alpha) {
  let c = COLORS_RGB[colorName];
  if (c === undefined) { fill(colorName); return; }
  if (typeof c === 'object') {
    if (alpha !== undefined) fill(c.r, c.g, c.b, alpha);
    else fill(c.r, c.g, c.b);
  } else fill(c);
}
// 安全stroke：cStroke(颜色名, [alpha])
function cStroke(colorName, alpha) {
  let c = COLORS_RGB[colorName];
  if (c === undefined) { stroke(colorName); return; }
  if (typeof c === 'object') {
    if (alpha !== undefined) stroke(c.r, c.g, c.b, alpha);
    else stroke(c.r, c.g, c.b);
  } else stroke(c);
}
// 安全fill原始值：cFillRaw(颜色名, [alpha])
function cFillRaw(colorName, alpha) {
  let c = COLORS_RGB[colorName];
  if (c === undefined) return null;
  if (alpha !== undefined) return { r: c.r, g: c.g, b: c.b, a: alpha };
  return { r: c.r, g: c.g, b: c.b };
}
// 安全stroke原始值：cStrokeRaw(颜色名, [alpha])
function cStrokeRaw(colorName, alpha) {
  return cFillRaw(colorName, alpha);
}

// ==================== 工具函数 ====================
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { let a = [...arr]; for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }

// 居中自动换行文本绘制：在指定中心点绘制文本，自动换行适应宽度
function drawCenteredText(str, centerX, y, maxW, maxH, lineHeight) {
  textAlign(CENTER, TOP);
  lineHeight = lineHeight || 12;
  // 按字符拆分行（支持中英文）
  let chars = str.split('');
  let lines = [];
  let currentLine = '';
  let currentW = 0;
  for (let i = 0; i < chars.length; i++) {
    let ch = chars[i];
    let chW = textWidth(ch);
    if (currentW + chW > maxW && currentLine.length > 0) {
      lines.push(currentLine);
      currentLine = ch;
      currentW = chW;
    } else {
      currentLine += ch;
      currentW += chW;
    }
  }
  if (currentLine) lines.push(currentLine);
  // 限制行数
  let maxLines = Math.floor(maxH / lineHeight);
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let lastLine = lines[maxLines - 1];
    // 如果可能，截断最后一行
    while (lastLine.length > 0 && textWidth(lastLine + '…') > maxW) {
      lastLine = lastLine.slice(0, -1);
    }
    lastLine = lastLine + '…';
    lines[maxLines - 1] = lastLine;
  }
  // 绘制每一行
  for (let i = 0; i < lines.length; i++) {
    text(lines[i], centerX, y + i * lineHeight);
  }
}

// ==================== 游戏状态管理器 ====================
class GameState {
  constructor() {
    this.reset();
  }
  reset() {
    this.hp = 70; this.maxHp = 70;
    this.gold = 100;
    this.deck = [];
    this.relics = [];
    this.currentLayer = 0;
    this.currentNodeId = null;
    this.mapPath = [];
    this.scene = 'title';
    this.combatState = null;
    this.turnNumber = 0;
    this.floorNumber = 0;
    this.showDeckViewer = false;
    this.viewerTab = 'deck'; // 'deck' | 'relics'
    // 初始化基础牌组
    this.initDeck();
  }
  initDeck() {
    this.deck = [];
    // 基础攻击与防御（保留少量作为基础）
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='strike')});
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='defend')});
    // 先攻牌 - 启动连击窗口
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='quick_strike')});
    // 连击牌 - 叠加连击计数
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='flurry')});
    // 猛击牌 - 消耗连击造成高伤
    this.deck.push({...CARD_DATA.find(c=>c.id==='heavy_smash')});
    // 连击防御 - 防御也能参与连击
    this.deck.push({...CARD_DATA.find(c=>c.id==='combo_defense')});
    // 异常牌 - 配合连击加强异常效果
    this.deck.push({...CARD_DATA.find(c=>c.id==='burn_touch')});
    // 每个卡牌实例添加唯一ID
    this.deck.forEach((c, i) => { c.uid = i; c.upgraded = false; });
  }
  addCard(cardTemplate) {
    let c = {...cardTemplate};
    c.uid = Date.now() + Math.random();
    c.upgraded = false;
    this.deck.push(c);
  }
  removeCardByUid(uid) {
    let idx = this.deck.findIndex(c => c.uid === uid);
    if (idx >= 0) this.deck.splice(idx, 1);
  }
  addRelic(relic) {
    if (!this.relics.find(r => r.id === relic.id)) {
      this.relics.push({...relic});
    }
  }
  hasRelic(id) { return this.relics.some(r => r.id === id); }
  heal(amt) { this.hp = Math.min(this.maxHp, this.hp + amt); }
  takeDamage(amt) {
    this.hp -= amt;
    if (this.hp <= 0) { this.hp = 0; this.scene = 'defeat'; }
  }
  getMaxAp() {
    let ap = 3;
    this.relics.forEach(r => { if (r.modifyMaxAp) ap += r.modifyMaxAp; });
    return ap;
  }
  getShopDiscount() {
    let d = 0;
    this.relics.forEach(r => { if (r.modifyShopDiscount) d += r.modifyShopDiscount; });
    return d;
  }
}

// ==================== 事件总线 ====================
class EventBus {
  constructor() {
    this.listeners = {};
  }
  on(event, fn) {
    if (!this.listeners[event]) this.listeners[event] = [];
    this.listeners[event].push(fn);
  }
  emit(event, data) {
    if (this.listeners[event]) {
      this.listeners[event].forEach(fn => fn(data));
    }
  }
  clear() { this.listeners = {}; }
}

// ==================== 音频管理器（Web Audio API 过程化生成） ====================
class AudioManager {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.currentBGM = null;
    this.bgmNodes = [];
    this.initialized = false;
  }
  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.3;
      this.masterGain.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.4;
      this.musicGain.connect(this.masterGain);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.5;
      this.sfxGain.connect(this.masterGain);
      this.initialized = true;
    } catch(e) { console.warn('Audio init failed:', e); }
  }
  stopBGM() {
    this.bgmNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    this.bgmNodes = [];
  }
  // 地图BGM - 神秘、悠远
  playMapBGM() {
    this.stopBGM();
    if (!this.ctx) return;
    let ctx = this.ctx;
    let now = ctx.currentTime;
    // 低音持续嗡鸣
    for (let i = 0; i < 3; i++) {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = [55, 82.4, 110][i] * (1 + Math.sin(i * 2.1) * 0.02);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.08, now + 1);
      osc.connect(gain);
      gain.connect(this.musicGain);
      osc.start(now);
      this.bgmNodes.push(osc);
      // 缓慢调制
      let lfo = ctx.createOscillator();
      let lfoGain = ctx.createGain();
      lfo.frequency.value = 0.1 + i * 0.03;
      lfoGain.gain.value = 8;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start(now);
      this.bgmNodes.push(lfo);
    }
    // 高音叮当 - 神秘感
    let scheduleChime = (time, freq) => {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(0.06, time + 0.05);
      gain.gain.linearRampToValueAtTime(0, time + 1.5);
      osc.connect(gain);
      gain.connect(this.musicGain);
      osc.start(time);
      osc.stop(time + 1.5);
      this.bgmNodes.push(osc);
    };
    let chimeFreqs = [523, 659, 784, 1047, 880, 698, 587, 523];
    for (let i = 0; i < 32; i++) {
      scheduleChime(now + i * 1.8 + Math.random() * 0.3, chimeFreqs[i % chimeFreqs.length] * (0.8 + Math.random() * 0.4));
    }
  }
  // 商店/事件BGM - 古怪、奇特
  playShopBGM() {
    this.stopBGM();
    if (!this.ctx) return;
    let ctx = this.ctx;
    let now = ctx.currentTime;
    // 奇怪的音阶
    let weirdScale = [130.8, 155.6, 185, 207.7, 233.1, 277.2, 311.1];
    for (let i = 0; i < 24; i++) {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = i % 3 === 0 ? 'square' : 'triangle';
      let freq = weirdScale[i % weirdScale.length] * (i < 12 ? 1 : 2);
      osc.frequency.value = freq;
      let t = now + i * 1.2;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.04, t + 0.1);
      gain.gain.linearRampToValueAtTime(0.03, t + 0.3);
      gain.gain.linearRampToValueAtTime(0, t + 0.9);
      osc.connect(gain);
      gain.connect(this.musicGain);
      osc.start(t);
      osc.stop(t + 1.0);
      this.bgmNodes.push(osc);
    }
    // 低音
    let bass = ctx.createOscillator();
    let bassGain = ctx.createGain();
    bass.type = 'sawtooth';
    bass.frequency.value = 65.4;
    bassGain.gain.setValueAtTime(0.03, now);
    bass.connect(bassGain);
    bassGain.connect(this.musicGain);
    bass.start(now);
    this.bgmNodes.push(bass);
  }
  // 战斗BGM - 紧张、激烈
  playBattleBGM() {
    this.stopBGM();
    if (!this.ctx) return;
    let ctx = this.ctx;
    let now = ctx.currentTime;
    // 低音鼓点节奏
    for (let i = 0; i < 64; i++) {
      let t = now + i * 0.4;
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 60 + Math.sin(i * 0.7) * 30;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.02);
      gain.gain.linearRampToValueAtTime(0, t + 0.2);
      osc.connect(gain);
      gain.connect(this.musicGain);
      osc.start(t);
      osc.stop(t + 0.25);
      this.bgmNodes.push(osc);
    }
    // 战斗旋律
    let battleScale = [196, 220, 261.6, 293.7, 329.6, 349.2, 392];
    for (let i = 0; i < 48; i++) {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = battleScale[i % battleScale.length];
      let t = now + i * 0.6;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.06, t + 0.05);
      gain.gain.linearRampToValueAtTime(0, t + 0.4);
      osc.connect(gain);
      gain.connect(this.musicGain);
      osc.start(t);
      osc.stop(t + 0.45);
      this.bgmNodes.push(osc);
    }
  }
  // 音效
  playSFX(type) {
    if (!this.ctx) return;
    let ctx = this.ctx;
    let now = ctx.currentTime;
    let osc, gain;
    switch (type) {
      case 'card_play':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.15);
        break;
      case 'attack':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.15);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.2);
        break;
      case 'block':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.15);
        break;
      case 'combo':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.06);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.1);
        break;
      case 'smash':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.35);
        // 噪音层
        let bufferSize = ctx.sampleRate * 0.1;
        let buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = ctx.createBufferSource();
        noise.buffer = buffer;
        let noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.1, now); noiseGain.gain.linearRampToValueAtTime(0, now + 0.1);
        noise.connect(noiseGain); noiseGain.connect(this.sfxGain);
        noise.start(now);
        break;
      case 'stun':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(400, now + 0.1);
        osc.frequency.setValueAtTime(200, now + 0.2);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.3);
        break;
      case 'hurt':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.2);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.25);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.25);
        break;
      case 'gold':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
        osc.frequency.linearRampToValueAtTime(1800, now + 0.06);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.12);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.12);
        break;
      case 'heal':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.3);
        break;
      case 'draw':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(500, now);
        osc.frequency.linearRampToValueAtTime(700, now + 0.05);
        gain.gain.setValueAtTime(0.06, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.08);
        break;
      case 'death':
        osc = ctx.createOscillator(); gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(20, now + 0.8);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.9);
        osc.connect(gain); gain.connect(this.sfxGain);
        osc.start(now); osc.stop(now + 0.9);
        break;
      case 'victory':
        [523, 659, 784, 1047].forEach((f, i) => {
          let o = ctx.createOscillator();
          let g = ctx.createGain();
          o.type = 'triangle'; o.frequency.value = f;
          let t = now + i * 0.12;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.12, t + 0.05);
          g.gain.linearRampToValueAtTime(0, t + 0.3);
          o.connect(g); g.connect(this.sfxGain);
          o.start(t); o.stop(t + 0.35);
        });
        break;
    }
  }
}

// ==================== 粒子系统 ====================
class Particle {
  constructor(x, y, vx, vy, life, color, size, glyph) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
    this.glyph = glyph || null; // 符文符号
    this.rot = rand(0, Math.PI * 2);
    this.rotV = rand(-0.1, 0.1);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05; // 重力
    this.life--;
    this.rot += this.rotV;
  }
  get alive() { return this.life > 0; }
  get alpha() { return clamp(this.life / this.maxLife, 0, 1); }
}

class ParticleSystem {
  constructor() {
    this.particles = [];
  }
  emit(x, y, count, config = {}) {
    let { color = '#ffffff', size = 3, life = 30, speed = 2, glyphs = null } = config;
    for (let i = 0; i < count; i++) {
      let angle = rand(0, Math.PI * 2);
      let spd = rand(speed * 0.5, speed);
      let glyph = glyphs ? pick(glyphs) : null;
      this.particles.push(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, rand(life*0.5, life), color, rand(size*0.5, size), glyph));
    }
  }
  update() {
    this.particles = this.particles.filter(p => { p.update(); return p.alive; });
  }
  draw() {
    this.particles.forEach(p => {
      push();
      translate(p.x, p.y);
      rotate(p.rot);
      let c = color(p.color);
      fill(red(c), green(c), blue(c), p.alpha * 255);
      noStroke();
      if (p.glyph) {
        textAlign(CENTER, CENTER);
        textSize(p.size * 4);
        text(p.glyph, 0, 0);
      } else {
        ellipse(0, 0, p.size, p.size);
      }
      pop();
    });
  }
  clear() { this.particles = []; }
}

// ==================== 浮动文字系统 ====================
class FloatingText {
  constructor(x, y, text, color, size = 18) {
    this.x = x; this.y = y; this.text = text;
    this.color = color; this.size = size;
    this.life = 45; this.maxLife = 45;
    this.vy = -2;
  }
  update() { this.y += this.vy; this.vy *= 0.97; this.life--; }
  get alive() { return this.life > 0; }
  get alpha() { return clamp(this.life / this.maxLife, 0, 1) * 255; }
}

class FloatingTextManager {
  constructor() { this.texts = []; }
  add(x, y, text, color, size) { this.texts.push(new FloatingText(x, y, text, color, size)); }
  update() { this.texts = this.texts.filter(t => { t.update(); return t.alive; }); }
  draw() {
    this.texts.forEach(t => {
      push();
      let c = color(t.color);
      fill(red(c), green(c), blue(c), t.alpha);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(t.size);
      text(t.text, t.x, t.y);
      pop();
    });
  }
  clear() { this.texts = []; }
}

// ==================== 屏幕震动 ====================
class ScreenShake {
  constructor() { this.intensity = 0; this.duration = 0; this.ox = 0; this.oy = 0; }
  trigger(intensity, duration) {
    this.intensity = Math.max(this.intensity, intensity);
    this.duration = Math.max(this.duration, duration);
  }
  update() {
    if (this.duration > 0) {
      this.ox = rand(-this.intensity, this.intensity);
      this.oy = rand(-this.intensity, this.intensity);
      this.duration--;
      this.intensity *= 0.9;
    } else {
      this.ox = 0; this.oy = 0;
    }
  }
  apply() {
    if (this.ox !== 0 || this.oy !== 0) {
      translate(this.ox, this.oy);
    }
  }
}

// ==================== 按钮组件 ====================
function drawButton( x, y, w, h, text, hovered, enabled = true, btnColor = COLORS.gold) {
  push();
  translate(x, y);
  // 阴影
  fill(0, hovered ? 60 : 40);
  noStroke();
  rect(2, 2, w, h, 6);
  // 主体
  let c = color(btnColor);
  if (hovered) {
    fill(red(c) * 1.2, green(c) * 1.2, blue(c) * 1.2);
  } else {
    fill(red(c), green(c), blue(c));
  }
  // 禁用状态叠加遮罩
  if (!enabled) {
    fill(0, 155);
    noStroke();
    rect(0, 0, w, h, 6);
  }
  stroke(0, 80);
  strokeWeight(1.5);
  rect(0, 0, w, h, 6);
  // 文字
  fill(enabled ? 0 : 200);
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(14);
  textStyle(BOLD);
  text(text, w / 2, h / 2);
  pop();
  return hovered && enabled;
}

class Scene {
  constructor() { this.transitionAlpha = 0; this.transitioning = false; }
  enter() { this.transitionAlpha = 255; this.transitioning = true; }
  update() {
    if (this.transitioning) {
      this.transitionAlpha -= 8;
      if (this.transitionAlpha <= 0) { this.transitionAlpha = 0; this.transitioning = false; }
    }
  }
  draw() {
    if (this.transitionAlpha > 0) {
      fill(0, this.transitionAlpha);
      noStroke();
      rect(0, 0, GAME_W, GAME_H);
    }
  }
  mousePressed() {}
  mouseReleased() {}
  keyPressed() {}
}

// ==================== 地图场景 ====================
class MapScene extends Scene {
  enter() {
    super.enter();
    audio.playMapBGM();
    this.mapConfig = MAP_CONFIG;
    // 检查是否所有层都已完成
    if (gs.currentLayer >= this.mapConfig.layers.length) {
      gs.scene = 'victory';
      return;
    }
    this.currentLayer = gs.currentLayer;
    this.hoveredNode = null;
    this.selectedNode = null;
    this.nodeAnimations = {};
    this.bgParticles = [];
    for (let i = 0; i < 20; i++) {
      this.bgParticles.push({ x: rand(0, GAME_W), y: rand(0, GAME_H), vx: rand(-0.2, 0.2), vy: rand(-0.4, -0.1), life: 200 + rand(0, 300), glyph: pick(['☿','♁','♃','⚗','⛤','✠','✢','✦','◈','●']), size: rand(10, 24) });
    }
  }
  getNodePos(node) {
    return { x: node.x * GAME_W, y: node.y * GAME_H };
  }
  getNodeTypeInfo(type) {
    switch (type) {
      case 'battle': return { icon: '⚔', label: '战斗', color: COLORS.red };
      case 'elite': return { icon: '⛨', label: '精英', color: COLORS.orange };
      case 'boss': return { icon: '✠', label: 'BOSS', color: '#ff2060' };
      case 'shop': return { icon: '💰', label: '商店', color: COLORS.gold };
      case 'event': return { icon: '?', label: '事件', color: COLORS.purple };
      case 'rest': return { icon: '☤', label: '休息', color: COLORS.green };
      case 'treasure': return { icon: '★', label: '宝藏', color: COLORS.goldBright };
      default: return { icon: '○', label: '???', color: COLORS.white };
    }
  }
  update() {
    super.update();
    this.bgParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) { p.x = rand(0, GAME_W); p.y = GAME_H + 20; p.life = 200 + rand(0, 300); } });
    this.hoveredNode = null;
    let layer = this.mapConfig.layers[this.currentLayer];
    if (!layer) return;
    // 获取可到达的节点
    let reachableIds = new Set();
    if (gs.currentNodeId) {
      // 搜索所有层的连接来找到当前节点能到达的目标
      for (let l of this.mapConfig.layers) {
        (l.connections || []).forEach(([from, to]) => {
          if (from === gs.currentNodeId) reachableIds.add(to);
        });
      }
    } else {
      layer.nodes.forEach(n => reachableIds.add(n.id));
    }
    layer.nodes.forEach(node => {
      if (!reachableIds.has(node.id)) return;
      let pos = this.getNodePos(node);
      let r = node.type === 'boss' ? 35 : 25;
      let d = dist(mouseX, mouseY, pos.x, pos.y);
      if (d < r) this.hoveredNode = node;
    });
  }
  draw() {
    background(COLORS.bg);
    // 背景粒子
    this.bgParticles.forEach(p => {
      fill(COLORS.goldDim);
      textAlign(CENTER, CENTER);
      textSize(p.size);
      text(p.glyph, p.x, p.y);
    });
    // 绘制连接线
    strokeWeight(2);
    for (let li = 0; li < this.mapConfig.layers.length; li++) {
      let conns = this.mapConfig.layers[li].connections || [];
      conns.forEach(([fromId, toId]) => {
        let fromNode = this.findNode(fromId);
        let toNode = this.findNode(toId);
        if (!fromNode || !toNode) return;
        let from = this.getNodePos(fromNode);
        let to = this.getNodePos(toNode);
        let visited = gs.mapPath.includes(fromId) && gs.mapPath.includes(toId);
        let available = gs.currentNodeId === fromId || (!gs.currentNodeId && li === gs.currentLayer);
        if (visited) {
          cStroke('gold', 180);
          strokeWeight(2.5);
        } else if (available) {
          cStroke('goldDim', 100);
          strokeWeight(1.5);
        } else {
          cStroke('textDim', 40);
          strokeWeight(1);
        }
        line(from.x, from.y, to.x, to.y);
      });
    }
    // 绘制节点
    for (let li = 0; li < this.mapConfig.layers.length; li++) {
      let layer = this.mapConfig.layers[li];
      let isCurrentLayer = li === this.currentLayer;
      // 判断哪些节点可到达
      let reachableIds = new Set();
      if (isCurrentLayer) {
        if (gs.currentNodeId) {
          // 搜索所有层的连接
          for (let l of this.mapConfig.layers) {
            (l.connections || []).forEach(([from, to]) => {
              if (from === gs.currentNodeId) reachableIds.add(to);
            });
          }
        } else {
          layer.nodes.forEach(n => reachableIds.add(n.id));
        }
      }
      layer.nodes.forEach(node => {
        let pos = this.getNodePos(node);
        let info = this.getNodeTypeInfo(node.type);
        let visited = gs.mapPath.includes(node.id);
        let reachable = reachableIds.has(node.id);
        let isCurrent = node.id === gs.currentNodeId;
        let r = node.type === 'boss' ? 35 : 25;
        let alpha = (isCurrentLayer || visited) ? 255 : (reachable ? 180 : 60);
        push();
        translate(pos.x, pos.y);
        // 脉冲动画
        let pulse = 1 + Math.sin(frameCount * 0.05 + pos.x * 0.01) * 0.08;
        if (isCurrent || this.hoveredNode === node) pulse = 1 + Math.sin(frameCount * 0.1) * 0.15;
        // 光晕
        if (isCurrent || this.hoveredNode === node) {
          for (let i = 3; i >= 0; i--) {
            let rgb = hexToRgb(info.color);
            fill(rgb.r, rgb.g, rgb.b, 20 - i * 4);
            noStroke();
            ellipse(0, 0, (r + i * 6) * 2 * pulse, (r + i * 6) * 2 * pulse);
          }
        }
        // 节点主体
        if (visited) {
          fill(color(info.color));
          stroke(COLORS.gold);
          strokeWeight(2.5);
        } else if (reachable) {
          fill(COLORS.bgLight);
          stroke(color(info.color));
          strokeWeight(2);
        } else {
          fill(COLORS.bg);
          cStroke('textDim', 80);
          strokeWeight(1);
        }
        ellipse(0, 0, r * 2 * pulse, r * 2 * pulse);
        // 图标
        fill(visited ? 0 : color(info.color));
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(node.type === 'boss' ? 22 : 16);
        text(info.icon, 0, 0);
        // 标签
        fill(visited ? COLORS.gold : (reachable ? COLORS.text : COLORS.textDim));
        textSize(10);
        text(info.label, 0, r + 14);
        // 当前节点标记
        if (isCurrent) {
          noFill();
          stroke(COLORS.goldBright);
          strokeWeight(2);
          ellipse(0, 0, (r + 8) * 2 * pulse, (r + 8) * 2 * pulse);
        }
        pop();
      });
    }
    // 层标签
    fill(COLORS.textDim);
    textAlign(LEFT, CENTER);
    textSize(12);
    for (let li = 0; li < this.mapConfig.layers.length; li++) {
      let y = this.mapConfig.layers[li].nodes[0].y * GAME_H;
      let label = li === this.mapConfig.layers.length - 1 ? '深渊底层' : `第${li + 1}层`;
      text(label, 20, y);
      cStroke('goldDim', 40);
      strokeWeight(1);
      line(70, y, 90, y);
    }
    // 玩家信息
    this.drawPlayerInfo();
    super.draw();
  }
  drawPlayerInfo() {
    fill(COLORS.panel);
    stroke(COLORS.panelEdge);
    strokeWeight(1);
    rect(GAME_W - 160, 10, 150, 65, 8);
    fill(COLORS.text);
    noStroke();
    textAlign(LEFT, TOP);
    textSize(12);
    text(`❤ ${gs.hp}/${gs.maxHp}`, GAME_W - 148, 18);
    text(`💰 ${gs.gold}`, GAME_W - 148, 36);
    text(`🃏 ${gs.deck.length}张`, GAME_W - 148, 54);
    // 遗物
    if (gs.relics.length > 0) {
      fill(COLORS.textDim);
      textSize(10);
      text(`遗物: ${gs.relics.map(r => r.icon).join(' ')}`, GAME_W - 148, 68);
    }
  }
  findNode(id) {
    for (let layer of this.mapConfig.layers) {
      for (let node of layer.nodes) {
        if (node.id === id) return node;
      }
    }
    return null;
  }
  mousePressed() {
    if (this.hoveredNode) {
      let node = this.hoveredNode;
      gs.mapPath.push(node.id);
      gs.currentNodeId = node.id;
      // 进入对应场景
      switch (node.type) {
        case 'battle': gs.scene = 'battle'; gs.combatState = null; break;
        case 'elite': gs.scene = 'battle'; gs.combatState = null; break;
        case 'boss': gs.scene = 'battle'; gs.combatState = null; break;
        case 'shop': gs.scene = 'shop'; break;
        case 'event': gs.scene = 'event'; break;
        case 'rest': gs.scene = 'rest'; break;
        case 'treasure': gs.scene = 'treasure'; break;
        default: gs.scene = 'battle'; gs.combatState = null; break;
      }
      // 只有非Boss节点且不在最后一层时才前进层级
      if (node.type !== 'boss' && gs.currentLayer < this.mapConfig.layers.length - 1) {
        gs.currentLayer++;
      }
    }
  }
}

// ==================== 战斗场景 ====================
class BattleScene extends Scene {
  enter() {
    super.enter();
    audio.playBattleBGM();
    this.initCombat();
    this.cardAnimations = [];
    this.enemyAnim = { shakeX: 0, shakeY: 0, scale: 1, flashAlpha: 0 };
    this.playerAnim = { shakeX: 0, shakeY: 0, flashAlpha: 0 };
    this.hoveredCard = null;
    this.selectedCard = null;
    this.enemyIntent = null;
    this.generateEnemyIntent();
    this.bgGlyphs = [];
    for (let i = 0; i < 15; i++) {
      this.bgGlyphs.push({ x: rand(0, GAME_W), y: rand(0, GAME_H), vx: rand(-0.15, 0.15), vy: rand(-0.3, -0.05), glyph: pick(['☿','♁','⚗','⛤','✠','✦','◈','●']), size: rand(8, 20), alpha: rand(10, 30) });
    }
    floatingTexts.clear();
    particles.clear();
    this.turnStartDelay = 30;
    this.enemyTurnDelay = 0;
    this.enemyActionQueue = [];
    this.battleEnding = false;
    this.battleResult = null;
  }
  initCombat() {
    let node = this.findCurrentNode();
    let enemyId = this.selectEnemy(node);
    let enemyData = ENEMY_DATA[enemyId];
    gs.combatState = {
      enemyId: enemyId,
      enemyData: {...enemyData},
      enemyHp: enemyData.maxHp,
      enemyBlock: 0,
      enemyMaxHp: enemyData.maxHp,
      enemyStatuses: {}, // { burn: stacks, freeze: stacks, corrode: stacks, vulnerable: stacks, weak: stacks }
      enemyStunStacks: 0,
      playerBlock: 0,
      ap: gs.getMaxAp(),
      maxAp: gs.hasRelic('cursed_dice') ? gs.getMaxAp() : gs.getMaxAp(),
      comboCount: 0,
      comboWindow: 3, // 先攻触发的连击窗口：剩余可自动视作连击的攻击牌数
      lastPlayedKeyword: null,
      cardsPlayedThisTurn: [],
      drawPile: shuffle([...gs.deck]),
      hand: [],
      discardPile: [],
      exhaustPile: [],
      turnPhase: 'player', // 'player' | 'enemy' | 'animating'
      enemyFirstAttackHalved: gs.hasRelic('void_mask'),
      enemyPreDmg: gs.hasRelic('philosopher_stone') ? 10 : 0,
      bossPhase2: false,
      enemyIntentIndex: 0,
      playerStatuses: {},
    };
    // 遗物效果 - 战斗开始
    gs.relics.forEach(r => { if (r.onCombatStart) r.onCombatStart(gs); });
    // 先攻之印
    if (gs.hasRelic('first_strike_charm')) {
      gs.combatState.cardsPlayedThisTurn = []; // 让所有卡都有先攻效果
    }
    // 贤者之石
    if (gs.combatState.enemyPreDmg > 0) {
      gs.combatState.enemyHp -= gs.combatState.enemyPreDmg;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.35, '-' + gs.combatState.enemyPreDmg, COLORS.orange);
    }
    // 洗牌并抽牌
    this.drawCards(5);
  }
  selectEnemy(node) {
    if (!node) return 'void_spawn';
    if (node.type === 'boss') return 'codex_abyssus';
    if (node.type === 'elite') {
      return gs.floorNumber >= 1 ? 'nightmare_knight' : 'bound_abomination';
    }
    // 普通战斗
    let pool = gs.floorNumber >= 1
      ? ['void_spawn', 'flesh_weaver', 'rune_guardian', 'mind_devourer']
      : ['void_spawn', 'flesh_weaver'];
    return pick(pool);
  }
  findCurrentNode() {
    for (let layer of MAP_CONFIG.layers) {
      for (let node of layer.nodes) {
        if (node.id === gs.currentNodeId) return node;
      }
    }
    return null;
  }
  generateEnemyIntent() {
    let cs = gs.combatState;
    let pattern = cs.enemyData.intentPattern;
    let idx = cs.enemyIntentIndex % pattern.length;
    let intentType = pattern[idx];
    // 特殊行动概率
    if (intentType === 'special' || (cs.enemyData.specialChance && Math.random() < cs.enemyData.specialChance)) {
      intentType = 'special';
    }
    let intent = { type: intentType };
    switch (intentType) {
      case 'attack':
        intent.dmg = cs.enemyData.attackDmg;
        if (cs.bossPhase2 && cs.enemyData.bossPhase2) intent.dmg = cs.enemyData.bossPhase2.attackDmg;
        break;
      case 'defend':
        intent.block = cs.enemyData.blockAmt;
        break;
      case 'special':
        let sp = cs.enemyData.special;
        if (sp.type === 'attack') {
          intent.type = 'attack';
          intent.dmg = sp.dmg;
        } else if (sp.type === 'buff') {
          intent.type = 'buff';
          intent.buffType = sp.buffType;
          intent.amt = sp.amt;
        } else if (sp.type === 'debuff') {
          intent.type = 'debuff';
          intent.debuffType = sp.debuffType;
          intent.amt = sp.amt;
        } else if (sp.type === 'heal') {
          intent.type = 'heal';
          intent.amt = sp.amt;
        }
        break;
    }
    this.enemyIntent = intent;
  }
  drawCards(n) {
    let cs = gs.combatState;
    for (let i = 0; i < n; i++) {
      if (cs.drawPile.length === 0) {
        if (cs.discardPile.length === 0) break;
        cs.drawPile = shuffle(cs.discardPile);
        cs.discardPile = [];
        floatingTexts.add(GAME_W * 0.3, GAME_H * 0.85, '洗牌', COLORS.textDim, 14);
      }
      if (cs.drawPile.length > 0) {
        let card = cs.drawPile.pop();
        // 先攻特性：第一回合更高概率抽到
        if (gs.turnNumber === 0 && card.keywords.includes('先攻')) {
          cs.hand.unshift(card); // 放到手牌前面
        } else {
          cs.hand.push(card);
        }

  dealDamageToEnemy(dmg, card) {

  enemyTakeTurn() {
    let cs = gs.combatState;

        cs.enemyStunStacks = 0;

    switch (intent.type) {
      case 'attack':

        if (cs.enemyFirstAttackHalved) { dmg = Math.floor(dmg / 2); cs.enemyFirstAttackHalved = false; }
        // 虚弱
        if (cs.enemyStatuses.weak) dmg = Math.floor(dmg * 0.75);

        if (cs.playerBlock > 0) {

      particles.emit(GAME_W * 0.65, GAME_H * 0.4, 5, { color: COLORS.orange, size: 3, life: 10, speed: 2 });
      cs.enemyStatuses.burn = Math.floor(cs.enemyStatuses.burn * 0.7); // 灼烧衰减
    }

      cs.enemyStunStacks += cs.enemyStatuses.freeze;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.42, `❄震慑+${cs.enemyStatuses.freeze}`, COLORS.freeze, 14);
      cs.enemyStatuses.freeze = Math.floor(cs.enemyStatuses.freeze * 0.5);

    if (cs.enemyStatuses.corrode > 0) {

      cs.enemyStatuses.corrode = Math.max(0, cs.enemyStatuses.corrode - 1);
    }
    // 易伤
    if (cs.enemyStatuses.vulnerable > 0) cs.enemyStatuses.vulnerable--;

  tickPlayerStatuses() {
    let cs = gs.combatState;
    if (cs.playerStatuses.vulnerable > 0) cs.playerStatuses.vulnerable--;
    if (cs.playerStatuses.weak > 0) cs.playerStatuses.weak--;
    // 清理
    Object.keys(cs.playerStatuses).forEach(k => {
      if (cs.playerStatuses[k] <= 0) delete cs.playerStatuses[k];

  checkCombatEnd() {
    let cs = gs.combatState;

      cs.enemyHp = 0;
      this.battleEnding = true;
      this.battleResult = 'victory';
      audio.playSFX('death');
      setTimeout(() => { this.battleEnding = false; this.onBattleEnd(); }, 1500);
      return true;
    }
    if (gs.hp <= 0) {
      this.battleEnding = true;
      this.battleResult = 'defeat';
      setTimeout(() => { this.battleEnding = false; this.onBattleEnd(); }, 1500);
      return true;

  onBattleEnd() {
    if (this.battleResult === 'victory') {
      audio.playSFX('victory');
      let node = this.findCurrentNode();
      let goldReward = node?.type === 'boss' ? 80 : (node?.type === 'elite' ? 50 : 30);
      gs.gold += goldReward;
      floatingTexts.add(GAME_W / 2, GAME_H / 2, `💰 +${goldReward}`, COLORS.gold, 20);
      // 卡牌奖励
      let cardRewards = this.generateCardRewards(node);
      this.pendingRewards = { gold: goldReward, cards: cardRewards };
      this.showRewardScreen = true;
    } else {
      gs.scene = 'defeat';
    }
  }
  generateCardRewards(node) {
    let pool = [];
    let rarityWeights = { basic: 0, common: 60, uncommon: 30, rare: 10 };
    if (node?.type === 'elite') rarityWeights = { basic: 0, common: 30, uncommon: 50, rare: 20 };
    if (node?.type === 'boss') rarityWeights = { basic: 0, common: 0, uncommon: 40, rare: 60 };
    let available = CARD_DATA.filter(c => c.rarity !== 'basic');
    let rewards = [];
    for (let i = 0; i < 3; i++) {
      let rarity = this.weightedRandom(rarityWeights);
      let candidates = available.filter(c => c.rarity === rarity);
      if (candidates.length === 0) candidates = available.filter(c => c.rarity === 'common');
      let picked = pick(candidates);
      if (!rewards.find(r => r.id === picked.id)) rewards.push({...picked});
    }
    return rewards;
  }
  weightedRandom(weights) {
    let total = Object.values(weights).reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let [key, w] of Object.entries(weights)) {
      r -= w;
      if (r <= 0) return key;
    }
    return 'common';
  }

    this.enemyAnim.shakeY *= 0.8;
    this.enemyAnim.flashAlpha *= 0.85;

    this.playerAnim.shakeY *= 0.8;
    this.playerAnim.flashAlpha *= 0.85;
    // 背景符文
    this.bgGlyphs.forEach(g => { g.x += g.vx; g.y += g.vy; });
    particles.update();
    floatingTexts.update();
    screenShake.update();
    // 回合开始延迟
    if (this.turnStartDelay > 0) {
      this.turnStartDelay--;
      return;
    }
    // 敌人回合
    if (cs.turnPhase === 'enemy' && this.cardAnimations.length === 0) {

        let startX = GAME_W * 0.5 - (totalCards - 1) * spacing / 2;
        // 从右到左检测，优先命中最上层（后绘制）的卡牌
        for (let i = totalCards - 1; i >= 0; i--) {
          let card = cs.hand[i];
          let cx = startX + i * spacing;
          let cy = GAME_H * 0.78;
          // 悬停检测使用放大后的判定区域（与放大后的悬停卡大小匹配）
          let hoverW = CARD_W * 1.12;
          let hoverH = CARD_H * 1.12;
          if (mouseX > cx - hoverW / 2 && mouseX < cx + hoverW / 2 &&
              mouseY > cy - hoverH / 2 && mouseY < cy + hoverH / 2) {
            this.hoveredCard = card;
            break;
          }
        }
      }
      // 奖励界面
      if (this.showRewardScreen) {
        this.hoveredRewardIdx = -1;
        if (this.pendingRewards) {
          for (let i = 0; i < this.pendingRewards.cards.length; i++) {
            let rx = GAME_W / 2 + (i - 1) * 170;
            let ry = GAME_H / 2 + 20;
            if (mouseX > rx - CARD_W / 2 && mouseX < rx + CARD_W / 2 &&
                mouseY > ry - CARD_H / 2 && mouseY < ry + CARD_H / 2) {
              this.hoveredRewardIdx = i;
            }
          }
        }
        // skip按钮hover
        let skipX = GAME_W / 2 - 40;
        let skipY = GAME_H / 2 + 140;
        this.skipBtn = { x: skipX, y: skipY, w: 80, h: 35, hovered: mouseX > skipX && mouseX < skipX + 80 && mouseY > skipY && mouseY < skipY + 35 };
      }
    }
  }
  draw() {
    background(COLORS.bg);
    // 战斗背景
    this.drawBattleBackground();
    screenShake.apply();
    // 敌人
    this.drawEnemy();
    // 玩家
    this.drawPlayer();
    // 卡牌
    this.drawHand();
    // 手牌动画
    this.cardAnimations.forEach(a => {
      let t = a.progress;
      let x = lerp(a.fromX, a.toX, t);
      let y = lerp(a.fromY, a.toY, t);
      let rot = Math.sin(t * Math.PI) * 0.5;
      let scale = 1 + Math.sin(t * Math.PI) * 0.3;
      this.drawCardAt( a.card, x, y, rot, scale);
    });
    // UI
    this.drawBattleUI();
    // 粒子
    particles.draw();
    floatingTexts.draw();
    // 敌人意图
    this.drawEnemyIntent();
    // 奖励界面
    if (this.showRewardScreen) this.drawRewardScreen();
    // 结束
    if (this.battleEnding) {
      fill(0, 180);
      noStroke();
      rect(0, 0, GAME_W, GAME_H);
      fill(this.battleResult === 'victory' ? COLORS.gold : COLORS.red);
      textAlign(CENTER, CENTER);
      textSize(40);
      textStyle(BOLD);
      text(this.battleResult === 'victory' ? '胜 利' : '败 北', GAME_W / 2, GAME_H / 2);
    }
    super.draw();
  }
  drawBattleBackground() {
    // 神秘纹理背景
    fill(COLORS.bgLight);
    noStroke();
    rect(0, 0, GAME_W, GAME_H);
    // 符文
    this.bgGlyphs.forEach(g => {
      fill(COLORS.goldDim);
      textAlign(CENTER, CENTER);
      textSize(g.size);
      text(g.glyph, g.x, g.y);
    });
    // 地面线
    cStroke('goldDim', 40);
    strokeWeight(1);
    line(0, GAME_H * 0.7, GAME_W, GAME_H * 0.7);
    // 战场区域
    noFill();
    cStroke('panelEdge', 60);
    strokeWeight(1);
    ellipse(GAME_W * 0.65, GAME_H * 0.4, 200, 120);
    ellipse(GAME_W * 0.3, GAME_H * 0.5, 150, 100);
  }
  drawEnemy() {
    let cs = gs.combatState;
    let ex = GAME_W * 0.65 + this.enemyAnim.shakeX;
    let ey = GAME_H * 0.38 + this.enemyAnim.shakeY;
    let size = cs.enemyData.size || 60;
    let color = cs.enemyData.color;
    // 死亡动画
    if (cs.enemyHp <= 0) {
      ey += Math.sin(frameCount * 0.2) * 5;
    }
    push();
    translate(ex, ey);
    // 死亡时的淡出效果
    if (cs.enemyHp <= 0) {
      let deathAlpha = 255 * (1 - Math.min(1, frameCount * 0.02));
      // 用遮罩实现淡出而非tint
      // (tint在2D模式下会覆盖所有fill颜色，因此改为绘制后叠加遮罩)
    }
    // 闪光效果
    if (this.enemyAnim.flashAlpha > 0) {
      fill(255, this.enemyAnim.flashAlpha);
      noStroke();
      ellipse(0, 0, size * 2.5, size * 2.5);
    }
    // 敌人绘制 - 根据类型不同绘制
    this.drawEnemySprite( cs, size, color);
    pop();
    // 敌人血条
    this.drawEnemyHealthBar( ex, ey - size - 20, size * 2, cs.enemyHp, cs.enemyMaxHp, cs.enemyBlock);
    // 状态效果
    let statusY = ey - size - 42;
    Object.entries(cs.enemyStatuses).forEach(([type, stacks]) => {
      if (stacks > 0) {
        let colors = { burn: COLORS.burn, freeze: COLORS.freeze, corrode: COLORS.poison, vulnerable: COLORS.red, weak: COLORS.purple };
        let icons = { burn: '🔥', freeze: '❄', corrode: '☠', vulnerable: '↓', weak: '↓' };
        fill(colors[type] || COLORS.white);
        textAlign(CENTER, CENTER);
        textSize(11);
        text(`${icons[type]||''}${stacks}`, ex, statusY);
        statusY -= 16;
      }
    });
    if (cs.enemyStunStacks > 0) {
      fill(COLORS.stun);
      textAlign(CENTER, CENTER);
      textSize(11);
      text(`⚡${cs.enemyStunStacks}`, ex, statusY);
    }
    // Boss阶段标记
    if (cs.bossPhase2) {
      fill(COLORS.redBright);
      textAlign(CENTER, CENTER);
      textSize(12);
      textStyle(BOLD);
      text('P2', ex, ey - size - 60);
    }
  }
  drawEnemySprite( cs, size, enemyColor) {
    let c = color(enemyColor);
    let hpPct = cs.enemyHp / cs.enemyMaxHp;
    // 根据敌人ID绘制不同外观
    let enemyId = cs.enemyData.id;
    // 通用：怪诞扭曲的形态
    let pulse = 1 + Math.sin(frameCount * 0.08) * 0.06;
    // 主体
    fill(c);
    noStroke();
    // 触手/肢体
    for (let i = 0; i < 6; i++) {
      let angle = (i / 6) * Math.PI * 2 + Math.sin(frameCount * 0.05 + i) * 0.3;
      let tx = Math.cos(angle) * size * 0.7 * pulse;
      let ty = Math.sin(angle) * size * 0.5 * pulse;
      stroke(c);
      strokeWeight(3);
      noFill();
      beginShape();
      for (let j = 0; j <= 5; j++) {
        let t = j / 5;
        let ax = Math.cos(angle + Math.sin(t * 3) * 0.4) * size * (0.3 + t * 0.5) * pulse;
        let ay = Math.sin(angle + Math.sin(t * 3) * 0.4) * size * (0.2 + t * 0.4) * pulse;
        curveVertex(ax, ay);
      }
      endShape();
    }
    // 核心
    fill(0, 60);
    noStroke();
    ellipse(0, 0, size * 1.2 * pulse, size * 1.2 * pulse);
    fill(c);
    ellipse(0, 0, size * 0.8 * pulse, size * 0.8 * pulse);
    // 眼睛/核心光芒
    let eyeGlow = 0.5 + Math.sin(frameCount * 0.1) * 0.3;
    fill(255, 255 * eyeGlow);
    if (enemyId === 'codex_abyssus') {
      // Boss - 多个眼睛
      for (let i = 0; i < 5; i++) {
        let ea = (i / 5) * Math.PI * 2;
        ellipse(Math.cos(ea) * size * 0.3, Math.sin(ea) * size * 0.3, 8, 8);
      }
      // 中心大眼
      fill(255, 200);
      ellipse(0, 0, 18, 18);
      fill(0);
      ellipse(0, 0, 8, 8);
      // Boss光环
      noFill();
      cStroke('red', 80 + Math.sin(frameCount * 0.05) * 40);
      strokeWeight(2);
      ellipse(0, 0, size * 1.8 * pulse, size * 1.8 * pulse);
    } else if (enemyId.includes('nightmare') || enemyId.includes('bound')) {
      // 精英 - 更复杂的形态
      fill(255, 150);
      ellipse(0, -size * 0.2, 12, 8);
      ellipse(0, size * 0.2, 12, 8);
      fill(0);
      ellipse(0, -size * 0.2, 5, 5);
      ellipse(0, size * 0.2, 5, 5);
    } else {
      // 普通敌人 - 单眼
      ellipse(0, 0, size * 0.35, size * 0.35);
      fill(0);
      ellipse(0, 0, size * 0.15, size * 0.15);
    }
    // 受伤闪烁
    if (hpPct < 0.5) {
      cFill('red', 60 + Math.sin(frameCount * 0.2) * 30);
      noStroke();
      ellipse(0, 0, size * 1.5, size * 1.5);
    }
  }
  drawEnemyHealthBar( x, y, w, hp, maxHp, block) {
    push();
    translate(x - w / 2, y);
    // 背景
    fill(0, 120);
    noStroke();
    rect(0, 0, w, 14, 3);
    // 格挡
    if (block > 0) {
      let bw = (block / (maxHp + block)) * w;
      fill(COLORS.blue);
      rect(0, 0, Math.min(bw, w), 14, 3);
    }
    // 血量
    let hw = (hp / maxHp) * w;
    fill(hp / maxHp > 0.5 ? COLORS.red : (hp / maxHp > 0.25 ? COLORS.orange : COLORS.redBright));
    rect(0, 0, Math.max(0, hw), 14, 3);
    // 边框
    noFill();
    stroke(COLORS.goldDim);
    strokeWeight(1);
    rect(0, 0, w, 14, 3);
    // 文字
    fill(COLORS.white);
    textAlign(CENTER, CENTER);
    textSize(10);
    text(`${hp}/${maxHp}`, w / 2, 7);
    pop();
  }
  drawPlayer() {
    let cs = gs.combatState;
    let px = GAME_W * 0.3 + this.playerAnim.shakeX;
    let py = GAME_H * 0.52 + this.playerAnim.shakeY;
    push();
    translate(px, py);
    // 玩家形象 - 神秘学者
    if (this.playerAnim.flashAlpha > 0) {
      fill(255, this.playerAnim.flashAlpha);
      noStroke();
      ellipse(0, 0, 80, 80);
    }
    // 斗篷
    fill(COLORS.panel);
    noStroke();
    triangle(-20, -30, 20, -30, 0, 30);
    rect(-22, -30, 44, 50, 10);
    // 头部
    fill(COLORS.textDim);
    ellipse(0, -35, 22, 22);
    // 面具
    fill(COLORS.goldDim);
    ellipse(0, -35, 16, 16);
    fill(COLORS.bg);
    ellipse(-4, -37, 4, 4);
    ellipse(4, -37, 4, 4);
    // 格挡
    if (cs.playerBlock > 0) {
      noFill();
      stroke(COLORS.blueBright);
      strokeWeight(2);
      ellipse(0, 0, 60 + Math.sin(frameCount * 0.1) * 5, 60 + Math.sin(frameCount * 0.1) * 5);
      fill(COLORS.blueBright);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      text(cs.playerBlock, 0, -45);
    }
    pop();
    // 玩家生命
    fill(COLORS.panel);
    stroke(COLORS.panelEdge);
    strokeWeight(1);
    rect(px - 60, py - 60, 120, 20, 4);
    let hpW = (gs.hp / gs.maxHp) * 116;
    fill(COLORS.red);
    noStroke();
    rect(px - 58, py - 58, hpW, 16, 3);
    fill(COLORS.white);
    textAlign(CENTER, CENTER);
    textSize(10);
    text(`${gs.hp}/${gs.maxHp}`, px, py - 50);
    // 玩家状态
    let pStatusY = py - 82;
    Object.entries(cs.playerStatuses).forEach(([type, stacks]) => {
      if (stacks > 0) {
        fill(type === 'vulnerable' ? COLORS.red : COLORS.purple);
        textAlign(CENTER, CENTER);
        textSize(10);
        text(`${type === 'vulnerable' ? '易伤' : '虚弱'}${stacks}`, px, pStatusY);
        pStatusY -= 14;
      }
    });
  }
  drawHand() {
    let cs = gs.combatState;
    if (cs.turnPhase !== 'player') return;
    // 手牌基础位置
    let totalCards = cs.hand.length;
    if (totalCards === 0) return;
    let spacing = totalCards > 6 ? Math.min(95, 580 / totalCards) : 110;
    let startX = GAME_W * 0.5 - (totalCards - 1) * spacing / 2;
    // 分两遍绘制：先画非悬停卡，再画悬停卡（置于顶层避免遮挡）
    let hoveredCard = this.hoveredCard;
    // 第一遍：绘制非悬停的卡牌
    for (let i = 0; i < totalCards; i++) {
      let card = cs.hand[i];
      if (card === hoveredCard) continue;
      let cx = startX + i * spacing;
      let cy = GAME_H * 0.78;
      let canPlay = this.canPlayCard(card);
      push();
      translate(cx, cy);
      scale(1);
      this.drawCardAt( card, 0, 0, 0, 1);
      if (!canPlay) {
        fill(0, 100);
        noStroke();
        rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
      }
      pop();
    }
    // 第二遍：绘制悬停卡牌（置于顶层，避免被其他卡牌遮挡）
    if (hoveredCard) {
      let idx = cs.hand.indexOf(hoveredCard);
      if (idx >= 0) {
        let cx = startX + idx * spacing;
        let cy = GAME_H * 0.78;
        let canPlay = this.canPlayCard(hoveredCard);
        // 向上提起 + 放大 + 轻微倾斜
        let liftY = -25;
        push();
        translate(cx, cy + liftY);
        scale(1.12);
        this.drawCardAt( hoveredCard, 0, 0, 0, 1);
        if (!canPlay) {
          fill(0, 120);
          noStroke();
          rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
        }
        if (canPlay) {
          noFill();
          stroke(COLORS.goldBright);
          strokeWeight(2);
          rect(-CARD_W / 2 - 3, -CARD_H / 2 - 3, CARD_W + 6, CARD_H + 6, 8);
        }
        pop();
      }
    }
  }
  drawCardAt( card, cx, cy, rot, cardScale) {
    push();
    translate(cx, cy);
    rotate(rot || 0);
    drawCardVisual(card, 0, 0, cardScale || 1);
    pop();
  }
  drawBattleUI() {
    let cs = gs.combatState;
    // AP显示
    fill(COLORS.panel);
    stroke(COLORS.panelEdge);
    strokeWeight(1.5);
    rect(15, 15, 160, 45, 8);
    fill(COLORS.gold);
    textAlign(LEFT, CENTER);
    textSize(16);
    textStyle(BOLD);
    text(`⚡ AP: ${cs.ap}/${cs.maxAp}`, 28, 37);
    // 连击计数
    if (cs.comboCount > 0 || cs.comboWindow > 0) {
      let comboX = 190;
      let comboW = cs.comboWindow > 0 ? 130 : 100;
      fill(COLORS.panel);
      stroke(COLORS.combo);
      strokeWeight(2);
      rect(comboX, 15, comboW, 45, 8);
      fill(COLORS.combo);
      noStroke();
      textAlign(LEFT, CENTER);
      textSize(16);
      textStyle(BOLD);
      let comboLabel = cs.comboCount > 0 ? `🔗 连击 ${cs.comboCount}` : '';
      if (cs.comboWindow > 0) {
        comboLabel = `🔗 ${cs.comboCount} [${cs.comboWindow}]`;
      }
      text(comboLabel, comboX + 10, 37);
      // 连击脉冲
      let pulse = 1 + Math.sin(frameCount * 0.15) * 0.1;
      noFill();
      stroke(COLORS.combo);
      strokeWeight(1);
      rect(comboX - 2 * pulse, 15 - 2 * pulse, comboW * pulse + 4 * pulse, 49 * pulse, 8);
    }
    // 牌堆信息
    fill(COLORS.panel);
    stroke(COLORS.panelEdge);
    strokeWeight(1);
    rect(15, GAME_H - 50, 100, 40, 6);
    fill(COLORS.textDim);
    textAlign(LEFT, CENTER);
    textSize(11);
    text(`抽牌堆: ${cs.drawPile.length}`, 22, GAME_H - 38);
    text(`弃牌堆: ${cs.discardPile.length}`, 22, GAME_H - 22);
    // 回合信息
    fill(COLORS.textDim);
    textAlign(CENTER, CENTER);
    textSize(11);
    text(`回合 ${gs.turnNumber + 1}`, GAME_W / 2, 20);
    // 结束回合按钮
    let endTurnX = GAME_W - 140;
    let endTurnY = GAME_H - 55;
    let endTurnHovered = mouseX > endTurnX && mouseX < endTurnX + 125 && mouseY > endTurnY && mouseY < endTurnY + 40;
    this.endTurnBtn = { x: endTurnX, y: endTurnY, w: 125, h: 40, hovered: endTurnHovered };
    if (cs.turnPhase === 'player') {
      fill(endTurnHovered ? COLORS.gold : COLORS.panel);
      stroke(endTurnHovered ? COLORS.goldBright : COLORS.goldDim);
      strokeWeight(1.5);
      rect(endTurnX, endTurnY, 125, 40, 8);
      fill(endTurnHovered ? 0 : COLORS.gold);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      textStyle(BOLD);
      text('结束回合', endTurnX + 62, endTurnY + 20);
    }
    // 战斗信息
    if (cs.lastPlayedKeyword) {
      fill(COLORS.textDim);
      textAlign(CENTER, CENTER);
      textSize(10);
      text(`上个特性: ${cs.lastPlayedKeyword}`, GAME_W / 2, GAME_H - 20);
    }
  }
  drawEnemyIntent() {
    let cs = gs.combatState;
    if (!this.enemyIntent || cs.turnPhase !== 'player') return;
    let ix = GAME_W * 0.65;
    let iy = GAME_H * 0.15;
    push();
    translate(ix, iy);
    fill(COLORS.panel);
    stroke(COLORS.panelEdge);
    strokeWeight(1);
    rect(-60, -10, 120, 28, 6);
    let intentText = '';
    switch (this.enemyIntent.type) {
      case 'attack': intentText = `⚔ 攻击 ${this.enemyIntent.dmg || 0}`; break;
      case 'defend': intentText = `🛡 防御 ${this.enemyIntent.block || 0}`; break;
      case 'buff': intentText = `⬆ 增益`; break;
      case 'debuff': intentText = `⬇ 减益`; break;
      case 'heal': intentText = `❤ 治疗`; break;
      default: intentText = '???';
    }
    fill(COLORS.white);
    textAlign(CENTER, CENTER);
    textSize(12);
    textStyle(BOLD);
    text(`意图: ${intentText}`, 0, 4);
    pop();
  }
  drawRewardScreen() {
    fill(0, 160);
    noStroke();
    rect(0, 0, GAME_W, GAME_H);
    fill(COLORS.panel);
    stroke(COLORS.gold);
    strokeWeight(2);
    rect(GAME_W / 2 - 300, GAME_H / 2 - 180, 600, 360, 12);
    fill(COLORS.gold);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    text('选择一张卡牌', GAME_W / 2, GAME_H / 2 - 150);
    fill(COLORS.text);
    textSize(14);
    text(`获得金币: ${this.pendingRewards?.gold || 0}`, GAME_W / 2, GAME_H / 2 - 125);
    // 奖励卡牌
    if (this.pendingRewards) {
      for (let i = 0; i < this.pendingRewards.cards.length; i++) {
        let card = this.pendingRewards.cards[i];
        let rx = GAME_W / 2 + (i - 1) * 170;
        let ry = GAME_H / 2 + 20;
        let hovered = this.hoveredRewardIdx === i;
        push();
        translate(rx, ry);
        if (hovered) scale(1.08);
        this.drawCardAt( card, 0, 0, 0, 1);
        pop();
      }
    }
    // 跳过按钮
    let skipX = GAME_W / 2 - 40;
    let skipY = GAME_H / 2 + 140;
    let skipHovered = mouseX > skipX && mouseX < skipX + 80 && mouseY > skipY && mouseY < skipY + 35;
    this.skipBtn = { x: skipX, y: skipY, w: 80, h: 35, hovered: skipHovered };
    fill(skipHovered ? COLORS.panel : COLORS.bgLight);
    stroke(COLORS.textDim);
    strokeWeight(1);
    rect(skipX, skipY, 80, 35, 6);
    fill(COLORS.textDim);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(12);
    text('跳过', skipX + 40, skipY + 18);
  }
  mousePressed() {
    if (this.battleEnding) return;
    let cs = gs.combatState;
    // 奖励界面选择
    if (this.showRewardScreen) {
      if (this.hoveredRewardIdx >= 0 && this.pendingRewards) {
        let card = this.pendingRewards.cards[this.hoveredRewardIdx];
        gs.addCard(card);
        audio.playSFX('card_play');
        this.finishReward();
        return;
      }
      if (this.skipBtn && this.skipBtn.hovered) {
        this.finishReward();
        return;
      }
      return;
    }
    // 点击卡牌
    if (cs.turnPhase === 'player' && this.hoveredCard && this.canPlayCard(this.hoveredCard)) {
      this.playCard(this.hoveredCard);
      return;
    }
    // 结束回合
    if (this.endTurnBtn && this.endTurnBtn.hovered && cs.turnPhase === 'player') {
      cs.turnPhase = 'enemy';
      this.enemyTurnDelay = 0;
      this.cardAnimations = [];
      return;
    }
  }
  finishReward() {
    this.showRewardScreen = false;
    this.pendingRewards = null;
    let node = this.findCurrentNode();
    if (node?.type === 'boss') {
      gs.currentLayer++;
      gs.currentNodeId = null;
      gs.floorNumber++;
      if (gs.currentLayer >= MAP_CONFIG.layers.length) {
        gs.scene = 'victory';
      } else {
        gs.scene = 'map';
      }
    } else {
      gs.scene = 'map';
    }
  }
}

// ==================== 商店场景 ====================
class ShopScene extends Scene {
  enter() {
    super.enter();
    audio.playShopBGM();
    this.cardsForSale = this.generateShopCards();
    this.relicsForSale = this.generateShopRelics();
    this.hoveredCardIdx = -1;
    this.hoveredRelicIdx = -1;
    this.removeCost = Math.floor(75 * (1 - gs.getShopDiscount()));
    this.bgGlyphs = [];
    for (let i = 0; i < 12; i++) {
      this.bgGlyphs.push({ x: rand(0, GAME_W), y: rand(0, GAME_H), vx: rand(-0.1, 0.1), vy: rand(-0.3, -0.05), glyph: pick(['💰','⚖','✧','◆','●','★']), size: rand(14, 28) });
    }
  }
  generateShopCards() {
    let cards = [];
    let pool = CARD_DATA.filter(c => c.rarity !== 'basic');
    for (let i = 0; i < 5; i++) {
      let card = {...pick(pool)};
      card.price = Math.floor((card.rarity === 'rare' ? 120 : (card.rarity === 'uncommon' ? 70 : 40)) * (1 - gs.getShopDiscount()));
      cards.push(card);
    }
    return cards;
  }
  generateShopRelics() {
    let relics = [];
    let pool = [...RELIC_DATA];
    for (let i = 0; i < 3; i++) {
      let relic = {...pick(pool)};
      relic.price = Math.floor((relic.rarity === 'rare' ? 200 : (relic.rarity === 'uncommon' ? 120 : 70)) * (1 - gs.getShopDiscount()));
      relics.push(relic);
    }
    return relics;
  }
  update() {
    super.update();
    this.bgGlyphs.forEach(g => { g.x += g.vx; g.y += g.vy; });
    this.hoveredCardIdx = -1;
    this.hoveredRelicIdx = -1;
    // 卡牌悬停
    for (let i = 0; i < this.cardsForSale.length; i++) {
      let cx = 200 + i * 170;
      let cy = GAME_H * 0.35;
      if (mouseX > cx - CARD_W / 2 && mouseX < cx + CARD_W / 2 && mouseY > cy - CARD_H / 2 && mouseY < cy + CARD_H / 2 + 30) {
        this.hoveredCardIdx = i;
      }
    }
    // 遗物悬停
    for (let i = 0; i < this.relicsForSale.length; i++) {
      let rx = 180 + i * 200;
      let ry = GAME_H * 0.68;
      if (mouseX > rx - 50 && mouseX < rx + 50 && mouseY > ry - 50 && mouseY < ry + 70) {
        this.hoveredRelicIdx = i;
      }
    }
    // 删牌按钮
    let delX = GAME_W - 160;
    let delY = GAME_H * 0.35;
    this.delBtnHovered = mouseX > delX && mouseX < delX + 130 && mouseY > delY && mouseY < delY + 50;
    // 离开按钮
    let leaveX = GAME_W - 130;
    let leaveY = GAME_H * 0.88;
    this.leaveBtnHovered = mouseX > leaveX && mouseX < leaveX + 110 && mouseY > leaveY && mouseY < leaveY + 40;
  }
  draw() {
    background(COLORS.bg);
    // 背景
    this.bgGlyphs.forEach(g => {
      fill(COLORS.goldDim);
      textAlign(CENTER, CENTER);
      textSize(g.size);
      text(g.glyph, g.x, g.y);
    });
    // 标题
    fill(COLORS.gold);
    textAlign(CENTER, CENTER);
    textSize(28);
    textStyle(BOLD);
    text('⚜ 深 渊 商 店 ⚜', GAME_W / 2, 40);
    // 金币
    fill(COLORS.gold);
    textSize(16);
    text(`💰 ${gs.gold}`, GAME_W / 2, 70);
    // 卡牌
    fill(COLORS.textDim);
    textAlign(LEFT, CENTER);
    textSize(14);
    text('卡牌:', 50, GAME_H * 0.2);
    for (let i = 0; i < this.cardsForSale.length; i++) {
      let card = this.cardsForSale[i];
      let cx = 200 + i * 170;
      let cy = GAME_H * 0.35;
      let hovered = this.hoveredCardIdx === i;
      let affordable = gs.gold >= card.price;
      push();
      translate(cx, cy);
      if (hovered) scale(1.08);
      this.drawCardAt( card, 0, 0, 0, 1);
      // 价格
      fill(affordable ? COLORS.gold : COLORS.red);
      textAlign(CENTER, CENTER);
      textSize(12);
      text(`💰${card.price}`, 0, CARD_H / 2 + 16);
      pop();
    }
    // 遗物
    fill(COLORS.textDim);
    textAlign(LEFT, CENTER);
    textSize(14);
    text('遗物:', 50, GAME_H * 0.55);
    for (let i = 0; i < this.relicsForSale.length; i++) {
      let relic = this.relicsForSale[i];
      let rx = 180 + i * 200;
      let ry = GAME_H * 0.68;
      let hovered = this.hoveredRelicIdx === i;
      let affordable = gs.gold >= relic.price;
      fill(COLORS.panel);
      stroke(hovered ? COLORS.gold : COLORS.panelEdge);
      strokeWeight(hovered ? 2 : 1);
      rect(rx - 60, ry - 40, 120, 90, 8);
      fill(COLORS.gold);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(24);
      text(relic.icon, rx, ry - 20);
      fill(COLORS.text);
      textSize(11);
      text(relic.name, rx, ry + 5);
      fill(affordable ? COLORS.gold : COLORS.red);
      textSize(10);
      text(`💰${relic.price}`, rx, ry + 22);
      // 描述tooltip
      if (hovered) {
        fill(COLORS.panel);
        stroke(COLORS.gold);
        strokeWeight(1);
        rect(rx - 90, ry - 85, 180, 40, 6);
        fill(COLORS.text);
        noStroke();
        textSize(9);
        text(relic.desc, rx, ry - 65);
      }
    }
    // 删牌
    let delX = GAME_W - 160;
    let delY = GAME_H * 0.35;
    fill(this.delBtnHovered ? COLORS.gold : COLORS.panel);
    stroke(this.delBtnHovered ? COLORS.goldBright : COLORS.red);
    strokeWeight(1.5);
    rect(delX, delY, 130, 50, 8);
    fill(COLORS.red);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(14);
    text('移除一张卡牌', delX + 65, delY + 18);
    fill(COLORS.gold);
    textSize(11);
    text(`💰${this.removeCost}`, delX + 65, delY + 38);
    // 离开
    let leaveX = GAME_W - 130;
    let leaveY = GAME_H * 0.88;
    fill(this.leaveBtnHovered ? COLORS.gold : COLORS.panel);
    stroke(COLORS.goldDim);
    strokeWeight(1);
    rect(leaveX, leaveY, 110, 40, 8);
    fill(COLORS.text);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(14);
    text('离开商店', leaveX + 55, leaveY + 20);
    super.draw();
  }
  drawCardAt( card, cx, cy, rot, cardScale) {
    push();
    translate(cx, cy);
    rotate(rot || 0);
    drawCardVisual(card, 0, 0, cardScale || 1);
    pop();
  }
  mousePressed() {
    // 购买卡牌
    if (this.hoveredCardIdx >= 0) {
      let card = this.cardsForSale[this.hoveredCardIdx];
      if (gs.gold >= card.price) {
        gs.gold -= card.price;
        gs.addCard(card);
        this.cardsForSale.splice(this.hoveredCardIdx, 1);
        audio.playSFX('gold');
      }
      return;
    }
    // 购买遗物
    if (this.hoveredRelicIdx >= 0) {
      let relic = this.relicsForSale[this.hoveredRelicIdx];
      if (gs.gold >= relic.price) {
        gs.gold -= relic.price;
        gs.addRelic(relic);
        this.relicsForSale.splice(this.hoveredRelicIdx, 1);
        audio.playSFX('gold');
      }
      return;
    }
    // 删牌
    if (this.delBtnHovered && gs.gold >= this.removeCost) {
      gs.gold -= this.removeCost;
      gs.scene = 'remove_card';
      return;
    }
    // 离开
    if (this.leaveBtnHovered) {
      gs.scene = 'map';
    }
  }
}

// ==================== 事件场景 ====================
class EventScene extends Scene {
  enter() {
    super.enter();
    audio.playShopBGM();
    this.event = pick(EVENT_DATA);
    this.hoveredChoice = -1;
    this.resultText = null;
    this.continueBtn = null;
  }
  update() {
    super.update();
    this.hoveredChoice = -1;
    if (this.resultText) {
      let contX = GAME_W/2 - 60;
      let contY = 430;
      let contHovered = mouseX > contX && mouseX < contX + 120 && mouseY > contY && mouseY < contY + 40;
      this.continueBtn = { x: contX, y: contY, w: 120, h: 40, hovered: contHovered };
      return;
    }
    let panelW = 600;
    let panelH = 580;
    let panelX = GAME_W/2 - panelW/2;
    let panelY = 50;
    let btnW = panelW - 80;
    let btnH = 70;
    let btnX = panelX + 40;
    let startY = panelY + 230;
    for (let i = 0; i < this.event.choices.length; i++) {
      let cy = startY + i * 85;
      if (mouseX > btnX && mouseX < btnX + btnW && mouseY > cy && mouseY < cy + btnH) {
        this.hoveredChoice = i;
      }
    }
  }
  draw() {
    background(COLORS.bg);
    // 神秘背景
    for (let i = 0; i < 20; i++) {
      let x = (i * 137 + frameCount * 0.1) % GAME_W;
      let y = (i * 89) % GAME_H;
      cFill('purple', 20);
      textAlign(CENTER, CENTER);
      textSize(16);
      text('?', x, y);
    }
    let panelW = 600;
    let panelH = 580;
    let panelX = GAME_W/2 - panelW/2;
    let panelY = 50;
    // 事件面板
    fill(COLORS.panel);
    stroke(COLORS.purple);
    strokeWeight(2);
    rect(panelX, panelY, panelW, panelH, 12);
    // 标题装饰线
    cStroke('goldDim', 80);
    strokeWeight(1);
    line(GAME_W/2 - 100, panelY + 45, GAME_W/2 + 100, panelY + 45);
    // 事件名称
    fill(COLORS.gold);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    text(this.event.name, GAME_W/2, panelY + 25);
    // 描述区域
    fill(COLORS.text);
    textSize(14);
    textStyle(NORMAL);
    let descY = panelY + 55;
    let descMaxH = 140;
    drawCenteredText(this.event.desc, GAME_W/2, descY, panelW - 60, descMaxH, 18);
    // 装饰线
    cStroke('goldDim', 80);
    strokeWeight(1);
    line(panelX + 40, panelY + 200, panelX + panelW - 40, panelY + 200);
    // 选择或结果
    if (!this.resultText) {
      let startY = panelY + 220;
      let btnW = panelW - 80;
      let btnH = 70;
      let btnX = panelX + 40;
      for (let i = 0; i < this.event.choices.length; i++) {
        let choice = this.event.choices[i];
        let cy = startY + i * 85;
        let hovered = this.hoveredChoice === i;
        // 选择框
        fill(hovered ? COLORS.gold : COLORS.bgLight);
        stroke(hovered ? COLORS.goldBright : COLORS.panelEdge);
        strokeWeight(1.5);
        rect(btnX, cy, btnW, btnH, 8);
        // 按钮内容
        fill(hovered ? 0 : COLORS.text);
        textSize(13);
        textStyle(BOLD);
        drawCenteredText(choice.text, btnX + btnW/2, cy + 8, btnW - 20, btnH - 16, 14);
      }
    } else {
      // 结果文本
      fill(COLORS.text);
      textSize(15);
      textStyle(BOLD);
      let resultY = panelY + 230;
      drawCenteredText(this.resultText, GAME_W/2, resultY, panelW - 60, 160, 20);
      // 继续按钮
      let contX = GAME_W/2 - 60;
      let contY = 430;
      let contHovered = mouseX > contX && mouseX < contX + 120 && mouseY > contY && mouseY < contY + 40;
      this.continueBtn = { x: contX, y: contY, w: 120, h: 40, hovered: contHovered };
      fill(contHovered ? COLORS.gold : COLORS.panel);
      stroke(COLORS.goldDim);
      strokeWeight(1);
      rect(contX, contY, 120, 40, 8);
      fill(contHovered ? 0 : COLORS.text);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      text('继续', contX + 60, contY + 20);
    }
    super.draw();
  }
  mousePressed() {
    if (this.resultText) {
      if (this.continueBtn && this.continueBtn.hovered) {
        gs.scene = 'map';
      }
      return;
    }
    if (this.hoveredChoice >= 0) {
      this.applyChoice(this.event.choices[this.hoveredChoice]);
    }
  }
  applyChoice(choice) {
    switch (choice.effect) {
      case 'gain_relic':
        let relic = pick(RELIC_DATA);
        gs.addRelic(relic);
        this.resultText = `获得了遗物：${relic.name}！`;
        audio.playSFX('gold');
        break;
      case 'blood_sacrifice':
        gs.takeDamage(choice.hpCost || 10);
        let rareCards = CARD_DATA.filter(c => c.rarity === 'rare' || c.rarity === 'uncommon');
        let card = pick(rareCards);
        gs.addCard(card);
        this.resultText = `失去${choice.hpCost}HP，获得了卡牌：${card.name}！`;
        audio.playSFX('heal');
        break;
      case 'trade':
        if (gs.gold >= (choice.goldCost || 30)) {
          gs.gold -= choice.goldCost;
          let cards = CARD_DATA.filter(c => c.rarity !== 'basic');
          gs.addCard(pick(cards));
          gs.addCard(pick(cards));
          this.resultText = '获得了2张随机卡牌！';
          audio.playSFX('gold');
        } else {
          this.resultText = '金币不足...';
        }
        break;
      case 'cursed_gift':
        let cursed = pick(CARD_DATA.filter(c => c.rarity !== 'basic'));
        gs.addCard(cursed);
        if (Math.random() < 0.4) {
          gs.takeDamage(5);
          this.resultText = `获得${cursed.name}，但被诅咒失去了5HP...`;
        } else {
          this.resultText = `获得了${cursed.name}！看来运气不错。`;
        }
        break;
      case 'void_drink':
        gs.takeDamage(choice.hpCost || 15);
        let r1 = pick(RELIC_DATA);
        let r2 = pick(RELIC_DATA.filter(r => r.id !== r1.id));
        gs.addRelic(r1);
        gs.addRelic(r2 || r1);
        this.resultText = `失去${choice.hpCost}HP，获得了遗物：${r1.name}、${r2?.name || r1.name}！`;
        audio.playSFX('heal');
        break;
      case 'remove_card':
        gs.scene = 'remove_card';
        return;
      case 'upgrade_random':
        let nonBasic = gs.deck.filter(c => c.rarity !== 'basic' && !c.upgraded);
        if (nonBasic.length > 0) {
          let toUpgrade = pick(nonBasic);
          toUpgrade.upgraded = true;
          toUpgrade.baseDmg = Math.floor((toUpgrade.baseDmg || 0) * 1.3);
          toUpgrade.baseBlock = Math.floor((toUpgrade.baseBlock || 0) * 1.3);
          this.resultText = `升级了卡牌：${toUpgrade.name}！`;
        } else {
          this.resultText = '没有可升级的卡牌...';
        }
        break;
      case 'gold':
        gs.gold += (choice.goldAmt || 50);
        this.resultText = `获得了${choice.goldAmt}金币！`;
        audio.playSFX('gold');
        break;
      case 'gain_card':
        let newCard = pick(CARD_DATA.filter(c => c.rarity !== 'basic'));
        gs.addCard(newCard);
        this.resultText = `获得了卡牌：${newCard.name}！`;
        break;
      case 'heal':
        gs.heal(choice.healAmt || 30);
        this.resultText = `回复了${choice.healAmt}HP！`;
        audio.playSFX('heal');
        break;
      case 'max_hp':
        gs.takeDamage(choice.hpCost || 5);
        gs.maxHp += (choice.maxHpGain || 2);
        gs.heal(choice.maxHpGain || 2);
        this.resultText = `失去${choice.hpCost}HP，最大HP+${choice.maxHpGain}！`;
        break;
      case 'gain_burn_card':
        let burnCards = CARD_DATA.filter(c => c.keywords && c.keywords.includes('异常') && c.statusType === 'burn');
        gs.addCard(burnCards.length > 0 ? pick(burnCards) : pick(CARD_DATA.filter(c => c.rarity !== 'basic')));
        this.resultText = '获得了一张火焰卡牌！';
        break;
      case 'none':
      default:
        this.resultText = '你选择了离开...';
        break;
    }
  }
}
