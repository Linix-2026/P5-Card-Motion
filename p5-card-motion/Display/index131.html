}

// ==================== 宝藏场景 ====================
class TreasureScene extends Scene {
  enter() {
    super.enter();
    audio.playShopBGM();
    this.relics = this.generateRelics();
    this.hoveredIdx = -1;
    this.selected = false;
  }
  generateRelics() {
    let pool = [...RELIC_DATA];
    let relics = [];
    for (let i = 0; i < 3; i++) {
      let r = pick(pool);
      if (!relics.find(x => x.id === r.id)) relics.push({...r});
    }
    return relics;
  }
  update() {
    super.update();
    if (this.selected) return;
    this.hoveredIdx = -1;
    for (let i = 0; i < this.relics.length; i++) {
      let rx = GAME_W/2 + (i - 1) * 180;
      let ry = GAME_H/2 - 20;
      if (mouseX > rx - 70 && mouseX < rx + 70 && mouseY > ry - 60 && mouseY < ry + 60) {
        this.hoveredIdx = i;
      }
    }
  }
  draw() {
    background(COLORS.bg);
    fill(COLORS.goldBright);
    textAlign(CENTER, CENTER);
    textSize(28);
    textStyle(BOLD);
    text('★ 宝 藏 房 ★', GAME_W/2, 60);
    fill(COLORS.text);
    textSize(14);
    text('选择一个遗物', GAME_W/2, 100);
    for (let i = 0; i < this.relics.length; i++) {
      let relic = this.relics[i];
      let rx = GAME_W/2 + (i - 1) * 180;
      let ry = GAME_H/2 - 20;
      let hovered = this.hoveredIdx === i;
      fill(COLORS.panel);
      stroke(hovered ? COLORS.goldBright : COLORS.goldDim);
      strokeWeight(hovered ? 2.5 : 1);
      rect(rx - 70, ry - 60, 140, 120, 10);
      fill(COLORS.gold);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(30);
      text(relic.icon, rx, ry - 20);
      fill(COLORS.text);
      textSize(12);
      textStyle(BOLD);
      text(relic.name, rx, ry + 10);
      fill(COLORS.textDim);
      textSize(9);
      textStyle(NORMAL);
      drawCenteredText(relic.desc, rx, ry + 30, 120, 30, 10);
      if (hovered) {
        noFill();
        stroke(COLORS.goldBright);
        strokeWeight(2);
        rect(rx - 70, ry - 60, 140, 120, 10);
      }
    }
    super.draw();
  }
  mousePressed() {
    if (this.selected) return;
    if (this.hoveredIdx >= 0) {
      let relic = this.relics[this.hoveredIdx];
      gs.addRelic(relic);
      this.selected = true;
      audio.playSFX('gold');
      floatingTexts.add(GAME_W/2, GAME_H/2, `获得遗物: ${relic.name}`, COLORS.goldBright, 20);
      setTimeout(() => { gs.scene = 'map'; }, 1000);
    }
  }
}

// ==================== 删牌场景 ====================
class RemoveCardScene extends Scene {
  enter() {
    super.enter();
    this.hoveredIdx = -1;
  }
  update() {
    super.update();
    this.hoveredIdx = -1;
    for (let i = 0; i < gs.deck.length; i++) {
      let col = i % 5;
      let row = Math.floor(i / 5);
      let cx = 150 + col * 160;
      let cy = 120 + row * 150;
      if (mouseX > cx - CARD_W/2 && mouseX < cx + CARD_W/2 && mouseY > cy - CARD_H/2 && mouseY < cy + CARD_H/2) {
        this.hoveredIdx = i;
      }
    }
  }
  draw() {
    background(COLORS.bg);
    fill(COLORS.red);
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    text('选择要移除的卡牌', GAME_W/2, 40);
    for (let i = 0; i < gs.deck.length; i++) {
      let card = gs.deck[i];
      let col = i % 5;
      let row = Math.floor(i / 5);
      let cx = 150 + col * 160;
      let cy = 120 + row * 150;
      let hovered = this.hoveredIdx === i;
      push();
      translate(cx, cy);
      if (hovered) scale(1.08);
      let cardColor = card.color || COLORS.gold;
      let bgC = color(cardColor);
      fill(0, 60);
      noStroke();
      rect(-CARD_W/2+3, -CARD_H/2+3, CARD_W, CARD_H, 10);
      fill(red(bgC)*0.15, green(bgC)*0.15, blue(bgC)*0.15);
      stroke(hovered ? COLORS.red : cardColor);
      strokeWeight(hovered ? 2.5 : 1.5);
      rect(-CARD_W/2, -CARD_H/2, CARD_W, CARD_H, 10);
      fill(cardColor);
      noStroke();
      ellipse(-CARD_W/2+20, -CARD_H/2+20, 26, 26);
      fill(0);
      textAlign(CENTER, CENTER);
      textSize(16);
      textStyle(BOLD);
      text(card.cost, -CARD_W/2+20, -CARD_H/2+20);
      fill(cardColor);
      textSize(12);
      textStyle(BOLD);
      drawCenteredText(card.name, 0, -CARD_H/2+28, CARD_W - 20, 16, 14);
      pop();
      if (hovered) {
        cFill('red', 30);
        noStroke();
        rect(cx - CARD_W/2 - 5, cy - CARD_H/2 - 5, CARD_W + 10, CARD_H + 10, 12);
      }
    }
    super.draw();
  }
  mousePressed() {
    if (this.hoveredIdx >= 0) {
      let card = gs.deck[this.hoveredIdx];
      gs.removeCardByUid(card.uid);
      audio.playSFX('card_play');
      gs.scene = 'map';
    }
  }
}

// ==================== 胜利/失败场景 ====================
class VictoryScene extends Scene {
  enter() {
    super.enter();
    audio.playMapBGM();
    this.time = 0;
  }
  update() { super.update(); this.time++; }
  draw() {
    background(COLORS.bg);
    let t = this.time;
    // 光晕
    for (let i = 5; i >= 0; i--) {
      cFill('gold', 10 + i * 3);
      textAlign(CENTER, CENTER);
      textSize(50 + i * 8);
      textStyle(BOLD);
      text('深 渊 已 被 征 服', GAME_W/2, GAME_H/2 + Math.sin(t*0.03 + i)*5);
    }
    fill(COLORS.goldBright);
    textSize(48);
    text('深 渊 已 被 征 服', GAME_W/2, GAME_H/2);
    fill(COLORS.text);
    textSize(16);
    text('点击任意位置重新开始', GAME_W/2, GAME_H*0.65);
    super.draw();
  }
  mousePressed() { gs.reset(); gs.scene = 'title'; }
}

class DefeatScene extends Scene {
  enter() { super.enter(); audio.stopBGM(); }
  update() { super.update(); }
  draw() {
    background(COLORS.bg);
    cFill('red', 100 + Math.sin(frameCount*0.05)*30);
    textAlign(CENTER, CENTER);
    textSize(48);
    textStyle(BOLD);
    text('坠 入 深 渊', GAME_W/2, GAME_H/2);
    fill(COLORS.textDim);
    textSize(16);
    text('点击任意位置重新开始', GAME_W/2, GAME_H*0.65);
    super.draw();
  }
  mousePressed() { gs.reset(); gs.scene = 'title'; }
}

// ==================== p5.js 主程序 ====================
let currentScene = null;
let scenes = {};

function setup() {
  let canvas = createCanvas(GAME_W, GAME_H);
  canvas.parent(document.body);
  // 确保中文字体可用
  textFont('Arial');
  // 初始化全局实例
  gs = new GameState();
  events = new EventBus();
  audio = new AudioManager();
  particles = new ParticleSystem();
  floatingTexts = new FloatingTextManager();
  screenShake = new ScreenShake();
  // 创建场景
  scenes = {
    title: new TitleScene(),
    map: new MapScene(),
    battle: new BattleScene(),
    shop: new ShopScene(),
    event: new EventScene(),
    rest: new RestScene(),
    treasure: new TreasureScene(),
    remove_card: new RemoveCardScene(),
    victory: new VictoryScene(),
    defeat: new DefeatScene(),
  };
  currentScene = scenes[gs.scene];
  currentScene.enter();
}

// ==================== 独立卡牌绘制函数（供所有场景共用） ====================
function drawCardVisual(card, cx, cy, cardScale) {
  push();
  translate(cx, cy);
  scale(cardScale || 1);
  let c = card.cost;
  let cs = gs.combatState;
  if (cs && card.keywords && card.keywords.includes('先攻') && cs.cardsPlayedThisTurn && cs.cardsPlayedThisTurn.length === 0) c = Math.max(0, c - 1);
  if (gs.hasRelic && gs.hasRelic('first_strike_charm') && cs && cs.cardsPlayedThisTurn && cs.cardsPlayedThisTurn.length === 0) c = Math.max(0, c - 1);
  // 阴影
  fill(0, 60);
  noStroke();
  rect(-CARD_W / 2 + 3, -CARD_H / 2 + 3, CARD_W, CARD_H, 10);
  // 卡牌主体
  let cardColor = card.color || COLORS.gold;
  let bgC = color(cardColor);
  fill(red(bgC) * 0.15, green(bgC) * 0.15, blue(bgC) * 0.15);
  stroke(cardColor);
  strokeWeight(1.5);
  rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
  // 内边框
  stroke(cardColor);
  strokeWeight(0.5);
  noFill();
  rect(-CARD_W / 2 + 6, -CARD_H / 2 + 6, CARD_W - 12, CARD_H - 12, 6);
  // 装饰角
  fill(cardColor);
  noStroke();
  let cornerSize = 8;
  [-1, 1].forEach(sx => {
    [-1, 1].forEach(sy => {
      ellipse(sx * (CARD_W / 2 - 10), sy * (CARD_H / 2 - 10), cornerSize, cornerSize);
    });
  });
  // 费用
  fill(cardColor);
  noStroke();
  ellipse(-CARD_W / 2 + 20, -CARD_H / 2 + 20, 26, 26);
  fill(0);
  textAlign(CENTER, CENTER);
  textSize(16);
  textStyle(BOLD);
  text(c, -CARD_W / 2 + 20, -CARD_H / 2 + 20);
  // 升级标记
  if (card.upgraded) {
    fill(COLORS.goldBright);
    textSize(10);
    text('+', -CARD_W / 2 + 20, -CARD_H / 2 + 40);
  }
  // 卡牌名称
  fill(cardColor);
  textSize(12);
  textStyle(BOLD);
  let nameMaxW = CARD_W - 20;
  let nameH = 16;
  drawCenteredText(card.name, 0, -CARD_H / 2 + 28, nameMaxW, nameH, 14);
  // 类型
  fill(cardColor);
  textSize(9);
  let typeText = card.type === 'attack' ? '攻击' : (card.type === 'skill' ? '技能' : '能力');
  textAlign(CENTER, TOP);
  text(typeText, 0, -CARD_H / 2 + 28 + nameH + 2);
  // 分隔线
  stroke(cardColor);
  strokeWeight(0.5);
  let sepY = -CARD_H / 2 + 28 + nameH + 18;
  line(-CARD_W / 2 + 15, sepY, CARD_W / 2 - 15, sepY);
  // 描述
  let desc = (card.desc || '').replace('{dmg}', card.baseDmg || 0).replace('{block}', card.baseBlock || 0);
  if (card.comboBonus) desc = desc.replace('{combo_bonus}', card.comboBonus);
  if (card.comboBlock) desc = desc.replace('{combo_block}', card.comboBlock);
  if (card.comboScale) desc = desc.replace('{combo_scale}', card.comboScale);
  if (card.statusAmt) desc = desc.replace('{burn}', card.statusAmt).replace('{freeze}', card.statusAmt).replace('{corrode}', card.statusAmt).replace('{poison}', card.statusAmt);
  fill(COLORS.text);
  textSize(9);
  textStyle(NORMAL);
  let hasKw = card.keywords && card.keywords.length > 0;
  let descMaxH = hasKw ? (CARD_H / 2 - 30) - (sepY + 8) : (CARD_H / 2 - 12) - (sepY + 8);
  descMaxH = Math.max(20, descMaxH);
  drawCenteredText(desc, 0, sepY + 8, CARD_W - 20, descMaxH, 11);
  // 特性标签
  if (hasKw) {
    let ky = CARD_H / 2 - 30;
    card.keywords.forEach(kw => {
      let kwColor = { '先攻': COLORS.gold, '连击': COLORS.combo, '猛击': COLORS.red, '震慑': COLORS.purple, '异常': COLORS.green, '流转': COLORS.greenBright }[kw] || COLORS.textDim;
      fill(kwColor);
      textSize(8);
      textStyle(BOLD);
      text(kw, 0, ky);
      ky += 12;
    });
  }
  // 伪3D光泽
  fill(255, 8);
  noStroke();
  rect(-CARD_W / 2 + 8, -CARD_H / 2 + 8, CARD_W - 16, CARD_H * 0.35, 6);
  pop();
}

// ==================== 遗物视觉绘制（怪诞艺术风格） ====================
function drawRelicVisual(relic, cx, cy, size) {
  push();
  translate(cx, cy);
  let s = size || 50;
  // 安全检查
  if (!relic || !relic.id) {
    // 默认绘制
    noStroke();
    fill(50, 50, 70);
    ellipse(0, -s*0.1, s*0.6, s*0.6);
    fill(200, 180, 100);
    textAlign(CENTER, CENTER);
    textSize(s * 0.3);
    text('?', 0, -s*0.05);
    pop();
    return;
  }
  let id = relic.id;
  // 遗物底座（使用辅助函数确保颜色一致性）
  noStroke();
  cFill('panel');
  ellipse(0, s * 0.3, s * 1.2, s * 0.35);
  cStroke('goldDim');
  strokeWeight(1);
  noFill();
  ellipse(0, s * 0.3, s * 1.2, s * 0.35);
  noStroke();
  // 根据遗物ID绘制独特视觉
  switch (id) {
    case 'blood_ruby': {
      // 血玉髓 - 深红宝石带脉动血管
      fill(139, 20, 30);
      noStroke();
      ellipse(0, -s*0.1, s*0.7, s*0.85);
      fill(180, 30, 40);
      ellipse(0, -s*0.1, s*0.5, s*0.65);
      fill(220, 60, 70);
      ellipse(-s*0.1, -s*0.2, s*0.25, s*0.3);
      // 血管
      stroke(80, 10, 20);
      strokeWeight(1.5);
      noFill();
      bezier(-s*0.3, -s*0.1, -s*0.1, -s*0.4, s*0.1, -s*0.3, s*0.3, -s*0.1);
      bezier(-s*0.2, s*0.1, 0, s*0.05, s*0.15, s*0.2, s*0.25, s*0.15);
      noStroke();
      break;
    }
    case 'ap_tome': {
      // AP水晶 - 发光晶体
      let pulse = sin(frameCount * 0.08) * 0.15 + 0.85;
      fill(100, 200, 255, 60 * pulse);
      noStroke();
      ellipse(0, -s*0.1, s*1.1*pulse, s*1.2*pulse);
      fill(140, 220, 255);
      stroke(200, 240, 255);
      strokeWeight(1);
      // 六边形晶体
      beginShape();
      for (let i = 0; i < 6; i++) {
        let ang = i * PI / 3 - PI / 2;
        vertex(cos(ang) * s * 0.4, sin(ang) * s * 0.5 - s * 0.1);
      }
      endShape(CLOSE);
      noStroke();
      fill(220, 250, 255);
      ellipse(-s*0.08, -s*0.15, s*0.15, s*0.2);
      noStroke();
      break;
    }
    case 'first_strike_charm': {
      // 先攻之印 - 新月印记
      fill(20, 20, 40);
      noStroke();
      ellipse(0, -s*0.1, s*0.8, s*0.85);
      fill(50, 50, 80);
      arc(0, -s*0.1, s*0.7, s*0.7, PI * 0.2, PI * 1.8);
      fill(255, 220, 100);
      ellipse(-s*0.12, -s*0.2, s*0.45, s*0.45);
      fill(120, 100, 40);
      ellipse(-s*0.12, -s*0.2, s*0.3, s*0.3);
      fill(255, 240, 150);
      ellipse(-s*0.15, -s*0.25, s*0.12, s*0.15);
      noStroke();
      break;
    }
    case 'combo_engine': {
      // 连击引擎 - 齿轮组
      fill(60, 60, 80);
      noStroke();
      ellipse(0, -s*0.1, s*0.9, s*0.9);
      fill(100, 100, 130);
      ellipse(0, -s*0.1, s*0.7, s*0.7);
      // 齿轮齿
      fill(80, 80, 110);
      for (let i = 0; i < 8; i++) {
        let cang = i * PI / 4 + frameCount * 0.02;
        ellipse(cos(cang) * s * 0.45, sin(cang) * s * 0.45 - s*0.1, s*0.12, s*0.12);
      }
      fill(40, 40, 60);
      ellipse(0, -s*0.1, s*0.25, s*0.25);
      // 小齿轮
      fill(120, 100, 60);
      ellipse(s*0.35, -s*0.4, s*0.3, s*0.3);
      fill(200, 170, 80);
      ellipse(s*0.35, -s*0.4, s*0.15, s*0.15);
      noStroke();
      break;
    }
    case 'void_mask': {
      // 虚空面具 - 黑色面具空心眼
      fill(15, 10, 25);
      noStroke();
      ellipse(0, -s*0.1, s*0.85, s*0.95);
      fill(30, 20, 45);
      ellipse(0, -s*0.15, s*0.7, s*0.8);
      // 眼窝 - 发光
      let glow = sin(frameCount * 0.1) * 0.3 + 0.7;
      fill(100, 50, 200, glow * 255);
      ellipse(-s*0.18, -s*0.2, s*0.2, s*0.15);
      ellipse(s*0.18, -s*0.2, s*0.2, s*0.15);
      // 嘴
      fill(10, 5, 20);
      rect(-s*0.12, s*0.05, s*0.24, s*0.08, 2);
      // 条纹
      stroke(60, 40, 80);
      strokeWeight(1);
      line(-s*0.35, -s*0.3, -s*0.25, -s*0.4);
      line(s*0.35, -s*0.3, s*0.25, -s*0.4);
      noStroke();
      break;
    }
    case 'golden_scales': {
      // 黄金天平
      stroke(180, 140, 30);
      strokeWeight(2);
      noFill();
      line(0, -s*0.45, 0, s*0.2);
      line(-s*0.35, -s*0.2, s*0.35, -s*0.2);
      // 左右盘
      fill(200, 160, 40);
      noStroke();
      ellipse(-s*0.35, -s*0.05, s*0.3, s*0.1);
      ellipse(s*0.35, -s*0.35, s*0.3, s*0.1);
      // 支柱
      fill(150, 110, 20);
      rect(-s*0.08, s*0.05, s*0.16, s*0.2);
      // 装饰球
      fill(220, 180, 60);
      ellipse(0, -s*0.5, s*0.1, s*0.1);
      noStroke();
      break;
    }
    case 'flow_catalyst': {
      // 流转催化剂 - 漩涡
      let ang = frameCount * 0.05;
      noStroke();
      for (let i = 0; i < 3; i++) {
        let r = s * 0.35 - i * s * 0.1;
        for (let j = 0; j < 6; j++) {
          let fa = ang + j * PI / 3 + i * 0.5;
          let hueOffset = (i * 80 + frameCount * 2) % 360;
          let flowR = 100 + (hueOffset % 120);
          let flowG = 150 + ((hueOffset + 60) % 80);
          let flowB = 200;
          fill(flowR, flowG, flowB, 200);
          ellipse(cos(fa) * r, sin(fa) * r - s*0.1, s*0.1, s*0.1);
        }
      }
      fill(255, 255, 255, 200);
      ellipse(0, -s*0.1, s*0.15, s*0.15);
      noStroke();
      break;
    }
    case 'smash_hammer': {
      // 粉碎之锤
      // 锤头
      fill(80, 70, 60);
      noStroke();
      rect(-s*0.35, -s*0.45, s*0.7, s*0.35, 4);
      fill(120, 110, 90);
      rect(-s*0.3, -s*0.4, s*0.6, s*0.15, 3);
      // 裂纹
      stroke(40, 30, 20);
      strokeWeight(1.5);
      line(-s*0.2, -s*0.35, -s*0.1, -s*0.2);
      line(-s*0.1, -s*0.3, 0, -s*0.25);
      noStroke();
      // 锤柄
      fill(100, 60, 30);
      noStroke();
      rect(-s*0.05, -s*0.1, s*0.1, s*0.5);
      fill(130, 80, 40);
      rect(-s*0.03, -s*0.1, s*0.06, s*0.5);
      noStroke();
      break;
    }
    case 'philosopher_stone': {
      // 贤者之石 - 发光石
      let pulse2 = sin(frameCount * 0.06) * 0.2 + 0.8;
      // 光环
      for (let r = 3; r > 0; r--) {
        fill(255, 200, 100, 20 * r * pulse2);
        noStroke();
        ellipse(0, -s*0.1, s * r * 0.3 * pulse2, s * r * 0.3 * pulse2);
      }
      // 主体
      fill(255, 220, 150);
      noStroke();
      ellipse(0, -s*0.1, s*0.5, s*0.6);
      fill(255, 255, 200);
      ellipse(-s*0.08, -s*0.2, s*0.2, s*0.25);
      // 符文
      stroke(150, 80, 30);
      strokeWeight(1);
      noFill();
      textAlign(CENTER, CENTER);
      textSize(s * 0.25);
      text('✦', 0, -s*0.1);
      noStroke();
      break;
    }
    case 'serpent_ring': {
      // 衔尾蛇之戒
      // 戒指
      fill(180, 140, 60);
      noStroke();
      ellipse(0, -s*0.1, s*0.7, s*0.7);
      fill(30, 25, 20);
      ellipse(0, -s*0.1, s*0.45, s*0.45);
      // 蛇身
      stroke(60, 100, 50);
      strokeWeight(4);
      noFill();
      let t = frameCount * 0.02;
      for (let i = 0; i < 20; i++) {
        let sa = (i / 20) * TWO_PI + t;
        let r1 = s * 0.28 + sin(i * 0.8 + t) * s * 0.05;
        let r2 = s * 0.38 + sin(i * 0.8 + t + 1) * s * 0.05;
        let x1 = cos(sa) * r1, y1 = sin(sa) * r1 - s*0.1;
        let x2 = cos(sa) * r2, y2 = sin(sa) * r2 - s*0.1;
        point(x1, y1);
        point(x2, y2);
      }
      noStroke();
      // 蛇眼
      fill(200, 50, 50);
      let headA = t;
      ellipse(cos(headA) * s * 0.35, sin(headA) * s * 0.35 - s*0.1, s*0.06, s*0.06);
      noStroke();
      break;
    }
    case 'cursed_dice': {
      // 诅咒骰子
      let dicePulse = sin(frameCount * 0.05) * 0.1 + 1;
      // 顶面
      fill(150, 80, 180);
      noStroke();
      quad(-s*0.25*dicePulse, -s*0.35*dicePulse, s*0.25*dicePulse, -s*0.35*dicePulse,
           s*0.35*dicePulse, -s*0.25*dicePulse, -s*0.35*dicePulse, -s*0.25*dicePulse);
      // 正面
      fill(120, 60, 150);
      rect(-s*0.25, -s*0.25, s*0.5, s*0.5);
      // 右侧面
      fill(90, 50, 120);
      quad(s*0.25, -s*0.25, s*0.35*dicePulse, -s*0.35*dicePulse,
           s*0.35*dicePulse, s*0.25*dicePulse, s*0.25, s*0.25);
      // 点数
      fill(255, 200, 50);
      noStroke();
      ellipse(0, -s*0.1, s*0.06, s*0.06);
      ellipse(-s*0.12, -s*0.15, s*0.05, s*0.05);
      ellipse(s*0.12, -s*0.15, s*0.05, s*0.05);
      ellipse(-s*0.12, s*0.05, s*0.05, s*0.05);
      ellipse(s*0.12, s*0.05, s*0.05, s*0.05);
      ellipse(0, s*0.15, s*0.06, s*0.06);
      noStroke();
      break;
    }
    default: {
      // 默认：神秘符文
      fill(50, 50, 70);
      noStroke();
      ellipse(0, -s*0.1, s*0.6, s*0.6);
      fill(200, 180, 100);
      textAlign(CENTER, CENTER);
      textSize(s * 0.3);
      text(relic.icon || '?', 0, -s*0.05);
      noStroke();
      break;
    }
  }
  // 稀有度光环（使用RGB直接绘制，避免color()函数开销）
  let rarityRGB = COLORS_RGB[{ common: 'textDim', uncommon: 'blueBright', rare: 'gold' }[relic.rarity] || 'goldDim'];
  if (rarityRGB) {
    noStroke();
    fill(rarityRGB.r, rarityRGB.g, rarityRGB.b, 100);
  } else {
    noStroke();
    fill(120, 100, 60, 100);
  }
  ellipse(0, s * 0.3, s * 1.25, s * 0.4);
  pop();
}

// ==================== 牌库查看面板 ====================
function drawDeckViewer() {
  // 半透明遮罩
  fill(0, 200);
  noStroke();
  rect(0, 0, GAME_W, GAME_H);
  // 面板
  let px = 40, py = 30, pw = GAME_W - 80, ph = GAME_H - 60;
  noStroke();
  fill(COLORS.bgLight);
  rect(px, py, pw, ph, 12);
  // 面板边框
  stroke(COLORS.goldDim);
  strokeWeight(2);
  noFill();
  rect(px, py, pw, ph, 12);
  noStroke();
  // 标题
  fill(COLORS.gold);
  textAlign(CENTER, CENTER);
  textSize(22);
  textStyle(BOLD);
  text('📜 深渊手稿', GAME_W / 2, py + 32);

  // 标签页
  let tabY = py + 55;
  let tabH = 28;
  let deckTabW = 100;
  let relicTabW = 100;
  let gap = 8;
  let totalW = deckTabW + relicTabW + gap;
  let tabX = px + (pw - totalW) / 2;
  // 牌库标签
  let deckActive = gs.viewerTab === 'deck';
  noStroke();
  fill(deckActive ? COLORS.gold : COLORS.panel);
  rect(tabX, tabY, deckTabW, tabH, 6);
  stroke(deckActive ? COLORS.goldBright : COLORS.panelEdge);
  strokeWeight(1.5);
  noFill();
  rect(tabX, tabY, deckTabW, tabH, 6);
  noStroke();
  fill(deckActive ? COLORS.bgLight : COLORS.textDim);
  textAlign(CENTER, CENTER);
  textSize(13);
  textStyle(BOLD);
  text('📦 牌库', tabX + deckTabW / 2, tabY + tabH / 2);
  // 遗物标签
  let relicActive = gs.viewerTab === 'relics';
  let relicTabX = tabX + deckTabW + gap;
  noStroke();
  fill(relicActive ? COLORS.gold : COLORS.panel);
  rect(relicTabX, tabY, relicTabW, tabH, 6);
  stroke(relicActive ? COLORS.goldBright : COLORS.panelEdge);
  strokeWeight(1.5);
  noFill();
  rect(relicTabX, tabY, relicTabW, tabH, 6);
  noStroke();
  fill(relicActive ? COLORS.bgLight : COLORS.textDim);
  textAlign(CENTER, CENTER);
  textSize(13);
  textStyle(BOLD);
  let relicCount = gs.relics.length;
  text(`🏺 遗物 (${relicCount})`, relicTabX + relicTabW / 2, tabY + tabH / 2);

  // 保存标签位置供点击检测
  gs._viewerTabs = {
    deck: { x: tabX, y: tabY, w: deckTabW, h: tabH },
    relics: { x: relicTabX, y: tabY, w: relicTabW, h: tabH }
  };

  // 关闭提示 - 确保无描边
  noStroke();
  fill(COLORS.textDim);
  textSize(13);
  textStyle(NORMAL);
  textAlign(CENTER, CENTER);
  text('按 Tab 或 ESC 关闭', GAME_W / 2, py + ph - 15);
  // 关闭按钮
  let cbx = px + pw - 35, cby = py + 15, cbw = 20, cbh = 20;
  noStroke();
  fill(COLORS.red);
  rect(cbx, cby, cbw, cbh, 4);
  fill(COLORS.white);
  textAlign(CENTER, CENTER);
  textSize(14);
  textStyle(BOLD);
  text('×', cbx + cbw / 2, cby + cbh / 2 + 1);

  let contentY = tabY + tabH + 8;
  let contentH = ph - (contentY - py) - 30;

  if (gs.viewerTab === 'relics') {
    // ============ 遗物面板 ============
    if (gs.relics.length === 0) {
      noStroke();
      fill(COLORS.textDim);
      textAlign(CENTER, CENTER);
      textSize(14);
      textStyle(NORMAL);
      text('尚未获得任何遗物', GAME_W / 2, contentY + contentH / 2);
      textSize(11);
      text('在探索深渊的过程中，你将发现神秘遗物...', GAME_W / 2, contentY + contentH / 2 + 25);
    } else {
      // 遗物网格 - 更大尺寸，更大立绘
      let cols = 3;
      let cardGap = 12;
      let relicW = (pw - 40 - cardGap * (cols - 1)) / cols;
      let relicH = 200; // 更高的遗物卡片
      let hoveredRelic = -1;
      let relicCards = [];
      gs.relics.forEach((relic, i) => {
        let col = i % cols;
        let row = Math.floor(i / cols);
        let rx = px + 20 + col * (relicW + cardGap);
        let ry = contentY + row * (relicH + cardGap);
        if (ry + relicH > contentY + contentH) return;
        // 检测hover
        if (mouseX > rx && mouseX < rx + relicW && mouseY > ry && mouseY < ry + relicH) {
          hoveredRelic = i;
        }
        relicCards.push({ relic, rx, ry, col, row, index: i });
      });

      // 第一遍：绘制所有遗物卡片
      relicCards.forEach(rc => {
        drawRelicCard(rc.relic, rc.rx, rc.ry, relicW, relicH, rc.index === hoveredRelic);
      });
    }
  } else {
    // ============ 牌库面板 ============
    let isBattle = gs.scene === 'battle' && gs.combatState;

    if (isBattle) {
      // 战斗中：四个牌堆分区
      let cs = gs.combatState;
      let sections = [
        { title: `🃏 抽牌堆 (${cs.drawPile.length})`, cards: cs.drawPile, c: COLORS.blueBright },
        { title: `✋ 手牌 (${cs.hand.length})`, cards: cs.hand, c: COLORS.gold },
        { title: `♻ 弃牌堆 (${cs.discardPile.length})`, cards: cs.discardPile, c: COLORS.textDim },
        { title: `🔥 消耗堆 (${cs.exhaustPile.length})`, cards: cs.exhaustPile, c: COLORS.red },
      ];
      let secH = (contentH - 20) / 4;
      let cardScale = 0.5;
      let cardW = CARD_W * cardScale;
      let cardH = CARD_H * cardScale;
      for (let s = 0; s < sections.length; s++) {
        let sec = sections[s];
        let sy = contentY + s * secH;
        // 区域背景
        noStroke();
        fill(COLORS.panel);
        rect(px + 15, sy, pw - 30, secH - 8, 6);
        // 区域边框
        stroke(COLORS.panelEdge);
        strokeWeight(1);
        noFill();
        rect(px + 15, sy, pw - 30, secH - 8, 6);
        noStroke();
        // 区域标题
        fill(sec.c);
        textAlign(LEFT, TOP);
        textSize(13);
        textStyle(BOLD);
        text(sec.title, px + 25, sy + 6);
        // 卡牌列表
        textStyle(NORMAL);
        textSize(9);
        let sx = px + 25, sY = sy + 18;
        sec.cards.forEach((card) => {
          if (sx + cardW > px + pw - 20) { sx = px + 25; sY += cardH + 4; }
          push();
          translate(sx + cardW / 2, sY + cardH / 2);
          scale(cardScale);
          drawCardVisual(card, 0, 0, 1);
          pop();
          sx += cardW + 3;
        });
      }
    } else {
      // 非战斗中：完整牌库
      let deck = gs.deck;
      let stats = {};
      deck.forEach(c => {
        if (!stats[c.id]) stats[c.id] = { card: c, count: 0 };
        stats[c.id].count++;
      });
      noStroke();
      fill(COLORS.text);
      textAlign(LEFT, TOP);
      textSize(13);
      textStyle(BOLD);
      text(`📦 当前牌库 (共 ${deck.length} 张)`, px + 25, contentY);
      textStyle(NORMAL);
      textSize(10);
      text('按类型统计展示，支持随时查阅', px + 25, contentY + 20);
      // 卡片网格
      let statY = contentY + 45;
      let sx2 = px + 25;
      let cardScale = 0.65;
      let cardW = CARD_W * cardScale;
      let cardH = CARD_H * cardScale;
      Object.values(stats).forEach(s => {
        let c = s.card;
        if (sx2 + cardW > px + pw - 20) { sx2 = px + 25; statY += cardH + 8; }
        if (statY + cardH > contentY + contentH) return;
        push();
        translate(sx2 + cardW / 2, statY + cardH / 2);
        scale(cardScale);
        drawCardVisual(c, 0, 0, 1);
        pop();
        // 数量标记
        noStroke();
        fill(COLORS.goldBright);
        textAlign(CENTER, CENTER);
        textSize(14);
        textStyle(BOLD);
        text(`×${s.count}`, sx2 + cardW - 8, statY + 14);
        sx2 += cardW + 6;
      });
    }
  }
}

// 绘制单个遗物卡片（极简安全版）
function drawRelicCard(relic, rx, ry, rw, rh, isHovered) {
  push();
  let rarityName = { common: 'textDim', uncommon: 'blueBright', rare: 'gold' }[relic.rarity] || 'goldDim';
  // 卡片背景（先画背景，再画边框，最后画内容）
  noStroke();
  cFill('panel');
  rect(rx + 5, ry, rw - 10, rh, 8);
  // 边框（hover时加粗并变色）
  cStroke(rarityName);
  strokeWeight(isHovered ? 3 : 1.5);
  noFill();
  rect(rx + 5, ry, rw - 10, rh, 8);
  noStroke();
  // hover高亮叠层
  if (isHovered) {
    noStroke();
    cFill(rarityName, 25);
    rect(rx + 5, ry, rw - 10, rh, 8);
  }
  // 遗物立绘
  let visualSize = 75;
  drawRelicVisual(relic, rx + rw / 2, ry + 65, visualSize);
  // 确保文字无描边
  noStroke();
  // 名称
  cFill(rarityName);
  textAlign(CENTER, TOP);
  textSize(16);
  textStyle(BOLD);
  text(relic.name, rx + rw / 2, ry + 128);
  // 稀有度标签
  noStroke();
  cFill(rarityName);
  textSize(11);
  textStyle(NORMAL);
  let rarityLabel = { common: '普通', uncommon: '罕见', rare: '稀有' }[relic.rarity] || '';
  text(rarityLabel, rx + rw / 2, ry + 150);
  // 描述
  noStroke();
  cFill('text');
  textSize(11);
  textStyle(NORMAL);
  drawCenteredText(relic.desc || '', rx + rw / 2, ry + 163, rw - 20, rh - 165, 13);
  pop();
}

function draw() {
  // 场景切换检测
  if (scenes[gs.scene] && scenes[gs.scene] !== currentScene) {
    currentScene = scenes[gs.scene];
    currentScene.enter();
  }
  // 更新并绘制当前场景
  if (currentScene) {
    currentScene.update();
    currentScene.draw();
  }
  // 牌库查看面板覆盖层
  if (gs.showDeckViewer) {
    drawDeckViewer();
  }
}

function mousePressed() {
  // 首次点击初始化音频（需要用户交互才能启动AudioContext）
  if (!audio.initialized) {
    audio.init();
  }
  // 牌库查看面板点击处理
  if (gs.showDeckViewer) {
    let panelX = 40, panelY = 30, panelW = GAME_W - 80, panelH = GAME_H - 60;
    let closeBtn = { x: panelX + panelW - 35, y: panelY + 15, w: 20, h: 20 };
    // 关闭按钮
    if (mouseX > closeBtn.x && mouseX < closeBtn.x + closeBtn.w &&
        mouseY > closeBtn.y && mouseY < closeBtn.y + closeBtn.h) {
      gs.showDeckViewer = false;
      return;
    }
    // 标签页点击
    if (gs._viewerTabs) {
      let tabs = gs._viewerTabs;
      if (mouseX > tabs.deck.x && mouseX < tabs.deck.x + tabs.deck.w &&
          mouseY > tabs.deck.y && mouseY < tabs.deck.y + tabs.deck.h) {
        gs.viewerTab = 'deck';
        return;
      }
      if (mouseX > tabs.relics.x && mouseX < tabs.relics.x + tabs.relics.w &&
          mouseY > tabs.relics.y && mouseY < tabs.relics.y + tabs.relics.h) {
        gs.viewerTab = 'relics';
        return;
      }
    }
    // 点击面板外关闭
    if (mouseX < panelX || mouseX > panelX + panelW ||
        mouseY < panelY || mouseY > panelY + panelH) {
      gs.showDeckViewer = false;
      return;
    }
    return;
  }
  if (currentScene) currentScene.mousePressed();
}

function keyPressed() {
  // Tab键切换牌库查看
  if (keyCode === 9 || key === 'Tab') {
    gs.showDeckViewer = !gs.showDeckViewer;
    return false;
  }
  // ESC关闭牌库
  if (keyCode === ESCAPE) {
    if (gs.showDeckViewer) {
      gs.showDeckViewer = false;
      return;
    }
  }
  if (currentScene) currentScene.keyPressed();
}

// 窗口大小调整：禁用自动缩放，保持固定画布尺寸
function windowResized() {
  // 保持画布固定大小，避免坐标系统混乱
  resizeCanvas(GAME_W, GAME_H);
}
</script>
