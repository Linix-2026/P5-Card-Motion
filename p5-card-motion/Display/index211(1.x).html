  if (card.comboScale !== undefined) desc = desc.replace('{combo_scale}', card.comboScale);
  if (card.statusAmt !== undefined) {
    let effectiveAmt = getEffectiveStatusAmt(card);
    desc = desc.replace('{burn}', effectiveAmt).replace('{freeze}', effectiveAmt).replace('{corrode}', effectiveAmt);
  }
  cFill('text');
  textSize(9);
  textStyle(NORMAL);
  let hasKw = card.keywords && card.keywords.length > 0;
  let descMaxH = hasKw ? (CARD_H / 2 - 30) - (sepY + 8) : (CARD_H / 2 - 12) - (sepY + 8);
  descMaxH = Math.max(20, descMaxH);
  drawCenteredText(desc, 0, sepY + 8, CARD_W - 20, descMaxH, 11);
  // 特性标签
  if (hasKw) {
    let ky = CARD_H / 2 - 30;
    noStroke(); // 确保关键词文本无描边
    card.keywords.forEach(kw => {
      fill(cr.r, cr.g, cr.b);
      textSize(10);
      textStyle(BOLD);
      text(kw, 0, ky);
      ky += 12;
    });
  }
  // 伪3D光泽
  fill(255, 8);
  noStroke();
  rect(-CARD_W / 2 + 8, -CARD_H / 2 + 8, CARD_W - 16, CARD_H * 0.35, 6);
  } catch (e) {
    console.error('drawCardVisual error:', e, card);
  } finally {
  pop();
  }
}

// ==================== 状态图标系统（怪诞艺术风格） ====================
// 状态类型配置表：颜色、图标符号、中文名、描述
const STATUS_ICON_CONFIG = {
  block:       { color: 'blueBright', name: '格挡', desc: '抵挡等量伤害，回合开始时清零' },
  burn:        { color: 'burn',       name: '燃烧', desc: '每回合开始受到等量伤害，衰减30%' },
  freeze:      { color: 'freeze',     name: '冻结', desc: '转化为震慑，使敌人跳过行动' },
  corrode:     { color: 'poison',     name: '腐蚀', desc: '每回合受到等量伤害；攻击时每层+0.5增伤；每回合衰减30%' },
  // poison 效果已合并到 corrode
  // poison:      { color: 'poison',     name: '中毒', desc: '每回合受到等量伤害，层数-1' },
  vulnerable:  { color: 'red',        name: '易伤', desc: '受到伤害增加50%' },
  weak:        { color: 'purple',     name: '虚弱', desc: '造成伤害减少25%' },
  stun:        { color: 'stun',       name: '震慑', desc: '跳过下次行动，每层消耗1' },
  strength:    { color: 'orangeBright', name: '力量', desc: '攻击伤害增加对应层数' },
  combo:       { color: 'combo',      name: '连击', desc: '连续打出攻击牌累积连击数' },
};
// T193：动态状态描述（基于实时层数生成解释文本；与 playCard 实际公式严格对齐）
// 灼烧：每回合 DOT = stacks；衰减 30%（保留 70%）→ 镜像 L5344-L5348
// 腐蚀：每回合 DOT = stacks；攻击增伤 = floor(stacks × 0.5)；衰减 30% → 镜像 L5092-L5100 + L5358-L5362
// 其他状态（非层数驱动）→ 保留 STATUS_ICON_CONFIG 静态 desc
function getStatusDescription(type, stacks) {
  let cfg = STATUS_ICON_CONFIG[type];
  if (!cfg) return '';
  if (!stacks || stacks <= 0) return cfg.desc;
  switch (type) {
    case 'burn':
      return `每回合开始受到 ${stacks} 点伤害，衰减30%`;
    case 'corrode': {
      let attackBonus = Math.floor(stacks * 0.5);
      return `每回合开始受到 ${stacks} 点伤害；攻击时 +${attackBonus} 增伤；衰减30%`;
    }
    default:
      return cfg.desc;
  }
}
// 绘制单个状态图标（怪诞风格 - 符文圆盘+符号+层数）
// 参数：type状态类型, x/y坐标, stacks层数, size图标尺寸, colorOverride可选颜色覆盖（T170 敌我差异化）
// 返回：{x, y, w, h} 用于tooltip命中检测
function drawStatusIcon(type, x, y, stacks, size, colorOverride) {
  if (stacks <= 0) return null;
  let cfg = STATUS_ICON_CONFIG[type];
  if (!cfg) return null;
  let s = size || 22;
  let colorKey = colorOverride || cfg.color; // T170：支持颜色覆盖（敌方传入 'redBright'）
  push();
  translate(x, y);
  // 符文圆盘背景
  noStroke();
  fill(0, 160);
  ellipse(0, 0, s, s);
  // 边缘符文环
  cStroke(colorKey, 200);
  strokeWeight(1.5);
  noFill();
  ellipse(0, 0, s, s);
  // 内部符号 - 根据类型绘制怪诞图案
  noStroke();
  cFill(colorKey);
  let sym = s * 0.5;
  switch (type) {
    case 'block': { // 盾牌
      beginShape();
      vertex(0, -sym * 0.7);
      vertex(sym * 0.6, -sym * 0.4);
      vertex(sym * 0.6, sym * 0.2);
      vertex(0, sym * 0.7);
      vertex(-sym * 0.6, sym * 0.2);
      vertex(-sym * 0.6, -sym * 0.4);
      endShape(CLOSE);
      break;
    }
    case 'burn': { // 火焰
      beginShape();
      vertex(0, -sym * 0.7);
      bezierVertex(sym * 0.5, -sym * 0.3, sym * 0.4, sym * 0.3, 0, sym * 0.6);
      bezierVertex(-sym * 0.4, sym * 0.3, -sym * 0.5, -sym * 0.3, 0, -sym * 0.7);
      endShape();
      fill(255, 220, 100, 180);
      ellipse(0, sym * 0.1, sym * 0.3, sym * 0.3);
      break;
    }
    case 'freeze': { // 雪花
      strokeWeight(2);
      cStroke(colorKey);
      // 三条直径旋转 0/60/120° 构成六臂骨架；T253 前分叉只画在每条直径的 +x 端，
      // -x 端三臂光秃，六瓣雪花只有三瓣带分叉（玩家看到的"雪花只画了一半"）。
      // 现对 -x 端补镜像分叉，六臂端点全部对称。
      for (let i = 0; i < 3; i++) {
        push();
        rotate((i / 3) * Math.PI);
        line(-sym * 0.6, 0, sym * 0.6, 0);
        // +x 端分叉
        line(sym * 0.4, 0, sym * 0.5, -sym * 0.2);
        line(sym * 0.4, 0, sym * 0.5, sym * 0.2);
        // -x 端镜像分叉（尖端朝外张开）
        line(-sym * 0.4, 0, -sym * 0.5, -sym * 0.2);
        line(-sym * 0.4, 0, -sym * 0.5, sym * 0.2);
        pop();
      }
      break;
    }
    case 'corrode': { // 毒滴/头骨
      ellipse(0, -sym * 0.1, sym * 0.7, sym * 0.8);
      fill(0, 200);
      ellipse(-sym * 0.15, -sym * 0.15, sym * 0.15, sym * 0.15);
      ellipse(sym * 0.15, -sym * 0.15, sym * 0.15, sym * 0.15);
      cFill(colorKey);
      rect(-sym * 0.2, sym * 0.15, sym * 0.4, sym * 0.15);
      break;
    }
    case 'vulnerable': { // 下行箭头+裂缝
      triangle(0, sym * 0.5, -sym * 0.5, -sym * 0.3, sym * 0.5, -sym * 0.3);
      strokeWeight(1.5);
      cStroke(colorKey);
      line(0, -sym * 0.3, 0, sym * 0.2);
      break;
    }
    case 'weak': { // 虚弱波浪
      noFill();
      cStroke(colorKey);
      strokeWeight(2);
      beginShape();
      for (let i = 0; i <= 8; i++) {
        let t = i / 8;
        vertex(-sym * 0.6 + t * sym * 1.2, Math.sin(t * Math.PI * 2) * sym * 0.3);
      }
      endShape();
      break;
    }
    case 'stun': { // 闪电
      beginShape();
      vertex(-sym * 0.1, -sym * 0.6);
      vertex(sym * 0.3, -sym * 0.1);
      vertex(0, 0);
      vertex(sym * 0.2, sym * 0.6);
      vertex(-sym * 0.3, sym * 0.1);
      vertex(0, 0);
      endShape(CLOSE);
      break;
    }
    case 'strength': { // 上行箭头
      triangle(0, -sym * 0.5, -sym * 0.5, sym * 0.3, sym * 0.5, sym * 0.3);
      rect(-sym * 0.15, sym * 0.2, sym * 0.3, sym * 0.4);
      break;
    }
    case 'combo': { // 连锁符号
      noFill();
      cStroke(colorKey);
      strokeWeight(2);
      ellipse(-sym * 0.25, 0, sym * 0.5, sym * 0.5);
      ellipse(sym * 0.25, 0, sym * 0.5, sym * 0.5);
      break;
    }
  }
  // 层数数字
  noStroke();
  fill(255);
  textAlign(CENTER, CENTER);
  textSize(s * 0.42);
  textStyle(BOLD);
  text(stacks, s*0.45, s * 0.45);
  pop();
  return { x: x - s / 2, y: y - s / 2, w: s, h: s, type, stacks, cfg, colorKey }; // T170：返回 colorKey 供 tooltip 使用
}
// 绘制状态图标行（自动横向排列+换行）
// 参数：statuses对象{x:stacks}, startX, startY, iconSize, maxPerRow
// 返回：所有已绘制图标的命中区域数组（供tooltip使用）
function drawStatusRow(statuses, startX, startY, iconSize, maxPerRow) {
  let hits = [];
  let entries = Object.entries(statuses).filter(([_, s]) => s > 0);
  let perRow = maxPerRow || 6;
  let s = iconSize || 22;
  let gap = s * 1.1;
  entries.forEach(([type, stacks], i) => {
    let row = Math.floor(i / perRow);
    let col = i % perRow;
    let x = startX + col * gap;
    let y = startY + row * gap;
    let hit = drawStatusIcon(type, x, y, stacks, s);
    if (hit) hits.push(hit);
  });
  return hits;
}
// 状态tooltip绘制
// 参数：hit命中区域对象, mx, my鼠标坐标
function drawStatusTooltip(hit, mouseXAbs, mouseYAbs) {
  if (!hit) return;
  let cfg = hit.cfg;
  let tipColor = hit.colorKey || cfg.color; // T170：优先使用 colorKey 保持与图标颜色一致
  let tx = mouseXAbs + 15;
  let ty = mouseYAbs + 15;
  let tw = 190;  // T193：加宽以容纳腐蚀的长描述（28字符 @10pt ≈ 196px，原 160-20=140 不足）
  let th = 80;   // T193：增高以容纳动态值描述的安全余量
  // T193：使用动态描述（基于实时层数）
  let desc = getStatusDescription(hit.type, hit.stacks);
  // 边界修正
  if (tx + tw > width / scaleFactor) tx = mouseXAbs - tw - 15;
  if (ty + th > height / scaleFactor) ty = mouseYAbs - th - 15;
  push();
  fill(0, 220);
  cStroke(tipColor, 180);
  strokeWeight(1.5);
  rect(tx, ty, tw, th, 6);
  noStroke();
  cFill(tipColor);
  textAlign(LEFT, TOP);
  textSize(13);
  textStyle(BOLD);
  text(cfg.name + ' ×' + hit.stacks, tx + 10, ty + 8);
  fill(200);
  textSize(10);
  textStyle(NORMAL);
  text(desc, tx + 10, ty + 26, tw - 20);
  pop();
}

// ==================== 遗物视觉绘制（怪诞艺术风格） ====================
function drawRelicVisual(relic, cx, cy, size) {
  push();
  try {
  translate(cx, cy);
  let s = size || 50;
  // 安全检查
  if (!relic || !relic.id) {
    // 默认绘制
    noStroke();
    fill(50, 50, 70);
    ellipse(0, -s*0.1, s*0.6, s*0.6);

    textSize(s * 0.3);

  }
  let id = relic.id;
  // 遗物底座（使用辅助函数确保颜色一致性）
  noStroke();
  cFill('panel');
  ellipse(0, s * 0.3, s * 1.2, s * 0.35);
  cStroke('goldDim');
  strokeWeight(1);
  noFill();
  ellipse(0, s * 0.3, s * 1.2, s * 0.35);

  // 根据遗物ID绘制独特视觉
  switch (id) {

      noStroke();
      ellipse(0, -s*0.1, s*0.7, s*0.85);
      fill(180, 30, 40);
      ellipse(0, -s*0.1, s*0.5, s*0.65);
      fill(220, 60, 70);
      ellipse(-s*0.1, -s*0.2, s*0.25, s*0.3);

      stroke(80, 10, 20);
      strokeWeight(1.5);
      noFill();
      bezier(-s*0.3, -s*0.1, -s*0.1, -s*0.4, s*0.1, -s*0.3, s*0.3, -s*0.1);
      bezier(-s*0.2, s*0.1, 0, s*0.05, s*0.15, s*0.2, s*0.25, s*0.15);
      noStroke();
      break;
    }
    case 'ap_tome': {
      // AP水晶 - 发光晶体

      noStroke();
      ellipse(0, -s*0.1, s*1.1*pulse, s*1.2*pulse);
      fill(140, 220, 255);
      stroke(200, 240, 255);
      strokeWeight(1);
      // 六边形晶体
      beginShape();
      for (let i = 0; i < 6; i++) {
        let ang = i * PI / 3 - PI / 2;
        vertex(cos(ang) * s * 0.4, sin(ang) * s * 0.5 - s * 0.1);
      }
      endShape(CLOSE);
      noStroke();
      fill(220, 250, 255);
      ellipse(-s*0.08, -s*0.15, s*0.15, s*0.2);
      noStroke();
      break;
    }
    case 'first_strike_charm': {
      // 先攻之印 - 新月印记
      fill(20, 20, 40);
      noStroke();
      ellipse(0, -s*0.1, s*0.8, s*0.85);
      fill(50, 50, 80);
      arc(0, -s*0.1, s*0.7, s*0.7, PI * 0.2, PI * 1.8);
      fill(255, 220, 100);
      ellipse(-s*0.12, -s*0.2, s*0.45, s*0.45);
      fill(120, 100, 40);
      ellipse(-s*0.12, -s*0.2, s*0.3, s*0.3);
      fill(255, 240, 150);
      ellipse(-s*0.15, -s*0.25, s*0.12, s*0.15);
      noStroke();
      break;
    }
    case 'combo_engine': {

      fill(60, 60, 80);
      noStroke();
      ellipse(0, -s*0.1, s*0.9, s*0.9);
      fill(100, 100, 130);
      ellipse(0, -s*0.1, s*0.7, s*0.7);

      fill(80, 80, 110);
      for (let i = 0; i < 8; i++) {
        let cang = i * PI / 4 + frameCount * 0.02;
        ellipse(cos(cang) * s * 0.45, sin(cang) * s * 0.45 - s*0.1, s*0.12, s*0.12);
      }
      fill(40, 40, 60);
      ellipse(0, -s*0.1, s*0.25, s*0.25);

      fill(120, 100, 60);

    }

      ellipse(0, -s*0.17, s*0.28, s*0.05);

      ellipse(0, -s * 0.1, s * 0.8, s * 0.8);
      cStroke('gold');
      strokeWeight(1);
      ellipse(0, -s * 0.1, s * 0.72, s * 0.72);
      noStroke();
      // 内部刻度（8-12条短线段沿圆周）
      cStroke('textDim');
      strokeWeight(1.2);
      for (let i = 0; i < 12; i++) {
        let mkAng = i * PI / 6;
        let rOut = s * 0.38;
        let rIn = (i % 3 === 0) ? s * 0.28 : s * 0.32;
        line(cos(mkAng) * rIn, sin(mkAng) * rIn - s * 0.1, cos(mkAng) * rOut, sin(mkAng) * rOut - s * 0.1);
      }
      noStroke();
      // 四个方位点
      cFill('gold');
      ellipse(0, -s * 0.1 - s * 0.35, s * 0.05, s * 0.05);
      ellipse(0, -s * 0.1 + s * 0.35, s * 0.05, s * 0.05);
      ellipse(-s * 0.35, -s * 0.1, s * 0.05, s * 0.05);
      ellipse(s * 0.35, -s * 0.1, s * 0.05, s * 0.05);
      // 旋转指针（三角形，金色）
      let pointerAng = frameCount * 0.02;
      push();
      translate(0, -s * 0.1);
      rotate(pointerAng);
      fill(200, 170, 80, 250);
      noStroke();
      triangle(0, -s * 0.38, -s * 0.08, s * 0.08, s * 0.08, s * 0.08);
      // 指针尾
      triangle(0, s * 0.3, -s * 0.06, s * 0.02, s * 0.06, s * 0.02);
      // 中心轴
      fill(150, 120, 50);
      ellipse(0, 0, s * 0.08, s * 0.08);
      fill(220, 190, 100);
      ellipse(0, 0, s * 0.04, s * 0.04);
      noStroke();
      pop();
      noStroke();
      break;
    }
    case 'echo_core': {
      // 同心圆波纹脉冲核心
      // 背景扩散波纹（3-4层ellipse递减alpha，半径随frameCount变化）
      let pulsePhase = (frameCount * 0.04) % 1;
      for (let wave = 3; wave >= 0; wave--) {
        let wPhase = (pulsePhase + wave * 0.25) % 1;
        let wR = s * (0.25 + wPhase * 0.55);
        let wA = (1 - wPhase) * (wave === 3 ? 150 : wave === 2 ? 100 : wave === 1 ? 60 : 30);
        noFill();
        stroke(255, 220, 150, wA);
        strokeWeight(1.5);
        ellipse(0, -s * 0.1, wR, wR);
      }
      noStroke();
      // 声波线段（4-6条向外辐射的短线段）
      let beamAng = frameCount * 0.015;
      for (let b = 0; b < 6; b++) {
        let bAng = b * PI / 3 + beamAng;
        let beamPulse = sin(frameCount * 0.06 + b) * 0.2 + 0.8;
        noFill();
        stroke(255, 230, 170, 120 * beamPulse);
        strokeWeight(2);
        let bIn = s * 0.28;
        let bOut = s * (0.38 + beamPulse * 0.1);
        line(cos(bAng) * bIn, sin(bAng) * bIn - s * 0.1, cos(bAng) * bOut, sin(bAng) * bOut - s * 0.1);
      }
      noStroke();
      // 外层同心暗环
      fill(50, 40, 30);
      ellipse(0, -s * 0.1, s * 0.58, s * 0.58);
      fill(80, 65, 50);
      ellipse(0, -s * 0.1, s * 0.46, s * 0.46);
      fill(110, 90, 65);
      ellipse(0, -s * 0.1, s * 0.35, s * 0.35);
      // 中心核心发光脉动
      let coreBreath = sin(frameCount * 0.08) * 0.15 + 0.85;
      // 核心外晕
      for (let halo = 3; halo >= 1; halo--) {
        fill(255, 220, 150, 40 * halo * coreBreath);
        ellipse(0, -s * 0.1, s * 0.18 * halo * 0.6 * coreBreath, s * 0.18 * halo * 0.6 * coreBreath);
      }
      // 核心主体
      fill(255, 220, 150, 255);
      ellipse(0, -s * 0.1, s * 0.16, s * 0.16);
      fill(255, 245, 210, 255);
      ellipse(-s * 0.04, -s * 0.14, s * 0.06, s * 0.07);
      noStroke();
      break;
    }
    case 'combo_amulet': {
      // 连击护符——暗金属菱形护符 + 环绕连击链 + 脉动能量核心
      // 整体上下浮动
      let floatY = sin(frameCount * 0.04) * s * 0.02;
      // ===== 主体：暗金属菱形护符 =====
      push();
      translate(0, floatY);
      // 外层菱形（暗金属底色）
      fill(60, 55, 50);
      noStroke();
      beginShape();
      vertex(0, -s * 0.35);
      vertex(s * 0.22, -s * 0.1);
      vertex(0, s * 0.2);
      vertex(-s * 0.22, -s * 0.1);
      endShape(CLOSE);
      // 边缘描边
      cStroke('goldDim');
      strokeWeight(1.5);
      noFill();
      beginShape();
      vertex(0, -s * 0.35);
      vertex(s * 0.22, -s * 0.1);
      vertex(0, s * 0.2);
      vertex(-s * 0.22, -s * 0.1);
      endShape(CLOSE);
      noStroke();
      // 内层菱形（亮色）
      fill(90, 85, 75);
      beginShape();
      vertex(0, -s * 0.26);
      vertex(s * 0.16, -s * 0.1);
      vertex(0, s * 0.14);
      vertex(-s * 0.16, -s * 0.1);
      endShape(CLOSE);
      // ===== 锈蚀纹理（noise 驱动不规则暗斑）=====
      for (let r = 0; r < 3; r++) {
        let rustAngle = r * 2.1 + frameCount * 0.001;
        let rustX = cos(rustAngle) * s * 0.12;
        let rustY = sin(rustAngle) * s * 0.1 - s * 0.08;
        let rustSize = s * 0.06 + noise(r * 0.5, frameCount * 0.01) * s * 0.04;
        fill(30, 25, 20, 80);
        ellipse(rustX, rustY, rustSize, rustSize * 0.7);
      }
      // ===== 符文刻印 =====
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(s * 0.18);
      cFill('gold');
      text('⚡', 0, -s * 0.08);
      // ===== 能量核心：脉动光球 =====
      let corePulse = sin(frameCount * 0.1) * 0.3 + 0.7;
      cFill('goldBright');
      ellipse(0, -s * 0.1, s * 0.1 * corePulse, s * 0.1 * corePulse);
      // 白色高光点
      fill(255, 255, 255, 200);
      ellipse(-s * 0.02, -s * 0.12, s * 0.04, s * 0.04);
      noStroke();
      pop();
      // ===== 连击链：环绕公转小菱形 =====
      for (let i = 0; i < 4; i++) {
        let chainAng = frameCount * 0.03 + i * PI / 2;
        let chainX = cos(chainAng) * s * 0.35;
        let chainY = sin(chainAng) * s * 0.3 - s * 0.08 + floatY;
        let chainPulse = sin(frameCount * 0.06 + i) * 0.2 + 0.8;
        push();
        translate(chainX, chainY);
        rotate(chainAng);
        cFill('gold', 120);
        noStroke();
        beginShape();
        vertex(0, -s * 0.06 * chainPulse);
        vertex(s * 0.04 * chainPulse, 0);
        vertex(0, s * 0.06 * chainPulse);
        vertex(-s * 0.04 * chainPulse, 0);
        endShape(CLOSE);
        pop();
      }
      noStroke();
      break;
    }
    default: {
      // 默认：神秘符文
      fill(50, 50, 70);
      noStroke();
      ellipse(0, -s*0.1, s*0.6, s*0.6);
      fill(200, 180, 100);
      textAlign(CENTER, CENTER);
      textSize(s * 0.3);
      text(relic.icon || '?', 0, -s*0.05);
      noStroke();
      break;
    }
  }
  // 稀有度光环（使用RGB直接绘制，避免color()函数开销）
  let rarityRGB = COLORS_RGB[{ common: 'textDim', uncommon: 'blueBright', rare: 'gold' }[relic.rarity] || 'goldDim'];
  if (rarityRGB) {
    noStroke();
    fill(rarityRGB.r, rarityRGB.g, rarityRGB.b, 100);
  } else {
    noStroke();
    fill(120, 100, 60, 100);
  }
  ellipse(0, s * 0.3, s * 1.25, s * 0.4);
  } finally {
    pop();
  }
}

// ==================== 牌库查看面板 ====================
// 牌库查看器图标（金色主题，参考右上角状态栏多边形 icon 风格：菱形金币/堆叠卡牌）
//   视觉一致性：与状态栏同款极简几何 + cFill(gold/goldBright/goldDim) 配色
//   代码级绘制：替代默认 emoji，跨平台/浏览器渲染一致（emoji 字体在不同系统差异极大）
//   type: 'scroll' 卷轴（标题）/ 'box' 牌库箱（牌库 tab + 当前牌库）/ 'relic' 遗物宝珠（遗物 tab）
//         'drawPile' 抽牌堆（战斗牌库）/ 'hand' 手牌（战斗牌库）/ 'discardPile' 弃牌堆（战斗牌库）/ 'exhaustPile' 消耗堆（战斗牌库）
//   size: 整体高度（px），宽度按比例
function drawDeckViewerIcon(type, cx, cy, size) {
  push();
  translate(cx, cy);
  noStroke();
  if (type === 'scroll') {
    // 羊皮纸卷轴：上下卷轴 + 中间纸面 + 文字线（高度=size，宽度=size*0.9）
    let s = size / 20;
    // 顶卷轴（金）
    cFill('gold');
    rect(-8*s, -10*s, 16*s, 4*s, 2*s);
    // 底卷轴（金）
    rect(-8*s, 6*s, 16*s, 4*s, 2*s);
    // 纸面（暗金底）
    cFill('goldDim');
    rect(-7*s, -6*s, 14*s, 12*s, 1*s);
    // 文字线（亮金高光 3 条，模拟手稿文字）
    cFill('goldBright');
    rect(-4*s, -3.5*s, 8*s, 0.8*s);
    rect(-4*s, -0.7*s, 8*s, 0.8*s);
    rect(-4*s, 2.1*s, 5*s, 0.8*s);
  } else if (type === 'box') {
    // 牌库箱：箱盖 + 箱体 + 盖缝 + 锁扣（高度=size，宽度=size*1.15）
    let s = size / 14;
    // 箱盖（亮金顶部横条）
    cFill('goldBright');
    rect(-8*s, -7*s, 16*s, 3*s, 1.5*s);
    // 箱体（中金主体）
    cFill('gold');
    rect(-7*s, -4*s, 14*s, 11*s, 1.5*s);
    // 盖缝（暗线，箱盖与箱体分界）
    cFill('goldDim');
    rect(-7*s, -4*s, 14*s, 0.6*s);
    // 锁扣（中心小方块，亮金）
    cFill('goldBright');
    rect(-1.5*s, -1.5*s, 3*s, 3*s, 0.5*s);
    // 锁扣中心点（暗金点缀）
    cFill('goldDim');
    ellipse(0, 0, 1.2*s, 1.2*s);
  } else if (type === 'relic') {
    // 遗物宝珠：顶部挂环 + 外环 + 内珠 + 中心点 + 高光（高度=size，宽度=size*0.9）
    let s = size / 16;
    // 顶部挂环（金，模拟吊坠/护身符）
    cFill('gold');
    rect(-1.5*s, -10*s, 3*s, 3.5*s, 0.8*s);
    ellipse(0, -6.5*s, 4.5*s, 3.5*s);
    // 外环（金）
    cFill('gold');
    ellipse(0, 1*s, 14*s, 13*s);
    // 内珠（亮金）
    cFill('goldBright');
    ellipse(0, 1*s, 8*s, 7.5*s);
    // 中心点（暗金，模拟宝石切面）
    cFill('gold');
    ellipse(0, 1*s, 3*s, 3*s);
    // 顶部高光（浅色圆点，模拟宝石反光）
    cFill('bgLight', 180);
    ellipse(-2.5*s, -1*s, 2*s, 2*s);
  } else if (type === 'drawPile') {
    // 抽牌堆：3 张堆叠卡牌（暗金→中金→亮金），顶层卡轻微左倾 + 顶部向上箭头（暗示"从顶部抽出"）
    let s = size / 16;
    // 底层卡（暗金，最深）
    cFill('goldDim');
    rect(-4*s, -3*s, 9*s, 10*s, 1*s);
    // 中层卡（中金，向上偏移 1px）
    cFill('gold');
    rect(-4.5*s, -4*s, 9*s, 10*s, 1*s);
    // 顶层卡（亮金，左倾 -12°，向上偏移 2px，模拟"被抽出"）
    push();
    rotate(-PI / 15);
    cFill('goldBright');
    rect(-4*s, -6*s, 9*s, 10*s, 1*s);
    // 顶层卡面中线（暗金，模拟卡背花纹）
    cFill('gold');
    rect(-2.5*s, -2*s, 5*s, 0.7*s);
    pop();
    // 顶部向上箭头（暗金三角形，暗示"抽牌方向"）
    cFill('goldDim');
    triangle(-2*s, -9*s, 2*s, -9*s, 0, -11.5*s);
  } else if (type === 'hand') {
    // 手牌：3 张扇形展开的卡牌（中金两侧 + 亮金中心），暗示"持牌/手牌堆"
    let s = size / 14;
    // 左卡（旋转 -18°，中金）
    push();
    rotate(-PI / 10);
    cFill('gold');
    rect(-2.5*s, -6*s, 5*s, 11*s, 1*s);
    pop();
    // 右卡（旋转 +18°，中金）
    push();
    rotate(PI / 10);
    cFill('gold');
    rect(-2.5*s, -6*s, 5*s, 11*s, 1*s);
    pop();
    // 中卡（直立，亮金高光）
    cFill('goldBright');
    rect(-2.5*s, -6*s, 5*s, 11*s, 1*s);
    // 中卡面圆点（暗金，模拟卡面符号）
    cFill('gold');
    ellipse(0, -0.5*s, 2*s, 2*s);
  } else if (type === 'discardPile') {
    // 弃牌堆：2 张堆叠卡牌（暗金直立底 + 中金右倾斜顶）+ 底部向下箭头（暗示"被丢弃"）
    let s = size / 16;
    // 底层卡（暗金，直立）
    cFill('goldDim');
    rect(-4*s, -3*s, 9*s, 10*s, 1*s);
    // 顶层卡（中金，右倾 +15°，向上偏移，模拟"被丢出"）
    push();
    rotate(PI / 12);
    cFill('gold');
    rect(-4*s, -6*s, 9*s, 10*s, 1*s);
    // 顶层卡面 X 划线（暗金，模拟"被划掉"）
    cFill('goldDim');
    rect(-2.5*s, -1*s, 5*s, 0.7*s);
    pop();
    // 底部向下箭头（暗金三角形，暗示"丢弃方向"）
    cFill('goldDim');
    triangle(-2*s, 8.5*s, 2*s, 8.5*s, 0, 11.5*s);
  } else if (type === 'exhaustPile') {
    // 消耗堆：底部小卡牌 + 顶部多层火焰（亮金外焰 + 中金内焰），暗示"烧毁/消耗"
    let s = size / 14;
    // 底部小卡牌（暗金，模拟"被烧的卡牌残骸"）
    cFill('goldDim');
    rect(-5*s, 4*s, 10*s, 3.5*s, 1*s);
    // 外焰（亮金大火焰，bezier 曲线模拟火焰摆动）
    cFill('goldBright');
    beginShape();
    vertex(0, -9*s);
    bezierVertex(5.5*s, -4*s, 5*s, 0, 4*s, 4*s);
    bezierVertex(2*s, 2*s, 1.5*s, 0, 0, 1*s);
    bezierVertex(-1.5*s, 0, -2*s, 2*s, -4*s, 4*s);
    bezierVertex(-5*s, 0, -5.5*s, -4*s, 0, -9*s);
    endShape(CLOSE);
    // 内焰（中金小火焰）
    cFill('gold');
    beginShape();
    vertex(0, -5*s);
    bezierVertex(3*s, -1.5*s, 2.5*s, 1*s, 2*s, 3*s);
    bezierVertex(1*s, 2*s, 0.8*s, 1*s, 0, 1.2*s);
    bezierVertex(-0.8*s, 1*s, -1*s, 2*s, -2*s, 3*s);
    bezierVertex(-2.5*s, 1*s, -3*s, -1.5*s, 0, -5*s);
    endShape(CLOSE);
  }
  pop();
}

function drawDeckViewer() {
  // 半透明遮罩
  fill(0, 200);
  noStroke();
  rect(0, 0, GAME_W, GAME_H);
  // 面板
  let px = 40, py = 30, pw = GAME_W - 80, ph = GAME_H - 60;
  noStroke();
  cFill('bgLight');
  rect(px, py, pw, ph, 12);
  // 面板边框
  cStroke('goldDim');
  strokeWeight(2);
  noFill();
  rect(px, py, pw, ph, 12);
  noStroke();
  // 标题：程序绘制的卷轴 icon + "深渊手稿"（替代原 📜 emoji）
  //   视觉：金色卷轴 + 居中文本，与右上角状态栏菱形金币/堆叠卡牌同款几何风格
  //   计算：测量文本宽度 → 组合（icon + gap + text）总宽 → 居中起点
  cFill('gold');
  textSize(22);
  textStyle(BOLD);
  textAlign(CENTER, CENTER);
  let _titleText = '深渊手稿';
  let _titleTW = textWidth(_titleText);
  let _titleIconSize = 20;
  let _titleIconGap = 8;
  let _titleTotalW = _titleIconSize + _titleIconGap + _titleTW;
  let _titleStartX = (GAME_W - _titleTotalW) / 2;
  let _titleCY = py + 32;
  noStroke();
  drawDeckViewerIcon('scroll', _titleStartX + _titleIconSize / 2, _titleCY, _titleIconSize);
  textAlign(LEFT, CENTER);
  text(_titleText, _titleStartX + _titleIconSize + _titleIconGap, _titleCY);

  // 标签页
  let tabY = py + 55;
  let tabH = 28;
  let deckTabW = 100;
  let relicTabW = 100;
  let gap = 8;
  let totalW = deckTabW + relicTabW + gap;
  let tabX = px + (pw - totalW) / 2;
  // 牌库标签
  let deckActive = gs.viewerTab === 'deck';
  noStroke();
  if (deckActive) cFill('gold'); else cFill('panel');
  rect(tabX, tabY, deckTabW, tabH, 6);
  if (deckActive) cStroke('goldBright'); else cStroke('panelEdge');
  strokeWeight(1.5);
  noFill();
  rect(tabX, tabY, deckTabW, tabH, 6);
  noStroke();
  if (deckActive) cFill('bgLight'); else cFill('textDim');
  textAlign(CENTER, CENTER);
  textSize(13);
  textStyle(BOLD);
  // 牌库标签：程序绘制的牌库箱 icon + "牌库"（替代原 📦 emoji）
  //   视觉：金色箱体 + 锁扣，与状态栏堆叠卡牌同款几何风格
  let _deckTabText = '牌库';
  let _deckTabTW = textWidth(_deckTabText);
  let _dtIconSize = 14;
  let _dtIconGap = 5;
  let _dtTotalW = _dtIconSize + _dtIconGap + _deckTabTW;
  let _dtCenterX = tabX + deckTabW / 2;
  let _dtStartX = _dtCenterX - _dtTotalW / 2;
  let _dtCY = tabY + tabH / 2;
  noStroke();
  drawDeckViewerIcon('box', _dtStartX + _dtIconSize / 2, _dtCY, _dtIconSize);
  textAlign(LEFT, CENTER);
  text(_deckTabText, _dtStartX + _dtIconSize + _dtIconGap, _dtCY);
  // 遗物标签
  let relicActive = gs.viewerTab === 'relics';
  let relicTabX = tabX + deckTabW + gap;
  noStroke();
  if (relicActive) cFill('gold'); else cFill('panel');
  rect(relicTabX, tabY, relicTabW, tabH, 6);
  if (relicActive) cStroke('goldBright'); else cStroke('panelEdge');
  strokeWeight(1.5);
  noFill();
  rect(relicTabX, tabY, relicTabW, tabH, 6);
  noStroke();
  if (relicActive) cFill('bgLight'); else cFill('textDim');
  textAlign(CENTER, CENTER);
  textSize(13);
  textStyle(BOLD);
  // 遗物标签：程序绘制的遗物宝珠 icon + "遗物 (N)"（替代原 🏺 emoji）
  //   视觉：金色宝珠 + 顶部挂环，与状态栏菱形金币同款几何风格
  let relicCount = gs.relics.length;
  let _relicTabText = `遗物 (${relicCount})`;
  let _relicTabTW = textWidth(_relicTabText);
  let _rtIconSize = 14;
  let _rtIconGap = 5;
  let _rtTotalW = _rtIconSize + _rtIconGap + _relicTabTW;
  let _rtCenterX = relicTabX + relicTabW / 2;
  let _rtStartX = _rtCenterX - _rtTotalW / 2;
  let _rtCY = tabY + tabH / 2;
  noStroke();
  drawDeckViewerIcon('relic', _rtStartX + _rtIconSize / 2, _rtCY, _rtIconSize);
  textAlign(LEFT, CENTER);
  text(_relicTabText, _rtStartX + _rtIconSize + _rtIconGap, _rtCY);

  // 保存标签位置供点击检测
  gs._viewerTabs = {
    deck: { x: tabX, y: tabY, w: deckTabW, h: tabH },
    relics: { x: relicTabX, y: tabY, w: relicTabW, h: tabH }
  };

  // 关闭提示 - 确保无描边
  noStroke();

  } else {

        push();

        rotate(_state.rotation);
        scale(_state.scale * cardScale);

      if (gs._deckMaxScroll > 0) {

      //   视觉：金色箱体 + 锁扣，与右上角状态栏堆叠卡牌同款几何风格
      let _nbTitleText = `当前牌库 (共 ${deck.length} 张)`;

          cFill('goldBright');
          textAlign(CENTER, CENTER);
          textSize(14 * markScale);
          textStyle(BOLD);
          text(`×${hc.count}`, hc.x + cardW - 8, hc.y + 14);
        }
      }
    }
  }
}

// 绘制单个遗物卡片（极简安全版）
function drawRelicCard(relic, rx, ry, rw, rh, isHovered) {
  push();
  let rarityName = { common: 'textDim', uncommon: 'blueBright', rare: 'gold' }[relic.rarity] || 'goldDim';
  // 卡片背景（先画背景，再画边框，最后画内容）
  noStroke();
  cFill('panel');
  rect(rx + 5, ry, rw - 10, rh, 8);
  // 边框（hover时加粗并变色）
  cStroke(rarityName);
  strokeWeight(isHovered ? 3 : 1.5);
  noFill();
  rect(rx + 5, ry, rw - 10, rh, 8);
  noStroke();
  // hover高亮叠层
  if (isHovered) {
    noStroke();
    cFill(rarityName, 25);
    rect(rx + 5, ry, rw - 10, rh, 8);
  }
  // 遗物立绘
  let visualSize = 75;
  drawRelicVisual(relic, rx + rw / 2, ry + 65, visualSize);
  // 确保文字无描边
  noStroke();
  // 名称
  cFill(rarityName);
  textAlign(CENTER, TOP);
  textSize(16);
  textStyle(BOLD);
  text(relic.name, rx + rw / 2, ry + 128);
  // 稀有度标签
  noStroke();
  cFill(rarityName);
  textSize(11);
  textStyle(NORMAL);
  let rarityLabel = { common: '普通', uncommon: '罕见', rare: '稀有' }[relic.rarity] || '';
  text(rarityLabel, rx + rw / 2, ry + 150);
  // 描述
  noStroke();
  cFill('text');
  textSize(11);
  textStyle(NORMAL);
  drawCenteredText(relic.desc || '', rx + rw / 2, ry + 163, rw - 20, rh - 165, 13);
  pop();
}

// ==================== 难度选择 UI（屏幕中央最上方） ====================
// 常驻顶部中央的横条，点击展开 4 档。视觉规范完全沿用标题「进入深渊」按钮：
//   panel 底 + goldDim 边框 / hover 反色 goldBright + 黑字 / 圆角 8 / 衬线 BOLD。
// 与 Bloom、音量 UI 同理，绘制与命中共用每帧权威坐标，避免 stale hover 误触发。
const difficultyUI = {
  open: false,
  anim: 0,        // 展开进度 0..1（lerp 0.18，与 Bloom/音量 UI 同速率）
  btn: null,      // 主按钮命中矩形
  rects: [],      // 4 个档位命中矩形
  panel: null,    // 面板命中矩形（点击面板空白处关闭用）
};

// 双倍蓄能上限：连打多张「双倍」时累计的触发总次数天花板（含原样那一次）。
//   ×2 + ×2 = 4 已到顶 —— 再往上叠，一张高伤牌就能一击抹掉 Boss，战斗的来回就没了。
const DOUBLE_MAX_TIMES = 4;

const DIFF_BTN_W = 176;
const DIFF_BTN_H = 30;
const DIFF_BTN_Y = 22;              // 与 drawPlayerInfo 的 PI_Y 对齐，避开顶部电影黑边
const DIFF_PANEL_W = 412;           // 需容纳「敌/你/资源」三维度速览与招牌机制整行
const DIFF_ITEM_H = 76;
const DIFF_PANEL_PAD = 8;

// 切换难度并给出即时反馈。
//   战斗中切换时本场数值不变（敌人数值已在 initCombat 生成），下一场才生效——防止中途降档作弊。
function setDifficulty(idx) {
  if (typeof gs === 'undefined' || !gs) return;
  if (idx < 0 || idx >= DIFFICULTY_DATA.length) return;
  gs.difficulty = idx;
  const d = DIFFICULTY_DATA[idx];
  const inBattle = (gs.scene === 'battle' && gs.combatState);
  floatingTexts.add(GAME_W / 2, GAME_H * 0.30, `难度 · ${d.name} ${d.roman}`, COLORS[d.color] || COLORS.gold, 20);
  // 敌人数值/资源类改动下一场战斗生效；生命上限与起始金币属开局属性，下一局生效
  if (inBattle) {
    floatingTexts.add(GAME_W / 2, GAME_H * 0.36, '战斗数值：下一场生效 · 血上限/金币：下一局生效', COLORS.textDim, 13);
  } else if (gs.scene !== 'title' && gs.scene !== 'defeat' && gs.scene !== 'victory') {
    floatingTexts.add(GAME_W / 2, GAME_H * 0.36, '血上限 / 起始金币将于下一局生效', COLORS.textDim, 13);
  }
  if (typeof saveManager !== 'undefined' && saveManager) saveManager.autoSave();
  if (typeof audio !== 'undefined' && audio && typeof audio.playSFX === 'function') audio.playSFX('card_play');
}

function drawDifficultyUI() {
  if (typeof gs === 'undefined' || !gs) return;
  // 只在标题页出现。两条理由：
  //   ① 难度是"踏入深渊之前"的选择 —— 战斗中途改档等于单方面撕毁这场挑战的承诺，
  //      哪怕是降档（防作弊的旧逻辑虽然挡住了本场数值，但挡不住心理上的廉价感）。
  //   ② 它常驻顶部中央，在战斗 HUD 上就是一条用不上还占位的噪音。
  //   切走场景时**必须**收起展开态并清空命中矩形 —— 否则残留的 rects/btn 会在别的场景
  //   继续吞点击（点击穿透到看不见的控件上，是最难查的一类 bug）。
  if (gs.scene !== 'title') {
    difficultyUI.open = false;
    difficultyUI.anim = 0;
    difficultyUI.btn = null;
    difficultyUI.rects = [];
    difficultyUI.panel = null;
    return;
  }
  const d = getDifficulty();
  difficultyUI.anim = lerp(difficultyUI.anim, difficultyUI.open ? 1 : 0, 0.18);
  const cx = GAME_W / 2;
  const bx = cx - DIFF_BTN_W / 2;
  const by = DIFF_BTN_Y;
  const m = mx(), myv = my();
  const a = difficultyUI.anim;

  // ---- 主按钮（常驻：无论展开与否都绘制并写入命中矩形，否则按钮可见却点不动）----
  const btnHit = m > bx && m < bx + DIFF_BTN_W && myv > by && myv < by + DIFF_BTN_H;
  difficultyUI.btn = { x: bx, y: by, w: DIFF_BTN_W, h: DIFF_BTN_H };
  const btnHovered = btnHit || difficultyUI.open;
  push();
  fill(0, 120); noStroke();
  rect(bx - 2, by + 2, DIFF_BTN_W + 4, DIFF_BTN_H, 8);
  // 边框取当前档主题色（绿→金→橙→红），让档位一眼可辨；悬停时统一回到高亮金
  if (btnHovered) { cFill('goldBright'); cStroke('gold'); }
  else { cFill('panel'); cStroke(d.color); }
  strokeWeight(2);
  rect(bx, by, DIFF_BTN_W, DIFF_BTN_H, 8);
  if (btnHovered) fill(0); else cFill('gold');
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(14);
  textStyle(BOLD);
  text(`难度 · ${d.name} ${d.roman}`, cx - 6, by + DIFF_BTN_H / 2 + 1);
  // 展开三角指示（open 时朝上）
  const triY = by + DIFF_BTN_H / 2;
  const triX = cx + DIFF_BTN_W / 2 - 15;
  fill(btnHovered ? 0 : 150);
  if (difficultyUI.open) triangle(triX - 5, triY + 2, triX + 5, triY + 2, triX, triY - 4);
  else triangle(triX - 5, triY - 2, triX + 5, triY - 2, triX, triY + 4);
  pop();

  // ---- 展开面板 ----
  if (a <= 0.01) { difficultyUI.rects = []; difficultyUI.panel = null; return; }
  const panelX = cx - DIFF_PANEL_W / 2;
  const panelY = by + DIFF_BTN_H + 8;
  const panelH = DIFFICULTY_DATA.length * DIFF_ITEM_H + DIFF_PANEL_PAD * 2;
  difficultyUI.panel = { x: panelX, y: panelY, w: DIFF_PANEL_W, h: panelH };
  difficultyUI.rects = [];

  push();
  translate(0, (1 - a) * -14);   // 从按钮下沿向上收拢/滑出
  // 面板底 + 边框
  cFill('bg', 238 * a);
  cStroke('goldDim', 235 * a);
  strokeWeight(2);
  rect(panelX, panelY, DIFF_PANEL_W, panelH, 8);

  for (let i = 0; i < DIFFICULTY_DATA.length; i++) {
    const it = DIFFICULTY_DATA[i];
    const iy = panelY + DIFF_PANEL_PAD + i * DIFF_ITEM_H;
    const ix = panelX + DIFF_PANEL_PAD;
    const iw = DIFF_PANEL_W - DIFF_PANEL_PAD * 2;
    const ih = DIFF_ITEM_H - 5;
    difficultyUI.rects.push({ x: ix, y: panelY + (1 - a) * -14 + DIFF_PANEL_PAD + i * DIFF_ITEM_H, w: iw, h: ih, idx: i });
    const hovered = m > ix && m < ix + iw && myv > iy && myv < iy + ih;
    const isCur = (i === gs.difficulty);
    // —— 悬停的高对比规范（修「金底金字」）——
    //   原实现：悬停底 goldDim(#7a6530) + 文字 gold(#c9a84c)，两者亮度只差约 16，
    //   字等于被埋进背景里。游戏里 hover 的既有规范是「亮金底 + 深字」
    //   （进入深渊 / 继续深渊 / 难度主按钮全都是这一套），这里沿用同一套：
    //   背景负责高亮，文字统一压到近黑 bg(#0a0a10)，对比度回到 13:1 量级。
    //   副产品：悬停时不再有"绿字压金底""橙字压金底"这类看不清的组合。
    const onLight = hovered;   // 亮底 → 该行所有文字转深色
    // 项底
    noStroke();
    if (hovered) cFill('goldBright', 235 * a);
    else if (isCur) cFill('panelEdge', 225 * a);
    else cFill('bgLight', 150 * a);
    rect(ix, iy, iw, ih, 6);
    // 边框：当前档用该档主题色（悬停时同样让位给高亮金，保持与底一致）
    noFill();
    if (hovered) { cStroke('goldBright', 255 * a); strokeWeight(2); }
    else if (isCur) { cStroke(it.color, 255 * a); strokeWeight(2); }
    else { cStroke('goldDim', 100 * a); strokeWeight(1); }
    rect(ix, iy, iw, ih, 6);
    // 罗马数字
    noStroke();
    textAlign(LEFT, CENTER);
    textSize(20); textStyle(BOLD);
    cFill(onLight ? 'bg' : (isCur ? it.color : 'textDim'), 255 * a);
    text(it.roman, ix + 13, iy + 24);
    // 中文名
    textSize(15); textStyle(BOLD);
    cFill(onLight ? 'bg' : (isCur ? 'goldBright' : 'text'), 255 * a);
    text(it.name, ix + 44, iy + 16);
    const nameW = textWidth(it.name);
    // 英文名
    textSize(9); textStyle(NORMAL);
    cFill(onLight ? 'bg' : 'textDim', (onLight ? 200 : 215) * a);
    text(it.nameEn, ix + 44 + nameW + 7, iy + 17);
    // 当前档标记
    if (isCur) {
      textAlign(RIGHT, CENTER);
      textSize(9); textStyle(BOLD);
      cFill(onLight ? 'bg' : it.color, 255 * a);
      text('● 当前', ix + iw - 12, iy + 16);
    }
    // —— 第 2 行：三维度速览（玩家视角的增减语义，见 diffStatLine）——
    //   字号 9.5：中文在 9 号下笔画糊成一团；10 号又会让最长的一档（低语）顶到右边框。
    textAlign(LEFT, CENTER);
    textSize(9.5); textStyle(BOLD);
    cFill(onLight ? 'bg' : (isCur ? 'text' : 'textDim'), (onLight ? 235 : 225) * a);
    text(diffStatLine(it), ix + 44, iy + 34);
    // —— 第 3 行：招牌机制名（档位之间的"质"差异）——
    textSize(9.5); textStyle(BOLD);
    cFill(onLight ? 'bg' : (isCur ? it.color : 'textDim'), (onLight ? 235 : 240) * a);
    text('◆ ' + it.mechanic, ix + 44, iy + 51);
    // —— 第 4 行：机制描述 ——
    //   样式：暗金 goldDim + 9.5 号 + 无描边，与游戏叙事文本同一路子（看 drawAiLine 的做法）：
    //   上一行的机制**名**是"条目"，这一行的**描述**是深渊在解释自己，
    //   所以它是暖的（金）而不是冷的（灰白）—— 灰白留给纯功能性提示。
    textAlign(LEFT, CENTER);
    textSize(9.5); textStyle(NORMAL);
    cFill(onLight ? 'bg' : 'goldDim', (onLight ? 235 : 235) * a);
    text(it.mechanicDesc, ix + 44, iy + 67);
    // 风味标语（右下角，弱化处理）
    if (isCur) {
      textAlign(RIGHT, CENTER);
      textSize(8.5); textStyle(NORMAL);
      cFill(onLight ? 'bg' : 'textDim', (onLight ? 200 : 150) * a);
      text(it.tagline, ix + iw - 12, iy + 51);
    }
  }
  pop();
}

// 音量 UI 最下沿的**当帧** y：三通道纵向堆叠 → 取最后一个通道的权威 cy + 半径。
//   ⚠️ 必须用 getVolumeChannelFrameCys() 而不是写死 428：音量控件有入场滑入动画
//   （animOffsetY 从 -200 缓动到 0），且战斗场景基准 y 会整体上移（bloomTargetY 120→75）——
//   写死的结果就是这行字在入场/切场景时和音量控件脱节，甚至飞到半空。
function volumeUIBottomY() {
  try {
    if (typeof volumeUI === 'undefined' || !volumeUI || !volumeUI.channels) return null;
    if (typeof getVolumeChannelFrameCys !== 'function') return null;
    const cys = getVolumeChannelFrameCys();
    const chs = volumeUI.channels;
    if (!cys || !cys.length || cys.length !== chs.length) return null;
    return cys[chs.length - 1].cy + chs[chs.length - 1].r;
  } catch (e) { return null; }
}

// ==================== 难度档位结果行（音量 UI 正下方） ====================
// 难度 UI 收进标题页之后，其余场景就再也没有"我现在在第几档"的常驻提示 ——
//   玩家打了一半想知道自己选的是几档，只能退出去看。这行补上这个缺口：
//   挂在音量控件正下方（与右侧 Bloom/音量同一根视觉轴），暗金小字 + 慢呼吸（如隐若现）。
//   **刻意不可点击**：它是"结果"，不是第二个入口 —— 能点的只有标题页那一处。
//   标题页自身不显示：那里顶部已有可交互的难度 UI，右下角再来一遍是信息重复。
function drawDifficultyResult() {
  if (typeof gs === 'undefined' || !gs) return;
  if (gs.scene === 'title') return;
  const d = getDifficulty();
  const cx = GAME_W - 95;                       // 与音量控件同轴
  const bottom = volumeUIBottomY();
  const topY = (bottom !== null) ? bottom + 18 : 430;
  // T239：竖排三级层级 —— 罗马数字徽章（一眼可辨）→ 难度名 → 评语（降级）。
  //   数字用 d.color（语义色 token：绿/金/橙/红）做 2 层伪3D + 极轻同色辉光；
  //   名字用 d.accent（同色系暗档）形成明暗层次；评语 goldDim 中性不染色，保留 0.028 慢呼吸。
  const breath = 0.30 + 0.42 * (0.5 + 0.5 * Math.sin(frameCount * 0.028));
  push();
  noStroke();
  textAlign(CENTER, CENTER);
  // ① 罗马数字徽章：28 号 BOLD，2 层伪3D（底层 d.accent 偏移 1px，顶层 d.color）+ blur6 辉光
  textStyle(BOLD);
  textSize(28);
  const dc = drawingContext;
  dc.shadowBlur = 6;
  const _gc = color(COLORS[d.color] || COLORS.gold);
  dc.shadowColor = `rgba(${_gc.levels[0]},${_gc.levels[1]},${_gc.levels[2]},0.6)`;
  cFill(d.accent || 'goldDim');                 // 伪3D 暗层
  text(d.roman, cx + 1, topY + 15 + 1);
  cFill(d.color || 'gold');                     // 顶层亮色
  text(d.roman, cx, topY + 15);
  dc.shadowBlur = 0;
  // ② 难度名：13 号 BOLD，d.accent（暗档），与数字拉开明暗层级
  textSize(13);
  cFill(d.accent || 'goldDim');
  text(d.name, cx, topY + 40);
  // ③ 评语：11 号 NORMAL，goldDim 中性 + 慢呼吸（数字稳定不呼吸，评语保留诗意呼吸）
  textStyle(NORMAL);
  textSize(11);
  cFill('goldDim', Math.floor(255 * breath));
  text(d.tagline, cx, topY + 58);
  pop();
}

// 难度 UI 点击处理：返回 true 表示已吞掉该次点击
function handleDifficultyPress() {
  if (typeof gs === 'undefined' || !gs) return false;
  // 与绘制同源的门禁：非标题页一律不参与命中（绘制侧已清空，这里再挡一次，
  // 因为点击与绘制不一定同帧 —— 场景刚切换时不能让上一帧的残留生效）。
  if (gs.scene !== 'title') return false;
  const m = mx(), myv = my();
  const off = (1 - difficultyUI.anim) * -14;
  // 1) 展开态：优先判 4 个档位
  if (difficultyUI.open && difficultyUI.rects.length) {
    for (const r of difficultyUI.rects) {
      if (m > r.x && m < r.x + r.w && myv > r.y && myv < r.y + r.h) {
        setDifficulty(r.idx);
        difficultyUI.open = false;
        return true;
      }
    }
  }
  // 2) 主按钮（命中矩形实时重算，不复用 draw 帧状态）
  const b = difficultyUI.btn;
  const btnHit = b && m > b.x && m < b.x + b.w && myv > b.y && myv < b.y + b.h;
  if (btnHit) {
    difficultyUI.open = !difficultyUI.open;
    if (typeof audio !== 'undefined' && audio && typeof audio.playSFX === 'function') audio.playSFX('card_play');
    return true;
  }
  // 3) 展开态：点面板内空白 → 关闭并吞掉；点面板外 → 关闭但不吞（仍可操作场景）
  if (difficultyUI.open) {
    const p = difficultyUI.panel;
    difficultyUI.open = false;
    if (p && m > p.x && m < p.x + p.w && myv > p.y + off && myv < p.y + off + p.h) return true;
    return false;
  }
  return false;
}

// ==================== AI 呼吸灯（屏幕右下角 · 状态灯兼开关） ====================
// 绿灯 = AI 开启（可能产生调用，按场景计费）；红灯 = AI 关闭（零调用 · 完全免费）
// 调用进行中：三条金色旋尾围绕灯体旋转。悬停显示状态与计费说明。
const AI_LAMP_HIT_R = 21;   // 点击命中半径（略大于灯体，便于点击）

function drawAiLamp() {
  const L = aiSys.lamp;
  const busy = aiSys.busy > 0;
  aiSys.breath += 0.045;
  const breathA = 0.5 + 0.5 * Math.sin(aiSys.breath);
  const hovered = (typeof mx === 'function' && typeof my === 'function')
    && dist(mx(), my(), L.x, L.y) <= AI_LAMP_HIT_R;
  aiSys.hover = hovered;

  push();
  // —— 旋尾：调用中，三条金色拖尾等分 120° 围绕灯体旋转 ——
  if (busy) {
    aiSys.spinner += 0.13;
    const SEGS = 22, STEP = 0.052, RR = L.r + 8;
    for (let k = 0; k < 3; k++) {
      const base = aiSys.spinner + k * (TWO_PI / 3);
      noFill();
      for (let s = 0; s < SEGS; s++) {
        const t0 = base - s * STEP;
        const t1 = base - (s + 1) * STEP;
        // 非线性衰减：头部接近满亮金、尾部快速淡出——比线性衰减更醒目，
        // 金色调也更"实"，不会整条尾巴都灰扑扑地糊在深色背景上。
        const f = 1 - s / SEGS;
        const k = f * f;
        cStroke('goldBright', 255 * k);
        strokeWeight(0.8 + 3.4 * k);
        line(L.x + Math.cos(t0) * RR, L.y + Math.sin(t0) * RR,
             L.x + Math.cos(t1) * RR, L.y + Math.sin(t1) * RR);
      }
    }
  }
  const key = aiSys.enabled ? 'greenBright' : 'redBright';
  // —— 灯座 ——
  noStroke();
  fill(10, 8, 16, 215);
  circle(L.x, L.y, (L.r + 7) * 2);
  noFill();
  cStroke(key, 85);
  strokeWeight(1);
  circle(L.x, L.y, (L.r + 7) * 2);
  // —— 光晕（呼吸）——
  noStroke();
  cFill(key, 35 + breathA * 45);
  circle(L.x, L.y, (L.r + 5 + breathA * (busy ? 5 : 3)) * 2);
  // —— 灯体 ——
  cFill(key, 145 + breathA * 105);
  circle(L.x, L.y, L.r * 2);
  // —— 高光 ——
  fill(255, 255, 255, 55 + breathA * 55);
  circle(L.x - L.r * 0.3, L.y - L.r * 0.33, L.r * 0.62);
  // —— 中心符 ——
  cFill(key, 235);
  textAlign(CENTER, CENTER);
  textSize(11); textStyle(BOLD);
  text(aiSys.enabled ? '◆' : '✕', L.x, L.y + 0.5);
  // —— 悬停说明 ——
  if (hovered) drawAiLampTip(L);
  pop();
}

// 悬停浮层：状态 + 计费说明（余额/免费次数来自 getSceneStatus 预检，未知时不臆造）
function drawAiLampTip(L) {
  const st = aiSys.sceneStatus[AI_SCENES.oracle.code] || aiSys.sceneStatus[AI_SCENES.tactics.code];
  const lines = [];
  lines.push(aiSys.enabled ? 'AI 已开启 · 点击关闭' : 'AI 已关闭 · 点击开启');
  if (aiSys.enabled) {
    lines.push(st ? `免费剩余 ${st.freeRemaining} 次 · 单次 ${st.pricePerCall} 星光币`
                  : '按调用计费（免费额度内不扣费）');
    if (st) lines.push(`当前余额 ${st.balance} 星光币`);
  } else {
    lines.push('零调用 · 游戏完全免费');
  }
  lines.push(`本局已调用 ${aiSys.callCount} 次`);
  if (aiSys.lastNotice && (Date.now() - aiSys.lastNoticeTs) < 6000) lines.push(aiSys.lastNotice);

  textStyle(NORMAL); textSize(11);
  let w = 0;
  for (const t of lines) w = Math.max(w, textWidth(t));
  w += 22;
  const h = 12 + lines.length * 16;
  // 灯在右下角后，浮层改到**灯的正上方**：右侧已无空间，向左又会压住画面主体。
  //   右缘与灯右缘对齐，再夹到屏幕内，保证任何文案长度都不出界。
  let px = L.x + L.r + 2 - w;
  if (px < 8) px = 8;
  if (px + w > GAME_W - 8) px = GAME_W - 8 - w;
  const py = Math.max(8, L.y - L.r - 12 - h);
  noStroke();
  fill(8, 6, 14, 238);
  rect(px, py, w, h, 6);
  noFill();
  cStroke('goldDim', 190);
  strokeWeight(1);
  rect(px, py, w, h, 6);
  noStroke();
  textAlign(LEFT, TOP);
  for (let i = 0; i < lines.length; i++) {
    if (i === 0) { textSize(12); textStyle(BOLD); cFill(aiSys.enabled ? 'greenBright' : 'redBright', 240); }
    else { textSize(11); textStyle(NORMAL); cFill('textDim', 232); }
    text(lines[i], px + 11, py + 7 + i * 16);
  }
}

// 点击处理：命中呼吸灯则切换开关并拦截（右下角独立区域，已避开战斗「结束回合」按钮）
function handleAiLampPress() {
  const L = aiSys.lamp;
  if (typeof mx !== 'function' || typeof my !== 'function') return false;
  if (dist(mx(), my(), L.x, L.y) > AI_LAMP_HIT_R) return false;
  aiToggleEnabled();
  return true;
}

function aiToggleEnabled() {
  // 玩家主动再开：清掉拒绝标记，让下一次调用重新走授权弹窗（拒绝不记忆）
  if (aiSys.denied) aiSys.denied = false;
  aiSys.enabled = !aiSys.enabled;
  aiNotify(aiSys.enabled ? 'AI 已开启 · 调用时计费' : 'AI 已关闭 · 零调用免费');
  try { if (typeof audio !== 'undefined' && audio && typeof audio.playSFX === 'function') audio.playSFX('card_play'); } catch (e) { /* 音效失败无所谓 */ }
  try { if (typeof saveManager !== 'undefined' && saveManager && typeof saveManager.autoSave === 'function') saveManager.autoSave(); } catch (e) { /* 存档失败无所谓 */ }
}

function draw() {
  // 窗口适配：整体 scale 方案——所有场景以 GAME_W×GAME_H 基准坐标绘制
  // 通过 scale(scaleW, scaleH) 映射到实际画布尺寸，所有现有坐标代码无需改动
  push();
  scale(scaleW, scaleH);
  // 场景切换检测
  if (scenes[gs.scene] && scenes[gs.scene] !== currentScene) {
    currentScene = scenes[gs.scene];
    // 场景切换是玩家操作级事件（秒级），远低于 log 限流（10 条/秒），可安全打点
    logSdk('info', 'scene:enter', { scene: gs.scene });
    currentScene.enter();
    // 3D 相机飞掠：每次场景切换触发一次深渊推镜+闪光，强化冒险转场
    // 传入场景名以便深渊引擎根据切换路径（如 battle→defeat）加速色调插值，避免色调滞留跳变
    if (abyss) abyss.flythrough(gs.scene);
  }
  // 更新并绘制当前场景
  if (currentScene) {
    currentScene.update();
    currentScene.draw();
  }
  // 飘字统一在主循环更新（BattleScene 内那一行已移除，否则战斗内会双倍速衰减）。
  //   此前只在战斗场景里 update/draw → 非战斗场景（标题/地图/奖励/结算）产生的飘字
  //   **既不显示也不回收**：数组只增不减，玩家还看不到 AI 通知（余额不足 / 未授权 / 配额用尽）。
  floatingTexts.update();
  // 主题「飘」· 灰烬层：画在**场景之上、UI 之下** —— 灰烬飘过眼前，但不遮任何可交互元素。
  //   牌库面板/图鉴打开时停绘（那时屏幕信息密度最高，灰烬只会添乱）。
  if (!gs.showDeckViewer && !gs.showCodex) {
    ashUpdate();
    ashDraw();
  }
  // 牌库查看面板覆盖层
  if (gs.showDeckViewer) {
    drawDeckViewer();
  }
  // 难度选择 UI（屏幕中央最上方，全场景常驻；牌库/图鉴面板打开时让位）
  if (!gs.showDeckViewer && !gs.showCodex) drawDifficultyUI();
  // Bloom 强度滑块（全场景通用，避开卡牌区/牌库/图鉴面板）
  if (!gs.showDeckViewer && !gs.showCodex) drawBloomSlider();
  // 拖动中实时更新
  if (bloom && bloom.slider.dragging) updateBloomSlider();
  // 音量控制 UI：紧跟 BLOOM 下方，复古分格弧合成器风格
  if (!gs.showDeckViewer && !gs.showCodex) drawVolumeUI();
  // 难度档位结果行：音量控件正下方（难度 UI 已收进标题页，这行是其余场景的常驻提示）
  if (!gs.showDeckViewer && !gs.showCodex) drawDifficultyResult();
  // 音量拖动实时更新
  if (volumeUI && volumeUI.dragging) updateVolumeUIDrag();
  // 非战斗场景的飘字兜底绘制（战斗内由 BattleScene 自己画，层级保持原样不动）。
  //   压在难度/音量/呼吸灯**之上**：难度切换与 AI 通知的飘字都在屏幕上半部，
  //   若画在下面会被难度 UI 挡住，等于没提示。
  if (gs.scene !== 'battle' && !gs.showDeckViewer && !gs.showCodex) floatingTexts.draw();
  // AI 呼吸灯（屏幕右下角，状态灯兼开关；最后绘制保证不被遮挡，牌库/图鉴面板打开时让位）
  if (!gs.showDeckViewer && !gs.showCodex) drawAiLamp();
  // PHASE 1 图鉴浮层（最后绘制，压在所有场景 UI 之上）
  if (gs.showCodex) drawCodex();
  pop();
}

// ==================== PHASE 1 · 图鉴面板 ====================
// 为什么必须有 UI：组合数（43,200+）本身是不可感知的抽象，"无限"要靠**可数的进度**落地。
// 玩家看到「已收录 137 / 300 · 累计发现 137」时，无限才从概念变成目标。
function drawCodex() {
  const st = codexStats();
  // 遮罩
  noStroke(); fill(0, 210); rect(0, 0, GAME_W, GAME_H);
  const px = 70, py = 44, pw = GAME_W - 140, ph = GAME_H - 88;
  cFill('panel'); cStroke('goldDim'); strokeWeight(1); rect(px, py, pw, ph, 8);

  // 标题 + 关闭按钮
  noStroke(); cFill('goldBright'); textAlign(LEFT, CENTER); textSize(21);
  text('深 渊 图 鉴 · CODEX ABYSSUS', px + 28, py + 36);
  const cb = { x: px + pw - 44, y: py + 20, w: 26, h: 26 };
  const cbHover = mx() > cb.x && mx() < cb.x + cb.w && my() > cb.y && my() < cb.y + cb.h;
  cStroke(cbHover ? 'goldBright' : 'goldDim'); cFill(cbHover ? 'goldDim' : 'panel');
  rect(cb.x, cb.y, cb.w, cb.h, 4);
  noStroke(); cFill(cbHover ? 'bg' : 'text'); textAlign(CENTER, CENTER); textSize(15);
  text('✕', cb.x + cb.w / 2, cb.y + cb.h / 2 + 1);

  // 统计行
  textAlign(LEFT, CENTER); textSize(14);
  cFill('text');
  const _ns = (typeof namerStats === 'function') ? namerStats() : null;
  text(`已收录 ${st.kept} / ${st.cap}　·　累计发现 ${st.total}　·　本局新发现 ${st.newThisRun}`
       + (_ns ? `　·　AI 赐名 ${st.named}` : ''), px + 28, py + 72);
  cFill('textDim'); textSize(12);
  // 让"AI 只花一次钱"这件事被玩家看见：队列/额度都是可解释的
  const _hint = (_ns && aiSys.enabled)
    ? (`命名队列 ${_ns.queued} 待发 · 本局已用 ${_ns.calls}/${_ns.max} 次调用 · 命中图鉴的组合不再付费`)
    : '收录满 300 条后按「最久未见」淘汰 —— 深渊不会让你两次记住同一张脸';
  text(_hint, px + 28, py + 94);

  // 分隔线
  cStroke('panelEdge'); line(px + 28, py + 112, px + pw - 28, py + 112);

  // 收录列表（倒序：最近发现的在前）
  const cols = 3;
  const colW = (pw - 56) / cols;
  const rowH = 26;
  const top = py + 128;
  const maxRows = Math.max(0, Math.floor((py + ph - 40 - top) / rowH));
  const items = CODEX_SYS._items;
  noStroke();
  if (!items.length) {
    cFill('textDim'); textAlign(CENTER, CENTER); textSize(15);
    text('图鉴空空如也 —— 进入深渊，去遇见第一张没有名字的脸', GAME_W / 2, top + 60);
  } else {
    for (let i = 0; i < Math.min(items.length, cols * maxRows); i++) {
      const it = items[items.length - 1 - i];
      const col = i % cols, row = Math.floor(i / cols);
      const cx = px + 28 + col * colW, cy = top + row * rowH;
      // 序号（累计发现倒推，让"第 N 号"与飘字编号一致）
      const no = items.length - i;
      cFill('goldDim'); textAlign(LEFT, CENTER); textSize(11);
      text(String(no).padStart(3, '0'), cx, cy + rowH / 2);
      // 名字：优先显示 AI 赐名（它就是玩家实际会在战斗中看到的那张脸）
      //   ✦ 标记 = 这一条凝结过一次 AI 成本，之后永远免费
      if (it.t) {
        cFill('goldBright'); textAlign(LEFT, CENTER); textSize(11);
        text('✦', cx + 22, cy + rowH / 2);
      }
      // 名字上色并入统一层语义：AI 赐名 = **叙事金**（深渊"亲口"叫出过这个名字），
      //   模板名 = 图鉴常规白（还没被叫出真名的）。此前两者同为白色，AI 成本换来的
      //   真名在视觉上毫无分量 —— 花了钱，玩家却看不出区别。
      cFill(it.t ? 'gold' : 'text');
      drawTextFit(it.t || it.n || '???', cx + 34, cy + rowH / 2, colW - 90, 13, 10);
      // 深度
      cFill('cyanDim'); textAlign(RIGHT, CENTER); textSize(11);
      text('D' + (it.d || 0), cx + colW - 14, cy + rowH / 2);
    }
  }

  // 底部提示
  cFill('textDim'); textAlign(CENTER, CENTER); textSize(12);
  text('按 C 或 ESC 关闭 · 点击面板外关闭', GAME_W / 2, py + ph - 22);
}

function mouseMoved() {
  // T208：转发到当前场景的 mouseMoved（BattleScene 用此检测敌人悬停）
  // 仅在当前场景实现了该方法时调用，避免无关场景报错
  if (currentScene && typeof currentScene.mouseMoved === 'function') {
    currentScene.mouseMoved();
  }
}

function mousePressed() {
  if (!audio.initialized) {
    audio.init();
  }
  // T240：模态遮罩（图鉴/牌库）最高优先级独占点击 —— 展开时背景 UI（AI灯/Bloom/音量等）
  //   既不绘制（见 draw() 守卫）也不参与命中，杜绝点关闭按钮却误触 Bloom 等控件。
  // PHASE 1 图鉴面板：关闭按钮 / 点击面板外关闭
  if (gs.showCodex) {
    let cpx = 70, cpy = 44, cpw = GAME_W - 140, cph = GAME_H - 88;
    let cbx = cpx + cpw - 44, cby = cpy + 20;
    if (mx() > cbx && mx() < cbx + 26 && my() > cby && my() < cby + 26) {
      gs.showCodex = false;
      return;
    }
    if (mx() < cpx || mx() > cpx + cpw || my() < cpy || my() > cpy + cph) {
      gs.showCodex = false;
      return;
    }
    return;
  }
  // 牌库查看面板：关闭按钮 / 标签页 / 点击面板外关闭
  if (gs.showDeckViewer) {
    let panelX = 40, panelY = 30, panelW = GAME_W - 80, panelH = GAME_H - 60;
    let closeBtn = { x: panelX + panelW - 35, y: panelY + 15, w: 20, h: 20 };
    if (mx() > closeBtn.x && mx() < closeBtn.x + closeBtn.w &&
        my() > closeBtn.y && my() < closeBtn.y + closeBtn.h) {
      gs.showDeckViewer = false;
      gs._deckScroll = 0;
      gs._relicScroll = 0;
      return;
    }
    if (gs._viewerTabs) {
      let tabs = gs._viewerTabs;
      if (mx() > tabs.deck.x && mx() < tabs.deck.x + tabs.deck.w &&
          my() > tabs.deck.y && my() < tabs.deck.y + tabs.deck.h) {
        gs.viewerTab = 'deck';
        gs._deckScroll = 0;
        gs._relicScroll = 0;
        return;
      }
      if (mx() > tabs.relics.x && mx() < tabs.relics.x + tabs.relics.w &&
          my() > tabs.relics.y && my() < tabs.relics.y + tabs.relics.h) {
        gs.viewerTab = 'relics';
        gs._deckScroll = 0;
        gs._relicScroll = 0;
        return;
      }
    }
    if (mx() < panelX || mx() > panelX + panelW ||
        my() < panelY || my() > panelY + panelH) {
      gs.showDeckViewer = false;
      gs._deckScroll = 0;
      gs._relicScroll = 0;
      return;
    }
    return;
  }
  // AI 呼吸灯拦截（右下角独立区域，与其它 UI 无重叠）
  if (handleAiLampPress()) return;
  // 难度选择 UI 拦截（位于顶部中央，与右侧 Bloom/音量无区域重叠）
  if (handleDifficultyPress()) return;
  // Bloom 强度滑块优先拦截
  if (handleBloomSliderPress()) return;
  // 音量控制 UI 拦截
  if (handleVolumeUIPress()) return;
  if (currentScene) currentScene.mousePressed();
}

// T241：松开鼠标 —— 转发给当前场景（TitleScene 用它结束 Flow 拖拽并启动回飘）
function mouseReleased() {
  if (currentScene && typeof currentScene.mouseReleased === 'function') {
    try { currentScene.mouseReleased(); } catch (e) { /* 释放失败不影响主流程 */ }
  }
}

function keyPressed() {
  // PHASE 1：C 键开关深渊图鉴（Tab 已被牌库占用）—— T242：两栏互斥，打开图鉴时关闭牌库
  if (key === 'c' || key === 'C' || keyCode === 67) {
    gs.showCodex = !gs.showCodex;
    if (gs.showCodex) {
      gs.showDeckViewer = false;
      gs._deckScroll = 0;
      gs._relicScroll = 0;
    }
    return false;
  }
  // Tab键切换牌库查看 —— T242：两栏互斥，打开牌库时关闭图鉴
  if (keyCode === 9 || key === 'Tab') {
    gs.showDeckViewer = !gs.showDeckViewer;
    if (gs.showDeckViewer) {
      gs.showCodex = false;
    }
    gs._deckScroll = 0;
    gs._relicScroll = 0; // 重置遗物滚动
    return false;
  }
  // ESC：优先关闭难度面板，其次关闭图鉴，最后关闭牌库
  if (keyCode === ESCAPE) {
    if (difficultyUI.open) {
      difficultyUI.open = false;
      return;
    }
    if (gs.showCodex) {
      gs.showCodex = false;
      return;
    }
    if (gs.showDeckViewer) {
      gs.showDeckViewer = false;
      gs._deckScroll = 0;
      gs._relicScroll = 0; // 重置遗物滚动
      return;
    }
  }
  if (currentScene) currentScene.keyPressed();
}

function mouseWheel(event) {
  if (!gs) return;
  // T240：图鉴展开时模态独占，滚轮不穿透到场景（图鉴列表本身不可滚动）
  if (gs.showCodex) return false;
  // T187 先路由到当前 scene 的 mouseWheel（工匠铺等场景需要滚轮浏览）
  if (currentScene && currentScene.mouseWheel) {
    let result = currentScene.mouseWheel(event);
    if (result === false) return false;  // 场景已处理，阻止浏览器默认滚动
  }
  if (!gs.showDeckViewer) return;
  let step = 40;
  // 牌库牌堆滚动（仅战斗中）
  if (gs.viewerTab === 'deck' && gs.scene === 'battle' && gs.combatState) {
    // 自然滚动模式：上滚(delta>0)→内容上移露出下方，下滚(delta<0)→内容下移露出上方
    gs._deckScroll += (event.delta > 0 ? step : -step);
    gs._deckScroll = constrain(gs._deckScroll, 0, gs._deckMaxScroll || 0);
    return false;
  }
  // 遗物面板滚动
  if (gs.viewerTab === 'relics' && gs.relics.length > 0) {
    // 自然滚动模式：上滚(delta>0)→内容上移露出下方，下滚(delta<0)→内容下移露出上方
    gs._relicScroll += (event.delta > 0 ? step : -step);
    gs._relicScroll = constrain(gs._relicScroll, 0, gs._relicMaxScroll || 0);
    return false;
  }
}

// 窗口大小调整：同步画布尺寸并重算缩放因子
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  recomputeScale();
  // 强制重绘，避免残影
  redraw();
}
// 全局 mouseup：确保滑块拖动释放（即使鼠标移出画布也能释放）
window.addEventListener('mouseup', () => { releaseBloomSlider(); releaseVolumeUI(); });
</script>
