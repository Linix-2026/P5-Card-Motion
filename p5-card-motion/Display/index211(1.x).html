    if (cs.playerStatuses.weak > 0) dmg = Math.floor(dmg * 0.75);
    // 先破盾
    let remainingDmg = dmg;
    if (cs.enemyBlock > 0) {
      let blocked = Math.min(cs.enemyBlock, remainingDmg);
      cs.enemyBlock -= blocked;
      remainingDmg -= blocked;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.38, `${blocked}🛡`, COLORS.redBright); // T170：格挡消耗文字改红色系
      // 触发护盾受击闪现（视觉反馈：玩家可直观感知敌方格挡生效）
      this.enemyAnim.blockHitFlash = 1.0;
      audio.playSFX('block');
      // T170：格挡被完全击破时触发护盾破碎特效（红色碎片飞散）
      if (cs.enemyBlock === 0) {
        this.enemyAnim.shieldShatter = 1.0;
      }
    }
    if (remainingDmg > 0) {
      cs.enemyHp -= remainingDmg;
      // T242：战报 · 最深一击（只记主结算点，DOT/灼烧等持续伤害不计 —— 那是"过程"不是"一击"）
      try { if (gs.runStats && remainingDmg > gs.runStats.maxHit) gs.runStats.maxHit = remainingDmg; } catch (e) {}
      floatingTexts.add(GAME_W * 0.68, GAME_H * 0.35, `-${remainingDmg}`, COLORS.redBright, 18);
      // 镜像怨灵：反射连击伤害 30%
      if (cs.enemyData.comboReflect && cs.comboCount > 0) {
        let reflectDmg = Math.floor(remainingDmg * cs.enemyData.comboReflect);
        if (reflectDmg > 0) {
          // 先扣格挡
          if (cs.playerBlock > 0) {
            let rBlocked = Math.min(cs.playerBlock, reflectDmg);
            cs.playerBlock -= rBlocked;
            reflectDmg -= rBlocked;
          }
          if (reflectDmg > 0) {
            gs.hp -= reflectDmg;
            floatingTexts.add(GAME_W * 0.35, GAME_H * 0.45, `反射-${reflectDmg}`, COLORS.purpleBright, 16);
            this.playerAnim.flashAlpha = 150;
          }
        }
      }
      // 血玉髓
      gs.relics.forEach(r => { if (r.onDealDamage) r.onDealDamage(gs, remainingDmg); });
      // 受伤动画
      this.enemyAnim.flashAlpha = 200;
      this.enemyAnim.shakeX = rand(-4, 4);
      this.enemyAnim.shakeY = rand(-3, 3);
      audio.playSFX('hurt');
      particles.emit(GAME_W * 0.65, GAME_H * 0.4, 8, { color: COLORS.red, size: 3, life: 15, speed: 3 });
      // 实际造成伤害后检查战斗结束（受状态锁保护，不会重复触发）
      this.checkCombatEnd();
    }
  }
  enemyTakeTurn() {
    let cs = gs.combatState;
    let intent = this.enemyIntent;
    // 连击破碎者：每 N 回合清空玩家连击计数
    if (cs.enemyData.comboBreakTurns && gs.turnNumber > 0 && gs.turnNumber % cs.enemyData.comboBreakTurns === 0 && cs.comboCount > 0) {
      let cleared = cs.comboCount;
      cs.comboCount = 0;
      floatingTexts.add(GAME_W * 0.5, GAME_H * 0.3, `连击破碎! -${cleared}`, COLORS.orange, 18);
      audio.playSFX('smash');
    }
    // 符文之蛇：灼烧+腐蚀同时存在时瘫痪（跳过回合）
    if (cs.enemyData.elementParalysis && cs.enemyStatuses.burn > 0 && cs.enemyStatuses.corrode > 0) {
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.3, '元素瘫痪! 跳过回合', COLORS.greenBright, 18);
      this.endEnemyTurn();
      return;
    }
    // 检查震慑
    if (cs.enemyStunStacks > 0) {
      let enemyAp = cs.enemyData.ap || 1;
      if (cs.bossPhase2 && cs.enemyData.bossPhase2) enemyAp = cs.enemyData.bossPhase2.ap || enemyAp;
      if (cs.bossPhase3 && cs.enemyData.bossPhase3) enemyAp = cs.enemyData.bossPhase3.ap || enemyAp;
      if (cs.enemyStunStacks >= enemyAp) {
        cs.enemyStunStacks -= enemyAp;
        floatingTexts.add(GAME_W * 0.65, GAME_H * 0.3, '震慑! 跳过回合', COLORS.purpleBright, 20);
        this.endEnemyTurn();
        return;
      } else {
        cs.enemyStunStacks = 0;
      }
    }
    switch (intent.type) {
      case 'attack': {
        let dmg = intent.dmg;
        if (cs.enemyFirstAttackHalved) { dmg = Math.floor(dmg / 2); cs.enemyFirstAttackHalved = false; }
        // 易伤（T174 修复：玩家易伤时受到伤害+50%，原缺失导致"易伤"减益无实际效果）
        // 与敌方 L4333-4334 对称：先易伤(×1.5)再虚弱(×0.75)
        if (cs.playerStatuses.vulnerable > 0) {
          dmg = Math.floor(dmg * 1.5);
          floatingTexts.add(GAME_W * 0.3, GAME_H * 0.42, '易伤!+50%', COLORS.red, 14);
        }
        // 虚弱（敌方虚弱时攻击伤害-25%；T174 统一 > 0 写法，原 truthy 检查在负值边界不安全）
        if (cs.enemyStatuses.weak > 0) dmg = Math.floor(dmg * 0.75);
        // 钢铁意志遗物：每回合首次受伤减半
        if (gs.hasRelic('iron_will') && !cs._ironWillUsed) {
          dmg = Math.floor(dmg / 2);
          cs._ironWillUsed = true;
          floatingTexts.add(GAME_W * 0.3, GAME_H * 0.4, '钢铁意志!', COLORS.blueBright, 14);
        }
        // 玩家格挡
        let remaining = dmg;
        if (cs.playerBlock > 0) {
          let blocked = Math.min(cs.playerBlock, remaining);
          cs.playerBlock -= blocked;
          remaining -= blocked;
          floatingTexts.add(GAME_W * 0.35, GAME_H * 0.5, `${blocked}🛡`, COLORS.blue);
          // T171：玩家格挡受击视觉反馈（与敌方对称）
          this.playerAnim.blockHitFlash = 1.0;
          audio.playSFX('block');
          // T171：格挡被完全击破时触发护盾破碎特效
          if (cs.playerBlock === 0) {
            this.playerAnim.shieldShatter = 1.0;
          }
        }
        if (remaining > 0) {
          // 难度：玩家承伤倍率（低语 0.70 减免 / 湮灭 1.50 加重）；下限 1 点，避免减免到 0 造成"无敌"错觉
          const _d = getDifficulty();
          let takenMul = _d.playerDmgTaken;
          // 时间压力：超过阈值回合后承伤进一步飙升，杜绝"无限格挡磨死敌人"的苟活流
          if (_d.longFightTurn > 0 && gs.turnNumber >= _d.longFightTurn) takenMul *= _d.longFightPenalty;
          const finalDmg = Math.max(1, Math.round(remaining * takenMul));
          gs.takeDamage(finalDmg);
          // 灵魂之锚遗物：死亡时复活一次
          if (gs.hp <= 0 && gs.hasRelic('soul_anchor') && !gs._soulAnchorUsed) {
            gs._soulAnchorUsed = true;
            gs.hp = Math.floor(gs.maxHp * 0.3);
            floatingTexts.add(GAME_W * 0.5, GAME_H * 0.4, '灵魂之锚! 复活!', COLORS.goldBright, 22);
            audio.playSFX('heal');
            particles.emit(GAME_W * 0.3, GAME_H * 0.45, 20, { color: COLORS.gold, size: 4, life: 25, speed: 4 });
          }
          floatingTexts.add(GAME_W * 0.3, GAME_H * 0.45, `-${finalDmg}❤`, COLORS.redBright, 20);
          this.playerAnim.flashAlpha = 200;
          this.playerAnim.shakeX = rand(-3, 3);
          audio.playSFX('hurt');
          screenShake.trigger(3, 5);
        }
        break;
      }
      case 'defend': {
        cs.enemyBlock += intent.block;
        this.enemyAnim.defendAnim = 1.0; // 触发举盾动画（与玩家防御对称）
        this.enemyAnim.defendPulse = 1.0; // T170：举盾瞬间冲击波（红色环向外扩散）
        floatingTexts.add(GAME_W * 0.65, GAME_H * 0.38, `+${intent.block}🛡`, COLORS.orangeBright); // T170：敌方格挡浮动文字改红色系
        audio.playSFX('block'); // 防御音效反馈（复用 block 音效）
        break;
      }
      case 'buff':
        if (intent.buffType === 'strength') {
          cs.enemyData.attackDmg += intent.amt;
          cs._enemyStrength = (cs._enemyStrength || 0) + intent.amt;
          floatingTexts.add(GAME_W * 0.65, GAME_H * 0.3, `力量+${intent.amt}`, COLORS.orange);
        }
        break;
      case 'debuff':
        if (intent.debuffType === 'vulnerable') {
          cs.playerStatuses.vulnerable = (cs.playerStatuses.vulnerable || 0) + intent.amt;
          floatingTexts.add(GAME_W * 0.3, GAME_H * 0.5, `易伤+${intent.amt}`, COLORS.red);
        } else if (intent.debuffType === 'weak') {
          cs.playerStatuses.weak = (cs.playerStatuses.weak || 0) + intent.amt;
          floatingTexts.add(GAME_W * 0.3, GAME_H * 0.5, `虚弱+${intent.amt}`, COLORS.purple);
        }
        break;
      case 'heal':
        cs.enemyHp = Math.min(cs.enemyMaxHp, cs.enemyHp + intent.amt);
        floatingTexts.add(GAME_W * 0.65, GAME_H * 0.3, `+${intent.amt}❤`, COLORS.green);
        break;
    }
    this.endEnemyTurn();
  }
  endEnemyTurn() {
    let cs = gs.combatState;
    // PHASE 1a：玩家行为采样（读牌）——必须在本函数重置 _turnBlockGained / cardsPlayedThisTurn 之前
    this.snapshotPlayerRead();
    // 敌人状态效果结算
    this.tickEnemyStatuses();
    // 玩家状态效果结算
    this.tickPlayerStatuses();
    // 检查战斗结束
    if (this.checkCombatEnd()) return;
    // 新回合
    cs.turnPhase = 'player';
    // 敌人格挡不在此时重置——需持久化至玩家回合以实际吸收伤害（修复 T168：原此处立即清零导致格挡意图无效）
    // 诅咒骰子
    if (gs.hasRelic('cursed_dice')) {
      cs.ap = randInt(0, 5);
      floatingTexts.add(GAME_W * 0.25, GAME_H * 0.85, `AP: ${cs.ap}/${cs.maxAp}`, cs.ap > cs.maxAp - 1 ? COLORS.gold : COLORS.textDim, 14);
    } else {
      cs.ap = cs.maxAp;
    }
    cs.playerBlock = 0;
    cs.cardsPlayedThisTurn = [];
    cs.lastPlayedKeyword = null;
    cs._lastComboConsumed = 0;
    cs._eternalFlowActive = false; // 永恒流转每回合重置
    cs._eternalCycleActive = false; // T177 永恒循环每回合重置
    cs._doubleNextTimes = 0; // T177 双倍蓄能每回合重置（未触发的双倍不跨回合保留）
    cs._turnBlockGained = 0; // T177 本回合格挡累计重置
    // T177 清除手牌中的深度思考折扣（本回合生效，回合结束失效）
    cs.hand.forEach(h => { if (h._discountCost) delete h._discountCost; });
    cs.comboWindow = 0; // 连击窗口每回合重置
    // 相位迁跃者：连击「不消耗」的另一半是**每回合归零**。
    //   原本 comboCount 从不按回合重置（只靠猛击/震慑等消耗手段清零），
    //   若只做"不消耗"，连击就会跨回合永久顶在 5 —— 每回合开局白送满连击，
    //   猛击、震慑、以及所有"连击≥5"的遗物全部常驻生效，强度直接失控。
    //   desc 写的是「每回合连击上限锁定为 5」，所以这行是让描述名副其实的那一半：
    //   回合内连击不清零、可以反复吃到满连击；回合结束归零，下回合重新攒。
    if (comboNoConsumeNow()) cs.comboCount = 0;
    // T177 坚韧能力：每回合开始获得 passiveBlock 格挡（_passiveBlock 在打出 power 牌时设置，不每回合重置）
    if (cs._passiveBlock && cs._passiveBlock > 0) {
      cs.playerBlock += cs._passiveBlock;
      floatingTexts.add(GAME_W * 0.35, GAME_H * 0.55, `坚韧+${cs._passiveBlock}🛡`, COLORS.blueBright, 14);
      cs._turnBlockGained += cs._passiveBlock; // 坚韧格挡也计入 block_strike 基数
    }
    // T181 瘟疫之云能力：每回合开始对所有敌人施加 statusList 中的异常（_plagueCloudList 在打出 power 牌时设置，不每回合重置）
    if (cs._plagueCloudList && cs._plagueCloudList.length > 0) {
      let immune = cs.enemyData.statusImmune || [];
      cs._plagueCloudList.forEach(s => {
        if (immune.includes(s.type)) {
          floatingTexts.add(GAME_W * 0.65, GAME_H * 0.32, '免疫!', COLORS.textDim, 14);
          return;
        }
        cs.enemyStatuses[s.type] = (cs.enemyStatuses[s.type] || 0) + s.amt;
        let statusName = { burn: '灼烧', freeze: '冻结', corrode: '腐蚀' }[s.type] || s.type;
        floatingTexts.add(GAME_W * 0.65, GAME_H * 0.35, `${statusName} +${s.amt}`, COLORS[s.type] || COLORS.purple, 14);
      });
    }
    // —— 难度·时间压力：敌人每回合成长 + 湮灭侵蚀 ——
    const _d = getDifficulty();
    if (_d.enemyGrowth > 0) {
      cs._diffGrowth = (cs._diffGrowth || 0) + _d.enemyGrowth;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.3, `力量+${_d.enemyGrowth}`, COLORS.orange, 15);
    }
    if (_d.erosionEvery > 0 && _d.erosionAmt > 0 && (gs.turnNumber + 1) % _d.erosionEvery === 0) {
      const before = gs.maxHp;
      gs.maxHp = Math.max(10, gs.maxHp - _d.erosionAmt);
      if (gs.hp > gs.maxHp) gs.hp = gs.maxHp;
      floatingTexts.add(GAME_W * 0.3, GAME_H * 0.42, `侵蚀 上限-${(before - gs.maxHp)}`, COLORS.redBright, 17);
      screenShake.trigger(4, 8);
    }
    cs.enemyIntentIndex++;
    this.generateEnemyIntent();
    // 每回合抽牌数随难度（低语 6 / 回响·深渊 5 / 湮灭 4）
    this.drawCards(_d.drawPerTurn);
    gs.turnNumber++;
    this.enemyTurnDelay = 0;
    // 触发遗物 onTurnStart 回调（iron_will 重置、echo_core 重置等）
    gs.relics.forEach(r => { if (r.onTurnStart) r.onTurnStart(gs); });
    // Boss阶段2
    if (cs.enemyData.bossPhase2 && cs.enemyHp <= cs.enemyData.bossPhase2.hpThreshold && !cs.bossPhase2) {
      cs.bossPhase2 = true;
      cs.enemyData.attackDmg = cs.enemyData.bossPhase2.attackDmg;
      cs.enemyData.ap = cs.enemyData.bossPhase2.ap;
      if (cs.enemyData.bossPhase2.intentPattern) cs.enemyData.intentPattern = cs.enemyData.bossPhase2.intentPattern;
      floatingTexts.add(GAME_W * 0.5, GAME_H * 0.2, 'BOSS进入第二阶段!', COLORS.redBright, 22);
      audio.playSFX('smash');
      screenShake.trigger(10, 15);
    }
    // Boss阶段3（虚空君主专属）
    if (cs.enemyData.bossPhase3 && cs.enemyHp <= cs.enemyData.bossPhase3.hpThreshold && !cs.bossPhase3) {
      cs.bossPhase3 = true;
      cs.enemyData.attackDmg = cs.enemyData.bossPhase3.attackDmg;
      cs.enemyData.ap = cs.enemyData.bossPhase3.ap;
      if (cs.enemyData.bossPhase3.intentPattern) cs.enemyData.intentPattern = cs.enemyData.bossPhase3.intentPattern;
      floatingTexts.add(GAME_W * 0.5, GAME_H * 0.2, 'BOSS进入第三阶段!', COLORS.redBright, 24);
      audio.playSFX('smash');
      screenShake.trigger(14, 20);
      particles.emit(GAME_W * 0.5, GAME_H * 0.4, 30, { color: COLORS.purpleBright, size: 5, life: 30, speed: 5 });
    }
  }
  tickEnemyStatuses() {
    let cs = gs.combatState;
    // 战斗结束守卫：已在结束流程中则跳过DOT结算
    if (this.battleEnding || this._battleEnded) return;
    // 灼烧
    if (cs.enemyStatuses.burn > 0) {
      cs.enemyHp -= cs.enemyStatuses.burn;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.4, `🔥-${cs.enemyStatuses.burn}`, COLORS.burn, 14);
      particles.emit(GAME_W * 0.65, GAME_H * 0.4, 5, { color: COLORS.orange, size: 3, life: 10, speed: 2 });
      cs.enemyStatuses.burn = Math.floor(cs.enemyStatuses.burn * 0.7); // 灼烧衰减
      // DOT击杀检查（受状态锁保护）
      if (cs.enemyHp <= 0) { this.checkCombatEnd(); return; }
    }
    // 冻结
    if (cs.enemyStatuses.freeze > 0) {
      cs.enemyStunStacks += cs.enemyStatuses.freeze;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.42, `❄震慑+${cs.enemyStatuses.freeze}`, COLORS.freeze, 14);
      cs.enemyStatuses.freeze = Math.floor(cs.enemyStatuses.freeze * 0.5);
    }
    // 腐蚀：每回合 DOT + 增伤，衰减 30%（保留 70%，与灼烧一致）
    if (cs.enemyStatuses.corrode > 0) {
      cs.enemyHp -= cs.enemyStatuses.corrode;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.44, `☠-${cs.enemyStatuses.corrode}`, COLORS.poison, 14);
      cs.enemyStatuses.corrode = Math.floor(cs.enemyStatuses.corrode * 0.7); // 改为 0.7 衰减（T175）
      // DOT击杀检查（受状态锁保护）
      if (cs.enemyHp <= 0) { this.checkCombatEnd(); return; }
    }
    // 易伤
    if (cs.enemyStatuses.vulnerable > 0) cs.enemyStatuses.vulnerable--;
    // 虚弱
    if (cs.enemyStatuses.weak > 0) cs.enemyStatuses.weak--;
  }
  tickPlayerStatuses() {
    let cs = gs.combatState;
    if (cs.playerStatuses.vulnerable > 0) cs.playerStatuses.vulnerable--;
    if (cs.playerStatuses.weak > 0) cs.playerStatuses.weak--;
    // 清理
    Object.keys(cs.playerStatuses).forEach(k => {
      if (cs.playerStatuses[k] <= 0) delete cs.playerStatuses[k];
    });
    Object.keys(cs.enemyStatuses).forEach(k => {
      if (cs.enemyStatuses[k] <= 0) delete cs.enemyStatuses[k];
    });
  }
  checkCombatEnd() {
    // 战斗结束状态锁：防止DOT/多段攻击/异常等多路径重复触发胜利
    if (this.battleEnding || this._battleEnded) return false;
    let cs = gs.combatState;
    if (cs.enemyHp <= 0) {
      cs.enemyHp = 0;
      // 主题「飘」：造物被击散 —— 十余片灰烬从它站的位置向上飘走。
      //   与图鉴「收回一枚造物」是同一个动作的两面：名字被留下，字句重新飘散回深渊。
      try {
        if (typeof ashBurst === 'function') ashBurst(GAME_W * 0.65, GAME_H * 0.38, 16, -1);
      } catch (e) { /* 粒子失败绝不影响结算 */ }
      this.battleEnding = true;
      this._battleEnded = true; // 幂等标志：确保 onBattleEnd 只触发一次
      this.battleResult = 'victory';
      // T242：战报 · 放倒数
      try { if (gs.runStats) gs.runStats.kills++; } catch (e) {}
      // T244：最后一回合结束 → 立刻浮出战报。与 1500ms 击杀动画**并行**，节奏不断档：
      //   敌人在散成灰烬的同时，这一局的数字已经在你眼前滚起来了。
      this.showRunRecap = true;
      this.runRecapT = 0;
      this._recapAt = (typeof millis === 'function') ? millis() : 0;
      audio.playSFX('death');
      setTimeout(() => { this.battleEnding = false; this.onBattleEnd(); }, 1500);
      return true;
    }
    if (gs.hp <= 0) {
      // 主题「飘」：陨落这一下从**玩家自己身上**散开（20 片，比敌人死亡更重）。
      //   随后 DefeatScene 的整屏上飘灰烬接手，形成"你散开 → 你飘回去"的两段式演出。
      try {
        if (typeof ashBurst === 'function') ashBurst(GAME_W * 0.3, GAME_H * 0.52, 20, -1);
      } catch (e) { /* 粒子失败绝不影响结算 */ }
      this.battleEnding = true;
      this._battleEnded = true;
      this.battleResult = 'defeat';
      // 失败立即结算；胜利路径保留 1500ms 庆祝停顿
      this.onBattleEnd();
      return true;
    }
    return false;
  }
  onBattleEnd() {
    // 幂等保护：防止 onBattleEnd 被多次调用导致奖励重复刷新
    if (this._battleEndHandled) return;
    this._battleEndHandled = true;
    // PHASE 5：画像埋点 —— 本场回合数（胜负都记，"打得久不久"是画像的关键维度）
    try { if (typeof profileOnBattleEnd === 'function') profileOnBattleEnd(); } catch (e) {}
    // 清理手牌中残留的销毁卡

      //   这是"深渊记得你击败过它几次"的数据来源，纯计数、零费用。
      try {

      const _d = getDifficulty();
      // 难度：金币回报倍率（低语 1.40 宽裕起步 / 湮灭 0.85 资源紧缺）
      goldReward = Math.max(1, Math.round(goldReward * _d.gold));

      if (_d.postBattleHeal > 0) {

      let cardsToPick = (node?.type === 'elite' || node?.type === 'boss') ? 2 : 1;
      // ===== 遗物掉落 =====
      let relicReward = null;
      let availableRelics = RELIC_DATA.filter(r => !gs.relics.find(owned => owned.id === r.id));
      if (node?.type === 'elite') {
        // 精英战100%掉落，权重common20/uncommon50/rare30
        relicReward = this.generateRelicReward(availableRelics, { common: 20, uncommon: 50, rare: 30 });
      } else if (node?.type === 'boss') {
        // T195：boss 战 100% 掉落遗物（权重偏稀有 common 0/uncommon 30/rare 70）— 此前依赖宝藏房获取遗物
        relicReward = this.generateRelicReward(availableRelics, { common: 0, uncommon: 30, rare: 70 });
      } else if (node?.type === 'battle' && Math.random() < 0.25) {
        // 普通战25%概率，权重common60/uncommon30/rare10
        relicReward = this.generateRelicReward(availableRelics, { common: 60, uncommon: 30, rare: 10 });
      }
      // T195：cardsClaimed 改为索引数组（支持 3选2 多次领牌）
      let cardsClaimed = [];
      let relicClaimed = relicReward == null; // 无遗物则默认已领取
      this.pendingRewards = { gold: goldReward, cards: cardRewards, relic: relicReward, relicClaimed, cardsToPick, cardsClaimed };

      this.aiAdvice = null;
      this._adviceBusy = false;

      //   失败路径不走这里（直接进 DefeatScene，那里自有战报），只在胜利路径延后。
      if (this.showRunRecap) {
        this._rewardReady = true;
      } else {
        this.showRewardScreen = true;
      }
      // T194：奖励界面卡牌动画状态重置（每次开启都是全新 hover 起点，避免上次状态残留）
      this.rewardCardStates = {};
      // T200：跳过/完成按钮 hover 缓动状态重置（避免上次开屏的 hover 进度残留）
      this._skipBtnHoverProgress = 0;

      gs.scene = 'defeat';

  }
  generateRelicReward(pool, weights) {
    if (!pool || pool.length === 0) return null;
    let rarity = this.weightedRandom(weights);
    let candidates = pool.filter(r => r.rarity === rarity);
    if (candidates.length === 0) candidates = pool.filter(r => r.rarity === 'common');
    if (candidates.length === 0) candidates = pool;
    return {...pick(candidates)};
  }
  generateCardRewards(node) {
    let pool = [];
    let rarityWeights = { basic: 0, common: 60, uncommon: 30, rare: 10 };
    if (node?.type === 'elite') rarityWeights = { basic: 0, common: 30, uncommon: 50, rare: 20 };
    if (node?.type === 'boss') rarityWeights = { basic: 0, common: 0, uncommon: 40, rare: 60 };
    let available = CARD_DATA.filter(c => c.rarity !== 'basic');
    let rewards = [];
    // T195：while+attempts 防止加权随机撞色返回重复卡牌导致 3选1 只显示 2 张的 bug
    // 旧逻辑：i 次循环若 pick 出已存在的 id 则直接跳过 → 极端情况下（卡池小+权重偏稀有）会少于 3 张
    // 新逻辑：候选池先排除已选 id，无候选才 fallback 到 common / 全池；attempts 防止死循环
    for (let i = 0; i < 3; i++) {
      let picked = null;
      let attempts = 0;
      while (!picked && attempts < 20) {
        let rarity = this.weightedRandom(rarityWeights);
        let candidates = available.filter(c => c.rarity === rarity && !rewards.find(r => r.id === c.id));
        if (candidates.length === 0) candidates = available.filter(c => c.rarity === 'common' && !rewards.find(r => r.id === c.id));
        if (candidates.length === 0) candidates = available.filter(c => !rewards.find(r => r.id === c.id));
        if (candidates.length === 0) break;  // 没有更多不重复的牌可抽（卡池耗尽）
        picked = pick(candidates);
        attempts++;
      }
      if (picked) rewards.push({...picked});
    }
    return rewards;
  }
  weightedRandom(weights) {
    let total = Object.values(weights).reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let [key, w] of Object.entries(weights)) {
      r -= w;
      if (r <= 0) return key;
    }
    return 'common';
  }
  // T244：收起战报 → 开出奖励界面。点击提前收起与到点自动收起走同一条出口，状态只写一处。

    this.rewardCardStates = {};

                   [['放倒 ', 'textDim', _la], [n(f.kills), 'goldBright', _na], [' 只', 'textDim', _la]]);
    _row(py + 148, [['最深一击 ', 'textDim', _la], [n(f.maxHit), 'goldBright', _na]],

                   [['抵达第 ', 'textDim', _la], [n(f.floor), 'goldBright', _na], [' 层', 'textDim', _la]]);
    // ⑤ 本场增量：最后一回合刚打完，玩家最想知道"这一场我打得怎么样"
    textAlign(CENTER, CENTER);

  update() {
    super.update();
    // Deck Viewer 打开时暂停战斗所有更新（敌人回合/粒子/漂浮字/震屏/悬停检测/鼠标交互）
    // 体验上等价于"查阅手稿时时间静止"，玩家不会因开面板遭到敌人攻击，同时避免大量 O(N) 更新浪费算力
    if (gs.showDeckViewer) return;
    // T244：战报计时必须排在 battleEnding 冻结**之前** —— 二者是并行的：
    //   击杀动画照跑，战报照显示；到点（或玩家点击）才收起战报、开出奖励界面。
    if (this.showRunRecap) {
      this.runRecapT++;
      if (millis() - (this._recapAt || 0) >= RUN_RECAP_STYLE.holdMs) this._closeRunRecap();
      return;
    }
    if (this.battleEnding) return;
    let cs = gs.combatState;
    // 卡牌动画
    this.cardAnimations = this.cardAnimations.filter(a => {
      a.progress += 1 / a.duration;
      return a.progress < 1;
    });
    // 敌人动画衰减
    this.enemyAnim.shakeX *= 0.8;
    this.enemyAnim.shakeY *= 0.8;
    this.enemyAnim.flashAlpha *= 0.85;
    this.playerAnim.shakeX *= 0.8;
    this.playerAnim.shakeY *= 0.8;
    this.playerAnim.flashAlpha *= 0.85;
    // 背景符文
    this.bgGlyphs.forEach(g => { g.x += g.vx; g.y += g.vy; });
    // 视差层偏移缓动
    if (this.bgLayers) {
      let mouseOffX = mx() - GAME_W / 2;
      let mouseOffY = my() - GAME_H / 2;
      for (let layer of this.bgLayers) {
        layer.targetOffsetX = mouseOffX * layer.depth;
        layer.targetOffsetY = mouseOffY * layer.depth;
        layer.offsetX = lerp(layer.offsetX, layer.targetOffsetX, 0.1);
        layer.offsetY = lerp(layer.offsetY, layer.targetOffsetY, 0.1);
      }
    }
    particles.update();
    screenShake.update();
    // 回合开始延迟
    if (this.turnStartDelay > 0) {
      this.turnStartDelay--;
      return;
    }
    // 敌人回合
    if (cs.turnPhase === 'enemy' && this.cardAnimations.length === 0) {
      if (this.enemyTurnDelay < 30) {
        this.enemyTurnDelay++;
      } else {
        this.enemyTakeTurn();
      }
    }
    // 鼠标悬停
    if (cs.turnPhase === 'player') {
      this.hoveredCard = null;
      let totalCards = cs.hand.length;
      if (totalCards > 0) {
        let spacing = totalCards > 6 ? Math.min(95, 580 / totalCards) : 110;
        let startX = GAME_W * 0.5 - (totalCards - 1) * spacing / 2;
        let baseY = GAME_H * 0.78;
        let arcHeight = clamp(40 - totalCards * 3, 10, 40);
        // 从右到左检测，优先命中最上层（后绘制）的卡牌
        for (let i = totalCards - 1; i >= 0; i--) {
          let card = cs.hand[i];
          let centerOffset = (i - (totalCards - 1) / 2) / Math.max(1, (totalCards - 1) / 2);
          let arcY = baseY - arcHeight * (1 - centerOffset * centerOffset);
          let cx = startX + i * spacing;
          let cy = arcY;
          // 悬停检测使用放大后的判定区域（与放大后的悬停卡大小匹配）
          let hoverW = CARD_W * 1.12;
          let hoverH = CARD_H * 1.12;
          if (mx() > cx - hoverW / 2 && mx() < cx + hoverW / 2 &&
              my() > cy - hoverH / 2 && my() < cy + hoverH / 2) {
            this.hoveredCard = card;
            break;
          }
        }
      }
      // 奖励界面
      if (this.showRewardScreen) {
        this.hoveredRewardIdx = -1;
        this.hoveredRelicReward = false;
        if (this.pendingRewards) {
          // 卡牌hover检测（T195：按索引判断；T198：补"达限额"守卫，避免 T197 灰色遮罩的卡仍能 hover 放大）
          for (let i = 0; i < this.pendingRewards.cards.length; i++) {
            // 1) 已领卡：不响应 hover（视觉 dim + 文字"已选择"）
            if (this.pendingRewards.cardsClaimed.includes(i)) continue;
            // 2) 达限额未选卡：T198 补的守卫，不响应 hover（视觉 dim 无文字）；与 T197 遮罩同步
            if (this.pendingRewards.cardsClaimed.length >= this.pendingRewards.cardsToPick) continue;
            let rx = GAME_W / 2 + (i - 1) * 170;
            let ry = GAME_H / 2 - 65;
            if (mx() > rx - CARD_W / 2 && mx() < rx + CARD_W / 2 &&
                my() > ry - CARD_H / 2 && my() < ry + CARD_H / 2) {
              this.hoveredRewardIdx = i;
            }
          }
          // 遗物hover检测（有遗物且未领取才检测）
          if (this.pendingRewards.relic && !this.pendingRewards.relicClaimed) {
            let relicX = GAME_W / 2;
            let relicY = GAME_H / 2 + 115;
            let relicW = 280;
            let relicH = 90;
            if (mx() > relicX - relicW / 2 && mx() < relicX + relicW / 2 &&
                my() > relicY - relicH / 2 && my() < relicY + relicH / 2) {
              this.hoveredRelicReward = true;
            }
          }
        }
        // skip/完成按钮hover
        let skipX = GAME_W / 2 - 50;
        let skipY = GAME_H / 2 + 185;
        this.skipBtn = { x: skipX, y: skipY, w: 100, h: 35, hovered: mx() > skipX && mx() < skipX + 100 && my() > skipY && my() < skipY + 35 };
      }
    }
  }

  drawBattleBackground() {
    // 哥特圣殿废墟背景
    // 7 层视差架构
    //   A-0 森林&星空层（星空+森林剪影+巨符文+顶部符文饰带）— bgLayers[0]

    //   A-4 中景石柱群（石柱+古符文+拱门）— bgLayers[4]
    //   A-5 雾气+克苏鲁眼睛 — bgLayers[5]
    //   A-6 浮动符文（光晕版）— bgLayers[6]
    //   A-7 玩家/敌人仪式符文圆阵（独立绘制）

    // ===== 非视差底色（半透明：3D 深渊透过战斗场景显现，受击时辉光涌动）=====
    noStroke();
    fill(18, 16, 31, 140);
    rect(0, 0, GAME_W, GAME_H);
    // 极暗顶部渐变（让顶部巨符文更显眼）
    for (let i = 0; i < 6; i++) {
      fill(20, 12, 30, 8);
      rect(0, i * 25, GAME_W, 25);
    }

    // Layer 0: 森林&星空层（depth 0.02）
    // 4 类子元素：star（星空）+ forest（森林剪影 3 层纵深）+ giantRune（升级版圆形光晕）+ runeStrip（顶部符文饰带）
    // 渲染顺序：星空 → 森林剪影（后→中→前，3 层纵深）→ 巨符文（细线条+呼吸圆形光晕）→ 顶部符文饰带
    // 位于圣殿层之前 → 可被高塔/石柱/雾等前景层遮挡
    if (this.bgLayers && this.bgLayers[0]) {
      let layer = this.bgLayers[0];
      push();
      translate(layer.offsetX, layer.offsetY);
      noStroke();
      for (let el of layer.elements) {
        if (el.kind === 'star') {
          // 闪烁星点（异步 twinkle + 十字光芒 + 光晕）
          let twinkle = 0.7 + 0.3 * sin(frameCount * el.twinkleSpeed + el.twinklePhase);
          let starAlpha = el.brightness * twinkle;
          // 较亮的星才有十字光芒（size > 2）
          if (el.size > 2) {
            stroke(255, 250, 220, starAlpha * 0.5 * 255);
            strokeWeight(0.5);
            line(el.x - el.size * 2.5, el.y, el.x + el.size * 2.5, el.y);
            line(el.x, el.y - el.size * 2.5, el.x, el.y + el.size * 2.5);
            noStroke();
          }
          // 星核（白偏黄）
          fill(255, 250, 220, starAlpha * 230);
          ellipse(el.x, el.y, el.size, el.size);
          // 星外光晕（小而柔）
          fill(255, 250, 220, starAlpha * 80);
          ellipse(el.x, el.y, el.size * 2.5, el.size * 2.5);
        } else if (el.kind === 'forest') {
          // 森林剪影（深紫色调统一，noise 控制树高变化）
          // 单层树海：底部一条不规则曲线 + 顶部随机树高
          fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], el.alpha);
          beginShape();
          vertex(-10, GAME_H + 30);
          for (let x = -10; x <= GAME_W + 10; x += 5) {
            // 树高：基于 noise 的 0.3-1.0 系数 × 配置高度
            let treeH = el.height * (0.3 + 0.7 * noise(x * 0.012 + el.noiseSeed));
            vertex(x, el.y - treeH);
          }
          vertex(GAME_W + 10, GAME_H + 30);
          endShape(CLOSE);
        } else if (el.kind === 'giantRune') {
          // 呼吸圆形光晕 + 细线条
          // 删去原 4 层 stroke 渐变光晕（线条过粗 8/4.5/2.5/1.5px）
          // 新版：参考 hangCharm 风格做 5 层同心圆 fill 光晕（10%/20%/35%/55%/85% alpha）
          //       线条改细：0.7px 外层 + 0.5px 内层
          // 呼吸：噪声主控（0.95-1.15）+ 副频 sin（±0.10）+ 偶发圣光脉冲（+0.20）
          push();
          let t = frameCount + el.noiseSeed * 100;
          let noisePulse = 0.95 + 0.20 * noise(t * 0.04);
          let sinPulse = 0.10 * sin(t * 0.07);
          let burst = (sin(t * 0.011) > 0.93) ? 0.20 : 0;
          let breathe = noisePulse + sinPulse + burst;
          // 符文中心（局部坐标，y 略偏上对应符文视觉重心）
          let cx = 0;
          let cy = -el.h * 0.05;
          // ---- 5 层同心圆 fill 光晕（参考 hangCharm 渐变结构）----
          noStroke();
          // 1) 最外层光晕（最大圆，alpha 10%）
          fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], Math.min(255, 255 * 0.10 * breathe));
          ellipse(cx, cy, el.w * 2.0, el.h * 1.4);
          // 2) 外层光晕（alpha 20%）
          fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], Math.min(255, 255 * 0.20 * breathe));
          ellipse(cx, cy, el.w * 1.4, el.h * 1.0);
          // 3) 中层光晕（alpha 35%）
          fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], Math.min(255, 255 * 0.35 * breathe));
          ellipse(cx, cy, el.w * 0.9, el.h * 0.65);
          // 4) 内层光晕（alpha 55%）
          fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], Math.min(255, 255 * 0.55 * breathe));
          ellipse(cx, cy, el.w * 0.50, el.h * 0.36);
          // 5) 核心光晕（最小圆，白偏黄，alpha 85%）
          fill(255, 240, 200, Math.min(255, 255 * 0.85 * breathe));
          ellipse(cx, cy, el.w * 0.20, el.h * 0.14);
          // ---- 符文线条（细线，0.7px 外层轮廓 + 0.5px 内层三角）----
          noFill();
          // 外层符文轮廓（0.7px 锐光）
          stroke(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], Math.min(255, 255 * breathe));
          strokeWeight(0.7);
          beginShape();
          vertex(-el.w * 0.4, el.h * 0.4);
          vertex(-el.w * 0.4, -el.h * 0.1);
          vertex(-el.w * 0.15, -el.h * 0.1);
          vertex(0, -el.h * 0.5);
          vertex(el.w * 0.15, -el.h * 0.1);
          vertex(el.w * 0.4, -el.h * 0.1);
          vertex(el.w * 0.4, el.h * 0.4);
          vertex(0, el.h * 0.15);
          endShape(CLOSE);
          // 内层三角（细线 0.5px，白偏黄）
          stroke(255, 240, 200, Math.min(255, 255 * breathe));
          strokeWeight(0.5);
          beginShape();
          vertex(0, -el.h * 0.35);
          vertex(-el.w * 0.25, el.h * 0.3);
          vertex(el.w * 0.25, el.h * 0.3);
          endShape(CLOSE);
          noStroke();
          pop();
        } else if (el.kind === 'runeStrip') {
          // 顶部符文饰带（移自 crack 层）
          push();
          translate(el.x, el.y);
          rotate(el.angle);
          noStroke();
          for (let si = 0; si < el.symbols.length; si++) {
            let sy = si * 22;
            // 光晕
            fill(201, 168, 76, 25);
            ellipse(0, sy, 22, 22);
            // 符文
            fill(201, 168, 76, 90);
            textSize(14);
            textAlign(CENTER, CENTER);
            text(el.symbols[si], 0, sy);
          }
          pop();
        }
      }
      noStroke();
      pop();
    }

    // Layer 1: 远景圣殿群（depth 0.05）
    if (this.bgLayers && this.bgLayers[1]) {
      let layer = this.bgLayers[1];
      push();
      translate(layer.offsetX, layer.offsetY);
      noStroke();
      for (let el of layer.elements) {
        push();
        translate(el.x, el.baseY !== undefined ? el.baseY : el.y);
        if (el.lean) rotate(el.lean);
        if (el.kind === 'tower') {
          // 塔楼绘制
          // 结构：主体 → 顶部 5 雉堞 → 顶部小尖 → 主体左侧阴影 → 主体右侧高光 →
          //       浅色面 12 个砖块色块 → 塔窗（3-4 个放大版）→ 底部条带 → 塔顶浅色描边（最后绘制，覆盖塔尖与雉堞顶部）
          // ---- 1. 主体填充（不透明，几乎全填充）----
          fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], el.alpha);
          rect(-el.w / 2, -el.h, el.w, el.h);
          // ---- 2. 顶部 5 个雉堞（差异化高度，模拟残破/风化感）----
          for (let i = 0; i < 5; i++) {
            let cx = -el.w / 2 + (i + 0.5) * el.w / 5;
            let ch = 8 + noise(el.noiseSeed + i * 1.7) * 10;
            rect(cx - el.w / 10, -el.h - ch, el.w / 5, ch);
          }
          // ---- 3. 塔顶小尖（细长尖顶/finial）----
          fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], Math.min(255, el.alpha + 20));
          let spireX = 0;
          let spireY = -el.h - 18;
          triangle(spireX - 4, spireY + 10, spireX + 4, spireY + 10, spireX, spireY - 12);
          rect(spireX - 1.2, spireY - 18, 2.4, 8);
          // ---- 4. 主体左侧阴影条带（3D 立体感）----
          let darkR = Math.max(0, el.fillRGB[0] - 10);
          let darkG = Math.max(0, el.fillRGB[1] - 8);
          let darkB = Math.max(0, el.fillRGB[2] - 6);
          fill(darkR, darkG, darkB, Math.min(255, el.alpha + 30));
          rect(-el.w / 2, -el.h, el.w * 0.18, el.h);
          // ---- 5. 主体右侧高光条带（3D 立体感）----
          let lightR = Math.min(255, el.fillRGB[0] + 12);
          let lightG = Math.min(255, el.fillRGB[1] + 10);
          let lightB = Math.min(255, el.fillRGB[2] + 8);
          fill(lightR, lightG, lightB, Math.min(255, el.alpha + 20));
          rect(el.w / 2 - el.w * 0.12, -el.h, el.w * 0.12, el.h);
          // 塔窗
          //       数量 3-4 个（h>0.5 屏时 4 个），Y 位置均匀分布
          //       渲染顺序：在砖块色块之后 → 覆盖任何潜在的重叠
          let windowCount = el.h > GAME_H * 0.5 ? 4 : 3;
          let winW = 8;
          let winH = 14;
          for (let w = 0; w < windowCount; w++) {
            let wy = -el.h * (0.25 + w * (0.55 / Math.max(1, windowCount - 1)));
            // 塔窗外框（深色边框）
            fill(8, 4, 16, Math.min(255, el.alpha + 50));
            rect(-winW / 2 - 1, wy - 1, winW + 2, winH + 2, 1);
            // 塔窗内芯
            fill(200, 180, 100, 110);
            rect(-winW / 2, wy, winW, winH, 1);
            // 塔窗内芯顶部高光
            fill(240, 220, 150, 60);
            rect(-winW / 2 + 1, wy + 1, winW - 2, 2, 1);
          }
          // ---- 8. 底部基座条带（加深 1 档，营造根基感）----
          let baseR = Math.max(0, el.fillRGB[0] - 6);
          let baseG = Math.max(0, el.fillRGB[1] - 5);
          let baseB = Math.max(0, el.fillRGB[2] - 3);
          fill(baseR, baseG, baseB, Math.min(255, el.alpha + 40));
          rect(-el.w / 2, -6, el.w, 6);
          // 塔顶浅色描边
          //       水平亮线：1.5px 高，覆盖整个塔楼顶部 + 浅紫白色（主体色 +35/+30/+25）
          //       顶层亮线：2px 高，仅覆盖 5 个雉堞顶部（视觉强调塔顶尖端）
          //       渲染顺序：最后绘制 → 覆盖在雉堞、小尖之上 → 形成清晰"塔顶与天空的分界线"
          let topR = Math.min(255, el.fillRGB[0] + 35);
          let topG = Math.min(255, el.fillRGB[1] + 30);
          let topB = Math.min(255, el.fillRGB[2] + 25);
          fill(topR, topG, topB, 255);
          // 主体顶部水平亮线（1.5px 高，覆盖整个塔楼）
          rect(-el.w / 2, -el.h - 0.5, el.w, 1.5);
          // 5 个雉堞顶部各加 1px 亮线（强化塔顶尖端）
          for (let i = 0; i < 5; i++) {
            let cx = -el.w / 2 + (i + 0.5) * el.w / 5;
            let ch = 8 + noise(el.noiseSeed + i * 1.7) * 10;
            rect(cx - el.w / 10, -el.h - ch - 0.5, el.w / 5, 1.5);
          }
          // 塔顶尖顶小亮线
          rect(spireX - 1.5, -el.h - 30, 3, 1);
        }
        pop();
      }
      pop();
    }

    // Layer 2: 地面弧形层（depth 0.08）
    // 渲染顺序：forestSky(0) → arch(1) → ground(2) → crack(3) → pillar(4) → fog(5) → glyph(6)
    // 6 个不同大小椭圆拼接，顶部"地平线"曲线，底部超出画面
    // 1-2 相近色（主色 75,55,95 + 阴影色 58,42,78），哥特怪诞艺术风格
    // 顶部高光细线（亮一档）增强层次；不透明填充（alpha 250-255）
    //   - 主色 28,18,38 + 内层高光 50,35,60
    //   - 2-3 处/椭圆，分布于上半部可见区域
    // 可被 pillar 遮挡（pillar 之后绘制） + 可遮挡 arch 底部（arch 之后绘制）
    if (this.bgLayers && this.bgLayers[2]) {
      let layer = this.bgLayers[2];
      push();
      translate(layer.offsetX, layer.offsetY);
      noStroke();
      for (let el of layer.elements) {
        // 1) 主体填充（不透明，主体色 + 阴影色交替）
        fill(el.fillRGB[0], el.fillRGB[1], el.fillRGB[2], el.alpha);
        // 完整椭圆：顶部为"地平线"曲线，底部超出画面
        ellipse(el.x, el.y, el.rx * 2, el.ry * 2);
        // 暗紫阴影斑块
        //   - 主暗紫斑（参考石柱凹陷 12,6,18 + 椭圆中调适应，色调偏柔 28,18,38）
        //   - 内层微高光（参考石柱凹陷 28,18,34，色调偏柔 50,35,60）
        //   - 偏移 -1.5,-1.5 模拟凹陷顶部反射
        if (el.spots && el.spots.length > 0) {
          for (let s = 0; s < el.spots.length; s++) {
            let sp = el.spots[s];
            // 椭圆参数坐标：spotX = el.x + cos(theta) * rx * ratio * 2, 同理 ry
            let spotX = el.x + cos(sp.theta) * el.rx * sp.ratio * 2;
            let spotY = el.y + sin(sp.theta) * el.ry * sp.ratio * 2;
            // 主暗紫斑（参考石柱凹陷主色 12,6,18 / 7x8 尺寸）
            fill(28, 18, 38, 170);
            ellipse(spotX, spotY, sp.size[0], sp.size[1]);
            // 内层微高光（参考石柱凹陷内层 28,18,34 / 3.5x4 尺寸，偏移 -0.8,-0.8）
            fill(50, 35, 60, 110);
            ellipse(spotX - 1.5, spotY - 1.5, sp.size[0] * 0.5, sp.size[1] * 0.5);
          }
        }
        // 3) 顶部高光（仅主色椭圆 highlight=true，模拟光照射地平线）
        if (el.highlight) {
          // 高光色：比主体色亮一档（+20/18/15）
          let hR = Math.min(255, el.fillRGB[0] + 20);
          let hG = Math.min(255, el.fillRGB[1] + 18);
          let hB = Math.min(255, el.fillRGB[2] + 15);
          noFill();
          stroke(hR, hG, hB, 120);
          strokeWeight(1.4);
          // 顶部弧线（从 PI+0.25 到 2*PI-0.25，主体 90% 宽度）
          arc(el.x, el.y, el.rx * 2 * 0.9, el.ry * 2 * 0.9, PI + 0.25, 2 * PI - 0.25);
          // 顶部第二层细高光（更亮、更细）
          noFill();
          stroke(Math.min(255, hR + 15), Math.min(255, hG + 12), Math.min(255, hB + 10), 80);
          strokeWeight(0.8);
          arc(el.x, el.y, el.rx * 2 * 0.95, el.ry * 2 * 0.95, PI + 0.15, 2 * PI - 0.15);
        }
        // 4) 底部过渡渐变（顶部到底部颜色微变，从主体色 → 略深一档）
        // 用一个小圆作为底部深色阴影（在椭圆底部，模拟"深谷"）
        noStroke();
        let sR = Math.max(0, el.fillRGB[0] - 8);
        let sG = Math.max(0, el.fillRGB[1] - 6);
        let sB = Math.max(0, el.fillRGB[2] - 4);
        fill(sR, sG, sB, 180);
        ellipse(el.x, el.y + el.ry * 0.5, el.rx * 1.5, el.ry * 0.6);
      }
      noStroke();
      pop();
    }

    // Layer 3: 裂纹 + 悬挂物（depth 0.4）
    // 渲染顺序：forestSky(0) → arch(1) → ground(2) → crack(3) → pillar(4) → fog(5) → glyph(6)
    // hangCharm 摆动线起点在画面外，长度/频率/相位/幅度差异化
    if (this.bgLayers && this.bgLayers[3]) {
      let layer = this.bgLayers[3];
      push();
      translate(layer.offsetX, layer.offsetY);
      noStroke();
      // 递归绘制裂纹
      function drawCrackBranch(x, y, angle, depth, maxDepth) {
        if (depth > maxDepth) return;
        let len = 28 - depth * 5;
        let ex = x + cos(angle) * len;
        let ey = y + sin(angle) * len;
        let a = 70 - depth * 12;
        cStroke('goldDim', a);
        strokeWeight(1.8 - depth * 0.3);
        line(x, y, ex, ey);
        if (depth < maxDepth - 1) {
          drawCrackBranch(ex, ey, angle + 0.5 + 0.3 * sin(x), depth + 1, maxDepth);
          drawCrackBranch(ex, ey, angle - 0.5 - 0.3 * cos(y), depth + 1, maxDepth);
        }
        // 末端发光
        if (depth === maxDepth) {
          noStroke();
          fill(201, 168, 76, 25);
          ellipse(ex, ey, 6, 6);
        }
      }
      for (let el of layer.elements) {
        if (el.kind === 'crack') {
          // 沿用项目 memory：crack 配置
          push();
          translate(el.x, el.y);
          // 递归裂纹
          drawCrackBranch(0, 0, -PI / 2, 0, 3);
          pop();
        } else if (el.kind === 'hangCharm') {
          // 顶部悬挂坠饰
          // 摆动线起点 yStart 位于画面外顶部（负值），长度 lineLen 差异化 200-380px
          // 摆动异步：swingFreq 差异化 0.022-0.040，swingPhase 异步 0-2π
          // 摆动幅度 swingAmp 差异化 4-10，charmSize/glyphSize 放大，glowAlpha 增强
          push();
          translate(el.x, el.y);
          // 摆动线（起点 yStart 画面外，长度 lineLen，颜色柔和金）
          let yStart = el.yStart !== undefined ? el.yStart : -180;       // 兼容兜底
          let lineLen = el.lineLen !== undefined ? el.lineLen : 240;
          let swingFreq = el.swingFreq !== undefined ? el.swingFreq : 0.04;
          let swingPhase = el.swingPhase !== undefined ? el.swingPhase : el.idx;
          let swingAmp = el.swingAmp !== undefined ? el.swingAmp : 4;
          let charmSize = el.charmSize !== undefined ? el.charmSize : 30;
          let glyphSize = el.glyphSize !== undefined ? el.glyphSize : 15;
          let glowAlpha = el.glowAlpha !== undefined ? el.glowAlpha : 120;
          // 摆动偏移：swing 沿 X 方向，swingY 沿 Y 方向（小幅度同步但异步相位）
          let swing = sin(frameCount * swingFreq + swingPhase) * swingAmp;
          let swingY = cos(frameCount * swingFreq * 0.7 + swingPhase) * (swingAmp * 0.3);
          // 圆坠底部 y 坐标 = 摆动线起点 y + lineLen + swingY
          let charmY = yStart + lineLen + swingY;
          // 悬挂线（深金 + 浅金双层）
          noFill();
          // 外层（深金，加粗）
          stroke(122, 101, 48, 70);
          strokeWeight(1.8);
          line(0, yStart, swing, charmY);
          // 内层（亮金）
          stroke(201, 168, 76, 50);
          strokeWeight(0.9);
          line(0, yStart, swing, charmY);
          // 顶端固定环
          noStroke();
          fill(122, 101, 48, 130);
          ellipse(0, yStart, 9, 6);
          fill(201, 168, 76, 90);
          ellipse(0, yStart, 5, 3);
          // 圆坠（外光晕 + 核心 + 内核）
          fill(201, 168, 76, glowAlpha);
          ellipse(swing, charmY, charmSize, charmSize);
          fill(240, 208, 96, glowAlpha + 20);
          ellipse(swing, charmY, charmSize * 0.55, charmSize * 0.55);
          fill(255, 235, 170, glowAlpha + 30);
          ellipse(swing, charmY, charmSize * 0.25, charmSize * 0.25);
          // 外层光晕扩散
          fill(201, 168, 76, glowAlpha * 0.4);
          ellipse(swing, charmY, charmSize * 1.8, charmSize * 1.8);
          // 4) 中心符文（放大 + 暗色 + 高对比）
          fill(40, 25, 10, 220);
          textSize(glyphSize);
          textAlign(CENTER, CENTER);
          let charmGlyphs = ['☿', '♁', '⚗', '⛤', '✠', '☽', '☉', '♆', '♇'];
          text(charmGlyphs[el.idx % charmGlyphs.length], swing, charmY);
          // 摆动线终点连接环
          noFill();
          stroke(122, 101, 48, 110);
          strokeWeight(1.0);
          ellipse(swing, charmY - charmSize * 0.55, charmSize * 0.3, charmSize * 0.18);
          noStroke();
          pop();
        }
      }
      noStroke();
      pop();
    }

    // 渲染顺序：forestSky(0) → arch(1) → ground(2) → crack(3) → pillar(4) → fog(5) → glyph(6) — 共 7 层

    // Layer 4: 中景石柱群（depth 0.15）
    if (this.bgLayers && this.bgLayers[4]) {
      let layer = this.bgLayers[4];
      push();
      translate(layer.offsetX, layer.offsetY);
      for (let el of layer.elements) {
        push();
        if (el.kind === 'pillar') {
          //   - 藤蔓 swing 范围扩展：lx 超出柱身边缘 12px，后侧藤蔓在柱身左侧伸出可见
          //   - 石柱宽度 2x：30-38 → 60-75，柱间距充裕（212/342/242px）不覆盖背景
          //   - 配套元素同比例放大：阴影条带 10→18、高光条带 5→8、裂纹 7 段→10 段、
          //     凹凸斑点 4×5→7×8、3×4→5×6、古符文 8→10、花朵 8→12、叶片 0.55×0.28→0.75×0.38
          //   - 藤蔓缠绕：后侧藤蔓（被石柱遮挡）→ 石柱本体 → 前侧藤蔓（叠加在石柱前）= 立体缠绕效果
          //   - 盛开的花朵：5 瓣血色花朵（花瓣阴影/主体/高光 3 层）+ 雄蕊（中央金黄 + 5 散点）+ 装饰叶片
          translate(el.x, el.y);
          rotate(el.tilt);
          let colTop = -el.h;
          let colBot = 0;
          let colH = el.h; // 总高
          // 预计算藤蔓路径
          let vinePath = [];
          let oscCount = 3.0;
          for (let t = 0; t <= 1; t += 0.02) {
            let swing1 = sin(t * PI * oscCount + el.noiseSeed * 0.25);
            let swing2 = sin(t * PI * oscCount * 1.7 + el.noiseSeed) * 0.28;
            let totalSwing = (swing1 + swing2) * 1.0; // 满幅 ±1.0
            let lx = totalSwing * (el.w / 2 + 12);
            let ly = colTop + t * colH;
            vinePath.push({ lx, ly, isFront: totalSwing > 0 });
          }
          // ---- 1. 后侧藤蔓（绘制在石柱本体之前，柱身左侧伸出部分可见）----
          noFill();
          stroke(40, 100, 40, 130);
          strokeWeight(1.6);
          for (let i = 0; i < vinePath.length - 1; i++) {
            let p1 = vinePath[i];
            let p2 = vinePath[i + 1];
            if (!p1.isFront && !p2.isFront) {
              line(p1.lx, p1.ly, p2.lx, p2.ly);
            }
          }
          noStroke();
          // ---- 2. 石柱主体填充（不规则顶部锯齿）----
          fill(42, 32, 48, 255);
          beginShape();
          vertex(-el.w / 2, colTop);
          vertex(el.w / 2, colTop);
          // 顶部破损锯齿（5 顶点）
          vertex(el.w / 2, colTop + 6 + sin(el.noiseSeed) * 4);
          vertex(el.w / 2 - 3, colTop + 18);
          vertex(el.w / 2 + 5 * sin(el.noiseSeed + 1), colTop + 30);
          vertex(el.w / 2 - 2, colTop + 45);
          vertex(el.w / 2, colTop + 60);
          vertex(el.w / 2, colBot);
          vertex(-el.w / 2, colBot);
          vertex(-el.w / 2, colTop + 12 - sin(el.noiseSeed + 2) * 5);
          endShape(CLOSE);
          // 3D 阴影：右侧深暗色条带
          fill(15, 10, 20, 220);
          beginShape();
          vertex(el.w / 2, colTop + 60);
          vertex(el.w / 2, colBot);
          vertex(el.w / 2 - 18, colBot);
          vertex(el.w / 2 - 18, colTop + 60);
          endShape(CLOSE);
          // 3D 高光：左侧浅亮色条带
          fill(82, 65, 96, 115);
          beginShape();
          vertex(-el.w / 2, colTop + 12);
          vertex(-el.w / 2, colBot);
          vertex(-el.w / 2 + 8, colBot);
          vertex(-el.w / 2 + 8, colTop + 12);
          endShape(CLOSE);
          // 风化横向裂纹
          noFill();
          stroke(8, 4, 14, 200);
          strokeWeight(0.9);
          let crackRatios = [0.18, 0.35, 0.55, 0.72, 0.88];
          for (let c = 0; c < crackRatios.length; c++) {
            let cy = colTop + colH * crackRatios[c];
            let crackSeed = el.noiseSeed + c * 11.3;
            beginShape();
            let numSeg = 10;
            for (let s = 0; s <= numSeg; s++) {
              let x = -el.w / 2 + 2 + (s / numSeg) * (el.w - 4);
              let yJitter = sin(crackSeed + s * 0.93) * 2.0;
              vertex(x, cy + yJitter);
            }
            endShape();
          }
          noStroke();
          // 凹凸斑点：3 处凹陷 + 2 处凸起
          // 凹陷（深色斑点）
          let dentRatios = [0.25, 0.55, 0.80];
          for (let d = 0; d < dentRatios.length; d++) {
            let dy = colTop + colH * dentRatios[d];
            let dentX = -el.w / 2 + 12 + ((d * 11 + el.noiseSeed * 3) % (el.w - 24));
            fill(12, 6, 18, 175);
            ellipse(dentX, dy, 7, 8);
            fill(28, 18, 34, 120);
            ellipse(dentX - 0.8, dy - 0.8, 3.5, 4);
          }
          // 凸起（浅色斑点）
          let bumpRatios = [0.40, 0.68];
          for (let d = 0; d < bumpRatios.length; d++) {
            let by = colTop + colH * bumpRatios[d];
            let bumpX = el.w / 2 - 14 - ((d * 13 + el.noiseSeed * 5) % (el.w - 28));
            fill(95, 75, 110, 100);
            ellipse(bumpX, by, 5, 6);
          }
          // 古符文阴刻：5 个沿柱身分布
          noFill();
          stroke(140, 100, 60, 80);
          strokeWeight(1.2);
          let runes = ['☿', '♁', '⚗', '⛤', '✠'];
          let runeCount = 5;
          let rs = 10;
          for (let s = 0; s < runeCount; s++) {
            let ratio = (s + 1) / (runeCount + 1); // 0.167, 0.333, 0.5, 0.667, 0.833
            let sy = colTop + colH * ratio;
            let g = runes[s];
            if (g === '☿') {
              ellipse(0, sy, rs * 0.7, rs * 0.7);
              line(0, sy - rs * 0.35, 0, sy + rs * 0.95);
              line(-rs * 0.5, sy + rs * 0.35, rs * 0.5, sy + rs * 0.35);
            } else if (g === '♁') {
              circle(0, sy, rs);
              line(-rs * 0.75, sy, rs * 0.75, sy);
              line(0, sy - rs * 0.75, 0, sy + rs * 0.75);
            } else if (g === '⚗') {
              // ⚗：圆+十字+斜杠
              circle(0, sy, rs);
              line(-rs * 0.6, sy - rs * 0.6, rs * 0.6, sy + rs * 0.6);
              line(0, sy - rs * 0.9, 0, sy + rs * 0.9);
            } else if (g === '⛤') {
              line(-rs * 0.6, sy - rs * 0.6, rs * 0.6, sy + rs * 0.6);
              line(-rs * 0.6, sy + rs * 0.6, rs * 0.6, sy - rs * 0.6);
              line(0, sy - rs * 0.9, 0, sy + rs * 0.9);
            } else if (g === '✠') {
              // ✠：六芒星
              for (let a = 0; a < 6; a++) {
                let ang = a * PI / 3;
                line(0, sy, cos(ang) * rs * 0.75, sy + sin(ang) * rs * 0.75);
              }
            }
          }
          noStroke();
          // 前侧藤蔓
          noFill();
          stroke(50, 130, 50, 195);
          strokeWeight(2.2);
          for (let i = 0; i < vinePath.length - 1; i++) {
            let p1 = vinePath[i];
            let p2 = vinePath[i + 1];
            if (p1.isFront && p2.isFront) {
              line(p1.lx, p1.ly, p2.lx, p2.ly);
            }
          }
          // 藤蔓主茎加粗（沿前侧路径单条 line 增强主体感）
          strokeWeight(2.8);
          stroke(60, 145, 60, 170);
          for (let i = 0; i < vinePath.length - 1; i++) {
            let p1 = vinePath[i];
            let p2 = vinePath[i + 1];
            if (p1.isFront && p2.isFront) {
              // 仅每隔一段画一次主茎，避免过度堆叠
              if (i % 2 === 0) {
                line(p1.lx, p1.ly, p2.lx, p2.ly);
              }
            }
          }
          noStroke();
          // 3 处血色花朵
          let flowerRatios = [0.25, 0.50, 0.75];
          for (let f = 0; f < flowerRatios.length; f++) {
            // 寻找最接近目标 ratio 的前侧藤蔓点（确保花朵在可见处）
            let targetRatio = flowerRatios[f];
            let bestP = null;
            let bestDist = Infinity;
            for (let p of vinePath) {
              let pRatio = (p.ly - colTop) / colH;
              let d = abs(pRatio - targetRatio);
              if (d < bestDist && p.isFront) {
                bestDist = d;
                bestP = p;
              }
            }
            if (!bestP) continue;
            let cx = bestP.lx;
            let cy = bestP.ly;
            let sz = 12;
            // 装饰叶片
            noFill();
            stroke(50, 130, 50, 170);
            strokeWeight(1.4);
            // 左上叶
            push();
            translate(cx - sz * 0.6, cy - sz * 0.25);
            rotate(-0.5);
            fill(45, 115, 45, 140);
            ellipse(0, 0, sz * 0.75, sz * 0.38);
            pop();
            // 右下叶
            push();
            translate(cx + sz * 0.6, cy + sz * 0.25);
            rotate(0.5);
            fill(45, 115, 45, 140);
            ellipse(0, 0, sz * 0.75, sz * 0.38);
            pop();
            noStroke();
            // 5 瓣盛开的花朵
            for (let p = 0; p < 5; p++) {
              let ang = p * TWO_PI / 5 - HALF_PI;
              let px = cx + cos(ang) * sz * 0.42;
              let py = cy + sin(ang) * sz * 0.42;
              push();
              translate(px, py);
              rotate(ang + HALF_PI);
              // 花瓣阴影（深血红）
              noStroke();
              fill(85, 22, 22, 220);
              ellipse(0, 0, sz * 0.72, sz * 0.95);
              // 花瓣主体（血红）
              fill(160, 45, 45, 230);
              ellipse(0, 0, sz * 0.58, sz * 0.82);
              // 花瓣高光（亮红偏粉）
              fill(215, 90, 90, 180);
              ellipse(-sz * 0.1, -sz * 0.18, sz * 0.32, sz * 0.45);
              pop();
            }
            // ---- 9.3 花心与雄蕊 ----
            // 深色花心背景
            fill(40, 18, 10, 240);
            ellipse(cx, cy, sz * 0.4, sz * 0.4);
            // 金黄雄蕊主点
            fill(255, 215, 90, 235);
            ellipse(cx, cy, sz * 0.24, sz * 0.24);
            // 5 颗雄蕊散点（环绕花心）
            for (let d = 0; d < 5; d++) {
              let dang = d * TWO_PI / 5 - HALF_PI;
              let dx = cx + cos(dang) * sz * 0.18;
              let dy = cy + sin(dang) * sz * 0.18;
              fill(255, 200, 60, 225);
              ellipse(dx, dy, sz * 0.11, sz * 0.11);
            }
          }
        } else if (el.kind === 'archway') {
          translate(el.x, el.y);
          rotate(el.tilt);
          noFill();
          // 外拱（半圆拱顶，跨越整个画面高度）
          stroke(42, 32, 48, el.alpha);
          strokeWeight(6);
          beginShape();
          for (let t = 0; t <= PI; t += 0.05) {
            vertex(-el.w / 2 + cos(t) * el.w / 2, -sin(t) * el.h);
          }
          endShape();
          // 内拱（淡色描边）
          stroke(70, 50, 90, 100);
          strokeWeight(4);
          beginShape();
          for (let t = 0; t <= PI; t += 0.05) {
            vertex(-el.w / 2 + 5 + cos(t) * (el.w / 2 - 5), -sin(t) * (el.h - 8) - 4);
          }
          endShape();
          // 拱顶十字（拉高至画面上方）
          stroke(180, 150, 70, 90);
          strokeWeight(2);
          line(0, -el.h + 4, 0, -el.h - 28);
          line(-8, -el.h - 14, 8, -el.h - 14);
          noStroke();
        }
        pop();
      }
      pop();
    }

    // Layer 5: 雾团 + 克苏鲁眼睛（depth 0.25）
    if (this.bgLayers && this.bgLayers[5]) {
      let layer = this.bgLayers[5];
      push();
      translate(layer.offsetX, layer.offsetY);
      noStroke();
      for (let el of layer.elements) {
        if (el.kind === 'fog') {
          let fogX = (el.baseX + frameCount * el.speed) % (GAME_W + el.w) - el.w / 2;
          let sizeMul = 1 + noise(el.phase, frameCount * 0.01) * 0.3;
          // 外层（主色）
          fill(el.cr, el.cg, el.cb, el.alpha);
          ellipse(fogX, el.baseY, el.w * sizeMul, el.h * sizeMul);
          // 内层（更亮、偏蓝/紫）
          fill(el.cr + 25, el.cg + 15, el.cb + 15, el.alpha * 0.5);
          ellipse(fogX + el.w * 0.3, el.baseY + el.h * 0.2, el.w * 0.7 * sizeMul, el.h * 0.6 * sizeMul);
          // 高光中心
          fill(el.cr + 40, el.cg + 30, el.cb + 30, el.alpha * 0.3);
          ellipse(fogX + el.w * 0.25, el.baseY + el.h * 0.15, el.w * 0.4 * sizeMul, el.h * 0.35 * sizeMul);
        } else if (el.kind === 'eye') {
          // 克苏鲁眼睛（神秘窥视）
          // 微微脉动
          let pulse = 1 + 0.1 * sin(frameCount * 0.04 + el.noiseSeed);
          let s = el.size * pulse;
          // 眼白外轮廓
          fill(200, 180, 140, 25);
          ellipse(el.x, el.y, s * 1.3, s);
          // 内轮廓
          noFill();
          stroke(200, 180, 140, 35);
          strokeWeight(1);
          ellipse(el.x + 3, el.y, s * 1.0, s * 0.8);
          // 瞳孔
          noStroke();
          fill(200, 180, 140, 30);
          ellipse(el.x + 2, el.y, s * 0.4, s * 0.6);
          // 黑色深邃点
          fill(0, 80);
          ellipse(el.x + 2, el.y, s * 0.2, s * 0.35);
        }
      }
      // 雾中粒子（细密光点，35 颗）
      for (let i = 0; i < 35; i++) {
        let px = (i * 137.5 + 50 + frameCount * 0.1) % GAME_W;
        let py = (i * 89.3 + 30) % GAME_H;
        let ps = 1 + (i % 3);
        let pa = 8 + (i % 10);
        fill(180, 160, 220, pa);
        ellipse(px, py, ps, ps);
      }
      noStroke();
      pop();
    }

    // Layer 6: 浮动符文（depth 0.35）
    if (this.bgLayers && this.bgLayers[6]) {
      let layer = this.bgLayers[6];
      push();
      translate(layer.offsetX, layer.offsetY);
      this.bgGlyphs.forEach(g => {
        // 外圈光晕（深紫，神秘感）
        noFill();
        stroke(90, 42, 122, 50);
        strokeWeight(1.5);
        ellipse(g.x, g.y, g.size * 2.5, g.size * 2.5);
        stroke(90, 42, 122, 25);
        strokeWeight(1);
        ellipse(g.x, g.y, g.size * 2.8, g.size * 2.8);
        // 内圈光晕（金色）
        noStroke();
        stroke(201, 168, 76, 30);
        strokeWeight(1);
        noFill();
        ellipse(g.x, g.y, g.size * 1.8, g.size * 1.8);
        // 主体符文
        noStroke();
        fill(201, 168, 76, g.alpha * 4); // 提升可见度
        textAlign(CENTER, CENTER);
        textSize(g.size);
        text(g.glyph, g.x, g.y);
        // 内核光晕
        fill(240, 208, 96, 20);
        ellipse(g.x, g.y, g.size, g.size);
        // 6 颗粒子飞散（按相位）
        for (let p = 0; p < 6; p++) {
          let a = p * TAU / 6 + frameCount * 0.02;
          let pr = g.size * 1.2 + 2;
          let px = g.x + cos(a) * pr;
          let py = g.y + sin(a) * pr;
          fill(240, 208, 96, 25);
          ellipse(px, py, 1.5, 1.5);
        }
      });
      pop();
    }

    noStroke();
  }
  drawEnemy() {
    let cs = gs.combatState;
    let ex = GAME_W * 0.65 + this.enemyAnim.shakeX;
    let ey = GAME_H * 0.38 + this.enemyAnim.shakeY;
    let size = cs.enemyData.size || 60;
    let color = cs.enemyData.color;
    // 防御/格挡受击动画衰减（与玩家对称：defendAnim 慢衰减，blockHitFlash 快衰减）
    this.enemyAnim.defendAnim *= 0.92;
    this.enemyAnim.blockHitFlash *= 0.82;
    this.enemyAnim.shieldShatter *= 0.90; // T170：护盾破碎碎片飞散衰减（~500ms）
    this.enemyAnim.defendPulse *= 0.88;   // T170：举盾冲击波扩散衰减（~400ms）
    // 死亡动画
    if (cs.enemyHp <= 0) {
      ey += Math.sin(frameCount * 0.2) * 5;
    }
    push();
    translate(ex, ey);
    // 死亡时的淡出效果
    if (cs.enemyHp <= 0) {
      let deathAlpha = 255 * (1 - Math.min(1, frameCount * 0.02));
      // 用遮罩实现淡出而非tint
      // (tint在2D模式下会覆盖所有fill颜色，因此改为绘制后叠加遮罩)
    }
    // 闪光效果
    if (this.enemyAnim.flashAlpha > 0) {
      fill(255, this.enemyAnim.flashAlpha);
      noStroke();
      ellipse(0, 0, size * 2.5, size * 2.5);
    }
    // 敌人绘制 - 根据类型不同绘制
    this.drawEnemySprite( cs, size, color);
    // T170：敌方格挡护盾视觉重写 —— 圆形多层旋转（红色系，敌我差异化）
    // 触发条件：举盾动画进行中 或 当前存在格挡值
    if (this.enemyAnim.defendAnim > 0.1 || cs.enemyBlock > 0) {
      let isDying = cs.enemyHp <= 0;
      let deathT = this.enemyAnim.deathProgress;
      let deathFade = isDying ? (1 - deathT) : 1;
      let defT = Math.max(this.enemyAnim.defendAnim, cs.enemyBlock > 0 ? 0.3 : 0);
      // 受击闪现叠加：blockHitFlash 提供瞬时高亮脉冲
      let flashBoost = this.enemyAnim.blockHitFlash;
      let baseAlpha = Math.min(1, 0.6 + flashBoost * 0.4) * 180 * defT * deathFade;
      let shieldR = size * 1.35 + Math.sin(frameCount * 0.1) * 4;
      noFill();
      // 外层：8 段虚线弧段圆环（顺时针旋转）—— redBright 主色
      cStroke('redBright', baseAlpha + flashBoost * 60);
      strokeWeight(2 + flashBoost * 2);
      let segCount = 8;
      let segArc = Math.PI / segCount * 0.65; // 每段弧度（含间隙）
      let outerRot = frameCount * 0.008;
      for (let i = 0; i < segCount; i++) {
        let a0 = (i / segCount) * Math.PI * 2 + outerRot;
        arc(0, 0, shieldR * 2, shieldR * 2, a0, a0 + segArc);
      }
      // 中层：完整细圆环（逆时针旋转）—— orangeBright 辅色（火焰感）
      cStroke('orangeBright', (120 + flashBoost * 60) * defT * deathFade);
      strokeWeight(1.2);
      let midR = shieldR * 0.85;
      ellipse(0, 0, midR * 2, midR * 2);
      // 中层装饰：3 段短弧（逆时针旋转，强化运动感）
      let midRot = -frameCount * 0.012;
      cStroke('orangeBright', (180 + flashBoost * 50) * defT * deathFade);
      strokeWeight(1.5);
      for (let i = 0; i < 3; i++) {
        let a0 = (i / 3) * Math.PI * 2 + midRot;
        arc(0, 0, midR * 2, midR * 2, a0, a0 + Math.PI / 6);
      }
      // 内层：符文圆环（保留原符文圈概念，改红色）
      cStroke('redBright', (100 + flashBoost * 80) * defT * deathFade);
      strokeWeight(1);
      ellipse(0, 0, shieldR * 0.7, shieldR * 0.7);
      // 粒子环绕：6 颗粒子沿圆周运动（white/orangeBright 交替）
      let particleRot = frameCount * 0.015;
      for (let i = 0; i < 6; i++) {
        let a = (i / 6) * Math.PI * 2 + particleRot;
        let px2 = Math.cos(a) * shieldR;
        let py2 = Math.sin(a) * shieldR;
        let pColor = (i % 2 === 0) ? 'white' : 'orangeBright';
        let pAlpha = (200 + flashBoost * 55) * defT * deathFade;
        noStroke();
        cFill(pColor, pAlpha);
        ellipse(px2, py2, 4 + flashBoost * 3, 4 + flashBoost * 3);
      }
      // 受击瞬间额外放射光线（改红色系）
      if (flashBoost > 0.3) {
        cStroke('redBright', 180 * flashBoost * deathFade);
        strokeWeight(1.2);
        for (let i = 0; i < 8; i++) {
          let a = (i / 8) * Math.PI * 2 + frameCount * 0.005;
          line(Math.cos(a) * shieldR * 0.7, Math.sin(a) * shieldR * 0.7,
               Math.cos(a) * shieldR * 1.1, Math.sin(a) * shieldR * 1.1);
        }
      }
    }
    // T170：举盾冲击波（defendPulse 触发，红色环从中心向外扩散）
    if (this.enemyAnim.defendPulse > 0.05) {
      let pulseT = 1 - this.enemyAnim.defendPulse; // 0→1 扩散进度
      let pulseR = size * 0.5 + pulseT * size * 2.0; // 半径 0.5x → 2.5x
      let pulseAlpha = this.enemyAnim.defendPulse * 200;
      noFill();
      cStroke('redBright', pulseAlpha);
      strokeWeight(2 + this.enemyAnim.defendPulse * 2);
      ellipse(0, 0, pulseR * 2, pulseR * 2);
      // 内层橙色细环（双层冲击波）
      cStroke('orangeBright', pulseAlpha * 0.6);
      strokeWeight(1);
      ellipse(0, 0, pulseR * 1.5, pulseR * 1.5);
    }
    // T170：护盾破碎特效（shieldShatter 触发，红色碎片飞散）
    if (this.enemyAnim.shieldShatter > 0.05) {
      let shatterT = 1 - this.enemyAnim.shieldShatter; // 0→1 飞散进度
      let shardCount = 10;
      let shardR0 = size * 1.2; // 起始半径
      let shardMaxDist = size * 2.5; // 最大飞散距离
      for (let i = 0; i < shardCount; i++) {
        let a = (i / shardCount) * Math.PI * 2 + i * 0.7; // 错位角度
        // 飞散轨迹：径向 + 重力（向下）
        let dist = shardR0 + shatterT * shardMaxDist;
        let sx = Math.cos(a) * dist;
        let sy = Math.sin(a) * dist + shatterT * shatterT * 30; // 重力加速
        let shardSize = 6 + Math.sin(i * 1.3) * 2;
        let shardAlpha = this.enemyAnim.shieldShatter * 230;
        push();
        translate(sx, sy);
        rotate(a + shatterT * Math.PI * 0.8); // 碎片旋转
        noStroke();
        cFill('redBright', shardAlpha);
        // 三角形碎片
        triangle(-shardSize * 0.5, shardSize * 0.5,
                  shardSize * 0.5, shardSize * 0.3,
                  0, -shardSize * 0.6);
        cFill('orangeBright', shardAlpha * 0.7);
        triangle(-shardSize * 0.3, shardSize * 0.3,
                  shardSize * 0.3, shardSize * 0.15,
                  0, -shardSize * 0.4);
        pop();
      }
    }
    pop();
    // 敌人血条
    this.drawEnemyHealthBar( ex, ey - size - 20, size * 2, cs.enemyHp, cs.enemyMaxHp, cs.enemyBlock);
    // 敌人格挡值显式展示（盾牌图标+数字，位于血条左侧）
    if (cs.enemyBlock > 0) {
      let blockHit = drawStatusIcon('block', ex - size - 15, ey - size - 13, cs.enemyBlock, 26, 'redBright'); // T170：敌方盾牌图标改红色系
      if (blockHit) this.statusIconHits.push(blockHit);
    }
    // 敌人状态图标行（使用统一系统，位于血条上方）
    let enemyStatuses = {...cs.enemyStatuses};
    if (cs.enemyStunStacks > 0) enemyStatuses.stun = cs.enemyStunStacks;
    if (cs.enemyData && cs.enemyData.special && cs.enemyData.special.buffType === 'strength' && cs._enemyStrength) {
      enemyStatuses.strength = cs._enemyStrength;
    }
    let enemyHits = drawStatusRow(enemyStatuses, ex - 40, ey - size - 42, 22, 5);
    this.statusIconHits.push(...enemyHits);
    // T208：敌人悬停外描边 + 解释栏（实时鼠标检测，deathT 死亡过半淡出）
    if (this.hoveredEnemy === cs.enemyData) {
      let deathT = this.enemyAnim.deathProgress;
      drawEnemyHoverOutline(ex, ey, size, deathT);
      drawEnemyInfoTooltip(cs.enemyData, ex, ey, size, deathT);
    }
  }
  // ==================== T209 敌人艺术升级：通用辅助函数（类方法形式） ====================
  // 触手：曲线 + 末梢小吸盘（受 phase 驱动波动）
  // style: 'smooth'(默认,原版) / 'segmented'(分节,关节球) / 'spiked'(尖刺,倒刺)
  drawTentacle(baseX, baseY, angle, length, baseW, color, phase, alpha, style) {
    push();
    translate(baseX, baseY);
    rotate(angle);
    let tipY = Math.sin(5 + phase) * baseW * 0.8;
    if (style === 'segmented') {
      // 分节触手：关节球 + 连接线（flesh_weaver/mind_devourer 用）
      noStroke();
      for (let j = 0; j <= 6; j++) {
        let t = j / 6;
        let wave = Math.sin(t * 5 + phase) * baseW * 0.8;
        let segW = baseW * (1 - t * 0.35);
        cFill(color, alpha);
        ellipse(t * length, wave, segW, segW);
        if (j < 6) {
          let nt = (j + 1) / 6;
          let nwave = Math.sin(nt * 5 + phase) * baseW * 0.8;
          let nsegW = baseW * (1 - nt * 0.35);
          cStroke(color, alpha);
          strokeWeight(Math.min(segW, nsegW) * 0.6);
          line(t * length, wave, nt * length, nwave);
          noStroke();
        }
      }
      cFill(color, alpha);
      ellipse(length, tipY, baseW * 0.7, baseW * 0.7);
    } else if (style === 'spiked') {
      // 尖刺触手：主干曲线 + 两侧倒刺三角（bound_abomination/void_sovereign 用）
      noFill();
      cStroke(color, alpha);
      strokeWeight(baseW);
      beginShape();
      for (let j = 0; j <= 8; j++) {
        let t = j / 8;
        let wave = Math.sin(t * 5 + phase) * baseW * 0.8;
        curveVertex(t * length, wave);
      }
      endShape();
      noStroke();
      cFill(color, alpha);
      for (let j = 1; j < 7; j++) {
        let t = j / 8;
        let wave = Math.sin(t * 5 + phase) * baseW * 0.8;
        let barbLen = baseW * (1.6 - t * 0.9);
        let x = t * length;
        triangle(x, wave - baseW * 0.45, x, wave + baseW * 0.45, x + barbLen, wave);
      }
      // 末梢尖刺
      triangle(length - baseW, tipY - baseW * 0.5, length - baseW, tipY + baseW * 0.5, length + baseW, tipY);
    } else {
      // smooth（原版）：曲线 + 末梢吸盘
      noFill();
      cStroke(color, alpha);
      strokeWeight(baseW);
      beginShape();
      for (let j = 0; j <= 8; j++) {
        let t = j / 8;
        let wave = Math.sin(t * 5 + phase) * baseW * 0.8;
        curveVertex(t * length, wave);
      }
      endShape();
      noStroke();
      cFill(color, alpha);
      ellipse(length, tipY, baseW * 0.9, baseW * 0.9);
    }
    pop();
  }
  // 漂浮符文：圆环 + 十字 + 字符（rotSpeed 驱动旋转）
  // style: 'circle'(默认,原版) / 'diamond'(菱形框) / 'triangle'(三角框)
  drawGlyph(cx, cy, sz, color, char, rotSpeed, style) {
    push();
    translate(cx, cy);
    rotate(frameCount * rotSpeed);
    noFill();
    cStroke(color, 200);
    strokeWeight(1.5);
    if (style === 'diamond') {
      beginShape();
      vertex(0, -sz * 0.7); vertex(sz * 0.7, 0); vertex(0, sz * 0.7); vertex(-sz * 0.7, 0);
      endShape(CLOSE);
      line(-sz * 0.5, 0, sz * 0.5, 0);
      line(0, -sz * 0.5, 0, sz * 0.5);
    } else if (style === 'triangle') {
      beginShape();
      vertex(0, -sz * 0.75); vertex(sz * 0.65, sz * 0.5); vertex(-sz * 0.65, sz * 0.5);
      endShape(CLOSE);
      line(0, -sz * 0.4, 0, sz * 0.35);
      line(-sz * 0.35, sz * 0.1, sz * 0.35, sz * 0.1);

      line(0, -sz * 0.5, 0, sz * 0.5);

    noStroke();
    cFill(color, 240);

  // ==================== T210 敌人艺术 V2：新增辅助函数 ====================
  // 单侧边缘光：在主体一侧画亮弧（rim light，营造体积感）
  // side: -1 左侧 / +1 右侧
  drawRimLight(cx, cy, w, h, side, color, alpha) {
    push();

    cStroke(color, alpha);

    if (side > 0) { a0 = -Math.PI / 2.5; a1 = Math.PI / 2.5; }
    else { a0 = Math.PI - Math.PI / 2.5; a1 = Math.PI + Math.PI / 2.5; }

    pop();
  }
  // 有机身体轮廓：bezierVertex 波动 blob（暗面+亮面叠加），用于肉块/脑状主体
  drawBodyShape(cx, cy, baseW, baseH, color, lightColor, wobble, phase, alpha) {
    push();
    translate(cx, cy);
    noStroke();
    let n = 16;
    // 暗面主体
    cFill(color, alpha);
    beginShape();
    for (let i = 0; i <= n; i++) {
      let a = (i / n) * Math.PI * 2;
      let r = 1 + Math.sin(a * 3 + phase) * wobble + Math.cos(a * 5 + phase * 1.3) * wobble * 0.5;
      curveVertex(Math.cos(a) * baseW * 0.5 * r, Math.sin(a) * baseH * 0.5 * r);
    }
    endShape(CLOSE);
    // 亮面（偏左上叠加，模拟光源）
    cFill(lightColor, alpha * 0.45);
    beginShape();
    for (let i = 0; i <= n; i++) {
      let a = (i / n) * Math.PI * 2;
      let r = 1 + Math.sin(a * 3 + phase) * wobble + Math.cos(a * 5 + phase * 1.3) * wobble * 0.5;
      curveVertex(Math.cos(a) * baseW * 0.42 * r - baseW * 0.05, Math.sin(a) * baseH * 0.42 * r - baseH * 0.05);
    }
    endShape(CLOSE);
    pop();
  }
  // 恐怖独眼：发散光 + 血丝 + 收缩瞳孔抖动 + 中心亮点（void_spawn/codex_abyssus/void_sovereign）
  drawEyeHorror(cx, cy, sz, irisColor, glowAlpha) {

  // 竖瞳裂缝：无眼白杏仁眼眶 + 菱形竖瞳（glyph_serpent/siphon_leviathan）
  drawEyeSlit(cx, cy, sz, irisColor, glowAlpha) {

  drawEyeHollow(cx, cy, sz, glowColor, glowAlpha) {

  // 复眼群：环形排列多只小眼，各自独立眨动（mind_devourer/flesh_weaver）

    for (let p of positions) {
      let blink = 0.85 + Math.sin(frameCount * 0.1 + p[0] * 0.1 + p[1] * 0.1) * 0.15;

  // 烟雾光晕：多层模糊 + 向上飘散粒子（void_spawn/codex_abyssus 替代单一漩涡）
  drawSmokeGlow(cx, cy, radius, color, phase) {
    push();

  // 符文光环：多层环 + style 形状符文框旋转（bound_abomination/rune_guardian 替代单一漩涡）
  // style: 'circle' / 'diamond' / 'triangle'
  drawRuneHalo(cx, cy, radius, color, phase, style) {

  // 晶体折射光晕：模糊光 + 旋转细长菱形折射线 + 中心闪烁（rune_guardian/mirror_wraith）
