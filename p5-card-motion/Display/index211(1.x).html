  // ==================== T213 V3 怪诞艺术：新增辅助函数 ====================
  // 三层明暗分层主体：darkColor 暗面 / midColor 中间调 / lightColor 高光（仅 lightDir 方向 15% 区域）
  // lightDir: 0=自上而下(顶光) / 1=自下而上(地光) / 2=侧后方(背光剪影) / 3=正面(自发光) / 4=环绕(旋光)
  drawShadedBody(cx, cy, w, h, darkColor, midColor, lightColor, lightDir, alpha) {
    push();
    translate(cx, cy);
    noStroke();
    // 暗面主体（darkColor 整体）
    cFill(darkColor, alpha);
    ellipse(0, 0, w, h);
    // 中间调（midColor 主体，略偏移光源方向）
    let mx = 0, my = 0;
    if (lightDir === 0) { my = -h * 0.08; }                  // 顶光 → 中间调偏上
    else if (lightDir === 1) { my = h * 0.08; }               // 地光 → 偏下
    else if (lightDir === 2) { mx = -w * 0.05; }              // 背光 → 偏前
    else if (lightDir === 3) { mx = 0; my = 0; }              // 正面 → 居中
    else if (lightDir === 4) { mx = Math.cos(frameCount * 0.03) * w * 0.04; my = Math.sin(frameCount * 0.03) * h * 0.04; }
    cFill(midColor, alpha * 0.85);
    ellipse(mx, my, w * 0.85, h * 0.85);
    // 高光（lightColor 仅 15% 焦点区域）
    let lx = 0, ly = 0;
    if (lightDir === 0) { ly = -h * 0.18; }
    else if (lightDir === 1) { ly = h * 0.18; }
    else if (lightDir === 2) { lx = -w * 0.12; ly = -h * 0.05; }
    else if (lightDir === 3) { ly = 0; }
    else if (lightDir === 4) { lx = Math.cos(frameCount * 0.03) * w * 0.12; ly = Math.sin(frameCount * 0.03) * h * 0.12; }
    cFill(lightColor, alpha * 0.5);
    ellipse(lx, ly, w * 0.35, h * 0.35);
    pop();
  }
  // Perlin 噪声扭曲 blob：替代 drawBodyShape 简单 sin 波动，怪诞不安轮廓
  drawNoiseDistortBlob(cx, cy, baseR, noiseScale, noiseAmp, color, phase, alpha) {
    push();
    translate(cx, cy);
    noStroke();
    cFill(color, alpha);
    beginShape();
    let n = 24;
    for (let i = 0; i <= n; i++) {
      let a = (i / n) * Math.PI * 2;
      let r = baseR * (1 + (noise(Math.cos(a) * noiseScale + phase, Math.sin(a) * noiseScale + phase, frameCount * 0.01) - 0.5) * 2 * noiseAmp);
      curveVertex(Math.cos(a) * r, Math.sin(a) * r);
    }
    endShape(CLOSE);
    pop();
  }
  // 剪切扭曲组：对一组图元施加 shearX/Y 微小随机偏移（grotesque face 技法）
  drawShearedGroup(shearXAmt, shearYAmt, drawCallback) {
    push();
    shearX(shearXAmt + Math.sin(frameCount * 0.13) * 0.02);
    shearY(shearYAmt + Math.cos(frameCount * 0.11) * 0.015);
    drawCallback();
    pop();
  }
  // 裂痕纹理：随机分叉线段网络（bound_abomination/mirror_wraith/rune_guardian）
  drawCracks(cx, cy, w, h, color, density) {
    push();
    translate(cx, cy);
    cStroke(color, 180);
    strokeWeight(0.8);
    noFill();
    let n = density || 8;
    for (let i = 0; i < n; i++) {
      let a = (i / n) * Math.PI * 2 + (i * 1.7);
      let r1 = w * 0.3 * (0.5 + Math.sin(i * 1.3) * 0.3);
      let r2 = w * 0.45 * (0.7 + Math.cos(i * 2.1) * 0.3);
      let bx = Math.cos(a) * r1, by = Math.sin(a) * r1 * (h / w);
      let ex = Math.cos(a + 0.4) * r2, ey = Math.sin(a + 0.4) * r2 * (h / w);
      line(bx, by, ex, ey);
      // 分叉
      let fx = (bx + ex) * 0.5 + Math.sin(i * 2.7) * w * 0.1;
      let fy = (by + ey) * 0.5 + Math.cos(i * 2.3) * h * 0.1;
      line(ex, ey, fx, fy);
    }
    pop();
  }
  // 锈斑纹理：不规则暗橘色椭圆群（combo_breaker/nightmare_knight）
  drawRustSpots(cx, cy, w, h, color, density) {
    push();
    translate(cx, cy);
    noStroke();
    let n = density || 10;
    for (let i = 0; i < n; i++) {
      let a = (i / n) * Math.PI * 2 + i * 1.3;
      let r = w * 0.3 * (0.4 + Math.sin(i * 1.9) * 0.4);
      let sx = Math.cos(a) * r, sy = Math.sin(a) * r * (h / w);
      let sz = 2 + Math.abs(Math.sin(i * 2.5)) * 3;
      cFill(color, 140 + Math.sin(i * 1.7) * 40);
      ellipse(sx, sy, sz, sz * 0.7);
    }
    pop();
  }
  // 霉斑纹理：灰绿暗色不规则斑块（rot_carrier/flesh_weaver）
  drawMold(cx, cy, w, h, color, density) {
    push();
    translate(cx, cy);
    noStroke();
    let n = density || 8;
    for (let i = 0; i < n; i++) {
      let a = (i / n) * Math.PI * 2 + i * 2.1;
      let r = w * 0.35 * (0.5 + Math.cos(i * 1.5) * 0.3);
      let mx = Math.cos(a) * r, my = Math.sin(a) * r * (h / w);
      cFill(color, 100 + Math.sin(i * 2.3) * 40);
      ellipse(mx, my, 4 + Math.abs(Math.sin(i * 1.7)) * 4, 3 + Math.abs(Math.cos(i * 2.1)) * 3);
    }
    pop();
  }
  // 湿润反光：移动的白色细高光带（siphon_leviathan/void_spawn/codex_abyssus）
  drawWetShine(cx, cy, w, h, color, phase) {
    push();
    translate(cx, cy);
    noStroke();
    let t = (frameCount * 0.02 + phase) % 1;
    for (let i = 0; i < 3; i++) {
      let ti = (t + i * 0.33) % 1;
      let y = -h * 0.4 + ti * h * 0.8;
      let xOff = Math.sin(ti * Math.PI * 2 + phase) * w * 0.15;
      cFill(color, 120 * (1 - Math.abs(ti - 0.5) * 2));
      ellipse(xOff, y, w * 0.4, 1.5);
    }
    pop();
  }
  // 骨裂纹理：平行细线 + 交叉（nightmare_knight 骨盔/codex_abyssus 书页边缘）
  deriveBoneTexture(cx, cy, w, h, color) {
    push();
    translate(cx, cy);
    cStroke(color, 130);
    strokeWeight(0.5);
    noFill();
    for (let i = 0; i < 5; i++) {
      let y = -h * 0.4 + i * h * 0.2;
      let off = Math.sin(i * 1.3) * w * 0.05;
      line(-w * 0.3 + off, y, w * 0.3 + off, y + Math.sin(i * 2.1) * 2);
    }
    // 交叉裂痕
    line(-w * 0.2, -h * 0.3, w * 0.15, h * 0.25);
    line(w * 0.1, -h * 0.35, -w * 0.15, h * 0.2);
    pop();
  }
  // 腐蚀坑：小圆暗斑群（rune_guardian/glyph_serpent）
  drawCorrosion(cx, cy, w, h, color, density) {
    push();
    translate(cx, cy);
    noStroke();
    let n = density || 8;
    for (let i = 0; i < n; i++) {
      let a = (i / n) * Math.PI * 2 + i * 0.7;
      let r = w * 0.4 * (0.4 + Math.sin(i * 2.3) * 0.4);
      cFill(color, 130);
      ellipse(Math.cos(a) * r, Math.sin(a) * r * (h / w), 2 + Math.abs(Math.cos(i * 1.9)) * 2, 2 + Math.abs(Math.sin(i * 1.9)) * 2);
    }
    pop();
  }
  // 边缘溶解：触手/披风/光环外缘 alpha 渐变到 0（与背景溶解）
  dissolveEdge(x, y, baseW, baseAlpha, t) {
    let a = baseAlpha * (1 - t);
    if (a <= 0) return;
    noStroke();
    cFill('shadowPurple', a * 0.5);
    ellipse(x, y, baseW * (1 - t * 0.3), baseW * (1 - t * 0.3));
  }

  drawEnemySprite( cs, size, enemyColor) {
    let hpPct = cs.enemyHp / cs.enemyMaxHp;
    let enemyId = cs.enemyData.id;
    // 死亡溶解进度
    let isDying = cs.enemyHp <= 0;
    if (isDying) this.enemyAnim.deathProgress = Math.min(1, this.enemyAnim.deathProgress + 0.02);
    let deathT = this.enemyAnim.deathProgress;
    // 受击变形
    let hitDeform = this.enemyAnim.flashAlpha / 200;
    this.enemyAnim.hitDeform = hitDeform;
    // 通用脉动
    let pulse = 1 + Math.sin(frameCount * 0.08) * 0.06;
    // 死亡时整体缩小
    let deathScale = isDying ? (1 - deathT * 0.5) : 1;
    // 闪光（受击瞬间白色覆盖，减弱后由各敌人自身色调取代）
    if (this.enemyAnim.flashAlpha > 0) {
      noStroke();
      cFill('white', this.enemyAnim.flashAlpha);
      ellipse(0, 0, size * 2.5, size * 2.5);
    }
    push();
    if (isDying) scale(deathScale);
    // ===== T209：分派到专属绘制函数（switch-case 全用 {} 块作用域） =====
    switch (enemyId) {
      case 'void_spawn':        { this.drawVoidSpawn(size, enemyColor, pulse, hitDeform, deathT);        break; }
      case 'flesh_weaver':      { this.drawFleshWeaver(size, enemyColor, pulse, hitDeform, deathT);      break; }
      case 'rune_guardian':     { this.drawRuneGuardian(size, enemyColor, pulse, hitDeform, deathT);     break; }
      case 'bound_abomination': { this.drawBoundAbomination(size, enemyColor, pulse, hitDeform, deathT); break; }
      case 'mind_devourer':     { this.drawMindDevourer(size, enemyColor, pulse, hitDeform, deathT);     break; }
      case 'siphon_leviathan':  { this.drawSiphonLeviathan(size, enemyColor, pulse, hitDeform, deathT);  break; }
      case 'mirror_wraith':     { this.drawMirrorWraith(size, enemyColor, pulse, hitDeform, deathT);     break; }
      case 'combo_breaker':     { this.drawComboBreaker(size, enemyColor, pulse, hitDeform, deathT);     break; }
      case 'rot_carrier':       { this.drawRotCarrier(size, enemyColor, pulse, hitDeform, deathT);       break; }
      case 'glyph_serpent':     { this.drawGlyphSerpent(size, enemyColor, pulse, hitDeform, deathT);     break; }
      case 'nightmare_knight':  { this.drawNightmareKnight(size, enemyColor, pulse, hitDeform, deathT);  break; }
      case 'codex_abyssus':     { this.drawCodexAbyssus(size, enemyColor, pulse, hitDeform, deathT);     break; }
      case 'void_sovereign':    { this.drawVoidSovereign(size, enemyColor, pulse, hitDeform, deathT, cs); break; }
      default:                  { this.drawVoidSpawn(size, enemyColor, pulse, hitDeform, deathT);        break; }
    }
    // ===== 通用：死亡溶解粒子 =====
    if (isDying && deathT < 1) {
      noStroke();
      for (let p = 0; p < 8; p++) {
        let pa = (p / 8) * Math.PI * 2 + frameCount * 0.02;
        let pr = size * (0.5 + deathT * 1.5);
        let pAlpha = (1 - deathT) * 150;
        cFill(enemyColor, pAlpha);
        ellipse(Math.cos(pa) * pr, Math.sin(pa) * pr, 4 + deathT * 6, 4 + deathT * 6);
      }
    }
    // ===== 通用：HP < 50% 受伤红光闪烁 =====
    if (hpPct < 0.5 && !isDying) {
      cFill('red', 60 + Math.sin(frameCount * 0.2) * 30);
      noStroke();
      ellipse(0, 0, size * 1.5, size * 1.5);
    }
    pop();
  }

  // ===== T209：13 个敌人专属绘制函数 =====
  // 1. 虚空幼体：空间裂口 + 4 触手 + 恐怖独眼 + 烟雾光晕 + 裂缝光泄漏（T210 V2）
  // 1. 虚空诞生物：noise 扭曲裂口 + 三层明暗 + 自下而上红光 + 触手末梢溶解（T213 V3 重做）
  drawVoidSpawn(size, color, pulse, hitDeform, deathT) {
    // 主光源：自下而上（红光从地裂涌出，与 codex_abyssus 呼应）
    // 烟雾光晕（shadowPurple 替代 purple，降饱和）
    this.drawSmokeGlow(0, 0, size * 0.85, 'shadowPurple', 0);
    // 裂口三层明暗（drawShadedBody 替代单色 ellipse：shadowPurple 暗面 → purple 中间调 → purpleBright 高光焦点）
    let riftW = size * 0.9 * pulse;
    let riftH = size * 0.4 * pulse;
    this.drawShadedBody(0, 0, riftW, riftH, 'shadowPurple', 'purple', 'purpleBright', 1, 230 * (1 - deathT));
    // 裂口内暗腔（shadowPurple 替代 bg，保留深度）
    noStroke();
    cFill('shadowPurple', 210);
    ellipse(0, 0, riftW * 0.55, riftH * 0.55);
    // 裂缝光泄漏（降饱和 neonPurple，亮线从裂口边缘渗出）
    cStroke('purple', 180);
    strokeWeight(1);
    for (let i = 0; i < 5; i++) {
      let a = (i / 5) * Math.PI - Math.PI / 2 + Math.sin(frameCount * 0.05 + i) * 0.15;
      line(Math.cos(a) * riftW * 0.25, Math.sin(a) * riftH * 0.25, Math.cos(a) * riftW * 0.5, Math.sin(a) * riftH * 0.5);
    }
    noStroke();
    // 4 条细触手（shadowPurple 替代 purpleBright，末梢溶解入背景）
    for (let i = 0; i < 4; i++) {
      let a = (i / 4) * Math.PI + Math.sin(frameCount * 0.06 + i) * 0.2;
      this.drawTentacle(0, 0, a, size * 0.7, 4, 'shadowPurple', frameCount * 0.05 + i, 230 * (1 - deathT), 'smooth');
      // 触手末梢溶解（3 段渐变入背景）
      let tipX = Math.cos(a) * size * 0.7;
      let tipY = Math.sin(a) * size * 0.7;
      for (let j = 0; j < 3; j++) {
        let t = j / 2;
        this.dissolveEdge(tipX + Math.cos(a) * t * size * 0.05, tipY + Math.sin(a) * t * size * 0.05, 5 * (1 - t * 0.3), 200, t);
      }
    }
    // 中心恐怖独眼（redDim 替代 red，降饱和焦点）
    this.drawEyeHorror(0, 0, size * 0.18, 'redDim', 1 - deathT);
    // 自下而上红光光源（书底向上的红色辉光）
    push();
    blendMode(ADD);
    noStroke();
    for (let i = 0; i < 2; i++) {
      cFill('redDim', 50 - i * 18);
      ellipse(0, size * 0.25 - i * size * 0.05, size * (0.9 - i * 0.15), size * 0.3);
    }
    blendMode(BLEND);
    pop();
    // 虚空粒子（shadowPurple 替代 purpleBright，降饱和）
    noStroke();
    for (let i = 0; i < 6; i++) {
      let a = (i / 6) * Math.PI * 2 + frameCount * 0.04;
      let r = size * 0.6 + Math.sin(frameCount * 0.08 + i) * size * 0.1;
      cFill('shadowPurple', 170);
      ellipse(Math.cos(a) * r, Math.sin(a) * r, 3, 3);
    }
  }

  // 2. 血肉编织者：三层明暗 + 顶光 + mold 霉斑 + 触须末梢溶解（T213 V3 重做）
  drawFleshWeaver(size, color, pulse, hitDeform, deathT) {
    // 主光源：自上而下顶光（手术台审视感）
    // 躯干三层明暗（shadowPurple 暗面 → red 中间调 → redDim 高光焦点顶光）
    this.drawShadedBody(0, size * 0.15, size * 0.6, size * 0.8, 'shadowPurple', 'red', 'redDim', 0, 240 * (1 - deathT));
    // 头部三层明暗（顶光）
    this.drawShadedBody(0, -size * 0.35, size * 0.4 * pulse, size * 0.35 * pulse, 'shadowPurple', 'red', 'redDim', 0, 250 * (1 - deathT));
    // 躯干内暗腔（shadowPurple 替代 bg）
    noStroke();
    cFill('shadowPurple', 100);
    ellipse(0, size * 0.15, size * 0.45, size * 0.6);
    // 缝合线纹路（goldDim 暗金）
    cStroke('goldDim', 180);
    strokeWeight(1);
    noFill();
    for (let i = 0; i < 3; i++) {
      let sy = -size * 0.05 + i * size * 0.18;
      beginShape();
      for (let j = 0; j <= 6; j++) {
        let sx = -size * 0.25 + j * size * 0.083;
        curveVertex(sx, sy + Math.sin(j * 1.2) * size * 0.02);
      }
      endShape();
    }
    noStroke();
    // 霉斑纹理（moss 腐生物表面）
    this.drawMold(0, size * 0.15, size * 0.6, size * 0.8, 'moss', 8);
    this.drawMold(0, -size * 0.35, size * 0.4 * pulse, size * 0.35 * pulse, 'moss', 5);
    // 8 条分节触须（redDim 替代 redBright，末梢溶解）
    for (let i = 0; i < 4; i++) {
      let side = i < 2 ? -1 : 1;
      let layer = i % 2;
      let baseY = -size * 0.1 + layer * size * 0.3;
      let angle = side > 0 ? 0 : Math.PI;
      let tlen = size * 0.55;
      this.drawTentacle(side * size * 0.3, baseY, angle + (layer ? 0.2 : -0.2), tlen, 5, 'redDim', frameCount * 0.04 + i, 240 * (1 - deathT), 'segmented');
      // 触须末梢溶解（3 段渐变入背景）
      let tipX = side * (size * 0.3 + Math.cos(angle) * tlen);
      let tipY = baseY + Math.sin(angle) * tlen;
      for (let j = 0; j < 3; j++) {
        let t = j / 2;
        this.dissolveEdge(tipX + Math.cos(angle) * t * size * 0.05, tipY + Math.sin(angle) * t * size * 0.05, 5 * (1 - t * 0.3), 200, t);
      }
    }
    // 头部复眼群（redDim 替代 red）
    this.drawEyeCluster(0, -size * 0.38, size * 0.1, 'redDim', 5, 1 - deathT);
    // 滴落腐败点（shadowPurple 替代 red，降饱和）
    noStroke();
    for (let i = 0; i < 3; i++) {
      let dy = (frameCount * 0.6 + i * 30) % size;
      cFill('shadowPurple', 180 - dy * 1.5);
      ellipse(-size * 0.15 + i * size * 0.15, size * 0.55 + dy * 0.3, 4, 6);
    }
  }

  // 3. 缚咒憎恶（ELITE）：环绕旋光 + 三层明暗 + cracks 裂痕 + 锁链锈斑（T213 V3 重做）
  drawBoundAbomination(size, color, pulse, hitDeform, deathT) {
    // 主光源：环绕旋光（诅咒光源，光Dir=4）
    // 菱形符文光环（redDim 替代 redBright，降饱和）
    this.drawRuneHalo(0, 0, size * 0.95, 'redDim', 0, 'diamond');
    // 巨型主体三层明暗（shadowPurple 暗面 → red 中间调 → goldDim 高光焦点环绕）
    this.drawShadedBody(0, 0, size * 0.95 * pulse, size * 1.1 * pulse, 'shadowPurple', 'red', 'goldDim', 4, 240 * (1 - deathT));
    // 主体内暗腔（shadowPurple 替代 bg）
    noStroke();
    cFill('shadowPurple', 130);
    ellipse(0, 0, size * 0.55 * pulse, size * 0.7 * pulse);
    // 裂痕纹理（drawCracks 主体表面裂痕网络）
    this.drawCracks(0, 0, size * 0.95 * pulse, size * 1.1 * pulse, 'rust', 10);
    // 4 个尖角（shadowPurple + rust 渐层）
    cFill('shadowPurple', 220);
    for (let i = 0; i < 4; i++) {
      let a = (i / 4) * Math.PI * 2;
      push();
      translate(Math.cos(a) * size * 0.7, Math.sin(a) * size * 0.7);
      rotate(a);
      triangle(0, 0, -size * 0.15, -size * 0.1, -size * 0.15, size * 0.1);
      pop();
    }
    cFill('rust', 160);
    for (let i = 0; i < 4; i++) {
      let a = (i / 4) * Math.PI * 2;
      push();
      translate(Math.cos(a) * size * 0.65, Math.sin(a) * size * 0.65);
      rotate(a);
      triangle(0, 0, -size * 0.13, -size * 0.08, -size * 0.13, size * 0.08);
      pop();
    }
    // 4 条尖刺触手（redDim 替代 redBright）
    for (let i = 0; i < 4; i++) {
      let a = (i / 4) * Math.PI * 2 + Math.PI / 4 + Math.sin(frameCount * 0.04 + i) * 0.15;
      this.drawTentacle(Math.cos(a) * size * 0.4, Math.sin(a) * size * 0.4, a, size * 0.4, 4, 'redDim', frameCount * 0.05 + i, 220 * (1 - deathT), 'spiked');
    }
    // 诅咒锁链（goldDim 暗金 + 锈斑纹理 rust）
    noFill();
    cStroke('goldDim', 180);
    strokeWeight(1.2);
    for (let i = 0; i < 10; i++) {
      let a = (i / 10) * Math.PI * 2 + frameCount * 0.01;
      let r = size * 0.6;
      ellipse(Math.cos(a) * r, Math.sin(a) * r * 0.9, 5, 7);
    }
    noStroke();
    // 锁链锈斑
    for (let i = 0; i < 10; i++) {
      let a = (i / 10) * Math.PI * 2 + frameCount * 0.01;
      let r = size * 0.6;
      this.drawRustSpots(Math.cos(a) * r, Math.sin(a) * r * 0.9, 5, 7, 'rust', 2);
    }
    // 6 段菱形古符文（redDim 替代 redBright）
    const runeChars = ['✠', '⚗', '☿', '⛤', '✦', '◈'];
    for (let i = 0; i < 6; i++) {
      let a = (i / 6) * Math.PI * 2 + frameCount * 0.015;
      let r = size * 0.85;
      this.drawGlyph(Math.cos(a) * r, Math.sin(a) * r, size * 0.12, 'redDim', runeChars[i], 0.02, 'diamond');
    }
    // 恐怖独眼（redDim 替代 red，降饱和焦点）
    this.drawEyeHorror(0, 0, size * 0.12, 'redDim', 1 - deathT);
    // 环绕边缘光（goldDim 替代 gold）
    this.drawRimLight(0, 0, size * 0.95 * pulse, size * 1.1 * pulse, 1, 'goldDim', 70);
  }

  // 4. 符文守卫：正面符文自发光 + 三层明暗 + cracks + corrosion 双纹理（T213 V3 重做）
  drawRuneGuardian(size, color, pulse, hitDeform, deathT) {
    // 主光源：正面自发光（符文从内向外辉光，守护者威严）
    // 晶体折射光晕（blue 替代 blueBright，降饱和）
    this.drawCrystalShimmer(0, 0, size * 0.9, 'blue', 0);
    // 菱形躯干三层明暗（shadowPurple 暗面 → blue 中间调 → blueBright 高光焦点正面）
    push();
    rotate(frameCount * 0.01);
    this.drawShadedBody(0, 0, size * 0.8, size * 0.9, 'shadowPurple', 'blue', 'blueBright', 3, 255 * (1 - deathT));
    pop();
    // 裂痕纹理（drawCracks 护甲表面裂痕）
    this.drawCracks(0, 0, size * 0.8, size * 0.9, 'rust', 8);
    // 腐蚀坑纹理（drawCorrosion 护甲表面腐蚀）
    this.drawCorrosion(0, 0, size * 0.8, size * 0.9, 'shadowTeal', 10);
    // 4 块几何护甲边（shadowPurple + goldDim 边）
    this.drawArmorPlate(0, -size * 0.5, size * 0.3, size * 0.15, 'shadowPurple', 'goldDim');
    this.drawArmorPlate(0, size * 0.5, size * 0.3, size * 0.15, 'shadowPurple', 'goldDim');
    this.drawArmorPlate(-size * 0.5, 0, size * 0.15, size * 0.3, 'shadowPurple', 'goldDim');
    this.drawArmorPlate(size * 0.5, 0, size * 0.15, size * 0.3, 'shadowPurple', 'goldDim');
    // 4 角三角符文（goldDim 替代 gold）
    const glyphs = ['✦', '◈', '✠', '⛤'];
    for (let i = 0; i < 4; i++) {
      let a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      this.drawGlyph(Math.cos(a) * size * 0.7, Math.sin(a) * size * 0.7, size * 0.15, 'goldDim', glyphs[i], 0.03, 'triangle');
    }
    // 中心空洞眼眶（blue 替代 blueBright，机械感降饱和）
    this.drawEyeHollow(0, 0, size * 0.16, 'blue', 1 - deathT);

      cFill('blue', 60 - i * 18);

  // 5. 噬心者：noise 扭曲脑体 + shadowTeal 暗腔 + 顶光 + 青绿品红降饱和（T213 V3 重做）
  drawMindDevourer(size, color, pulse, hitDeform, deathT) {
    // 主光源：自上而下顶光（被审视的怪物）
    // 脑状有机主体：drawNoiseDistortBlob 三层（外 shadowPurple + 中 green + 高光 cyan 顶光）
    // 外层 shadowPurple（暗面，替代 drawBodyShape 与 void_spawn 撞色的紫）
    this.drawNoiseDistortBlob(0, 0, size * 0.5 * pulse, 1.5, 0.18, 'shadowPurple', frameCount * 0.005, 230 * (1 - deathT));
    // 中层 green（中间调，青绿暗面）
    this.drawNoiseDistortBlob(0, 0, size * 0.42 * pulse, 1.5, 0.15, 'green', frameCount * 0.005 + 100, 200 * (1 - deathT));
    // 高光层 cyan（顶光焦点，仅上方 15% 区域）
    this.drawNoiseDistortBlob(0, -size * 0.18 * pulse, size * 0.2 * pulse, 1.2, 0.08, 'cyan', frameCount * 0.005 + 200, 130 * (1 - deathT));
    // 半球穹顶高光（cyan 替代 cyanBright）
    noStroke();
    cFill('cyan', 100);
    arc(0, 0, size * 0.8 * pulse, size * 0.5 * pulse, Math.PI, 0);
    // 主体内暗腔（shadowTeal 替代 bg，深青冷地下室感）
    cFill('shadowTeal', 100);
    ellipse(0, 0, size * 0.6 * pulse, size * 0.4 * pulse);
    // 脑回纹路（purple 替代 purpleBright，降饱和）
    cStroke('purple', 160);
    strokeWeight(1.2);
    noFill();
    for (let i = 0; i < 3; i++) {
      let ry = -size * 0.15 + i * size * 0.12;
      beginShape();
      for (let j = 0; j <= 8; j++) {
        curveVertex(-size * 0.3 + j * size * 0.075, ry + Math.sin(j * 1.5 + i + frameCount * 0.03) * size * 0.03);
      }
      endShape();
    }
    noStroke();
    // 8 条分节触手下垂（purple 替代 purpleBright，末梢溶解）
    for (let i = 0; i < 8; i++) {
      let a = (i / 8) * Math.PI;
      let bx = Math.cos(a + Math.PI) * size * 0.5;
      let by = Math.sin(a + Math.PI) * size * 0.15;
      let tlen = size * 0.5;
      this.drawTentacle(bx, by, Math.PI / 2 + (a - Math.PI / 2) * 0.3, tlen, 3, 'purple', frameCount * 0.05 + i, 220 * (1 - deathT), 'segmented');
      // 触手末梢溶解
      let tipX = bx + Math.cos(Math.PI / 2 + (a - Math.PI / 2) * 0.3) * tlen;
      let tipY = by + Math.sin(Math.PI / 2 + (a - Math.PI / 2) * 0.3) * tlen;
      for (let j = 0; j < 2; j++) {
        let t = j / 1;
        this.dissolveEdge(tipX, tipY, 4 * (1 - t * 0.3), 200, t);
      }
    }
    // 8 复眼群（purple 替代 purpleBright，降饱和品红以区别于 flesh_weaver 的红）
    this.drawEyeCluster(0, -size * 0.05, size * 0.09, 'purple', 8, 1 - deathT);
  }

  // 6. 虹吸利维坦：三层明暗蛇身 + 湿润反光 + 侧后折射光 + 尾部溶解（T213 V3）
  drawSiphonLeviathan(size, color, pulse, hitDeform, deathT) {
    // 主光源：侧后方折射光（lightDir=2）—— 暗面 shadowPurple / 中间调 color / 高光 cyanBright
    // 蛇身 S 形盘绕（4 段，每段三层明暗 + 湿润反光）
    noStroke();
    for (let i = 0; i < 4; i++) {
      let segSize = size * (0.45 - i * 0.08);
      let sx = Math.sin(frameCount * 0.04 + i * 0.6) * size * 0.2;
      let sy = i * size * 0.25 - size * 0.3;
      // 三层明暗：远段越深越暗（i 越大 alpha 越低，深度递减）
      let segAlpha = (240 - i * 30) * (1 - deathT);
      this.drawShadedBody(sx, sy, segSize, segSize * 0.7, 'shadowPurple', color, 'cyanBright', 2, segAlpha);
      // 湿润反光带（移动白色细高光，水生怪物湿润质感）
      this.drawWetShine(sx, sy, segSize * 0.6, segSize * 0.45, 'white', frameCount * 0.02 + i * 0.3);
      // 鳞片纹理（暗调 cyanBright 弧线网格，弱化亮度避免抢戏）
      cStroke('cyanBright', 80);
      strokeWeight(0.6);
      noFill();
      for (let s = 0; s < 3; s++) {
        arc(sx, sy - segSize * 0.15 + s * segSize * 0.12, segSize * 0.5, segSize * 0.3, Math.PI, Math.PI * 2);
      }
      noStroke();
      // 侧后折射光（cyanBright 边缘高光，模拟水中折射边缘光）
      cFill('cyanBright', 60 * (1 - deathT));
      ellipse(sx - segSize * 0.25, sy, segSize * 0.15, segSize * 0.5);
    }
    // 尾部溶解（最末段与背景渐变，体现利维坦隐入深渊的视觉悬念）
    let tailX = Math.sin(frameCount * 0.04 + 3 * 0.6) * size * 0.2;
    let tailY = 3 * size * 0.25 - size * 0.3;
    for (let i = 0; i < 4; i++) {
      let t = i / 3;
      this.dissolveEdge(tailX, tailY + i * 3, size * 0.25 * (1 - t * 0.25), 180 * (1 - deathT), t);
    }
    // 头部（顶部，带双向虹吸漩涡）
    push();
    translate(0, -size * 0.45);
    // 头部三层明暗（顶光偏侧后，强调深渊巨口）
    this.drawShadedBody(0, 0, size * 0.5, size * 0.4, 'shadowPurple', color, 'cyanBright', 2, 255 * (1 - deathT));
    // 双向虹吸漩涡（shadowPurple 暗腔 + cyan 漩涡 + cyanBright 高光）
    noStroke();
    cFill('shadowPurple', 220 * (1 - deathT));
    ellipse(0, 0, size * 0.38, size * 0.3);
    for (let i = 0; i < 3; i++) {
      cFill('cyan', (160 - i * 45) * (1 - deathT));
      ellipse(0, 0, size * (0.3 - i * 0.07), size * (0.24 - i * 0.05));
    }
    noFill();
    cStroke('cyanBright', 180 * (1 - deathT));
    strokeWeight(1.2);
    push();
    rotate(frameCount * 0.08);
    arc(0, 0, size * 0.25, size * 0.2, 0, Math.PI * 1.5);
    pop();
    push();
    rotate(-frameCount * 0.06);
    arc(0, 0, size * 0.18, size * 0.14, Math.PI, Math.PI * 2.5);
    pop();
    noStroke();
    // 头部湿润反光
    this.drawWetShine(0, 0, size * 0.4, size * 0.3, 'white', frameCount * 0.025);
    pop();
    // 竖瞳裂缝眼（保留）
    this.drawEyeSlit(-size * 0.1, -size * 0.45, size * 0.08, 'gold', 1 - deathT);
    this.drawEyeSlit(size * 0.1, -size * 0.45, size * 0.08, 'gold', 1 - deathT);
    // 水流粒子（从头部向下飘，cyanBright 暗调）
    noStroke();
    for (let i = 0; i < 5; i++) {
      let py = (frameCount * 0.8 + i * 25) % (size * 0.8);
      cFill('cyanBright', (180 - py * 1.2) * (1 - deathT));
      ellipse(Math.sin(frameCount * 0.05 + i) * size * 0.1, -size * 0.35 + py, 3, 5);
    }
    // 6 段尖刺触须（cyanBright 暗调，触须尖端溶解）
    for (let i = 0; i < 6; i++) {
      let a = (i / 6) * Math.PI - Math.PI / 2;
      this.drawTentacle(0, -size * 0.45, a, size * 0.3, 2, 'cyanBright', frameCount * 0.06 + i, 180 * (1 - deathT), 'spiked');
    }
    // 侧后折射边缘光（cyanBright 强调轮廓，water beast 标志）
    this.drawRimLight(0, 0, size * 1.0, size * 1.2, 2, 'cyanBright', 90 * (1 - deathT));
  }

  // 7. 镜像怨灵：shadowPurple 镜身 + 裂痕 + 侧后折射光 + 镜片溶解（T213 V3）
  drawMirrorWraith(size, color, pulse, hitDeform, deathT) {
    // 主光源：侧后方折射光（lightDir=2）—— 暗面 shadowPurple / 中间调 color / 高光 white/blueBright
    // 晶体折射光晕（冷调，替代漩涡）

    ellipse(0, 0, size * 1.2, size * 1.4);

    for (let i = 0; i < 6; i++) {
      let a = (i / 6) * Math.PI * 2 + frameCount * 0.005;
      let r = i % 2 === 0 ? size * 0.55 : size * 0.35;
      let shake = Math.sin(frameCount * 0.2 + i) * 1.5; // 破碎抖动
      push();
      translate(Math.cos(a) * r + shake, Math.sin(a) * r * 0.7);
      rotate(a + Math.PI / 4);

      let pieceAlpha = 230 * (1 - deathT);
      this.drawShadedBody(0, 0, size * 0.35, size * 0.25, 'shadowPurple', 'white', 'blueBright', 2, pieceAlpha);
      // 镜面反射条纹（blueBright 强光带，比 V2 更冷冽）
      cFill('blueBright', 200 * (1 - deathT));
      rect(size * 0.06, size * 0.05, size * 0.1, 0.04, 1);

      this.drawCracks(0, 0, size * 0.32, size * 0.22, 'white', 6);
      // 镜片边缘溶解（与背景渐变，强化镜中怨灵从镜面渗出的视觉叙事）
      this.dissolveEdge(0, 0, size * 0.35, 100 * (1 - deathT), 0.4);
      pop();
    }
    noStroke();
    // 中心暗影（shadowPurple 镜中倒影，非纯黑，保留紫色深度）
    cFill('shadowPurple', 200 * (1 - deathT));
    ellipse(0, 0, size * 0.3, size * 0.45);
    // 镜面裂痕覆盖中心（强化破碎感）
    this.drawCracks(0, 0, size * 0.28, size * 0.4, 'white', 5);
    // 空洞眼眶（镜中暗影，保留）
    this.drawEyeHollow(-size * 0.08, -size * 0.05, size * 0.06, 'red', 1 - deathT);
    this.drawEyeHollow(size * 0.08, -size * 0.05, size * 0.06, 'red', 1 - deathT);
    // 侧后折射边缘光（blueBright 强调镜片折射轮廓，比 V2 更冷冽）
    this.drawRimLight(0, 0, size * 1.0, size * 1.2, 2, 'blueBright', 130 * (1 - deathT));
  }

  // 8. 连击破碎者：shadowPurple 披风 + 重甲三层明暗 + 锈斑 + 背光剪影 + 披风溶解（T213 V3）
  drawComboBreaker(size, color, pulse, hitDeform, deathT) {
    // 主光源：侧后方背光（lightDir=2）—— 暗面 shadowPurple / 中间调 color/rust / 高光 goldDim/redDim
    // 披风（shadowPurple 替代纯黑 bg，保留悲剧剪影深度）
    this.drawShearedGroup(-0.02, 0.01, () => {

      cFill('shadowPurple', 230 * (1 - deathT));

    this.drawShadedBody(0, size * 0.1, size * 0.4, size * 0.5, 'shadowPurple', 'rust', 'redDim', 2, 255 * (1 - deathT));

    noStroke();
    cFill('shadowPurple', 255 * (1 - deathT));
    rect(-size * 0.18, -size * 0.45, size * 0.36, size * 0.15, 2);
    cStroke('goldDim', 200 * (1 - deathT));
    strokeWeight(1.5);
    noFill();
    rect(-size * 0.18, -size * 0.45, size * 0.36, size * 0.15, 2);
    noStroke();
    // 肩甲尖刺（shadowPurple 暗面）
    cFill('shadowPurple', 255 * (1 - deathT));
    triangle(-size * 0.25, -size * 0.1, -size * 0.45, -size * 0.3, -size * 0.18, -size * 0.15);
    triangle(size * 0.25, -size * 0.1, size * 0.45, -size * 0.3, size * 0.18, -size * 0.15);

    cFill('shadowPurple', 255 * (1 - deathT));

    cStroke('goldDim', 220 * (1 - deathT));

    for (let i = 0; i < 3; i++) {
      let cy = size * 0.32 + i * size * 0.06;

    cFill('shadowPurple', 255 * (1 - deathT));

    this.drawRustSpots(0, size * 0.52, size * 0.16, size * 0.14, 'rust', 5);
    // 锤头尖钉（goldDim 降饱和）
    cFill('goldDim', 200 * (1 - deathT));
    for (let i = 0; i < 5; i++) {
      let a = (i / 5) * Math.PI * 2;
      triangle(Math.cos(a) * size * 0.09, size * 0.52 + Math.sin(a) * size * 0.07,
               Math.cos(a) * size * 0.05, size * 0.52 + Math.sin(a) * size * 0.04,
               Math.cos(a) * size * 0.14, size * 0.52 + Math.sin(a) * size * 0.1);
    }
    pop();
    // 侧后背光剪影边缘光（redDim 强调重甲悲剧轮廓）

  }

  // 9. 腐朽携带者：噪声腹胀身 + shadowPurple 暗腔 + 霉斑 + 顶光 + 下垂触须溶解（T213 V3）
  drawRotCarrier(size, color, pulse, hitDeform, deathT) {
    // 主光源：顶光（lightDir=0）—— 暗面 shadowPurple / 中间调 color / 高光 bone
    // 腹胀有机身躯（噪声扭曲 blob 替代 bezier 简单 sin 波，更怪诞不安）
    // 外层 shadowPurple 暗腔
    this.drawNoiseDistortBlob(0, 0, size * 0.55 * pulse, 1.5, 0.16, 'shadowPurple', frameCount * 0.005, 240 * (1 - deathT));
    // 中层 color 主体（腹胀感）
    this.drawNoiseDistortBlob(0, 0, size * 0.48 * pulse, 1.5, 0.14, color, frameCount * 0.005 + 50, 220 * (1 - deathT));

    // 内部暗腔（shadowPurple 深腔，替代 bg 纯黑）
    noStroke();
    cFill('shadowPurple', 140 * (1 - deathT));
    ellipse(0, 0, size * 0.42, size * 0.35);
    // 霉斑纹理（moss 暗绿斑，腐朽生命体征）
    this.drawMold(0, size * 0.08, size * 0.45, size * 0.35, 'moss', 10);
    // 暴露肋骨（bone 降饱和，弧线）
    cStroke('bone', 200 * (1 - deathT));

    noFill();
    for (let i = 0; i < 4; i++) {
      let ry = -size * 0.3 + i * size * 0.2;
      arc(0, ry, size * 0.6, size * 0.15, 0, Math.PI);

    noStroke();
    // 卡通独眼（保留 V2 标志性独眼，per 计划保留）
    this.drawEye(0, -size * 0.2, size * 0.13, 'green', 1 - deathT);
    // maggots 爬行（伤口中的蛆，white + shadowPurple 头）
    for (let i = 0; i < 4; i++) {
      let mx = Math.sin(frameCount * 0.05 + i * 2) * size * 0.2;
      let my = -size * 0.1 + ((frameCount * 0.3 + i * 30) % (size * 0.4));
      cFill('white', 220 * (1 - deathT));
      ellipse(mx, my, 4, 2);
      cFill('shadowPurple', 200 * (1 - deathT));
      ellipse(mx, my, 1.5, 1.5);
    }
    // 3 滴下垂绿液（green 暗调，溶解入背景）
    noStroke();
    for (let i = 0; i < 3; i++) {
      let dy = (frameCount * 0.5 + i * 40) % (size * 1.2);
      cFill('green', (200 - dy) * (1 - deathT));
      ellipse(-size * 0.3 + i * size * 0.3, size * 0.45 + dy * 0.4, 5, 8);

    // 6 只绕飞苍蝇群（shadowPurple + white 眼，保留但降饱和）
    for (let i = 0; i < 6; i++) {
      let a = (i / 6) * Math.PI * 2 + frameCount * 0.1;
      let r = size * (0.7 + Math.sin(frameCount * 0.07 + i) * 0.1);

      let fy = Math.sin(a) * r * 0.7;
      cFill('shadowPurple', 220 * (1 - deathT));
      ellipse(fx, fy, 4, 3);
      cFill('white', 200 * (1 - deathT));
      ellipse(fx - 1, fy - 1, 1.5, 1.5);
      ellipse(fx + 1, fy - 1, 1.5, 1.5);
    }
    // 顶部边缘光（bone 强调腹胀顶部，模拟腐光照射腐肉）
    this.drawRimLight(0, 0, size * 1.1, size * 0.95, 0, 'bone', 80 * (1 - deathT));
  }

  // 10. 符文之蛇：shadowPurple 蛇身 + 腐蚀坑 + 正面符文光 + 尾部溶解（T213 V3）
  drawGlyphSerpent(size, color, pulse, hitDeform, deathT) {

    rotate(frameCount * 0.02);

    noStroke();
    for (let i = 0; i < 8; i++) {
      let a = (i / 8) * Math.PI * 2;
      ellipse(Math.cos(a) * size * 0.55, size * 0.2 + Math.sin(a) * size * 0.33, 4, 4);
    }
    pop();
    push();
    rotate(-frameCount * 0.015);
    cStroke('gold', 150 * (1 - deathT));
    strokeWeight(1);
    noFill();
    ellipse(0, size * 0.2, size * 0.7, size * 0.7);
    pop();
    // 蛇身三圈盘绕（每圈三层明暗 + 腐蚀坑纹理 + 金色双色调）
    noStroke();
    for (let i = 0; i < 3; i++) {
      let ringR = size * (0.6 - i * 0.15);
      // 三层明暗：shadowPurple 暗面 → color 中间 → goldBright 高光（正面符文光）
      let ringAlpha = (240 - i * 30) * (1 - deathT);
      this.drawShadedBody(0, 0, ringR * 2, ringR * 0.7, 'shadowPurple', color, 'goldBright', 3, ringAlpha);
      // 金色双色调叠加（gold 中间层）
      cFill('gold', 100 * (1 - deathT));
      ellipse(-size * 0.03, -size * 0.02, ringR * 1.7, ringR * 0.55);
      // 腐蚀坑纹理（rust 暗调，符文腐蚀岁月痕迹）
      this.drawCorrosion(0, 0, ringR * 1.6, ringR * 0.55, 'rust', 8);
      // 鳞片纹理（goldDim 降饱和弧线）
      cStroke('goldDim', 120 * (1 - deathT));
      strokeWeight(0.6);
      noFill();
      for (let s = 0; s < 6; s++) {
        let sa = (s / 6) * Math.PI * 2;
        arc(Math.cos(sa) * ringR * 0.7, Math.sin(sa) * ringR * 0.3, 6, 4, 0, Math.PI);
      }
      noStroke();
      // 内部暗腔（shadowPurple 替代 bg 纯黑）
      cFill('shadowPurple', 100 * (1 - deathT));
      ellipse(0, 0, ringR * 1.4, ringR * 0.35);
    }
    // 最内圈尾部溶解（蛇身隐入符阵，强化符文蛇的神秘感）
    for (let i = 0; i < 4; i++) {
      let t = i / 3;
      this.dissolveEdge(0, 0, size * 0.15 * (1 - t * 0.25), 180 * (1 - deathT), t);
    }
    // 三角蛇头（顶部，三层明暗）
    push();
    translate(0, -size * 0.4);
    // 头部三层明暗（shadowPurple + color + goldBright 正面符文光）
    this.drawShadedBody(0, 0, size * 0.3, size * 0.25, 'shadowPurple', color, 'goldBright', 3, 255 * (1 - deathT));
    // 头部腐蚀坑
    this.drawCorrosion(0, 0, size * 0.25, size * 0.2, 'rust', 4);
    // 头部金色高光（gold 中间层）
    cFill('gold', 120 * (1 - deathT));
    noStroke();
    triangle(0, -size * 0.2, -size * 0.1, size * 0.03, size * 0.1, size * 0.03);
    // 分叉信子（red 暗调）
    cFill('red', 220 * (1 - deathT));
    triangle(0, -size * 0.2, -size * 0.03, -size * 0.28, 0.03, -size * 0.28);
    // 竖瞳裂缝眼（保留）
    this.drawEyeSlit(-size * 0.06, -size * 0.05, size * 0.05, 'red', 1 - deathT);
    this.drawEyeSlit(size * 0.06, -size * 0.05, size * 0.05, 'red', 1 - deathT);
    pop();
    // 正面符文光（goldBright 强调符阵发光中心，神秘氛围）
    this.drawRimLight(0, 0, size * 1.1, size * 1.1, 3, 'goldBright', 100 * (1 - deathT));
  }

  // 11. 噩梦骑士（ELITE）：三层明暗 + 背光剪影 + 锈斑 + 骨裂 + 披风溶解（T213 V3）
  drawNightmareKnight(size, color, pulse, hitDeform, deathT) {
    // 主光源：侧后方背光（剪影悲剧感），暗面 shadowPurple / 中间调 rust / 高光 redDim 焦点眼
    // 长披风（shadowPurple 替代纯黑 bg，边缘溶解入背景）
    noStroke();
    this.drawShearedGroup(-0.03, 0.01, () => {
      // 披风底色（深紫伤，非纯黑——保留深度）
      cFill('shadowPurple', 230);
      triangle(-size * 0.4, -size * 0.1, size * 0.4, -size * 0.1, 0, size * 0.7);
      // 披风中段（中间调 rust 降饱和）
      cFill('rust', 140);
      triangle(-size * 0.32, -size * 0.08, size * 0.32, -size * 0.08, 0, size * 0.55);
      // 披风剪影高光（背光边缘亮线）
      cStroke('redDim', 180);
      strokeWeight(1.2);
      noFill();
      line(0, -size * 0.1, 0, size * 0.7);
      noStroke();
      // 披风下缘溶解（与背景渐变）
      for (let i = 0; i < 5; i++) {
        let t = i / 4;
        this.dissolveEdge(0, size * 0.7 - i * 2, size * 0.4 * (1 - t * 0.3), 200, t);
      }
    });
    // 胸甲（三层明暗分层：shadowPurple 暗面 → rust 中间 → redDim 高光焦点眼缝）
    this.drawShadedBody(0, size * 0.12, size * 0.5, size * 0.45, 'shadowPurple', 'rust', 'redDim', 2, 255 * (1 - deathT));
    // 胸甲边框（暗金降饱和）
    cStroke('goldDim', 200);
    strokeWeight(1.5);
    noFill();
    rect(-size * 0.25, -size * 0.1, size * 0.5, size * 0.45, 4);
    noStroke();
    // 胸甲锈斑（rustSpots 纹理）
    this.drawRustSpots(0, size * 0.12, size * 0.5, size * 0.45, 'rust', 10);
    // 头盔（三层）
    this.drawShadedBody(0, -size * 0.35, size * 0.4, size * 0.4, 'shadowPurple', 'rust', 'redDim', 2, 255 * (1 - deathT));
    // 头盔尖顶
    cFill('shadowPurple', 230);
    triangle(0, -size * 0.55, -size * 0.2, -size * 0.2, size * 0.2, -size * 0.2);
    // 头盔骨裂纹理（deriveBoneTexture）
    this.deriveBoneTexture(0, -size * 0.35, size * 0.4, size * 0.4, 'bone');
    // 头盔额带
    cStroke('goldDim', 200);
    strokeWeight(1);
    noFill();
    rect(-size * 0.15, -size * 0.25, size * 0.3, size * 0.1, 2);
    noStroke();
    // 肩甲尖刺（加长，shadowPurple + rust 渐层）
    cFill('shadowPurple', 230);
    triangle(-size * 0.3, -size * 0.1, -size * 0.55, -size * 0.35, -size * 0.22, -size * 0.2);
    triangle(size * 0.3, -size * 0.1, size * 0.55, -size * 0.35, size * 0.22, -size * 0.2);
    cFill('rust', 160);
    triangle(-size * 0.3, -size * 0.1, -size * 0.5, -size * 0.3, -size * 0.24, -size * 0.18);
    triangle(size * 0.3, -size * 0.1, size * 0.5, -size * 0.3, size * 0.24, -size * 0.18);
    // 肩甲锈斑
    this.drawRustSpots(-size * 0.35, -size * 0.2, size * 0.2, size * 0.2, 'rust', 4);
    this.drawRustSpots(size * 0.35, -size * 0.2, size * 0.2, size * 0.2, 'rust', 4);
    // 空洞眼眶（紫光内溢，焦点高光 redDim——背光剪影中唯一亮点）
    this.drawEyeHollow(-size * 0.08, -size * 0.32, size * 0.05, 'purpleBright', 1 - deathT);
    this.drawEyeHollow(size * 0.08, -size * 0.32, size * 0.05, 'purpleBright', 1 - deathT);
    // 双手举锯齿剑（剪切扭曲 grotesque）
    push();
    translate(size * 0.15, -size * 0.1);
    rotate(Math.sin(frameCount * 0.05) * 0.05 - 0.7);
    // 剑柄 + 护手（暗金降饱和）
    cFill('goldDim', 220);
    noStroke();
    rect(-size * 0.04, -size * 0.05, size * 0.08, size * 0.15, 2);
    cFill('goldDim', 180);
    rect(-size * 0.1, size * 0.05, size * 0.2, size * 0.04, 1);
    // 锯齿剑身（shadowPurple → bone 渐层 + 骨裂纹理）
    cFill('shadowPurple', 240);
    rect(-size * 0.03, -size * 0.7, size * 0.06, size * 0.65, 1);
    cFill('bone', 180);
    rect(-size * 0.025, -size * 0.68, size * 0.05, size * 0.6, 1);
    this.deriveBoneTexture(0, -size * 0.38, size * 0.05, size * 0.6, 'shadowPurple');
    // 锯齿（两侧尖刺）
    cFill('bone', 200);
    for (let i = 0; i < 6; i++) {
      let y = -size * 0.65 + i * size * 0.1;
      triangle(0, y, -size * 0.03, y + size * 0.05, -size * 0.1, y + size * 0.02);
      triangle(0, y, size * 0.03, y + size * 0.05, size * 0.1, y + size * 0.02);
    }
    // 怨气飘散粒子（从剑身向上飘出，紫雾溶解）
    noStroke();
    for (let i = 0; i < 5; i++) {
      let t = (frameCount * 0.6 + i * 20) % 60;
      let lifeT = t / 60;
      cFill('shadowPurple', 160 * (1 - lifeT));
      ellipse(Math.sin(frameCount * 0.05 + i) * size * 0.05, -size * 0.65 - lifeT * size * 0.4, 3 + lifeT * 4, 3 + lifeT * 4);
    }
    pop();
  }

  // 12. 深渊手稿·真名（BOSS）：3D 透视书 + 噪声扭曲 + 页面湿润 + 暗腔紫伤 + 自下而上红光（T213 V3 重做）
  drawCodexAbyssus(size, color, pulse, hitDeform, deathT) {
    // 主光源：自下而上（地裂红光从书底涌出，Boss 威压）
    // 烟雾光晕（shadowPurple 替代 purple，降低饱和度）
    this.drawSmokeGlow(0, 0, size * 1.05, 'shadowPurple', 0);
    // 破碎文字环（降饱和红：redDim 替代 redBright）
    push();
    rotate(frameCount * 0.01);
    noFill();
    cStroke('redDim', 90);
    strokeWeight(1.2);
    ellipse(0, 0, size * 1.9 * pulse, size * 1.9 * pulse);
    cStroke('redDim', 50);
    ellipse(0, 0, size * 2.2 * pulse, size * 2.2 * pulse);
    pop();
    // 黑暗能量粒子溢出（shadowPurple 替代 purple，从书页缝隙上升 + 自下而上方向）
    noStroke();
    for (let i = 0; i < 10; i++) {
      let t = (frameCount * 0.5 + i * 40) % 100;
      let lifeT = t / 100;
      let px = Math.sin(i * 1.7) * size * 0.4;
      // 自下而上：从底部 size*0.3 升到顶部 -size*0.6
      let py = size * 0.3 - lifeT * size * 0.9;
      cFill('shadowPurple', 150 * (1 - lifeT));
      ellipse(px, py, 5 + lifeT * 6, 5 + lifeT * 6);
    }
    // 3D 透视翻开的书：左右页梯形 + bezier 弧度卷曲 + 厚度条 + 书脊阴影
    // 透视原理（朝玩家打开）：外侧（页面外边缘，近玩家）满高，内侧（书脊，远玩家）缩短 30% → 近大远小：书页朝观察者展开
    let bend = Math.sin(frameCount * 0.04) * size * 0.015;          // 页面颤动（活物感）
    let spineX = size * 0.03;                                       // 书脊半宽
    let farX = size * 0.5;                                          // 页面外边缘（近玩家）
    let nearTop = -size * 0.22, nearBot = size * 0.22;              // 内侧（书脊侧，远玩家）缩短
    let farTop = -size * 0.32, farBot = size * 0.32;                // 外侧（页面外边缘，近玩家）满高
    push();
    // 桌面投影（shadowPurple 替代纯黑 #000，保留深度）
    cFill('shadowPurple', 80);
    noStroke();
    ellipse(0, size * 0.42, size * 1.1, size * 0.15);
    // 左页厚度条（shadowTeal 替代 #1a0a08，深青冷）
    cFill('shadowTeal', 240);
    quad(farX - size * 0.04, farTop, farX, farTop, farX, farBot, farX - size * 0.04, farBot);
    // 右页厚度条
    quad(-farX, farTop, -farX + size * 0.04, farTop, -farX + size * 0.04, farBot, -farX, farBot);
    // 左页主体（梯形 + bezierVertex 弧度卷曲，外侧向内弯；色：shadowPurple 暗面 → 中间调 bone 古黄）
    cFill('shadowPurple', 235);
    beginShape();
    vertex(-spineX, nearTop);
    bezierVertex(-size * 0.22, nearTop + bend, -size * 0.4, farTop + bend, -farX, farTop);
    vertex(-farX, farBot);
    bezierVertex(-size * 0.4, farBot + bend, -size * 0.22, nearBot + bend, -spineX, nearBot);
    endShape(CLOSE);
    // 左页中间调 bone（古黄底色）
    cFill('bone', 180);
    beginShape();
    vertex(-spineX - size * 0.02, nearTop + size * 0.02);
    bezierVertex(-size * 0.22, nearTop + bend + size * 0.02, -size * 0.4, farTop + bend + size * 0.02, -farX + size * 0.03, farTop + size * 0.02);
    vertex(-farX + size * 0.03, farBot - size * 0.02);
    bezierVertex(-size * 0.4, farBot + bend - size * 0.02, -size * 0.22, nearBot + bend - size * 0.02, -spineX - size * 0.02, nearBot - size * 0.02);
    endShape(CLOSE);
    // 右页主体（镜像，shadowPurple）
    cFill('shadowPurple', 235);
    beginShape();
    vertex(spineX, nearTop);
    bezierVertex(size * 0.22, nearTop + bend, size * 0.4, farTop + bend, farX, farTop);
    vertex(farX, farBot);
    bezierVertex(size * 0.4, farBot + bend, size * 0.22, nearBot + bend, spineX, nearBot);
    endShape(CLOSE);
    // 右页中间调 bone
    cFill('bone', 180);
    beginShape();
    vertex(spineX + size * 0.02, nearTop + size * 0.02);
    bezierVertex(size * 0.22, nearTop + bend + size * 0.02, size * 0.4, farTop + bend + size * 0.02, farX - size * 0.03, farTop + size * 0.02);
    vertex(farX - size * 0.03, farBot - size * 0.02);
    bezierVertex(size * 0.4, farBot + bend - size * 0.02, size * 0.22, nearBot + bend - size * 0.02, spineX + size * 0.02, nearBot - size * 0.02);
    endShape(CLOSE);
    // 页面湿润反光（wetShine，自下而上流动）
    this.drawWetShine(-size * 0.25, 0, size * 0.4, size * 0.5, 'white', 0);
    this.drawWetShine(size * 0.25, 0, size * 0.4, size * 0.5, 'white', 1.5);
    // 书脊内侧阴影渐变（shadowPurple 替代 #1a0a08）
    cFill('shadowPurple', 180);
    quad(-spineX, nearTop, -spineX - size * 0.08, nearTop * 0.85, -spineX - size * 0.08, nearBot * 0.85, -spineX, nearBot);
    quad(spineX, nearTop, spineX + size * 0.08, nearTop * 0.85, spineX + size * 0.08, nearBot * 0.85, spineX, nearBot);
    // 页面文字流（降饱和 redDim 替代 redBright）
    cStroke('redDim', 130);
    strokeWeight(0.7);
    for (let i = 0; i < 7; i++) {
      let t = i / 6;
      let yNear = nearTop + t * (nearBot - nearTop);
      let yFar = farTop + t * (farBot - farTop);
      let wob = Math.sin(frameCount * 0.05 + i * 0.7) * 0.8;
      let lenL = size * (0.36 + Math.sin(i * 1.3) * 0.05);
      let lenR = size * (0.36 + Math.cos(i * 1.7) * 0.05);
      let xStartL = -spineX - size * 0.02;
      let xEndL = -spineX - lenL;
      line(xStartL, yNear + wob, xEndL, yFar + wob);
      line(spineX + size * 0.02, yNear + wob, spineX + lenR, yFar + wob);
    }
    noStroke();
    // 页眉/页脚装饰金线（降饱和 goldDim 替代 gold）
    cStroke('goldDim', 150);
    strokeWeight(0.6);
    line(-spineX, nearTop + size * 0.04, -farX, farTop + size * 0.04);
    line(spineX, nearTop + size * 0.04, farX, farTop + size * 0.04);
    line(-spineX, nearBot - size * 0.04, -farX, farBot - size * 0.04);
    line(spineX, nearBot - size * 0.04, farX, farBot - size * 0.04);
    noStroke();
    // 金色注脚（goldDim）
    cFill('goldDim', 200);
    for (let i = 0; i < 3; i++) {
      let px = -size * 0.25 + i * size * 0.08;
      ellipse(px, farBot - size * 0.06, 1.8, 1.8);
      ellipse(-px, farBot - size * 0.06, 1.8, 1.8);
    }
    pop();
    // 书脊（V 字内凹立体感：shadowPurple 底 + goldDim 镶嵌 + 3 颗脉动宝石）
    push();
    cFill('shadowPurple', 255);
    noStroke();
    rect(-spineX, nearTop, spineX * 2, nearBot - nearTop, 1);
    // 书脊两侧高光（立体感）
    cFill('bone', 200);
    rect(-spineX, nearTop, size * 0.012, nearBot - nearTop);
    rect(spineX - size * 0.012, nearTop, size * 0.012, nearBot - nearTop);
    // 中央凹槽（深色 V 形，shadowTeal 替代 #000）
    cFill('shadowTeal', 200);
    rect(-size * 0.008, nearTop, size * 0.016, nearBot - nearTop);
    cStroke('goldDim', 220);
    strokeWeight(1);
    noFill();
    rect(-spineX, nearTop, spineX * 2, nearBot - nearTop, 1);
    noStroke();
    for (let i = 0; i < 3; i++) {
      let gy = -size * 0.2 + i * size * 0.2;
      let gemPulse = 0.6 + Math.sin(frameCount * 0.08 + i * 2) * 0.4;
      // 宝石底座（goldDim 环）
      cFill('goldDim', 200);
      ellipse(0, gy, size * 0.06, size * 0.07);
      // 宝石主体（redDim 脉动，降饱和）
      cFill('redDim', 220 * gemPulse);
      ellipse(0, gy, size * 0.04, size * 0.05);
      // 宝石高光
      cFill('white', 200 * gemPulse);
      ellipse(-size * 0.006, gy - size * 0.006, size * 0.014, size * 0.014);
    }
    pop();
    // 封面边角符文（4 角，goldDim/redDim 交替，菱形框）
    const cornerChars = ['✠', '☿', '♁', '⛤'];
    const corners = [[-farX * 0.9, farTop * 0.9], [farX * 0.9, farTop * 0.9], [-farX * 0.9, farBot * 0.9], [farX * 0.9, farBot * 0.9]];
    for (let i = 0; i < 4; i++) {
      this.drawGlyph(corners[i][0], corners[i][1], size * 0.05, i % 2 === 0 ? 'goldDim' : 'redDim', cornerChars[i], 0.05, 'diamond');
    }
    // 8 段浮空古符绕中心旋转
    const bookChars = ['✠', '☿', '♁', '⛤', '✦', '◈', '⚗', '✶'];
    for (let i = 0; i < 8; i++) {
      let a = (i / 8) * Math.PI * 2 + frameCount * 0.02;
      let r = size * 0.95;
      this.drawGlyph(Math.cos(a) * r, Math.sin(a) * r, size * 0.14, 'redDim', bookChars[i], 0.04, 'circle');
    }
    // 自下而上红光光源（书底向上的红色辉光，boss 威压）
    push();
    blendMode(ADD);
    noStroke();
    for (let i = 0; i < 3; i++) {
      cFill('redDim', 60 - i * 15);
      ellipse(0, size * 0.3 - i * size * 0.05, size * (1.0 - i * 0.15), size * 0.3);
    }
    blendMode(BLEND);
    pop();
    // 中心恐怖独眼（redDim 替代 red，降饱和）
    this.drawEyeHorror(0, 0, size * 0.18, 'redDim', 1 - deathT);
    // Boss 红光环（redDim）
    cStroke('redDim', (80 + Math.sin(frameCount * 0.05) * 40) * (1 - deathT));
    strokeWeight(2);
    noFill();
    ellipse(0, 0, size * 1.8 * pulse, size * 1.8 * pulse);
    noStroke();
  }

  // 13. 虚空君主（BOSS）：噪声扭曲主体 + 三层明暗 + 自下而上 P3 红光 + 触手溶解（T213 V3 重做）
  drawVoidSovereign(size, color, pulse, hitDeform, deathT, cs) {
    // 主光源：自下而上（P1/P2 紫光，P3 红光从地裂涌出，Boss 威压）
    // 阶段检测
    let hpPct = cs ? cs.enemyHp / cs.enemyMaxHp : 1;
    let phase = 1;
    if (hpPct < 0.6) phase = 2;
    if (hpPct < 0.3) phase = 3;
    // 3 层不同形态光环（shadowPurple 替代 purple，降低饱和度）
    this.drawSmokeGlow(0, 0, size * 1.1, 'shadowPurple', 0);                                    // P1 烟雾
    if (phase >= 2) this.drawRuneHalo(0, 0, size * 1.25, 'orange', Math.PI, 'diamond');         // P2 菱形符文（orange 替代 orangeBright）
    if (phase >= 3) this.drawRuneHalo(0, 0, size * 1.45, 'redDim', 0, 'triangle');              // P3 三角破碎（redDim 替代 redBright）
    // 尖刺王座（shadowPurple + rust 渐层，shadowTeal 替代 bg 暗腔）
    noStroke();
    cFill('shadowPurple', 200);
    triangle(-size * 0.5, size * 0.4, size * 0.5, size * 0.4, 0, size * 0.8);
    cFill('rust', 180);
    rect(-size * 0.45, size * 0.35, size * 0.9, size * 0.1, 2);
    // 王座尖刺（向上，shadowPurple + rust 渐层）
    cFill('rust', 220);
    for (let i = 0; i < 5; i++) {
      let sx = -size * 0.4 + i * size * 0.2;
      triangle(sx - size * 0.05, size * 0.4, sx + size * 0.05, size * 0.4, sx, size * 0.2);
    }
    // 主体：噪声扭曲 blob（drawNoiseDistortBlob 替代 ellipse，怪诞不安轮廓）
    // 三层明暗：shadowPurple 暗面 → rust 中间调 → 阶段变色高光焦点
    let bodyLight = phase >= 3 ? 'redDim' : phase >= 2 ? 'orange' : 'goldDim';   // 降饱和中间调
    let bodyHigh = phase >= 3 ? 'redDim' : phase >= 2 ? 'orange' : 'goldDim';    // 高光（自下而上 P3 红）
    let lightDir = phase >= 3 ? 1 : 0;                                            // P3 自下而上红光，P1/P2 顶光
    // 噪声扭曲主体外层（shadowPurple）
    this.drawNoiseDistortBlob(0, 0, size * 0.42 * pulse, 1.5, 0.18, 'shadowPurple', frameCount * 0.005, 250 * (1 - deathT));
    // 噪声扭曲主体中层（rust 中间调）
    this.drawNoiseDistortBlob(0, 0, size * 0.36 * pulse, 1.5, 0.15, 'rust', frameCount * 0.005 + 100, 200 * (1 - deathT));
    // 噪声扭曲主体高光层（阶段变色，仅 lightDir 方向 15% 区域）
    let hlOffY = lightDir === 1 ? size * 0.18 : -size * 0.18;
    this.drawNoiseDistortBlob(0, hlOffY, size * 0.18 * pulse, 1.2, 0.08, bodyHigh, frameCount * 0.005 + 200, 130 * (1 - deathT));
    // 主体内暗腔（shadowTeal 替代 bg，保留深度）
    cFill('shadowTeal', 130);
    ellipse(0, 0, size * 0.45 * pulse, size * 0.55 * pulse);
    // 顶部虚空王冠（5 尖角，阶段变色降饱和）
    push();
    translate(0, -size * 0.55);
    let crownColor = phase >= 3 ? 'redDim' : phase >= 2 ? 'orange' : 'goldDim';
    cFill(crownColor, 240);
    noStroke();
    beginShape();
    vertex(-size * 0.4, 0); vertex(-size * 0.25, -size * 0.2); vertex(-size * 0.1, -size * 0.05);
    vertex(0, -size * 0.3); vertex(size * 0.1, -size * 0.05); vertex(size * 0.25, -size * 0.2); vertex(size * 0.4, 0);
    endShape(CLOSE);
    cStroke('goldDim', 200);
    strokeWeight(1.5);
    noFill();
    beginShape();
    vertex(-size * 0.4, 0); vertex(-size * 0.25, -size * 0.2); vertex(-size * 0.1, -size * 0.05);
    vertex(0, -size * 0.3); vertex(size * 0.1, -size * 0.05); vertex(size * 0.25, -size * 0.2); vertex(size * 0.4, 0);
    endShape(CLOSE);
    pop();
    // 8 条尖刺触手（shadowPurple 替代 purpleBright，触手末梢溶解）
    for (let i = 0; i < 8; i++) {
      let a = (i / 8) * Math.PI * 2 + frameCount * 0.01;
      // 主触手段
      this.drawTentacle(Math.cos(a) * size * 0.4, Math.sin(a) * size * 0.4, a, size * 0.5, 5, 'shadowPurple', frameCount * 0.04 + i, 220 * (1 - deathT), 'spiked');
      // 触手末梢溶解（与背景渐变）
      let tipX = Math.cos(a) * size * 0.9;
      let tipY = Math.sin(a) * size * 0.9;
      for (let j = 0; j < 3; j++) {
        let t = j / 2;
        this.dissolveEdge(tipX + Math.cos(a) * t * size * 0.05, tipY + Math.sin(a) * t * size * 0.05, 5 * (1 - t * 0.3), 200, t);
      }
    }
    // 中心恐怖独眼（shadowPurple 替代 purpleBright，降饱和焦点）
    this.drawEyeHorror(0, 0, size * 0.2, 'shadowPurple', 1 - deathT);
    // 自下而上红光光源（P3 阶段书底向上辉光，boss 威压）
    if (phase >= 3) {
      push();
      blendMode(ADD);
      noStroke();
      for (let i = 0; i < 3; i++) {
        cFill('redDim', 70 - i * 18);
        ellipse(0, size * 0.3 - i * size * 0.05, size * (0.9 - i * 0.15), size * 0.3);
      }
      blendMode(BLEND);
      pop();
    }
    // 右侧边缘光（crownColor 降饱和）
    this.drawRimLight(0, 0, size * 0.85 * pulse, size * 1.0 * pulse, 1, crownColor, 90);
  }
  drawEnemyHealthBar( x, y, w, hp, maxHp, block) {
    push();
    translate(x - w / 2, y);
    // 背景
    fill(0, 120);
    noStroke();
    rect(0, 0, w, 14, 3);
    // 格挡（敌方血条用红色系，T170 敌我差异化）
    if (block > 0) {
      let bw = (block / (maxHp + block)) * w;
      cFill('redBright');
      rect(0, 0, Math.min(bw, w), 14, 3);
    }
    // 血量
    let hw = (hp / maxHp) * w;
    if (hp / maxHp > 0.5) cFill('red'); else if (hp / maxHp > 0.25) cFill('orange'); else cFill('redBright');
    rect(0, 0, Math.max(0, hw), 14, 3);
    // 边框
    noFill();
    cStroke('goldDim');
    strokeWeight(1);
    rect(0, 0, w, 14, 3);
    // 文字
    cFill('white');
    textAlign(CENTER, CENTER);
    textSize(10);
    text(`${hp}/${maxHp}`, w / 2, 7);
    pop();
  }
  drawPlayer() {

    let breath = Math.sin(this.playerAnim.breathPhase);

    this.playerAnim.defendAnim *= 0.92;
    this.playerAnim.blockHitFlash *= 0.82; // T171：格挡受击闪现衰减
    this.playerAnim.shieldShatter *= 0.90; // T171：护盾破碎碎片飞散衰减
    this.playerAnim.defendPulse *= 0.88;   // T171：举盾冲击波扩散衰减

    let headY = -38 + breath * 1;
    // 头部光晕
    fill(255, 220, 100, 15 + Math.sin(frameCount * 0.05) * 8);
    ellipse(0, headY, 36, 36);
    // 头部主体
    cFill('bgLight');
    ellipse(0, headY, 24, 26);
    // 面具裂纹
    cStroke('goldDim', 150);
    strokeWeight(1);
    noFill();
    line(-8, headY - 5, -3, headY + 3);
    line(3, headY - 8, 8, headY - 2);
    line(-2, headY + 2, 4, headY + 8);
    noStroke();
    // 眼睛 - 发光的符文之眼
    let eyeGlow = 0.6 + Math.sin(frameCount * 0.08) * 0.4;
    fill(240, 200, 80, 255 * eyeGlow);
    ellipse(-5, headY - 2, 5, 7);
    ellipse(5, headY - 2, 5, 7);
    fill(255, 255, 200, 200 * eyeGlow);
    ellipse(-5, headY - 2, 2, 3);
    ellipse(5, headY - 2, 2, 3);
    // 额头符文
    cFill('goldDim', 100);
    textAlign(CENTER, CENTER);
    textSize(8);
    text('◈', 0, headY - 10);
    // 攻击挥动动画 - 右手前伸
    if (this.playerAnim.attackAnim > 0.1) {
      let atkT = this.playerAnim.attackAnim;
      cStroke('goldBright', 200 * atkT);
      strokeWeight(3);
      noFill();
      // 能量弧线
      beginShape();
      for (let j = 0; j <= 8; j++) {
        let t = j / 8;
        let x = lerp(10, 40, t) + Math.sin(t * Math.PI * 3) * 5 * atkT;
        let y = lerp(0, -20, t) - t * 10;
        vertex(x, y);
      }
      endShape();
      // 能量粒子
      noStroke();
      cFill('goldBright', 200 * atkT);
      for (let p = 0; p < 4; p++) {
        let px2 = 20 + p * 8 + rand(-3, 3);
        let py2 = -10 - p * 5 + rand(-3, 3);
        ellipse(px2, py2, 3, 3);
      }
    }
    // T171：玩家格挡护盾视觉重写 —— 圆形多层旋转（蓝色系，与敌方对称升级）
    // T172：增大护盾尺寸(shieldR 55→75) + 提高各层 alpha(减少透明度，提升清晰度)
    // 触发条件：举盾动画进行中 或 当前存在格挡值
    if (this.playerAnim.defendAnim > 0.1 || cs.playerBlock > 0) {
      let defT = Math.max(this.playerAnim.defendAnim, cs.playerBlock > 0 ? 0.3 : 0);
      let flashBoost = this.playerAnim.blockHitFlash;
      let baseAlpha = Math.min(1, 0.75 + flashBoost * 0.25) * 240 * defT; // T172: 0.6→0.75, 180→240
      let shieldR = 75 + Math.sin(frameCount * 0.1) * 5; // T172: 55→75, 呼吸幅度 4→5
      noFill();
      // 外层：8 段虚线弧段圆环（顺时针旋转）—— blueBright 主色
      cStroke('blueBright', baseAlpha + flashBoost * 60);
      strokeWeight(2.5 + flashBoost * 2); // T172: 线宽 2→2.5
      let segCount = 8;
      let segArc = Math.PI / segCount * 0.65;
      let outerRot = frameCount * 0.008;
      for (let i = 0; i < segCount; i++) {
        let a0 = (i / segCount) * Math.PI * 2 + outerRot;
        arc(0, 0, shieldR * 2, shieldR * 2, a0, a0 + segArc);
      }
      // 中层：完整细圆环（逆时针旋转）—— blue 辅色（冰霜感，对应敌方火焰橙）
      cStroke('blue', (180 + flashBoost * 60) * defT); // T172: 120→180
      strokeWeight(1.6); // T172: 1.2→1.6
      let midR = shieldR * 0.85;
      ellipse(0, 0, midR * 2, midR * 2);
      // 中层装饰：3 段短弧（逆时针旋转，强化运动感）
      let midRot = -frameCount * 0.012;
      cStroke('blue', (230 + flashBoost * 50) * defT); // T172: 180→230
      strokeWeight(1.8); // T172: 1.5→1.8
      for (let i = 0; i < 3; i++) {
        let a0 = (i / 3) * Math.PI * 2 + midRot;
        arc(0, 0, midR * 2, midR * 2, a0, a0 + Math.PI / 6);
      }
      // 内层：符文圆环（保留原符文圈概念）
      cStroke('blueBright', (160 + flashBoost * 80) * defT); // T172: 100→160
      strokeWeight(1.3); // T172: 1→1.3
      ellipse(0, 0, shieldR * 0.7, shieldR * 0.7);
      // 粒子环绕：6 颗粒子沿圆周运动（white/blue 交替）
      let particleRot = frameCount * 0.015;
      for (let i = 0; i < 6; i++) {
        let a = (i / 6) * Math.PI * 2 + particleRot;
        let pPx = Math.cos(a) * shieldR;
        let pPy = Math.sin(a) * shieldR;
        let pColor = (i % 2 === 0) ? 'white' : 'blue';
        let pAlpha = (245 + flashBoost * 55) * defT; // T172: 200→245
        noStroke();
        cFill(pColor, pAlpha);
        ellipse(pPx, pPy, 5 + flashBoost * 3, 5 + flashBoost * 3); // T172: 粒子 4→5
      }
      // 受击瞬间额外放射光线（蓝色系）
      if (flashBoost > 0.3) {
        cStroke('blueBright', 230 * flashBoost); // T172: 180→230
        strokeWeight(1.5); // T172: 1.2→1.5
        for (let i = 0; i < 8; i++) {
          let a = (i / 8) * Math.PI * 2 + frameCount * 0.005;
          line(Math.cos(a) * shieldR * 0.7, Math.sin(a) * shieldR * 0.7,
               Math.cos(a) * shieldR * 1.1, Math.sin(a) * shieldR * 1.1);
        }
      }
    }
    // T171：举盾冲击波（defendPulse 触发，蓝色环从中心向外扩散）
    // T172：尺寸随护盾半径同步放大(25→35, 110→150) + alpha 提高(200→245)
    if (this.playerAnim.defendPulse > 0.05) {
      let pulseT = 1 - this.playerAnim.defendPulse;
      let pulseR = 35 + pulseT * 150; // T172: 25→35, 110→150（半径 35 → 185，匹配 shieldR 75）
      let pulseAlpha = this.playerAnim.defendPulse * 245; // T172: 200→245
      noFill();
      cStroke('blueBright', pulseAlpha);
      strokeWeight(2.5 + this.playerAnim.defendPulse * 2); // T172: 2→2.5
      ellipse(0, 0, pulseR * 2, pulseR * 2);
      // 内层蓝色细环（双层冲击波）
      cStroke('blue', pulseAlpha * 0.6);
      strokeWeight(1.2); // T172: 1→1.2
      ellipse(0, 0, pulseR * 1.5, pulseR * 1.5);
    }
    // T171：护盾破碎特效（shieldShatter 触发，蓝色碎片飞散）
    // T172：起始半径与飞散距离随护盾放大(50→65, 110→140) + alpha 提高(230→245) + 碎片加大(6→7)
    if (this.playerAnim.shieldShatter > 0.05) {
      let shatterT = 1 - this.playerAnim.shieldShatter;
      let shardCount = 10;
      let shardR0 = 65; // T172: 50→65
      let shardMaxDist = 140; // T172: 110→140
      for (let i = 0; i < shardCount; i++) {
        let a = (i / shardCount) * Math.PI * 2 + i * 0.7;
        let dist = shardR0 + shatterT * shardMaxDist;
        let sx = Math.cos(a) * dist;
        let sy = Math.sin(a) * dist + shatterT * shatterT * 30; // 重力加速
        let shardSize = 7 + Math.sin(i * 1.3) * 2; // T172: 6→7
        let shardAlpha = this.playerAnim.shieldShatter * 245; // T172: 230→245
        push();
        translate(sx, sy);
        rotate(a + shatterT * Math.PI * 0.8);
        noStroke();
        cFill('blueBright', shardAlpha);
        triangle(-shardSize * 0.5, shardSize * 0.5,
                  shardSize * 0.5, shardSize * 0.3,
                  0, -shardSize * 0.6);
        cFill('blue', shardAlpha * 0.7);
        triangle(-shardSize * 0.3, shardSize * 0.3,
                  shardSize * 0.3, shardSize * 0.15,
                  0, -shardSize * 0.4);
        pop();
      }
    }
    // 格挡数值显示（移至状态图标系统统一处理）
    pop();
    // 玩家生命
    cFill('panel');
    cStroke('panelEdge');
    strokeWeight(1);
    rect(px - 60, py - 80, 120, 20, 4);
    let hpW = (gs.hp / gs.maxHp) * 116;
    cFill('red');
    noStroke();
    rect(px - 58, py - 78, hpW, 16, 3);
    cFill('white');
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(10);
    text(`${gs.hp}/${gs.maxHp}`, px, py - 70);
    // 玩家格挡值显式展示（盾牌图标+数字，位于血条左侧）
    if (cs.playerBlock > 0) {
      let blockHit = drawStatusIcon('block', px - 75, py - 70, cs.playerBlock, 24);
      if (blockHit) this.statusIconHits.push(blockHit);
    }
    // 玩家状态图标行（使用统一系统，位于血条上方）
    let playerHits = drawStatusRow(cs.playerStatuses, px - 40, py - 95, 22, 5);
    this.statusIconHits.push(...playerHits);
  }
  // 获取或创建手牌动画状态
  getHandCardState(card) {
    if (!card || !card.id) return { offsetY: 0, scale: 1, rotation: 0, hoverProgress: 0, microRot: 0, microRotPhase: 0 };
    // T251：身份键优先数字 uid（reset 按索引/addCard 按时间戳保证全局唯一），召唤实例等无数字 uid 时退回 _uid；
    // 前缀 n/r 分命名空间防互撞。同 id 复制牌不再共享动画态，老存档中 _uid 已相同的复制牌也据此立刻分开
    let instId = card.uid != null ? 'n' + card.uid : 'r' + (card._uid || (card._uid = Math.random().toString(36).substr(2, 6)));
    let key = card.id + '_' + instId;
    if (!this.handCardStates[key]) {
      this.handCardStates[key] = {
        offsetY: 0,         // 当前Y偏移（悬停抽出）
        scale: 1,           // 当前缩放
        rotation: 0,        // 当前旋转角度
        hoverProgress: 0,   // 悬停进度 0-1
        microRot: rand(-3, 3) * Math.PI / 180, // 随机微旋转（-3°~+3°）
        microRotPhase: rand(0, Math.PI * 2),   // sin漂移相位
      };
    }
    return this.handCardStates[key];
  }
  // 判断卡牌是否为特殊卡牌（拥有镭射特效）
  isSpecialCard(card) {
    if (!card) return false;
    // 升级牌、拥有特殊关键词的牌
    if (card.upgraded) return true;
    if (card.keywords && card.keywords.some(k => ['先攻', '流转', '震慑', '异常'].includes(k))) return true;
    if (card.rarity === 'rare') return true;
    return false;
  }
  // 绘制卡牌动态阴影（多层矩形+遮挡感知，随悬浮高度/旋转变化）
  drawCardShadow(x, y, liftAmount, cardScale, rotation) {
    push();
    noStroke();
    let s = cardScale || 1;
    let rot = rotation || 0;
    // 阴影参数随悬浮高度变化（归一化到[0,1]）
    let liftFactor = clamp(liftAmount / 50, 0, 1);
    // 阴影缩放：悬浮时略大于卡牌（1.0→1.05）
    let shadowScale = 1 + liftFactor * 0.05;
    // alpha随高度降低（越高越淡）
    let baseAlpha = 60 - liftFactor * 20;

    translate(x, y);
    rotate(rot); // 阴影跟随卡牌旋转，保持形状一致
    scale(s * shadowScale);

    // === 2.1 多层矩形阴影（远层柔阴影模拟模糊）===
    let layers = [
      { offX: 8 + liftFactor * 4, offY: 16 + liftFactor * 8, alpha: 15 - liftFactor * 5 },
      { offX: 6 + liftFactor * 3, offY: 12 + liftFactor * 6, alpha: 25 - liftFactor * 8 },
      { offX: 4 + liftFactor * 2, offY: 8 + liftFactor * 4, alpha: 40 - liftFactor * 10 },
    ];
    layers.forEach(layer => {
      fill(0, Math.max(5, layer.alpha));
      rect(-CARD_W / 2 + layer.offX, -CARD_H / 2 + layer.offY, CARD_W, CARD_H, 10);
    });
    // 近层硬阴影：偏移(2,4)，圆角10
    fill(0, baseAlpha);
    rect(-CARD_W / 2 + 2, -CARD_H / 2 + 4, CARD_W, CARD_H, 10);

    pop();
  }
  // 绘制镭射覆膜效果（鼠标驱动全息折射 - 对角线光带+像素光栅+虹彩描边+噪点）
  drawCardLaser(cardScale, cardCx, cardCy, cardRotation, isHovered) {
    push();
    blendMode(ADD);
    noStroke();
    let s = cardScale || 1;
    // 色相循环：悬停时2倍速
    let hueSpeed = isHovered ? 1.0 : 0.5;
    let baseHue = (frameCount * hueSpeed) % 360;
    // 亮度提升：悬停+30%
    let brightBoost = isHovered ? 1.3 : 1.0;

    // === 鼠标在卡牌局部坐标系的相对位置（逆变换）===
    let dx = mx() - cardCx;
    let dy = my() - cardCy;
    let cosR = Math.cos(-cardRotation);
    let sinR = Math.sin(-cardRotation);
    let localMx = dx * cosR - dy * sinR;
    let localMy = dx * sinR + dy * cosR;
    // 归一化到[-1,1]
    let mouseNormX = clamp(localMx / (CARD_W * s / 2), -1, 1);
    let mouseNormY = clamp(localMy / (CARD_H * s / 2), -1, 1);

    // === 1.1 对角线全息光带（左上→右下）===
    let bandWidth = isHovered ? lerp(18, 22, 0.5) : lerp(10, 16, 0.5);
    let bandPos = (mouseNormX + mouseNormY) * 0.5; // [-1,1]

    // === 1.2 像素化光栅衍射（4x4块网格）===
    let pixSize = 4;
    let gap = 1;
    let cardW = CARD_W * s;
    let cardH = CARD_H * s;
    let bandCenter = bandPos * (cardW + cardH) * 0.25;
    let bandHalfW = bandWidth;

    colorMode(HSB, 360, 100, 100, 100);
    let pixCount = 0;
    for (let py = -cardH / 2; py < cardH / 2; py += pixSize + gap) {
      for (let px = -cardW / 2; px < cardW / 2; px += pixSize + gap) {
        // 沿对角线投影 & 垂直对角线距离
        let proj = (px + py) * 0.5;
        let perpDist = (px - py) * 0.707;
        let distToBand = Math.abs(perpDist - bandCenter);
        if (distToBand > bandHalfW) continue;
        // 光带内透明度：中心最强，边缘衰减
        let bandAlpha = (1 - distToBand / bandHalfW) * 60 * brightBoost;
        // 像素块色相 = 基础 + noise*30 + 沿光带长度渐变
        let hueOffset = noise(px * 0.1, py * 0.1, frameCount * 0.01) * 30;
        let lengthHue = (proj * 0.5 + frameCount * hueSpeed * 0.3) % 360;
        let finalHue = (baseHue + hueOffset + lengthHue) % 360;
        fill(finalHue, 70, 90 * brightBoost, bandAlpha);
        rect(px, py, pixSize, pixSize);
        pixCount++;
        if (pixCount >= 200) break; // 性能限制
      }
      if (pixCount >= 200) break;
    }

    // === 1.3 边缘虹彩描边（2px，四角色相平滑过渡）===
    let mouseDist = Math.sqrt(mouseNormX * mouseNormX + mouseNormY * mouseNormY);
    let edgeHue = (baseHue + mouseDist * 60) % 360;
    noFill();
    for (let i = 0; i < 2; i++) {
      let h = (edgeHue + i * 60) % 360;
      let a = 40 + Math.sin(frameCount * 0.05 + i) * 20;
      stroke(h, 80, 100, a);
      strokeWeight(2);
      rect(-cardW / 2 + i, -cardH / 2 + i, cardW - i * 2, cardH - i * 2, 10 - i);
    }

    // === 1.4 噪点纹理叠加（alpha 15-25，缓慢漂移）===
    noStroke();
    let noiseOffset = frameCount * 0.5;
    for (let i = 0; i < 40; i++) {
      let nx = noise(i * 0.3, noiseOffset * 0.01) * cardW - cardW / 2;
      let ny = noise(i * 0.3 + 100, noiseOffset * 0.01) * cardH - cardH / 2;
      let na = 15 + noise(i * 0.5, noiseOffset * 0.02) * 10;
      fill((baseHue + i * 10) % 360, 50, 100, na);
      rect(nx, ny, 2, 2);
    }

    colorMode(RGB, 255);
    blendMode(BLEND); // 复位混合模式
    pop();
  }
  // 敌我脚下上浮粒子
  // 玩家位置：GAME_W * 0.3, GAME_H * 0.55
  // 敌人粒子生成点：GAME_H * 0.42
  // 颜色：统一白色
  // 渐显渐隐生命周期
  // 玩家 12 颗、敌人 14 颗；cycle 90/110/130 + 100/120/140 三档异步
  drawBattleParticles() {
    push();
    blendMode(ADD); // 加法混合 → 白色 + 暗背景 = 真正"发光"
    noStroke();

    // ---- 玩家脚下：12 颗上浮粒子（白色 ADD 混合，向上飘 + 渐显现 + 3 层加法发光）----
    for (let i = 0; i < 12; i++) {
      // 异步循环：每颗粒子独立周期（90/110/130px 三档）
      let cycleLen = 90 + (i % 3) * 20;  // 90 / 110 / 130 px
      let cycle = (frameCount * 0.5 + i * 17) % cycleLen;
      let cycleProgress = cycle / cycleLen;  // 0~1，0=底部刚生成，1=顶部消失
      // 前 12% 周期渐显
      let fadeInFactor = Math.min(cycleProgress / 0.12, 1);
      // 渐隐（底部强，顶部弱，保留最小可见度）+ 渐显现叠加
      let pAlpha = fadeInFactor * ((1 - cycleProgress) * 90 + 35);
      // 渐缩（底部大，顶部小，范围更大）
      let pSize = 2.2 + (1 - cycleProgress) * 2.8;  // 2.2~5.0
      // 横向微动（更明显 ±12px）
      let pOffX = sin(frameCount * 0.03 + i * 1.5) * 12;
      let px = GAME_W * 0.30 + pOffX;
      let py = GAME_H * 0.55 - cycle - 4;
      // 3 层加法发光（ambient + halo + core）：
      // 1) 最外层 ambient（4.0x 尺寸，20% alpha）→ 远距柔光，扩大发光半径
      cFill('white', Math.min(255, pAlpha * 0.20));
      ellipse(px, py, pSize * 4.0, pSize * 4.0);
      // 2) 中层 halo（2.5x 尺寸，50% alpha）→ 主光晕，加强圣光层次
      cFill('white', Math.min(255, pAlpha * 0.50));
      ellipse(px, py, pSize * 2.5, pSize * 2.5);
      // 3) 核心 core（1.0x 尺寸，100% alpha）→ 亮中心，饱和白色
      cFill('white', Math.min(255, pAlpha));
      ellipse(px, py, pSize, pSize);
    }

    // ---- 敌人脚下：14 颗上浮粒子（白色 ADD 混合，向上飘 + 渐显现 + 3 层加法发光）----
    for (let i = 0; i < 14; i++) {
      // 异步循环：每颗粒子独立周期（100/120/140px 三档）
      let cycleLen = 100 + (i % 3) * 20;  // 100 / 120 / 140 px
      let cycle = (frameCount * 0.45 + i * 14) % cycleLen;
      let cycleProgress = cycle / cycleLen;  // 0~1
      // 前 12% 周期渐显
      let fadeInFactor = Math.min(cycleProgress / 0.12, 1);
      // 渐隐 + 渐显现叠加
      let pAlpha = fadeInFactor * ((1 - cycleProgress) * 85 + 35);
      // 渐缩
      let pSize = 2.5 + (1 - cycleProgress) * 3.0;  // 2.5~5.5
      // 横向微动（±14px）
      let pOffX = sin(frameCount * 0.025 + i * 1.7) * 14;
      let px = GAME_W * 0.65 + pOffX;
      let py = GAME_H * 0.42 - cycle - 4;
      // 3 层加法发光（ambient + halo + core）：
      // 1) 最外层 ambient（4.0x 尺寸，20% alpha）→ 远距柔光
      cFill('white', Math.min(255, pAlpha * 0.20));
      ellipse(px, py, pSize * 4.0, pSize * 4.0);
      // 2) 中层 halo（2.5x 尺寸，50% alpha）→ 主光晕
      cFill('white', Math.min(255, pAlpha * 0.50));
      ellipse(px, py, pSize * 2.5, pSize * 2.5);
      // 3) 核心 core（1.0x 尺寸，100% alpha）→ 亮中心
      cFill('white', Math.min(255, pAlpha));
      ellipse(px, py, pSize, pSize);
    }
    blendMode(BLEND); // 重置混合模式（项目硬约束：blendMode(ADD) must be reset to blendMode(BLEND)）
    pop();
  }
  drawHand() {
    let cs = gs.combatState;
    if (cs.turnPhase !== 'player') return;
    let totalCards = cs.hand.length;
    if (totalCards === 0) return;
    // 手牌间距：手牌越多越紧凑
    let spacing = totalCards > 6 ? Math.min(95, 580 / totalCards) : 110;
    let startX = GAME_W * 0.5 - (totalCards - 1) * spacing / 2;
    let baseY = GAME_H * 0.78;
    // 弧线曲率：手牌越多弧度越小
    let arcHeight = clamp(40 - totalCards * 3, 10, 40);
    let hoveredCard = this.hoveredCard;
    let dt = deltaTime || 16.67;
    // 第一遍：更新动画状态 + 绘制非悬停卡牌（含阴影）
    for (let i = 0; i < totalCards; i++) {
      let card = cs.hand[i];
      if (card === hoveredCard) continue;
      // 计算弧线位置：中间卡牌Y偏上，两端Y偏下
      let centerOffset = (i - (totalCards - 1) / 2) / Math.max(1, (totalCards - 1) / 2);
      let arcY = baseY - arcHeight * (1 - centerOffset * centerOffset);
      let cx = startX + i * spacing;
      let cy = arcY;
      // 获取动画状态
      let state = this.getHandCardState(card);
      // 悬停进度缓动：未悬停时回归0（easeInCubic）
      let targetHover = 0;
      state.hoverProgress = dampApproach(state.hoverProgress, targetHover, 0.25, dt);
      let hoverEase = easeInCubic(state.hoverProgress);
      // Y偏移：悬停时向上抽出
      let targetOffsetY = -50 * hoverEase;
      state.offsetY = dampApproach(state.offsetY, targetOffsetY, 0.3, dt);
      // 缩放：悬停时放大至1.18
      let targetScale = 1 + 0.18 * hoverEase;
      state.scale = dampApproach(state.scale, targetScale, 0.3, dt);
      // 旋转：弧线倾斜 + 微旋转sin漂移（悬停时归零）
      let arcRot = centerOffset * (totalCards > 4 ? 0.12 : 0.18); // 两端向内倾斜
      let microDrift = Math.sin(frameCount * 0.02 + state.microRotPhase) * 0.02;
      let targetRot = lerp(arcRot + state.microRot + microDrift, 0, hoverEase);
      state.rotation = dampApproach(state.rotation, targetRot, 0.3, dt);
      // 绘制阴影（在卡牌下方）
      let liftAmount = Math.abs(state.offsetY);
      this.drawCardShadow(cx, cy, liftAmount, state.scale, state.rotation);
      // 绘制卡牌
      let canPlay = this.canPlayCard(card);
      push();
      translate(cx, cy + state.offsetY);
      rotate(state.rotation);
      scale(state.scale);
      this.drawCardAt( card, 0, 0, 0, 1);
      // 镭射特效（特殊卡牌）
      if (this.isSpecialCard(card)) {
        this.drawCardLaser(1, cx, cy + state.offsetY, state.rotation, false);
      }
      if (!canPlay) {
        fill(0, 100);
        noStroke();
        rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
      }
      pop();
    }
    // 第二遍：绘制悬停卡牌（最高渲染层）
    if (hoveredCard) {
      let idx = cs.hand.indexOf(hoveredCard);
      if (idx >= 0) {
        let centerOffset = (idx - (totalCards - 1) / 2) / Math.max(1, (totalCards - 1) / 2);
        let arcY = baseY - arcHeight * (1 - centerOffset * centerOffset);
        let cx = startX + idx * spacing;
        let cy = arcY;
        let state = this.getHandCardState(hoveredCard);
        // 悬停进度缓动：悬停时趋向1（easeOutCubic）
        let targetHover = 1;
        state.hoverProgress = dampApproach(state.hoverProgress, targetHover, 0.25, dt);
        let hoverEase = easeOutCubic(state.hoverProgress);
        // Y偏移：向上抽出40-60px
        let targetOffsetY = -50 * hoverEase;
        state.offsetY = dampApproach(state.offsetY, targetOffsetY, 0.3, dt);
        // 缩放：放大至1.18
        let targetScale = 1 + 0.18 * hoverEase;
        state.scale = dampApproach(state.scale, targetScale, 0.3, dt);
        // 旋转：悬停时归零
        state.rotation = dampApproach(state.rotation, 0, 0.3, dt);
        let canPlay = this.canPlayCard(hoveredCard);
        // 阴影（含 3D 倾斜方向偏移：卡牌倾向鼠标，阴影落向反方向）
        let liftAmount = Math.abs(state.offsetY);
        let tilt = computeCardTilt(cx, cy + state.offsetY, state.scale, hoverEase);
        this.drawCardShadow(cx + tilt.shadowOffX, cy + tilt.shadowOffY, liftAmount, state.scale, state.rotation);
        push();
        translate(cx, cy + state.offsetY);
        rotate(state.rotation);
        scale(state.scale);
        applyCardTilt3D(tilt.tiltX, tilt.tiltY);   // 3D 透视倾斜
        this.drawCardAt( hoveredCard, 0, 0, 0, 1);
        // 顶部受光高光（倾斜时显现）
        applyCardSheen3D(hoverEase, tilt.tiltX, tilt.tiltY);
        // 镭射特效
        if (this.isSpecialCard(hoveredCard)) {
          this.drawCardLaser(1, cx, cy + state.offsetY, state.rotation, true);
        }
        if (!canPlay) {
          fill(0, 120);
          noStroke();
          rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
        }
        if (canPlay) {
          noFill();
          cStroke('goldBright');
          strokeWeight(2);
          rect(-CARD_W / 2 - 3, -CARD_H / 2 - 3, CARD_W + 6, CARD_H + 6, 8);
        }
        pop();
        // === 升级解释栏Tooltip（渲染在所有手牌之后，最高层）===
        if (hoveredCard.upgradeable && !hoveredCard.upgraded && hoveredCard.upgradedDesc) {
          if (this._upgradeTipScale === undefined) this._upgradeTipScale = 0;
          this._upgradeTipScale = dampApproach(this._upgradeTipScale, 1, 0.25, dt);
          if (this._upgradeTipScale > 0.01) {
            this.drawUpgradeTooltip(hoveredCard, cx, cy + state.offsetY);
          }
        }
      }
    }
    // Tooltip缩放复位（未悬停可升级卡时淡出）
    if (!hoveredCard || !hoveredCard.upgradeable || hoveredCard.upgraded || !hoveredCard.upgradedDesc) {
      if (this._upgradeTipScale === undefined) this._upgradeTipScale = 0;
      this._upgradeTipScale = dampApproach(this._upgradeTipScale, 0, 0.3, dt);
    }
  }
  drawCardAt( card, cx, cy, rot, cardScale) {
    push();
    translate(cx, cy);
    rotate(rot || 0);
    drawCardVisual(card, 0, 0, cardScale || 1);
    pop();
  }
  // 绘制升级效果悬停解释栏（半透明深色背景+金色边框+虹彩底注）
  drawUpgradeTooltip(card, cardScreenX, cardScreenY) {
    // 浅拷贝 + applyCardUpgrade 模拟升级后数值
    // 避免直接修改原卡牌，再用 projected 字段值替换占位符
    let projected = {...card};
    applyCardUpgrade(projected);
    // 计算升级后desc（占位符替换，与卡牌渲染逻辑一致）
    let upgradedText = (card.upgradedDesc || '')
      .replace('{dmg}', projected.baseDmg || 0)
      .replace('{block}', projected.baseBlock || 0);
    if (projected.comboBonus !== undefined) upgradedText = upgradedText.replace('{combo_bonus}', projected.comboBonus);
    if (projected.comboBlock !== undefined) upgradedText = upgradedText.replace('{combo_block}', projected.comboBlock);
    if (projected.comboScale !== undefined) upgradedText = upgradedText.replace('{combo_scale}', projected.comboScale);
    if (projected.statusAmt !== undefined) {
      let effectiveAmt = getEffectiveStatusAmt(projected);
      upgradedText = upgradedText.replace('{burn}', effectiveAmt).replace('{freeze}', effectiveAmt).replace('{corrode}', effectiveAmt);
    }

    // Tooltip位置：卡牌右侧（空间不足时切换到左侧）
    let tipW = 180;
    let tipH = 80;
    let tipX = cardScreenX + CARD_W / 2 + 10;
    if (tipX + tipW > GAME_W) tipX = cardScreenX - CARD_W / 2 - 10 - tipW;
    let tipY = clamp(cardScreenY - tipH / 2, 10, GAME_H - tipH - 10);

    // easeOutQuad淡入动画（从0.3缩放至1.0）
    let tipScale = lerp(0.3, 1.0, easeOutQuad(this._upgradeTipScale));

    push();
    translate(tipX + tipW / 2, tipY + tipH / 2);
    scale(tipScale);
    // 背景
    noStroke();
    fill(0, 220);
    rect(-tipW / 2, -tipH / 2, tipW, tipH, 8);
    // 金色边框
    cStroke('gold', 200);
    strokeWeight(1.5);
    noFill();
    rect(-tipW / 2, -tipH / 2, tipW, tipH, 8);
    // 标题
    noStroke();
    cFill('gold');
    textAlign(CENTER, TOP);
    textSize(13);
    textStyle(BOLD);
    text('升级效果', 0, -tipH / 2 + 8);
    // 正文
    noStroke();
    cFill('text');
    textSize(10);
    textStyle(NORMAL);
    drawCenteredText(upgradedText || '', 0, -tipH / 2 + 28, tipW - 16, 35, 11);
    // 底部虹彩小字
    noStroke();
    let hue = (frameCount * 0.5) % 360;
    colorMode(HSB, 360, 100, 100, 100);
    fill(hue, 70, 100, 80);
    textSize(9);
    text('升级后获得镭射覆膜特效', 0, tipH / 2 - 14);
    colorMode(RGB, 255);
    pop();
  }

  // 连击 UI 图标（3 匕首扇形 + 数字 + 窗口指示器）
  // 视觉布局（从左到右）：
  //   [3 匕首扇形] [大号数字] [窗口指示器 [N]]
  // 数据来源：
  //   - comboCount   → 当前连击数（任意正整数，0=无连击）
  //   - comboWindow  → 连击窗口数（0=不显示窗口，>0=显示窗口指示器）
  //   - COLORS.combo → 连击主题色 #ff6020（橙色）
  // 视觉规则：
  //   - 匕首层数 = min(comboCount, 3)：1 连击=1 亮，2 连击=2 亮，3+ 连击=3 全亮
  //   - 数字 = 实际 comboCount（始终显示真实连击数）
  //   - 窗口 = "[N]" 方框（仅当 comboWindow > 0 时显示）
  //   - 3 把匕首共用 pommel（剑柄末端长方形）作为旋转锚点 → 剑把天然重叠
  //   - 扇形角：-10°/+20°/+50°（非对称扇形）
  //   - 亮态颜色 白/浅灰/深灰 + 各匕首独立 alpha
  drawComboIcon(x, y, size, comboCount, comboWindow = 0) {
    push();
    noStroke();

    // ========== 匕首子元素参数（基于 size 相对比例）==========
    const BLADE_W  = size * 0.18;   // 刀身宽度
    const BLADE_H  = size * 0.42;   // 刀身长度
    const HILT_W   = size * 0.42;   // 横档宽度

    const POMMEL_R = size * 0.11;   // 剑柄末端"半径"（hilt 定位 + pommel 矩形高度 2*POMMEL_R = 0.22*size）
    const POMMEL_W = size * 0.10;   // 剑柄末端矩形宽度
    // 角度方向：负=逆时针=左倾，正=顺时针=右倾
    const ROTATIONS = [-PI/18, PI/9, 5*PI/18];  // -10°, +20°, +50°

    // ========== 匕首颜色方案 ==========
    // 亮态：白色 / 浅灰 / 深灰
    // 暗态：统一暗灰 + 低 alpha
    const BLADE_COLORS = ['white', 'lightGray', 'darkGray'];  // 左(白)/中(浅灰)/右(深灰)
    // 各匕首独立透明度
    const BLADE_ALPHAS = [255, 255, 255];  // 100% / 20% / 40%
    const DIM_COLOR    = '#5a5a5a';
    const DIM_ALPHA    = 50;

    const NUM_FONT_SCALE = 0.55;    // 数字字号 = size * 0.55
    const NUM_GAP        = size * 0.10;  // 数字与匕首水平间距

    const WIN_FONT_SCALE = 0.38;    // 窗口字号 = size * 0.38
    const WIN_GAP        = size * 0.10;  // 窗口与数字水平间距
    const WIN_PAD_X      = size * 0.10;  // 窗口方框水平内边距
    const WIN_PAD_Y      = size * 0.05;  // 窗口方框垂直内边距

    // 0) 辅助函数：刀身+横档+pommel 绘制逻辑（使用当前 fill 状态）
    const drawDaggerParts = () => {
      // 局部坐标系：pommel 中心 = (0, 0)，匕首向上（Y 负方向）延伸
      // Y 轴：pommel(0) → 横档(-POMMEL_R ~ -POMMEL_R-HILT_H) → 刀身(继续向上)
      const HILT_BOTTOM_Y = -POMMEL_R;                // 横档下边（紧贴 pommel 顶部）

      const BLADE_BOT_Y   = BLADE_BASE_Y;                   // 长方形底（位于 hilt 顶部）

      // ---- 刀身（5 顶点：等腰三角形 + 长方形的标准剑身样式）----
      // 顶点顺序（顺时针）：刀尖 → 右肩 → 右下角 → 左下角 → 左肩
      beginShape();
      vertex(0,                BLADE_TIP_Y);   // 顶点：刀尖
      vertex(BLADE_W * 0.5,   BLADE_UP_Y);    // 右肩（三角形底 = 长方形宽）
      vertex(BLADE_W * 0.5,   BLADE_BOT_Y);   // 右下角
      vertex(-BLADE_W * 0.5,  BLADE_BOT_Y);   // 左下角
      vertex(-BLADE_W * 0.5,  BLADE_UP_Y);    // 左肩
      endShape(CLOSE);

      // ---- 横档（刀格）----
      rect(-HILT_W * 0.5, HILT_TOP_Y, HILT_W, HILT_H);

      // ---- 剑柄末端（pommel 长方形）----
      // 矩形上边 = hilt 下边（-POMMEL_R），矩形下边 = +POMMEL_R
      rect(-POMMEL_W * 0.5, -POMMEL_R, POMMEL_W, POMMEL_R * 1.5);
    };

    // 1) 绘制 3 把匕首（pommel 锚点重叠）
    // 显示等级 = min(max(comboCount, 0), 3)：匕首仅表达前 3 层
    const displayLevel = Math.min(Math.max(comboCount, 0), 3);

    // 绘制顺序：i=2(右) → 1(中) → 0(左)，让左匕首在顶层
    for (let i = 2; i >= 0; i--) {
      try {
        const isLit = i < displayLevel;
        const rotation  = ROTATIONS[i];                          // -10° / +20° / +50°
        const bladeColor = isLit ? BLADE_COLORS[i] : DIM_COLOR;
        const alpha     = isLit ? BLADE_ALPHAS[i] : DIM_ALPHA;

        push();
        // 关键：所有 3 把匕首共用 (x, y) 作为 pommel 中心
        // rotate() 围绕 pommel 旋转 → 3 个 pommel 完全重叠
        const DAGGER_Y_OFFSET = size * 0.18;
        translate(x, y + DAGGER_Y_OFFSET);
        rotate(rotation);

        // ---- 纯填充 ----
        cFill(bladeColor, alpha);
        noStroke();

        drawDaggerParts();
      } finally {
        pop();
      }
    }

    // =============================================================
    // 2) 绘制数字（comboCount 实际值，位置在 pommel 右侧）
    // =============================================================
    // 数字 X 起点 = 匕首右端（pommel 半径 + 刀身半宽 + 旋转后水平偏移）+ 间距
    const NUM_X_OFFSET = size * 0.55;
    const numSize = size * NUM_FONT_SCALE;
    const numX    = x + NUM_X_OFFSET + NUM_GAP;
    const numY    = y;
    const numStr  = String(comboCount);

    // pop 动效：计算缩放系数
    //   250ms sine 半波实现 1.0→1.5→1.0 弹跳，由 drawBattleUI 触发
    const POP_DURATION = 250;                    // pop 总时长（ms）
    const POP_MAX_SCALE = 1.5;                   // pop 峰值缩放（1.0→1.5→1.0）
    let popScale = 1.0;
    if (this.comboPopStart > 0) {
      const elapsed = millis() - this.comboPopStart;
      if (elapsed < POP_DURATION) {
        const t = elapsed / POP_DURATION;
        // sine 半波：t=0→scale=1.0, t=0.5→scale=1.5, t=1→scale=1.0
        popScale = 1.0 + 0.5 * Math.sin(Math.PI * t);
      } else {
        this.comboPopStart = 0;                  // 动效结束，重置 start 避免下次帧重算
      }
    }

    // 在 push 块内绘制 + 测量宽度（保证 textWidth 使用正确字号）
    let numW = 0;
    push();
    cFill('combo');                  // 数字使用连击主题色（橙色）
    noStroke();
    textAlign(LEFT, CENTER);
    textStyle(BOLD);
    textSize(numSize);
    // 先测量宽度（用于缩放中心 + 窗口定位）
    numW = textWidth(numStr);
    const numCenterX = numX + numW * 0.5;

    // 围绕数字视觉中心应用 pop 缩放
    //   push/pop 包裹保证仅数字缩放，不影响后续窗口绘制
    if (popScale !== 1.0) {
      push();
      translate(numCenterX, numY);
      scale(popScale);
      translate(-numCenterX, -numY);
    }
    text(numStr, numX, numY);
    if (popScale !== 1.0) {
      pop();
    }
    pop();

    // =============================================================
    // 3) 绘制连击窗口指示器（仅当 comboWindow > 0 时显示）
    // =============================================================
    if (comboWindow > 0) {
      const winSize = size * WIN_FONT_SCALE;
      const winText = `[${comboWindow}]`;

      // 测量方框尺寸
      push();
      textSize(winSize);
      textStyle(BOLD);
      const tw = textWidth(winText);
      const winBoxW = tw + WIN_PAD_X * 2;
      const winBoxH = winSize + WIN_PAD_Y * 2;
      pop();

      // 窗口位置 = 数字右端 + 间距
      const winX = numX + numW + WIN_GAP;
      const winY = numY - winBoxH * 0.5;

      // ---- 窗口方框（圆角矩形 + 描边 + 浅填充）----
      cFill('panel', 60);            // 浅色背景
      cStroke('combo', 200);         // 橙色描边
      strokeWeight(2);
      rect(winX, winY, winBoxW, winBoxH, 4);  // 4px 圆角

      // ---- 窗口文字（居中）----
      cFill('combo');
      noStroke();
      textAlign(CENTER, CENTER);
      textStyle(BOLD);
      textSize(winSize);
      text(winText, winX + winBoxW * 0.5, numY);
    }

    pop();
  }

      const taBot     = endTurnY - TA_GAP;              // 圆环底部开口位置

      const turnNum   = gs.turnNumber + 1;              // 当前回合数

      cStroke('orange', 255);
      strokeWeight(TA_WEIGHT);

      arc(taCx, taCy, TA_W, TA_H, PI, TWO_PI);
      strokeCap(ROUND);
      noStroke();
      // 2) "R" 标签（白色小号 BOLD，圆环内顶部区域）
      cFill('white', 255);
      textAlign(CENTER, TOP);
      textSize(20);
      textStyle(BOLD);
      text('R', taCx-25, taCy - TA_H * 0.30 + 7);
      // 3) 回合数字（白色大号 BOLD，圆环中央偏下，明显大于 R 标签）

      textAlign(CENTER, TOP);

      text(String(turnNum), taCx, taCy - TA_H * 0.06 - 43);

      // 测量宽度以便整体居中（textSize/Style 必须在 textWidth 前设置）
      textSize(11);
      textStyle(BOLD);
      noStroke();
      const prefixW   = textWidth(prefix);
      const keywordW  = textWidth(keyword);
      const totalW    = prefixW + keywordW;
      const startX    = 250 - totalW * 0.5;
      textAlign(LEFT, CENTER);

      // 前缀部分：白色
      cFill('white');
      text(prefix, startX, 595);

      // 特性名部分：对应卡片的特性色

      text(keyword, startX + prefixW, 595);
