// 按权重随机选择节点类型
function pickNodeType(allowedTypes, layerIdx) {
  // 第1层使用固定顺序，不随机
  if (layerIdx === 0) return allowedTypes[layerIdx % allowedTypes.length] || 'battle';
  // 其他层从允许类型中按权重随机
  let pool = allowedTypes.map(t => ({ type: t, weight: NODE_WEIGHTS[t] || 1 }));
  let total = pool.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (let p of pool) { r -= p.weight; if (r <= 0) return p.type; }
  return 'battle';
}

// 生成单区域6层地图
// region: 0 或 1，决定 Boss 类型
// 返回 { layers: [{ nodes: [...], connections: [...] }] }
function generateMap(region) {
  let layers = [];
  let nodeIdCounter = 1;
  // 1. 按层生成节点
  for (let li = 0; li < MAP_LAYER_CONFIG.length; li++) {
    let cfg = MAP_LAYER_CONFIG[li];
    let count = Array.isArray(cfg.count) ? randInt(cfg.count[0], cfg.count[1]) : cfg.count;
    let nodes = [];
    // x 坐标等分 [0.15, 0.85]
    let xMin = 0.15, xMax = 0.85;
    for (let i = 0; i < count; i++) {
      let xRatio = count === 1 ? 0.5 : (i / (count - 1));
      let x = lerp(xMin, xMax, xRatio);
      // y 坐标：第1层 y=0.85，第6层 y=0.10，线性插值
      let y = 0.85 - (li / (MAP_LAYER_CONFIG.length - 1)) * 0.75;
      let type;
      if (li === MAP_LAYER_CONFIG.length - 1) {
        // Boss 层
        type = 'boss';
      } else {
        type = pickNodeType(cfg.types, li);
        // 第1层强制按固定顺序
        if (li === 0) type = cfg.types[i] || 'battle';
      }
      nodes.push({
        id: `r${region}_l${li}_n${i}_${nodeIdCounter++}`,
        type: type,
        x: x,
        y: y,
      });
    }
    layers.push({ nodes: nodes, connections: [] });
  }
  // 2. 生成连接：相邻层全连接 + 跳连限制（x 跨度合理）
  for (let li = 0; li < layers.length - 1; li++) {
    let curLayer = layers[li];
    let nextLayer = layers[li + 1];
    let conns = [];
    for (let fromNode of curLayer.nodes) {
      // 找到下一层 x 距离最近的节点，至少连1条
      // 同时按距离概率连接其他节点（保证多路径）
      let sorted = nextLayer.nodes
        .map(n => ({ node: n, dx: Math.abs(n.x - fromNode.x) }))
        .sort((a, b) => a.dx - b.dx);
      // 必连最近的
      conns.push([fromNode.id, sorted[0].node.id]);
      // 按距离概率连其他节点（保证多路径，避免孤立）
      for (let i = 1; i < sorted.length; i++) {
        let dx = sorted[i].dx;
        // x 跨度大于 0.5 时跳过（防跨度过大）
        if (dx > 0.5) continue;
        // 概率连接：距离越近概率越高
        if (Math.random() < 0.6 - dx * 0.5) {
          conns.push([fromNode.id, sorted[i].node.id]);
        }
      }
    }
    layers[li].connections = conns;
  }
  // 3. 验证并修补：确保每个节点至少 1 入边 + 1 出边
  for (let li = 1; li < layers.length; li++) {
    let prevLayer = layers[li - 1];
    let curLayer = layers[li];
    for (let node of curLayer.nodes) {
      let hasInEdge = prevLayer.connections.some(([_, to]) => to === node.id);
      if (!hasInEdge && prevLayer.nodes.length > 0) {
        // 强制连一条入边：连到上一层的第一个节点
        prevLayer.connections.push([prevLayer.nodes[0].id, node.id]);
      }
    }
  }
  // 4. 验证：起点到 Boss 至少 2 条路径（DFS 计数）
  let pathCount = countPaths(layers);
  if (pathCount < 2) {
    // 修补：在第一层和第二层之间多加一条连接
    if (layers[0].nodes.length > 1 && layers[1].nodes.length > 0) {
      layers[0].connections.push([layers[0].nodes[layers[0].nodes.length - 1].id, layers[1].nodes[0].id]);
    }
  }
  // 5. 保底逻辑：确保每张地图至少1个工匠节点
  let artisanCount = 0;
  for (let layer of layers) {
    for (let node of layer.nodes) {
      if (node.type === 'artisan') artisanCount++;
    }
  }
  if (artisanCount === 0) {
    // 随机选择第2层或第4层的某个非Boss节点替换为 artisan
    let candidateLayers = [1, 3]; // 索引1=第2层，索引3=第4层
    let li = candidateLayers[Math.floor(Math.random() * candidateLayers.length)];
    let candidateNodes = layers[li].nodes.filter(n => n.type !== 'boss');
    if (candidateNodes.length > 0) {
      let target = candidateNodes[Math.floor(Math.random() * candidateNodes.length)];
      target.type = 'artisan';
    }
  }
  return { layers: layers, region: region };
}

// DFS 统计从第一层任一节点到 Boss 节点的路径数（上限 10，避免爆炸）
function countPaths(mapData) {
  let bossNode = null;
  for (let layer of mapData) {
    for (let node of layer.nodes) {
      if (node.type === 'boss') { bossNode = node; break; }
    }
    if (bossNode) break;
  }
  if (!bossNode) return 0;
  // 构建邻接表
  let adj = {};
  for (let layer of mapData) {
    for (let node of layer.nodes) adj[node.id] = [];
  }
  for (let layer of mapData) {
    for (let [from, to] of layer.connections) {
      if (adj[from]) adj[from].push(to);
    }
  }
  // DFS 计数（限制最大 10 条，避免组合爆炸）
  let count = 0;
  let maxCount = 10;
  function dfs(nodeId, visited) {
    if (count >= maxCount) return;
    if (nodeId === bossNode.id) { count++; return; }
    if (visited.has(nodeId)) return;
    visited.add(nodeId);
    for (let next of (adj[nodeId] || [])) dfs(next, visited);
    visited.delete(nodeId);
  }
  for (let node of mapData[0].nodes) {
    dfs(node.id, new Set());
    if (count >= maxCount) break;
  }
  return count;
}

// ==================== 工具函数 ====================
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { let a = [...arr]; for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }
// 缓动函数：easeOutCubic（先快后慢，用于悬停抽出）
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
// 缓动函数：easeInCubic（先慢后快，用于回弹归位）
function easeInCubic(t) { return t * t * t; }
// 缓动函数：easeOutQuad（先快后慢，用于Tooltip淡入）
function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
// 帧率无关的缓动插值：基于deltaTime逼近目标值
// k为每秒逼近比例（0-1），值越大越快
function dampApproach(current, target, k, dt) {
  let factor = 1 - Math.pow(1 - k, dt * 60 / 1000);
  return current + (target - current) * factor;
}

// 居中自动换行文本绘制：在指定中心点绘制文本，自动换行适应宽度
function drawCenteredText(str, centerX, y, maxW, maxH, lineHeight, vCenter) {
  textAlign(CENTER, TOP);
  lineHeight = lineHeight || 12;
  // 按字符拆分行（支持中英文）—— null 安全兜底
  let chars = (str || '').split('');
  let lines = [];
  let currentLine = '';
  let currentW = 0;
  for (let i = 0; i < chars.length; i++) {
    let ch = chars[i];
    let chW = textWidth(ch);
    if (currentW + chW > maxW && currentLine.length > 0) {
      lines.push(currentLine);
      currentLine = ch;
      currentW = chW;
    } else {
      currentLine += ch;
      currentW += chW;
    }
  }
  if (currentLine) lines.push(currentLine);
  // 限制行数
  let maxLines = Math.floor(maxH / lineHeight);
  if (maxLines <= 0) return; // maxH≤0 保护，防止数组越界
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let lastLine = lines[maxLines - 1];
    // 如果可能，截断最后一行
    while (lastLine.length > 0 && textWidth(lastLine + '…') > maxW) {
      lastLine = lastLine.slice(0, -1);
    }
    lastLine = lastLine + '…';
    lines[maxLines - 1] = lastLine;
  }
  // 垂直居中：把 y 视为文本块的垂直中心而非顶部（多行时整块居中）
  const blockH = lines.length * lineHeight;
  const startY = vCenter ? (y - blockH / 2) : y;
  // 绘制每一行
  for (let i = 0; i < lines.length; i++) {
    text(lines[i], centerX, startY + i * lineHeight);
  }
}

// ==================== 游戏状态管理器 ====================
class GameState {
  constructor() {
    this.bloomIntensity = 0.8; // Bloom 全画布合成层强度 0.0(极微) → 1.0(满效果) —— reset() 不覆盖，保留玩家偏好
    this.difficulty = DEFAULT_DIFFICULTY; // 难度档位索引 0..3 —— 与 bloomIntensity 同级：reset() 不覆盖，跨局保留玩家选择
    this.reset();
  }
  reset() {
    // 变体去重记忆随新局清空：保证每一局内部"尽量不重复"，且内存有界。
    //   跨局新异性交给 PHASE 1 图鉴（sdk.storage 持久化），此处不引入存储开销。
    if (typeof VARIANT_SYS !== 'undefined' && VARIANT_SYS) VARIANT_SYS._seenThisRun = new Set();
    // PHASE 1：图鉴**不**随新局清空（它是跨局资产），只把「本局新发现」计数归零
    if (typeof CODEX_SYS !== 'undefined' && CODEX_SYS) CODEX_SYS._newThisRun = 0;
    // PHASE 2：命名队列与"本局调用额度"清零 —— 图鉴里已存的名字是永久资产，不动
    if (typeof namerResetRun === 'function') namerResetRun();
    const _d = (typeof getDifficulty === 'function') ? getDifficulty() : DIFFICULTY_DATA[DEFAULT_DIFFICULTY];
    // 生命上限与起始金币随难度缩放（新开一局时生效，局内切换不影响当前存档）
    this.maxHp = Math.max(20, Math.round(70 * _d.playerHp));
    this.hp = this.maxHp;
    this.gold = _d.startingGold;
    this.deck = [];
    this.relics = [];
    this.currentLayer = 0;
    this.currentNodeId = null;
    this.mapPath = [];
    // 双区域地图系统：currentRegion 0=第一区域, 1=第二区域
    this.currentRegion = 0;
    this.regionCount = 2;
    // PHASE 3 无尽回响：主线通关后可选择「继续深入」，开启后区域无限递增、难度随深度上升
    this.endlessEcho = false;
    this.maxDepth = 0;         // 本局到达过的最深深度（结算展示用，每前进一步更新）
    this.mapData = null;       // 由 generateMap() 动态生成
    this.regionTransition = null; // 区域过渡叙事状态
    this.scene = 'title';
    this.combatState = null;
    this.turnNumber = 0;
    this.floorNumber = 0;
    // T254：删牌子场景（RemoveCardScene）的调用上下文 {source:'shop'|'event', cost, resultText}。
    //   瞬态字段：不入存档序列化（saveCurrent 仅写显式字段），消费后置 null；缺省=按商店处理。
    this._removeCardCtx = null;
    // T242：本局战报 —— 结算页用它回答"这一局到底发生了什么"。
    //   ⚠️ 只存**整数计数与一个名字**，不参与存档序列化（局终即弃），不引入存储开销。
    this.runStats = {
      cardsPlayed: 0,     // 打出的牌数（双倍卡的重放不算 —— 那不是玩家的新决策）
      damageTaken: 0,     // 累计承伤
      kills: 0,           // 放倒的造物数
      maxHit: 0,          // 最深的一击
      battles: 0,         // 经历的战斗场数
      lastEnemy: '',      // 最后一场战斗的造物名（失败时 = "终结你的那个"）
      lastHit: 0,         // 最后一次承伤（失败时 = 带走你的那一击）
      _cardsAt: 0,        // T244：本场开始时的出牌快照（算"本场出牌"用）
      _takenAt: 0,        // T244：本场开始时的承伤快照
    };
    // 主题层「飘」：**仅运行时**的新局标志（不存档、不参与序列化）。
    //   用于让 MapScene 在「玩家真正开了新的一局」时显示一次飘回浮句；
    //   从战斗返回地图、或读档继续时都不触发 —— 打扰一次是诗，打扰三次是噪音。
    this._freshRun = true;
    this.showDeckViewer = false;
    this.showCodex = false;        // PHASE 1 深渊图鉴浮层（C 键开关）
    this.viewerTab = 'deck'; // 'deck' | 'relics'
    this._deckScroll = 0;
    this._deckMaxScroll = 0;
    this._deckSections = null;
    // 遗物面板滚动状态
    this._relicScroll = 0;
    this._relicMaxScroll = 0;
    // 初始化基础牌组
    this.initDeck();
  }
  initDeck() {
    this.deck = [];
    // 基础攻击与防御（保留少量作为基础）
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='strike')});
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='defend')});
    // 先攻牌 - 启动连击窗口
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='quick_strike')});
    // 连击牌 - 叠加连击计数
    for (let i = 0; i < 2; i++) this.deck.push({...CARD_DATA.find(c=>c.id==='flurry')});
    // 猛击牌 - 消耗连击造成高伤
    this.deck.push({...CARD_DATA.find(c=>c.id==='heavy_smash')});
    // 吸血连击 - 攻击兼连击吸血（T177 新增，初始牌库装备）
    this.deck.push({...CARD_DATA.find(c=>c.id==='life_steal_combo')});
    // 连击防御 - 防御也能参与连击
    this.deck.push({...CARD_DATA.find(c=>c.id==='combo_defense')});
    // 异常牌 - 配合连击加强异常效果
    this.deck.push({...CARD_DATA.find(c=>c.id==='burn_touch')});
    // 紧急包扎 - 回复生命（T177 新增，初始牌库装备）
    this.deck.push({...CARD_DATA.find(c=>c.id==='emergency_bandage')});
    // 每个卡牌实例添加唯一ID
    this.deck.forEach((c, i) => { c.uid = i; c.upgraded = false; });
  }
  addCard(cardTemplate) {
    let c = {...cardTemplate};
    c.uid = Date.now() + Math.random();
    // T251：_uid 是悬停/手牌动画状态复合键（id_uid）的身份部分，新实例不得继承模板/源牌的 _uid——
    // 否则同 id 两张牌（如「触碰镜面」复制牌）共享同一动画态，悬停其一两张齐亮。删除后由状态层懒分配。
    delete c._uid;
    c.upgraded = false;
    this.deck.push(c);
  }
  removeCardByUid(uid) {
    let idx = this.deck.findIndex(c => c.uid === uid);
    if (idx >= 0) this.deck.splice(idx, 1);
  }
  addRelic(relic) {
    if (!this.relics.find(r => r.id === relic.id)) {
      this.relics.push({...relic});
    }
  }
  hasRelic(id) { return this.relics.some(r => r.id === id); }
  heal(amt) {
    // 战斗内治疗量受难度缩放（湮灭档治疗近乎失效）；战斗外的休息/事件回血不受影响，
    // 避免与 RestScene 的 restHeal 造成双重惩罚
    let a = amt;
    if (this.scene === 'battle' && typeof getDifficulty === 'function') {
      a = Math.max(0, Math.round(amt * getDifficulty().healMul));
    }
    this.hp = Math.min(this.maxHp, this.hp + a);
  }
  takeDamage(amt) {
    this.hp -= amt;
    // T242：战报 · 累计承伤（与下方画像埋点同源，覆盖全部伤害来源）
    try {
      if (this.runStats) {
        this.runStats.damageTaken += Math.max(0, amt || 0);
        this.runStats.lastHit = Math.max(0, amt || 0);   // 覆盖式：最后一次承伤即为致死那一击
      }
    } catch (e) {}
    // PHASE 5：画像埋点 —— 累计承伤 + 残血挨打次数。只改内存，落盘统一在局终。
    //   ⚠️ 这是唯一一处承伤埋点，覆盖全部伤害来源（敌人攻击 / 卡牌 HP 消耗 / 事件扣血）。
    try { if (typeof profileOnDamage === 'function') profileOnDamage(amt, this.hp, this.maxHp); }
    catch (e) { /* 画像失败绝不影响战斗 */ }
    // 主题「飘」：受击时从玩家身上飘散一小团灰烬（数量随伤害，封顶 14 片）。
    //   恒为**上飘** —— 挨打飘散的是"你自己"，与场景结局方向无关。
    try {
      if (typeof ashBurst === 'function' && gs.scene === 'battle') {
        ashBurst(GAME_W * 0.3, GAME_H * 0.52, Math.min(14, 4 + Math.floor(amt / 7)), -1);
      }
    } catch (e) { /* 粒子失败绝不影响战斗 */ }
    if (this.hp <= 0) {
      this.hp = 0;
      // 战斗内由 checkCombatEnd 统一管理失败流程，避免与 onBattleEnd 双触发导致战败页连续弹出
      if (gs.scene !== 'battle' || !gs.combatState) {
        this.scene = 'defeat';
      }
    }
  }
  getMaxAp() {
    let ap = 3;
    if (typeof getDifficulty === 'function') ap += getDifficulty().apBonus;
    this.relics.forEach(r => { if (r.modifyMaxAp) ap += r.modifyMaxAp; });
    return ap;
  }
  getShopDiscount() {
    let d = 0;
    this.relics.forEach(r => { if (r.modifyShopDiscount) d += r.modifyShopDiscount; });
    return d;
  }
}

// ==================== 事件总线 ====================
class EventBus {
  constructor() {
    this.listeners = {};
  }
  on(event, fn) {
    if (!this.listeners[event]) this.listeners[event] = [];
    this.listeners[event].push(fn);
  }
  emit(event, data) {
    if (this.listeners[event]) {
      this.listeners[event].forEach(fn => fn(data));
    }
  }
  clear() { this.listeners = {}; }
}

    this.sections = ['intro', 'verseA', 'verseB', 'chorus', 'bridge', 'outro'];
    this.sectionIndex = 0;
    this.sectionStartBeat = 0;
    this.currentBeat = 0;
    this.nextNoteTime = 0;
    this.scheduleTimer = null;
    // 当前轨道数据
    this.currentTrack = null;
    this.currentConfig = null;
    // 动态音乐状态
    this.musicState = 'explore';   // explore/engage/battle/boss/crisis/victory/defeat
    this.battleIntensity = 0;
    this.playerCrisis = 0;
    this.bossPhase = 0;
    // 音量设置（持久化）—— 分通道音量 + 分通道静音
    this.masterVolume = 0.3;
    this.bgmVolume = 0.4;
    this.sfxVolume = 0.5;
    this.muted = false;
    this.mutedChannels = { master: false, bgm: false, sfx: false };  // 每个通道独立静音指示灯
    // crossfade 跟踪标记（用于取消被取代的延迟回调）
    this._trackTag = 0;
    this.loadSettings();
  }

  // ==================== 阶段 1：基础设施 ====================

  // 从 localStorage 读取音量/静音设置，失败不影响启动
  loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('audio_settings') || '{}');
      if (typeof s.masterVolume === 'number') this.masterVolume = s.masterVolume;
      if (typeof s.bgmVolume === 'number') this.bgmVolume = s.bgmVolume;
      if (typeof s.sfxVolume === 'number') this.sfxVolume = s.sfxVolume;
      if (typeof s.muted === 'boolean') this.muted = s.muted;
      if (s.mutedChannels && typeof s.mutedChannels === 'object') {
        this.mutedChannels = { ...this.mutedChannels, ...s.mutedChannels };
      }
    } catch(e) {}
  }

  saveSettings() {
    try {
      localStorage.setItem('audio_settings', JSON.stringify({
        masterVolume: this.masterVolume,
        bgmVolume: this.bgmVolume,
        sfxVolume: this.sfxVolume,
        muted: this.muted,
        mutedChannels: this.mutedChannels,
      }));
    } catch(e) {}
  }

  setMasterVolume(v) {
    this.masterVolume = v;
    if (this.masterGain && this.ctx) {
      try {
        const eff = (this.muted || this.mutedChannels.master) ? 0 : v;
        this.masterGain.gain.setTargetAtTime(eff, this.ctx.currentTime, 0.05);
      } catch(e){}
    }
    this.saveSettings();
  }

  setBGMVolume(v) {
    this.bgmVolume = v;
    if (this.musicGain && this.ctx) {
      try {
        const eff = (this.muted || this.mutedChannels.bgm) ? 0 : v;
        this.musicGain.gain.setTargetAtTime(eff, this.ctx.currentTime, 0.05);
      } catch(e){}
    }
    this.saveSettings();
  }

  setSFXVolume(v) {
    this.sfxVolume = v;
    if (this.sfxGain && this.ctx) {
      try {
        const eff = (this.muted || this.mutedChannels.sfx) ? 0 : v;
        this.sfxGain.gain.setTargetAtTime(eff, this.ctx.currentTime, 0.05);
      } catch(e){}
    }
    this.saveSettings();
  }

  // 分通道静音：master/bgm/sfx，返回切换后状态
  toggleChannelMute(ch) {
    if (this.mutedChannels[ch] === undefined) return false;
    this.mutedChannels[ch] = !this.mutedChannels[ch];
    this._applyChannelMutes();
    this.saveSettings();
    return this.mutedChannels[ch];
  }

  setChannelMute(ch, b) {
    if (this.mutedChannels[ch] === undefined) return;
    this.mutedChannels[ch] = b;
    this._applyChannelMutes();
    this.saveSettings();
  }

  // 统一计算有效音量：master静音 + 通道静音 + 全局静音，都取 0
  _applyChannelMutes() {
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      if (this.masterGain) {
        const eff = (this.muted || this.mutedChannels.master) ? 0 : this.masterVolume;
        this.masterGain.gain.setTargetAtTime(eff, ctx.currentTime, 0.05);
      }
      if (this.musicGain) {
        const eff = (this.muted || this.mutedChannels.bgm) ? 0 : this.bgmVolume;
        this.musicGain.gain.setTargetAtTime(eff, ctx.currentTime, 0.05);
      }
      if (this.sfxGain) {
        const eff = (this.muted || this.mutedChannels.sfx) ? 0 : this.sfxVolume;
        this.sfxGain.gain.setTargetAtTime(eff, ctx.currentTime, 0.05);
      }
    } catch(e){}
  }

  toggleMute() {
    this.setMute(!this.muted);
    return this.muted;
  }

  setMute(b) {
    this.muted = b;
    this._applyChannelMutes();
    this.saveSettings();
  }

  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this.ctx;

      // master 总线：masterGain → masterCompressor（避免削波） → destination
      // 压缩器放在最后以确保峰值控制
      this.masterGain = ctx.createGain();
      this.masterGain.gain.value = this.muted ? 0 : this.masterVolume;
      this.masterCompressor = ctx.createDynamicsCompressor();
      this.masterCompressor.threshold.value = -10;
      this.masterCompressor.ratio.value = 4;
      this.masterGain.connect(this.masterCompressor);
      this.masterCompressor.connect(ctx.destination);

      // 音乐总线：musicGain → {dry, lowpass filter, reverb(0.35), delay(0.28s + fb 0.35)} → masterGain
      this.musicGain = ctx.createGain();
      this.musicGain.gain.value = this.bgmVolume;
      this.musicGain.connect(this.masterGain);

      // dry 路径：保留原始清晰度
      this.musicDry = ctx.createGain();
      this.musicDry.gain.value = 1.0;
      this.musicGain.connect(this.musicDry);
      this.musicDry.connect(this.masterGain);

      // 低通滤波器（8kHz，温暖音色）
      this.musicFilter = ctx.createBiquadFilter();
      this.musicFilter.type = 'lowpass';
      this.musicFilter.frequency.value = 8000;
      this.musicGain.connect(this.musicFilter);
      this.musicFilter.connect(this.masterGain);

      // 混响（湿声 0.35）：程序生成 IR，无需外部资源
      this.musicReverb = ctx.createConvolver();
      this.musicReverb.buffer = this.createImpulseResponse(2.5, 2.0);
      this.musicReverbInput = ctx.createGain();
      this.musicReverbInput.gain.value = 0.35;
      this.musicReverbInput.connect(this.musicReverb);
      this.musicReverb.connect(this.masterGain);
      this.musicGain.connect(this.musicReverbInput);

      // 延时（0.28s + 反馈 0.35）：制造空间回声
      this.musicDelay = ctx.createDelay(1.0);
      this.musicDelay.delayTime.value = 0.28;
      this.musicDelayFb = ctx.createGain();
      this.musicDelayFb.gain.value = 0.35;
      this.musicDelay.connect(this.musicDelayFb);
      this.musicDelayFb.connect(this.musicDelay);   // 反馈环
      this.musicDelay.connect(this.masterGain);
      this.musicGain.connect(this.musicDelay);

      // 音效总线：sfxGain → {dry, lowpass 12kHz, reverb(0.3)} → masterGain
      this.sfxGain = ctx.createGain();
      this.sfxGain.gain.value = this.sfxVolume;
      this.sfxGain.connect(this.masterGain);

      this.sfxDry = ctx.createGain();
      this.sfxDry.gain.value = 1.0;
      this.sfxGain.connect(this.sfxDry);
      this.sfxDry.connect(this.masterGain);

      this.sfxFilter = ctx.createBiquadFilter();
      this.sfxFilter.type = 'lowpass';
      this.sfxFilter.frequency.value = 12000;
      this.sfxGain.connect(this.sfxFilter);
      this.sfxFilter.connect(this.masterGain);

      // sfxReverbInput 在这里创建，playSFX 会把冲击/共鸣音效送到此处
      this.sfxReverb = ctx.createConvolver();
      this.sfxReverb.buffer = this.createImpulseResponse(1.8, 1.5);
      this.sfxReverbInput = ctx.createGain();
      this.sfxReverbInput.gain.value = 0.3;
      this.sfxReverbInput.connect(this.sfxReverb);
      this.sfxReverb.connect(this.masterGain);

      // 创建各层独立 gain 节点（接到 musicGain，与 ambient 同总线）
      ['pad', 'bass', 'arp', 'melody', 'percussion', 'threat'].forEach(name => {
        const g = ctx.createGain();
        g.gain.value = 0;   // 默认静音，playTrack 时 ramp 起
        g.connect(this.musicGain);
        this.layerGains[name] = g;
      });

      this.initialized = true;
      this.ensureAmbient();   // 启动持续氛围 drone（独立于 BGM，不被 stopBGM 停止）
      this.startScheduler();  // 启动持续 lookahead 调度器，解决 BGM 播放完静默问题
    } catch(e) { console.warn('Audio init failed:', e); }
  }

  // 程序化生成混响 IR：噪声指数衰减，避免依赖外部音频文件
  createImpulseResponse(duration, decay) {
    try {
      const ctx = this.ctx;
      const sampleRate = ctx.sampleRate;
      const length = Math.max(1, Math.floor(sampleRate * duration));
      const impulse = ctx.createBuffer(2, length, sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        }
      }
      return impulse;
    } catch(e) { return null; }
  }

  // ==================== 阶段 2：BGM 分层 + 循环调度 ====================

  // Lookahead Scheduler：setInterval(25ms) + 提前 0.1s 调度音符
  // 这种"提前调度"模式能保证时间精度，避免 setInterval 抖动造成的节拍漂移
  startScheduler() {
    if (this.scheduleTimer) return;
    this.nextNoteTime = (this.ctx ? this.ctx.currentTime : 0) + 0.1;
    this.currentBeat = 0;
    this.sectionIndex = 0;
    this.sectionStartBeat = 0;
    this.scheduleTimer = setInterval(() => {
      if (!this.ctx || !this.currentTrack) return;
      try {
        const lookahead = 0.1;
        while (this.nextNoteTime < this.ctx.currentTime + lookahead) {
          this.scheduleBeat(this.currentBeat, this.nextNoteTime);
          const bpm = (this.currentConfig && this.currentConfig.bpm) || 120;
          const beatDur = 60 / bpm;
          this.nextNoteTime += beatDur;
          this.currentBeat++;
          // 段落切换：每段 8 拍，循环到 Intro 形成 Outro→Intro 衔接
          const sectionLen = 8;
          if (this.currentBeat - this.sectionStartBeat >= sectionLen) {
            this.sectionIndex = (this.sectionIndex + 1) % this.sections.length;
            this.sectionStartBeat = this.currentBeat;
          }
        }
      } catch(e) { console.warn('Scheduler error:', e); }
    }, 25);
  }

  // 调度单拍：根据段落和动态音乐状态触发对应层音符
  scheduleBeat(beat, time) {
    if (!this.currentTrack || !this.currentConfig) return;
    const cfg = this.currentConfig;
    const activeLayers = this.getSectionLayers();
    // 和弦循环索引（每 4 拍换一个和弦，制造和声进行）
    const chordIdx = Math.floor(beat / 4) % cfg.chords.length;
    // T166：和弦切换时重置 Arp noteOffset，新和弦从根音开始（避免首音语义错位）
    if (chordIdx !== this._lastChordIdx) {
      this._arpNoteOffset = 0;
      this._lastChordIdx = chordIdx;
    }
    const chord = cfg.chords[chordIdx];

    if (activeLayers.pad) this.playPadLayer(chord, beat, time);
    if (activeLayers.bass) this.playBassLayer(chord[0] / 2, beat, time);
    if (activeLayers.arp) this.playArpLayer(chord, beat, time);
    if (activeLayers.melody) this.playMelodyLayer(chord, cfg.scale, beat, time);
    if (activeLayers.percussion) this.playPercussionLayer(beat, time);
    if (activeLayers.threat) this.playThreatLayer(beat, time);
  }

  // 根据段落 + 动态音乐参数决定激活哪些层
  // 这是动态音乐系统的核心：相同轨道不同段落听起来差异显著
  getSectionLayers() {
    const section = this.sections[this.sectionIndex];
    const base = { pad: false, bass: false, arp: false, melody: false, percussion: false, threat: false };
    switch(section) {
      case 'intro':  base.pad = true; break;                              // 仅 Pad 铺底
      case 'verseA': base.pad = true; base.bass = true; break;            // + Bass
      case 'verseB': base.pad = true; base.bass = true; base.arp = true; break; // + Arp
      case 'chorus': base.pad = true; base.bass = true; base.arp = true;
                     base.melody = true; base.percussion = true; break;   // 全层
      case 'bridge': base.pad = true; base.arp = true; base.melody = true; break;  // T166：+arp 稀疏支撑（非战斗走降级密度），Melody 不再孤立
      case 'outro':  base.pad = true; break;                              // 接回 Intro
    }
    // 动态音乐调整：根据 musicState / battleIntensity / bossPhase 强化或减弱层
    if (this.musicState === 'engage' || this.musicState === 'battle') {
      // 战斗强度 > 0.5 时即使非 chorus 段也加打击乐
      if (this.battleIntensity > 0.5) base.percussion = true;
      // 强度 > 0.7 时 arp 始终在场
      if (this.battleIntensity > 0.7) base.arp = true;
    }
    if (this.musicState === 'boss') {
      base.percussion = true;
      base.threat = true;   // boss 阶段始终加 threat 不和谐层
    }
    if (this.musicState === 'crisis') {
      base.threat = true;   // 危机时加入威胁层
    }
    return base;
  }

  // Pad 层：双 sawtooth 失谐 + 振幅 LFO + 严格低通和声垫底（T163 彻底清除笛子音）
  // T163 根因：T162 的双 sine + LFO + 低通 600Hz 本质上还是笛子
  //   - 双 sine 失谐 7 cents → 拍音 1.28Hz → "每秒颤动 1.28 次的笛子"
  //   - LFO 0.5Hz → "每 2 秒呼吸一次的笛子"
  //   - 低通 600Hz → "稍微闷一点的笛子"
  //   根本问题：sine 波形本身声学等同笛子/口哨，任何调制只是给笛子加颤音
  //
  // T163 彻底方案（审批通过方案 A）：BGM 全层 sine 清除
  //   [1] 双 sine → 双 sawtooth：sawtooth 有 1/n 谐波系列，听感是"厚垫子"非"笛子"
  //   [2] 严格低通 600→500Hz：进一步限制高频，让 sawtooth 谐波只保留前 1-2 次
  //       ↳ sawtooth 基频 + 1 次谐波 + 低通 = 厚实和声垫，无线状纯净感
  //   [3] 失谐 ±7 cents + 振幅 LFO 保留：增加厚度和呼吸感
  //   [4] padPeak 0.08→0.05：sawtooth 比 sine 响度大（谐波多），降低峰值避免削波
  //   [5] 每和弦音独立 LFO 相位保留
  playPadLayer(chord, beat, time) {
    try {
      if (beat % 4 !== 0) return;
      const ctx = this.ctx;
      const bpm = (this.currentConfig && this.currentConfig.bpm) || 120;
      const dur = 4 * (60 / bpm);
      const detuneRatio = Math.pow(2, 7/1200);   // +7 cents 失谐
      const padPeak = 0.05;                        // T163：0.08→0.05（sawtooth 谐波多更响，降峰值）

      for (let i = 0; i < chord.length; i++) {
        const baseFreq = chord[i];

        // ---- 共用滤波 + 总增益 ----
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 500;              // T163：600→500Hz 更严格，限 sawtooth 谐波
        filter.Q.value = 0.5;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(padPeak, time + 0.5);
        g.gain.linearRampToValueAtTime(0, time + dur);

        // ---- [1] 主 sawtooth（基频，有 1/n 谐波系列）----
        const osc1 = ctx.createOscillator();
        osc1.type = 'sawtooth';                    // T163：sine→sawtooth
        osc1.frequency.value = baseFreq;
        osc1.connect(filter);

        // ---- [1] 副 sawtooth（+7 cents 失谐，产生 chorus）----
        const osc2 = ctx.createOscillator();
        osc2.type = 'sawtooth';                    // T163：sine→sawtooth
        osc2.frequency.value = baseFreq * detuneRatio;
        osc2.connect(filter);

        // ---- [2] 振幅 LFO（每和弦音独立相位，避免机械同步）----
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.type = 'sine';
        lfo.frequency.value = 0.5 + (i * 0.07);
        lfoGain.gain.value = padPeak * 0.3;
        lfo.connect(lfoGain);
        lfoGain.connect(g.gain);

        filter.connect(g); g.connect(this.layerGains.pad);
        osc1.start(time); osc2.start(time); lfo.start(time);
        osc1.stop(time + dur + 0.1); osc2.stop(time + dur + 0.1); lfo.stop(time + dur + 0.1);
      }
    } catch(e){}
  }

  // Bass 层：锯齿 + 低通低音线，每拍一个低音
  playBassLayer(freq, beat, time) {
    try {
      const ctx = this.ctx;
      const dur = 60 / ((this.currentConfig && this.currentConfig.bpm) || 120);
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 400;
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      this.adsr(g.gain, time, 0.01, 0.1, 0.5, 0.1, 0.3);
      osc.connect(filter); filter.connect(g); g.connect(this.layerGains.bass);
      osc.start(time);
      osc.stop(time + dur + 0.05);
    } catch(e){}
  }

  // Arp 层：马林巴（Marimba）音色琶音 + 木质共鸣扩散（T165 去电子金属感）
  // T165 需求背景：T164 后"马林巴像电子金属音"
  // 根因（T164 电子金属感 4 点）：
  //   ① LP 4000Hz 保留太多高频 triangle 奇次谐波 = 中高频突出
  //   ② HP 800Hz 切掉低频木质共鸣 = 听感"硬"
  //   ③ 3x 谐波 0.15 偏高（真实马林巴 3x <0.1）
  //   ④ 敲击瞬态 Q=5 过窄 = 尖锐电子感；扩散 80ms/0.25 偏多 = 电子回声
  //
  // T165 7 项去电子金属微调（审批通过：执行微调方案）：
  //   [1] LP 4000→2500Hz（更接近真实马林巴滚降）
  //   [2] HP 800→600Hz（留低频木质共鸣）
  //   [3] 3x 谐波 0.15→0.08（木质高频吸收强）
  //   [4] 新增 4x 谐波 0.04（微弱 4x 泛音增加木质暖感）
  //   [5] 敲击瞬态 Q 5→2（更宽，模拟真实琴槌大面积接触）
  //   [6] 扩散 delayTime 80→35ms（更短木质反射，非电子回声）
  //   [7] 扩散 feedback 0.25→0.15（更少反馈轮次，不混浊不电子）
  playArpLayer(chord, beat, time) {
    try {
      // ---- T161-C：密度降级（场景差异化节奏）----
      const track = this.currentTrack;
      const denseScenes = new Set(['battle', 'boss']);
      if (!denseScenes.has(track) && beat % 2 !== 0) return;

      const ctx = this.ctx;
      // T166：noteIdx 从 _arpNoteOffset 取（和弦切换时重置为 0 = 根音）
      const noteIdx = this._arpNoteOffset % chord.length;
      this._arpNoteOffset++;
      const baseFreq = chord[noteIdx] * 2;
      const totalDur = 0.32;

      // ---- 敲击瞬态：白噪声 + bandpass 塑形（T165 Q 5→2）----
      const clickDur = 0.01;
      const noise = this.createNoiseSource(clickDur);
      if (noise) {
        const clickFilter = ctx.createBiquadFilter();
        clickFilter.type = 'bandpass';
        clickFilter.frequency.value = baseFreq;
        clickFilter.Q.value = 2;                      // T165：5→2 更宽，真实琴槌大面积
        const clickGain = ctx.createGain();
        clickGain.gain.setValueAtTime(0.08, time);
        clickGain.gain.exponentialRampToValueAtTime(0.0001, time + clickDur);
        noise.connect(clickFilter); clickFilter.connect(clickGain);
        clickGain.connect(this.layerGains.arp);
        noise.start(time); noise.stop(time + clickDur + 0.005);
      }

      // ---- 通用：双滤波塑形（T165 HP 800→600Hz；LP 4000→2500Hz）----
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 600;                      // T165：800→600 留低频木质共鸣
      hp.Q.value = 0.5;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2500;                     // T165：4000→2500 接近真实马林巴滚降
      lp.Q.value = 0.5;

      // ---- T165：短延迟扩散链（T165 delay 80→35ms，feedback 0.25→0.15）----
      // 35ms delay ≈ 12cm 反射路径，符合小型木质共鸣体；0.15 反馈 ≈ 2-3 轮衰减归零
      const delay = ctx.createDelay(1.0);
      delay.delayTime.value = 0.035;                 // T165：80→35ms 更短木质反射
      const feedback = ctx.createGain();
      feedback.gain.value = 0.15;                    // T165：0.25→0.15 减少反馈轮次
      const delayFilter = ctx.createBiquadFilter();
      delayFilter.type = 'lowpass';
      delayFilter.frequency.value = 2000;
      delayFilter.Q.value = 0.5;
      const wetGain = ctx.createGain();
      wetGain.gain.value = 0.35;
      delay.connect(feedback);
      feedback.connect(delayFilter);
      delayFilter.connect(delay);
      delay.connect(wetGain);
      wetGain.connect(this.layerGains.arp);

      // ---- T165：4 层 triangle 泛音（3x 0.15→0.08；新增 4x 0.04）----
      const peak = 0.18;
      const partials = [
        { mult: 1.0,  gainAmt: 1.00 },
        { mult: 2.0,  gainAmt: 0.35 },
        { mult: 3.0,  gainAmt: 0.08 },                // T165：0.15→0.08 木质高频吸收
        { mult: 4.0,  gainAmt: 0.04 },                // T165：新增 4x 0.04，微弱木质暖感
      ];
      for (const p of partials) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = baseFreq * p.mult;
        // ADSR 保留 T164：attack 1ms + decay 180ms + sustain 0 + release 120ms
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(peak * p.gainAmt, time + 0.001);
        g.gain.linearRampToValueAtTime(0, time + 0.001 + 0.18);
        g.gain.linearRampToValueAtTime(0, time + 0.001 + 0.18 + 0.12);
        osc.connect(g);
        g.connect(hp);
        g.connect(delay);
        osc.start(time);
        osc.stop(time + totalDur + 0.005);
      }

      hp.connect(lp); lp.connect(this.layerGains.arp);
    } catch(e){}
  }

  // Melody 层：马林巴家族柔和混音旋律（T165 去小号 + T166 和声修复）
  // T165 根因：原 Melody sawtooth + 长持续 + LP 3000Hz = 典型合成小号音色
  //   段落时序：chorus/bridge 段（12s+≈后半段）首次激活 melody → "后半段出现喇叭/小号声"
  //   之前 T160-T163 审计表误标 Melody"弱笛子嫌疑"，完全漏掉 sawtooth = 小号！
  //
  // T165 新方向（用户要求：不要吹奏类管乐，柔和混音配合马林巴）
  //   采用与 Arp 马林巴同音色家族，混音协调：
  //   [1] 3 层 triangle 泛音（同 Arp 马林巴结构，但泛音更低）：
  //       1x/2x/3x gainAmt 0.6 / 0.25 / 0.12（比 Arp 低 40%，混音不抢）
  //   [2] 柔和敲击瞬态：clickDur 20ms（Arp=10ms 更软起）+ clickGain 0.04（Arp=0.08 更弱）
  //       + Q=3（更宽）
  //   [3] 滤波：HP 500Hz（Arp=600Hz 更柔和）+ 危机 LP 2200→400Hz（原 3000→500，比例一致）
  //   [4] 旋律 ADSR 更长：attack 8ms / decay 250ms / sustain 0.3 / release 180ms（总 ~0.7s）
  //       作为旋律线，比 Arp 短促敲击长，但比原 sawtooth 小号短，有衔接感
  //   [5] 不使用扩散链（旋律保持清晰线条）
  //
  // T166 根因（中高频旋律层"不和谐音符"全面修复）：
  //   ① 经过音与和弦音不在同一八度（chord×2 vs scale 未×2 → 掉一个八度）
  //   ② Arp 与 Melody 音区完全重叠（均 chord×2）→ 频率叠加拍音
  //   ③ 跨和弦切换"级进修正"拉回 ±1 半音 → 选到非音阶音（如 Eb5）
  //   ④ 选音纯随机无方向性 → 无意义大跳
  //
  // T166 修复（审批通过）：
  //   [A] Melody 升 ×4（比 Arp ×2 高一个八度，频率分层不冲突）
  //   [B] 经过音新增 ×2（与和弦音同八度，不再掉八度）
  //   [C] 选音重写为旋律模式：强拍稳定（根音/五音/重复）/弱拍级进（±1-2 半音）
  //   [D] 删除"级进拉回 ±1 半音"，改为超限直接重复上音（保证不出非音阶音）
  //   [E] 大跳限制 ratio [0.84, 1.19]（±3 半音内）
  playMelodyLayer(chord, scale, beat, time) {
    try {
      const cfg = this.currentConfig;
      const density = cfg.melodyDensity != null ? cfg.melodyDensity : 0.45;  // T166：0.6→0.45
      if (Math.random() > density) return;
      const ctx = this.ctx;

      // ---- T166：旋律模式选音（替代 T160 纯随机选音）----
      // Melody 升 ×4（Arp=×2），与 Arp 频率分层
      // 强拍（beat%4==0）：70% 和弦根音/五音（稳定），30% 重复上音（动机连贯）
      // 弱拍：60% 级进（±1-2 半音），30% 同音重复，10% 和弦音小跳
      const chordMelody = chord.map(f => f * 4);             // T166：×2→×4，比 Arp 高八度
      const scaleMelody = scale.map(f => f * 2);             // T166：经过音新增 ×2，与和弦音同八度
      let freq;
      const isDownbeat = (beat % 4 === 0);

      if (isDownbeat) {
        // 强拍：稳定
        if (Math.random() < 0.30 && this._lastMelodyFreq > 0) {
          freq = this._lastMelodyFreq;                        // 30% 重复上音（动机）
        } else {
          // 70% 和弦根音(0)或五音(2)，避免三音(1)在强拍（三音不稳定）
          const stableIdx = Math.random() < 0.6 ? 0 : (chord.length > 2 ? 2 : 0);
          freq = chordMelody[stableIdx % chordMelody.length];
        }
      } else {
        // 弱拍：级进为主
        const r2 = Math.random();
        if (r2 < 0.30 && this._lastMelodyFreq > 0) {
          freq = this._lastMelodyFreq;                        // 30% 同音重复
        } else if (r2 < 0.90 && this._lastMelodyFreq > 0) {
          // 60% 级进：从 scaleMelody 中找最接近上音 ±1-2 半音的邻接音
          const last = this._lastMelodyFreq;
          let best = null, bestDist = Infinity;
          for (const sf of scaleMelody) {
            const dist = Math.abs(Math.log2(sf / last));     // 音程距离（八度为单位）
            if (dist < bestDist) { bestDist = dist; best = sf; }
          }
          // 限制 ±1-2 半音：ratio 在 [0.841, 1.122] 内
          if (best && best / last >= 0.841 && best / last <= 1.122) {
            freq = best;
          } else {
            freq = this._lastMelodyFreq;                      // 找不到合适级进音就重复
          }
        } else {
          // 10% 和弦音小跳
          freq = chordMelody[Math.floor(Math.random() * chordMelody.length)];
        }
      }

      // ---- T166：大跳限制（±3 半音内，超限直接重复上音，不再拉回半音）----
      if (this._lastMelodyFreq > 0) {
        const ratio = freq / this._lastMelodyFreq;
        if (ratio > 1.189 || ratio < 0.841) {                 // T166：1.5/0.67→1.189/0.841（±3半音）
          freq = this._lastMelodyFreq;                       // T166：直接重复上音（非拉回±1半音）
        }
      }
      this._lastMelodyFreq = freq;
      const baseFreq = freq;
      const totalDur = 0.72;                          // 旋律音符 ~720ms（比 Arp 长比小号短）

      // ---- T165：柔和敲击瞬态（比 Arp 更软，不抢）----
      const clickDur = 0.02;
      const noise = this.createNoiseSource(clickDur);
      if (noise) {
        const clickFilter = ctx.createBiquadFilter();
        clickFilter.type = 'bandpass';
        clickFilter.frequency.value = baseFreq;
        clickFilter.Q.value = 3;                      // Q=3 比 Arp=2 稍窄但不尖锐
        const clickGain = ctx.createGain();
        clickGain.gain.setValueAtTime(0.04, time);    // T165：0.08→0.04 更弱不抢
        clickGain.gain.exponentialRampToValueAtTime(0.0001, time + clickDur);
        noise.connect(clickFilter); clickFilter.connect(clickGain);
        clickGain.connect(this.layerGains.melody);
        noise.start(time); noise.stop(time + clickDur + 0.005);
      }

      // ---- T165：双滤波（HP 500 + LP 危机驱动 2200→400）----
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 500;                      // T165：更柔和 HP（Arp=600）
      hp.Q.value = 0.5;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      // playerCrisis 0→1：2200→400（比例与原 3000→500 一致，保留危机时音色变暗逻辑）
      lp.frequency.value = 2200 - this.playerCrisis * 1800;
      lp.Q.value = 0.5;

      // ---- T165：3 层 triangle 泛音（马林巴家族，比 Arp 低 40% 混音不抢）----
      const peak = 0.12;                               // T165：Arp=0.18，旋律降 33% 做陪衬
      const partials = [
        { mult: 1.0,  gainAmt: 0.60 },                // T165：Arp=1.00
        { mult: 2.0,  gainAmt: 0.25 },                // T165：Arp=0.35
        { mult: 3.0,  gainAmt: 0.12 },                // T165：Arp=0.08（Arp 用 4x，Melody 保留 3x 稍暖）
      ];
      for (const p of partials) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';                       // 同 Arp 马林巴家族波形
        osc.frequency.value = baseFreq * p.mult;
        // T165 ADSR：attack 8ms / decay 250ms / sustain 0.3 / release 180ms（总 ~0.7s）
        //   比 Arp 长（有旋律延续感），比原 sawtooth 小号短（不突兀）
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(peak * p.gainAmt, time + 0.008);  // attack 8ms
        g.gain.linearRampToValueAtTime(peak * p.gainAmt * 0.3, time + 0.008 + 0.25);  // decay 250ms → sustain 0.3
        g.gain.linearRampToValueAtTime(0, time + 0.008 + 0.25 + 0.18);   // release 180ms
        osc.connect(g);
        g.connect(hp);
        osc.start(time);
        osc.stop(time + totalDur + 0.005);
      }

      hp.connect(lp); lp.connect(this.layerGains.melody);
    } catch(e){}
  }

  // Percussion 层：kick（正弦）+ snare/hat（噪声），按 BPM 节奏
  playPercussionLayer(beat, time) {
    try {
      const ctx = this.ctx;
      const cfg = this.currentConfig;
      const intensity = cfg.percussionIntensity != null ? cfg.percussionIntensity : 1.0;
      if (intensity <= 0) return;

      // kick：每 4 拍第一拍重击
      if (beat % 4 === 0) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, time);
        osc.frequency.exponentialRampToValueAtTime(40, time + 0.1);
        g.gain.setValueAtTime(0.3 * intensity, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
        osc.connect(g); g.connect(this.layerGains.percussion);
        osc.start(time); osc.stop(time + 0.2);
      }
      // snare：2、4 拍
      if (beat % 4 === 1 || beat % 4 === 3) {
        const noise = this.createNoiseSource(0.1);
        if (!noise) return;
        const g = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1500;
        g.gain.setValueAtTime(0.15 * intensity, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
        noise.connect(filter); filter.connect(g); g.connect(this.layerGains.percussion);
        noise.start(time); noise.stop(time + 0.15);
      }
      // hat：每拍前半
      if (beat % 1 === 0) {
        const noise = this.createNoiseSource(0.05);
        if (!noise) return;
        const g = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 6000;
        g.gain.setValueAtTime(0.05 * intensity, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        noise.connect(filter); filter.connect(g); g.connect(this.layerGains.percussion);
        noise.start(time); noise.stop(time + 0.06);
      }
    } catch(e){}
  }

  // Threat 层：boss 阶段额外的不和谐极低音，每 8 拍触发一次
  playThreatLayer(beat, time) {
    try {
      if (beat % 8 !== 0) return;
      const ctx = this.ctx;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 55;   // 极低音制造压迫感
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(0.1, time + 0.5);
      g.gain.linearRampToValueAtTime(0, time + 4);
      osc.connect(g); g.connect(this.layerGains.threat);
      osc.start(time); osc.stop(time + 4.5);
    } catch(e){}
  }

  // 四段 ADSR 包络辅助方法：在 param 上一次性调度 Attack/Decay/Sustain/Release
  // 简化每次手写 setValueAtTime/linearRampToValueAtTime 的样板
  adsr(param, time, a, d, s, r, peak) {
    try {
      param.setValueAtTime(0, time);
      param.linearRampToValueAtTime(peak, time + a);
      param.linearRampToValueAtTime(peak * s, time + a + d);
      param.linearRampToValueAtTime(peak * s, time + a + d + r);
    } catch(e){}
  }

  // 创建噪声 BufferSource（用于打击乐/冲击音效）
  createNoiseSource(duration) {
    try {
      const ctx = this.ctx;
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      return src;
    } catch(e){ return null; }
  }

  // 自适应氛围层：持续低频 drone，随场景能量起伏，提供"深渊空间感"底色
  // 保留原逻辑：接到 musicGain，不被 stopBGM 停止
  ensureAmbient() {
    if (this.ambientGain || !this.ctx) return;
    try {
      const ctx = this.ctx, now = ctx.currentTime;
      this.ambientGain = ctx.createGain();
      this.ambientGain.gain.value = 0.0;
      this.ambientGain.connect(this.musicGain);
      const freqs = [55, 82.5, 110, 164.8];
      for (let i=0;i<freqs.length;i++){
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freqs[i] * (1 + (Math.random()-0.5)*0.01);
        g.gain.value = 0.5 / freqs.length;
        osc.connect(g); g.connect(this.ambientGain);
        osc.start(now);
        // 缓慢频率调制，制造"深渊呼吸"
        const lfo = ctx.createOscillator();
        const lg = ctx.createGain();
        lfo.frequency.value = 0.05 + i*0.02;
        lg.gain.value = 1.5;
        lfo.connect(lg); lg.connect(osc.frequency);
        lfo.start(now);
      }
      this.setAmbientIntensity(0.4);
    } catch(e){ console.warn('Ambient drone failed:', e); }
  }

  // 由深渊引擎按场景能量调用（已节流），平滑过渡音量
  setAmbientIntensity(v) {
    if (!this.ambientGain || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const target = 0.02 + v*0.06;   // 极低音量，仅作空间底色，不抢 BGM
      this.ambientGain.gain.cancelScheduledValues(now);
      this.ambientGain.gain.linearRampToValueAtTime(target, now + 0.8);
    } catch(e){}
  }

  // crossfade 无缝切换轨道：旧 BGM fade out 1.2s → 新 BGM fade in 1.2s
  // ambient drone 持续运行不受影响
  playTrack(trackName) {
    if (!this.ctx) return;
    const cfg = AudioManager.TRACK_CONFIG[trackName];
    if (!cfg) return;
    const now = this.ctx.currentTime;
    const fadeDur = 1.2;

    // 取消可能存在的待执行 crossfade（避免快速切换时回调叠加）
    this._trackTag++;

    // Phase 1：旧层 fade out（不立即停止 currentTrack，让 fade 期间继续播放最后几拍）
    Object.keys(this.layerGains).forEach(name => {
      try {
        this.layerGains[name].gain.cancelScheduledValues(now);
        this.layerGains[name].gain.setValueAtTime(this.layerGains[name].gain.value, now);
        this.layerGains[name].gain.linearRampToValueAtTime(0, now + fadeDur);
      } catch(e){}
    });

    // Phase 2：切换 config 并 fade in 新层（延迟 fadeDur 让旧层先衰减完）
    const myTag = this._trackTag;
    setTimeout(() => {
      if (this._trackTag !== myTag) return;   // 已被更新的 playTrack 取代
      try {
        this.currentTrack = trackName;
        this.currentConfig = cfg;
        this.sectionIndex = 0;
        this.sectionStartBeat = 0;
        this.currentBeat = 0;
        this._lastMelodyFreq = 0;   // T160：切歌时重置旋律级进状态，避免旧歌末音影响新歌起句
        this._lastChordIdx = -1;   // T166：切歌时重置和弦状态
        this._arpNoteOffset = 0;   // T166：切歌时重置 Arp 音符偏移
        const t = this.ctx.currentTime;
        this.nextNoteTime = t + 0.05;
        Object.keys(this.layerGains).forEach(name => {
          try {
            this.layerGains[name].gain.cancelScheduledValues(t);
            this.layerGains[name].gain.setValueAtTime(0, t);
            this.layerGains[name].gain.linearRampToValueAtTime(1, t + fadeDur);
          } catch(e){}
        });
      } catch(e){}
    }, Math.floor(fadeDur * 1000));

    this.currentBGM = trackName;
  }

  stopBGM() {
    // 兼容旧 bgmNodes 字段
    this.bgmNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    this.bgmNodes = [];
    if (!this.ctx) {
      this.currentTrack = null;
      this.currentConfig = null;
      this.currentBGM = null;
      return;
    }
    const now = this.ctx.currentTime;
    // 所有层 fade out 0.5s 后保持静音
    Object.keys(this.layerGains).forEach(name => {
      try {
        this.layerGains[name].gain.cancelScheduledValues(now);
        this.layerGains[name].gain.setValueAtTime(this.layerGains[name].gain.value, now);
        this.layerGains[name].gain.linearRampToValueAtTime(0, now + 0.5);
      } catch(e){}
    });
    this.currentTrack = null;
    this.currentConfig = null;
    this.currentBGM = null;
    this._lastMelodyFreq = 0;   // T160：停止 BGM 时重置旋律级进状态
    this._lastChordIdx = -1;   // T166：停止 BGM 时重置和弦状态
    this._arpNoteOffset = 0;   // T166：停止 BGM 时重置 Arp 音符偏移
    this._trackTag++;   // 取消任何挂起的 crossfade 回调
  }

  // ==================== 兼容方法（保留原签名） ====================
  // 旧调用点无需修改：playMapBGM/playShopBGM/playBattleBGM 委托给 playTrack
  playMapBGM() { this.playTrack('map'); }
  playShopBGM() { this.playTrack('shop'); }
  // playBattleBGM 根据 musicState 决定播放 battle 还是 boss 轨道
  playBattleBGM() {
    const track = (this.musicState === 'boss' || this.bossPhase >= 2) ? 'boss' : 'battle';
    this.playTrack(track);
  }

  // ==================== 阶段 3：动态音乐系统 ====================
  setMusicState(state) { this.musicState = state; }
  setBattleIntensity(v) { this.battleIntensity = Math.max(0, Math.min(1, v)); }
  setPlayerCrisis(v) { this.playerCrisis = Math.max(0, Math.min(1, v)); }
  // Boss P2 时切换到 boss 轨道 + 加入 threat 层（通过 musicState='boss' 在 getSectionLayers 触发）
  setBossPhase(phase) {
    this.bossPhase = phase;
    if (phase >= 2) {
      this.musicState = 'boss';
      if (this.currentTrack !== 'boss') this.playTrack('boss');
    }
  }

  // ==================== 阶段 4：音效升级 ====================
  // playSFX：保留全部 12 种现有音效（升级为多层+ADSR+随机化）+ 新增 13 种
  // 路由策略：short=dry 直达；impact=中等混响 wet 0.2；resonant=重混响 wet 0.5
  playSFX(type) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    // ±5% 音高随机化：让重复触发的音效不显得机械
    const detune = (Math.random() - 0.5) * 0.1;

    // 路由辅助：把目标节点按模式发到对应输出
    const route = (target, mode) => {
      try {
        if (mode === 'impact') {
          const send = ctx.createGain();
          send.gain.value = 0.2;
          target.connect(send);
          send.connect(this.sfxReverbInput);
          target.connect(this.sfxGain);
        } else if (mode === 'resonant') {
          const send = ctx.createGain();
          send.gain.value = 0.5;
          target.connect(send);
          send.connect(this.sfxReverbInput);
          target.connect(this.sfxGain);
        } else {
          // short：dry 直达
          target.connect(this.sfxGain);
        }
      } catch(e){}
    };

    try {
      let osc, g;
      switch (type) {
        // ---------- 保留的 12 种现有音效（升级版） ----------
        case 'card_play': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(880 * (1 + detune), now + 0.08);
          this.adsr(g.gain, now, 0.005, 0.05, 0.3, 0.1, 0.15);
          osc.connect(g); route(g, 'short');
          osc.start(now); osc.stop(now + 0.2);
          break;
        }
        case 'attack': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.15);
          this.adsr(g.gain, now, 0.005, 0.05, 0.3, 0.1, 0.2);
          osc.connect(g); route(g, 'impact');
          osc.start(now); osc.stop(now + 0.25);
          // 冲击噪声层
          const noise = this.createNoiseSource(0.1);
          if (noise) {
            const ng = ctx.createGain();
            ng.gain.setValueAtTime(0.1, now);
            ng.gain.linearRampToValueAtTime(0, now + 0.1);
            noise.connect(ng); route(ng, 'impact');
            noise.start(now); noise.stop(now + 0.15);
          }
          break;
        }
        case 'block': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(600 * (1 + detune), now + 0.1);
          this.adsr(g.gain, now, 0.005, 0.05, 0.3, 0.1, 0.12);
          osc.connect(g); route(g, 'short');
          osc.start(now); osc.stop(now + 0.2);
          break;
        }
        case 'combo': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(1200 * (1 + detune), now + 0.06);
          this.adsr(g.gain, now, 0.005, 0.03, 0.3, 0.07, 0.1);
          osc.connect(g); route(g, 'short');
          osc.start(now); osc.stop(now + 0.15);
          break;
        }
        case 'smash': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(100 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(30, now + 0.3);
          this.adsr(g.gain, now, 0.005, 0.1, 0.3, 0.25, 0.25);
          osc.connect(g); route(g, 'impact');
          osc.start(now); osc.stop(now + 0.4);
          // 噪音层（升级版用 createNoiseSource）
          const noise = this.createNoiseSource(0.1);
          if (noise) {
            const ng = ctx.createGain();
            ng.gain.setValueAtTime(0.12, now);
            ng.gain.linearRampToValueAtTime(0, now + 0.1);
            noise.connect(ng); route(ng, 'impact');
            noise.start(now); noise.stop(now + 0.15);
          }
          break;
        }
        case 'stun': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800 * (1 + detune), now);
          osc.frequency.setValueAtTime(400, now + 0.1);
          osc.frequency.setValueAtTime(200, now + 0.2);
          this.adsr(g.gain, now, 0.005, 0.05, 0.3, 0.25, 0.15);
          osc.connect(g); route(g, 'resonant');
          osc.start(now); osc.stop(now + 0.35);
          break;
        }
        case 'hurt': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(50, now + 0.2);
          this.adsr(g.gain, now, 0.005, 0.05, 0.3, 0.2, 0.15);
          osc.connect(g); route(g, 'impact');
          osc.start(now); osc.stop(now + 0.3);
          break;
        }
        case 'gold': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(1800 * (1 + detune), now + 0.06);
          this.adsr(g.gain, now, 0.005, 0.04, 0.3, 0.08, 0.08);
          osc.connect(g); route(g, 'resonant');
          osc.start(now); osc.stop(now + 0.2);
          break;
        }
        case 'heal': {
          osc = ctx.createOscillator(); g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400 * (1 + detune), now);
          osc.frequency.linearRampToValueAtTime(800 * (1 + detune), now + 0.2);

// ==================== 粒子系统 ====================
class Particle {
  constructor(x, y, vx, vy, life, color, size, glyph) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
    this.glyph = glyph || null; // 符文符号
    this.rot = rand(0, Math.PI * 2);
    this.rotV = rand(-0.1, 0.1);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05; // 重力
    this.life--;
    this.rot += this.rotV;
  }
  get alive() { return this.life > 0; }
  get alpha() { return clamp(this.life / this.maxLife, 0, 1); }
}

class ParticleSystem {
  constructor() {
    this.particles = [];
  }
  emit(x, y, count, config = {}) {
    let { color = '#ffffff', size = 3, life = 30, speed = 2, glyphs = null } = config;
    for (let i = 0; i < count; i++) {
      let angle = rand(0, Math.PI * 2);
      let spd = rand(speed * 0.5, speed);
      let glyph = glyphs ? pick(glyphs) : null;
      this.particles.push(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, rand(life*0.5, life), color, rand(size*0.5, size), glyph));
    }
  }
  update() {
    this.particles = this.particles.filter(p => { p.update(); return p.alive; });
  }
  draw() {
    this.particles.forEach(p => {
      push();
      translate(p.x, p.y);
      rotate(p.rot);
      let c = color(p.color);
      fill(red(c), green(c), blue(c), p.alpha * 255);
      noStroke();
      if (p.glyph) {
        textAlign(CENTER, CENTER);
        textSize(p.size * 4);
        text(p.glyph, 0, 0);
      } else {
        ellipse(0, 0, p.size, p.size);
      }
      pop();
    });
  }
  clear() { this.particles = []; }
}

// ==================== 浮动文字系统 ====================
class FloatingText {
  constructor(x, y, text, color, size = 18) {
    this.x = x; this.y = y; this.text = text;
    this.color = color; this.size = size;
    this.life = 45; this.maxLife = 45;
    this.vy = -2;
  }
  update() { this.y += this.vy; this.vy *= 0.97; this.life--; }
  get alive() { return this.life > 0; }
  get alpha() { return clamp(this.life / this.maxLife, 0, 1) * 255; }
}

class FloatingTextManager {
  constructor() { this.texts = []; }
  add(x, y, text, color, size) { this.texts.push(new FloatingText(x, y, text, color, size)); }
  // 原地压缩（双指针），**不产生新数组**。
  //   旧写法每帧 filter 一次：飘字一多（击杀/受击同帧）就是每帧一个临时数组进 GC，
  //   与灰烬粒子系统"零 new"的做法形成反差。这里对齐那个标准。
  update() {
    const arr = this.texts;
    let w = 0;
    for (let i = 0; i < arr.length; i++) {
      const t = arr[i];
      t.update();
      if (t.alive) { arr[w++] = t; }
    }
    arr.length = w;
  }
  draw() {
    this.texts.forEach(t => {
      push();
      let c = color(t.color);
      fill(red(c), green(c), blue(c), t.alpha);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(t.size);
      text(t.text, t.x, t.y);
      pop();
    });
  }
  clear() { this.texts = []; }
}

// ==================== 屏幕震动 ====================
class ScreenShake {
  constructor() { this.intensity = 0; this.duration = 0; this.ox = 0; this.oy = 0; }
  trigger(intensity, duration) {
    this.intensity = Math.max(this.intensity, intensity);
    this.duration = Math.max(this.duration, duration);
  }
  update() {
    if (this.duration > 0) {
      this.ox = rand(-this.intensity, this.intensity);
      this.oy = rand(-this.intensity, this.intensity);
      this.duration--;
      this.intensity *= 0.9;
    } else {
      this.ox = 0; this.oy = 0;
    }
  }
  apply() {
    if (this.ox !== 0 || this.oy !== 0) {
      translate(this.ox, this.oy);
    }
  }
}

// ==================== 按钮组件 ====================
function drawButton( x, y, w, h, text, hovered, enabled = true, btnColor = COLORS.gold) {
  push();
  translate(x, y);
  // 阴影
  fill(0, hovered ? 60 : 40);
  noStroke();
  rect(2, 2, w, h, 6);
  // 主体
  let c = color(btnColor);
  if (hovered) {
    fill(red(c) * 1.2, green(c) * 1.2, blue(c) * 1.2);
  } else {
    fill(red(c), green(c), blue(c));
  }
  // 禁用状态叠加遮罩
  if (!enabled) {
    fill(0, 155);
    noStroke();
    rect(0, 0, w, h, 6);
  }
  stroke(0, 80);
  strokeWeight(1.5);
  rect(0, 0, w, h, 6);
  // 文字
  fill(enabled ? 0 : 200);
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(14);
  textStyle(BOLD);
  text(text, w / 2, h / 2);
  pop();
  return hovered && enabled;
}

// ==================== 通用卡牌升级函数 ====================
// 根据卡牌类型和关键词差异化应用升级效果
// 调用后 card.upgraded = true，且对应数值字段被修改
function applyCardUpgrade(card) {
  if (!card || card.upgraded) return;
  card.upgraded = true;
  // 根据卡牌类型应用差异化升级规则（switch-case 块作用域）
  switch (card.type) {
    case 'attack': {
      // 攻击牌：基础伤害大幅提升
      card.baseDmg = Math.floor((card.baseDmg || 0) * 1.5);
      if (card.comboBonus) card.comboBonus *= 2;            // 连击伤害翻倍
      if (card.comboScale) card.comboScale = Math.floor(card.comboScale * 1.5);
      if (card.statusAmt) card.statusAmt = Math.floor(card.statusAmt * 1.5);
      if (card.hits) card.hits += 1;                         // 多段攻击 +1
      break;
    }
    case 'skill': {
      // 技能牌：格挡提升 + 状态层数增加
      card.baseBlock = Math.floor((card.baseBlock || 0) * 1.5);
      if (card.comboBlock) card.comboBlock *= 2;             // 连击格挡翻倍
      if (card.stunPerCombo) card.stunPerCombo = Math.ceil(card.stunPerCombo * 1.5);
      if (card.statusAmt) card.statusAmt = Math.floor(card.statusAmt * 1.5);
      break;
    }
    case 'power': {
      // 能力牌：效果增强
      if (card.comboBonus) card.comboBonus = Math.floor(card.comboBonus * 1.5);
      if (card.drawCards) card.drawCards += 1;
      if (card.apRestorePerCombo) card.apRestorePerCombo = Math.round((card.apRestorePerCombo + 0.2) * 10) / 10;
      if (card.statusAmt) card.statusAmt = Math.floor(card.statusAmt * 1.5);
      break;
    }
  }
  // 特殊关键词处理
  if (card.keywords && card.keywords.includes('猛击') && card.comboScale) {
    card.comboScale = Math.floor(card.comboScale * 1.5);
    if (card.thresholdBonus) card.thresholdBonus = Math.floor(card.thresholdBonus * 1.3);
  }
  if (card.keywords && card.keywords.includes('先攻')) {
    card.cost = Math.max(0, card.cost - 1);
  }
  if (card.keywords && card.keywords.includes('流转') && card.flowApRefund) {
    card.flowApRefund += 1;
  }
  if (card.keywords && card.keywords.includes('异常') && card.statusAmt) {
    card.statusAmt = Math.floor(card.statusAmt * 1.5);
  }
  if (card.keywords && card.keywords.includes('震慑') && card.comboScale) {
    card.comboScale = Math.floor(card.comboScale * 1.5);
  }
  // ===== T177 自定义升级特例（无法由通用规则自动处理的卡牌） =====
  // 特例处理必须在通用规则之后执行，以便覆盖默认值
  if (card.id === 'adrenaline') {
    // 肾上腺素升级：extraAp +1, extraDraw +1
    card.extraAp = (card.extraAp || 2) + 1;
    card.extraDraw = (card.extraDraw || 2) + 1;
  }
  if (card.id === 'flame_gift') {
    // 燃焰之赐升级：立即结算次数 1→2（effect 处理逻辑读取 card.dotTimes || 1）
    card.dotTimes = 2;
  }
  if (card.id === 'hologram_burst') {
    // 全息爆发升级：statusAmt 6→10（覆盖默认 attack 类型的 ×1.5=9）
    card.statusAmt = 10;
  }
  if (card.id === 'blood_sacrifice') {
    // 血之献祭升级：hpCost -1, extraDraw +1
    card.hpCost = Math.max(1, (card.hpCost || 3) - 1);
    card.extraDraw = (card.extraDraw || 3) + 1;
  }
  if (card.id === 'ascended_blade') {
    // 飞升之刃升级：comboBonus +3（覆盖默认 attack 类型的 ×2；先回滚 ×2 再 +3）
    card.comboBonus = Math.floor((card.comboBonus || 4) / 2) + 3;
  }
  if (card.id === 'anomaly_surge') {
    // 异常增殖升级：额外结算一次灼烧 DOT（与 flame_gift 同字段 dotTimes）
    card.dotTimes = 2;
  }
  if (card.id === 'life_steal_combo') {
    // 吸血连击升级：comboLifeSteal 1→2
    card.comboLifeSteal = (card.comboLifeSteal || 1) + 1;
  }
  if (card.id === 'combo_focus') {
    // 连击聚能升级：comboGain 1→2
    card.comboGain = (card.comboGain || 1) + 1;
  }
  if (card.id === 'stun_resonance') {
    // 震慑共鸣升级：baseStun 2→3
    card.baseStun = (card.baseStun || 2) + 1;
  }
  if (card.id === 'stun_strike') {
    // 震慑斩升级：stunDmgPerStack 2→3
    card.stunDmgPerStack = (card.stunDmgPerStack || 2) + 1;
  }
  if (card.id === 'ice_shield') {
    // 冰盾升级：blockPerFreeze 2→3
    card.blockPerFreeze = (card.blockPerFreeze || 2) + 1;
  }
  if (card.id === 'eternal_cycle') {
    // 永恒循环升级：flowApRefund 1→2, flowComboGain 1→2
    card.flowApRefund = (card.flowApRefund || 1) + 1;
    card.flowComboGain = (card.flowComboGain || 1) + 1;
  }
  if (card.id === 'flow_draw') {
    // 流转抽牌升级：extraDraw 2→3, flowBonusDraw 1→2
    card.extraDraw = (card.extraDraw || 2) + 1;
    card.flowBonusDraw = (card.flowBonusDraw || 1) + 1;
  }
  if (card.id === 'flow_strike') {
    // 流转打击升级：新增 flowComboExtra +1（流转触发时额外 +1 连击）
    card.flowComboExtra = (card.flowComboExtra || 0) + 1;
  }
  if (card.id === 'heat_combo') {
    // 灼热连击升级：comboToBurn 2→1（转化效率 1:1）
    card.comboToBurn = 1;
  }
  if (card.id === 'toxic_combo') {
    // 剧毒连击升级：comboToCorrode 2→1
    card.comboToCorrode = 1;
  }
  if (card.id === 'boiling_blood') {
    // 沸腾之血升级：burnToCombo 3→2
    card.burnToCombo = 2;
  }
  if (card.id === 'ice_resonance') {
    // 冰晶共鸣升级：freezeToCombo 2→1
    card.freezeToCombo = 1;
  }
  if (card.id === 'field_search') {
    // 战地检索升级：extraDraw 2→3
    card.extraDraw = (card.extraDraw || 2) + 1;
  }
  if (card.id === 'deep_thought') {
    // 深度思考升级：discountAmt 2→3
    card.discountAmt = (card.discountAmt || 2) + 1;
  }
  if (card.id === 'combo_draw') {
    // 连击抽牌升级：drawPerComboMax 3→5
    card.drawPerComboMax = (card.drawPerComboMax || 3) + 2;
  }
  if (card.id === 'insight') {
    // 洞察升级：extraDraw 1→2
    card.extraDraw = (card.extraDraw || 1) + 1;
  }
  if (card.id === 'emergency_bandage') {
    // 紧急包扎升级：healAmt 5→8
    card.healAmt = (card.healAmt || 5) + 3;
  }
  if (card.id === 'fortify') {
    // 坚韧升级：passiveBlock 4→6
    card.passiveBlock = (card.passiveBlock || 4) + 2;
  }
  if (card.id === 'plague_cloud') {
    // 瘟疫之云升级：statusList 中每个异常 amt 4→6
    if (card.statusList) {
      card.statusList = card.statusList.map(s => ({...s, amt: (s.amt || 4) + 2}));
    }
  }
  if (card.id === 'energy_burst') {
    // 能量爆发升级：extraAp 2→3
    card.extraAp = (card.extraAp || 2) + 1;
  }
  if (card.id === 'combo_charge') {
    // 连击充能升级：apPerComboMax 3→5
    card.apPerComboMax = (card.apPerComboMax || 3) + 2;
  }
  if (card.id === 'growth_blade') {
    // 成长之刃升级：growthDmg 2→3
    card.growthDmg = (card.growthDmg || 2) + 1;
  }
  if (card.id === 'double') {
    // 双倍升级：doubleTimes 2→3（默认值 2 由 effect 处理逻辑兜底）
    card.doubleTimes = 3;
  }
  if (card.id === 'block_strike') {
    // 格挡重击升级：blockStrikeBonusDmg +5（升级后伤害 = 格挡数 + 5）
    card.blockStrikeBonusDmg = 5;
  }
  if (card.id === 'finishing_blow') {
    // 终结一击升级：斩杀阈值 0.4→0.5（匹配 upgradedDesc "低于50%"）
    card.executeThreshold = 0.5;
  }
}

// ==================== 场景基类 ====================
class Scene {
  constructor() { this.transitionAlpha = 0; this.transitioning = false; }
  // enter() 是所有场景切换的统一钩子:在此触发防抖自动存(白名单内场景才真正写)
  //   战斗胜利后 gs.scene='map' 或 'victory' 会自动触发;战斗中(battle)/标题/失败/移除卡 在 saveCurrent 内被拒存
  //   (T252:战斗中拒存而非伪装成 map——防「节点已提交、战斗未完成」中间态导致 boss 死锁/战斗逃课;
  //    进战前的安全快照见 MapScene.mousePressed)
  //   victory/defeat 时清档(肉鸽惯例:一局结束存档清,避免读档已通关/已失败的存档)
  enter() {
    this.transitionAlpha = 255; this.transitioning = true;
    if (saveManager) {
      if (gs.scene === 'victory' || gs.scene === 'defeat') {
        saveManager.clearSave();
      }
      saveManager.autoSave();
    }
  }
  update() {
    if (this.transitioning) {
      this.transitionAlpha -= 8;
      if (this.transitionAlpha <= 0) { this.transitionAlpha = 0; this.transitioning = false; }
    }
  }
  draw() {
    if (this.transitionAlpha > 0) {
      fill(0, this.transitionAlpha);
      noStroke();
      rect(0, 0, GAME_W, GAME_H);
    }
  }
  mousePressed() {}
  mouseReleased() { releaseBloomSlider(); }
  keyPressed() {}
}

// ==================== 标题场景 ====================
// T228：副标题「Flow」艺术参数 —— 绘制与点击热区**共用同一份**，杜绝两处各写魔数导致漂移。
//   T229 可辨认性修订：6 层×1.6 + 逐层差速移轴在小字上会把字面拉成重影 → 砍到 3 层×2px（总厚 6px）、
//   字号 36 升到 46，并把逐层差速 depthFactor 移轴改为**刚体平移**（所有层同一位移，字整体跟随、零层间重影）。
const FLOW_STYLE = {
  size: 46,          // 字号（T229：36→46，小字+多层堆叠的可辨认性不足）
  layers: 3,         // 伪 3D 堆叠层数（T229：6→3，仅保留 暗/中/亮 三个干净面）
  layerOff: 2,       // 每层下偏 px（3×2=6px 总厚，46 号字上比例 ≈ 巨字 3/180）
  baseY: 114,        // 字面中心基准 y（字号增大后下移 8px，浮顶仍与 A 字视觉底缘保 ≥7px）
  bobAmp: 4,         // Flow 本体上下漂浮幅度 px（轻微 —— "飘"的感觉）
  bobSpeed: 0.022,   // 漂浮角速（约 4.8s 一周，慢得有重量；刻意与主题句呼吸 0.031 错频，避免共振）
  triBaseY: 150,     // 点击指示三角基准 y（字变大后随之下移，距 Flow 堆叠底缘 ≥4px、不压主题句）
  triAmp: 7,         // 三角漂浮幅度（刻意比 Flow 大近一倍 → 视线被三角牵向 Flow）
  triHalf: 7,        // 三角半边长
  tiltFactor: 0.3,   // 鼠标移轴系数：T229 改为**刚体**移轴（所有层同值，不再乘 depthFactor）—— 跟随主标题但零重影
  // T241：Flow 可被鼠标**抓住拖走**，松手后一边上下左右随机晃、一边轻轻飘回「A」正下方。
  //   参数集中在此，与绘制 / 热区共用同一份（沿用 T228「不写魔数」的约束）。
  drag: {
    clickSlop: 7,       // 松手位移 ≤ 此值视作"点击"（保留点 Flow 开 AI 的旧语义），否则算拖拽
    // T245：回位由**弹簧**改为「惯性余韵 + 固定时长缓动」。
    //   为什么要动结构、不只是调参数：弹簧的速度是**振荡**的 —— 每次穿过零点后会重新加速，
    //   再怎么调都不可能"一路逐步减慢"。easeOut 的速度按 (1-p)^(pow-1) 严格单调递减，
    //   而且总时长可以直接指定。这是"一路减速"与"弹回去"的本质区别。
    //   （旧的 springK / damp 已删除，不再参与计算 —— 留着只会让人以为还在用弹簧。）
    inertiaFrames: 26,  // ① 甩手余韵帧数（0.43s）：松手后先延续一段手速，再开始往回飘
    tossDecay: 0.90,    //    余韵每帧衰减 —— 收住"甩出去"的那一下，但不能拖太久
    returnFrames: 235,  // ② 缓动回位总帧数（按 60fps 折算 3.92s；连同余韵约 **4.35s**）
                        //    上一版实测 3.14s → 这版慢约 1.4 倍，且**不再随帧率伸缩**（见 _updateFlowDrag）
    returnPow: 3,       //    easeOut 指数（速度 ∝ (1-p)²）：越大前段越快、后段越慢，3 最自然
    tossCap: 13,        // 甩手初速封顶 px/帧（防止甩太远直接飞出画面）
    tossMemory: 0.62,   // T249：手速的滑动平均系数 —— 记 3 帧左右的"肌肉惯性"。
                        //   原来 vx 每帧被重新赋成瞬时位移，人手松开前总有 1~3 帧静止，
                        //   那一刻 vx 已被写成 0 → "甩出去"在真实操作里从不发生（实测余韵 0.0px）。
    wanderAmp: 11,      // 松手瞬间的随机晃动幅度 px（配合 nz1 → 实际约 ±5.5px）
                        //   T248：幅度不再靠"越飘越小"的独立指数衰减收尾，改由**距离包络**控制（见下）
    wanderTail: 0.9,    //   包络指数：剩余路程的 0.9 次方 —— 小于 1 是为了让晃动在
                        //   最后 20% 才明显收住，而不是一松手就开始蔫。
                        //   ⚠️ 旧方案（独立指数衰减）要 299 帧才落到 0.8px 以下，比回位本身还长 20%：
                        //   字已经到家了还在那儿抖，收尾很脏。挂在路程上就必然同时归零。
    wanderSpeed: 0.042, // 晃动噪声步进：慢摆 = 飘，快摆 = 抽搐
    pad: 40,            // 软夹紧边距：字心始终留在画面内，拖不丢
    // T243：回位**姿态** —— 一片纸被风送回去时会侧倾、会翻面，不会平移着滑回去。
    poseAngMax: 0.20,   // 侧倾上限 rad（≈11°）—— 再大就像在转圈，不像飘
    poseFromV: 0.010,   // 手速 → 倾角（被"拎"着走时字往运动方向侧过去）
    poseNoise: 0.012,   // 晃动幅度 → 自由摆角（配合 nz1 → 回程中段约 ±4°~6°，正好是纸片飘的幅度）
    poseBase: 0.030,    // 自由摆角的底噪（配合包络，落地前会平滑收到 0，不会出现"啪"的一下站正）
    poseSpeed: 0.013,   // T247：姿态噪声的**独立**步进 —— 刻意比 wanderSpeed(0.042) 慢 3 倍。
                        //   位置晃动可以快那是"抖"，姿态必须慢才是"摇"；两者共用一条噪声时，
                        //   快速噪声会被 lerp 低通滤掉，量出来只有 1.4°，肉眼根本看不出在飘。
    poseLerpDrag: 0.18, // 拖拽时姿态跟随速度（要跟手，快一点）
    poseLerpBack: 0.062,// 回飘时姿态跟随速度（比位置慢半拍才有纸片的迟滞感；
                        //   目标角变慢之后同步上调，否则连目标都追不上）
    poseSquash: 0.45,   // 倾角 → 纵向压缩系数（纸片侧过去的透视）
    poseSquashCap: 0.10,// 压缩封顶 10% —— 超过就开始像被压扁，不是翻面
  },
};
// T248：单位噪声 —— 返回约 [-1, 1] 而非 Perlin 原生的 0.5±0.2。
//   实测 211 帧里 noise() 只在 [0.294, 0.655] 之间取值：直接用 (noise-0.5) 做系数，
//   写 12px 的幅度实际只有 ±2.5px，写满屏的姿态参数实际只摆 0.8°。
//   GAIN 2.2 = 1 / (实际半幅 ≈ 0.2) 并留一点饱和余量：这样 wanderAmp 写 12，
//   眼睛看到的就真的是 ±6px 左右；参数终于和观感对得上，不用再靠猜魔数放大。
const NOISE_GAIN = 2.2;
function nz1(x) {
  return constrain((noise(x) - 0.5) * NOISE_GAIN, -1, 1);
}

class TitleScene extends Scene {
  enter() {
    super.enter();
    audio.playMapBGM();
    // PHASE 4：进标题页时异步求一句「记忆回响」（每局至多 1 次、1 币封顶）。
    //   刻意不 await —— 界面不等它，取不到就展示本地模板句，玩家感知不到差别。
    try { if (typeof memoryRequestEcho === 'function') memoryRequestEcho(); } catch (e) {}
    this.titleY = -100;
    this.subtitleAlpha = 0;
    this.startAlpha = 0;
    this.time = 0;
    this.tiltX = 0;  // 鼠标倾斜状态 X（平滑后，px）
    this.tiltY = 0;  // 鼠标倾斜状态 Y（平滑后，px）
    // 主题「飘」· AI 引导三角状态（**只在首次进入时初始化**，不清零）：
    //   TitleScene 是单例，玩家点过一次后 _aiHintDismissed 会一直保留 ——
    //   T228 前是小字「按我开启AI无尽空间」，现改为 Flow 下方的银色指示三角；由明转暗消失后**不再出现**；反复提示是打扰，不是引导。
    if (this._aiHintFade === undefined) this._aiHintFade = 1;
    if (this._aiHintFading === undefined) this._aiHintFading = false;
    if (this._aiHintDismissed === undefined) this._aiHintDismissed = false;
    // T241：Flow 拖拽状态。每次进入标题页归位（单例场景，跨局不残留上一次的位移）。
    //   ox/oy = 相对「A 正下方锚点」的当前偏移；回飘的目标就是 (0,0)。
    this.flowDrag = {
      dragging: false,   // 正被鼠标抓住
      returning: false,  // 松手后正在飘回
      ox: 0, oy: 0,      // 当前偏移
      vx: 0, vy: 0,      // 速度（拖拽时记录手速，松手时延续为初速）
      gdx: 0, gdy: 0,    // 按下瞬间：鼠标与字心的差值（保证字不跳到鼠标中心）
      moved: 0,          // 本次按压累计位移（区分点击 vs 拖拽）
      wt: 0,             // 晃动噪声相位
      wamp: 0,           // 本次回位的晃动幅度**峰值**（逐帧不再衰减，实际幅度由距离包络给出）
      px: 0, py: 0,      // 按下点（松手时算总位移用）
      retT: 0,           // T245：回位计时（**虚拟帧**，非真实帧 —— 见 _updateFlowDrag）
      pt: 0,             // T247：姿态噪声相位（独立于 wt，走得更慢）
      easeSet: false,    // T247：缓动起点是否已记（原来靠 retT===整数判定，一改成小数就失效）
      bx: 0, by: 0,      // T245：基准位置（不含晃动）—— 缓动曲线只作用于它
      ax: 0, ay: 0,      // T245：缓动段起点（余韵结束那一刻的基准位置）
      ang: 0,            // T243：当前姿态角 rad（侧倾，正 = 顺时针）
      sy: 1,             // T243：当前纵向缩放（随倾角轻微压扁 = 翻面透视）
    };
    this.glyphs = [];
    // T205：清空 startBtn 防止上一次进入 title 时遗留的 hovered=true 状态在再次进入时被误读
    this.startBtn = undefined;
    // 漂浮符号渐隐：life + maxLife
    // 渐隐规则（12%/76%/12%）：首 12% 渐显 → 中 76% 保持原亮 → 末 12% 渐隐
    for (let i = 0; i < 30; i++) {
      let maxLife = 300 + rand(0, 200);
      this.glyphs.push({
        x: rand(0, GAME_W), y: rand(0, GAME_H),
        vx: rand(-0.3, 0.3), vy: rand(-0.5, -0.1),
        glyph: pick(['☿','♀','♁','♃','♄','♅','♆','☉','☽','☿','⚗','⚘','⚙','⛤','⛧','♰','✠','✢','✣','✤','✦','✧','★','☆','◈','◇','◆','◉','◎','●']),
        size: rand(14, 32),
        life: maxLife,           // 当前生命（每帧 -1）
        maxLife: maxLife,        // 最大生命（用于计算 fadeAlpha）
      });
    }
  }
  update() {
    super.update();
    // T203：牌库查看器打开时暂停 TitleScene 更新（漂浮符文/标题 lerp/鼠标连轴/开始按钮动画）
    if (gs.showDeckViewer) return;
    this.time++;
    this.titleY = lerp(this.titleY, GAME_H * 0.28, 0.05);
    if (this.time > 30) this.subtitleAlpha = lerp(this.subtitleAlpha, 200, 0.04);
    if (this.time > 60) this.startAlpha = lerp(this.startAlpha, 255, 0.04);
    // AI 引导行淡出：点击后**由明转暗**，约 45 帧（0.75s）走完，随后永久消失。
    if (this._aiHintFading && !this._aiHintDismissed) {
      this._aiHintFade -= 0.022;
      if (this._aiHintFade <= 0) { this._aiHintFade = 0; this._aiHintDismissed = true; }
    }
    // 鼠标移轴视差：计算倾斜量并平滑跟随
    //   目标归一化 [-1,1]（中心为 0），最大 ±30px；平滑系数 0.08 避免抖动
    let targetTiltX = (mx() - GAME_W / 2) / (GAME_W / 2) * 30;
    let targetTiltY = (my() - GAME_H / 2) / (GAME_H / 2) * 30;
    this.tiltX = lerp(this.tiltX, targetTiltX, 0.08);
    this.tiltY = lerp(this.tiltY, targetTiltY, 0.08);
    this._updateFlowDrag();
    this.glyphs.forEach(g => {
      g.x += g.vx; g.y += g.vy;
      g.life--;
      // 生命耗尽时从底部重生 + 重置 maxLife
      if (g.life <= 0) {
        let newMax = 300 + rand(0, 200);
        g.x = rand(0, GAME_W); g.y = GAME_H + 20;
        g.life = newMax; g.maxLife = newMax;
      }
    });
  }
  draw() {
    abyssVeil();
    // 背景符文（fadeAlpha * 255 保持中段全亮）
    this.glyphs.forEach(g => {
      // 渐隐规则（12%/76%/12%）：首 12% 渐显 → 中 76% 保持 1 → 末 12% 渐隐
      let lifeRatio = g.life / g.maxLife;
      let fadeAlpha;
      if (lifeRatio > 0.88) {
        fadeAlpha = (1 - lifeRatio) / 0.12;
      } else if (lifeRatio < 0.12) {
        fadeAlpha = lifeRatio / 0.12;
      } else {
        fadeAlpha = 1;
      }
      cFill('goldDim', fadeAlpha * 255);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(g.size);
      text(g.glyph, g.x, g.y);
    });
    // 标题：ABYSSUS 巨字 + 伪 3D 8 层堆叠 + 右下角 V2.1.0
    push();
    translate(GAME_W / 2, this.titleY);
    noStroke();
    textAlign(CENTER, CENTER);
    textStyle(BOLD);
    textSize(180);
    // 伪 3D 步骤 1：底层接地阴影（不响应鼠标，视觉锚点）→ 立体接地感
    cFill('bg', 200);
    text('ABYSSUS', 10, 16);
    // 伪 3D 步骤 2：8 层偏移堆叠（基础 3px 偏移 + 鼠标驱动移轴）
    //   depthFactor = (9 - i) / 8 → i=1: 1.0（最浅，响应最强），i=8: 0.125（最深，响应最弱）
    //   → 浅层大幅偏移 + 深层小幅偏移 → 真实 3D 视差
    for (let i = 8; i >= 1; i--) {
      let depthFactor = (9 - i) / 8;  // 深度系数（最浅=1.0，最深=0.125）
      let baseOff = i * 3;            // 基础偏移
      let layerTiltX = this.tiltX * depthFactor;
      let layerTiltY = this.tiltY * depthFactor;
      // 8 层颜色梯度：底层深暗 → 顶层高亮
      if (i >= 7) {
        cFill('goldDim');  // 底层 2 层（i=7, 8）：最暗金（立体"阴影面"）
      } else if (i >= 5) {
        cFill('gold');     // 中间 2 层（i=5, 6）：中性金（立体"侧面"）
      } else if (i >= 3) {
        cFill('gold');     // 较上 2 层（i=3, 4）：亮金（立体"亮面"）
      } else {
        cFill('goldBright'); // 顶层 2 层（i=1, 2）：最亮金（高光面）
      }
      text('ABYSSUS', baseOff + layerTiltX, baseOff + layerTiltY);
    }
    // 伪 3D 步骤 3：顶层核心高亮（depthFactor=1.0，响应最强）→ "凸起顶面"
    cFill('goldBright');
    text('ABYSSUS', this.tiltX, this.tiltY);
