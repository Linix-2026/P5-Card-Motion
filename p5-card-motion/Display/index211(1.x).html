    this.eulogyAt = null; // T238：判词到达时刻（晚到则按到达时起播浮入）
    this.requestAiEulogy();
  }
  // T238：记录判词就绪时刻，仅记第一次（同步本地句与异步返回共用）
  _markEulogy() { if (this.eulogyAt == null) this.eulogyAt = this.time || 0; }
  // T238：幕一砸落缓动（c=0.55 的 easeOutBack，过冲约 3%≈9px，金属活字砸在纸页上）
  _backEase(t) { const c = 0.55; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  // T238：分幕时间轴进度 —— at 帧起始、dur 帧完成，返回钳制 [0,1]
  _cue(at, dur) { return constrain((this.time - at) / dur, 0, 1); }
  _easeOut(t) { return 1 - (1 - t) * (1 - t); }
  // 为这局冒险求一句判词。失败/关闭/未授权一律回落本地句子，界面不等待、不卡死。
  async requestAiEulogy() {
    // 一局终了：记结果快照，用于复盘通关率与难度曲线（仅业务计数，不含玩家输入）
    logSdk('info', 'run:end', {
      result: 'victory', floor: gs.floorNumber || 0, region: gs.currentRegion,
      difficulty: gs.difficulty, gold: gs.gold, deckSize: gs.deck ? gs.deck.length : 0,
      codexTotal: (typeof CODEX_SYS !== 'undefined') ? CODEX_SYS._total : 0,
      codexNewThisRun: (typeof CODEX_SYS !== 'undefined') ? (CODEX_SYS._newThisRun || 0) : 0,
    });
    codexFlush();   // PHASE 1：局终强制落盘，避免玩家直接关页面丢掉本局发现
    memoryEndRun('victory');   // PHASE 4：世界记忆结账（通关次数 + 最深深度 + 落盘）
    const local = () => aiPickLocal('eulogy', (gs.floorNumber || 0) + (gs.gold || 0));
    if (!aiSys.enabled) { this.aiEulogy = local(); this._markEulogy(); return; }   // 红灯：零调用
    const ctx = `楼层=${gs.floorNumber || 0} 金币=${gs.gold} 卡组=${gs.deck ? gs.deck.length : 0}张 难度=${getDifficulty().name} 结局=通关`;
    const r = await aiRequest('eulogy', aiMessages(AI_SYS_PROMPT.eulogy, ctx), local);
    this.aiEulogy = String(r.text || local()).slice(0, 40);    // 限长，防止长文本撑破排版
    this._eulogyFromAi = !!(r && r.fromAi);                     // 供样式统一层决定中金/暗金
    this._markEulogy();
    // PHASE 2：局终把不足一批的余量也一起命名掉。
    //   刻意排在墓志铭**之后**：二者共用同一个自限频窗口，应让"当场可见"的墓志铭先取额度；
    //   命名失败也不重发（会挤掉墓志铭，且重发是二次扣费）。未命名的组合留在图鉴里，
    //   下次再遇到会重新入队，不会永久丢失。namerFlush 内部已吞异常，无需 await。
    namerFlush(true);
  }
  update() {
    super.update();
    // T203：牌库查看器打开时暂停 VictoryScene 更新（标题 lerp/视差/呼吸动画/统计数字动画）
    if (gs.showDeckViewer) return;
    this.time++;
    // T238 幕一（0–32f）：时间轴驱动的 easeOutBack 砸落，过冲回弹后精确归位 titleTargetY
    const _tt = constrain(this.time / 32, 0, 1);
    this.titleY = -100 + (this.titleTargetY + 100) * this._backEase(_tt);
    // 鼠标移轴视差（同开始页实现）：目标归一化 [-1,1] × ±30px，平滑 0.08
    let targetTiltX = (mx() - GAME_W / 2) / (GAME_W / 2) * 30;
    let targetTiltY = (my() - GAME_H / 2) / (GAME_H / 2) * 30;
    this.tiltX = lerp(this.tiltX, targetTiltX, 0.08);
    this.tiltY = lerp(this.tiltY, targetTiltY, 0.08);
  }
  draw() {
    abyssVeil();
    // 主标题 SUCCEED —— 参照开始界面 ABYSSUS 伪 3D 8 层堆叠 + 鼠标连轴视差 + 入场下移动画
    push();
    translate(GAME_W / 2, this.titleY);
    noStroke();
    textAlign(CENTER, CENTER);
    textStyle(BOLD);
    // 步骤 1：底层接地阴影（视觉锚点，偏移同开始页）—— T238 幕二：随砸落沉地由虚到实
    cFill('bg', Math.floor(120 + 80 * constrain(this.time / 32, 0, 1)));
    textSize(180);
    text('SUCCEED', 10, 16);
    // 步骤 2：8 层偏移堆叠 + 鼠标连轴视差（depthFactor 浅层大 / 深层小）
    for (let i = 8; i >= 1; i--) {
      let depthFactor = (9 - i) / 8;  // i=8: 0.125（最深，响应最弱），i=1: 1.0（最浅，响应最强）
      let baseOff = i * 3;
      let layerTiltX = this.tiltX * depthFactor;
      let layerTiltY = this.tiltY * depthFactor;
      if (i >= 7)       cFill('goldDim');    // 底层：最暗金
      else if (i >= 5)  cFill('gold');       // 中间：中性金
      else if (i >= 3)  cFill('gold');       // 较上：亮金
      else              cFill('goldBright'); // 顶层：最亮金
      textSize(180);
      text('SUCCEED', baseOff + layerTiltX, baseOff + layerTiltY);
    }
    // 步骤 3：顶层核心高亮（depthFactor=1.0，响应最强）
    //   T238 幕二·金闪：砸落途中带 36px 强辉光，落位瞬间 20f 衰减到 8，之后 8±2 慢呼吸（0.02，与全站错频）
    const dc = drawingContext;
    if (!this._goldGlow) {
      const gc = color(COLORS.goldBright);
      this._goldGlow = `rgba(${gc.levels[0]},${gc.levels[1]},${gc.levels[2]},0.9)`;
    }
    let glow;
    if (this.time < 32) glow = 36;
    else if (this.time < 52) glow = 8 + 28 * Math.pow(1 - (this.time - 32) / 20, 3);
    else glow = 8 + 2 * Math.sin((this.time - 52) * 0.02);
    dc.shadowBlur = glow;
    dc.shadowColor = this._goldGlow;
    cFill('goldBright');
    textSize(180);
    text('SUCCEED', this.tiltX, this.tiltY);
    dc.shadowBlur = 0;
    pop();
    // T242：战报 —— 巨字落定（32f）后立刻交代"这一局到底发生了什么"：
    //   数据行 34f 起滚（0.425H），判因行 48f 起浮（+27px），判词 50f 起播，三者在 0.42–0.50H 内顺次点亮。
    drawRunRecap(GAME_H * 0.425, {
      dataT: this._cue(34, 20), whyT: this._cue(48, 18),
      tone: 'gold', win: true, whyGap: 27,
    });
    // T238 幕三：AI 判词 0.50H 上浮淡入（与巨字底缘留约 55px）；异步晚到则按到达时刻起播
    if (this.aiEulogy) {
      const ec = this._easeOut(this._cue(Math.max(50, this.eulogyAt || 0), 18));
      drawAiLine(this.aiEulogy, GAME_W / 2, GAME_H * 0.50 + (1 - ec) * 10,
        { fromAi: this._eulogyFromAi, size: 15, alpha: Math.floor(255 * 0.95 * ec) });
    }
    // 主题「飘」：通关不是终局，是灰烬暂歇 —— 你只是从深渊带回了一页字。
    //   T238：0.553H，比判词晚 16f 浮入；不抢 SUCCEED 的视觉重量，只在离场前被读到。
    const _dv = (typeof driftLine === 'function') ? driftLine('victory') : '';
    if (_dv) {
      const dv = this._easeOut(this._cue(66, 18));
      cFill('goldDim', Math.floor(255 * 0.8 * dv));
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(13);
      textStyle(NORMAL);
      text(_dv, GAME_W / 2, GAME_H * 0.553 + (1 - dv) * 10);
    }
    // T238 幕四：点击提示（0.615H）—— 两侧金线先自中心生长，线成后文字淡入
    this.drawRestartTip(GAME_H * 0.615, '点击任意位置重新开始');
    // PHASE 3 无尽回响：主线通关后的「继续深入」入口（幕四最末浮入，见 drawEchoButton）
    this.drawEchoButton();
    super.draw();
  }
  // T238 幕四：点击提示 —— 两侧金线自中心向外生长（95f 起 14f），线成后文字淡入（109f 起）
  drawRestartTip(y, label, colorName) {
    const lineT = this._cue(95, 14);
    const textT = this._cue(109, 14);
    if (lineT <= 0 && textT <= 0) return;
    push();
    textAlign(CENTER, CENTER);
    textSize(16);
    textStyle(NORMAL);
    noStroke();
    const tw = textWidth(label);
    const gap = 16, len = 130;
    if (lineT > 0) {
      cStroke('goldDim', Math.floor(200 * lineT));
      strokeWeight(1);
      const lInner = GAME_W / 2 - tw / 2 - gap;
      const rInner = GAME_W / 2 + tw / 2 + gap;
      line(lInner - len * lineT, y, lInner, y);
      line(rInner, y, rInner + len * lineT, y);
    }
    if (textT > 0) {
      noStroke();
      cFill(colorName || 'text', Math.floor(255 * textT));
      text(label, GAME_W / 2, y + 1);
    }
    pop();
  }
  // 按钮几何：T238 下移至 0.735H（三带布局的行动带），热区随视觉同步
  echoBtnRect() {
    const w = 300, h = 46;
    return { x: GAME_W / 2 - w / 2, y: GAME_H * 0.735, w, h };
  }
  // T237：视觉语言对齐标题页「进入深渊」按钮（L5817 区成熟范式）——
  //   暗金描边 + panel 暗底 + gold 文字；hover 翻转为 goldBright 金底黑字；黑色偏移投影。
  //   原纯紫实心块废弃；"无尽回响"的紫色语义仅保留为副标题前一枚 ◈（面积 <1%，不破坏金系统一性）。
  drawEchoButton() {
    // T238 幕四：提示文字入场 12f 后（121f 起）按钮上浮 10px + 淡入；未到时刻整块不绘制
    const ce = this._easeOut(this._cue(121, 18));
    if (ce <= 0) return;
    const sa = Math.floor(255 * ce);
    const yOff = Math.round((1 - ce) * 10);
    const r = this.echoBtnRect();
    r.y += yOff;
    const hover = mx() >= r.x && mx() <= r.x + r.w && my() >= r.y && my() <= r.y + r.h;
    push();
    // ① 黑色偏移投影（同「进入深渊」：x-2/y+2、外扩 4px、圆角 8）
    fill(0, Math.floor(120 * sa / 255));
    noStroke();
    rect(r.x - 2, r.y + 2, r.w + 4, r.h + 4, 8);
    // ② 主体：默认 panel 底 + goldDim 描边；hover 金底 + gold 描边
    if (hover) { cFill('goldBright', sa); cStroke('gold', sa); }
    else       { cFill('panel', sa);      cStroke('goldDim', sa); }
    strokeWeight(2);
    rect(r.x, r.y, r.w, r.h, 8);
    // ③ 默认态暗金描边上叠极轻金色呼吸（0.04 慢频，alpha 15%→40%），延续旧按钮"下面还有东西"的暗示；
    //    hover 时取消呼吸直接全亮
    if (!hover) {
      const breath = 0.5 + 0.5 * Math.sin((this.time || 0) * 0.04);
      noFill();
      cStroke('gold', Math.floor(sa * (0.15 + breath * 0.25)));
      strokeWeight(2);
      rect(r.x, r.y, r.w, r.h, 8);
    }
    // ④ 文字：默认 gold / hover 黑字（反色范式），18 号 BOLD 与「进入深渊」同级
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(18);
    textStyle(BOLD);
    if (hover) fill(0, sa); else cFill('gold', sa);
    text('继续深入 · 无尽回响', r.x + r.w / 2, r.y + r.h / 2 + 1);
    // ⑤ 副标题：◈ 紫点保留回响模式语义身份，正文仍为 textDim 暗灰；LEFT 对齐拼组严格居中
    textSize(12);
    textStyle(NORMAL);
    textAlign(LEFT, CENTER);
    const _sub = '层数无限 · 越深越强 · 直到陨落';
    const _glyph = '◈ ';
    const _gW = textWidth(_glyph);
    const _totalW = _gW + textWidth(_sub);
    cFill('purpleBright', Math.floor(sa * 0.75));
    text(_glyph, GAME_W / 2 - _totalW / 2, r.y + r.h + 14);
    cFill('textDim', Math.floor(sa * 0.85));
    text(_sub, GAME_W / 2 - _totalW / 2 + _gW, r.y + r.h + 14);
    pop();
  }
  mousePressed() {
    // T238：开场 90f（1.5s）演出期屏蔽一切点击，防误触跳过/重开
    if (this.time < 90) return;
    // 命中「继续深入」→ 进入无尽回响（按钮 121f 才入场，不可见时热区不启用）；否则点击任意位置重新开始
    try {
      if (this.time >= 121) {
        const r = this.echoBtnRect();
        if (mx() >= r.x && mx() <= r.x + r.w && my() >= r.y && my() <= r.y + r.h) {
          this.continueEcho();
          return;
        }
      }
    } catch (e) {}
    gs.reset(); gs.scene = 'title';
  }
  // 继续深入：区域 +1、层号归零、地图置空（MapScene.enter 会按新 region 重新生成）。
  //   ⚠️ 难度不用手动加 —— applyDifficultyToEnemy 会按新的深度自动套用 echoMulNow()。
  continueEcho() {
    gs.endlessEcho = true;
    gs.currentRegion = (gs.currentRegion || 0) + 1;
    gs.currentLayer = 0;
    gs.currentNodeId = null;
    gs.mapData = null;
    gs.mapPath = [];
    gs.floorNumber = (gs.floorNumber || 0) + 1;
    gs.regionTransition = { active: true, timer: 240, region: gs.currentRegion };
    logSdk('info', 'echo:continue', { region: gs.currentRegion, depth: echoDepthNow() });
    gs.scene = 'map';
  }
}

class DefeatScene extends Scene {
  enter() {
    super.enter();
    audio.stopBGM();
    this.time = 0; // T238：分幕时间轴
    this.tiltX = 0; this.tiltY = 0; // 鼠标移轴连轴
    this.titleY = -100; // T238 幕一：砸落起点（画面外上方）
    this.titleTargetY = GAME_H * 0.24; // T238：LOST 200 号更大，标题带压到 0.24 与文案带隔离
    // AI 墓志铭：异步获取，未返回前界面不占位；AI 关闭时直接用本地预制句（零调用）
    this.aiEulogy = null;
    this.eulogyAt = null; // T238：墓志铭到达时刻（晚到则按到达时起播浮入）
    this.requestAiEulogy();
  }
  // T238：以下四个分幕辅助与 VictoryScene 同构（语义见胜利页注释）
  _markEulogy() { if (this.eulogyAt == null) this.eulogyAt = this.time || 0; }
  _backEase(t) { const c = 0.55; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  _cue(at, dur) { return constrain((this.time - at) / dur, 0, 1); }
  _easeOut(t) { return 1 - (1 - t) * (1 - t); }
  // 为这局冒险求一句墓志铭。失败/关闭/未授权一律回落本地句子，界面不等待、不卡死。
  async requestAiEulogy() {
    // 一局终了：记结果快照（陨落层数是调整难度曲线最有用的数据）
    logSdk('info', 'run:end', {
      result: 'defeat', floor: gs.floorNumber || 0, region: gs.currentRegion,
      difficulty: gs.difficulty, gold: gs.gold, deckSize: gs.deck ? gs.deck.length : 0,
      codexTotal: (typeof CODEX_SYS !== 'undefined') ? CODEX_SYS._total : 0,
      codexNewThisRun: (typeof CODEX_SYS !== 'undefined') ? (CODEX_SYS._newThisRun || 0) : 0,
    });
    codexFlush();   // PHASE 1：局终强制落盘（阵亡也要保住本局发现）
    memoryEndRun('death');     // PHASE 4：阵亡也要记账 —— 陨落次数正是"深渊记得你"的素材
    const local = () => aiPickLocal('eulogy', (gs.floorNumber || 0) + (gs.gold || 0));
    if (!aiSys.enabled) { this.aiEulogy = local(); this._markEulogy(); return; }   // 红灯：零调用
    const ctx = `楼层=${gs.floorNumber || 0} 金币=${gs.gold} 卡组=${gs.deck ? gs.deck.length : 0}张 难度=${getDifficulty().name} 结局=陨落`;
    const r = await aiRequest('eulogy', aiMessages(AI_SYS_PROMPT.eulogy, ctx), local);
    this.aiEulogy = String(r.text || local()).slice(0, 40);    // 限长，防止长文本撑破排版
    this._eulogyFromAi = !!(r && r.fromAi);                     // 供样式统一层决定中金/暗金
    this._markEulogy();
    // PHASE 2：同通关分支 —— 排在墓志铭之后，让可见内容优先取用额度
    namerFlush(true);
  }
  update() {
    super.update();
    // T203：牌库查看器打开时暂停 DefeatScene 更新（标题动画/红色脉冲/失败统计动画）
    if (gs.showDeckViewer) return;
    this.time++;
    // T238 幕一（0–32f）：easeOutBack 砸落（失败页同样的活字着地，沉一点）
    const _tt = constrain(this.time / 32, 0, 1);
    this.titleY = -100 + (this.titleTargetY + 100) * this._backEase(_tt);
    // 鼠标移轴视差（同开始页）
    let targetTiltX = (mx() - GAME_W / 2) / (GAME_W / 2) * 30;
    let targetTiltY = (my() - GAME_H / 2) / (GAME_H / 2) * 30;
    this.tiltX = lerp(this.tiltX, targetTiltX, 0.08);
    this.tiltY = lerp(this.tiltY, targetTiltY, 0.08);
  }
  draw() {
    abyssVeil();
    // T203：牌库查看器打开时仅 super.draw()，跳过 LOST 红色 8 层堆叠/连轴视差/红色脉冲呼吸等重渲染
    if (gs.showDeckViewer) { super.draw(); return; }
    // 主标题 LOST —— 纯红色 8 层堆叠 + 连轴视差 + 大幅红色脉冲呼吸 + 入场下移动画
    push();
    translate(GAME_W / 2, this.titleY);
    noStroke();
    textAlign(CENTER, CENTER);
    textStyle(BOLD);
    // 步骤 1：底层接地阴影（视觉锚点）—— T238 幕二：随砸落沉地由虚到实
    cFill('bg', Math.floor(120 + 80 * constrain(this.time / 32, 0, 1)));
    textSize(200);
    text('LOST', 10, 16);
    // 步骤 2：8 层偏移堆叠（纯红色梯度）+ 鼠标连轴视差
    for (let i = 8; i >= 1; i--) {
      let depthFactor = (9 - i) / 8;
      let baseOff = i * 3;
      let layerTiltX = this.tiltX * depthFactor;
      let layerTiltY = this.tiltY * depthFactor;
      if (i >= 7)       cFill('red');          // 底层：COLORS.red
      else if (i >= 5)  cFill('red');          // 中间：COLORS.red
      else if (i >= 3)  cFill('redBright');    // 较上：COLORS.redBright
      else              cFill('redBright');    // 顶层：COLORS.redBright
      textSize(200);
      text('LOST', baseOff + layerTiltX, baseOff + layerTiltY);
    }
    // 步骤 3：顶层核心高亮（纯红色 + 正弦大幅脉冲 alpha 呼吸，效果显著）
    let pulseAlpha = 180 + Math.sin(frameCount * 0.08) * 75; // 105 → 255 大幅波动
    //   T238 幕二·红闪：落位瞬间红色辉光 36→8 衰减（镜像胜利页金闪，色相换 redBright）
    const dc = drawingContext;
    if (!this._redGlow) {
      const rc = color(COLORS.redBright);
      this._redGlow = `rgba(${rc.levels[0]},${rc.levels[1]},${rc.levels[2]},0.9)`;
    }
    let glow;
    if (this.time < 32) glow = 36;
    else if (this.time < 52) glow = 8 + 28 * Math.pow(1 - (this.time - 32) / 20, 3);
    else glow = 8 + 2 * Math.sin((this.time - 52) * 0.02);
    dc.shadowBlur = glow;
    dc.shadowColor = this._redGlow;
    cFill('redBright', Math.floor(Math.max(30, Math.min(255, pulseAlpha))));
    textSize(200);
    text('LOST', this.tiltX, this.tiltY);
    dc.shadowBlur = 0;
    pop();
    // T242：战报 —— 失败页最需要回答"我怎么就没了"，所以数据行排在墓志铭之上（0.375H）；
    //   判因行点名凶手与最后一击（0.375H+27px），墓志铭随后（0.45H）才浮入。
    drawRunRecap(GAME_H * 0.375, {
      dataT: this._cue(34, 20), whyT: this._cue(48, 18),
      tone: 'red', win: false, whyGap: 27,
    });
    // T238 幕三：AI 墓志铭 0.45H 上浮淡入（T242：原 0.42H，下移让位战报）；晚到按到达时起播
    if (this.aiEulogy) {
      const ec = this._easeOut(this._cue(Math.max(50, this.eulogyAt || 0), 18));
      drawAiLine(this.aiEulogy, GAME_W / 2, GAME_H * 0.45 + (1 - ec) * 10,
        { fromAi: this._eulogyFromAi, size: 15, alpha: Math.floor(255 * 0.95 * ec) });
    }
    // PHASE 3 无尽回响：陨落在回响层时，告诉玩家究竟走到了多深。
    //   主线陨落刻意不显示 —— 多一行无关信息只会稀释原有的失败演出。
    if (typeof echoTierNow === 'function' && echoTierNow() > 0) {
      const dp = this._easeOut(this._cue(66, 18));
      cFill('purpleBright', Math.floor(255 * 0.92 * dp));
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      textStyle(NORMAL);
      text(`你抵达了 ${echoDepthLabel()} · 最深 ${gs.maxDepth || 0}`,
        GAME_W / 2, GAME_H * 0.495 + (1 - dp) * 10);
    }
    const _dl = (typeof driftLine === 'function') ? driftLine : null;
    // T238 幕四：点击提示 0.55H（金线生长 + 文字淡入）· 主题「飘」：把「重新开始」说成「再飘一次」。
    //   这是玩家每次陨落必读的一行，也是全游戏曝光最高的句子，值得为它点一次题。
    //   again 文案自带的破折号剥除（两侧金线已承担分隔），缺失时回落通用句。
    const _again = _dl
      ? String(_dl('again') || '点击任意位置重新开始').replace(/^[—\-·\s]+|[—\-·\s]+$/g, '')
      : '点击任意位置重新开始';
    this.drawRestartTip(GAME_H * 0.55, _again, 'textDim');
    // 主题「飘」：陨落不是终止 —— 你像一页手稿被烧成灰烬，飘回深渊之上。与开局浮句闭环。
    //   T238：0.61H，提示线成后最后浮入，仍是全页最安静的角落。
    if (_dl && _dl('defeat')) {
      const df = this._easeOut(this._cue(137, 18));
      cFill('goldDim', Math.floor(255 * 0.8 * df));
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(13);
      textStyle(NORMAL);
      text(_dl('defeat'), GAME_W / 2, GAME_H * 0.61 + (1 - df) * 10);
    }
    super.draw();
  }
  // T238 幕四：点击提示（与胜利页同构，文字保持 textDim 暗色，失败页不喧哗）
  drawRestartTip(y, label, colorName) {
    const lineT = this._cue(95, 14);
    const textT = this._cue(109, 14);
    if (lineT <= 0 && textT <= 0) return;
    push();
    textAlign(CENTER, CENTER);
    textSize(16);
    textStyle(NORMAL);
    noStroke();
    const tw = textWidth(label);
    const gap = 16, len = 130;
    if (lineT > 0) {
      cStroke('goldDim', Math.floor(200 * lineT));
      strokeWeight(1);
      const lInner = GAME_W / 2 - tw / 2 - gap;
      const rInner = GAME_W / 2 + tw / 2 + gap;
      line(lInner - len * lineT, y, lInner, y);
      line(rInner, y, rInner + len * lineT, y);
    }
    if (textT > 0) {
      noStroke();
      cFill(colorName || 'textDim', Math.floor(255 * textT));
      text(label, GAME_W / 2, y + 1);
    }
    pop();
  }
  mousePressed() {
    // T238：开场 90f（1.5s）演出期屏蔽点击，防误触重开
    if (this.time < 90) return;
    gs.reset(); gs.scene = 'title';
  }
}

// ==================== p5.js 主程序 ====================
let scenes = null;        // 场景表（setup() 内创建）。此前缺声明 → 隐式全局：非严格模式能跑，严格模式/打包压缩下会 ReferenceError。
let currentScene = null;
// ============================================================
//  3D 深渊引擎 · ABYSS ENGINE
//  架构：独立 p5 实例（WEBGL）渲染于 2D 游戏画布之后（z-index:0）
//        2D 画布透明化 → 3D 深渊透过 UI 显现；场景/战斗状态驱动主题色
//        与能量；视听即叙事——每个效果服务一个情感节拍。
//  组成：①自定义 GLSL 大气着色器（雾/光轴/暗角/颗粒/场景色）
//        ②3D 漂浮光尘（加法混合、深度视差）
//        ③远景巨柱（深度参照、冒险空间感）
//        ④鼠标视差相机（环顾深渊的沉浸）
//        ⑤战斗脉冲（采样 screenShake，受击瞬间辉光涌动）
//        ⑥CSS 后处理覆盖层（暗角/扫描线/电影画框）
// ============================================================

// ---- 主题色表：每个场景对应一组深渊色（深处/雾色/辉光 + 能量值） ----
// 取意：title 神秘紫·map 探索青·battle 紧张赤·victory 暖金·defeat 暗红系
const ABYSS_THEMES = {
  title:      { deep:[6,4,16],   mid:[28,16,46],  glow:[150,96,210], energy:0.45 },
  map:        { deep:[4,12,18],  mid:[16,46,52],  glow:[80,200,180], energy:0.60 },
  battle:     { deep:[18,4,8],   mid:[60,16,22],  glow:[255,96,64],  energy:1.00 },
  shop:       { deep:[16,10,4],  mid:[52,34,16],  glow:[230,170,70], energy:0.55 },
  event:      { deep:[12,6,16],  mid:[44,22,52],  glow:[200,110,210],energy:0.55 },
  rest:       { deep:[6,10,18],  mid:[20,40,60],  glow:[120,180,230],energy:0.40 },
  artisan:    { deep:[10,8,4],   mid:[40,30,16],  glow:[220,150,80], energy:0.50 },
  treasure:   { deep:[12,10,4],  mid:[52,40,16],  glow:[255,210,90], energy:0.70 },
  remove_card:{ deep:[10,6,10],  mid:[40,22,30],  glow:[210,120,150],energy:0.50 },
  victory:    { deep:[16,12,4],  mid:[60,46,16],  glow:[255,224,140],energy:0.90 },
  defeat:     { deep:[12,4,4],   mid:[40,14,14],  glow:[180,90,90], energy:0.30 },
};
const ABYSS_THEME_DEFAULT = ABYSS_THEMES.title;

class AbyssEngine {
  constructor() {
    this.started = false;
    this.p = null;
    this.sh = null;          // 大气着色器
    this.motes = [];         // 漂浮光尘池
    this.pillars = [];       // 远景巨柱
    this.reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    // 主题平滑插值（避免场景切换时色彩跳变）
    this.cur = JSON.parse(JSON.stringify(ABYSS_THEME_DEFAULT));
    this.tgt = this.cur;
    this.mx = 0; this.my = 0;        // 鼠标视差 -1..1（平滑后）
    this.pulse = 0;                  // 战斗脉冲 0..1
    this.fly = 0;                    // 场景切换飞掠 0..1（衰减）
    this.lastFlyAt = 0;              // 飞掠探针时间戳（不衰减，供端到端验证）
    this.boss = 0;                   // Boss 战色相剧变 0..1（平滑）
    this.time = 0; this.lastT = 0;
    this.quality = 1;                // 1=高 0.5=低（帧率自适应降级）
    this.frameTimes = [];
    this.ambCounter = 0;             // 氛围层节流计数
    this._lastScene = null;          // 上一场景名（用于检测切换路径并调整插值速度）
    this._fastSwitch = 0;            // 快速切换加速标志 0..1（battle→defeat/victory 时趋 1）
    // T201：光尘渲染开关——升级/删牌场景（卡牌密集+悬停阻尼）下临时中止光尘 update+draw，缓解卡顿
    // T202 重构：弃用 flythrough 缓存的 motesEnabled 字段（ArtisanScene.phase 在 main ↔ upgrade_select 切换时不会触发 flythrough）
    // 改为每帧实时计算 _isHeavyScene()——细粒度判定"卡牌密集子阶段"
    this.motesEnabled = true;        // 保留字段作为默认值（safety 兜底），实际由 _isHeavyScene() 每帧覆盖
  }
  // T202：每帧实时判定"是否处于卡牌密集子阶段"——决定光尘 update+draw 是否执行
  // - gs.scene === 'artisan'：仅在 phase === 'upgrade_select' 或 'remove_select' 时才算 heavy
  //   （phase === 'main' 是 2 按钮着陆页，轻量，光尘保留以营造氛围）
  // - gs.scene === 'remove_card'：RemoveCardScene 始终是卡牌网格（无 phase 概念），直接算 heavy
  // - 其他场景：motes 正常渲染
  _isHeavyScene() {
    try {
      if (typeof gs === 'undefined' || !gs) return false;
      if (gs.scene === 'remove_card') return true;  // RemoveCardScene 永远 heavy
      if (gs.scene === 'artisan') {
        // ArtisanScene 有 3 个 phase：main（轻量）/ upgrade_select（heavy）/ remove_select（heavy）
        const phase = (typeof currentScene !== 'undefined' && currentScene) ? currentScene.phase : null;
        return phase === 'upgrade_select' || phase === 'remove_select';
      }
      return false;
    } catch (e) { return false; }
  }
  // 场景切换时调用：触发一次相机飞掠（缩放+闪光+雾加速），约 0.7s 衰减
  // lastFlyAt 为不衰减探针时间戳，供端到端验证 draw() 确实在场景切换时调用了本方法
  flythrough(sceneName) {
    // 场景切换路径检测：结局/战斗切换应加速色调插值，避免长时间"上一场景色+下一场景UI"的跳变观感
    const prev = this._lastScene;
    this._lastScene = sceneName || null;
    const fastPaths = [
      ['battle','victory'], ['battle','defeat'],
      ['victory','title'], ['defeat','title'],
      ['title','map'], ['map','battle'],
    ];
    let isFast = false;
    for (let p of fastPaths) {
      if (p[0] === prev && p[1] === sceneName) { isFast = true; break; }
    }
    this._fastSwitchTarget = isFast ? 1 : 0;
    this.fly = 1;
    this.lastFlyAt = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    // T202：删除原 T201 flythrough 缓存的 motesEnabled——motesEnabled 现在由 _isHeavyScene() 每帧实时计算
    // 原因：ArtisanScene.phase 在 main ↔ upgrade_select 切换时不会触发 flythrough，
    //       flythrough 缓存无法捕获 phase 变化导致"着陆页光尘被误停"
  }

  start() {
    if (this.started) return;
    this.started = true;
    const self = this;
    // 独立 p5 实例：WEBGL，画布置于 2D 游戏画布之后
    new p5((p) => {
      p.setup = () => self._setup(p);
      p.draw = () => self._draw(p);
      p.windowResized = () => { p.resizeCanvas(window.innerWidth, window.innerHeight); };
    });
  }

  _setup(p) {
    this.p = p;
    // preserveDrawingBuffer：让 Bloom 合成层可经 drawImage 读取本 WEBGL 画布（否则读回为空）
    try { p.setAttributes('preserveDrawingBuffer', true); } catch(e){}
    const c = p.createCanvas(window.innerWidth, window.innerHeight, p.WEBGL);
    // 层级：深渊位于最底层，且不拦截指针（交互全部归 2D 游戏画布）
    c.elt.style.position = 'absolute';
    c.elt.style.left = '0'; c.elt.style.top = '0';
    c.elt.style.zIndex = '0';
    c.elt.style.background = '#06060c';
    c.elt.style.pointerEvents = 'none';
    p.pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
    // 关闭深度测试：背景为 2.5D 分层，靠绘制顺序（面→柱→尘）即可，避免 z-fighting
    p.drawingContext.disable(p.drawingContext.DEPTH_TEST);
    this.sh = this._buildShader(p);
    this._initMotes(p);
    this._initPillars(p);
    p.noStroke();
  }

  // 电影级深渊大气着色器：体积雾 + 顶部光轴 + 场景色调 + 暗角 + 颗粒
  _buildShader(p) {
    const vert = `
      precision highp float;
      attribute vec3 aPosition;
      attribute vec2 aTexCoord;
      uniform mat4 uProjectionMatrix;
      uniform mat4 uModelViewMatrix;
      varying vec2 vTexCoord;
      void main(){
        vTexCoord = aTexCoord;
        gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
      }`;
    const frag = `
      precision highp float;
      varying vec2 vTexCoord;
      uniform float uTime;
      uniform vec2  uResolution;
      uniform vec2  uMouse;        // 视差 -1..1
      uniform vec3  uDeep;
      uniform vec3  uMid;
      uniform vec3  uGlow;
      uniform float uEnergy;
      uniform float uPulse;
      uniform float uVignette;
      uniform float uFly;          // 场景切换飞掠 0..1
      uniform float uBoss;         // Boss 战色相剧变 0..1

      float hash(vec2 q){ return fract(sin(dot(q, vec2(127.1,311.7)))*43758.5453123); }
      float noise(vec2 q){
        vec2 i=floor(q), f=fract(q);
        vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),
                   mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x), u.y);
      }
      float fbm(vec2 q){
        float v=0.0, a=0.5;
        for(int i=0;i<5;i++){ v+=a*noise(q); q*=2.02; a*=0.5; }
        return v;
      }
      // 色相旋转（Rodrigues 绕灰轴 (0.577) 旋转）：Boss 战深渊色相剧变
      vec3 hueShift(vec3 c, float h){
        vec3 k = vec3(0.57735);
        float ca = cos(h), sa = sin(h);
        return c*ca + cross(k,c)*sa + k*dot(k,c)*(1.0-ca);
      }
      void main(){
        vec2 uv = vTexCoord;
        // 飞掠：UV 向中心缩放（推镜感），衰减回正
        uv = 0.5 + (uv-0.5)*(1.0 + uFly*0.14);
        float ar = uResolution.x/uResolution.y;
        vec2 p = (uv-0.5); p.x *= ar;
        p += uMouse*0.05;                         // 视差：采样坐标随鼠标偏移

        // 顶部体积光轴（放射状，随时间缓动；飞掠/Boss 时光轴加速涌动）
        vec2 rp = uv - vec2(0.5 + uMouse.x*0.08, -0.05);
        float ang = atan(rp.y, rp.x);
        float rays = 0.0;
        float t = uTime*(0.04 + uFly*0.25 + uBoss*0.08);
        for(int i=0;i<6;i++){
          float a = ang + float(i)*1.0471975;
          float r = abs(sin(a*3.0 + t + float(i)*0.7));
          rays += pow(r, 7.0);
        }
        rays *= smoothstep(0.9, 0.0, length(rp)*1.25);

        // 双层漂流雾（飞掠时雾加速漂移，营造穿越感）
        float fog = fbm(p*2.8 + vec2(uTime*(0.018+uFly*0.12), uTime*0.012));
        fog = pow(fog, 1.4);
        float fog2 = fbm(p*5.5 - vec2(uTime*(0.025+uFly*0.10), -uTime*0.01));

        // 垂直深度：顶辉光 → 底深渊
        float depth = clamp(uv.y, 0.0, 1.0);
        vec3 col = mix(uGlow*0.35, uDeep, depth);
        col = mix(col, uMid, fog*0.65);
        col += uGlow * rays * (0.35 + uPulse*1.6 + uBoss*0.5) * 0.55;  // 光轴随脉冲/Boss 增强
        col += uGlow * fog2 * 0.10 * (0.4+uEnergy+uBoss*0.3);          // 雾中微光
        col *= 0.55 + 0.45*fog;                              // 远景压暗
        col += uGlow * uPulse * 0.28;                        // 受击辉光涌动
        col += uGlow * uEnergy * 0.02;
        // 飞掠闪光：切换瞬间整体辉光涌动
        col += uGlow * uFly * 0.22;

        // Boss 色相剧变：色相随时间旋转 + 色差（RGB 通道微小偏移）
        if (uBoss > 0.001) {
          col = hueShift(col, uTime*0.55 + uBoss*1.2);
          col += uGlow * 0.06 * uBoss;                        // Boss 辉光增强
        }

        float vig = smoothstep(1.05, 0.25, length((uv-0.5)*vec2(1.15,1.0)));
        col *= mix(1.0, vig, uVignette + uFly*0.1);           // 飞掠时暗角微收
        col += (hash(uv*uResolution + uTime)-0.5)*0.045;     // 颗粒
        gl_FragColor = vec4(col, 1.0);
      }`;
    try { return p.createShader(vert, frag); }
    catch(e) { console.warn('[Abyss] shader build failed, fallback', e); return null; }
  }

  _initMotes(p) {
    const N = this.reducedMotion ? 60 : 200;
    this.motes = [];
    for (let i=0;i<N;i++){
      this.motes.push({
        x: p.random(-1,1), y: p.random(-1,1), z: p.random(-1,1),
        vx: p.random(-0.02,0.02), vy: p.random(-0.03,-0.005), vz: p.random(-0.01,0.01),
        s: p.random(2,7), ph: p.random(0,Math.PI*2),
      });
    }
  }
  _initPillars(p) {
    const N = this.reducedMotion ? 4 : 9;
    this.pillars = [];
    for (let i=0;i<N;i++){
      this.pillars.push({
        x: p.random(-0.9,0.9), yo: p.random(-50,50),
        w: p.random(40,90), h: p.random(360,720), d: p.random(40,90),
        a: p.random(0,Math.PI*2),
      });
    }
  }

  _update(p) {
    const now = p.millis();
    let dt = now - this.lastT; this.lastT = now;
    if (!(dt >= 0) || dt > 80) dt = 16.6;
    this.time += dt/1000;

    // 目标主题（gs 就绪后按场景，否则缺省）
    let tgt = ABYSS_THEME_DEFAULT;
    try { if (typeof gs !== 'undefined' && gs && ABYSS_THEMES[gs.scene]) tgt = ABYSS_THEMES[gs.scene]; } catch(e){}
    this.tgt = tgt;
    // 快速切换加速平滑：_fastSwitch 在快速路径（battle→结局等）下趋 1，
    // 将插值基础速率 0.92 → 最高 0.5（约 2× 加速），避免"旧色调 + 新UI"持续 2-3 秒的跳变感
    this._fastSwitch += ((this._fastSwitchTarget || 0) - this._fastSwitch) * 0.1;
    const baseSpeed = 0.92 - this._fastSwitch * 0.42; // 0.92 → 0.50（快路径加速）
    const k = 1 - Math.pow(Math.max(0.1, baseSpeed), dt/16.6);
    for (let key of ['deep','mid','glow']) {
      for (let i=0;i<3;i++) this.cur[key][i] += (this.tgt[key][i]-this.cur[key][i])*k;
    }
    this.cur.energy += (this.tgt.energy - this.cur.energy)*k;

    // 鼠标视差
    let nx=0, ny=0;
    try {
      nx = (window.mouseX/window.innerWidth)*2-1;
      ny = (window.mouseY/window.innerHeight)*2-1;
    } catch(e){}
    if (this.reducedMotion) { nx*=0.3; ny*=0.3; }
    this.mx += (nx - this.mx)*k;
    this.my += (ny - this.my)*k;

    // 战斗脉冲：采样全局 screenShake 强度（受击瞬间升高，自然衰减）
    let shake = 0;
    try { if (typeof screenShake !== 'undefined' && screenShake) shake = screenShake.intensity || 0; } catch(e){}
    const targetPulse = Math.min(1, shake/14);
    this.pulse += (targetPulse - this.pulse)*(k*1.5);

    // 场景切换飞掠衰减（flythrough() 置 1 后向 0 平滑回归，~0.7s 可见）
    this.fly += (0 - this.fly) * (k * 1.0);
    if (this.fly < 0.001) this.fly = 0;

    // Boss 战色相剧变检测：战斗中且当前敌人模板 isBoss → boss 平滑趋 1，否则趋 0
    let bossNow = false;
    try {
      if (typeof gs !== 'undefined' && gs && gs.scene === 'battle' && gs.combatState &&
          gs.combatState.enemyData && gs.combatState.enemyData.isBoss) bossNow = true;
    } catch(e){}
    this.boss += ((bossNow ? 1 : 0) - this.boss) * (k * 1.2);

    // 帧率自适应降级（avg>26ms → 降级，保留情感核心：着色器与光尘）
    this.frameTimes.push(dt);
    if (this.frameTimes.length > 40) this.frameTimes.shift();
    if (this.frameTimes.length === 40 && this.quality > 0.5) {
      const avg = this.frameTimes.reduce((a,b)=>a+b,0)/40;
      if (avg > 26) this.quality = 0.5;
    }

    // 氛围 drone 节流（每 ~0.5s 调一次，避免反复重启 ramp）
    if (++this.ambCounter >= 30) {
      this.ambCounter = 0;
      try { if (typeof audio !== 'undefined' && audio && audio.initialized && audio.setAmbientIntensity) audio.setAmbientIntensity(this.cur.energy); } catch(e){}
    }

    // 光尘漂流更新
    // T202：每帧调用 _isHeavyScene() 判定（细粒度：artisan phase 变化时也能正确响应）
    //   heavy 时跳过 update（200 颗位置/速度/边界计算全部省掉，artisan 升级/删牌 phase 省 ~0.2-0.4ms/帧）
    if (!this._isHeavyScene()) {
      const drift = this.reducedMotion ? 0.3 : 1;
      for (let m of this.motes) {
        m.x += m.vx*dt/16.6*drift; m.y += m.vy*dt/16.6*drift; m.z += m.vz*dt/16.6*drift;
        if (m.y < -1.05) { m.y = 1.05; m.x = p.random(-1,1); }
        if (m.x < -1.1) m.x = 1.1; if (m.x > 1.1) m.x = -1.1;
      }
    }
  }

  _draw(p) {
    p.clear();
    p.drawingContext.disable(p.drawingContext.DEPTH_TEST); // 每帧确保关闭
    this._update(p);
    const W = p.width, H = p.height;
    const sc = Math.min(W, H)/720;   // 以 720 为基准缩放，跨分辨率一致

    // ---- ① 大气着色器全屏 pass ----
    if (this.sh) {
      try {
        p.shader(this.sh);
        this.sh.setUniform('uTime', this.time);
        this.sh.setUniform('uResolution', [W, H]);
        this.sh.setUniform('uMouse', [this.mx, this.my]);
        this.sh.setUniform('uDeep', [this.cur.deep[0]/255, this.cur.deep[1]/255, this.cur.deep[2]/255]);
        this.sh.setUniform('uMid',  [this.cur.mid[0]/255,  this.cur.mid[1]/255,  this.cur.mid[2]/255]);
        this.sh.setUniform('uGlow', [this.cur.glow[0]/255, this.cur.glow[1]/255, this.cur.glow[2]/255]);
        this.sh.setUniform('uEnergy', this.cur.energy);
        this.sh.setUniform('uPulse', this.pulse);
        this.sh.setUniform('uVignette', 0.85);
        this.sh.setUniform('uFly', this.fly);
        this.sh.setUniform('uBoss', this.boss);
        p.push();
        p.noStroke();
        p.plane(W*1.06, H*1.06);     // 略大于屏幕，覆盖视差边缘
        p.pop();
        p.resetShader();
      } catch(e) { p.background(6,6,12); }
    } else {
      p.background(this.cur.deep[0], this.cur.deep[1], this.cur.deep[2]);
    }

    // ---- ② 远景巨柱（深度参照，弱饱和暗剪影） ----
    p.push();
    p.translate(this.mx*8, 0, 0);   // 随鼠标轻微视差（T173：远景视差应最小，原 mx*30 过大破坏深度层级感，调至 mx*8）
    p.noStroke();
    const dim = 0.16 + 0.12*this.cur.energy;
    p.fill(this.cur.mid[0]*dim, this.cur.mid[1]*dim, this.cur.mid[2]*dim, 225);
    for (let pi of this.pillars) {
      p.push();
      p.translate(pi.x*W*0.5, H*0.15 + pi.yo, 0);
      p.rotateY(pi.a + this.time*0.015);
      p.box(pi.w*sc, pi.h*sc, pi.d*sc);
      p.pop();
    }
    p.pop();

    // ---- ③ 漂浮光尘（加法混合，越近越大越亮；鼠标视差近大远小） ----
    // T202：每帧调用 _isHeavyScene() 判定（细粒度：artisan phase 变化时也能正确响应）
    //   heavy 时整段跳过（additive blend + 200 次 push/translate/fill/ellipse 全部省掉）
    if (!this._isHeavyScene()) {
      p.push();
      p.blendMode(p.ADD);
      p.noStroke();
      const motesN = this.quality > 0.5 ? this.motes.length : Math.floor(this.motes.length*0.5);
      for (let i=0;i<motesN;i++){
        const m = this.motes[i];
        const depthFactor = 0.5 + m.z*0.5;            // 近(m.z=1)→1 远(m.z=-1)→0
        const px = (m.x + this.mx*0.4*depthFactor) * W*0.5;
        const py = (m.y + this.my*0.25*depthFactor) * H*0.5;
        const tw = 0.55 + 0.45*Math.sin(this.time*1.3 + m.ph);
        const size = m.s * sc * (0.6 + depthFactor) * tw;
        const a = (60 + 130*tw) * (0.5 + this.cur.energy*0.5);
        p.push();
        p.translate(px, py, 0);
        p.fill(this.cur.glow[0], this.cur.glow[1], this.cur.glow[2], Math.min(255, a));
        p.ellipse(0, 0, Math.max(1, size), Math.max(1, size));
        p.pop();
      }
      p.blendMode(p.BLEND);
      p.pop();
    }
  }
}

// 全局实例（setup 中启动）
let abyss = null;

// ---- 透明纱帘：替代各场景不透明 background()，让 3D 深渊透出 ----
// clear() 透明清屏 + 半透明暗色纱帘 → 比不透明 background 多出"深渊在 UI 之后流动"的纵深
function abyssVeil(alpha) {
  clear();
  noStroke();
  fill(8, 8, 14, alpha == null ? 205 : alpha);
  rect(0, 0, GAME_W, GAME_H);
}

// ---- 后处理覆盖层（暗角/扫描线/电影画框），纯 CSS，零像素成本 ----
// z-index:3（位于 Bloom 合成层 z2 之上）：Bloom→暗角 的电影后处理顺序
let postFXLayer = null;
function initPostFX() {
  if (postFXLayer) return postFXLayer;
  const div = document.createElement('div');
  div.id = 'postfx-overlay';
  // 暗角（多重 inset 阴影）+ pointer-events:none 不拦截交互
  div.style.cssText = [
    'position:absolute','left:0','top:0','width:100%','height:100%',
    'z-index:3','pointer-events:none','overflow:hidden',
    'box-shadow: inset 0 0 220px 40px rgba(0,0,0,0.85), inset 0 0 80px 10px rgba(0,0,0,0.6)',
  ].join(';');
  // 扫描线层（极淡，胶片质感）
  const scan = document.createElement('div');
  scan.style.cssText = [
    'position:absolute','left:0','top:0','width:100%','height:100%',
    'background:repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 3px)',
    'opacity:0.35','mix-blend-mode:multiply',
  ].join(';');
  div.appendChild(scan);
  // 顶底电影黑边（2.35:1 画框感）
  // T-fix：原 4% 顶部黑边在 720p 窗口约 28.8px，覆盖了非战斗右上角状态栏血条（y=10~30）。
  //   降至 2.5%（≈18px@720p）并配合 drawPlayerInfo PI_Y 下移至 22，确保血条落于黑边安全区之下。
  //   各档窗口验证：720p→血条22px>黑边18px；1080p→33px>27px；800p→24.4px>20px，均留余量。
  const makeBar = (where) => {
    const b = document.createElement('div');
    b.style.cssText = ['position:absolute','left:0','width:100%','height:2.5%','background:#000', where+':0'].join(';');
    return b;
  };
  div.appendChild(makeBar('top'));
  div.appendChild(makeBar('bottom'));
  document.body.appendChild(div);
  postFXLayer = div;
  return div;
}

// ============================================================
//  Bloom 全画布合成层
//  架构：独立 2D 画布（z-index:2，mix-blend-mode:screen），每帧经 drawImage
//        合成"深渊 WEBGL 画布 + 2D 游戏画布"，施加 filter:blur+brightness 提亮模糊，
//        再以 screen 混合叠回主画面 → 真正全画布 Bloom 辉光。
//  健壮性：drawImage 失败/帧率过低 → 自动降级或隐藏，绝不影响游戏运行。
// ============================================================
let bloom = null;
function initBloom() {
  if (bloom) return bloom;
  const cv = document.createElement('canvas');
  cv.id = 'bloom-overlay';
  cv.style.cssText = [
    'position:absolute','left:0','top:0','width:100%','height:100%',
    'z-index:2','pointer-events:none','mix-blend-mode:screen','opacity:0.8',
  ].join(';');
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const state = {
    cv, ctx,
    abyssCv: null,   // WEBGL 深渊画布（z0）
    gameCv: null,    // 2D 游戏画布（z1）
    raf: 0,
    enabled: true,
    scale: 1,        // 内部分辨率缩放（降级时 0.5）
    times: [],
    failCount: 0,
    slider: { cx: 0, cy: 0, r: 42, targetCy: 120, animCy: -100, dragging: false, hover: false },
  };
  // 缓存源画布引用（按 z-index 识别），缺失时每帧重试
  function resolveSources() {
    if (!state.abyssCv || !state.abyssCv.isConnected) {
      state.abyssCv = [...document.querySelectorAll('canvas')].find(c => c.style.zIndex === '0') || null;
    }
    if (!state.gameCv || !state.gameCv.isConnected) {
      state.gameCv = [...document.querySelectorAll('canvas')].find(c => c.style.zIndex === '1') || null;
    }
  }
  function resize() {
    const w = Math.max(1, Math.floor(window.innerWidth * state.scale));
    const h = Math.max(1, Math.floor(window.innerHeight * state.scale));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  }
  function frame() {
    state.raf = requestAnimationFrame(frame);
    if (!state.enabled) return;
    const t0 = performance.now();
    resolveSources();
    resize();
    const w = cv.width, h = cv.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, w, h);
    // 提亮+模糊：强度由 gs.bloomIntensity 控制（0.0 极微 → 1.0 满效果）
    //   blur: 1→6px, brightness: 1.05→1.7, opacity: 0.1→0.8
    let bi = gs ? Math.max(0, Math.min(1, gs.bloomIntensity)) : 0.8;
    let blurPx = (1 + bi * 5) * state.scale;
    let brightVal = 1.05 + bi * 0.65;
    ctx.filter = 'blur(' + blurPx.toFixed(1) + 'px) brightness(' + brightVal.toFixed(2) + ')';
    cv.style.opacity = (0.1 + bi * 0.7).toFixed(2);
    try {
      if (state.abyssCv) ctx.drawImage(state.abyssCv, 0, 0, w, h);
      if (state.gameCv) ctx.drawImage(state.gameCv, 0, 0, w, h);
    } catch(e) {
      // drawImage 失败（如 WEBGL 画布不可读）：累计失败，超过阈值则禁用 Bloom
      if (++state.failCount > 60) { state.enabled = false; cv.style.display = 'none'; console.warn('[Bloom] disabled: source unreadable'); }
      ctx.filter = 'none';
      return;
    }
    ctx.filter = 'none';
    // 帧率自适应：avg>22ms → 降半分辨率；仍>22ms → 关闭
    const dt = performance.now() - t0;
    state.times.push(dt);
    if (state.times.length > 40) state.times.shift();
    if (state.times.length === 40) {
      const avg = state.times.reduce((a,b)=>a+b,0)/40;
      if (avg > 22 && state.scale > 0.5) { state.scale = 0.5; state.times = []; }
      else if (avg > 22 && state.scale <= 0.5) { state.enabled = false; cv.style.display = 'none'; console.warn('[Bloom] disabled: perf'); }
    }
  }
  state.raf = requestAnimationFrame(frame);
  bloom = state;
  return state;
}

// Bloom 强度滑块 —— 270° 圆弧仪表盘风格
// 位置：非战斗场景 → 状态栏下方（targetCy=120）；战斗场景 → 上移至原有状态栏位置（targetCy=55）
// 交互：鼠标按下/拖动弧线时更新 gs.bloomIntensity (0.0 → 1.0)
function drawBloomSlider() {
  if (!bloom) return;
  let s = bloom.slider;
  s.cx = GAME_W - 95;
  // 根据场景选择目标 Y：非战斗=120，战斗=75（原有状态栏位置，避免突兀）
  let sceneTargetY = (gs.scene === 'battle') ? 75 : 120;
  s.targetCy = lerp(s.targetCy, sceneTargetY, 0.18); // 场景切换时快速平滑移动（0.06→0.18，~3×加速）
  // 入场动画：从画面外（animCy=-100）缓动至目标 targetCy
  s.animCy = lerp(s.animCy, s.targetCy, 0.12); // 跟随 targetCy（0.05→0.12，~2.4×加速）
  s.cy = s.animCy;
  s.r = 42;
  let cx = s.cx, cy = s.cy, r = s.r;
  let intensity = gs.bloomIntensity;
  let startA = -PI / 2;
  let endA = PI;
  let arcRange = endA - startA;
  let thumbAngle = startA + intensity * arcRange;
  let thumbX = cx + r * Math.cos(thumbAngle);
  let thumbY = cy + r * Math.sin(thumbAngle);

  // ---- 命中检测 ----
  let dx = mx() - cx, dy = my() - cy;
  let distToCenter = Math.sqrt(dx * dx + dy * dy);
  let mouseAngle = Math.atan2(dy, dx);
  let inArcRange = mouseAngle >= startA - 0.15 && mouseAngle <= endA + 0.15;
  let inArcBand = distToCenter >= r - 16 && distToCenter <= r + 16;
  let hovering = inArcRange && inArcBand;
  s.hover = hovering;

  // ---- 绘制 ----
  noFill();
  strokeCap(SQUARE);

  // 背景轨道弧（暗灰，粗）
  cStroke(40, 40, 48, 200);
  strokeWeight(7);
  arc(cx, cy, r * 2, r * 2, startA, endA);

  // 已填充弧（金色，从起点到当前角度）
  cStroke('gold', 230);
  strokeWeight(7);
  arc(cx, cy, r * 2, r * 2, startA, startA + intensity * arcRange);

  // 刻度标记（5 段，0%/25%/50%/75%/100%）
  cStroke('goldDim', 100);
  strokeWeight(1);
  for (let i = 0; i <= 4; i++) {
    let ta = startA + (i / 4) * arcRange;
    let x1 = cx + (r - 10) * Math.cos(ta);
    let y1 = cy + (r - 10) * Math.sin(ta);
    let x2 = cx + (r + 10) * Math.cos(ta);
    let y2 = cy + (r + 10) * Math.sin(ta);
    line(x1, y1, x2, y2);
  }

  // 滑块圆点（goldBright）
  noStroke();
  cFill('bg', 200);
  circle(thumbX, thumbY, 16);
  cFill('goldBright');
  circle(thumbX, thumbY, 12);

  // 悬停/拖动时：外圈光晕
  if (hovering || s.dragging) {
    noFill();
    cStroke('goldBright', 80);
    strokeWeight(1);
    circle(thumbX, thumbY, 22);
  }

  // 中心标签 BLOOM + 百分比
  noStroke();
  cFill('goldDim', 200);
  textAlign(CENTER, CENTER);
  textStyle(BOLD);
  textSize(10);
  text('BLOOM', cx, cy - 6);
  cFill('gold');
  textSize(13);
  text(Math.round(intensity * 100) + '%', cx, cy + 10);
  textStyle(NORMAL);

  strokeCap(ROUND);
}

function handleBloomSliderPress() {
  if (!bloom) return false;
  let s = bloom.slider;
  if (s.hover) {
    s.dragging = true;
    updateBloomSlider();
    return true;
  }
  return false;
}

function updateBloomSlider() {
  if (!bloom || !bloom.slider.dragging) return;
  let s = bloom.slider;
  let dx = mx() - s.cx, dy = my() - s.cy;
  let mouseAngle = Math.atan2(dy, dx);
  let startA = -PI / 2, endA = PI;
  // 修复：鼠标越过端点时角度环绕导致跳变到 0%
  // 弧覆盖 [-PI/2, PI]，间隙为 [-PI, -PI/2)
  // 间隙中点 -3PI/4：靠近 -PI 端 → 判定 100%；靠近 -PI/2 端 → 判定 0%
  let clampedAngle;
  if (mouseAngle < startA) {
    clampedAngle = (mouseAngle <= -3 * PI / 4) ? endA : startA;
  } else {
    clampedAngle = Math.min(endA, mouseAngle);
  }
  let intensity = (clampedAngle - startA) / (endA - startA);
  gs.bloomIntensity = Math.round(intensity * 100) / 100;
}

function releaseBloomSlider() {
  if (bloom) bloom.slider.dragging = false;
}

// ==================== 音量控制 UI：复古未来风弧形分格合成器 ====================
// 位置：BLOOM UI 下方（纵向排列三个弧）
// 设计差异化（与 BLOOM 270° 连续金色弧不同）：
//   - 每个弧 210° 分 12 段（分格段，非连续），像复古电子合成器 VU 分格步进表
//   - 配色：电子青 cyanBright + 紫色 neonPurple，与 BLOOM 暖金形成冷暖对比
//   - 每个弧下方独立 MUTE 指示灯（点击切换静音）
//   - 排列：竖向堆叠 MASTER → BGM → SFX，X 对齐 BLOOM 中心
let volumeUI = null;

function initVolumeUI() {
  // 三个通道配置：每通道新增 targetCy / animCy 双层动画字段（与 BLOOM UI 同架构）
  // T157→T158：MUTE 按钮置于仪表盘内标签上方并下移避让滑块；刻度精简为 0%/100% 两端点
  volumeUI = {
    channels: [
      { id: 'master', label: 'MAS', r: 40, ch: 'master', targetCy: 0, animCy: -200 },
      { id: 'bgm',    label: 'BGM', r: 38, ch: 'bgm',    targetCy: 0, animCy: -200 },
      { id: 'sfx',    label: 'SFX', r: 38, ch: 'sfx',    targetCy: 0, animCy: -200 },
    ],
    spacing: 85,
    arcRange: PI * 210 / 180,  // 210°
    startA: PI * 0.85,         // 起始角 153°
    segCount: 12,              // 分格段数（保留 VU 步进感）
    // T158：刻度进一步精简到 2 条端点（0% / 100%），删除 25%/50%/75% 中间标尺（去蜈蚣感）
    tickIndices: [0, 12],
    dragging: null,
    hoverChannel: null,
    hoverMute: null,
    animOffsetY: -200,         // 入场动画：从画面外上方滑入
  };
}

// 获取通道当前音量值（0-1）
function getVolumeValue(ch) {
  if (!audio) return 0.5;
  if (ch === 'master') return audio.masterVolume;
  if (ch === 'bgm')    return audio.bgmVolume;
  if (ch === 'sfx')    return audio.sfxVolume;
  return 0.5;
}
function setVolumeValue(ch, v) {
  if (!audio) return;
  v = Math.max(0, Math.min(1, v));
  if (ch === 'master') audio.setMasterVolume(v);
  else if (ch === 'bgm') audio.setBGMVolume(v);
  else if (ch === 'sfx') audio.setSFXVolume(v);
}
function getMutedState(ch) {
  if (!audio) return false;
  if (audio.muted) return true;  // 全局静音叠加显示
  return audio.mutedChannels && audio.mutedChannels[ch];
}
function toggleMuteOf(ch) {
  if (!audio || !audio.toggleChannelMute) return;
  audio.toggleChannelMute(ch);
}

// T157：为场景切换双层动画提供每通道的 baseCy（目标位置）
// 计算"基准目标cy"——场景切换时用作 lerp 终点，不含入场动画和缓动
function getVolumeChannelBaseCys() {
  const cx = GAME_W - 95;
  const bloomTargetY = (gs.scene === 'battle') ? 75 : 120;
  const baseOffset = 100;
  return volumeUI.channels.map((c, i) => ({
    cx,
    baseCy: bloomTargetY + baseOffset + i * volumeUI.spacing,
  }));
}

// T157：返回每通道"当帧权威cy"——绘制和命中必须同源（经验 600266 教训）
// 用 animCy（双层缓动cy）+ animOffsetY（入场偏移）合成
function getVolumeChannelFrameCys() {
  const bases = getVolumeChannelBaseCys();
  const v = volumeUI;
  return v.channels.map((c, i) => ({
    cx: bases[i].cx,
    cy: c.animCy + v.animOffsetY,
  }));
}

// 命中检测：判断鼠标是否在某通道的弧形命中区
function hitVolumeArc(mx, my, cx, cy, r, startA, arcRange) {
  const dx = mx - cx, dy = my - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const inBand = dist >= r - 18 && dist <= r + 18;
  if (!inBand) return { hit: false };
  const a = Math.atan2(dy, dx);
  const normAngle = (angle, base) => {
    let a2 = angle;
    while (a2 < base) a2 += TWO_PI;
    while (a2 >= base + TWO_PI) a2 -= TWO_PI;
    return a2;
  };
  const endA = startA + arcRange;
  const aNorm = normAngle(a, startA);
  const endNorm = normAngle(endA, startA);
  if (aNorm >= startA - 0.15 && aNorm <= endNorm + 0.15) {
    const t = Math.max(0, Math.min(1, (aNorm - startA) / arcRange));
    return { hit: true, t };
  }
  return { hit: false };
}

// T159：MUTE 从独立圆形按钮升级为"标签即 MUTE"
//   标签放大到 textSize 13 + 状态化呈现，点击标签切换静音（替代原独立 MUTE 按钮）
//   命中区：以标签为中心的矩形（宽 32 高 20），位于 (cx, cy-9)，全部在中心安全区 dist<22 内
//   完全不与弧命中带 [r-18, r+18]=[22,58] 重叠，彻底消除 MUTE 与滑块检测冲突
function hitVolumeLabel(mx, my, cx, cy, r) {
  const lx = cx;
  const ly = cy - 9;     // 标签中心（与 drawVolumeArc 第 6 段同源）
  const halfW = 16;      // 命中宽 32px（3 字符 × 13pt 约 24px + 边距）
  const halfH = 10;      // 命中高 20px（textSize 13 + 上下边距）
  const dx = Math.abs(mx - lx), dy = Math.abs(my - ly);
  return { hit: (dx <= halfW && dy <= halfH), lx, ly, halfW, halfH };
}

// 绘制单个音量弧控件
function drawVolumeArc(cfg, cx, cy, value, muted) {
  const { label, r } = cfg;
  const startA = volumeUI.startA;
  const arcRange = volumeUI.arcRange;
  const endA = startA + arcRange;
  const segCount = volumeUI.segCount;
  const segSpan = arcRange / segCount;
  const segGap = segSpan * 0.25;
  const filledSegs = Math.round(value * segCount);
  const isHovering = (volumeUI.hoverChannel === cfg.id) || (volumeUI.dragging === cfg.id);

  strokeCap(SQUARE);

  // ---- 1. 空态分格段（深夜蓝灰底，保留 12 段，段本身不密）----
  noFill();
  strokeWeight(6);
  cStroke(30, 40, 55, 220);
  for (let i = 0; i < segCount; i++) {
    const sA = startA + i * segSpan + segGap * 0.5;
    const eA = sA + segSpan - segGap;
    arc(cx, cy, r * 2, r * 2, sA, eA);
  }

  // ---- 2. 已填充分格段（电子青→青紫→紫色渐变）----
  for (let i = 0; i < filledSegs; i++) {
    const sA = startA + i * segSpan + segGap * 0.5;
    const eA = sA + segSpan - segGap;
    if (i < 8) cStroke('cyanBright');
    else if (i < 10) cStroke(160, 180, 255);
    else cStroke('neonPurple');
    arc(cx, cy, r * 2, r * 2, sA, eA);
  }

  // ---- 3. T158：刻度线精简为 2 条端点（0% / 100%），删除 25%/50%/75% 中间标尺 ----
  // 仅保留 0% 与 100% 端点刻线（tickIndices 中），去标尺化，仪表盘更凝练
  // 长度 r±4（总长 8px）
  cStroke(80, 100, 130, 180);
  strokeWeight(1);
  const ticks = volumeUI.tickIndices;
  for (let k = 0; k < ticks.length; k++) {
    const ta = startA + ticks[k] * segSpan;
    const x1 = cx + (r - 4) * Math.cos(ta);
    const y1 = cy + (r - 4) * Math.sin(ta);
    const x2 = cx + (r + 4) * Math.cos(ta);
    const y2 = cy + (r + 4) * Math.sin(ta);
    line(x1, y1, x2, y2);
  }

  // ---- 4. 指针小圆点 ----
  const thumbAngle = startA + value * arcRange;
  const tx = cx + r * Math.cos(thumbAngle);
  const ty = cy + r * Math.sin(thumbAngle);
  noStroke();
  cFill('bg', 220);
  circle(tx, ty, 14);
  cFill(muted ? 'red' : 'cyanBright');
  circle(tx, ty, 10);

  // ---- 5. 悬停/拖动光晕 ----
  if (isHovering) {
    noFill();
    cStroke(muted ? 'red' : 'cyanBright', 90);
    strokeWeight(1);
    circle(tx, ty, 20);
  }

  // ---- 6. T159：中心标签（即 MUTE，可点击切换静音）+ 状态灯 + 数值 ----
  //   标签放大 textSize 9→13，位置 cy-6→cy-9（给状态灯与数值留空间）
  //   标签状态化：未静音=青色字+底部青色状态灯；静音=红色字+划线+红色状态灯
  //   hover 发光（暗示可点击）：青色亮化 + 轻微光晕环
  //   布局：标签(cy-9) → 状态灯(cy+1, r=2) → 数值(cy+12, textSize 11)
  //   全部在中心安全区 dist<22 内（最大偏移 12 < 22），不与弧命中带 [22,58] 冲突
  const labelY = cy - 9;
  const lampY = cy + 1;
  const valueY = cy + 12;
  const isLabelHover = (volumeUI.hoverMute === cfg.id);  // hoverMute 字段复用为 label hover
  noStroke();
  textAlign(CENTER, CENTER);
  textStyle(BOLD);
  // hover 光晕（暗示可点击）
  if (isLabelHover && !muted) {
    cFill('cyanBright', 60);
    textSize(15);  // 光晕略大于本体
    text(label, cx, labelY);
  }
  // 标签本体：muted=红，hover=亮青，默认=暗青
  textSize(13);
  cFill(muted ? 'redBright' : (isLabelHover ? 'cyanBright' : 'cyanDim'), muted ? 240 : 220);
  text(label, cx, labelY);
  textStyle(NORMAL);
  // 状态灯：标签下方小圆点（通道状态可视化）
  // 绘制顺序：先画 hover 光晕（大圆 alpha 80），再画本体（小圆）
  noStroke();
  if (isLabelHover && !muted) {
    cFill('cyanBright', 80);
    circle(cx, lampY, 8);  // 光晕
  }
  cFill(muted ? 'redBright' : (isLabelHover ? 'cyanBright' : 'cyanDim'), muted ? 230 : 200);
  circle(cx, lampY, 4);    // 本体
  // 数值
  textAlign(CENTER, CENTER);
  if (muted) {
    cFill('redBright', 230);
    textSize(11);
    text('0%', cx, valueY);
  } else {
    cFill('cyanBright', 230);
    textSize(11);
    text(Math.round(value * 100) + '%', cx, valueY);
  }

  strokeCap(ROUND);
}

// 主绘制入口
function drawVolumeUI() {
  if (!volumeUI) initVolumeUI();
  if (!audio) return;
  const v = volumeUI;

  // ---- T157 修改3：每通道双层缓动（targetCy + animCy，与 BLOOM UI 完全一致）----
  // BLOOM 模式：targetCy（场景切换过渡 lerp 0.18）→ animCy（入场跟随 lerp 0.12）
  // 解决战斗/非战斗场景切换时 cy 突变的问题
  const bases = getVolumeChannelBaseCys();
  for (let i = 0; i < v.channels.length; i++) {
    // 首次（targetCy==0）直接赋基准值，避免从 0 缓动过来
    if (v.channels[i].targetCy === 0) v.channels[i].targetCy = bases[i].baseCy;
    v.channels[i].targetCy = lerp(v.channels[i].targetCy, bases[i].baseCy, 0.18);
    v.channels[i].animCy   = lerp(v.channels[i].animCy,   v.channels[i].targetCy, 0.12);
  }
  // ---- 入场动画：整体从画面外上方滑入（速率与 BLOOM 一致 0.12）----
  v.animOffsetY = lerp(v.animOffsetY, 0, 0.12);

  // ---- 当帧权威cy：绘制与命中同源，避免位置错位（经验 600266 教训）----
  const frameCys = getVolumeChannelFrameCys();

  // 悬停检测（使用权威cy）
  v.hoverChannel = null;
  v.hoverMute = null;
  const mxV = mx(), myV = my();
  for (let i = 0; i < v.channels.length; i++) {
    const c = v.channels[i];
    const { cx, cy } = frameCys[i];
    // T159：标签即 MUTE，hoverMute 字段复用为"标签 hover"标识
    const mHit = hitVolumeLabel(mxV, myV, cx, cy, c.r);
    if (mHit.hit) { v.hoverMute = c.id; break; }
    const h = hitVolumeArc(mxV, myV, cx, cy, c.r, v.startA, v.arcRange);
    if (h.hit) { v.hoverChannel = c.id; break; }
  }

  // 绘制三个通道
  for (let i = 0; i < v.channels.length; i++) {
    const c = v.channels[i];
    const { cx, cy } = frameCys[i];
    drawVolumeArc(c, cx, cy, getVolumeValue(c.ch), getMutedState(c.ch));
  }
}

// 鼠标按下命中拦截（同样使用权威cy同源）
function handleVolumeUIPress() {
  if (!volumeUI || !audio) return false;
  const v = volumeUI;
  const mxV = mx(), myV = my();
  const frameCys = getVolumeChannelFrameCys();
  for (let i = 0; i < v.channels.length; i++) {
    const c = v.channels[i];
    const { cx, cy } = frameCys[i];
    // T159：点击标签切换静音（替代原独立 MUTE 按钮）
    const mHit = hitVolumeLabel(mxV, myV, cx, cy, c.r);
    if (mHit.hit) { toggleMuteOf(c.ch); return true; }
    const h = hitVolumeArc(mxV, myV, cx, cy, c.r, v.startA, v.arcRange);
    if (h.hit) { v.dragging = c.id; setVolumeValue(c.ch, h.t); return true; }
  }
  return false;
}

// 拖动中实时更新（同样使用权威cy同源）
function updateVolumeUIDrag() {
  if (!volumeUI || !volumeUI.dragging || !audio) return;
  const v = volumeUI;
  const idx = v.channels.findIndex(c => c.id === v.dragging);
  if (idx < 0) return;
  const c = v.channels[idx];
  const { cx, cy } = getVolumeChannelFrameCys()[idx];
  const h = hitVolumeArc(mx(), my(), cx, cy, c.r, v.startA, v.arcRange);
  if (h.hit) {
    setVolumeValue(c.ch, h.t);
  } else {
    const dx = mx() - cx, dy = my() - cy;
    const a = Math.atan2(dy, dx);
    const startA = v.startA, endA = startA + v.arcRange;
    const gapMid = startA - (TWO_PI - v.arcRange) / 2;
    const normA = a < gapMid ? a + TWO_PI : a;
    if (normA <= startA) setVolumeValue(c.ch, 0);
    else if (normA >= endA) setVolumeValue(c.ch, 1);
  }
}

function releaseVolumeUI() {
  if (volumeUI) volumeUI.dragging = null;
}

// ==================== 星匣 SDK + 存档管理 ====================
// 全局 SDK 实例(平台 iframe 内握手成功后可用,本地直开为 null)
let __starSdk = null;
// SaveManager 单例(setup 中初始化)
let saveManager = null;

// 存档 schema 迁移表：{ 旧版本号: (data) => 迁移后的 data }
//   现在 schemaVersion 还是 1，表是空的 —— 但**机制必须先于需求存在**。
//   此前版本不匹配是「直接 return false」：一旦未来结构变更 bump 版本，
//   老玩家的存档会被就地丢弃、进度清空，而代码里连个可插入迁移的地方都没有。
//   迁移函数只负责"把旧结构改成新结构"，不负责持久化。
const SAVE_MIGRATIONS = {};
// 逐级把存档从 fromVersion 迁到 SaveManager 当前版本。无可用迁移 → 返回 null（调用方按不兼容处理）
function migrateSaveData(data, fromVersion, toVersion) {
  if (!data || typeof data !== 'object') return null;
  let v = Number(fromVersion) || 0;
  let cur = data;
  // 只支持向上迁移；向下（存档比代码新）无法安全还原，交回调用方拒绝
  if (v > toVersion) return null;
  let guard = 0;
  while (v < toVersion) {
    const fn = SAVE_MIGRATIONS[v];
    if (typeof fn !== 'function') return null;   // 缺一环 → 迁不动，宁可拒绝也不要半吊子数据
    try { cur = fn(cur); } catch (e) { console.warn('[SaveManager] 迁移 v' + v + ' 失败:', e); return null; }
    if (!cur || typeof cur !== 'object') return null;
    cur.schemaVersion = v + 1;
    v++;
    if (++guard > 32) return null;               // 防呆：迁移表写成环会死循环
  }
  return cur;
}

// 存档管理器:封装 sdk.storage,失败降级 localStorage 兜底
//   存档拆 5 个 key(符合 SKILL.md 陷阱 #4,单值 256KB 上限):
//     save:auto:meta           —— 元信息(列表展示用,不含具体存档数据)
//     save:auto:player:core    —— 玩家核心(hp/gold/地图位置/楼层/bloom)
//     save:auto:player:deck    —— 卡组(每张卡的 id/uid/upgraded,读档从 CARD_DATA 重建)
//     save:auto:player:relics  —— 遗物(每件的 id,读档从 RELIC_DATA 重建)
//     save:auto:game:map       —— 完整 mapData + currentLayer
//   不存:combatState(战斗临时态)、particles/floatingTexts、UI 滚动位置
//   场景白名单:仅 map/shop/event/rest/treasure/artisan/victory 时存(战斗中/标题/失败/移除卡 不存)
class SaveManager {
  constructor() {
    this.schemaVersion = 1;           // 存档 schema 版本(后续 GameState 结构变更时 bump,在 loadAndRestore 中加迁移)
    this._ver = {};                   // key -> 云端 version（CAS 乐观锁用，见 _set）
    this._autoSaveTimer = null;
    this._autoSaveDebounceMs = 1500;  // 防抖:1500ms,避免连续场景切换重复写(配额 60 次/分钟)
    this._sdkReady = false;
    this._hasSaveCache = false;       // 标题页「继续游戏」按钮显隐标志(setup 时预加载)
    // 存档场景白名单:战斗中临时态/标题/失败/移除卡 不存
    this.savableScenes = new Set(['map', 'shop', 'event', 'rest', 'treasure', 'artisan', 'victory']);
  }
  // SDK 初始化(平台 iframe 内握手成功;本地直开或脚本失败则降级 localStorage)
  //   按 SKILL.md:不传 gameId,平台运行期注入 sdk.context.gameId
  async initSdk() {
    if (typeof window.GameSDK !== 'function' && typeof window.GameSDK !== 'object') {
      console.warn('[SaveManager] GameSDK 未加载(本地直开?),使用 localStorage 兜底');
      return false;
    }
    try {
      __starSdk = await window.GameSDK.init();
      this._sdkReady = !!__starSdk;
      logSdk('info', 'sdk:ready', { hasStorage: !!(__starSdk && __starSdk.storage) });
      console.log('[SaveManager] 星匣 SDK 握手成功,storage 走云端');
      return true;
    } catch (e) {
      // 握手失败 = 脱离平台 iframe 直开 / SDK 未加载，属真实异常，记 warn（不阻断：localStorage 兜底）
      logSdk('warn', 'sdk:init-failed', { code: (e && e.code) || 'UNKNOWN' });
      console.warn('[SaveManager] SDK init 失败,降级 localStorage:', e);
      this._sdkReady = false;
      return false;
    }
  }
  // 内部:统一写(localStorage 同步兜底 + sdk.storage 异步跨设备)
  //   key 不带前缀(sdk.storage per-game 隔离);localStorage backup 加 abyssus_ 前缀避免本地多游戏冲突
  async _set(key, value) {
    // 1. 先写 localStorage(同步,保底,本地直开也能用)
    const payload = JSON.stringify(value);
    try { localStorage.setItem('abyssus_backup_' + key, payload); } catch (e) { /* 配额满 / 隐私模式 忽略 */ }
    // 2. 再写 sdk.storage(异步,跨设备同步)
    if (this._sdkReady && __starSdk) {
      try {
        // CAS 乐观锁（CDR S5）：带上已知 version。
        //   单设备时永远匹配，零额外开销；同账号多设备时，平台会检出版本失配并抛
        //   STORAGE_CONFLICT —— 总好过后写的那一方**静默盖掉**另一方刚发生的进度。
        const p = { key: key, value: value };
        if (this._ver[key] !== undefined) p.ifVersion = this._ver[key];
        const r = await __starSdk.storage.set(p);
        if (r && r.version !== undefined) this._ver[key] = r.version;
        return true;
      } catch (e) {
        // 按 storage.md 错误码分支降级(S6 错误韧性)
        if (window.GameSDK && typeof window.GameSDK.isPlatformSDKError === 'function' && window.GameSDK.isPlatformSDKError(e)) {
          const code = e.code || '';
          // 未登录写入失败是预期路径（localStorage 已兜底），不记日志；其余写失败记 warn，
          //   带 key 便于一眼定位是哪个分片超限（如 game:map 过大）
          if (code !== 'STORAGE_REQUIRE_LOGIN') logSdk('warn', 'save:set-failed', { key, code });
          if (code === 'STORAGE_REQUIRE_LOGIN') {
            // 未登录,localStorage 兜底已写,静默
          } else if (code === 'STORAGE_CONFLICT') {
            // 版本失配：说明**别的设备写过**（或多端并发）。重拉最新 version 再写一次，
            //   以本设备为准 —— 玩家正坐在这台设备前，覆盖它比丢掉刚发生的操作更符合直觉。
            //   仍冲突就放弃云端：localStorage 已兜底，本地照常可玩。
            logSdk('warn', 'save:cas-conflict', { key: key });
            try {
              const cur = await __starSdk.storage.get({ key: key });
              const v = cur && cur.version;
              // 拿不到 version 说明这个 key 在云端已经不存在了（例如被 clearSave 删过）。
              //   此时**显式省略** ifVersion：传 undefined 的语义由平台决定，不如自己说明白 ——
              //   这是"新建"，不是"覆盖某个版本"。保证重试一定落得地，不会二次冲突。
              const p2 = { key: key, value: value };
              if (v !== undefined && v !== null) p2.ifVersion = v;
              const r2 = await __starSdk.storage.set(p2);
              if (r2 && r2.version !== undefined) this._ver[key] = r2.version;
              return true;
            } catch (e2) {
              console.warn('[SaveManager] CAS 重试仍失败，已回落本地存储:', key);
              return false;
            }
          } else if (code === 'STORAGE_VALUE_TOO_LARGE' || code === 'STORAGE_QUOTA_EXCEEDED') {
            console.warn(`[SaveManager] storage.set ${code} for key=${key}`);
          } else if (code === 'STORAGE_NETWORK_ERROR') {
            // 官方码表里有、此前却被写成 RATE_LIMITED（AI 域的码误植到 storage 域，
            //   那是个永不命中的死分支，会把网络错误混进通用 warn 里）。
            //   网络错误是瞬时的，localStorage 已兜底，静默即可。
          } else {
            console.warn('[SaveManager] storage.set 错误:', code, e);
          }
        } else {
          console.warn('[SaveManager] storage.set 非 SDK 错误:', e);
        }
      }
    }
    return false;
  }
  // 内部:统一读(优先 sdk.storage,失败回退 localStorage)
  async _get(key) {
    if (this._sdkReady && __starSdk) {
      try {
        const { value, version } = await __starSdk.storage.get({ key });
        // 记住云端 version，后续写入带 ifVersion 做乐观锁（见 _set）
        if (version !== undefined) this._ver[key] = version;
        if (value) return value;
      } catch (e) {
        if (window.GameSDK && typeof window.GameSDK.isPlatformSDKError === 'function' && window.GameSDK.isPlatformSDKError(e)) {
          const code = e.code || '';
          if (code !== 'STORAGE_REQUIRE_LOGIN') {
            console.warn('[SaveManager] storage.get 错误:', code);
          }
          // STORAGE_REQUIRE_LOGIN 静默回退 localStorage
        }
      }
    }
    // localStorage 兜底
    try {
      const s = localStorage.getItem('abyssus_backup_' + key);
      if (s) return JSON.parse(s);
    } catch (e) {}
    return null;
  }
  // 预加载:setup 时调用,缓存「是否有存档」标志(避免 TitleScene 异步等待)
  async preloadHasSave() {
    const meta = await this._get('save:auto:meta');
    this._hasSaveCache = !!(meta && meta.scene && this.savableScenes.has(meta.scene));
    return this._hasSaveCache;
  }
  // 序列化当前 GameState → 拆 5 个 key 并发写
  //   战斗中(battle)直接拒存（T252）；进入战斗前 MapScene.mousePressed 会先存「进入前安全快照」，
  //   战斗中退出重进读到节点未进入态，重打该场——既不逃课也不死锁
  async saveCurrent() {
    if (!gs) return false;
    let sceneToSave = gs.scene;
    // T252：战斗中**拒存**（绝不伪装成 map 落盘）——地图状态在点节点进战瞬间即提交
    //   （mapPath/currentNodeId/currentLayer），但战斗结果尚未产出；伪装存盘会留下「节点已提交、
    //   战斗未完成」中间态：boss 战读档后无后继可点=永久死锁，普通/精英战读档后可跳过该场=逃课。
    //   进战前的「进入前安全快照」由 MapScene.mousePressed 同步落盘，读到即节点未进入态，重打即可。
    if (sceneToSave === 'battle') return false;
    if (!this.savableScenes.has(sceneToSave)) {
      // title/defeat/remove_card 等无有效进度场景,不存
      return false;
    }
    const now = Date.now();
    // 1. meta(列表展示用,体积小)
    const meta = {
      schemaVersion: this.schemaVersion,
      savedAt: now,
      scene: sceneToSave,
      hp: gs.hp, maxHp: gs.maxHp, gold: gs.gold,
      currentLayer: gs.currentLayer, currentRegion: gs.currentRegion,
      floorNumber: gs.floorNumber || 0,
      // PHASE 3 无尽回响：是否进入无尽模式 + 本局最深纪录（列表里能看出这局走多深）
      endlessEcho: !!gs.endlessEcho, maxDepth: gs.maxDepth || 0,
      deckCount: gs.deck ? gs.deck.length : 0,
      relicCount: gs.relics ? gs.relics.length : 0,
      difficulty: gs.difficulty,  // 难度档位（存档列表展示用）
      aiEnabled: aiSys.enabled,   // AI 开关（玩家偏好，跨局保留；关闭 = 零调用零费用）
    };
    // 2. player:core
    const playerCore = {
      hp: gs.hp, maxHp: gs.maxHp, gold: gs.gold,
      currentLayer: gs.currentLayer, currentRegion: gs.currentRegion,
      // PHASE 3：无尽回响标记必须存档 —— 否则读档后回响层数丢失，难度会退回主线
      endlessEcho: !!gs.endlessEcho, maxDepth: gs.maxDepth || 0,
      currentNodeId: gs.currentNodeId, mapPath: gs.mapPath,
      regionTransition: gs.regionTransition, floorNumber: gs.floorNumber || 0,
      bloomIntensity: gs.bloomIntensity,
      difficulty: gs.difficulty,  // 难度随存档持久化（reset() 不覆盖，读档后显式回填）
      aiEnabled: aiSys.enabled,   // AI 开关随存档持久化（reset() 不覆盖，读档后显式回填）
    };
    // 3. player:deck(只存 id/uid/upgraded,读档从 CARD_DATA 重建完整对象,节省体积)
    const deck = gs.deck ? gs.deck.map(c => ({
      id: c.id, uid: c.uid, upgraded: !!c.upgraded
    })) : [];
    // 4. player:relics(只存 id,读档从 RELIC_DATA 重建)
    const relics = gs.relics ? gs.relics.map(r => ({ id: r.id })) : [];
    // 5. game:map(完整 mapData,读档不重新生成以保留玩家路径选择)
    const map = { mapData: gs.mapData, currentLayer: gs.currentLayer };
    // 并发写(5 个 key 独立,无依赖)
    await Promise.all([
      this._set('save:auto:meta', meta),
      this._set('save:auto:player:core', playerCore),
      this._set('save:auto:player:deck', deck),
      this._set('save:auto:player:relics', relics),
      this._set('save:auto:game:map', map),
    ]);
    // PHASE 1：图鉴随存档一起落盘（低频：仅在发现新组合时 _dirty）
    codexFlush();
    this._hasSaveCache = true;  // 写后更新缓存
    return true;
  }
  // 防抖自动存(Scene.enter() 钩子触发,1500ms 内多次切换只存一次)
  autoSave() {
    if (this._autoSaveTimer) clearTimeout(this._autoSaveTimer);
    this._autoSaveTimer = setTimeout(() => {
      this._autoSaveTimer = null;
      this.saveCurrent().catch(e => console.warn('[SaveManager] autoSave 失败:', e));
    }, this._autoSaveDebounceMs);
  }
  // 读档:并发取 5 个 key,反序列化完整重建 GameState(按 SKILL.md 陷阱 #10,不 merge 表层)
  async loadAndRestore() {
    let [meta, playerCore, deck, relics, map] = await Promise.all([
      this._get('save:auto:meta'),
      this._get('save:auto:player:core'),
      this._get('save:auto:player:deck'),
      this._get('save:auto:player:relics'),
      this._get('save:auto:game:map'),
    ]);
    if (!meta || !playerCore) {
      // 读档失败 = 玩家进度丢失，属真实异常 → error（反馈日志中立即回流并高亮）
      logSdk('error', 'save:load-failed', {
        hasMeta: !!meta, hasCore: !!playerCore, sdkReady: this._sdkReady,
      });
      console.warn('[SaveManager] 读档失败:meta 或 player:core 缺失');
      return false;
    }
    if (meta.schemaVersion !== this.schemaVersion) {
      // 先尝试逐级迁移；迁得动就继续读档，迁不动才拒绝 ——
      //   直接 return false 等于把老玩家的进度就地清空，那是不可恢复的伤害。
      const migrated = migrateSaveData({ ...meta, playerCore, deck, relics, map },
                                       meta.schemaVersion, this.schemaVersion);
      if (!migrated) {
        logSdk('error', 'save:version-mismatch', {
          saved: meta.schemaVersion, current: this.schemaVersion,
        });
        console.warn(`[SaveManager] 存档版本不兼容且无可用迁移:存档=${meta.schemaVersion} 当前=${this.schemaVersion}`);
        return false;
      }
      logSdk('info', 'save:migrated', { from: meta.schemaVersion, to: this.schemaVersion });
      // 迁移函数可能改写了分片结构，统一从迁移结果取回，避免下文仍引用旧变量
      meta = migrated;
      if (migrated.playerCore) playerCore = migrated.playerCore;
      if (migrated.deck !== undefined) deck = migrated.deck;
      if (migrated.relics !== undefined) relics = migrated.relics;
      if (migrated.map !== undefined) map = migrated.map;
    }
    // 1. 先 reset 到初始态(清掉旧 deck/relics/mapData 等)
    gs.reset();
    // 2. player:core(逐字段赋值,非 merge 表层)
    gs.hp = playerCore.hp; gs.maxHp = playerCore.maxHp;
    gs.gold = playerCore.gold;
    gs.currentLayer = playerCore.currentLayer;
    gs.currentRegion = playerCore.currentRegion;
    // PHASE 3 无尽回响：必须**显式回填**——gs.reset() 刚把它清成 false，
    //   漏了这一步读档后难度会退回主线，玩家辛苦走的回响层全白费。脏数据一律回落主线。
    gs.endlessEcho = !!playerCore.endlessEcho;
    gs.maxDepth = Math.max(0, playerCore.maxDepth || 0);
    gs.currentNodeId = playerCore.currentNodeId;
    gs.mapPath = Array.isArray(playerCore.mapPath) ? [...playerCore.mapPath] : [];
    gs.regionTransition = playerCore.regionTransition || null;
    gs.floorNumber = playerCore.floorNumber || 0;
    if (typeof playerCore.bloomIntensity === 'number') gs.bloomIntensity = playerCore.bloomIntensity;
    // 难度：仅接受合法索引，越界/脏数据回落默认档（II 回响）
    if (typeof playerCore.difficulty === 'number' && DIFFICULTY_DATA[playerCore.difficulty]) {
      gs.difficulty = playerCore.difficulty;
    }
    // AI 开关：仅接受布尔值，脏数据回落默认（开启）。玩家关掉后跨局不会自动重开——
    // 这直接关系到费用：关闭状态下游戏一次都不调用 sdk.ai，因此始终零费用。
    if (typeof playerCore.aiEnabled === 'boolean') aiSys.enabled = playerCore.aiEnabled;
    // 3. deck(从 CARD_DATA 重建完整卡牌对象,保留 uid/upgraded 防止卡牌追踪错乱)
    if (Array.isArray(deck)) {
      gs.deck = [];
      deck.forEach(saved => {
        const tpl = (typeof CARD_DATA !== 'undefined') ? CARD_DATA.find(c => c.id === saved.id) : null;
        if (tpl) gs.deck.push({ ...tpl, uid: saved.uid, upgraded: saved.upgraded });
      });
    }
    // 4. relics(从 RELIC_DATA 重建完整遗物对象)
    if (Array.isArray(relics)) {
      gs.relics = [];
      relics.forEach(saved => {
        const tpl = (typeof RELIC_DATA !== 'undefined') ? RELIC_DATA.find(r => r.id === saved.id) : null;
        if (tpl) gs.relics.push({ ...tpl });
      });
    }
    // 5. map(完整 mapData,读档不重新生成以保留玩家路径选择)
    if (map && map.mapData) {
      gs.mapData = map.mapData;
      if (typeof map.currentLayer === 'number') gs.currentLayer = map.currentLayer;
    }
    // 6. combatState 重置(战斗临时态不入档,读档后不卡在战斗中态)
    gs.combatState = null;
    gs.turnNumber = 0;
    // 7. scene:存档中的 scene,但 battle → map 回退,title/defeat/remove_card → map
    let targetScene = meta.scene || 'map';
    if (targetScene === 'battle') targetScene = 'map';
    if (!this.savableScenes.has(targetScene)) targetScene = 'map';
    gs.scene = targetScene;
    // 8. T252 旧版死锁档一次性自愈：T252 之前战斗中存档被伪装成 map，boss 战中途退出的存档读回后
    //    currentNodeId=boss（最后一层、无后继）→ boss 不可点、又无下层可走=永久死锁。
    //    正常流程绝不会出现「mapPath 尖端是 boss 且停在 map 场景」（boss 击败即跨区置 null 或走 victory 清档），
    //    故可精确识别、零误伤：弹出 boss，currentNodeId 回退上游尖端（无则 null）；
    //    boss 进战本就不推进 currentLayer，层级保持不动，boss 节点随即重新可达可重进。
    if (targetScene === 'map' && gs.currentNodeId && gs.mapData && Array.isArray(gs.mapData.layers)
        && gs.mapPath.length && gs.mapPath[gs.mapPath.length - 1] === gs.currentNodeId) {
      let stuckNode = null;
      for (let li2 = 0; li2 < gs.mapData.layers.length && !stuckNode; li2++) {
        let nodes = gs.mapData.layers[li2].nodes || [];
        for (let ni2 = 0; ni2 < nodes.length; ni2++) {
          if (nodes[ni2].id === gs.currentNodeId) { stuckNode = nodes[ni2]; break; }
        }
      }
      if (stuckNode && stuckNode.type === 'boss') {
        gs.mapPath.pop();
        gs.currentNodeId = gs.mapPath.length ? gs.mapPath[gs.mapPath.length - 1] : null;
        try { logSdk('info', 'save:boss-stuck-healed', { nodeId: stuckNode.id }); } catch (e2) {}
      }
    }
    return true;
  }
  // 清除存档(胜利/失败后清理,符合肉鸽惯例:一局结束存档清)
  async clearSave() {
    const keys = ['save:auto:meta', 'save:auto:player:core', 'save:auto:player:deck', 'save:auto:player:relics', 'save:auto:game:map'];
    if (this._sdkReady && __starSdk) {
      try {
        await Promise.all(keys.map(k => __starSdk.storage.del({ key: k }).catch(() => {})));
      } catch (e) {
        console.warn('[SaveManager] clearSave sdk 错误:', e);
      }
    }
    keys.forEach(k => {
      try { localStorage.removeItem('abyssus_backup_' + k); } catch (e) {}
      // ⚠️ 云端 key 已删，它的 version 缓存必须**一起**失效。
      //   否则新一局首次写这几个 key 时，会带着一个已不存在的旧 version 去做 CAS →
      //   必然 STORAGE_CONFLICT → 白跑一次 get+set 往返，还打一条 save:cas-conflict。
      //   功能靠重试能自愈，但那条打点是用来判断**真实多端冲突**的，被自己污染了就再也信不过。
      //   只删这几个被 del 的 key：_ver 里还存着 world:codex / world:seed / world:memory
      //   三个**跨局**键，它们是图鉴与世界记忆，一局结束不该清（清了会让它们也丢掉 CAS）。
      delete this._ver[k];
    });
    this._hasSaveCache = false;
  }
}

function setup() {
  // 窗口适配：使用窗口实际尺寸创建画布，再缩放因子把基准分辨率映射到实际尺寸
  let canvas = createCanvas(windowWidth, windowHeight);
  canvas.parent(document.body);
  recomputeScale(); // 初始化缩放因子
  // 确保中文字体可用
  textFont('Arial');
  // 初始化全局实例
  gs = new GameState();
  events = new EventBus();
  audio = new AudioManager();
  // 星匣 SDK + 存档管理器:异步握手 + 预加载存档标志(不阻塞 setup)
  //   SDK 不可用时降级 localStorage,TitleScene 读 _hasSaveCache 决定「继续游戏」按钮显隐
  saveManager = new SaveManager();
  // PHASE 1：SDK 握手后以**云端图鉴为准**覆盖本地缓存（跨设备同步）
  saveManager.initSdk().then(() => {
    saveManager.preloadHasSave();
    codexAsyncLoad();
    memoryAsyncLoad();   // PHASE 4：世界记忆同样以云端为准（跨设备同步）
  });
  particles = new ParticleSystem();
  floatingTexts = new FloatingTextManager();
  screenShake = new ScreenShake();
  // 3D 深渊引擎 + 后处理：2D 画布透明化（z-index:1）→ WEBGL 深渊（z-index:0）在 UI 之后显现
  canvas.elt.style.position = 'absolute';
  canvas.elt.style.left = '0'; canvas.elt.style.top = '0';
  canvas.elt.style.zIndex = '1';
  canvas.elt.style.background = 'transparent';
  initPostFX();          // CSS 后处理覆盖层（暗角/扫描线/电影画框）
  // 容错（必须）：深渊引擎是纯装饰性背景层。部分环境（无 GPU / 禁用 WEBGL / 低端设备 / 严格隐私模式）
  //   创建 WEBGL 上下文会抛错；若此处不 try/catch，setup() 会中断 → scenes 未创建 → 整个游戏白屏。
  //   降级为纯 2D 画面即可正常游玩，故捕获后仅告警。
  try {
    abyss = new AbyssEngine();
    abyss.start();       // 启动独立 WEBGL 实例（异步，画布自动置于最底层）
  } catch (e) {
    abyss = null;
    console.warn('[setup] 深渊引擎(WEBGL)启动失败，已降级为纯 2D 画面:', e);
  }
  try {
    initBloom();         // Bloom 全画布合成层（异步读取深渊+游戏画布，screen 混合）
  } catch (e) {
    console.warn('[setup] Bloom 合成层初始化失败，已跳过:', e);
  }
  // 创建场景
  scenes = {
    title: new TitleScene(),
    map: new MapScene(),
    battle: new BattleScene(),
    shop: new ShopScene(),
    event: new EventScene(),
    rest: new RestScene(),
    artisan: new ArtisanScene(),
    treasure: new TreasureScene(),
    remove_card: new RemoveCardScene(),
    victory: new VictoryScene(),
    defeat: new DefeatScene(),
  };
  currentScene = scenes[gs.scene];
  // 启动时同步深渊引擎的"上一场景"基准，避免首次切换路径检测误判
  if (abyss) abyss._lastScene = gs.scene;
  currentScene.enter();
}

// ==================== 独立卡牌绘制函数（供所有场景共用） ====================

// ---- 3D 卡牌透视倾斜（hover 抬起 + 阴影偏移）----
// applyCardTilt3D(tiltX, tiltY)：在已 translate 到卡牌中心并 scale 之后调用，
//   施加 3D 旋转的正交投影仿射矩阵（物理正确的刚体旋转投影，非简单缩放）。
//   tiltX = 绕 X 轴旋转（鼠标上下驱动，正=顶向后），tiltY = 绕 Y 轴旋转（鼠标左右驱动，正=右向后）
//   矩阵推导：R = Ry(tiltY)·Rx(tiltX)，取 (x,y) 屏幕投影 → x'=cosY·x + sinX·sinY·y, y'=cosX·y
function applyCardTilt3D(tiltX, tiltY) {
  let cosY = Math.cos(tiltY), sinY = Math.sin(tiltY);
  let cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
  // p5 applyMatrix(a,b,c,d,e,f): x'=a·x+c·y+e, y'=b·x+d·y+f
  applyMatrix(cosY, 0, sinX * sinY, cosX, 0, 0);
}
// applyCardSheen3D(strength, tiltX, tiltY)：倾斜时在朝光边缘加一道高光（顶部受光），
//   用 drawingContext 线性渐变绘制，save/restore 包裹防止状态泄漏。
function applyCardSheen3D(strength, tiltX, tiltY) {
  if (strength < 0.05) return;
  let ctx = drawingContext;
  ctx.save();
  // 顶光强度随前倾（tiltX<0=顶向前）增强
  let topLight = clamp(-tiltX / 0.32, 0, 1) * 0.5 + 0.5;
  let a = 70 * strength * topLight;
  let grad = ctx.createLinearGradient(0, -CARD_H / 2, 0, CARD_H / 2);
  grad.addColorStop(0, 'rgba(255,255,255,' + (a / 255).toFixed(3) + ')');
  grad.addColorStop(0.35, 'rgba(255,255,255,0)');
  grad.addColorStop(1, 'rgba(0,0,0,' + (40 * strength / 255).toFixed(3) + ')');
  ctx.fillStyle = grad;
  // 圆角裁剪到卡牌范围，避免高光溢出
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
  else ctx.rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H);
  ctx.fill();
  ctx.restore();
}
// computeCardTilt(ccx, ccy, cardScale, hoverEase)：根据鼠标相对卡牌中心的位置
//   计算倾斜角与方向阴影偏移，返回 {tiltX, tiltY, shadowOffX, shadowOffY}
function computeCardTilt(ccx, ccy, cardScale, hoverEase) {
  const MAX_TILT = 0.32; // ~18°
  let halfW = Math.max(1, (CARD_W * (cardScale || 1)) / 2);
  let halfH = Math.max(1, (CARD_H * (cardScale || 1)) / 2);
  let dx = clamp((mx() - ccx) / halfW, -1, 1);  // -1..1，正=鼠标在右
  let dy = clamp((my() - ccy) / halfH, -1, 1);  // -1..1，正=鼠标在下
  let tiltX = -dy * MAX_TILT * hoverEase;        // 鼠标在下→顶向前
  let tiltY = dx * MAX_TILT * hoverEase;         // 鼠标在右→右向后
  // 阴影方向：卡牌倾向鼠标，阴影落向反方向（光从上前方来）
  let shadowOffX = -dx * 16 * hoverEase;
  let shadowOffY = -dy * 8 * hoverEase;
  return { tiltX, tiltY, shadowOffX, shadowOffY };
}

function drawCardVisual(card, cx, cy, cardScale) {
  push();
  try {
  translate(cx, cy);
  scale(cardScale || 1);
  let c = (card && card.cost != null) ? card.cost : 0;
  let cs = gs.combatState;
  if (cs && card.keywords && card.keywords.includes('先攻') && cs.cardsPlayedThisTurn && cs.cardsPlayedThisTurn.length === 0) c = Math.max(0, c - 1);
  if (gs.hasRelic && gs.hasRelic('first_strike_charm') && cs && cs.cardsPlayedThisTurn && cs.cardsPlayedThisTurn.length === 0) c = Math.max(0, c - 1);
  // T183 深度思考折扣：与 canPlayCard (L4384) / playCard (L4407) 的 _discountCost 折扣保持一致
  if (card._discountCost) c = Math.max(0, c - card._discountCost);
  // 阴影
  fill(0, 60);
  noStroke();
  rect(-CARD_W / 2 + 3, -CARD_H / 2 + 3, CARD_W, CARD_H, 10);
  // 卡牌主体
  let cardColor = card.color || COLORS.gold;
  let cr = (typeof cardColor === 'string' && cardColor.startsWith('#')) ? hexToRgb(cardColor) : (COLORS_RGB[cardColor] || COLORS_RGB.gold); // 预转换为 RGB 三元组避免 p5.js hex 解析阻塞
  fill(Math.floor(cr.r * 0.15), Math.floor(cr.g * 0.15), Math.floor(cr.b * 0.15));
  stroke(cr.r, cr.g, cr.b);
  strokeWeight(1.5);
  rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
  // 内边框
  stroke(cr.r, cr.g, cr.b);
  strokeWeight(0.5);
  noFill();
  rect(-CARD_W / 2 + 6, -CARD_H / 2 + 6, CARD_W - 12, CARD_H - 12, 6);
  // 卡牌独特图案（根据类型和关键词绘制怪诞艺术图样）
  push();
  noStroke();
  let artY = 10; // 图案中心Y
  let artR = 25;  // 图案半径
  if (card.type === 'attack') {
    // 攻击牌：交叉刀刃图案
    stroke(cr.r, cr.g, cr.b, 60);
    strokeWeight(1.5);
    noFill();
    line(-artR, artY - artR, artR, artY + artR);
    line(artR, artY - artR, -artR, artY + artR);
    // 中心宝石
    noStroke();
    fill(Math.floor(cr.r * 0.3), Math.floor(cr.g * 0.3), Math.floor(cr.b * 0.3));
    ellipse(0, artY, 8, 8);
    fill(cr.r, cr.g, cr.b, 100);
    ellipse(0, artY, 4, 4);
  } else if (card.type === 'skill') {
    // 技能牌：符文圆环
    noFill();
    stroke(cr.r, cr.g, cr.b, 60);
    strokeWeight(1.5);
    ellipse(0, artY, artR * 2, artR * 2);
    ellipse(0, artY, artR * 1.4, artR * 1.4);
    // 6 符文点（卡牌色调 alpha 80）
    noStroke();
    fill(cr.r, cr.g, cr.b, 80);
    for (let i = 0; i < 6; i++) {
      let a = (i / 6) * Math.PI * 2;
      ellipse(Math.cos(a) * artR, artY + Math.sin(a) * artR, 2.5, 2.5);
    }
    // 中心宝石（外光晕+内白色高光，对齐 attack/power 中心宝石）
    noStroke();
    fill(Math.floor(cr.r * 0.3), Math.floor(cr.g * 0.3), Math.floor(cr.b * 0.3));
    ellipse(0, artY, 8, 8);
    fill(cr.r, cr.g, cr.b, 100);
    ellipse(0, artY, 4, 4);
  } else if (card.type === 'power') {
    // 能力牌：六芒星几何
    // 第1层：双三角六芒星主体（实线，颜色与卡牌色调一致 cr.r/g/b）
    noFill();
    stroke(cr.r, cr.g, cr.b, 60);
    strokeWeight(1.5);
    for (let i = 0; i < 2; i++) {
      beginShape();
      for (let j = 0; j < 3; j++) {
        let a = (j / 3) * Math.PI * 2 + (i ? Math.PI : 0);
        vertex(Math.cos(a) * artR, artY + Math.sin(a) * artR);
      }
      endShape(CLOSE);
    }
    // 第2层：内六边形高亮（双三角相交区域，卡牌色调 alpha 30）
    noStroke();
    fill(cr.r, cr.g, cr.b, 30);
    beginShape();
    for (let j = 0; j < 6; j++) {
      let a = (j / 6) * Math.PI * 2;
      vertex(Math.cos(a) * artR * 0.5, artY + Math.sin(a) * artR * 0.5);
    }
    endShape(CLOSE);
    // 第3层：6 顶点小宝石（卡牌色调 alpha 140）
    noStroke();
    fill(cr.r, cr.g, cr.b, 140);
    for (let i = 0; i < 6; i++) {
      let a = (i / 6) * Math.PI * 2;
      let px = Math.cos(a) * artR;
      let py = artY + Math.sin(a) * artR;
      ellipse(px, py, 3, 3);
    }
    // 第4层：中心宝石（外光晕+内白色高光，对齐 attack 中心宝石）
    noStroke();
    fill(Math.floor(cr.r * 0.3), Math.floor(cr.g * 0.3), Math.floor(cr.b * 0.3));
    ellipse(0, artY, 8, 8);
    fill(cr.r, cr.g, cr.b, 100);
    ellipse(0, artY, 4, 4);
  }
  // 关键词特效图案
  if (card.keywords && card.keywords.length > 0) {
    card.keywords.forEach((kw, ki) => {
      let ky = artY + artR + 8 + ki * 6;
      noStroke();
      if (kw === '先攻') {
        // 闪电纹
        fill(cr.r, cr.g, cr.b, 200);
        noStroke();
        beginShape();
        vertex(-3, ky - 6);   // 0: 顶左起点
        vertex( 1, ky - 1);   // 1: 中右折点
        vertex(-1, ky - 1);   // 2: 中左回扣
        vertex( 3, ky + 6);   // 3: 底右终点
        vertex(-1, ky + 1);   // 4: 中左下回扣
        vertex( 1, ky + 1);   // 5: 中右下收尾
        endShape(CLOSE);
      } else if (kw === '连击') {
        // 连锁环
        noFill(); stroke(cr.r, cr.g, cr.b, 80); strokeWeight(1);
        ellipse(-4, ky, 5, 5); ellipse(4, ky, 5, 5);
      } else if (kw === '猛击') {
        // 爆裂纹
        fill(cr.r, cr.g, cr.b, 80);
        for (let r = 0; r < 4; r++) {
          let a = (r / 4) * Math.PI * 2;
          ellipse(Math.cos(a) * 5, ky + Math.sin(a) * 3, 2, 2);
        }
      } else if (kw === '流转') {
        // 旋转纹
        noFill(); stroke(cr.r, cr.g, cr.b, 80); strokeWeight(1);
        arc(0, ky, 8, 8, 0, Math.PI * 1.5);
      } else if (kw === '震慑' || kw === '异常') {
        // 震慑：菱形；异常：圆点
        fill(cr.r, cr.g, cr.b, 80);
        if (kw === '震慑') {
          push();
          translate(0, ky);
          rotate(PI / 4);
          rect(-3, -3, 6, 6);
          pop();
        } else {
          ellipse(0, ky, 5, 5);
        }
      }
    });
    // 取消描边防止污染 text()
    noStroke();
  }
  pop();
  // 装饰角
  fill(cr.r, cr.g, cr.b);
  noStroke();
  let cornerSize = 8;
  [-1, 1].forEach(sx => {
    [-1, 1].forEach(sy => {
      ellipse(sx * (CARD_W / 2 - 10), sy * (CARD_H / 2 - 10), cornerSize, cornerSize);
    });
  });
  // 费用
  fill(cr.r, cr.g, cr.b);
  noStroke();
  ellipse(-CARD_W / 2 + 20, -CARD_H / 2 + 20, 26, 26);
  fill(0);
  textAlign(CENTER, CENTER);
  textSize(16);
  textStyle(BOLD);
  text(c, -CARD_W / 2 + 20, -CARD_H / 2 + 20);
  // 升级标记
  if (card.upgraded) {
    cFill('goldBright');
    textSize(10);
    text('+', -CARD_W / 2 + 20, -CARD_H / 2 + 40);
  }
  // 卡牌名称
  fill(cr.r, cr.g, cr.b);
  textSize(12);
  textStyle(BOLD);
  let nameMaxW = CARD_W - 20;
  let nameH = 16;
  drawCenteredText(card.name || '???', 0, -CARD_H / 2 + 28, nameMaxW, nameH, 14);
  // 类型
  fill(cr.r, cr.g, cr.b);
  textSize(9);
  let typeText = card.type === 'attack' ? '攻击' : (card.type === 'skill' ? '技能' : (card.type === 'power' ? '能力' : '能力'));
  textAlign(CENTER, TOP);
  text(typeText, 0, -CARD_H / 2 + 28 + nameH + 2);
  // 分隔线
  stroke(cr.r, cr.g, cr.b);
  strokeWeight(0.5);
  let sepY = -CARD_H / 2 + 28 + nameH + 18;
  line(-CARD_W / 2 + 15, sepY, CARD_W / 2 - 15, sepY);
  // 描述
  let descSource = (card.upgraded && card.upgradedDesc) ? card.upgradedDesc : (card.desc || '');
  let desc = descSource
    .replace('{dmg}', card.baseDmg || 0)
    .replace('{block}', card.baseBlock || 0);
  if (card.comboBonus !== undefined) desc = desc.replace('{combo_bonus}', card.comboBonus);
  if (card.comboBlock !== undefined) desc = desc.replace('{combo_block}', card.comboBlock);
