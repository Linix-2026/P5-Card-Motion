  drawEnemyIntent() {
    let cs = gs.combatState;
    if (!this.enemyIntent || cs.turnPhase !== 'player') return;
    let ix = GAME_W * 0.65;
    // 意图栏位相对坐标：以敌方血条/状态栏为锚点，根据是否有异常/增益状态动态上移或下移
    let ex = GAME_W * 0.65;
    let ey = GAME_H * 0.38;
    let enemySize = cs.enemyData.size || 60;
    // 状态栏底部 Y 坐标（drawEnemy 中状态图标位于 ey - size - 42）
    let statusRowY = ey - enemySize - 42;
    // 检测敌方是否有异常状态或增益/减益效果
    let hasStatus = false;
    if (cs.enemyStunStacks > 0) hasStatus = true;
    if (cs._enemyStrength > 0) hasStatus = true;
    if (cs.enemyStatuses) {
      for (let k in cs.enemyStatuses) {
        if (cs.enemyStatuses[k] > 0) { hasStatus = true; break; }
      }
    }
    // 有状态时意图栏上移（避免遮挡状态栏），无状态时下移（贴近血条）
    let targetY = hasStatus ? (statusRowY - 40) : (ey - enemySize - 45);
    // 首次进入时直接定位，之后用 dampApproach 缓动
    if (this.intentAnimY === null) {
      this.intentAnimY = targetY;
    } else {
      let dt = Math.min(deltaTime || 16, 50);
      this.intentAnimY = dampApproach(this.intentAnimY, targetY, 0.15, dt);
    }
    let iy = this.intentAnimY;
    push();
    translate(ix, iy);
    fill(22, 22, 42, 210);
    stroke(42, 26, 58, 200);
    strokeWeight(1);
    rect(-60, -10, 120, 28, 6);
    let intentText = '';
    switch (this.enemyIntent.type) {
      case 'attack': intentText = `⚔ 攻击 ${this.enemyIntent.dmg || 0}`; break;
      case 'defend': intentText = `🛡 防御 ${this.enemyIntent.block || 0}`; break;
      case 'buff': intentText = `⬆ 增益`; break;
      case 'debuff': intentText = `⬇ 减益`; break;
      case 'heal': intentText = `❤ 治疗`; break;
      default: intentText = '???';
    }
    cFill('white');
    textAlign(CENTER, CENTER);
    textSize(12);
    textStyle(BOLD);
    text(`意图: ${intentText}`, 0, 4);
    pop();
  }
  // T194：获取/初始化奖励卡牌动画状态（与 drawCardGridCommon 的 getDeckCardState 同套模式）
  getRewardCardState(card, idx) {
    if (!card || !card.id) return { scale: 1, rotation: 0, hoverProgress: 0, liftY: 0, microRot: 0, microRotPhase: 0 };
    if (!this.rewardCardStates) this.rewardCardStates = {};
    let key = 'reward_' + idx;
    if (!this.rewardCardStates[key]) {
      this.rewardCardStates[key] = {
        scale: 1,
        rotation: 0,
        hoverProgress: 0,
        liftY: 0,
        microRot: rand(-3, 3) * Math.PI / 180,
        microRotPhase: rand(0, Math.PI * 2),
      };
    }
    return this.rewardCardStates[key];
  }
  drawRewardScreen() {
    fill(0, 160);
    noStroke();
    rect(0, 0, GAME_W, GAME_H);
    cFill('panel');
    cStroke('gold');
    strokeWeight(2);
    // T196：面板高度 460→480，给顶部 "可领取 N 张" 状态文本让出不被卡牌覆盖的安全区
    rect(GAME_W / 2 - 300, GAME_H / 2 - 240, 600, 480, 12);
    // T196：状态文本（"可领取 N 张"）从 y=-145（卡牌区域内）上移至 y=-220（title 上方，避开卡牌 hover 时 -207 的顶部）
    cFill('goldDim');
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(13);
    textStyle(BOLD);
    let pickN = this.pendingRewards?.cardsToPick || 1;
    let picked = this.pendingRewards?.cardsClaimed?.length || 0;
    text(`可领取 ${pickN} 张卡牌（已选 ${picked}/${pickN}）`, GAME_W / 2, GAME_H / 2 - 220);
    textStyle(NORMAL);
    cFill('gold');
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    // T196：title 同步下移 -200→-195 给状态文本让出空间
    text('战斗胜利奖励', GAME_W / 2, GAME_H / 2 - 195);
    cFill('text');
    // T196：gold 文本下移 -175→-170 保持间距
    textSize(14);
    text(`获得金币: ${this.pendingRewards?.gold || 0}`, GAME_W / 2, GAME_H / 2 - 170);
    // 奖励卡牌
    if (this.pendingRewards) {
      // T194：奖励卡牌动效（与 drawCardGridCommon 完全对齐：hover 阻尼 / 3D 倾斜 / 动态阴影 / 3D 高光 / 镭射覆膜 / 高亮边框）
      const dtReward = deltaTime || 16.67;
      for (let i = 0; i < this.pendingRewards.cards.length; i++) {
        let card = this.pendingRewards.cards[i];
        let rx = GAME_W / 2 + (i - 1) * 170;
        let ry = GAME_H / 2 - 65;
        let hovered = this.hoveredRewardIdx === i;
        let state = this.getRewardCardState(card, i);
        // hover 阻尼（k=0.25 防止 NaN）
        let targetHover = hovered ? 1 : 0;
        state.hoverProgress = dampApproach(state.hoverProgress, targetHover, 0.25, dtReward);
        if (isNaN(state.hoverProgress) || state.hoverProgress < 0) state.hoverProgress = 0;
        if (state.hoverProgress > 1) state.hoverProgress = 1;
        let hoverEase = easeOutCubic(state.hoverProgress);
        // scale 独立 dampApproach
        let targetScale = 1 + 0.12 * hoverEase;
        state.scale = dampApproach(state.scale || 1, targetScale, 0.3, dtReward);
        // rotation：悬停→0，非悬停→microRot + sin drift
        let driftRot = Math.sin(frameCount * 0.015 + state.microRotPhase) * 0.02;
        let nonHoverRot = state.microRot + driftRot;
        state.rotation = dampApproach(state.rotation, hovered ? 0 : nonHoverRot, 0.3, dtReward);
        // Y 偏移独立 dampApproach
        let targetLiftY = hovered ? -30 : 0;
        state.liftY = dampApproach(state.liftY || 0, targetLiftY, 0.3, dtReward);
        let cx = rx;
        let cy = ry + state.liftY;
        let scaleVal = state.scale;
        let totalRot = state.rotation;
        // 3D 倾斜：仅悬停卡牌按鼠标位置透视倾斜
        let tilt = hovered ? computeCardTilt(cx, cy, scaleVal, hoverEase) : { tiltX:0, tiltY:0, shadowOffX:0, shadowOffY:0 };
        // 阴影按 hoverEase 渐变
        if (hoverEase > 0.01) {
          drawCardShadowGlobal(cx + tilt.shadowOffX, cy + tilt.shadowOffY, 30 * hoverEase, scaleVal, totalRot);
        }
        // 卡牌主体（push/pop 必须配对，避免矩阵栈泄漏）
        push();
        try {
          translate(cx, cy);
          rotate(totalRot);
          scale(scaleVal);
          applyCardTilt3D(tilt.tiltX, tilt.tiltY);
          this.drawCardAt(card, 0, 0, 0, 1);
          applyCardSheen3D(hoverEase, tilt.tiltX, tilt.tiltY);
          // T199：遮罩同步跟随卡牌变换（参考手牌 L7246-L7250/L7291-L7295 在 push/translate/rotate/scale 之后 drawCardAt 之后绘制）
          // 关键：遮罩必须绘在 push 块内才能继承 rotate(state.rotation) → 让"已选择"/灰色遮罩与卡牌 microRot + sin drift 同步
          // 已选卡（含"已选择"文字）
          if (this.pendingRewards.cardsClaimed.includes(i)) {
            noStroke();
            fill(0, 150);
            rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 6);
            cFill('textDim');
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(14);
            text('已选择', 0, 0);
          }
          // 达限额未选卡（无文字；与 T197 一致 fill(0,150) rect r=6）
          else if (this.pendingRewards.cardsClaimed.length >= this.pendingRewards.cardsToPick) {
            noStroke();
            fill(0, 150);
            rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 6);
          }
        } finally {
          pop();
        }
        // 镭射效果（特殊卡牌）
        if (isSpecialCardGlobal(card)) {
          drawCardLaserGlobal(scaleVal, cx, cy, totalRot, hovered);
        }
        // hover 高亮边框（宽高乘以 scaleVal 同步缩放）
        if (hovered) {
          cStroke('gold', 200);
          strokeWeight(2.5);
          noFill();
          let hlW = CARD_W * scaleVal + 8;
          let hlH = CARD_H * scaleVal + 8;
          rect(cx - hlW / 2, cy - hlH / 2, hlW, hlH, 12);
        }
      }
      // T199：旧的"已选择"和"达限额未选"遮罩已移入主循环 push/pop 块内（L7903-L7921），自动继承卡牌变换
      // 此处不再需要单独的遮罩循环
      // ===== 新增：遗物领取区域 =====
      if (this.pendingRewards.relic) {
        push();
        let relic = this.pendingRewards.relic;
        let relicX = GAME_W / 2;
        let relicY = GAME_H / 2 + 115;
        let relicW = 280;
        let relicH = 90;
        noStroke();
        cFill('goldDim');
        textSize(13);
        textStyle(BOLD);
        // 标题位置
        text('遗物奖励', GAME_W / 2, GAME_H / 2 + 55);
        textStyle(NORMAL);
        // 遗物卡片背景
        let relicHovered = this.hoveredRelicReward === true;
        cFill(this.pendingRewards.relicClaimed ? 'bgLight' : (relicHovered ? 'panel' : 'bgLight'));
        cStroke(this.pendingRewards.relicClaimed ? 'panelEdge' : (relicHovered ? 'goldBright' : 'goldDim'));
        strokeWeight(this.pendingRewards.relicClaimed ? 1 : (relicHovered ? 2.5 : 1.5));
        rect(relicX - relicW / 2, relicY - relicH / 2, relicW, relicH, 10);
        noStroke();
        // 遗物立绘
        drawRelicVisual(relic, relicX - 95, relicY, 50);
        // 遗物名称
        cFill('text');
        noStroke();
        textAlign(LEFT, CENTER);
        textSize(13);
        textStyle(BOLD);
        text(relic.name, relicX - 50, relicY - 18);
        textStyle(NORMAL);
        // 遗物描述
        cFill('textDim');
        textSize(10);
        drawCenteredText(relic.desc || '', relicX + 25, relicY + 8, 160, 45, 10);
        // 已领取遮罩
        if (this.pendingRewards.relicClaimed) {
          noStroke();
          fill(0, 130);
          rect(relicX - relicW / 2, relicY - relicH / 2, relicW, relicH, 10);
          cFill('textDim');
          noStroke();
          textAlign(CENTER, CENTER);
          textSize(16);
          textStyle(BOLD);
          text('已领取', relicX, relicY);
          textStyle(NORMAL);
        }
        // hover提示
        if (!this.pendingRewards.relicClaimed && relicHovered) {
          noStroke();
          cFill('gold', 50);
          rect(relicX - relicW / 2, relicY - relicH / 2, relicW, relicH, 10);
        }
        pop();
      }
    }
    // 跳过/完成按钮
    let skipX = GAME_W / 2 - 50;
    let skipY = GAME_H / 2 + 185;
    let allDone = !this.pendingRewards || (
      (this.pendingRewards.cards.length === 0 || this.pendingRewards.cardsClaimed.length >= this.pendingRewards.cardsToPick) &&
      (this.pendingRewards.relic == null || this.pendingRewards.relicClaimed)
    );
    let skipHovered = mx() > skipX && mx() < skipX + 100 && my() > skipY && my() < skipY + 35;
    this.skipBtn = { x: skipX, y: skipY, w: 100, h: 35, hovered: skipHovered };
    // T200：参考"结束回合"按钮反色翻转（hover=金底黑字，rest=panel+金/暗文字）+ 阻尼缓动
    if (this._skipBtnHoverProgress === undefined) this._skipBtnHoverProgress = 0;
    let targetHover = skipHovered ? 1 : 0;
    this._skipBtnHoverProgress = dampApproach(this._skipBtnHoverProgress, targetHover, 0.3, deltaTime || 16.67);
    // h<0.5 用 rest 状态（基于 allDone），h>=0.5 用 hover 状态（参考结束回合 L7680-L7691 反色翻转）
    let hHover = this._skipBtnHoverProgress >= 0.5;
    if (hHover) {
      // 悬停态（与结束回合 L7681-L7690 一致：金底 + goldBright 描边 + 黑色加粗文字）
      cFill('gold');
      cStroke('goldBright');
      strokeWeight(1.5);
      rect(skipX, skipY, 100, 35, 6);
      fill(0);
    } else {
      // 静态态（基于 allDone：可完成时金描边+金文字，未达标时 textDim 灰）
      cFill('panel');
      cStroke(allDone ? 'gold' : 'textDim');
      strokeWeight(1);
      rect(skipX, skipY, 100, 35, 6);
      cFill(allDone ? 'gold' : 'textDim');
    }
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(14);   // T200：12→14（接近结束回合 18 但适配 100x35 较小按钮）
    textStyle(BOLD);
    text(allDone ? '完成' : '跳过', skipX + 50, skipY + 17.5);
    textStyle(NORMAL);

    // —— AI 构筑导师按钮：玩家显式点击才发起调用 ——
    // 这是"按需收费"最直接的落点：不点就不调用，不调用就永远不产生费用。
    let aiX = GAME_W / 2 + 80, aiY = GAME_H / 2 + 185, aiW = 120, aiH = 35;
    let aiHovered = mx() > aiX && mx() < aiX + aiW && my() > aiY && my() < aiY + aiH;
    this.aiAdvisorBtn = { x: aiX, y: aiY, w: aiW, h: aiH };
    cFill(aiHovered ? 'purpleBright' : 'panel');
    cStroke(aiSys.enabled ? 'purpleBright' : 'textDim');
    strokeWeight(aiHovered ? 2 : 1);
    rect(aiX, aiY, aiW, aiH, 6);
    noStroke();
    cFill(aiSys.enabled ? (aiHovered ? 'bg' : 'purpleBright') : 'textDim');
    textAlign(CENTER, CENTER);
    textSize(13); textStyle(BOLD);
    text(aiSys.busy > 0 ? '求指引中…' : (aiSys.enabled ? '✦ AI 指引' : 'AI 已关闭'), aiX + aiW / 2, aiY + aiH / 2);
    textStyle(NORMAL);
    // 建议文案：拿到了才显示，未拿到不占位（避免面板跳动）
    if (this.aiAdvice) {
      drawAiLine(this.aiAdvice, GAME_W / 2, aiY - 18,
        { fromAi: this._adviceFromAi, size: 12, alpha: 235 });
    }
  }

  // 构筑导师：玩家显式点击才调用。AI 关闭时给本地建议并明确标注 —— 零调用、零费用。
  async requestAiAdvice() {
    if (this._adviceBusy) return;   // 防连点重复调用（每次调用都是真金白银）
    this._adviceBusy = true;
    const cards = (this.pendingRewards && this.pendingRewards.cards) || [];
    const local = () => aiPickLocal('advisor', (gs.floorNumber || 0) + cards.length);
    if (!aiSys.enabled) {
      // 不再拼「（本地建议 · AI 关闭）」后缀：来源已由**明度**表达，按钮上也写着「AI 已关闭」。
      //   文字里塞实现状态，是拿工程术语打断叙事。
      this.aiAdvice = local();
      this._adviceFromAi = false;
      this._adviceBusy = false;
      return;
    }
    const listTxt = cards.map((c, i) => `${i + 1}.${c.name}(${c.cost}费):${String(c.desc || '').slice(0, 20)}`).join(' | ');
    const ctx = `可选卡牌: ${listTxt} || 当前卡组${gs.deck ? gs.deck.length : 0}张 难度=${getDifficulty().name}`;
    const r = await aiRequest('advisor', aiMessages(AI_SYS_PROMPT.advisor, ctx), local);
    this.aiAdvice = String(r.text || local()).slice(0, 46);
    this._adviceFromAi = !!r.fromAi;
    this._adviceBusy = false;
  }

  mousePressed() {
    // T244：战报浮层中点击任意处 = 提前收起进奖励 —— 不想看的玩家一秒都不用等
    if (this.showRunRecap) { this._closeRunRecap(); return; }
    if (this.battleEnding) return;
    let cs = gs.combatState;
    // 奖励界面选择
    if (this.showRewardScreen) {
      if (this.pendingRewards) {
        // 卡牌领取（领取后不关闭，等待完成按钮；T195：支持 3选2 多次领取，已领取不可重复；T196：补 cardsToPick 上限守卫，避免 3选1 实际能选 3 张）
        if (this.hoveredRewardIdx >= 0 && 
            !this.pendingRewards.cardsClaimed.includes(this.hoveredRewardIdx) &&
            this.pendingRewards.cardsClaimed.length < this.pendingRewards.cardsToPick) {
          let card = this.pendingRewards.cards[this.hoveredRewardIdx];
          gs.addCard(card);
          audio.playSFX('card_play');
          this.pendingRewards.cardsClaimed.push(this.hoveredRewardIdx);
          return;
        }
        // 遗物领取（领取后不关闭，等待完成按钮）
        if (this.hoveredRelicReward && this.pendingRewards.relic && !this.pendingRewards.relicClaimed) {
          gs.relics.push(this.pendingRewards.relic);
          audio.playSFX('victory');
          floatingTexts.add(GAME_W / 2, GAME_H / 2 + 95, `✧ 获得遗物: ${this.pendingRewards.relic.name}`, COLORS.gold, 16);
          this.pendingRewards.relicClaimed = true;
          return;
        }
      }
      // AI 构筑导师按钮（玩家显式点击 → 才发起调用 → 才可能产生费用）
      if (this.aiAdvisorBtn) {
        let b = this.aiAdvisorBtn;
        if (mx() > b.x && mx() < b.x + b.w && my() > b.y && my() < b.y + b.h) {
          this.requestAiAdvice();
          return;
        }
      }
      // 跳过/完成按钮
      if (this.skipBtn && this.skipBtn.hovered) {
        this.finishReward();
        return;
      }
      return;
    }
    // 点击卡牌
    if (cs.turnPhase === 'player' && this.hoveredCard && this.canPlayCard(this.hoveredCard)) {
      this.playCard(this.hoveredCard);
      return;
    }
    // 结束回合
    if (this.endTurnBtn && this.endTurnBtn.hovered && cs.turnPhase === 'player') {
      // 回合结束丢弃手牌
      let newHand = [];
      for (let h of cs.hand) {
        if (h.destroy) {
          // 销毁卡直接删除
        } else {
          cs.discardPile.push(h);
        }
      }
      cs.hand = newHand;
      // 清空本回合临时伤害 buff
      gs.tempDamageBuff = 0;
      // 敌人格挡在敌方回合开始时重置（与玩家格挡在玩家回合开始时重置对称）
      // 上一轮敌方格挡已在玩家回合中被攻击消耗，此处清零以为新一轮格挡腾位
      cs.enemyBlock = 0;
      cs.turnPhase = 'enemy';
      this.enemyTurnDelay = 0;
      this.cardAnimations = [];
      return;
    }
  }
  // T208：敌人悬停检测（专用方法，避免 mousePressed 异步事件依赖 draw 帧采样的 hovered 状态）
  // 实时计算鼠标与敌人的距离，落在判定圈内则置 hoveredEnemy = enemyData
  mouseMoved() {
    let cs = gs.combatState;
    if (!cs || !cs.enemyData || cs.enemyHp <= 0) {
      this.hoveredEnemy = null;
      return;
    }
    // 跳过奖励界面、结束动画期间的悬停检测（避免误触）
    if (this.showRewardScreen || this.battleEnding) {
      this.hoveredEnemy = null;
      return;
    }
    let ex = GAME_W * 0.65 + this.enemyAnim.shakeX;
    let ey = GAME_H * 0.38 + this.enemyAnim.shakeY;
    let size = cs.enemyData.size || 60;
    let dx = mx() - ex;
    let dy = my() - ey;
    // 判定圈：size * 1.2（与视觉主体一致，比字面 size 略宽以兼容触手/粒子等延伸元素）
    let hitR = size * 1.2;
    this.hoveredEnemy = (dx * dx + dy * dy < hitR * hitR) ? cs.enemyData : null;
  }
  finishReward() {
    this.showRewardScreen = false;
    this.pendingRewards = null;
    // T194：清理奖励界面卡牌动画状态（避免下次开屏前残留）
    this.rewardCardStates = {};
    let node = this.findCurrentNode();
    if (node?.type === 'boss') {
      // Boss 击败：检查是否还有下一区域
      // PHASE 3：无尽回响开启后永远为真 —— 层数不再有上限
      if (echoHasNextRegion()) {
        // 进入下一区域，触发过渡叙事
        gs.currentRegion++;
        gs.currentLayer = 0;
        gs.currentNodeId = null;
        gs.floorNumber++;
        echoMarkDepth();   // PHASE 3：击败 Boss 跨区域后刷新最深纪录
        gs.regionTransition = { active: true, timer: 240, region: gs.currentRegion };
        gs.scene = 'map';
      } else {
        // 全部区域 Boss 已击败，全局胜利
        gs.scene = 'victory';
      }
    } else {
      // 非 Boss 战斗：层级已在 MapScene.mousePressed 中递增，直接返回地图
      gs.scene = 'map';
    }
  }
}

// 获取或创建牌库卡牌动画状态
function getDeckCardState(card) {
  // 防御性初始化：防止 gameState 重置或未初始化时 TypeError 导致 drawingContext.save 矩阵栈泄漏卡死
  if (!gs.deckCardStates) gs.deckCardStates = {};
  if (!card || !card.id) return { offsetY: 0, scale: 1, rotation: 0, hoverProgress: 0, microRot: 0, microRotPhase: 0 };
  // T251：复合 key = card.id + 实例身份；身份优先数字 uid（reset/addCard 保证唯一），召唤实例退回 _uid（r 前缀）
  // 同 id 卡（含「触碰镜面」复制牌）各自独立，老存档中 _uid 已相同的复制牌也据此立刻分开
  let instId = card.uid != null ? 'n' + card.uid : 'r' + (card._uid || (card._uid = Math.random().toString(36).substr(2, 6)));
  let key = card.id + '_' + instId;
  if (!gs.deckCardStates[key]) {
    gs.deckCardStates[key] = {
      offsetY: 0,                                   // 牌库不用 offsetY 但保持字段对齐
      scale: 1,                                      // 当前缩放（基础1，绘制时乘 cardScale）
      rotation: 0,                                   // 当前旋转角度
      hoverProgress: 0,                              // 悬停进度 0-1
      microRot: rand(-3, 3) * Math.PI / 180,         // 随机微旋转（-3°~+3°，同手牌 L3567）
      microRotPhase: rand(0, Math.PI * 2),           // sin漂移相位（同手牌 L3568）
    };
  }
  return gs.deckCardStates[key];
}

// ==================== 全局卡牌辅助函数 ====================

// 判断卡牌是否为特殊卡牌（拥有镭射特效）
function isSpecialCardGlobal(card) {
  if (!card) return false;
  if (card.upgraded) return true;
  if (card.keywords && card.keywords.some(k => ['先攻', '流转', '震慑', '异常'].includes(k))) return true;
  if (card.rarity === 'rare') return true;
  return false;
}

// 绘制卡牌动态阴影（多层矩形+遮挡感知）
function drawCardShadowGlobal(x, y, liftAmount, cardScale, rotation) {
  push();
  noStroke();
  let s = cardScale || 1;
  let rot = rotation || 0;
  let liftFactor = clamp(liftAmount / 50, 0, 1);
  let shadowScale = 1 + liftFactor * 0.05;
  let baseAlpha = 60 - liftFactor * 20;
  translate(x, y);
  rotate(rot);
  scale(s * shadowScale);
  let layers = [
    { offX: 8 + liftFactor * 4, offY: 16 + liftFactor * 8, alpha: 15 - liftFactor * 5 },
    { offX: 6 + liftFactor * 3, offY: 12 + liftFactor * 6, alpha: 25 - liftFactor * 8 },
    { offX: 4 + liftFactor * 2, offY: 8 + liftFactor * 4, alpha: 40 - liftFactor * 10 },
  ];
  layers.forEach(layer => {
    fill(0, Math.max(5, layer.alpha));
    rect(-CARD_W / 2 + layer.offX, -CARD_H / 2 + layer.offY, CARD_W, CARD_H, 10);
  });
  fill(0, baseAlpha);
  rect(-CARD_W / 2 + 2, -CARD_H / 2 + 4, CARD_W, CARD_H, 10);
  pop();
}

// 绘制镭射覆膜效果
function drawCardLaserGlobal(cardScale, cardCx, cardCy, cardRotation, isHovered) {
  push();
  // translate 到卡牌中心坐标系
  translate(cardCx, cardCy);
  rotate(cardRotation || 0);
  blendMode(ADD);
  noStroke();
  let s = cardScale || 1;
  let hueSpeed = isHovered ? 1.0 : 0.5;
  let baseHue = (frameCount * hueSpeed) % 360;
  let brightBoost = isHovered ? 1.3 : 1.0;
  let cardW = CARD_W * s;
  let cardH = CARD_H * s;
  colorMode(HSB, 360, 100, 100, 100);
  // 简化：仅画对角线全息光带 + 像素化光栅，非战斗场景无鼠标交互
  let pixSize = 4;
  let gap = 1;
  let bandWidth = isHovered ? 20 : 14;
  let bandPos = Math.sin(frameCount * 0.02) * 0.5; // 缓慢左右漂移
  let bandCenter = bandPos * (cardW + cardH) * 0.25;
  for (let py = -cardH / 2; py < cardH / 2; py += pixSize + gap) {
    for (let px = -cardW / 2; px < cardW / 2; px += pixSize + gap) {
      let dist = Math.abs((px + py) - bandCenter);
      if (dist < bandWidth) {
        let hue = (baseHue + px * 0.5 + py * 0.5) % 360;
        let sat = 70;
        let bri = 90 * brightBoost;
        let alpha = (1 - dist / bandWidth) * 60;
        fill(hue, sat, bri, alpha);
        rect(px, py, pixSize, pixSize);
      }
    }
  }
  // 描边虹彩
  let edgeHue = (baseHue + 180) % 360;
  noFill();
  stroke(edgeHue, 60, 100, 80);
  strokeWeight(1.5);
  rect(-cardW / 2, -cardH / 2, cardW, cardH, 10);
  colorMode(RGB, 255);
  blendMode(BLEND);
  pop();
}

// 绘制升级效果悬停解释栏
// cardScreenX/cardScreenY 为卡牌中心屏幕坐标
function drawUpgradeTooltipGlobal(card, cardScreenX, cardScreenY) {
  if (!card || !card.upgradeable || card.upgraded) return;
  // 浅拷贝 + applyCardUpgrade 模拟升级后数值
  let projected = {...card};
  applyCardUpgrade(projected);
  let upgradedText = (card.upgradedDesc || '')
    .replace('{dmg}', projected.baseDmg || 0)
    .replace('{block}', projected.baseBlock || 0);
  if (projected.comboBonus !== undefined) upgradedText = upgradedText.replace('{combo_bonus}', projected.comboBonus);
  if (projected.comboBlock !== undefined) upgradedText = upgradedText.replace('{combo_block}', projected.comboBlock);
  if (projected.comboScale !== undefined) upgradedText = upgradedText.replace('{combo_scale}', projected.comboScale);
  if (projected.statusAmt !== undefined) {
    let effectiveAmt = getEffectiveStatusAmt(projected);
    upgradedText = upgradedText.replace('{burn}', effectiveAmt).replace('{freeze}', effectiveAmt).replace('{corrode}', effectiveAmt);
  }
  let tipW = 180;
  let tipH = 80;
  let tipX = cardScreenX + CARD_W / 2 + 10;
  if (tipX + tipW > GAME_W) tipX = cardScreenX - CARD_W / 2 - 10 - tipW;
  let tipY = clamp(cardScreenY - tipH / 2, 10, GAME_H - tipH - 10);
  push();
  translate(tipX + tipW / 2, tipY + tipH / 2);
  noStroke();
  fill(0, 220);
  rect(-tipW / 2, -tipH / 2, tipW, tipH, 8);
  cStroke('gold', 200);
  strokeWeight(1.5);
  noFill();
  rect(-tipW / 2, -tipH / 2, tipW, tipH, 8);
  noStroke();
  cFill('gold');
  textAlign(CENTER, TOP);
  textSize(13);
  textStyle(BOLD);
  text('升级效果', 0, -tipH / 2 + 8);
  noStroke();
  cFill('text');
  textSize(10);
  textStyle(NORMAL);
  drawCenteredText(upgradedText || '', 0, -tipH / 2 + 28, tipW - 16, 35, 11);
  noStroke();
  let hue = (frameCount * 0.5) % 360;
  colorMode(HSB, 360, 100, 100, 100);
  fill(hue, 70, 100, 80);
  textSize(9);
  text('升级后获得镭射覆膜特效', 0, tipH / 2 - 14);
  colorMode(RGB, 255);
  pop();
}

// ==================== 敌人信息栏（T208）====================
// 通用模块：所有敌人通过属性存在性动态分支，零硬编码敌人 ID
//   - 任何新增敌人只要带 statusImmune/elementParalysis/comboXxx/special 字段，自动获得对应解释
//   - 视觉：参考 drawUpgradeTooltipGlobal（L8241-8290）"黑底+金边+圆角"语言，零学习成本
//   - Icon：8 个程序绘制（盾牌/闪电/漩涡/循环箭头/齿轮/碎裂圆/眼睛/菱形），跨平台一致（不依赖 emoji 字体）

// 简易换行文本（左对齐，按字符切分，中英文混排；最多 maxLines 行，最后一行省略号）
function drawWrappedTextInBox(str, x, y, maxW, lineH, maxLines) {
  if (!str) return;
  let lines = [];
  let cur = '';
  let chars = str.split('');
  for (let i = 0; i < chars.length; i++) {
    let test = cur + chars[i];
    if (textWidth(test) > maxW && cur.length > 0) {
      lines.push(cur);
      cur = chars[i];
      if (lines.length >= maxLines) {
        let last = lines[lines.length - 1];
        while (textWidth(last + '...') > maxW && last.length > 0) last = last.slice(0, -1);
        lines[lines.length - 1] = last + '...';
        cur = '';
        break;
      }
    } else {
      cur = test;
    }
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  for (let i = 0; i < lines.length; i++) text(lines[i], x, y + i * lineH);
}

// 敌人悬停外描边（通用：脉冲金环 + 暗金虚线 + 4 个旋转菱形角点）
//   deathT: 死亡进度 0~1（null 表示未死亡，全 alpha）
function drawEnemyHoverOutline(ex, ey, size, deathT) {
  let alphaFactor = deathT != null ? (1 - Math.min(1, deathT)) : 1;
  push();
  translate(ex, ey);
  // 外层金环（脉冲呼吸 150±50 alpha）
  let pulseAlpha = (150 + Math.sin(frameCount * 0.05) * 50) * alphaFactor;
  cStroke('gold', pulseAlpha);
  strokeWeight(2.5);
  noFill();
  ellipse(0, 0, size * 2.3, size * 2.3);
  // 第二层暗金细环（虚线，提示"扫描"感）
  cStroke('goldDim', 120 * alphaFactor);
  strokeWeight(1);
  drawingContext.setLineDash([4, 3]);
  ellipse(0, 0, size * 2.5, size * 2.5);
  drawingContext.setLineDash([]);
  // 4 个角点装饰（旋转菱形，frameCount 驱动）
  let rot = frameCount * 0.02;
  cFill('goldBright', 220 * alphaFactor);
  noStroke();
  for (let i = 0; i < 4; i++) {
    let a = (i / 4) * Math.PI * 2 + rot;
    let dx = Math.cos(a) * size * 1.15;
    let dy = Math.sin(a) * size * 1.15;
    push();
    translate(dx, dy);
    rotate(a + PI / 4);
    rect(-2.5, -2.5, 5, 5);
    pop();
  }
  pop();
}

// 收集敌人能力列表（纯函数，便于测试 + 复用）
//   顺序：固定优先级（异常免疫 → 元素瘫痪 → 连击相关 → Boss 阶段 → 通用特殊）
//   优点：玩家每次悬停看到的能力顺序一致，减少认知负担
function collectEnemyAbilities(enemyData) {
  let abilities = [];
  // 1) 异常免疫
  if (enemyData.statusImmune && enemyData.statusImmune.length > 0) {
    abilities.push({
      iconType: 'shield',
      color: 'blueBright',
      label: `异常免疫 (${enemyData.statusImmune.join('/')})`,
      desc: `免疫 ${enemyData.statusImmune.join('、')} 等异常附着`
    });
  }
  // 2) 元素叠加瘫痪（克制方式：灼烧+腐蚀同时存在）
  if (enemyData.elementParalysis) {
    abilities.push({
      iconType: 'lightning',
      color: 'orangeBright',
      label: '元素叠加瘫痪',
      desc: '灼烧+腐蚀同时存在时跳过本回合行动'
    });
  }
  // 3) 连击易伤（克制方式：玩家连击>=阈值时双倍伤害）
  if (enemyData.comboVulnerable) {
    let th = enemyData.comboVulnerableThreshold || 2;
    abilities.push({
      iconType: 'crack',
      color: 'redBright',
      label: `连击易伤 (≥${th})`,
      desc: `玩家连击≥${th}时该敌人受双倍伤害（克制）`
    });
  }
  // 4) 连击吸取（反制连击）
  if (enemyData.comboSiphon) {
    let th = enemyData.comboSiphonThreshold || 3;
    abilities.push({
      iconType: 'vortex',
      color: 'purple',
      label: `连击吸取 (≥${th})`,
      desc: `玩家连击≥${th}时吸取连击计数`
    });
  }
  // 5) 连击反射
  if (enemyData.comboReflect) {
    let pct = Math.round(enemyData.comboReflect * 100);
    abilities.push({
      iconType: 'recycle',
      color: 'blue',
      label: `连击反射 (${pct}%)`,
      desc: `将连击伤害的 ${pct}% 反射给玩家`
    });
  }
  // 6) 连击破碎
  if (enemyData.comboBreakTurns) {
    abilities.push({
      iconType: 'gear',
      color: 'textDim',
      label: `连击破碎 (每${enemyData.comboBreakTurns}回合)`,
      desc: `每${enemyData.comboBreakTurns}回合清空玩家连击计数`
    });
  }
  // 7) Boss 阶段切换（三阶段优先于二阶段）
  if (enemyData.isVoidSovereign) {
    abilities.push({
      iconType: 'eye',
      color: 'red',
      label: '三阶段行为切换',
      desc: '100%→60%→30% HP 切换攻击/特殊/混合模式'
    });
  } else if (enemyData.bossPhase2) {
    abilities.push({
      iconType: 'eye',
      color: 'red',
      label: '二阶段行为切换',
      desc: `HP<${enemyData.bossPhase2.hpThreshold}时切换为更强模式`
    });
  }
  // 8) 通用特殊能力（attack/heal/buff/debuff）
  if (enemyData.special) {
    let sp = enemyData.special;
    let label, desc;
    if (sp.type === 'debuff') {
      label = `附加异常: ${sp.debuffType} ${sp.amt}层`;
      desc = `对玩家附加 ${sp.amt} 层${sp.debuffType}`;
    } else if (sp.type === 'buff') {
      label = `自我增益: ${sp.buffType} +${sp.amt}`;
      desc = `获得 ${sp.amt} 层${sp.buffType}（伤害+${sp.amt}）`;
    } else if (sp.type === 'heal') {
      label = `自我回复 ${sp.amt} HP`;
      desc = `回复 ${sp.amt} 点生命值`;
    } else if (sp.type === 'attack') {
      label = `特殊攻击 ${sp.dmg} 伤害`;
      desc = `造成 ${sp.dmg} 点伤害（按当前 AP）`;
    }
    if (label) {
      abilities.push({
        iconType: 'diamond',
        color: 'gold',
        label,
        desc
      });
    }
  }
  return abilities;
}

// 能力 icon 程序绘制（避免 emoji 字体不一致）
//   type: shield/lightning/vortex/recycle/gear/crack/eye/diamond
//   cx/cy: icon 中心坐标；colorKey: cFill 调色板键
function drawAbilityIcon(type, cx, cy, colorKey) {
  push();
  translate(cx, cy);
  noStroke();
  if (type === 'shield') {
    // 六边形盾牌
    cFill(colorKey);
    beginShape();
    vertex(0, -5); vertex(4, -3); vertex(4, 2);
    vertex(0, 5); vertex(-4, 2); vertex(-4, -3);
    endShape(CLOSE);
    // 内部十字（亮色高光）
    cFill('bgLight', 180);
    rect(-0.5, -3, 1, 6);
    rect(-2, -0.5, 4, 1);
  } else if (type === 'lightning') {
    // Z 字闪电
    cFill(colorKey);
    beginShape();
    vertex(-1, -5); vertex(2, -5); vertex(0, -1);
    vertex(2, -1); vertex(-2, 5); vertex(0, 1);
    vertex(-2, 1); vertex(-1, -5);
    endShape(CLOSE);
  } else if (type === 'vortex') {
    // 漩涡（螺旋线）
    noFill();
    cStroke(colorKey, 220);
    strokeWeight(1.2);
    let prevX = 0, prevY = 0;
    for (let t = 1; t <= 20; t++) {
      let a = t * 0.55;
      let r = t * 0.22;
      let x = Math.cos(a) * r;
      let y = Math.sin(a) * r;
      if (t > 1) line(prevX, prevY, x, y);
      prevX = x; prevY = y;
    }
    cFill(colorKey, 180);
    noStroke();
    ellipse(0, 0, 2.5, 2.5);
  } else if (type === 'recycle') {
    // 循环箭头（3/4 圆弧 + 箭头头）
    noFill();
    cStroke(colorKey, 220);
    strokeWeight(1.3);
    arc(0, 0, 9, 9, PI * 0.3, PI * 2.1);
    // 箭头头
    cFill(colorKey, 220);
    noStroke();
    push();
    translate(Math.cos(PI * 0.3) * 4.5, Math.sin(PI * 0.3) * 4.5);
    rotate(PI * 0.3 - PI / 2);
    triangle(-2, -2, 2, -2, 0, 2);
    pop();
  } else if (type === 'gear') {
    // 齿轮（圆 + 8 齿 + 中心轴）
    cFill(colorKey, 200);
    noStroke();
    ellipse(0, 0, 7, 7);
    for (let i = 0; i < 8; i++) {
      let a = (i / 8) * Math.PI * 2;
      let dx = Math.cos(a) * 4.5;
      let dy = Math.sin(a) * 4.5;
      rect(dx - 1, dy - 1, 2, 2);
    }
    cFill('bgLight', 180);
    ellipse(0, 0, 2.5, 2.5);
  } else if (type === 'crack') {
    // 碎裂圆（外圆 + 3 条放射裂缝 + 中心点）
    noFill();
    cStroke(colorKey, 220);
    strokeWeight(1.2);
    ellipse(0, 0, 8, 8);
    for (let i = 0; i < 3; i++) {
      let a = (i / 3) * Math.PI * 2 + 0.3;
      let x1 = Math.cos(a) * 2;
      let y1 = Math.sin(a) * 2;
      let x2 = Math.cos(a) * 5;
      let y2 = Math.sin(a) * 5;
      line(x1, y1, x2, y2);
    }
    cFill(colorKey, 180);
    noStroke();
    ellipse(0, 0, 2, 2);
  } else if (type === 'eye') {
    // 眼睛（外椭圆 + 虹膜 + 瞳孔）
    cFill(colorKey, 200);
    ellipse(0, 0, 9, 5);
    cFill('bgLight', 220);
    ellipse(0, 0, 3.5, 3.5);
    cFill(colorKey);
    ellipse(0, 0, 1.5, 1.5);
  } else if (type === 'diamond') {
    // 菱形（旋转 45° 矩形 + 中心高光）
    cFill(colorKey);
    push();
    rotate(PI / 4);
    rect(-3, -3, 6, 6);
    cFill('bgLight', 180);
    rect(-1, -1, 2, 2);
    pop();
  }
  pop();
}

// 能力列表渲染（在 tip 内坐标空间，tip 宽 tipW，行起始 y = startY）
function drawEnemySpecialAbilities(abilities, tipW, startY) {
  for (let i = 0; i < abilities.length; i++) {
    let ab = abilities[i];
    let rowY = startY + i * 24;
    let iconX = 16;
    let textX = 30;
    // 能力 icon（中心 10x10 区域）
    drawAbilityIcon(ab.iconType, iconX + 5, rowY + 5, ab.color);
    // label（BOLD 9pt text 色）
    cFill('text');
    textAlign(LEFT, TOP);
    textSize(9);
    textStyle(BOLD);
    text(ab.label, textX, rowY);
    // desc（NORMAL 8pt textDim 色）
    cFill('textDim');
    textSize(8);
    textStyle(NORMAL);
    text(ab.desc, textX, rowY + 11);
  }
}

// 敌人信息解释栏（通用入口）
//   enemyData: 敌人数据对象
//   anchorX/anchorY: 敌人中心屏幕坐标
//   size: 敌人尺寸（用于 tooltip 定位）
//   deathT: 死亡进度 0~1（null = 未死亡）
function drawEnemyInfoTooltip(enemyData, anchorX, anchorY, size, deathT) {
  if (deathT != null && deathT > 0.5) return; // 死亡过半则不显示 tooltip
  let alphaFactor = deathT != null ? (1 - deathT) : 1;
  // 动态尺寸：基础 90 + 每能力 24，最大 360（避免超出屏幕）
  let abilities = collectEnemyAbilities(enemyData);
  let tipW = 240;
  let tipH = Math.min(GAME_H - 40, 90 + abilities.length * 24);
  // 位置：默认敌人右侧，越界翻左 + clamp 顶部/底部
  let tipX = anchorX + size + 15;
  if (tipX + tipW > GAME_W) tipX = anchorX - size - 15 - tipW;
  if (tipX < 5) tipX = 5;
  let tipY = clamp(anchorY - tipH / 2, 10, GAME_H - tipH - 10);
  push();
  translate(tipX, tipY);
  // 框架（复用升级 tooltip 视觉：黑底+金边+圆角）
  noStroke();
  fill(0, 220 * alphaFactor);
  rect(0, 0, tipW, tipH, 8);
  cStroke('gold', 200 * alphaFactor);
  strokeWeight(1.5);
  noFill();
  rect(0, 0, tipW, tipH, 8);
  noStroke();
  // 标题：类型徽章 + 敌人名
  let titleColor = enemyData.isBoss ? 'redBright' :
                   enemyData.isElite ? 'orangeBright' : 'gold';
  cFill(titleColor, 255 * alphaFactor);
  textAlign(LEFT, TOP);
  textSize(14);
  textStyle(BOLD);
  let badge = enemyData.isBoss ? '【首领】' :
              enemyData.isElite ? '【精英】' : '';
  // 变体名可能很长（3 层词缀），用自适应宽度绘制防止撑破面板
  drawTextFit(badge + enemyData.name, 12, 10, tipW - 24, 14);
  // 基础描述（最多 2 行，超长省略号）
  cFill('text', 255 * alphaFactor);
  textSize(10);
  textStyle(NORMAL);
  drawWrappedTextInBox(enemyData.desc || '', 12, 32, tipW - 24, 12, 2);
  // 分割线（仅在有特殊能力时绘制）
  if (abilities.length > 0) {
    cStroke('goldDim', 150 * alphaFactor);
    strokeWeight(1);
    line(12, 60, tipW - 12, 60);
    noStroke();
    // 能力列表
    drawEnemySpecialAbilities(abilities, tipW, 66);
  }
  pop();
}

// 非战斗场景公共卡牌网格渲染
// options: { highlightColor, showUpgradeTooltip, showDeleteHint, hoveredIdx, maxPerRow }
//   - highlightColor: 'gold' | 'red'，hover 高亮与边框颜色
//   - showUpgradeTooltip: true 时悬停可升级卡牌显示升级 Tooltip
//   - showDeleteHint: true 时悬停显示"点击熔铸"提示
//   - hoveredIdx: 当前悬停的卡牌索引
//   - maxPerRow: 每行卡牌数（默认 5）
function drawCardGridCommon(cards, hoveredIdx, options) {
  options = options || {};
  let highlightColor = options.highlightColor || 'gold';
  let showUpgradeTooltip = options.showUpgradeTooltip || false;
  let showDeleteHint = options.showDeleteHint || false;
  let maxPerRow = options.maxPerRow || 5;
  // T187 工匠铺滚轮支持：传入 scrollY 让所有卡牌在渲染时上移
  let scrollY = options.scrollY || 0;
  // dt 必须是毫秒（deltaTime 而非 deltaTime/1000）
  let dt = deltaTime || 16.67;

  const GRID_START_X = 150;
  const GRID_START_Y = 190;
  const GRID_COL_GAP = 160;
  const GRID_ROW_GAP = 150;

  // 两遍渲染：先画非悬停，再画悬停（置顶）
  // 单卡渲染内部函数（参考 drawDeckViewer L6907-6927 多字段独立 dampApproach 模式）
  function drawOneCard(i) {
    let card = cards[i];
    let col = i % maxPerRow;
    let row = Math.floor(i / maxPerRow);
    let baseCx = GRID_START_X + col * GRID_COL_GAP;
    let baseCy = GRID_START_Y + row * GRID_ROW_GAP - scrollY;  // T187 减去 scrollY 实现上滚露出下方
    let hovered = hoveredIdx === i;
    // 获取/更新卡牌动画状态
    let state = getDeckCardState(card);
    let targetHover = hovered ? 1 : 0;
    // k=0.25 防止 NaN
    state.hoverProgress = dampApproach(state.hoverProgress, targetHover, 0.25, dt);
    if (isNaN(state.hoverProgress) || state.hoverProgress < 0) state.hoverProgress = 0;
    if (state.hoverProgress > 1) state.hoverProgress = 1;
    let hoverEase = easeOutCubic(state.hoverProgress);
    // scale/rotation 独立 dampApproach
    let targetScale = 1 + 0.12 * hoverEase;
    state.scale = dampApproach(state.scale || 1, targetScale, 0.3, dt);
    // rotation：悬停时趋近 0，非悬停时保持 microRot + sin 漂移
    let driftRot = Math.sin(frameCount * 0.015 + state.microRotPhase) * 0.02;
    let nonHoverRot = state.microRot + driftRot;
    state.rotation = dampApproach(state.rotation, hovered ? 0 : nonHoverRot, 0.3, dt);
    // 悬停时 Y 偏移独立 dampApproach
    let targetLiftY = hovered ? -30 : 0;
    state.liftY = dampApproach(state.liftY || 0, targetLiftY, 0.3, dt);
    let cx = baseCx;
    let cy = baseCy + state.liftY;
    let scaleVal = state.scale;
    let totalRot = state.rotation;
    // 3D 倾斜：仅悬停卡牌按鼠标位置透视倾斜（hoverEase 渐入）
    let tilt = hovered ? computeCardTilt(cx, cy, scaleVal, hoverEase) : { tiltX:0, tiltY:0, shadowOffX:0, shadowOffY:0 };
    // 阴影按 hoverEase 渐变
    if (hoverEase > 0.01) {
      drawCardShadowGlobal(cx + tilt.shadowOffX, cy + tilt.shadowOffY, 30 * hoverEase, scaleVal, totalRot);
    }
    // 卡牌主体
    push();
    try {
      translate(cx, cy);
      rotate(totalRot);
      scale(scaleVal);
      applyCardTilt3D(tilt.tiltX, tilt.tiltY);   // 3D 透视倾斜
      drawCardVisual(card, 0, 0, 1);             // scale 已应用，这里传 1
      applyCardSheen3D(hoverEase, tilt.tiltX, tilt.tiltY);
    } finally {
      pop();
    }
    // 镭射效果（特殊卡牌）
    if (isSpecialCardGlobal(card)) {
      drawCardLaserGlobal(scaleVal, cx, cy, totalRot, hovered);
    }
    // hover 高亮边框（宽高乘以 scaleVal 同步缩放）
    if (hovered) {
      cStroke(highlightColor, 200);
      strokeWeight(2.5);
      noFill();
      let hlW = CARD_W * scaleVal + 8;
      let hlH = CARD_H * scaleVal + 8;
      rect(cx - hlW / 2, cy - hlH / 2, hlW, hlH, 12);
    }
    // 升级预览 Tooltip（仅 upgrade_select 阶段）
    if (hovered && showUpgradeTooltip && card.upgradeable && !card.upgraded) {
      drawUpgradeTooltipGlobal(card, cx, cy);
    }
    // 删除提示
    if (hovered && showDeleteHint) {
      let hintW = 120;
      let hintH = 30;
      let hintX = cx - hintW / 2;
      let hintY = cy - CARD_H / 2 - hintH - 8;
      if (hintY < 10) hintY = cy + CARD_H / 2 + 8;
      push();
      noStroke();
      fill(0, 200);
      rect(hintX, hintY, hintW, hintH, 6);
      cFill('red');
      textAlign(CENTER, CENTER);
      textSize(11);
      textStyle(BOLD);
      text('点击熔铸此牌', hintX + hintW / 2, hintY + hintH / 2);
      pop();
    }
  }

  // 第一遍：绘制所有非悬停卡牌
  for (let i = 0; i < cards.length; i++) {
    if (i === hoveredIdx) continue;
    drawOneCard(i);
  }
  // 第二遍：单独绘制悬停卡牌（置顶最高层）
  if (hoveredIdx >= 0 && hoveredIdx < cards.length) {
    drawOneCard(hoveredIdx);
  }
}

// ==================== 商店场景 ====================
class ShopScene extends Scene {
  enter() {
    super.enter();
    audio.playShopBGM();
    this.cardsForSale = this.generateShopCards();
    this.relicsForSale = this.generateShopRelics();
    this.hoveredCardIdx = -1;
    this.hoveredRelicIdx = -1;
    this.removeCost = Math.floor(75 * (1 - gs.getShopDiscount()));
    // T243：删牌键悬停阻尼进度（0→1），enter 重置防跨场景残留
    this._delAnim = { hover: 0 };
    this.bgGlyphs = [];
    // 漂浮符号渐隐：life + maxLife
    // 渐隐规则（12%/76%/12%）：前 12% 时间渐显（0→1）→ 中间 76% 保持原亮度 → 后 12% 渐隐（1→0）
    //   → 大部分漂浮时间（76%）与之前一样亮，仅首尾各 12% 渐变 → 符合"大部分漂浮时间跟从前一样亮"要求
    for (let i = 0; i < 12; i++) {
      let maxLife = 250 + rand(0, 250);
      this.bgGlyphs.push({
        x: rand(0, GAME_W), y: rand(0, GAME_H),
        vx: rand(-0.1, 0.1), vy: rand(-0.3, -0.05),
        glyph: pick(['💰','⚖','✧','◆','●','★']),
        size: rand(14, 28),
        life: maxLife,          // 当前生命（每帧 -1）
        maxLife: maxLife,       // 初始最大生命（用于计算 fadeAlpha）
      });
    }
  }
  generateShopCards() {
    let cards = [];
    let pool = CARD_DATA.filter(c => c.rarity !== 'basic');
    for (let i = 0; i < 5; i++) {
      let card = {...pick(pool)};
      card.price = Math.floor((card.rarity === 'rare' ? 120 : (card.rarity === 'uncommon' ? 70 : 40)) * (1 - gs.getShopDiscount()));
      cards.push(card);
    }
    return cards;
  }
  generateShopRelics() {
    let relics = [];
    // 过滤已拥有的遗物
    let pool = RELIC_DATA.filter(r => !gs.relics.find(owned => owned.id === r.id));
    // 若 pool.length < 3，则只生成 pool.length 个遗物
    let count = Math.min(3, pool.length);
    // 确保不重复选取（复制一份工作池，选取后移除）
    let workPool = [...pool];
    for (let i = 0; i < count; i++) {
      if (workPool.length === 0) break;
      let idx = Math.floor(Math.random() * workPool.length);
      let relic = {...workPool[idx]};
      workPool.splice(idx, 1);
      relic.price = Math.floor((relic.rarity === 'rare' ? 200 : (relic.rarity === 'uncommon' ? 120 : 70)) * (1 - gs.getShopDiscount()));
      relics.push(relic);
    }
    return relics;
  }
  // T243：删牌键几何单一真相源（update 悬停检测 / draw 绘制共用，避免挪位漏改一处）
  // 位于遗物行「第四个服务槽」中心 x=780：遗物三槽右缘 640 → 此键 x[705,855]，
  // 与右上角音量控件 / 难度结果行（x≥约1145）彻底分离，修复 T239 后与难度行的重叠
  _delBtnRect() {
    const w = 150, h = 90;
    const cx = 780, cy = GAME_H * 0.68;
    return { x: cx - w / 2, y: cy - h / 2, w: w, h: h, cx: cx, cy: cy };
  }
  // T243：调色板键名整数插值（本项目无 lerpColor 先例，统一走 COLORS_RGB 数字 RGB，避免 p5.Color 风格分叉）
  _mixRgb(kA, kB, t) {
    const a = COLORS_RGB[kA], b = COLORS_RGB[kB];
    return [Math.round(a.r + (b.r - a.r) * t), Math.round(a.g + (b.g - a.g) * t), Math.round(a.b + (b.b - a.b) * t)];
  }
  update() {
    super.update();
    // T203：牌库查看器打开时暂停 ShopScene 更新（背景符文/卡牌悬停/购买按钮/刷新逻辑）
    if (gs.showDeckViewer) return;
    this.bgGlyphs.forEach(g => {
      g.x += g.vx; g.y += g.vy;
      g.life--;
      // 生命耗尽重生 + 重置 maxLife
      if (g.life <= 0) {
        let newMax = 250 + rand(0, 250);
        g.x = rand(0, GAME_W); g.y = GAME_H + 20;
        g.life = newMax; g.maxLife = newMax;
      }
    });
    this.hoveredCardIdx = -1;
    this.hoveredRelicIdx = -1;
    // 卡牌悬停
    for (let i = 0; i < this.cardsForSale.length; i++) {
      let cx = 200 + i * 170;
      let cy = GAME_H * 0.35;
      if (mx() > cx - CARD_W / 2 && mx() < cx + CARD_W / 2 && my() > cy - CARD_H / 2 && my() < cy + CARD_H / 2 + 30) {
        this.hoveredCardIdx = i;
      }
    }
    // 遗物悬停
    for (let i = 0; i < this.relicsForSale.length; i++) {
      let rx = 180 + i * 200;
      let ry = GAME_H * 0.68;
      if (mx() > rx - 50 && mx() < rx + 50 && my() > ry - 50 && my() < ry + 70) {
        this.hoveredRelicIdx = i;
      }
    }
    // 删牌按钮（T243：几何统一走 _delBtnRect，与绘制同源；悬停阻尼 k=0.25 + deltaTime，硬约束 #16/#17）
    let dr = this._delBtnRect();
    this.delBtnHovered = mx() > dr.x && mx() < dr.x + dr.w && my() > dr.y && my() < dr.y + dr.h;
    if (!this._delAnim) this._delAnim = { hover: 0 };
    this._delAnim.hover = dampApproach(this._delAnim.hover, this.delBtnHovered ? 1 : 0, 0.25, deltaTime || 16.67);
    // 离开按钮
    let leaveX = GAME_W - 130;
    let leaveY = GAME_H * 0.88;
    this.leaveBtnHovered = mx() > leaveX && mx() < leaveX + 110 && my() > leaveY && my() < leaveY + 40;
  }
  draw() {
    abyssVeil();
    // T203：牌库查看器打开时仅 super.draw()，跳过背景符文/卡牌/购买按钮/价格等重渲染
    if (gs.showDeckViewer) { super.draw(); return; }
    // 背景：fadeAlpha * 255
    this.bgGlyphs.forEach(g => {
      // 渐隐规则（12%/76%/12%）：前 12% 渐显 → 中 76% 保持 1 → 后 12% 渐隐
      let lifeRatio = g.life / g.maxLife;
      let fadeAlpha;
      if (lifeRatio > 0.88) {
        fadeAlpha = (1 - lifeRatio) / 0.12;
      } else if (lifeRatio < 0.12) {
        fadeAlpha = lifeRatio / 0.12;
      } else {
        fadeAlpha = 1;
      }
      cFill('goldDim', fadeAlpha * 255);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(g.size);
      text(g.glyph, g.x, g.y);
    });
    // 标题
    cFill('gold');
    textAlign(CENTER, CENTER);
    textSize(28);
    textStyle(BOLD);
    text('⚜ 深 渊 商 店 ⚜', GAME_W / 2, 40);
    // 金币
    cFill('gold');
    textSize(16);
    text(`💰 ${gs.gold}`, GAME_W / 2, 70);
    // 卡牌
    cFill('textDim');
    textAlign(LEFT, CENTER);
    textSize(14);
    text('卡牌:', 50, GAME_H * 0.2);
    for (let i = 0; i < this.cardsForSale.length; i++) {
      let card = this.cardsForSale[i];
      let cx = 200 + i * 170;
      let cy = GAME_H * 0.35;
      let hovered = this.hoveredCardIdx === i;
      let affordable = gs.gold >= card.price;
      // 使用 getDeckCardState 实现 hover 动效
      let state = getDeckCardState(card);
      let targetHover = hovered ? 1 : 0;
      // dt 必须是毫秒
      let _dtShop = deltaTime || 16.67;
      // k=0.25 防止 NaN
      state.hoverProgress = dampApproach(state.hoverProgress, targetHover, 0.25, _dtShop);
      if (isNaN(state.hoverProgress) || state.hoverProgress < 0) state.hoverProgress = 0;
      if (state.hoverProgress > 1) state.hoverProgress = 1;
      let hoverEase = easeOutCubic(state.hoverProgress);
      // scale/rotation 独立 dampApproach
      let targetScale = 1 + 0.08 * hoverEase;
      state.scale = dampApproach(state.scale || 1, targetScale, 0.3, _dtShop);
      let driftRot = Math.sin(frameCount * 0.015 + state.microRotPhase) * 0.02;
      let nonHoverRot = state.microRot + driftRot;
      state.rotation = dampApproach(state.rotation, hovered ? 0 : nonHoverRot, 0.3, _dtShop);
      let targetLiftY = hovered ? -20 : 0;
      state.liftY = dampApproach(state.liftY || 0, targetLiftY, 0.3, _dtShop);
      let scaleVal = state.scale;
      let totalRot = state.rotation;
      // 阴影按 hoverEase 渐变
      if (hoverEase > 0.01) {
        drawCardShadowGlobal(cx, cy + state.liftY, 25 * hoverEase, scaleVal, totalRot);
      }
      push();
      try {
        translate(cx, cy + state.liftY);
        rotate(totalRot);
        drawCardVisual(card, 0, 0, scaleVal);
      } finally {
        pop();
      }
      // 稀有/特殊卡牌显示镭射覆膜（与 drawCardGridCommon 守卫一致：isSpecialCardGlobal 已涵盖 upgraded/special keyword/rare）
      if (isSpecialCardGlobal(card)) {
        drawCardLaserGlobal(scaleVal, cx, cy + state.liftY, totalRot, hovered);
      }
      // 价格
      if (affordable) cFill('gold'); else cFill('red');
      textAlign(CENTER, CENTER);
      textSize(12);
      text(`💰${card.price}`, cx, cy + CARD_H / 2 + 16);
    }
    // 遗物
    cFill('textDim');
    textAlign(LEFT, CENTER);
    textSize(14);
    text('遗物:', 50, GAME_H * 0.55);
    for (let i = 0; i < this.relicsForSale.length; i++) {
      let relic = this.relicsForSale[i];
      let rx = 180 + i * 200;
      let ry = GAME_H * 0.68;
      let hovered = this.hoveredRelicIdx === i;
      let affordable = gs.gold >= relic.price;
      cFill('panel');
      if (hovered) cStroke('gold'); else cStroke('panelEdge');
      strokeWeight(hovered ? 2 : 1);
      rect(rx - 60, ry - 40, 120, 90, 8);
      noStroke();
      drawRelicVisual(relic, rx, ry - 10, 35);
      cFill('text');
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(11);
      text(relic.name, rx, ry + 24);
      if (affordable) cFill('gold'); else cFill('red');
      noStroke();
      textSize(10);
      text(`💰${relic.price}`, rx, ry + 40);
      // 描述tooltip
      if (hovered) {
        cFill('panel');
        cStroke('gold');
        strokeWeight(1);
        rect(rx - 90, ry - 85, 180, 40, 6);
        cFill('text');
        noStroke();
        textSize(9);
        text(relic.desc, rx, ry - 65);
      }
    }
    // 删牌（T243：遗物行第四槽 x=780 + 祭坛按键动效升级——阻尼上浮放大 / ✕旋转 / 红→金呼吸描边 / 提示线展开）
    let dr = this._delBtnRect();
    let delW = dr.w, delH = dr.h;
    let _delEase = easeOutCubic((this._delAnim && this._delAnim.hover) || 0);
    let _delAfford = gs.gold >= this.removeCost;   // 金币不足：动效有反馈但不亮金，保持危险红
    let _delGlow = _delAfford ? _delEase : 0;
    let _edgeCol = this._mixRgb('red', 'goldBright', _delGlow);
    let _innerCol = this._mixRgb('goldDim', 'goldBright', _delGlow);
    let _iconCol = this._mixRgb('red', 'goldBright', _delGlow);
    let _labelCol = this._mixRgb('text', 'goldBright', _delGlow);
    // 默认态红色外框慢呼吸（危险/消耗语义，alpha 190↔250，周期约 209 帧）
    let _breathe = 0.5 + 0.5 * Math.sin(frameCount * 0.03);
    // 整键以中心为锚：悬停上浮 5px + 放大 1.04（try/finally 保 push/pop，硬约束 #6）
    push();
    try {
      translate(dr.cx, dr.cy - 5 * _delEase);
      scale(1 + 0.04 * _delEase);
      // 外层暗色祭坛底座
      cFill('panel');
      stroke(_edgeCol[0], _edgeCol[1], _edgeCol[2], _delGlow < 0.01 ? 190 + 60 * _breathe : 255);
      strokeWeight(1.5 + 0.5 * _delEase);
      rect(-delW / 2, -delH / 2, delW, delH, 10);
      // 内层装饰金线
      noFill();
      stroke(_innerCol[0], _innerCol[1], _innerCol[2]);
      strokeWeight(1);
      rect(-delW / 2 + 6, -delH / 2 + 6, delW - 12, delH - 12, 6);
      // 顶部 ✕：独立 push 旋转；悬停 -18° + 放大 8%（不波及下方文字）
      push();
      translate(0, -22);
      rotate(-Math.PI / 10 * _delEase);
      noStroke();
      fill(_iconCol[0], _iconCol[1], _iconCol[2]);
      textAlign(CENTER, CENTER);
      textStyle(BOLD);
      textSize(22 * (1 + 0.08 * _delEase));
      text('✕', 0, 0);
      pop();
      textStyle(NORMAL);
      // 主文字
      noStroke();
      textAlign(CENTER, CENTER);
      fill(_labelCol[0], _labelCol[1], _labelCol[2]);
      textSize(13);
      text('移除卡牌', 0, 2);
      // 价格（金币图标 + 数字；不足红色）
      cFill(_delAfford ? 'gold' : 'red');
      textSize(11);
      text(`💰 ${this.removeCost}`, 0, 22);
      // 底部提示线：由中心向两端展开；金币不足时为红色（不可用提示）
      if (_delEase > 0.01) {
        cStroke(_delAfford ? 'goldBright' : 'redBright', 255 * _delEase);
        strokeWeight(1);
        let _halfLine = (delW / 2 - 20) * _delEase;
        line(-_halfLine, delH / 2 - 8, _halfLine, delH / 2 - 8);
        noStroke();
      }
    } finally {
      pop();
    }
    // 离开
    let leaveX = GAME_W - 130;
    let leaveY = GAME_H * 0.88;
    if (this.leaveBtnHovered) cFill('gold'); else cFill('panel');
    cStroke('goldDim');
    strokeWeight(1);
    rect(leaveX, leaveY, 110, 40, 8);
    cFill('text');
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(14);
    text('离开商店', leaveX + 55, leaveY + 20);
    super.draw();
  }
  drawCardAt( card, cx, cy, rot, cardScale) {
    push();
    translate(cx, cy);
    rotate(rot || 0);
    drawCardVisual(card, 0, 0, cardScale || 1);
    pop();
  }
  mousePressed() {
    // 购买卡牌
    if (this.hoveredCardIdx >= 0) {
      let card = this.cardsForSale[this.hoveredCardIdx];
      if (gs.gold >= card.price) {
        gs.gold -= card.price;
        gs.addCard(card);
        this.cardsForSale.splice(this.hoveredCardIdx, 1);
        audio.playSFX('gold');
      }
      return;
    }
    // 购买遗物
    if (this.hoveredRelicIdx >= 0) {
      let relic = this.relicsForSale[this.hoveredRelicIdx];
      if (gs.gold >= relic.price) {
        gs.gold -= relic.price;
        gs.addRelic(relic);
        this.relicsForSale.splice(this.hoveredRelicIdx, 1);
        audio.playSFX('gold');
      }
      return;
    }
    // 删牌（T217：仅跳转，扣金逻辑移至 RemoveCardScene.mousePressed 实际删牌后；T243：跳转补 ui_click）
    if (this.delBtnHovered && gs.gold >= this.removeCost) {
      audio.playSFX('ui_click');
      // T254：显式标明来源——删牌子场景现为商店/事件共用，目的地与费用必须由调用方注入（硬约束 #20）
      gs._removeCardCtx = { source: 'shop' };
      gs.scene = 'remove_card';
      return;
    }
    // 离开
    if (this.leaveBtnHovered) {
      gs.scene = 'map';
    }
  }
}

// ==================== 事件场景 ====================
class EventScene extends Scene {
  enter() {
    super.enter();
    audio.playShopBGM();
    // T254：从删牌子场景返回时，场景调度按"对象不同即 enter"会再次调用本函数（见 draw() 切换检测）。
    //   消费返回载荷、保留原事件，严禁重新 pick——否则玩家在灰烬集市付费删牌回来，会面对另一个随机事件。
    if (this._returnPayload) {
      let payload = this._returnPayload;
      this._returnPayload = null;
      this.hoveredChoice = -1;
      this.resultText = payload.resultText;  // 删牌成功/放弃文案，点"继续"回地图
      return;
    }
    this.event = pick(EVENT_DATA);
    this.hoveredChoice = -1;
    this.resultText = null;
    this.continueBtn = null;
  }
  update() {
    super.update();
    this.hoveredChoice = -1;
    if (this.resultText) {
      let contX = GAME_W/2 - 60;
      let contY = 430;
      let contHovered = mx() > contX && mx() < contX + 120 && my() > contY && my() < contY + 40;
      this.continueBtn = { x: contX, y: contY, w: 120, h: 40, hovered: contHovered };
      return;
    }
    let panelW = 600;
    let panelH = 580;
    let panelX = GAME_W/2 - panelW/2;
    let panelY = 50;
    let btnW = panelW - 80;
    let btnH = 70;
    let btnX = panelX + 40;
    let startY = panelY + 230;
    for (let i = 0; i < this.event.choices.length; i++) {
      let cy = startY + i * 85;
      if (mx() > btnX && mx() < btnX + btnW && my() > cy && my() < cy + btnH) {
        this.hoveredChoice = i;
      }
    }
  }
  draw() {
    abyssVeil();
    // 神秘背景
    for (let i = 0; i < 20; i++) {
      let x = (i * 137 + frameCount * 0.1) % GAME_W;
      let y = (i * 89) % GAME_H;
      cFill('purple', 20);
      textAlign(CENTER, CENTER);
      textSize(16);
      text('?', x, y);
    }
    let panelW = 600;
    let panelH = 580;
    let panelX = GAME_W/2 - panelW/2;
    let panelY = 50;
    // 事件面板
    cFill('panel');
    cStroke('purple');
    strokeWeight(2);
    rect(panelX, panelY, panelW, panelH, 12);
    // 标题装饰线
    cStroke('goldDim', 80);
    strokeWeight(1);
    line(GAME_W/2 - 100, panelY + 45, GAME_W/2 + 100, panelY + 45);
    // 事件名称
    cFill('gold');
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    text(this.event.name, GAME_W/2, panelY + 25);
    // 描述区域
    cFill('text');
    textSize(14);
    textStyle(NORMAL);
    let descY = panelY + 55;
    let descMaxH = 140;
    drawCenteredText(this.event.desc || '', GAME_W/2, descY, panelW - 60, descMaxH, 18);
    // 装饰线
    cStroke('goldDim', 80);
    strokeWeight(1);
    line(panelX + 40, panelY + 200, panelX + panelW - 40, panelY + 200);
    // 选择或结果
    if (!this.resultText) {
      let startY = panelY + 220;
      let btnW = panelW - 80;
      let btnH = 70;
      let btnX = panelX + 40;
      for (let i = 0; i < this.event.choices.length; i++) {
        let choice = this.event.choices[i];
        let cy = startY + i * 85;
        let hovered = this.hoveredChoice === i;
        // 选择框
        if (hovered) cFill('gold'); else cFill('bgLight');
        if (hovered) cStroke('goldBright'); else cStroke('panelEdge');
        strokeWeight(1.5);
        rect(btnX, cy, btnW, btnH, 8);
        // 按钮内容 —— T241：文本在栏位内垂直居中（vCenter 把 y 视为文本块中心）
        if (hovered) fill(0); else cFill('text');
        textSize(13);
        textStyle(BOLD);
        drawCenteredText(choice.text || '', btnX + btnW/2, cy + btnH/2, btnW - 20, btnH - 16, 14, true);
      }
    } else {
      // 结果文本
      cFill('text');
      textSize(15);
      textStyle(BOLD);
      let resultY = panelY + 230;
      drawCenteredText(this.resultText || '', GAME_W/2, resultY, panelW - 60, 160, 20);
      // 继续按钮
      let contX = GAME_W/2 - 60;
      let contY = 430;
      let contHovered = mx() > contX && mx() < contX + 120 && my() > contY && my() < contY + 40;
      this.continueBtn = { x: contX, y: contY, w: 120, h: 40, hovered: contHovered };
      if (contHovered) cFill('gold'); else cFill('panel');
      cStroke('goldDim');
      strokeWeight(1);
      rect(contX, contY, 120, 40, 8);
      if (contHovered) fill(0); else cFill('text');
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      text('继续', contX + 60, contY + 20);
    }
    super.draw();
  }
  mousePressed() {
    if (this.resultText) {
      if (this.continueBtn && this.continueBtn.hovered) {
        gs.scene = 'map';
      }
      return;
    }
    if (this.hoveredChoice >= 0) {
      this.applyChoice(this.event.choices[this.hoveredChoice]);
    }
  }
  applyChoice(choice) {
    switch (choice.effect) {
      case 'gain_relic':
        let relic = pick(RELIC_DATA);
        gs.addRelic(relic);
        this.resultText = `获得了遗物：${relic.name}！`;
        audio.playSFX('gold');
        break;
      case 'blood_sacrifice':
        gs.takeDamage(choice.hpCost || 10);
        let rareCards = CARD_DATA.filter(c => c.rarity === 'rare' || c.rarity === 'uncommon');
        let card = pick(rareCards);
        gs.addCard(card);
        this.resultText = `失去${choice.hpCost}HP，获得了卡牌：${card.name}！`;
        audio.playSFX('heal');
        break;
      case 'trade':
        if (gs.gold >= (choice.goldCost || 30)) {
          gs.gold -= choice.goldCost;
          let cards = CARD_DATA.filter(c => c.rarity !== 'basic');
          gs.addCard(pick(cards));
          gs.addCard(pick(cards));
          this.resultText = '获得了2张随机卡牌！';
          audio.playSFX('gold');
        } else {
          this.resultText = '金币不足...';
        }
        break;
      case 'cursed_gift':
        let cursed = pick(CARD_DATA.filter(c => c.rarity !== 'basic'));
        gs.addCard(cursed);
        if (Math.random() < 0.4) {
          gs.takeDamage(5);
          this.resultText = `获得${cursed.name}，但被诅咒失去了5HP...`;
        } else {
          this.resultText = `获得了${cursed.name}！看来运气不错。`;
        }
        break;
      case 'void_drink':
        gs.takeDamage(choice.hpCost || 15);
        let r1 = pick(RELIC_DATA);
        let r2 = pick(RELIC_DATA.filter(r => r.id !== r1.id));
        gs.addRelic(r1);
        gs.addRelic(r2 || r1);
        this.resultText = `失去${choice.hpCost}HP，获得了遗物：${r1.name}、${r2?.name || r1.name}！`;
        audio.playSFX('heal');
        break;
      case 'remove_card': {
        // 付费移除（灰烬集市 45 金）：金币不足直接给结果，不进子场景；免费移除（虚空之池）无此限制
        if (choice.goldCost && gs.gold < choice.goldCost) {
          this.resultText = '金币不足...';
          break;
        }
        // T254：事件价进入前一次性预收，并随上下文交给删牌子场景；场景内 cost=0，
        //   不再按商店价 75 金二次扣费（旧链路：事件扣 45 + RemoveCardScene 再扣商店价 75；免费事件也被强收 75）。
        //   放弃删牌时由 RemoveCardScene 凭 prepaid 全额退还；成功/放弃都回本事件结果页（不重掷事件）。
        let _prepaid = choice.goldCost || 0;
        if (_prepaid) gs.gold -= _prepaid;
        gs._removeCardCtx = {
          source: 'event',
          cost: 0,
          prepaid: _prepaid,
          resultDone: '一张卡牌没入虚空，再也找不回来了。',
          resultCancel: _prepaid
            ? `你放弃了遗忘，${_prepaid}金币分文未少地回到手中。`
            : '你从池边退开，池水依旧沉默无波。',
        };
        gs.scene = 'remove_card';
        return;
      }
      case 'upgrade_random': {
        // 修复：必须调用通用 applyCardUpgrade() 以匹配每张卡牌 upgradedDesc 规划的实际升级效果
        // 旧实现仅手动设置 baseDmg/baseBlock ×1.3，忽略 T176 平衡调整与 T177 自定义升级特例（如 adrenaline/flame_gift/blood_sacrifice/ascended_blade 等）
        // 过滤条件与 RestScene/ArtisanScene 对齐：仅从带 upgradeable:true 的卡牌中选取
        let upgradable = gs.deck.filter(c => c.upgradeable && !c.upgraded);
        if (upgradable.length > 0) {
          let toUpgrade = pick(upgradable);
          applyCardUpgrade(toUpgrade);
          this.resultText = `升级了卡牌：${toUpgrade.name}！`;
        } else {
          this.resultText = '没有可升级的卡牌...';
        }
        break;
      }
      case 'gold':
        gs.gold += (choice.goldAmt || 50);
        this.resultText = `获得了${choice.goldAmt}金币！`;
        audio.playSFX('gold');
        break;
      case 'gain_card':
        let newCard = pick(CARD_DATA.filter(c => c.rarity !== 'basic'));
        gs.addCard(newCard);
        this.resultText = `获得了卡牌：${newCard.name}！`;
        break;
      case 'heal':
        gs.heal(choice.healAmt || 30);
        this.resultText = `回复了${choice.healAmt}HP！`;
        audio.playSFX('heal');
        break;
      case 'max_hp':
        gs.takeDamage(choice.hpCost || 5);
        gs.maxHp += (choice.maxHpGain || 2);
        gs.heal(choice.maxHpGain || 2);
        this.resultText = `失去${choice.hpCost}HP，最大HP+${choice.maxHpGain}！`;
        break;
      case 'gain_burn_card':
        let burnCards = CARD_DATA.filter(c => c.keywords && c.keywords.includes('异常') && c.statusType === 'burn');
        gs.addCard(burnCards.length > 0 ? pick(burnCards) : pick(CARD_DATA.filter(c => c.rarity !== 'basic')));
        this.resultText = '获得了一张火焰卡牌！';
        break;
      // ==================== 内容扩容新增效果 ====================
      case 'relic_blood': {
        gs.takeDamage(choice.hpCost || 8);
        let br = pick(RELIC_DATA);
        gs.addRelic(br);
        this.resultText = `失去${choice.hpCost}HP，获得了遗物：${br.name}！`;
        audio.playSFX('gold');
        break;
      }
      case 'duplicate_card': {
        if (!gs.deck || gs.deck.length === 0) { this.resultText = '牌库里空无一物...'; break; }
        let src = pick(gs.deck);
        // 浅拷贝：避免复制品与原牌共享引用，导致后续升级/标记互相污染
        let copied = { ...src };
        // T251：剥离源牌视觉身份 _uid（addCard 内会再兜一道）——复制体首次被绘制时懒分配独立 _uid，
        // 否则原牌与复制体命中同一动画状态键（id_uid），悬停其一两张同时高亮/抽起
        delete copied._uid;
        gs.addCard(copied);
        this.resultText = `复制了卡牌：${src.name}！`;
        audio.playSFX('card_draw');
        break;
      }
      case 'sell_hp': {
        gs.takeDamage(choice.hpCost || 10);
        gs.gold += (choice.goldAmt || 80);
        this.resultText = `失去${choice.hpCost}HP，获得了${choice.goldAmt}金币！`;
        audio.playSFX('gold');
        break;
      }
      case 'relic_for_card': {
        let nr = pick(RELIC_DATA);
        gs.addRelic(nr);
        if (gs.deck && gs.deck.length > 0) {
          let lostIdx = Math.floor(Math.random() * gs.deck.length);
          let lost = gs.deck.splice(lostIdx, 1)[0];
          this.resultText = `获得遗物：${nr.name}，失去了卡牌：${lost.name}。`;
        } else {
          this.resultText = `获得了遗物：${nr.name}！`;
        }
        audio.playSFX('gold');
        break;
      }
      case 'gain_2_cards': {
        let g2 = CARD_DATA.filter(c => c.rarity !== 'basic');
        let gc1 = pick(g2), gc2 = pick(g2);
        gs.addCard(gc1);
        gs.addCard(gc2);
        this.resultText = `获得了卡牌：${gc1.name}、${gc2.name}！`;
        audio.playSFX('gold');
        break;
      }
      case 'none':
      default:
        this.resultText = '你选择了离开...';
        break;
    }
  }
}

// ==================== 休息场景 ====================

    this.healAmt = Math.floor(gs.maxHp * (typeof getDifficulty === 'function' ? getDifficulty().restHeal : 0.3));

    textSize(28);

    if (this.healHovered) cFill('green'); else cFill('panel');
    cStroke('green');
    strokeWeight(1.5);
    rect(hx, hy, 200, 50, 8);

    let uy = GAME_H * 0.5;
    if (this.upgradeHovered) cFill('gold'); else cFill('panel');
    cStroke('gold');
    strokeWeight(1.5);
    rect(ux, uy, 200, 50, 8);
    cFill('goldBright');
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(16);
    text('升级一张随机卡牌', GAME_W/2, uy + 25);

    let ly = GAME_H * 0.7;
    if (this.leaveHovered) cFill('gold'); else cFill('panel');
    cStroke('goldDim');
    strokeWeight(1);
    rect(lx, ly, 100, 35, 6);

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(13);
    text('离开', lx + 50, ly + 18);
    super.draw();

    if (this.healHovered) {
      gs.heal(this.healAmt);
      audio.playSFX('heal');
      gs.scene = 'map';
    } else if (this.upgradeHovered) {
      // 随机升级只从可升级卡牌中选取
      let candidates = gs.deck.filter(c => c.upgradeable && !c.upgraded);
      if (candidates.length > 0) {
        let card = pick(candidates);
        applyCardUpgrade(card);
        floatingTexts.add(GAME_W/2, GAME_H/2, `${card.name} 升级!`, COLORS.gold, 20);
      }
      gs.scene = 'map';
    } else if (this.leaveHovered) {
      gs.scene = 'map';
    }
  }
}

// ==================== 工匠铺场景 ====================
class ArtisanScene extends Scene {
  enter() {
    super.enter();
    audio.playShopBGM();
    this.phase = 'main';
    this.hoveredIdx = -1;
    this.upgradeHovered = false;
    this.removeHovered = false;
    this.leaveHovered = false;
    this.backHovered = false;
    // T187 滚轮浏览支持：scrollY 用于垂直滚动卡牌网格（仅在卡牌超出原窗口范围时启用）
    this._scrollY = 0;
    this._maxScrollY = 0;
  }
  // T187 计算当前 phase 下的滚动范围（根据卡牌数量 + GAME_H）
  // T188 修复：考虑 initPostFX 顶/底电影黑边（2.5% = 18px@720p）的安全区
  //   顶部黑边 y=0~18（不影响 GRID_START_Y=190）/ 底部黑边 y=702~720
  //   最后一行卡牌底部必须 ≤ GAME_H - 18 才不会被黑边遮挡
  _recalcArtisanScroll() {
    if (this.phase === 'main') {
      this._maxScrollY = 0;
      this._scrollY = 0;
      return;
    }
    let cards = this.phase === 'upgrade_select'
      ? gs.deck.filter(c => c.upgradeable && !c.upgraded)
      : gs.deck;
    if (cards.length === 0) {
      this._maxScrollY = 0;
      this._scrollY = 0;
      return;
    }
    let totalRows = Math.ceil(cards.length / 6);  // T184 maxPerRow=6
    // 末行卡牌底部 y 坐标：GRID_START_Y + (totalRows-1)*GRID_ROW_GAP + CARD_H/2
    let lastRowBottom = 190 + (totalRows - 1) * 150 + 100;
    // 视图底部安全区 = GAME_H - 18（避开底部 2.5% 电影黑边）
    const SAFE_BOTTOM = GAME_H - 18;
    this._maxScrollY = Math.max(0, lastRowBottom - SAFE_BOTTOM);
    this._scrollY = constrain(this._scrollY, 0, this._maxScrollY);
  }
  update() {
    super.update();
    // T203：牌库查看器打开时暂停 ArtisanScene 更新（卡牌网格悬停/动画/scrollY/phase 切换）
    // 与 BattleScene 5501 行为一致——"查阅手稿时时间静止"，玩家不会因开面板浪费算力
    if (gs.showDeckViewer) return;
    this.hoveredIdx = -1;
    this.upgradeHovered = false;
    this.removeHovered = false;
    this.leaveHovered = false;
    this.backHovered = false;
    if (this.phase === 'main') {
      let ux = GAME_W/2 - 100;
      let uy = GAME_H * 0.35;
      this.upgradeHovered = mx() > ux && mx() < ux + 200 && my() > uy && my() < uy + 50;
      let rx = GAME_W/2 - 100;
      let ry = GAME_H * 0.5;
      this.removeHovered = mx() > rx && mx() < rx + 200 && my() > ry && my() < ry + 50;
      let lx = GAME_W/2 - 50;
      let ly = GAME_H * 0.7;
      this.leaveHovered = mx() > lx && mx() < lx + 100 && my() > ly && my() < ly + 35;
    } else {
      // upgrade_select / remove_select 阶段：卡牌网格 hover
      let cards = this.phase === 'upgrade_select'
        ? gs.deck.filter(c => c.upgradeable && !c.upgraded)
        : gs.deck;
      // T187 重算滚动范围（卡牌数量可能因删牌/升级而变化）
      this._recalcArtisanScroll();
      for (let i = 0; i < cards.length; i++) {
        let col = i % 6;
        let row = Math.floor(i / 6);
        let cx = 150 + col * 160;  // T185 修复：恢复与 drawCardGridCommon 的 GRID_COL_GAP=160 一致，避免 hover/render 位置错位
        let cy = 190 + row * 150 - this._scrollY;  // T186 修复：与 drawCardGridCommon 的 GRID_START_Y=190 一致；T187 减去 scrollY 与渲染端一致
        if (mx() > cx - CARD_W/2 && mx() < cx + CARD_W/2 && my() > cy - CARD_H/2 && my() < cy + CARD_H/2) {
          this.hoveredIdx = i;
        }
      }
      // 返回按钮
      this.backHovered = mx() > 20 && mx() < 120 && my() > 20 && my() < 50;
    }
  }
  draw() {
    abyssVeil();
    // T203：牌库查看器打开时仅 super.draw()，跳过卡牌网格/主界面/3D 倾斜/阴影/镭射/T194 全套动效管线
    // 半透明遮罩 (fill 0, 200) + 大面板会覆盖，下方场景完全不可见 → "底层暂停冻结"
    if (gs.showDeckViewer) { super.draw(); return; }
    if (this.phase === 'main') {
      this.drawMain();
    } else {
      this.drawCardGrid();
    }
    super.draw();
  }
  drawMain() {
    noStroke();
    cFill('blueBright');
    textAlign(CENTER, CENTER);
    textSize(28);
    textStyle(BOLD);
    text('⚒ 工 匠 铺 ⚒', GAME_W/2, 60);
    cFill('text');
    noStroke();
    textSize(14);
    textStyle(NORMAL);
    text('"精选锻造，或熔炉重铸"', GAME_W/2, 100);
    // 升级按钮
    let ux = GAME_W/2 - 100;
    let uy = GAME_H * 0.35;
    let canUpgrade = gs.deck.filter(c => c.upgradeable && !c.upgraded).length > 0;
    if (this.upgradeHovered && canUpgrade) cFill('gold'); else cFill('panel');
    if (canUpgrade) cStroke('gold'); else cStroke('textDim');
    strokeWeight(1.5);
    rect(ux, uy, 200, 50, 8);
    noStroke();
    cFill(canUpgrade ? 'goldBright' : 'textDim');
    textAlign(CENTER, CENTER);
    textSize(16);
    textStyle(BOLD);
    text(canUpgrade ? '升级一张卡牌' : '无可升级卡牌', GAME_W/2, uy + 25);
    // 熔铸按钮
    let rx = GAME_W/2 - 100;
    let ry = GAME_H * 0.5;
    let canRemove = gs.deck.length > 5;
    if (this.removeHovered && canRemove) cFill('red'); else cFill('panel');
    if (canRemove) cStroke('red'); else cStroke('textDim');
    strokeWeight(1.5);
    rect(rx, ry, 200, 50, 8);
    noStroke();
    cFill(canRemove ? 'redBright' : 'textDim');
    textAlign(CENTER, CENTER);
    textSize(16);
    textStyle(BOLD);
    text(canRemove ? '熔炉重铸（免费删除）' : '牌组过小', GAME_W/2, ry + 25);
    // 离开
    let lx = GAME_W/2 - 50;
    let ly = GAME_H * 0.7;
    if (this.leaveHovered) cFill('gold'); else cFill('panel');
    cStroke('goldDim');
    strokeWeight(1);
    rect(lx, ly, 100, 35, 6);
    noStroke();
    cFill('text');
    textAlign(CENTER, CENTER);
    textSize(13);
    textStyle(NORMAL);
    text('离开', lx + 50, ly + 18);
  }
  // 使用 drawCardGridCommon 复用渲染
  drawCardGrid() {
    noStroke();
    let titleColor = this.phase === 'upgrade_select' ? 'gold' : 'red';
    cFill(titleColor);
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    let title = this.phase === 'upgrade_select' ? '选择要升级的卡牌' : '选择要熔铸的卡牌（免费）';
    text(title, GAME_W/2, 40);
    // 返回按钮
    if (this.backHovered) cFill('gold'); else cFill('panel');
    cStroke('goldDim');
    strokeWeight(1);
    rect(20, 20, 100, 30, 6);
    noStroke();
    cFill('text');
    textAlign(CENTER, CENTER);
    textSize(13);
    textStyle(NORMAL);
    text('← 返回', 70, 35);
    // 调用公共卡牌网格渲染函数
    let cards = this.phase === 'upgrade_select'
      ? gs.deck.filter(c => c.upgradeable && !c.upgraded)
      : gs.deck;
    // T187 滚轮支持：传入 scrollY 让渲染端应用垂直偏移
    drawCardGridCommon(cards, this.hoveredIdx, {
      highlightColor: this.phase === 'upgrade_select' ? 'gold' : 'red',
      showUpgradeTooltip: this.phase === 'upgrade_select',
      showDeleteHint: this.phase === 'remove_select',
      maxPerRow: 6,  // T184 工匠铺升级/删除网格：5→6（卡牌数量大幅增加，每行多容纳 1 张）
      scrollY: this._scrollY,  // T187 垂直滚动偏移（仅当 _maxScrollY>0 时有意义）
    });
    // T187 滚动指示器：仅当存在溢出时显示
    if (this._maxScrollY > 0) {
      // 右侧滚动条
      let barX = GAME_W - 12;
      let barY = 80;
      // T188 修复：底部预留 32px（18px 黑边 + 14px 视觉缓冲），让滚动条不接触黑边
      let barH = GAME_H - 80 - 32;
      noStroke();
      cFill('panel');
      rect(barX, barY, 6, barH, 3);
      // 滚动块高度 = 视口占比（视口高度 = 可见区域 = GAME_H - 80 - 18，减去顶部标题 + 底部黑边）
      let viewportH = GAME_H - 80 - 18;
      let visibleRatio = viewportH / (viewportH + this._maxScrollY);
      let thumbH = Math.max(20, barH * visibleRatio);
      let thumbY = barY + (barH - thumbH) * (this._scrollY / this._maxScrollY);
      cFill('goldDim');
      rect(barX, thumbY, 6, thumbH, 3);
      // T189 删去底部"滚轮浏览"文本（仅保留右侧滚动条指示）
    }
  }
  mousePressed() {
    if (this.phase === 'main') {
      if (this.upgradeHovered) {
        let canUpgrade = gs.deck.filter(c => c.upgradeable && !c.upgraded).length > 0;
        if (canUpgrade) {
          this.phase = 'upgrade_select';
          this._scrollY = 0;  // T187 切到新 phase 时重置滚动
        }
      } else if (this.removeHovered) {
        if (gs.deck.length > 5) {
          this.phase = 'remove_select';
          this._scrollY = 0;  // T187 切到新 phase 时重置滚动
        }
      } else if (this.leaveHovered) {
        gs.scene = 'map';
      }
    } else {
      if (this.backHovered) {
        this.phase = 'main';
        this._scrollY = 0;  // T187 返回主界面时重置滚动
        return;
      }
      if (this.hoveredIdx >= 0) {
        let cards = this.phase === 'upgrade_select'
          ? gs.deck.filter(c => c.upgradeable && !c.upgraded)
          : gs.deck;
        let card = cards[this.hoveredIdx];
        if (card) {
          if (this.phase === 'upgrade_select') {
            // 调用通用升级函数
            applyCardUpgrade(card);
            audio.playSFX('gold');
            floatingTexts.add(GAME_W/2, GAME_H/2, `${card.name} 升级!`, COLORS.gold, 20);
            gs.scene = 'map';
          } else {
            gs.removeCardByUid(card.uid);
            audio.playSFX('card_play');
            floatingTexts.add(GAME_W/2, GAME_H/2, `${card.name} 已熔铸`, COLORS.red, 20);
            gs.scene = 'map';
          }
        }
      }
    }
  }
  // T187 滚轮支持：参考战斗内牌库 L12340-12356 的自然滚动模式（上滚→内容上移露出下方）
  // 仅当 _maxScrollY>0（卡牌超出原窗口范围）时才响应滚轮
  mouseWheel(event) {
    if (this.phase === 'main') return;  // 主界面不响应
    if (this._maxScrollY <= 0) return;  // 无溢出时不响应
    let step = 40;  // 与战斗内牌库一致的步长
    // 自然滚动：上滚(delta>0)→内容上移→scrollY 增加；下滚(delta<0)→内容下移→scrollY 减少
    this._scrollY += (event.delta > 0 ? step : -step);
    this._scrollY = constrain(this._scrollY, 0, this._maxScrollY);
    return false;  // 阻止浏览器默认滚动
  }
}

// ==================== 宝藏场景 ====================
class TreasureScene extends Scene {
  enter() {
    super.enter();
    audio.playShopBGM();
    this.relics = this.generateRelics();
    this.hoveredIdx = -1;
    this.selected = false;
  }
  generateRelics() {
    let pool = [...RELIC_DATA];
    let relics = [];
    for (let i = 0; i < 3; i++) {
      let r = pick(pool);
      if (!relics.find(x => x.id === r.id)) relics.push({...r});
    }
    return relics;
  }
  update() {
    super.update();
    if (this.selected) return;
    this.hoveredIdx = -1;
    for (let i = 0; i < this.relics.length; i++) {
      let rx = GAME_W/2 + (i - 1) * 250;
      let ry = GAME_H/2 - 20;

// ==================== 删牌场景 ====================
class RemoveCardScene extends Scene {
  enter() {
    super.enter();
    this.hoveredIdx = -1;
    // T216 滚轮浏览支持：与 ArtisanScene.remove_select phase 完全一致的滚动机制
    this._scrollY = 0;
    this._maxScrollY = 0;
    // T217 返回按钮悬停状态（与 ArtisanScene.backHovered 一致）
    this.backHovered = false;
  }
  // T216 计算滚动范围（参考 ArtisanScene._recalcArtisanScroll L10913-L10934）
  // maxPerRow=5（保持商店删牌原有布局，不同于工匠铺的 6 列）
  // 末行卡牌底部 y 坐标：GRID_START_Y=190 + (totalRows-1)*GRID_ROW_GAP=150 + CARD_H/2=100
  // 视图底部安全区 = GAME_H - 18（避开底部 2.5% 电影黑边，与工匠铺一致）
  _recalcRemoveScroll() {
    let cards = gs.deck;
    if (cards.length === 0) {
      this._maxScrollY = 0;
      this._scrollY = 0;
      return;
    }
    let totalRows = Math.ceil(cards.length / 5);  // maxPerRow=5
    let lastRowBottom = 190 + (totalRows - 1) * 150 + 100;
    const SAFE_BOTTOM = GAME_H - 18;
    this._maxScrollY = Math.max(0, lastRowBottom - SAFE_BOTTOM);
    this._scrollY = constrain(this._scrollY, 0, this._maxScrollY);
  }
  update() {
    super.update();
    // T203：牌库查看器打开时暂停 RemoveCardScene 更新（卡牌网格悬停/动画/scrollY）
    // 与 BattleScene 5501 行为一致——"查阅手稿时时间静止"
    if (gs.showDeckViewer) return;
    // T216 滚动范围重算（参考 ArtisanScene.update L10961——卡牌数量可能变化）
    this._recalcRemoveScroll();
    this.hoveredIdx = -1;
    this.backHovered = false;  // T217 重置返回按钮悬停
    // T217 返回按钮悬停检测（与 ArtisanScene L10972 完全一致：20,20,100,30）
    this.backHovered = mx() > 20 && mx() < 120 && my() > 20 && my() < 50;
    for (let i = 0; i < gs.deck.length; i++) {
      let col = i % 5;
      let row = Math.floor(i / 5);
      let cx = 150 + col * 160;  // GRID_START_X=150 + GRID_COL_GAP=160
      // T216 修复：原 cy=120 与 drawCardGridCommon 的 GRID_START_Y=190 偏移 70px，导致 hover 检测错位
      // 现与 drawCardGridCommon L10167 完全一致：GRID_START_Y=190 + row*150 - scrollY
      let cy = 190 + row * 150 - this._scrollY;
      if (mx() > cx - CARD_W/2 && mx() < cx + CARD_W/2 && my() > cy - CARD_H/2 && my() < cy + CARD_H/2) {
        this.hoveredIdx = i;
      }
    }
  }
  // 使用 drawCardGridCommon 复用渲染
  draw() {
    abyssVeil();
    // T203：牌库查看器打开时仅 super.draw()，跳过卡牌网格/标题/3D 倾斜/阴影/镭射动效管线
    if (gs.showDeckViewer) { super.draw(); return; }
    cFill('red');
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    text('选择要移除的卡牌', GAME_W/2, 40);
    // T217 返回按钮：与 ArtisanScene.drawCardGrid L11051-L11061 完全一致
    if (this.backHovered) cFill('gold'); else cFill('panel');
    cStroke('goldDim');
    strokeWeight(1);
    rect(20, 20, 100, 30, 6);
    noStroke();
    cFill('text');
    textAlign(CENTER, CENTER);
    textSize(13);
    textStyle(NORMAL);
    text('← 返回', 70, 35);
    drawCardGridCommon(gs.deck, this.hoveredIdx, {
      highlightColor: 'red',
      showDeleteHint: true,
      // T216 传入 scrollY 让渲染端应用垂直偏移（参考 ArtisanScene.drawCardGrid L11067-L11073）
      scrollY: this._scrollY,
    });
    // T216 滚动指示器：与 ArtisanScene L11075-11092 完全一致（仅当存在溢出时显示）
    if (this._maxScrollY > 0) {
      let barX = GAME_W - 12;
      let barY = 80;
      let barH = GAME_H - 80 - 32;
      noStroke();
      cFill('panel');
      rect(barX, barY, 6, barH, 3);
      let viewportH = GAME_H - 80 - 18;
      let visibleRatio = viewportH / (viewportH + this._maxScrollY);
      let thumbH = Math.max(20, barH * visibleRatio);
      let thumbY = barY + (barH - thumbH) * (this._scrollY / this._maxScrollY);
      cFill('goldDim');
      rect(barX, thumbY, 6, thumbH, 3);
    }
    super.draw();
  }
  mousePressed() {
    // T254：本子场景为商店/事件共用，目的地、费用、返回语义全部由调用方经 gs._removeCardCtx 注入，
    //   禁止再硬编码 'shop'——旧代码返回与删牌两处出口都写死商店，导致事件删牌或点"← 返回"
    //   都误入一个凭空生成的商店（事件被吞、付费事件还被商店价二次扣费）。缺省上下文按商店兜底。
    let ctx = gs._removeCardCtx || { source: 'shop' };
    // 返回按钮优先处理（与 ArtisanScene.mousePressed 一致；不扣金）
    if (this.backHovered) {
      if (ctx.source === 'event') {
        // 放弃删牌：事件预收费用全额退还（选项已消费，给结果文案 → 点"继续"回地图，不能改选但也不白花钱）
        if (ctx.prepaid) gs.gold += ctx.prepaid;
        scenes.event._returnPayload = { resultText: ctx.resultCancel || '你选择了离开...' };
      }
      gs._removeCardCtx = null;  // 上下文一次性消费
      gs.scene = ctx.source === 'event' ? 'event' : 'shop';
      return;
    }
    if (this.hoveredIdx >= 0) {
      // T217：商店价只在实际删牌后扣（进入即扣会导致点返回仍被扣金）；
      // T254：事件来源走 ctx.cost（费用已由事件按事件价预收，此处恒为 0），商店来源才按商店价（含折扣）。
      let cost = ctx.source === 'event'
        ? (ctx.cost || 0)
        : Math.floor(75 * (1 - gs.getShopDiscount()));
      if (gs.gold >= cost) {
        gs.gold -= cost;
        let card = gs.deck[this.hoveredIdx];
        gs.removeCardByUid(card.uid);
        audio.playSFX('card_play');
        if (ctx.source === 'event') {
          // 回本事件结果页：EventScene.enter 消费 _returnPayload 保留原事件（不重新 pick）
          scenes.event._returnPayload = { resultText: ctx.resultDone || '一张卡牌已被移除。' };
        }
        gs._removeCardCtx = null;  // 上下文一次性消费
        gs.scene = ctx.source === 'event' ? 'event' : 'shop';  // 商店：便于继续浏览/购买
      }
    }
  }
  // T216 滚轮支持：与 ArtisanScene.mouseWheel L11140-L11148 完全一致
  // 自然滚动模式（与战斗内牌库 L14726-14730 一致）：上滚(delta>0)→内容上移→scrollY 增加
  // 仅当 _maxScrollY>0（卡牌超出原窗口范围）时才响应
  mouseWheel(event) {
    if (this._maxScrollY <= 0) return;  // 无溢出时不响应
    let step = 40;  // 与工匠铺/战斗内牌库一致的步长
    this._scrollY += (event.delta > 0 ? step : -step);
    this._scrollY = constrain(this._scrollY, 0, this._maxScrollY);
    return false;  // 阻止浏览器默认滚动
  }
}

// ==================== 胜利/失败场景 ====================
// ==================== T242：局终战报（把"结果"还原成"过程"） ====================
//   改动动机：结算页此前只给一个结论 —— SUCCEED / LOST。玩家看到的是"我赢了/我没了"，
//   却看不到它**是怎么发生的**。而过程数据其实一直都在 gs.runStats 里攒着，只是没被读出来。
//   这里把它摊在巨字正下方（眼睛看完结论后自然的落点）：出牌几张、放倒几只、最深的一击
//   有多深、一共挨了多少、打了多少场；失败时再点名"终结你的是谁、最后一击多重"。
//   数字从 0 缓动到实际值 —— 揭晓本身要有一次呼吸，而不是一行冻住的统计。
function recapFacts() {
  const s = (typeof gs !== 'undefined' && gs && gs.runStats) ? gs.runStats : null;
  return {
    cards:    (s && s.cardsPlayed)  || 0,
    kills:    (s && s.kills)        || 0,
    maxHit:   (s && s.maxHit)       || 0,
    taken:    (s && s.damageTaken)  || 0,
    lastHit:  (s && s.lastHit)      || 0,
    battles:  (s && s.battles)      || 0,
    floor:    (gs && gs.floorNumber)   || 0,
    region:   (gs && gs.currentRegion) || 0,
    lastEnemy:(s && s.lastEnemy) ? String(s.lastEnemy) : '',
  };
}

// 判因：把"为什么是这个结局"压成一句人话。胜利点名终点，失败点名凶手。
function recapVerdict(win) {
  const f = recapFacts();
  if (win) {
    const regions = Math.max(1, (f.region || 0) + 1);
    return `最后一只造物散作灰烬 · 你走遍了 ${regions} 个区域`;
  }
  const who = f.lastEnemy ? `终结你的是「${f.lastEnemy}」` : '你的生命流尽了';
  const hit = (f.lastHit > 0) ? ` · 最后一击 ${f.lastHit}` : '';
  return `陨落于第 ${f.floor} 层 · ${who}${hit}`;
}

// 分段绘制一行：segs = [[文本, 颜色键, alpha], ...]，整体水平居中。
//   数字与标签分色，避免整行同权重糊成一片（中英混排也能精确对齐）。
function recapRow(cx, y, segs, size) {
  textSize(size);
  textStyle(NORMAL);
  textAlign(LEFT, CENTER);
  noStroke();
  let total = 0;
  for (const s of segs) total += textWidth(s[0]);
  let x = cx - total / 2;
  for (const s of segs) {
    cFill(s[1], s[2]);
    text(s[0], x, y);
    x += textWidth(s[0]);
  }
}

// 战报主体。y = 数据行基线，判因行在其下方 whyGap 处；两行各自上浮 8px 淡入。
//   tone: 'gold' 胜利页 / 'red' 失败页；dataT / whyT 由调用方用 _cue() 驱动，与 T238 分幕同构。
function drawRunRecap(y, o) {
  const dataT = constrain(o.dataT || 0, 0, 1);
  const whyT  = constrain(o.whyT  || 0, 0, 1);
  if (dataT <= 0 && whyT <= 0) return;
  const red      = (o.tone === 'red');
  const numKey   = red ? 'redBright' : 'goldBright';
  const labelKey = 'textDim';
  const whyKey   = red ? 'red'       : 'goldDim';
  const f = recapFacts();
  const e = 1 - Math.pow(1 - dataT, 3);        // easeOutCubic：数字滚到位就停住，不来回抖
  const n = (v) => String(Math.round(v * e));
  const cx = GAME_W / 2;
  push();
  if (dataT > 0) {
    const da = Math.floor(255 * 0.92 * dataT);  // 标签
    const na = Math.floor(255 * dataT);         // 数字（比标签亮，先被看见）
    recapRow(cx, y + (1 - dataT) * 8, [
      ['出牌 ', labelKey, da],        [n(f.cards), numKey, na],
      [' 张 · 放倒 ', labelKey, da],  [n(f.kills), numKey, na],
      [' 只 · 最深一击 ', labelKey, da], [n(f.maxHit), numKey, na],
      [' · 承伤 ', labelKey, da],     [n(f.taken), numKey, na],
      [' · 战斗 ', labelKey, da],     [n(f.battles), numKey, na],
      [' 场', labelKey, da],
    ], 14);
  }
  if (whyT > 0) {
    const wa = Math.floor(255 * 0.88 * whyT);
    const gapY = (o.whyGap != null) ? o.whyGap : 27;
    recapRow(cx, y + gapY + (1 - whyT) * 8, [[recapVerdict(!!o.win), whyKey, wa]], 13);
  }
  pop();
}

class VictoryScene extends Scene {
  enter() {
    super.enter();
    audio.playMapBGM();
    this.time = 0;
    this.tiltX = 0; this.tiltY = 0; // 鼠标移轴连轴（同开始页 TitleScene）
    this.titleY = -100; // T238 幕一：砸落起点（画面外上方）
    this.titleTargetY = GAME_H * 0.30; // T238：标题带上移 0.38→0.30，与下方文案带物理隔离
    // AI 判词：异步获取，未返回前不占位；AI 关闭时直接用本地预制句（零调用）
    this.aiEulogy = null;
