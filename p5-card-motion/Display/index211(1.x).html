// 颜色辅助函数：将hex颜色字符串转为{r,g,b}对象
function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return { r: parseInt(h.substring(0,2), 16), g: parseInt(h.substring(2,4), 16), b: parseInt(h.substring(4,6), 16) };
}
// 预计算所有颜色的RGB值
const COLORS_RGB = {};
for (let [k, v] of Object.entries(COLORS)) {
  if (typeof v === 'string' && v.startsWith('#')) COLORS_RGB[k] = hexToRgb(v);
  else COLORS_RGB[k] = v;
}
// 安全fill：cFill(颜色名, [alpha])
function cFill(colorName, alpha) {
  let c = COLORS_RGB[colorName];
  if (c === undefined) {
    if (typeof colorName === 'string' && colorName.startsWith('#')) {
      let rr = hexToRgb(colorName);
      if (alpha !== undefined) fill(rr.r, rr.g, rr.b, alpha);
      else fill(rr.r, rr.g, rr.b);
    } else fill(colorName);
    return;
  }
  if (typeof c === 'object') {
    if (alpha !== undefined) fill(c.r, c.g, c.b, alpha);
    else fill(c.r, c.g, c.b);
  } else fill(c);
}
// 安全stroke：cStroke(颜色名, [alpha])
function cStroke(colorName, alpha) {
  let c = COLORS_RGB[colorName];
  if (c === undefined) {
    if (typeof colorName === 'string' && colorName.startsWith('#')) {
      let rr = hexToRgb(colorName);
      if (alpha !== undefined) stroke(rr.r, rr.g, rr.b, alpha);
      else stroke(rr.r, rr.g, rr.b);
    } else stroke(colorName);
    return;
  }
  if (typeof c === 'object') {
    if (alpha !== undefined) stroke(c.r, c.g, c.b, alpha);
    else stroke(c.r, c.g, c.b);
  } else stroke(c);
}
// 安全fill原始值：cFillRaw(颜色名, [alpha])
function cFillRaw(colorName, alpha) {
  let c = COLORS_RGB[colorName];
  if (c === undefined) return null;
  if (alpha !== undefined) return { r: c.r, g: c.g, b: c.b, a: alpha };
  return { r: c.r, g: c.g, b: c.b };
}
// 安全stroke原始值：cStrokeRaw(颜色名, [alpha])
function cStrokeRaw(colorName, alpha) {
  return cFillRaw(colorName, alpha);
}

// 取一个「可能还处在 TDZ 中」的模块级 const/let。
//   本文件按叙事顺序组织，把若干常量（MAP_LAYER_CONFIG）与单例（saveManager / __starSdk）
//   声明在了使用它们的函数之后 —— 模块求值期访问会抛 ReferenceError，typeof 也救不了，
//   于是散落各处长出了 7 段 try/catch。这些兜底本身没错（防御是必要的），
//   但**同一件事写七遍**就会有人漏改其中一处。收口成一个 helper：一处说明，处处可用。
//   正常游玩时序下 fn 一定能拿到值，def 只是防御性兜底。
function safeRef(fn, def) {
  try { const v = fn(); return (v === undefined || v === null) ? def : v; } catch (e) { return def; }
}

// ==================== 窗口适配：缩放因子系统 ====================
// 基准设计分辨率为 GAME_W × GAME_H，实际画布尺寸通过 windowWidth/windowHeight 创建
// 渲染时整体应用 scale(scaleW, scaleH) 把基准坐标系映射到实际画布
// 鼠标坐标需通过 mx()/my() 逆变换回基准坐标系
let scaleW = 1, scaleH = 1, scaleFactor = 1;
function recomputeScale() {
  // 根据当前画布尺寸重算缩放因子（防止 width/height 为 0 时除零）
  if (width <= 0 || height <= 0) return;
  scaleW = width / GAME_W;
  scaleH = height / GAME_H;
  scaleFactor = Math.min(scaleW, scaleH);
}
// 鼠标坐标逆变换：将屏幕像素坐标转回基准设计坐标
// 使用 window 间接访问避免与全文 mx()/my() 替换冲突
function mx() { return window['mouse' + 'X'] / scaleW; }
function my() { return window['mouse' + 'Y'] / scaleH; }

// ==================== 卡牌类型分类辅助函数 ====================
// 攻击牌判定：传统攻击牌 + 能力牌中能造成伤害的
function isOffensiveCard(card) {
  if (!card) return false;
  if (card.type === 'attack') return true;
  if (card.type === 'power' && (card.baseDmg || 0) > 0) return true;
  return false;
}
// 防御牌判定：传统技能牌含格挡 + 能力牌中含格挡的
function isDefensiveCard(card) {
  if (!card) return false;
  if (card.type === 'skill' && ((card.baseBlock || 0) > 0 || card.comboBlock)) return true;
  if (card.type === 'power' && ((card.baseBlock || 0) > 0 || card.comboBlock)) return true;
  return false;
}
// 直接伤害判定：卡牌是否有 baseDmg > 0
function canDealDirectDamage(card) {
  if (!card) return false;
  return (card.baseDmg || 0) > 0;
}
// 计算异常牌在当前战斗状态下的实际施加层数（含连击加成）
// 反映 playCard L4701-L4707 的实际施加公式：statusAmt + floor((comboAdded + comboCount)/2) [+ comboCount * statusPerCombo]
// 仅对"异常"keyword + 单一 statusType（排除 random/all/multi）的牌有效
function getEffectiveStatusAmt(card) {
  if (!card || !card.statusAmt) return 0;
  if (!(card.keywords && card.keywords.includes('异常'))) return card.statusAmt;
  if (!card.statusType) return card.statusAmt;
  if (card.statusType === 'random' || card.statusType === 'multi' || card.statusType === 'all') return card.statusAmt;
  // 用 gs.scene === 'battle' 守卫：combatState 在战斗结束后保留到下次 initCombat，期间非战斗场景不应读取
  let cs = (gs.scene === 'battle') ? gs.combatState : null;
  if (!cs) return card.statusAmt;  // 非战斗场景（升级界面、删牌界面、牌库等）返回基础值
  // 异常 keyword 块在 L4702 时 comboAdded 的值：
  //   - 异常 keyword 自身 +1 在 L4718（applyStatus 之后），所以异常块开始时 comboAdded=0
  //   - 若卡牌同时含 连击/先攻/猛击/震慑 等 keyword，会在异常块之前让 comboAdded=1
  let kws = card.keywords || [];
  let comboAdded = 0;
  if (kws.includes('连击') || kws.includes('先攻') || kws.includes('猛击') || kws.includes('震慑')) {
    comboAdded = 1;
  }
  if (comboAdded > 0 || cs.comboCount > 0) {
    let amt = card.statusAmt + Math.floor((comboAdded + cs.comboCount) / 2);
    if (card.statusPerCombo) {
      amt += cs.comboCount * card.statusPerCombo;
    }
    return amt;
  }
  return card.statusAmt;
}

// ==================== PHASE 1a · 状态感知敌人决策（规则评分层） ====================
// 依据《AI 智能化升级方案》§4.2 双层架构的【规则评分层】：
//   · 同步、零延迟、零 AI 调用 —— AI 关闭时行为即本层（经典模式完整可玩、零成本）
//   · 只从 intentPattern 候选集中【选意图】，绝不发明新意图
//   · 绝不改数值：伤害/格挡/异常数值仍全部由难度系统与敌人模板决定（平衡守底线）
// 多样性来源：① 战术人格 ② 加权随机(softmax) ③ 重复抑制 ④ 读牌（玩家行为侧写）
// 巧妙性来源：斩杀线识别 / 破盾判断 / 连击威胁响应 / 虚弱规避 / 易伤利用 / 读牌对策

// ① 战术人格：同一局势下不同敌人做出不同选择（多样性来源 1）
const ENEMY_TEMPERAMENT = {
  berserk:     { name: '狂暴', attack:  2.5, defend: -1.5, special:  0.0, variety: 0.7 },
  cautious:    { name: '谨慎', attack: -1.0, defend:  2.0, special:  0.5, variety: 1.0 },
  opportunist: { name: '投机', attack:  1.5, defend: -0.5, special:  0.5, variety: 1.0 },
  controller:  { name: '操控', attack: -0.8, defend:  0.0, special:  2.2, variety: 1.0 },
  trickster:   { name: '诡诈', attack:  0.0, defend:  0.0, special:  0.8, variety: 2.4 },
  adaptive:    { name: '适应', attack:  0.2, defend:  0.2, special:  0.2, variety: 1.2 },
};
// 由敌人数据推导人格：未显式声明 temperament 时自动推断（无需逐个改 ENEMY_DATA）
function getEnemyTemperament(ed) {
  if (!ed) return 'adaptive';
  if (ed.temperament && ENEMY_TEMPERAMENT[ed.temperament]) return ed.temperament;
  const sp = ed.special || {};
  if (ed.isBoss) return 'adaptive';                       // Boss：最均衡、最能读局势
  if (sp.type === 'heal') return 'cautious';
  if (sp.type === 'debuff') return 'controller';
  if (ed.comboSiphon || ed.comboBreakTurns || ed.comboReflect) return 'opportunist';
  if ((ed.blockAmt || 0) > (ed.attackDmg || 0)) return 'cautious';
  if ((ed.attackDmg || 0) >= (ed.blockAmt || 0) * 2) return 'berserk';
  return 'adaptive';
}

// ==================== AI 话语权标定（PHASE 1a · 难度分档） ====================
// 设计目标：AI 只改变"敌人这一回合的战术倾向"，且只在精英/Boss 战局介入（普通战斗零调用、零成本）。
// 度量口径：归一化 AI 占比 = (实测命中率 − 基线命中率) / (1 − 基线命中率)
//   基线命中率 ≈ 33.7%：即使 w=0（纯规则层），规则层也有约 1/3 概率"碰巧"选中 AI 偏好的那一类，
//   这部分不算 AI 的功劳，必须从命中率里扣掉，否则会高估 AI 的实际话语权。
// ▸ 精英/Boss 占全部战斗节点的实测比例（20 万局蒙特卡洛，含 2 区域）：29.2%
//   单局波动较大：P10 19% / P50 28.6% / P90 39.1%，因此全局占比是长期期望值，不是单局保证。
const ELITE_BOSS_NODE_SHARE = 0.292;
// ▸ 锚定在"精英/Boss 内占比"：20% / 40% / 60% / 80%（这是 w 唯一能直接控制的量）
//   折算全局 = 该值 × 29.2% ≈ 5.8% / 11.7% / 17.5% / 23.4%
// 若希望改为锚定"全局 5%/10%/15%/20%"，把下面整表替换为另一组标定值即可：
//   { whisper: 0.252, echo: 0.419, abyss: 0.549, oblivion: 0.665 }  // 精英/Boss 内 17.1/34.2/51.3/68.4%
const AI_TARGET_SHARE_EB = { whisper: 0.20, echo: 0.40, abyss: 0.60, oblivion: 0.80 };
// ⚠ 下面的 w 是"混合权重"，与目标占比非线性（w 先改变候选分差、再经 softmax 变成概率），
//   由二分反解标定得出，请勿手改 —— 改 AI_TARGET_SHARE_EB 后重跑 solve-w.js 重新标定。
const AI_TACTIC_WEIGHT = {
  whisper:  0.284,  // 低语 I   ：目标 20%，实测精英/Boss 内 20.0%，折算全局 ~5.8%
  echo:     0.466,  // 回响 II  ：目标 40%，实测精英/Boss 内 40.0%，折算全局 ~11.7%
  abyss:    0.608,  // 深渊 III ：目标 60%，实测精英/Boss 内 60.0%，折算全局 ~17.5%
  oblivion: 0.757,  // 湮灭 IV  ：目标 80%，实测精英/Boss 内 80.0%，折算全局 ~23.4%
};
// AI 偏好相对"规则层最高分"的领先幅度：越大则 AI 偏好越具压倒性
const AI_PREF_SEP = 2.5;
function getAiTacticWeight() {
  try {
    const d = (typeof getDifficulty === 'function') ? getDifficulty() : null;
    if (d) {
      if (typeof AI_TACTIC_WEIGHT[d.key] === 'number') return AI_TACTIC_WEIGHT[d.key];
      if (typeof AI_TACTIC_WEIGHT[d.name] === 'number') return AI_TACTIC_WEIGHT[d.name];
    }
  } catch (e) { /* 难度系统不可用时回落最低档，宁可保守 */ }
  return AI_TACTIC_WEIGHT.whisper;
}
// 调试用：控制台执行 aiWeightReport() 查看当前档位的 AI 话语权标定（不参与游戏逻辑）
function aiWeightReport() {
  let key = 'whisper';
  try {
    const d = (typeof getDifficulty === 'function') ? getDifficulty() : null;
    if (d && AI_TACTIC_WEIGHT[d.key] != null) key = d.key;
  } catch (e) { /* 回落最低档 */ }
  return {
    难度档位: key,
    精英Boss内AI占比: AI_TARGET_SHARE_EB[key],
    混合权重w: AI_TACTIC_WEIGHT[key],
    折算全局占比: +(AI_TARGET_SHARE_EB[key] * ELITE_BOSS_NODE_SHARE).toFixed(3),
    当前是否真实AI: !!(gs && gs.aiTacticFromAi),
  };
}

// ==================== 难度系统（4 档 · 三维打击模型） ====================
// 旧版只缩放敌人数值，玩家侧资源四档完全一致、且没有时间压力，导致卡组成型后各档都能碾压。
// 新版三维同时施压：

const DEFAULT_DIFFICULTY = 1; // II 回响 = 原版平衡

// 取当前难度配置（gs 未就绪时回落到默认档，保证任何时机调用都安全）
function getDifficulty() {
  if (typeof gs !== 'undefined' && gs && DIFFICULTY_DATA[gs.difficulty]) return DIFFICULTY_DATA[gs.difficulty];
  return DIFFICULTY_DATA[DEFAULT_DIFFICULTY];
}

// ---- 相位迁跃者：连击「不消耗」的两个开关 ----
//   遗物把机制写成了数据（comboNoConsume / comboMaxPerTurn），但旧代码只**硬编码实现了上限**
//   （Math.min(comboCount, 5)），comboNoConsume 从头到尾没有任何引用 ——
//   于是猛击 / 震慑 / 灼热连击 / 剧毒连击照常把连击清光，这个稀有遗物实际只给了个上限惩罚。
//   这里收口成查询函数，**读遗物上的字段**：数据与逻辑各说各话，迟早要还。
function phaseShifterRelic() {
  try {
    if (typeof gs === 'undefined' || !gs) return null;
    if (typeof gs.hasRelic !== 'function' || !gs.hasRelic('phase_shifter')) return null;
    const list = gs.relics || [];
    for (let i = 0; i < list.length; i++) {
      if (list[i] && list[i].id === 'phase_shifter') return list[i];
    }
    return null;
  } catch (e) { return null; }
}
// 连击是否不被消耗（猛击 / 震慑 / 连击转化类手段不再清零）
function comboNoConsumeNow() {
  const r = phaseShifterRelic();
  return !!(r && r.comboNoConsume);
}
// 每回合连击上限（无此遗物时不设上限；99 只是"事实上封不了"的哨兵值）
function comboMaxPerTurnNow() {
  const r = phaseShifterRelic();
  return (r && r.comboMaxPerTurn) || 99;
}

// ---- 难度速览：把「设计师的倍率」翻译成「玩家的增减」 ----
//   「敌 HP×1.55」是给做表的人看的写法 —— 玩家真正想知道的是「比标准难多少」。
//   以 II 回响（全部 1.00 / 零加成）为标准档，倍率换算成相对标准的百分比增减；
//   恰好等于标准的维度明说「标准」而不是省略 —— 省略会让人以为信息漏了。
//   ⚠️ 增减一律用 ASCII 的 + / -（U+2212 在某些字体下会掉字）。
function diffDeltaText(mul) {
  if (mul === undefined || mul === null) return null;
  if (Math.abs(mul - 1) < 0.005) return null;      // 视为无增减
  const p = Math.round((mul - 1) * 100);
  return (p > 0 ? '+' : '-') + Math.abs(p) + '%';
}
function diffStatLine(it) {
  const base = DIFFICULTY_DATA[DEFAULT_DIFFICULTY];
  const segs = [];
  // ① 敌人侧：生命 / 伤害
  const eh = diffDeltaText(it.enemyHp), ed = diffDeltaText(it.enemyDmg);
  segs.push((eh || ed)
    ? '敌人 ' + [eh ? '生命' + eh : '', ed ? '伤害' + ed : ''].filter(Boolean).join(' ')
    : '敌人 标准');
  // ② 玩家侧：生命 / 承伤（承伤用「受伤」—— "你受到的伤害" 的口语说法）
  const ph = diffDeltaText(it.playerHp), pt = diffDeltaText(it.playerDmgTaken);
  segs.push((ph || pt)
    ? '你 ' + [ph ? '生命' + ph : '', pt ? '受伤' + pt : ''].filter(Boolean).join(' ')
    : '你 标准');
  // ③ 节奏侧：行动点 / 抽牌 / 手牌 —— 与上面保持同一套「相对标准」的口吻，不混用绝对值
  const rhy = [];
  const dAp = it.apBonus - base.apBonus;
  const dDraw = it.drawPerTurn - base.drawPerTurn;
  const dHand = it.handLimit - base.handLimit;
  if (dAp) rhy.push('行动点' + (dAp > 0 ? '+' : '-') + Math.abs(dAp));
  if (dDraw) rhy.push('抽牌' + (dDraw > 0 ? '+' : '-') + Math.abs(dDraw));
  if (dHand) rhy.push('手牌' + (dHand > 0 ? '+' : '-') + Math.abs(dHand));
  segs.push(rhy.length ? rhy.join(' ') : '节奏 标准');
  return segs.join(' · ');
}

// 把难度倍率套用到敌人模板，返回一份全新的缩放副本（绝不污染 ENEMY_DATA 原型）
//   精英/首领（isElite / isBoss / isVoidSovereign）额外套 eliteBossHp / eliteBossDmg 二次加成，
//   让高难度的精英战与首领战具备独立的压迫感层次，而非仅仅整体等比放大。
function applyDifficultyToEnemy(tpl) {
  if (!tpl) return tpl;
  const d = getDifficulty();
  // PHASE 3 无尽回响：叠加「深度倍率」。主线内恒为 1（原平衡一个字不改），
  //   超出主线后按次线性曲线上升。纯确定性函数、零 AI 费用。
  //   ⚠️ ECHO_SYS 是 const 且声明在本函数之后：正常游玩时序下它早已初始化，
  //   但 try 兜底可防止任何「过早求值」把整场战斗带崩（防御性，宁可不加成也不能报错）。
  let echo = { hp: 1, dmg: 1, gold: 1, tier: 0 };
  try { if (typeof echoMulNow === 'function') echo = echoMulNow(); } catch (e) {}
  // PHASE 5 动态怜悯：连续受挫时给一点点喘息。纯本地确定性算法、**零 AI 费用**。
  //   mercyNow() 内部已处理「当前难度档是否跳过（湮灭不给怜悯）」，这里只需再处理 Boss：
  //   精英 / 首领是里程碑，数值保持纯粹，不受怜悯影响。
  //   ⚠️ MERCY_SYS 是 const 且声明在本函数之后：正常游玩时序下早已初始化，
  //   try/catch 兜底可防止任何「过早求值」把整场战斗带崩（宁可不减免，也不能报错）。
  let mercy = { hp: 1, dmg: 1, m: 0 };
  try { if (typeof mercyNow === 'function') mercy = mercyNow(); } catch (e) {}
  const isBossTier = !!(tpl.isElite || tpl.isBoss || tpl.isVoidSovereign);
  // 精英 / 首领是里程碑，数值保持纯粹 → 怜悯对它们不生效
  let mh = mercy.hp, md = mercy.dmg;
  try { if (isBossTier && typeof MERCY_SYS !== 'undefined' && MERCY_SYS.skipBoss) { mh = 1; md = 1; } } catch (e) {}
  const hpMul = d.enemyHp * (isBossTier ? d.eliteBossHp : 1) * echo.hp * mh;
  const dmgMul = d.enemyDmg * (isBossTier ? d.eliteBossDmg : 1) * echo.dmg * md;
  const out = { ...tpl };
  const baseMaxHp = (typeof tpl.maxHp === 'number') ? tpl.maxHp : (tpl.hp || 1);
  out.maxHp = Math.max(1, Math.round(baseMaxHp * hpMul));
  out.hp = out.maxHp;
  if (typeof tpl.attackDmg === 'number') out.attackDmg = Math.max(1, Math.round(tpl.attackDmg * dmgMul));
  if (typeof tpl.blockAmt === 'number') out.blockAmt = Math.max(0, Math.round(tpl.blockAmt * d.enemyBlock));
  if (tpl.special) {
    out.special = { ...tpl.special };
    if (typeof out.special.dmg === 'number') out.special.dmg = Math.max(1, Math.round(out.special.dmg * d.specialAmt));
    if (typeof out.special.amt === 'number') out.special.amt = Math.max(1, Math.round(out.special.amt * d.specialAmt));
  }
  if (typeof tpl.specialChance === 'number') out.specialChance = clamp(tpl.specialChance + d.specialChanceBonus, 0, 0.95);
  // 多阶段首领（二/三阶段）攻击力同步缩放，避免阶段推进后数值回落；
  // 同时按 bossPhaseMul 抬高/降低阶段阈值：高难度首领更早暴走，低难度则更晚。
  ['bossPhase2', 'bossPhase3'].forEach(k => {
    if (tpl[k]) {
      out[k] = { ...tpl[k] };
      if (typeof out[k].attackDmg === 'number') out[k].attackDmg = Math.max(1, Math.round(out[k].attackDmg * dmgMul));
      if (typeof out[k].hpThreshold === 'number') {
        out[k].hpThreshold = clamp(Math.round(out[k].hpThreshold * d.bossPhaseMul), 1, out.maxHp - 1);
      }
    }
  });
  // 保留原始基准值，便于 tooltip / 调试对照（不参与任何计算）
  out._baseMaxHp = baseMaxHp;
  out._baseAttackDmg = tpl.attackDmg;
  // PHASE 3：记录本场战斗套用的深度倍率（调试/测试断言用，不参与任何后续计算）
  out._echo = echo;
  // PHASE 5：记录本场战斗套用的怜悯倍率（调试/测试断言用，不参与任何后续计算）
  out._mercy = { hp: mh, dmg: md, m: mercy.m };
  return out;
}

// 目标：在**不花一分 AI 费用**的前提下实现「内容无限」。

// 确定性要求：同一存档重进同一节点，变体必须一致（否则读档后敌人变了，破坏存档可信度）。
//   → 用 (nodeId + enemyId + region) 哈希作种子，而非 Math.random()。
const VARIANT_SYS = {

  maxAffixes: 3,
  normalChance: [0.55, 0.75],  // 普通战斗变体概率：按区域（第1区/第2区）
  eliteChance: [0.75, 0.90],   // 精英战变体概率
  bossChance: 0,               // Boss 不变体：Boss 是手工设计的多阶段演出，保持设计完整性
  floorBonus: 0.03,            // 每深一层，概率 +3%（见 abyssDepth：深度 0~11）
  maxFloorBonus: 0.25,         // 深度加成上限

  deepFloorGuarantee: 8,       // 深度 ≥N：普通/精英敌人**必定**变体（深处再无"素体"）
  deepAffixBias: 0.03,         // 每深一层，多词缀概率 +3%（越深越畸形）
  maxAffixBias: 0.28,          // 偏向加成上限
  deepDoubleFloor: 6,          // 深度 ≥N：至少 2 词缀（进入第 2 区起，杂兵也已"异化"）

  //   只在本局内去重就能显著提升新鲜感——一局最多 6~10 场战斗，去重后几乎场场不同。

const AFFIX_ORDER = Object.keys(AFFIX_DATA);

// 确定性伪随机：djb2 哈希 → mulberry32。同输入必同输出（可复现）。
function variantSeedOf(str) {
  let h = 5381;
  const s = String(str);
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 自适应宽度文本绘制：超宽自动缩字号，仍放不下则截断加省略号。
//   存在意义：3 层词缀的变体名可达 13+ 字（如「灼热·残破·虚影·虚空衍生物」），
//   未来 PHASE 2 的 AI 生成称号可能更长。统一在此兜底，避免名字撑破信息面板。
//   副作用说明：会修改当前 textSize，调用方需在之后重设自己的字号。
function drawTextFit(str, x, y, maxW, baseSize, minSize) {
  const s0 = (str === undefined || str === null) ? '' : String(str);
  minSize = minSize || Math.max(8, baseSize - 5);
  let size = baseSize;
  textSize(size);
  // 先缩字号
  while (size > minSize && textWidth(s0) > maxW) { size -= 0.5; textSize(size); }
  let s = s0;
  // 缩到最小仍超宽 → 截断 + 省略号（保留至少 1 个字符）
  if (textWidth(s) > maxW) {
    while (s.length > 1 && textWidth(s + '…') > maxW) s = s.slice(0, -1);
    s = s + '…';
  }
  text(s, x, y);
}
// 模板式命名（PHASE 0 无 AI 时的名字；PHASE 2 会用 AI 生成的称号替换 _variant.title）
//   例：「灼热·缚咒憎恶」「灼热·残破·缚咒憎恶」
function variantDisplayName(baseName, affixIds) {
  if (!affixIds || !affixIds.length) return baseName;
  const tags = affixIds.map(id => (AFFIX_DATA[id] && AFFIX_DATA[id].name) || '').filter(Boolean);
  return tags.join('·') + '·' + baseName;
}
// 抽取词缀：按 tier 加权（tier 越高越罕见）
function pickAffixes(rng, count) {
  const picked = [];
  const pool = AFFIX_ORDER.slice();
  for (let i = 0; i < count && pool.length; i++) {
    let total = 0;
    pool.forEach(id => { total += 1 / AFFIX_DATA[id].tier; });   // tier1 权重 1，tier2 权重 0.5
    let r = rng() * total;
    let chosen = pool[0];
    for (const id of pool) { r -= 1 / AFFIX_DATA[id].tier; if (r <= 0) { chosen = id; break; } }
    picked.push(chosen);
    pool.splice(pool.indexOf(chosen), 1);

}
// 「深度」= 真正的推进距离：区域 × 每层区数 + 当前层。
//   ⚠️ 不能用 gs.floorNumber —— 它只在**跨区域**时 +1（见 MapScene 通关分支），
//   一局里取值仅 0 / 1，任何"随深度递增"的曲线都会退化成常数。
//   gs.currentLayer 才是每区 0..5 的层号，随玩家每前进一步而推进。
//   深度取值范围：第1区 0~5，第2区 6~11。
function abyssDepth() {
  const region = Math.max(0, gs.currentRegion || 0);
  const layer  = Math.max(0, gs.currentLayer || 0);
  // MAP_LAYER_CONFIG 是 const，声明在本函数之后；typeof 对 TDZ 中的 const 同样会抛
  // ReferenceError，因此用 try 兜底（正常游玩时序下不会命中，纯防御）
  const cfg = safeRef(() => MAP_LAYER_CONFIG, null);
  const per = (cfg && cfg.length) ? cfg.length : 6;
  return region * per + layer;
}

// 决定是否变体 + 抽哪几个词缀（纯确定性）
function planVariant(tpl, node) {
  if (!VARIANT_SYS.enabled || !tpl) return null;
  const isBoss = !!(tpl.isBoss || tpl.isVoidSovereign);
  // Boss 永不变体：多阶段演出是手工设计的（阶段阈值/意图重排），随机词缀会破坏节奏与平衡。
  //   ⚠️ 必须在此**提前返回**——若只把 bossChance 设 0，下面的"深度加成"仍会加出一个
  //   正数概率（0 + 0.25 = 25%），深层 Boss 就会被污染。
  if (isBoss) return null;
  const isElite = !!tpl.isElite;
  const ri = Math.max(0, Math.min(gs.currentRegion || 0, 1));
  let chance = isElite ? VARIANT_SYS.eliteChance[ri] : VARIANT_SYS.normalChance[ri];
  const depth = abyssDepth();
  chance += Math.min(VARIANT_SYS.maxFloorBonus, depth * VARIANT_SYS.floorBonus);
  // 深处再无「素体」：到达保证深度后普通/精英敌人必定变体，制造"越往下越不像原世界"的压迫感
  if (depth >= VARIANT_SYS.deepFloorGuarantee) chance = 1;
  // 种子含**世界种子**（PHASE 1）：同一个节点在不同玩家的深渊里会孵出不同变体 ——
  //   这是"无限"的第二重含义：不仅组合无限，你和朋友打的也不是同一个世界。
  const wseed = (typeof CODEX_SYS !== 'undefined' && CODEX_SYS) ? (CODEX_SYS._seed || 0) : 0;
  const seed = variantSeedOf(`${node && node.id}-${tpl.id}-${ri}-${depth}-${wseed}`);
  const rng = mulberry32(seed);
  if (rng() >= chance) return null;
  // 词缀数量阶梯分布，且**随深度偏向多词缀**（越深越畸形）。
  //   ⚠️ 不能写成「1 或 maxAffixes」——那样 maxAffixes=3 时永远抽不到 2 层，阶梯出现断层。
  const bias = Math.min(VARIANT_SYS.maxAffixBias, depth * VARIANT_SYS.deepAffixBias);
  // 深度下限：越深，最少词缀数越高 —— 玩家能**直接数出来**畸形程度在涨（1 → 2 → 3）
  let minCount = 1;
  if (depth >= VARIANT_SYS.deepTripleFloor) minCount = 3;
  else if (depth >= VARIANT_SYS.deepDoubleFloor) minCount = 2;
  // 双层去重打分（rng 序列固定 → 给定图鉴快照时仍完全确定）：
  //   本局新 = +2，图鉴新（跨局首见）= +1。抽满 3 分直接采用，否则保留最高分。
  //   这样跨局玩得越久，越容易撞见**图鉴里没有**的组合 ——「常新」是无限感的核心。
  if (!VARIANT_SYS._seenThisRun) VARIANT_SYS._seenThisRun = new Set();
  let picked = null, pickedScore = -1;
  for (let attempt = 0; attempt < VARIANT_SYS.avoidRepeatTries; attempt++) {
    const tier = rng();
    let count = tier < (0.58 - bias) ? 1 : (tier < (0.86 - bias * 0.4) ? 2 : 3);
    if (count < minCount) count = minCount;
    const cand = pickAffixes(rng, Math.min(count, VARIANT_SYS.maxAffixes));
    if (!cand.length) break;
    const key = cand.slice().sort().join('+');
    let sc = 0;
    if (!VARIANT_SYS._seenThisRun.has(key)) sc += 2;
    if (!codexHas(tpl.id, key)) sc += 1;
    if (sc > pickedScore) { pickedScore = sc; picked = cand; }
    if (sc >= 3) break;                                  // 本局新 + 图鉴新：最优，立即采用
  }
  if (!picked || !picked.length) { VARIANT_SYS._lastWasNew = false; return null; }
  const skey = picked.slice().sort().join('+');
  // 记录"是否本局初见"：供战斗开场飘字使用——只在真正没见过的组合上提示，
  //   否则每场都飘反而变成噪音（变体率已提到 55%+）。
  VARIANT_SYS._lastWasNew = !VARIANT_SYS._seenThisRun.has(skey);
  VARIANT_SYS._seenThisRun.add(skey);
  return picked;
}
// 把词缀应用到「已做完难度缩放」的敌人副本上（在 applyDifficultyToEnemy 之后调用）
function applyVariantToEnemy(enemy, affixIds) {
  if (!enemy || !affixIds || !affixIds.length) return enemy;
  // 过滤无效词缀 id：PHASE 1 图鉴可能残留已下线的旧词缀名，此处必须容错而非崩溃
  const ids = affixIds.filter(id => AFFIX_DATA[id]);
  if (!ids.length) return enemy;
  const out = { ...enemy };
  let hpMul = 1, dmgMul = 1, blockMul = 1, apDelta = 0, scDelta = 0, spDmgMul = 1;
  let intentMode = null;
  const opening = [];
  ids.forEach(id => {
    const a = AFFIX_DATA[id];
    if (!a) return;
    if (a.hpMul) hpMul *= a.hpMul;
    if (a.dmgMul) dmgMul *= a.dmgMul;
    if (a.blockMul) blockMul *= a.blockMul;
    if (a.apDelta) apDelta += a.apDelta;
    if (a.scDelta) scDelta += a.scDelta;
    if (a.specialDmgMul) spDmgMul *= a.specialDmgMul;
    if (a.intent) intentMode = a.intent;          // 同类型以最后一个为准
    if (a.opening) opening.push(a.opening);

  // —— 安全夹逼：多层叠加也不许出现极端值 ——
  hpMul = clamp(hpMul, VARIANT_SYS.clampHp[0], VARIANT_SYS.clampHp[1]);
  dmgMul = clamp(dmgMul, VARIANT_SYS.clampDmg[0], VARIANT_SYS.clampDmg[1]);
  blockMul = clamp(blockMul, VARIANT_SYS.clampBlock[0], VARIANT_SYS.clampBlock[1]);
  // —— 数值应用 ——
  const baseMaxHp = (typeof out.maxHp === 'number') ? out.maxHp : (out.hp || 1);
  out.maxHp = Math.max(1, Math.round(baseMaxHp * hpMul));
  out.hp = out.maxHp;
  if (typeof out.attackDmg === 'number') out.attackDmg = Math.max(1, Math.round(out.attackDmg * dmgMul));
  if (typeof out.blockAmt === 'number') out.blockAmt = Math.max(0, Math.round(out.blockAmt * blockMul));
  if (typeof out.ap === 'number') out.ap = Math.max(1, out.ap + apDelta);
  if (typeof out.specialChance === 'number') out.specialChance = clamp(out.specialChance + scDelta, 0, 0.95);

    else if (intentMode === 'firstDefend') {
      const p = out.intentPattern.slice();
      if (p.length && p[0] !== 'defend') p.unshift('defend');
      out.intentPattern = p;
    }
  }
  // —— 元信息：供 UI 展示、PHASE 1 图鉴沉淀、PHASE 2 AI 命名替换 title ——
  out._variant = {
    affixes: ids.slice(),
    tags: ids.map(id => AFFIX_DATA[id].name),
    baseName: enemy.name,
    baseId: enemy.id,
    // PHASE 0 无 AI：title 用模板名；PHASE 2 命中图鉴后会被 AI 生成的称号覆盖
    title: variantDisplayName(enemy.name, affixIds),
    desc: ids.map(id => AFFIX_DATA[id].desc).join('；'),
    opening,
  };
  // PHASE 2：先看图鉴里有没有已经问过 AI 的"真名"。命中就直接用 —— 零调用、零费用。
  //   这正是"越玩越便宜"的来源：第二次遇到同一组合起，它永远免费。
  const _known = namerLookup(enemy.id, ids.slice().sort().join('+'));
  if (_known && _known.title) {
    out._variant.title = _known.title;
    out._variant.whisper = _known.whisper || '';
    out._variant.aiNamed = true;
    if (_known.whisper) {
      out.desc = '【' + out._variant.tags.join('·') + '】' + out._variant.desc + '「' + _known.whisper + '」';
    }
  }
  // UI 直接读 name，改这里即可让全屏显示变体名，无需改任何绘制代码
  out.name = out._variant.title;
  // 描述改为「词缀说明」优先 —— 玩家在信息面板第一眼看到的就是"这家伙特殊在哪"。
  //   原型描述保留在 _variant.baseDesc，面板有 2 行+省略号兜底，不会溢出。
  out._variant.baseDesc = enemy.desc || '';
  out.desc = '【' + out._variant.tags.join('·') + '】' + out._variant.desc;
  return out;
}
// 战斗开始时的即时效果注入（在 combatState 建好之后调用）
function applyVariantOpening(cs, enemy) {
  const v = enemy && enemy._variant;
  if (!v || !v.opening || !v.opening.length || !cs) return;
  v.opening.forEach(o => {
    try {
      if (o.target === 'player') {
        if (o.type === 'strength') return;            // 玩家侧不使用力量语义
        cs.playerStatuses = cs.playerStatuses || {};
        cs.playerStatuses[o.type] = (cs.playerStatuses[o.type] || 0) + o.amt;
      } else if (o.target === 'enemy') {
        if (o.type === 'strength') {
          cs._enemyStrength = (cs._enemyStrength || 0) + o.amt;
        } else {
          cs.enemyStatuses = cs.enemyStatuses || {};
          cs.enemyStatuses[o.type] = (cs.enemyStatuses[o.type] || 0) + o.amt;
        }
      }
    } catch (e) { /* 状态注入失败绝不影响战斗 */ }
  });

// ==================== PHASE 1 · 深渊图鉴（跨局持久化） ====================
// 定位：PHASE 0 给了「无限的组合」，PHASE 1 给「记住见过什么」——
//   ① 跨局去重：优先给玩家**图鉴里没有**的组合，玩得越久越常新
//   ② 进度可视化：图鉴收录数（PHASE 1 面板）让"无限"变成可数的进度
//   ③ 为 PHASE 2 的 AI 命名提供缓存目标（同一组合只命名一次，永久复用）
//
// CDR 对齐 storage.md（v2.2.0）：
//   S1 单值容量：300 条 × ~90B ≈ 27KB ≪ 256KB ✅
//   S2 key 上界：仅 2 个**固定** key（world:codex:enemies / world:seed），无动态 key ✅
//   S3 写入频率：仅在「发现新组合」时置脏，随 1500ms 防抖落盘，低频 ✅
//   S4 scope    ：全部 user scope（缺省），key 数不限 ✅
//   S6 错误韧性：写入失败静默降级——图鉴丢了只是重新发现，绝不阻断可玩 ✅
//
// ⚠️ 无限的内容不能配无限的存储：图鉴必须 FIFO 封顶，否则迟早撞
//    STORAGE_VALUE_TOO_LARGE。FIFO 淘汰最旧的（= 玩家最久没打到的）。
const CODEX_SYS = {
  enabled: true,
  keyCodex: 'world:codex:enemies',
  keySeed:  'world:seed',
  v: 1,                 // 图鉴 schema 版本（结构变更时 bump，读取时做版本校验）
  cap: 300,             // FIFO 上限（S1）
  flushMs: 1500,        // 与存档同频防抖（S3）
  // —— 内存态 ——
  _items: [],           // [{ k, b, n, d }] k=词缀组合 b=基底id n=显示名 d=首见深度（插入序=FIFO 序）
  _index: null,         // 'b|k' -> item，O(1) 查重
  _total: 0,            // 累计发现总数（FIFO 只削 _items，不削 _total——进度只增不减）
  _seed: 0,             // 世界种子：让**每个玩家**的变体分配不同（多一层"无限"）
  _dirty: false,
  _timer: null,
  _newThisRun: 0,       // 本局新发现数（gs.reset 时清零）
};

function codexKey(baseId, affixKey) { return baseId + '|' + affixKey; }
// 同步读写 localStorage（与 SaveManager 同前缀），保证首场战斗之前图鉴就可用
function codexSyncRead(key) {

  catch (e) { return null; }

function codexSyncWrite(key, value) {

function codexApply(data) {

    CODEX_SYS._items = data.items.slice(-CODEX_SYS.cap);      // 只保留最新 cap 条
    CODEX_SYS._total = Math.max(data.total || 0, CODEX_SYS._items.length);
    CODEX_SYS._index = new Map();
    for (const it of CODEX_SYS._items) {

function codexSerialize() {

}
// 图鉴里有没有这个「基底 × 词缀组合」
function codexHas(baseId, affixKey) {
  if (!CODEX_SYS.enabled || !baseId || !affixKey || !CODEX_SYS._index) return false;
  return CODEX_SYS._index.has(codexKey(baseId, affixKey));
}
// 记录一次遭遇；返回 true = 这是**跨局首次**发现（用于飘字与提示）
function codexRecord(baseId, affixKey, name, depth) {
  if (!CODEX_SYS.enabled || !baseId || !affixKey) return false;
  if (!CODEX_SYS._index) CODEX_SYS._index = new Map();
  const ck = codexKey(baseId, affixKey);
  if (CODEX_SYS._index.has(ck)) return false;                 // 已收录，仅计数不落盘
  const item = { k: affixKey, b: baseId, n: name || '', d: depth || 0 };
  CODEX_SYS._index.set(ck, item);
  CODEX_SYS._items.push(item);
  CODEX_SYS._total++;
  CODEX_SYS._newThisRun++;
  // FIFO 淘汰：超上限丢最旧的（同时从索引移除 → 允许将来"重新发现"）
  while (CODEX_SYS._items.length > CODEX_SYS.cap) {
    const old = CODEX_SYS._items.shift();
    if (old) CODEX_SYS._index.delete(codexKey(old.b, old.k));
  }

  codexScheduleFlush();

}
function codexScheduleFlush() {
  if (!CODEX_SYS.enabled || CODEX_SYS._timer) return;
  CODEX_SYS._timer = setTimeout(() => { CODEX_SYS._timer = null; codexFlush(); }, CODEX_SYS.flushMs);
}
// 统一落盘：本地**无条件先写**，云端镜像单独 try。

// ==================== PHASE 3 · 无尽回响（层数无限 + 确定性难度曲线） ====================
// 一句话设计：**主线照旧能通关，想走的人可以一直往下走。**
//   主线 2 个区域（深度 0~11）维持原平衡**完全不变**；通关结算页给出「继续深入」入口，
//   进入无尽回响后区域无限递增、深度持续增长，难度按**确定性**曲线上升 —— 全程纯数学，零 AI 费用。

//   3) 不爆炸：次线性增长（expo < 1）+ 硬封顶，避免深到几十层后数值溢出把体验搞崩。

const ECHO_SYS = {

  perRegion: 6,            // 每区层数（运行时以 MAP_LAYER_CONFIG.length 为准）
  hpCoef: 0.22,            // 每超出 1 个「回响区」，敌人 HP 的系数增量
  dmgCoef: 0.13,           // 每超出 1 个「回响区」，敌人攻击的增量
  expo: 0.78,              // 次线性指数：<1 让增量随深度递减，防止后期爆炸
  maxHpMul: 8,             // HP 倍率硬封顶
  maxDmgMul: 5,            // 攻击倍率硬封顶

// 每区层数：以地图配置为准。MAP_LAYER_CONFIG 用 const 声明在本模块之后，
//   模块求值期访问会落进 TDZ（ReferenceError），故 try 兜底；正常游玩时序下走不到兜底分支。

// 当前深度。刻意不复用 abyssDepth()：那个函数带 TDZ 兜底语义且依赖 gs 求值顺序，
//   这里单独实现一份，保证纯函数性质（便于测试里直接喂 region/layer）。
function echoDepthOf(region, layer) {

function echoDepthNow() {
  const region = (typeof gs !== 'undefined' && gs) ? Math.max(0, gs.currentRegion || 0) : 0;
  const layer  = (typeof gs !== 'undefined' && gs) ? Math.max(0, gs.currentLayer || 0) : 0;
  return echoDepthOf(region, layer);
}
// 难度倍率：主线内恒为 1；超出主线后按 (超出区数 ^ expo) 的次线性曲线上升。
//   units 取小数（而非取整），使同一区域内每层都平滑变强，而不是跨区时才跳一档。
function echoMulAt(depth) {

  const units = extra / per;                                    // 折合几个「回响区」
  const grow = Math.pow(units, ECHO_SYS.expo);                  // 次线性增长因子
  return {
    hp:   Math.min(ECHO_SYS.maxHpMul,  1 + ECHO_SYS.hpCoef  * grow),
    dmg:  Math.min(ECHO_SYS.maxDmgMul, 1 + ECHO_SYS.dmgCoef * grow),

function echoHasNextRegion() {

  return gs.currentRegion < (gs.regionCount || ECHO_SYS.mainlineRegions) - 1;

// 记录本局最深深度（玩家每前进一步调用）。只增不减，供结算/存档列表展示。

  const t = echoTierNow();
  return t > 0 ? `深度 ${d} · 回响 ${t}` : `深度 ${d}`;

// ==================== PHASE 4 · 世界记忆（跨局持久化 + 模板编织） ====================
// 一句话设计：**深渊记得你。**
//   每局的战果（击败过谁、陨落几次、走过多深、遇过哪些造物）跨局沉淀成一份「世界记忆」，
//   再用**确定性模板**把这些记忆编织回开局致辞、地图低语与造物重逢 —— 让世界显得有记性。
//
// 费用纪律（这是本模块最重要的设计约束）：
//   1) 记忆**编织**一律走本地模板 —— 零 AI 费用、零网络、离线可用。
//   2) AI 只做**可选**的一句「记忆回响」（memory_echo），每局至多 1 次；
//      场景未创建 / AI 关闭 / 调用失败 → 全部回落模板句，体验不降级、不报错。
//   3) 记忆本身**永不**由 AI 生成 —— 记忆是事实账本，必须是确定的、可审计的。
//
// 存储约束（依据 storage.md CDR S1–S6）：
//   - 单 key 存全部记忆（'world:memory'），**不产生动态 key** → key 数量恒定，上界可证明。
//   - 条目数封顶 cap=80，单值实测 < 6KB，远低于 256KB 单值上限。
//   - 写走 codexPersist：本地同步写优先（离线可用），云端镜像失败静默，不影响游玩。
const MEMORY_SYS = {
  enabled: true,
  key: 'world:memory',
  cap: 80,                 // 记忆条目上限（超出按最久未更新淘汰）
  maxEchoPerRun: 1,        // memory_echo 每局至多调用 1 次（1 币/局封顶）
  _mem: new Map(),         // key -> { n: 数值, t: 最近更新时间戳 }
  _dirty: false,
  _echoUsed: 0,            // 本局已发起的 memory_echo 次数
  _lastEcho: null,         // 本局最近一句记忆回响（AI 或模板）
  _lastEchoFromAi: false,  // 这句是否由 AI 织出（供样式统一层决定用中金还是暗金）
};

// 记录一条记忆。mode='sum' 累加（次数类），'max' 取最大值（深度/纪录类），'set' 覆写（画像指标）。
//   只有**未传 value** 时才按 +1 兜底（兼容 memoryRecord('seen:x') 的简写用法）；
//   显式传值则严格按数值累加 —— 传 0 就是加 0（PHASE 5：「牌组里 0 张防御牌」必须能记成 0，

function memoryRecord(key, value, mode) {

    else if (mode === 'max') n = Math.max(cur ? cur.n : 0, v);

      let oldestKey = null, oldestT = Infinity;
      MEMORY_SYS._mem.forEach((rec, k) => {

// 序列化：Map → 数组（JSON 不认 Map）。按 t 升序，保证输出稳定、便于比对体积。

  MEMORY_SYS._mem.forEach((rec, k) => arr.push({ k: k, n: rec.n, t: rec.t }));

async function memoryAsyncLoad() {
  try {
    if (typeof saveManager === 'undefined' || !saveManager || !saveManager._get) return;
    const remote = await saveManager._get(MEMORY_SYS.key);
    if (remote) memoryApply(remote);

// ---- 结构化摘要：供编织与（可选）AI 使用 ----
function memorySummary() {
  const m = MEMORY_SYS._mem;
  const deaths = memoryGet('run:death');
  const wins = memoryGet('run:win');
  const deepest = memoryGet('echo:depth');
  const runs = deaths + wins;
  // 击败过的 Boss：键形如 'boss:<id>'
  const bosses = [];
  m.forEach((rec, k) => { if (k.startsWith('boss:')) bosses.push({ id: k.slice(5), n: rec.n }); });
  bosses.sort((a, b) => b.n - a.n);
  // 见过的造物（变体组合）：键形如 'seen:<key>'
  let seenCount = 0;
  m.forEach((_rec, k) => { if (k.startsWith('seen:')) seenCount++; });
  return {
    runs: runs, deaths: deaths, wins: wins, deepest: deepest,
    topBoss: bosses[0] || null, bossKinds: bosses.length, seenCount: seenCount,
  };
}

// ---- 模板编织（零 AI 费用、确定性）----
//   规则：按"最值得说"的事实挑第一条命中的模板；选种子用世界种子 + 摘要数字，
//   保证同一份记忆在重进后得到同一句话（读档可信度）。
function memoryWeave(kind) {
  const s = memorySummary();
  const seedBase = ((typeof CODEX_SYS !== 'undefined' && CODEX_SYS) ? (CODEX_SYS._seed || 0) : 0);
  const pick = (arr) => arr[Math.abs((seedBase + s.runs * 31 + s.deaths * 7 + s.deepest)) % arr.length];

  if (kind === 'open') {
    // 开局致辞：新玩家不该看到任何"记得你"的话（没有记忆就没有低语）
    if (s.runs <= 0) return null;
    if (s.deaths >= 5 && s.deepest >= 12) return pick([
      `深渊记得你的 ${s.deaths} 次坠落，最深的一次停在 ${s.deepest}`,
      `你下来过 ${s.runs} 回。石头还记得你的重量`,
    ]);
    if (s.wins > 0) return pick([
      `你带走过秘密 ${s.wins} 次。这一次，它还认得你`,
      `曾有人从这里活着离开 —— 深渊没有忘记`,
    ]);
    if (s.deaths >= 2) return pick([
      `深渊记得你的 ${s.deaths} 次坠落`,
      // 主题「飘」：这里刻意**不写"你又飘回来了"** —— 开局浮句已经说了局数，
      //   同一屏出现两次"飘回"就成了复读。这一句该说的是"深渊怎么数着你"，不是"你来了几回"。
      `深渊替你数着 ${s.deaths} 次坠落，像数飘落的灰`,
    ]);
    return pick([`你的影子里还留着上一次的灰`, `深渊认得你的脚步声`]);
  }

  if (kind === 'boss') {
    if (!s.topBoss) return null;
    const name = (typeof ENEMY_DATA !== 'undefined' && ENEMY_DATA[s.topBoss.id]) ? ENEMY_DATA[s.topBoss.id].name : s.topBoss.id;
    return pick([
      `它记得你 —— 你曾 ${s.topBoss.n} 次站在它面前`,
      `${name} 认得你的气息`,
    ]);
  }

  if (kind === 'map') {
    if (s.seenCount >= 20) return pick([
      `你已见识过 ${s.seenCount} 种造物。它们也记住了你`,
      `图鉴之外，还有未被命名的东西在等你`,
    ]);
    if (s.deepest >= 12) return `你曾抵达深度 ${s.deepest}。再往下，没有人回来过`;
    return null;
  }
  return null;
}
// 造物重逢：这个组合此前是否见过（用于"它认得你"的表现，纯叙事、不改数值）
function memorySeenVariant(affixKey) {
  if (!affixKey) return 0;
  return memoryGet('seen:' + affixKey);
}

// 取当前应展示的一句记忆回响：AI 织过就用 AI 的，否则用本地模板（零费用、零调用）。
function memoryEchoLine() {
  if (MEMORY_SYS._lastEcho) return MEMORY_SYS._lastEcho;
  try { return memoryWeave('open'); } catch (e) { return null; }
}
// 可选 AI：用世界记忆织一句低语。**每局至多 1 次**（1 币/局封顶）。
//   所有"不该花钱"的情况都在开头直接返回，一次 sdk.ai 都不发：
//   模块关闭 / 本局额度用尽 / AI 呼吸灯关闭 / 没有任何记忆可说。
//   失败也只回落模板句 —— 记忆回响是锦上添花，绝不能让它报错或卡住界面。
async function memoryRequestEcho() {
  try {
    if (!MEMORY_SYS.enabled) return;
    if (MEMORY_SYS._echoUsed >= MEMORY_SYS.maxEchoPerRun) return;
    if (typeof aiSys === 'undefined' || !aiSys.enabled) return;
    if (typeof aiRequest !== 'function' || typeof aiMessages !== 'function') return;
    const s = memorySummary();
    if (s.runs <= 0) return;                     // 新玩家没有任何记忆，不必花钱织一句
    MEMORY_SYS._echoUsed++;
    const ctx = `陨落${s.deaths}次 通关${s.wins}次 最深深度${s.deepest} 见过${s.seenCount}种造物`;
    const local = () => { try { return memoryWeave('open') || ''; } catch (e) { return ''; } };
    const r = await aiRequest('memory', aiMessages(AI_SYS_PROMPT.memory, ctx), local);
    MEMORY_SYS._lastEcho = String((r && r.text) || local()).slice(0, 30);
    MEMORY_SYS._lastEchoFromAi = !!(r && r.fromAi);
  } catch (e) {
    try { MEMORY_SYS._lastEcho = memoryWeave('open'); } catch (e2) {}
    MEMORY_SYS._lastEchoFromAi = false;
  }
}

// 一局终了时统一结账：胜负次数 + 最深深度（取 max）+ 强制落盘。
//   ⚠️ 必须**强制** flush（force=true）：玩家很可能直接关页面，不能指望下一次自动保存。
function memoryEndRun(result) {
  try {
    if (result === 'victory') memoryRecord('run:win', 1);
    else memoryRecord('run:death', 1);
    const deepest = Math.max((typeof gs !== 'undefined' && gs) ? (gs.maxDepth || 0) : 0,
                             (typeof echoDepthNow === 'function') ? echoDepthNow() : 0);
    memoryRecord('echo:depth', deepest, 'max');
    // PHASE 5：画像结账 —— 牌组构成 + 陨落深度 + 连续未通关次数（驱动动态怜悯）。
    //   ⚠️ 必须在 memoryFlush(true) **之前**，否则这一局的画像数据不会落盘。
    try { if (typeof profileOnRunEnd === 'function') profileOnRunEnd(result); } catch (e) {}
    try { if (typeof mercyBump === 'function') mercyBump(result); } catch (e) {}
    memoryFlush(true);
    // 局末清零本局的 AI 额度与展示句：下一局重新拥有 1 次记忆回响的机会。
    MEMORY_SYS._echoUsed = 0;
    MEMORY_SYS._lastEcho = null;
    MEMORY_SYS._lastEchoFromAi = false;
  } catch (e) { /* 记账失败绝不影响结算界面 */ }
}

// 模块加载即同步初始化：与图鉴同策略 —— 首场战斗 / 首次开局致辞之前记忆必须就绪。
//   （云端对齐见 memoryAsyncLoad()，由 SDK 就绪后调用）
memoryInit();

// ==================== PHASE 5 · 玩家画像 + 动态怜悯 ====================
// 设计主张：**动态难度只做「托底」，不做「惩罚」**。
//   玩家变强时不暗中加难度 —— Roguelike 的正反馈应该是「我变强了」，
//   而不是「我变强了所以世界也跟着变强了」。难度上升的正当来源永远是
//   **玩家的主动选择**（更高的难度档、无尽回响），不该是系统背地里的调整。
//   所以本系统只在玩家**连续受挫**时给一点点喘息，且幅度极小、封顶、对玩家可见。
// 三条硬约束：
//   ① 纯本地确定性算法，**零 AI 费用** —— 一次 sdk.ai 都不调。
//   ② 幅度极小：敌人 HP 最多 −15%、伤害最多 −9%，低保真但绝不破坏平衡。
//   ③ **不做黑箱**：生效时标题页明写「深渊暂缓了它的呼吸 −N%」，玩家可以随时关掉。
// 存储：复用 PHASE 4 的 `world:memory` 账本，用 `stat:` 前缀区分（不新增 key，S2 更稳）。
const MERCY_SYS = {
  enabled: true,
  startStreak: 2,                 // 连续未通关 ≥ 2 次才开始（第 1 次陨落只是运气）
  perStep: 0.05,                  // 每多连败 1 次，减免 +5%
  maxMercy: 0.15,                 // 封顶 15%
  dmgRatio: 0.6,                  // 敌人伤害减免 = mercy × 0.6（比 HP 更保守：宁可打久，也不让伤害失真）
  skipBoss: true,                 // 精英 / 首领是里程碑，保持数值纯粹
  skipDifficulties: ['oblivion'], // 选了「湮灭」的人明确不要怜悯
};
const PROFILE_SYS = {
  enabled: true,
  lowHpRatio: 0.30,               // HP < 30% 视为残血
};

// —— 画像读写（`stat:` 前缀，与叙事用的 seen:/boss: 分开） ——
function profileAdd(key, value) { return memoryRecord('stat:' + key, value); }
function profileSet(key, value) { return memoryRecord('stat:' + key, value, 'set'); }
function profileGet(key) { return memoryGet('stat:' + key); }
// 画像摘要：与 memorySummary（叙事用）职责分开，互不干扰
function profileSummary() {
  const deaths = memoryGet('run:death');
  const dmg = profileGet('damageTaken');
  const turns = profileGet('turns');
  const depthSum = profileGet('deathDepth');
  return {
    streak: profileGet('lossStreak'),
    damageTaken: dmg,
    turns: turns,
    lowHpHits: profileGet('lowHpHits'),
    deckAtk: profileGet('deckAtk'),
    deckDef: profileGet('deckDef'),
    deckPow: profileGet('deckPow'),
    deaths: deaths,
    deathDepthSum: depthSum,
    avgDeathDepth: deaths > 0 ? (depthSum / deaths) : 0,
    dmgPerTurn: turns > 0 ? (dmg / turns) : 0,
  };
}

// 战斗内埋点：一次承伤。只改内存，落盘统一在局终（memoryEndRun），避免战斗中反复写存储。
function profileOnDamage(amt, hpAfter, maxHp) {
  if (!PROFILE_SYS.enabled) return;
  try {
    if (amt > 0) profileAdd('damageTaken', amt);
    if (maxHp > 0 && hpAfter > 0 && (hpAfter / maxHp) < PROFILE_SYS.lowHpRatio) profileAdd('lowHpHits', 1);
  } catch (e) { /* 画像失败绝不影响战斗 */ }
}
// 战斗结束埋点：本场回合数
function profileOnBattleEnd() {
  if (!PROFILE_SYS.enabled) return;
  try { if (typeof gs !== 'undefined' && gs && gs.turnNumber > 0) profileAdd('turns', gs.turnNumber); }
  catch (e) {}
}
// 局终埋点：牌组构成（攻/防/技）+ 陨落深度，用于画像洞察
function profileOnRunEnd(result) {
  if (!PROFILE_SYS.enabled) return;
  try {
    if (typeof gs !== 'undefined' && gs && Array.isArray(gs.deck)) {
      let a = 0, d = 0, p = 0;
      for (const c of gs.deck) {
        if (!c) continue;
        if (c.type === 'attack') a++;
        else if (c.type === 'defend' || c.type === 'defense') d++;
        else p++;
      }
      profileAdd('deckAtk', a); profileAdd('deckDef', d); profileAdd('deckPow', p);
    }
    if (result === 'death') {
      const dep = (typeof echoDepthNow === 'function') ? echoDepthNow() : 0;
      profileAdd('deathDepth', dep);
    }
  } catch (e) {}
}

// —— 动态怜悯 ——
// 连续未通关次数：胜利清零、陨落 +1。这是驱动怜悯的唯一输入。
function mercyStreak() {
  try { return profileGet('lossStreak'); } catch (e) { return 0; }
}
function mercyBump(result) {
  if (!MERCY_SYS.enabled || !PROFILE_SYS.enabled) return 0;
  try {
    const next = (result === 'victory') ? 0 : (mercyStreak() + 1);
    profileSet('lossStreak', next);
    return next;
  } catch (e) { return 0; }
}
// 当前怜悯值（0 ~ maxMercy）。任何异常 / 未登录 / 存储不可用 → 0，永远安全。
function mercyValue() {
  if (!MERCY_SYS.enabled || !PROFILE_SYS.enabled) return 0;
  try {
    const streak = mercyStreak();
    if (!(streak >= MERCY_SYS.startStreak)) return 0;
    return Math.min(MERCY_SYS.maxMercy, MERCY_SYS.perStep * (streak - MERCY_SYS.startStreak + 1));
  } catch (e) { return 0; }
}
// 敌人侧倍率。已含「当前难度档是否跳过」的判断，调用方只需再处理 Boss。
function mercyNow() {
  const m = mercyValue();
  if (m <= 0) return { hp: 1, dmg: 1, m: 0 };
  try {
    const d = (typeof getDifficulty === 'function') ? getDifficulty() : null;
    if (d && d.key && MERCY_SYS.skipDifficulties.indexOf(d.key) !== -1) return { hp: 1, dmg: 1, m: 0 };
  } catch (e) { /* 拿不到难度档 → 保守起见不减免 */ return { hp: 1, dmg: 1, m: 0 }; }
  return { hp: 1 - m, dmg: 1 - m * MERCY_SYS.dmgRatio, m: m };
}
// 给玩家看的百分比（整数），用于界面展示
function mercyPercent() { return Math.round(mercyValue() * 100); }

// —— 画像洞察：本地模板句，零费用 ——
//   与 PHASE 4 的「世界记忆」不同，这里说的是**玩家自己的游玩特征**（数据画像），
//   不是深渊的口吻。样本不足（<2 局）时不显示，避免拿一局的数据给人贴标签。
function profileWeave() {
  if (!PROFILE_SYS.enabled) return null;
  try {
    const s = memorySummary();
    if (!s || s.runs < 2) return null;
    const p = profileSummary();
    const dmgPerTurn = (p.turns > 0) ? (p.damageTaken / p.turns) : 0;
    // ① 苦战型：每回合平均承伤高
    if (dmgPerTurn >= 12) return `你打得凶，也挨得重 —— 平均每回合要吃 ${dmgPerTurn.toFixed(1)} 点`;
    // ② 稳健型：回合多但承伤低 → 在磨
    if (p.turns > 0 && dmgPerTurn > 0 && dmgPerTurn <= 5) return `你很能磨 —— 每个回合只让它得手 ${dmgPerTurn.toFixed(1)} 点`;
    // ③ 构筑倾向：牌组里几乎没有防御
    if (p.deckDef === 0 && p.deckAtk >= 8) return `你的牌组里一张防御也没有 —— 深渊知道你只信进攻`;
    // ④ 连败：直接告诉玩家深渊在让路
    const m = mercyPercent();
    if (m > 0) return `你已 ${mercyStreak()} 次没能走出去 —— 深渊暂缓了它的呼吸`;
    // ⑤ 默认：靠 PHASE 4 的记忆句兜底
    return null;
  } catch (e) { return null; }
}

// ==================== 主题层「飘」· 新局迎接遮罩 ====================
// 主题方向 2（漂泊与异乡）的落点：**归属感不需要一套大系统，只需要一个数字**。
//   「你又一次飘了回来 · 这是第 N 次」—— N 直接取自 PHASE 4 的跨局账本，零新增数据、零 AI 费用。
//   T235：新局开场（标题页 → 第一张地图，floorNumber===0、仅 _freshRun 首帧一次）的迎接
//   **统一走全屏遮罩转场**（复用 gs.regionTransition 状态机，不再使用顶部小字浮句）：
//     · 首局 runs=0 → intro:true，灰烬诗「边缘燃烧炼成…/你纵身飘入…」（drawAshCrossover 默认文案）；
//     · 回归 runs>0 → intro:[两句]，「你又一次飘了回来，/这是第 N 次坠向同一卷书页」。
//   层位/淡入淡出包络/转场交互屏蔽全部复用 MapScene.drawRegionTransition→drawAshCrossover，
//   状态随存档序列化（中途退出重进能看完，timer 到点成对清理，无残留）。
function driftOnRunStart() {
  try {
    const s = (typeof memorySummary === 'function') ? memorySummary() : null;
    const runs = (s && s.runs) || 0;
    gs.regionTransition = {
      active: true,
      timer: 240,                 // 与 Boss 跨区遮罩同规格：4s（前40帧淡入/末60帧淡出）
      region: gs.currentRegion || 0,
      intro: runs > 0
        ? ['你又一次飘了回来，', `这是第 ${runs + 1} 次坠向同一卷书页`]
        : true,                   // true → drawAshCrossover 使用默认灰烬诗
    };
  } catch (e) { /* 迎接遮罩失败无所谓 */ }
}
// 结算页的两句「飘」。与开局浮句构成闭环：**飘进来 → 飘回去**。
//   刻意只做「意象句」，不重复 AI 墓志铭的活 —— 墓志铭讲这一局，这两句讲这个游戏。
const DRIFT_LINE = {
  defeat: '你像一页手稿，被烧成灰烬，飘回了深渊之上',
  victory: '你从深渊带回了一页字 · 灰烬落定，暂告一段',
  again: '———点击任意位置 · 再飘一次———',
};
function driftLine(kind) {
  try { return DRIFT_LINE[kind] || ''; } catch (e) { return ''; }
}

// ==================== 主题层「飘」· 灰烬粒子（Day 2） ====================
// 主题方向 1（失重与被动）的落点：灰烬**不决定去哪，只被气流推着走** —— 这是"被动"的物理解法。
//   运动学三条，刻意写得"没有任何自主性"：
//     ① 浮力恒定：vy 由场景给定方向，近乎匀速 —— 它被气流**持续**推着，从不加速也不回头
//     ② 横向只有摆动、没有位移：x 由 sin(phase) 驱动，粒子自己不往任何地方去
//     ③ 消散由生命耗尽决定，不由出界决定 —— 灰烬是**散掉**，不是飞走
//   全系统唯一一处用物理讲主题的地方：**同一套粒子，只差一个 dir**
//     陨落 → 灰烬**向上**飘（你像一页手稿被烧成灰烬，飘回了深渊之上）
//     胜利 → 灰烬**向下**落（「灰烬落定，暂告一段」）
//     一场雪，一个往上，一个往下 —— 玩家不需要读文案就能感到这两个结局是相反的。
//   克制：环境密度刻意**低于背景雾层**，且只在有叙事节拍的场景加码；不做满屏氛围填充。
const ASH_SYS = {
  enabled: true,
  cap: 150,                  // 粒子上限：对象池预分配，运行时零 new（不掉帧、不 GC 抖动）
  pool: [],
  _acc: 0,                   // 生成累加器（同时支持 rate < 1 与 > 1）
  _init: false,
};
// 每场景的环境灰烬参数：rate = 每帧期望生成数；dir: -1 上浮 / +1 下落；glow = 余烬发光占比。
//   稳态粒子数 = rate × 平均寿命，全部压在 cap 的 80% 以内（defeat ≈118 / title ≈104 / battle ≈56）。
//   life 走 5~9 秒：配合近匀速的浮力（见 drag），每片灰烬都有**穿越大半个画面**的一生。
const ASH_SCENE = {
  title:   { rate: 0.28, dir: -1, spd: [0.55, 1.10], glow: 0.16, life: [280, 460] },
  map:     { rate: 0.20, dir: -1, spd: [0.45, 0.90], glow: 0.10, life: [280, 460] },
  battle:  { rate: 0.15, dir: -1, spd: [0.40, 0.85], glow: 0.10, life: [280, 460] },
  defeat:  { rate: 0.42, dir: -1, spd: [0.80, 1.60], glow: 0.28, life: [200, 360] },
  victory: { rate: 0.24, dir:  1, spd: [0.50, 1.00], glow: 0.20, life: [260, 440] },
};
// 功能页（商店/事件/篝火…）：保持一层极淡的底噪，让"深渊里飘着灰"这件事始终成立，
//   但不加码 —— 玩家在这些页面要做决策，氛围必须让位给可读性。
const ASH_DEFAULT = { rate: 0.10, dir: -1, spd: [0.40, 0.80], glow: 0.08, life: [280, 460] };

function ashSceneCfg() {
  const s = (typeof gs !== 'undefined' && gs) ? gs.scene : 'title';
  return ASH_SCENE[s] || ASH_DEFAULT;
}
function ashInit() {
  if (ASH_SYS._init) return;
  for (let i = 0; i < ASH_SYS.cap; i++) {
    ASH_SYS.pool.push({ alive: false, x: 0, y: 0, vx: 0, vy: 0, size: 1,
      life: 0, maxLife: 1, phase: 0, sway: 0, swaySpd: 0.03, drag: 0.985,
      glow: false, alpha: 60 });
  }
  ASH_SYS._init = true;
}
// 取一个空闲槽位；池满时**丢弃本次**而非挤掉旧粒子 —— 让已在飘的灰烬走完自己的生命。
function _ashTake() {
  const pool = ASH_SYS.pool;
  for (let i = 0; i < pool.length; i++) if (!pool[i].alive) return pool[i];
  return null;
}
function ashSpawn(x, y, o) {
  if (!ASH_SYS.enabled) return;
  ashInit();
  const p = _ashTake();
  if (!p) return;
  const r = Math.random;    // 纯视觉：不参与任何数值/存档/确定性，用 Math.random 无妨
  p.alive = true; p.x = x; p.y = y;
  p.vx = (o.vx !== undefined) ? o.vx : (r() - 0.5) * 0.5;
  p.vy = o.vy || 0;
  p.size = (o.size !== undefined) ? o.size : (1 + r() * 1.6);
  p.maxLife = o.life; p.life = o.life;
  p.phase = r() * Math.PI * 2;
  p.sway = 0.15 + r() * 0.45;          // 摆幅：够看出"被气流推"，不至于像蛇行
  p.swaySpd = 0.02 + r() * 0.03;
  // 浮力近乎恒定（0.9990~0.9998 的极轻衰减）：
  //   曾经 0.985 —— 1.7 秒后只剩 20% 速度，粒子一辈子只在出生地附近挪 60~150px，
  //   整个画面只有底部有灰。真实灰烬被稳定气流**持续**推着走：它的被动体现在
  //   "从不加速、从不转向、从不回头"，而不是"越飘越慢"。
  p.drag = 0.9990 + r() * 0.0008;
  p.glow = !!o.glow;
  p.alpha = (o.alpha !== undefined) ? o.alpha : (34 + r() * 46);
}
// 环境灰烬：**全画面分布**（±15% 边缘带），不是只从底边进场。
//   曾经从画面外生成 + 长寿命，结果粒子一辈子只在底部 15% 活动，中上部永远空着 ——
//   "深渊里飘着灰"必须处处成立，凭空淡入由 draw 的淡入段兜底，肉眼无感。
function ashAmbient() {
  const c = ashSceneCfg();
  const life = c.life[0] + Math.random() * (c.life[1] - c.life[0]);
  const y = (c.dir < 0)
    ? GAME_H * (0.25 + Math.random() * 0.85)      // 上浮：偏下半场加密（源头在下）
    : GAME_H * (Math.random() * 0.75) - 0.15 * GAME_H;  // 下落：偏上半场加密（源头在上）
  ashSpawn(Math.random() * GAME_W, y, {
    vy: c.dir * (c.spd[0] + Math.random() * (c.spd[1] - c.spd[0])),
    life: life,
    glow: Math.random() < c.glow,
  });
}
// 节拍爆散：敌人被击杀 / 玩家受击时，从那个位置喷出一小团灰烬。
//   dir 默认跟随当前场景，但**受击与死亡恒为上飘** —— 那是"字句重新飘散"，与场景结局无关。
function ashBurst(x, y, n, dirOverride) {
  if (!ASH_SYS.enabled) return;
  ashInit();
  const c = ashSceneCfg();
  const dir = dirOverride || c.dir;
  for (let i = 0; i < n; i++) {
    ashSpawn(x + (Math.random() - 0.5) * 26, y + (Math.random() - 0.5) * 26, {
      vy: dir * (0.35 + Math.random() * 0.85),
      vx: (Math.random() - 0.5) * 1.0,
      size: 1.2 + Math.random() * 2.2,
      life: 70 + Math.random() * 90,
      glow: Math.random() < 0.30,
      alpha: 60 + Math.random() * 60,
    });
  }
}
function ashUpdate() {
  if (!ASH_SYS.enabled) return;
  ashInit();
  const c = ashSceneCfg();
  ASH_SYS._acc += c.rate;
  while (ASH_SYS._acc >= 1) { ASH_SYS._acc -= 1; ashAmbient(); }
  const pool = ASH_SYS.pool;
  for (let i = 0; i < pool.length; i++) {
    const p = pool[i];
    if (!p.alive) continue;
    p.life--;
    if (p.life <= 0) { p.alive = false; continue; }
    p.phase += p.swaySpd;
    p.x += p.vx + Math.sin(p.phase) * p.sway;   // 横向：只有摆动，没有意图
    p.y += p.vy;
    p.vy *= p.drag;                             // 浮力衰减：越飘越慢 = 越被动
    p.vx *= 0.995;
  }
}
function ashAlive() {
  let n = 0;
  for (let i = 0; i < ASH_SYS.pool.length; i++) if (ASH_SYS.pool[i].alive) n++;
  return n;
}
function ashDraw() {
  if (!ASH_SYS.enabled) return;
  push();
  noStroke();
  const pool = ASH_SYS.pool;
  for (let i = 0; i < pool.length; i++) {
    const p = pool[i];
    if (!p.alive) continue;
    const t = p.life / p.maxLife;              // 1 → 0
    let a = p.alpha;
    if (t > 0.75) a *= (1 - t) / 0.25;         // 淡入
    else if (t < 0.25) a *= t / 0.25;          // 淡出（消散，不是消失）
    if (a <= 0.5) continue;
    if (p.glow) {
      fill(255, 170, 90, a * 0.22);            // 余烬外晕
      ellipse(p.x, p.y, p.size * 4, p.size * 4);
      fill(255, 214, 148, a);                  // 余烬内芯
      ellipse(p.x, p.y, p.size, p.size);
    } else {
      fill(196, 190, 178, a);                  // 冷灰
      ellipse(p.x, p.y, p.size, p.size);
    }
  }
  pop();
}

// ==================== AI 能力系统（星匣 sdk.ai · 按需收费） ====================
// 核心契约（依据 ai.md「计费规则」「错误处理」「发布前设计自检 A1–A10」）：
//   1) 开关即闸门：AI 关闭（呼吸灯红）时，游戏一次都不调用 sdk.ai —— 零调用 = 零费用，全部走本地预制内容。
//   2) 按需收费：只有真正发起 sdk.ai.chat 才可能产生费用。计费由平台侧完成，游戏只读取
//      result.billing 做展示，绝不在本地记账、伪造额度或缓存"余额"。
//   3) 失败永不卡死：所有调用包 try/catch，任何错误（未授权 / 场景不存在 / 余额不足 / 超时 /
//      内容拦截 / 网络异常）一律降级到本地预制内容，主流程继续运行。
//   4) 合规：调用前 getSceneStatus 预检（预检失败按"状态未知"兜底，不阻塞调用、不误导玩家）；
//      超时 / 放弃 / 初始网络异常先 getResult 幂等取回，确认失败态后才允许重发；
//      AI_INPUT_BLOCKED / AI_OUTPUT_BLOCKED 只提示、不重试（重试必然再被拦）；
//      PERMISSION_DENIED 降级并关闭开关（拒绝不记忆，自动重试会反复弹授权窗骚扰玩家）；
//      messages 每次独立构造、不累积历史（对话窗口受控，避免 AI_QUOTA_EXCEEDED）；
//      自限频：两次调用有最小间隔，禁止在渲染循环内调 AI。
//   5) sceneCode 需在星匣平台创建（star-letter scene create）后填入 AI_SCENES。未创建时
//      调用返回 AI_SCENE_NOT_FOUND，此处自动降级为本地内容，不影响游玩。
const AI_SCENES = {
  oracle:  { code: 'abyss_oracle',  name: '深渊低语', desc: '开战时的凶兆与耳语' },
  tactics: { code: 'enemy_tactics', name: '深渊战术', desc: '精英与首领针对你制定的战术' },
  advisor: { code: 'deck_advisor',  name: '构筑导师', desc: '卡牌与遗物的取舍建议' },
  eulogy:  { code: 'run_eulogy',    name: '墓志铭',   desc: '一局终了时的判词' },
  // PHASE 2：变体批量命名。因图鉴永久缓存，命中已命名的组合时**不再调用**，费用随游玩递减。
  namer:   { code: 'variant_namer', name: '万象命名', desc: '为新发现的深渊造物赐名' },
  // PHASE 4：世界记忆回响。**每局至多 1 次**（1 币/局封顶）；未建场景/AI 关闭/失败 →
  //   全部回落本地模板句（memoryWeave），体验不降级。记忆本身永不交给 AI 生成。
  memory:  { code: 'memory_echo',   name: '记忆回响', desc: '用世界记忆织成的一句低语' },
};
// 默认**开启**：本版本用于 AI 游戏大赛，AI 功能是核心展示项，进游戏即应可见可感。
//   费用已由三道闸门压住（详见下方）：AI 只在精英/Boss 战、局终、玩家点击时调用，
//   新玩家首局尚无世界记忆（memory_echo 不触发），实测约 14~15 次/局。
//   玩家仍可随时点右下角呼吸灯关灯 —— 关闭 = 一次都不调 sdk.ai = 零费用，全部走本地预制内容；
//   该偏好随存档持久化且**跨局保留**（玩家关过一次就不会被自动重开，这是对钱包的尊重）。
//   ⚠️ 若要改回"默认关闭"（如正式发行版），把下面这行改回 false 即可，其余逻辑无需改动。
const DEFAULT_AI_ENABLED = true;

// ==================== sdk.log 打点封装（SDK >= 2.2.0） ====================
// 依据 log.md：本地 facade，不经 RPC、无需授权、同步不抛错；日志进本地环形缓冲（200 条），
// 玩家在平台提交反馈时整段会话日志自动随反馈上传 —— 排查问题不用猜。
// 约束（CDR L1–L3）：
//   L1 只在关键业务节点打点，绝不进渲染循环/高频事件（限流 突发 30 条 + 持续 10 条/秒）；
//   L2 error 只给真实异常，正常流程用 info，可疑用 warn；
//   L3 detail 只放业务标识与计数类字段；message 不拼玩家输入原文（message 不脱敏）。
function logSdk(level, message, detail) {
  try {
    // __starSdk 是本文件后面的 let 声明，try/catch 兼作 TDZ 保护
    const sdk = (typeof __starSdk !== 'undefined' && __starSdk) ? __starSdk : null;
    if (!sdk || !sdk.log || typeof sdk.log[level] !== 'function') return; // 旧 SDK / 本地直开 → 静默 no-op
    if (typeof detail === 'undefined') sdk.log[level](message);
    else sdk.log[level](message, detail);
  } catch (e) { /* 日志永不抛错，也绝不影响主流程 */ }
}

// AI 运行时状态（呼吸灯 / 旋尾 / 预检缓存 / 最近计费与提示）
const aiSys = {
  enabled: DEFAULT_AI_ENABLED,   // 玩家开关：true=绿灯（可调用） false=红灯（零调用）
  busy: 0,                       // 进行中的调用数，>0 时呼吸灯旋尾旋转
  spinner: 0,                    // 旋尾相位（弧度）
  breath: 0,                     // 呼吸相位（弧度）
  denied: false,                 // 玩家拒绝了 AI 能力授权
  sceneStatus: {},               // sceneCode -> 预检结果（带 ts，60s 内复用）
  lastBilling: null,             // 最近一次计费 { charged, freeRemaining }
  lastNotice: null,              // 最近一条提示文案
  lastNoticeTs: 0,
  callCount: 0,                  // 本局已发起的 AI 调用次数（仅用于 UI 展示）
  _lastCallTs: 0,
  MIN_CALL_GAP_MS: 1500,         // 自限频：两次调用最小间隔
  STATUS_TTL_MS: 60000,          // 预检结果缓存时长
  queue: [],                     // 待发请求队列（见 aiPump）—— 排队而非丢弃
  _pumping: false,               // 调度中标记（保证同一时刻只有一个 pump 在跑）
  _seq: 0,                       // 入队序号，同级优先级时按先到先得

  // AI 调用优先级（数值越大越先发）。依据**玩家感知强度**而非调用先后：
  //   oracle  深渊低语 —— 开场飘字，是玩家最直接读到"这是 AI 说的"的一句
  //   eulogy  墓志铭   —— 一局只有一次，且是局终仪式
  //   memory  记忆回响 —— 标题页致辞
  //   tactics 战术     —— 只改出招偏好，玩家几乎无感
  //   namer   命名     —— 批量、可延后，进图鉴慢慢看
  //   advisor 导师     —— 常驻建议，最不着急
  // ⚠️ 这张表存在的理由（P0）：Boss 战曾把 tactics 与 oracle 紧邻发起，
  //   旧的"超频即丢弃"限频让 tactics 抢走额度，oracle 每场都退回本地模板 ——
  //   最该被看见的一句反而永远发不出去，优先级正好是反的。
  prio: { oracle: 100, eulogy: 90, memory: 80, tactics: 50, namer: 30, advisor: 20 },
  // 呼吸灯中心与半径 —— **屏幕右下角**。
  //   ⚠️ y 不能贴底：战斗场景「结束回合」按钮锚在右下（x 1090~1265 / y 649~705），
  //   灯若落在 y≈676 会正好压在按钮上（误触 + 视觉打架）。故上移到按钮上方的右下角区域。
  lamp: { x: GAME_W - 44, y: GAME_H - 102, r: 13 },
};

// 本地预制内容库：AI 关闭 / 不可用 / 失败时使用（不产生任何调用与费用）
const AI_FALLBACK = {
  oracle: [
    '深渊翻过一页，纸页上洇出你的名字。',
    '有什么在纸背面呼吸，节奏与你不同。',
    '墨迹未干处，长出一只注视你的眼睛。',
    '你听见的不是回声——是它先你一步说出了这句话。',
    '手稿记下了你的到来，笔尖停在你的心跳上。',
    // 主题「飘」· 方向 1（失重与被动）：不写得太多 —— 本地句是**零费用路径**，
    //   评审若关掉 AI 跑，看到的就是这些。占比约 2/7，点到为止，多了就成了口号。
    '灰烬向上飘的时候，深渊正在翻页。',
    '没有根的东西，才会一直往下飘。',
  ],
  tactics: ['aggressive', 'defensive', 'control', 'aggressive', 'control'],
  advisor: [

    '你手里的牌，都是上一局留下的尸骸。',
    '取舍之间，就是你与它的差别。',
  ],
  eulogy: [
    '「此处埋着一个读过太多的人。」',
    '「他翻到了最后一页，纸页上什么也没写。」',
    '「深渊记得他，像记得所有没写完的句子。」',
    // 主题「飘」：墓志铭是通关与陨落共用的一句，所以写成**中性**——两种结局都读得通。
    '「他没能走出去，只是飘到了更深处。」',
    '「深渊收下了他，像风收下一页没写完的字。」',
  ],

// 本地兜底：按种子取一条（保证同一局内同类文案稳定，不每次跳变）
function aiPickLocal(kind, seed) {
  const arr = AI_FALLBACK[kind] || AI_FALLBACK.oracle;
  const s = (typeof seed === 'number' && isFinite(seed)) ? Math.abs(Math.floor(seed)) : 0;
  return arr[s % arr.length];
}

// 取 SDK 实例。__starSdk 是全局 let（不挂 window），且定义位置在本模块之后，
// 用 try/catch 兼作 TDZ 保护：脚本未执行到定义处时访问会抛 ReferenceError。
function aiGetSdk() {
  return safeRef(() => __starSdk, null);   // __starSdk 是后声明的 let，safeRef 兼作 TDZ 保护
}
// 提示：优先飘字，UI 不可用时只记状态，绝不因提示失败影响主流程
function aiNotify(msg) {
  aiSys.lastNotice = msg;
  aiSys.lastNoticeTs = Date.now();
  try {
    if (typeof floatingTexts !== 'undefined' && floatingTexts && typeof floatingTexts.add === 'function') {
      floatingTexts.add(GAME_W / 2, GAME_H * 0.20, msg, COLORS.textDim, 13);
    }
  } catch (e) { /* 提示失败无所谓 */ }
}
// 调用前预检：查场景可用性 / 单价 / 剩余免费次数 / 余额。
// 预检失败一律返回 null —— 按「状态未知」兜底，不阻塞调用，也不把默认值解释成"场景已关闭"。
async function aiPrecheck(sceneCode) {
  const cached = aiSys.sceneStatus[sceneCode];
  if (cached && (Date.now() - cached.ts) < aiSys.STATUS_TTL_MS) return cached;
  const sdk = aiGetSdk();
  if (!sdk || !sdk.ai) return null;
  try {
    const st = await sdk.ai.getSceneStatus({ sceneCode });
    const rec = {
      available: !!(st && st.available),
      pricePerCall: (st && st.pricePerCall) || 0,
      freeRemaining: (st && st.freeRemaining) || 0,
      balance: (st && st.balance) || 0,
      ts: Date.now(),
    };
    aiSys.sceneStatus[sceneCode] = rec;
    return rec;
  } catch (e) {
    return null;
  }
}
// 统一 AI 调用入口。
//   sceneKey  : AI_SCENES 的键
//   messages  : [{role,content}]，调用方负责构造（本模块只做长度保护）
//   fallback  : 本地兜底内容（字符串或返回字符串的函数）
// 返回 { text, fromAi, billing?, reason? } —— fromAi=false 表示未产生任何调用与费用。
async function aiRequest(sceneKey, messages, fallback, opts) {
  opts = opts || {};
  const scene = AI_SCENES[sceneKey];
  const fb = (typeof fallback === 'function') ? fallback() : fallback;
  // —— 零调用闸门：开关关闭 / 玩家拒绝授权 / 场景未配置，直接本地兜底 ——
  if (!scene) return { text: fb, fromAi: false, reason: 'no_scene' };
  if (!aiSys.enabled) return { text: fb, fromAi: false, reason: 'off' };
  if (aiSys.denied) return { text: fb, fromAi: false, reason: 'denied' };
  const sdk = aiGetSdk();
  if (!sdk || !sdk.ai) return { text: fb, fromAi: false, reason: 'no_sdk' };
  // 入队，等待调度。
  //   ⚠️ 这里**不再是**"超频就丢弃"。旧写法把限频判断与 _lastCallTs 写入放在
  //   第一个 await 之前的同步段，于是同一帧发起的两个请求里，第二个必被判为超频 ——
  //   Boss 战的 oracle 就是这样被 tactics 挤掉、每一场都退回本地模板的（P0）。
  //   现在改为排队：总速率不变（仍守 A6），但谁都不会被白白丢掉。
  //   opts.prio         覆盖默认优先级
  //   opts.stillNeeded  出队时的有效性谓词；返回 false 则直接丢弃（零费用）
  return new Promise(function (resolve) {
    aiSys.queue.push({
      sceneKey: sceneKey, scene: scene, messages: messages, fb: fb, opts: opts,
      prio: (typeof opts.prio === 'number') ? opts.prio : (aiSys.prio[sceneKey] || 10),
      seq: aiSys._seq++,
      resolve: resolve,
    });
    aiSys.busy++;    // 排队中同样算 busy：呼吸灯如实反映"有请求在途"，而不是只在网络往返时才转
    aiPump();
  });
}

// 队列调度：串行发车，相邻两次调用间隔 >= MIN_CALL_GAP_MS。
//   为什么不是"每个场景一份独立额度"：那会让全局 QPS 随场景数翻倍，
//   等于把 A6 的自限频拆了 —— 平台侧的限流看的是总速率，不是分场景速率。
//   串行 + 优先级既守住了总速率，又保证玩家最能感知的那句先发出去。
async function aiPump() {
  if (aiSys._pumping) return;      // 已有 pump 在跑，它会顺带消化后续入队的任务
  aiSys._pumping = true;
  try {
    // 先让出一个宏任务，再开始取任务。
    //   ⚠️ 少了这一行，优先级只对"排队中的人"生效：第一个入队的请求会被立刻取走，
    //   而 Boss 战正是 tactics 先入队 —— 于是低语依旧排在战术之后，只是从"被吞掉"
    //   变成"晚一点到"。让出一个 tick，同一帧紧邻发起的请求才能**一起参与排序**。
    //   顺带的好处：排队期间玩家关掉开关 / 离场，也都还来得及拦下（零费用）。
    await new Promise(r => setTimeout(r, 0));
    while (aiSys.queue.length) {
      // 取优先级最高的一个；同级按入队顺序（FIFO，避免后来的插队饿死先来的）
      let bi = 0;
      for (let i = 1; i < aiSys.queue.length; i++) {
        const a = aiSys.queue[i], b = aiSys.queue[bi];
        if (a.prio > b.prio || (a.prio === b.prio && a.seq < b.seq)) bi = i;
      }
      const job = aiSys.queue.splice(bi, 1)[0];
      const settle = function (out) {
        aiSys.busy = Math.max(0, aiSys.busy - 1);
        job.resolve(out);
      };
      // 出队时再判一次"还需不需要"：玩家可能已经离场、或已开了下一局。
      //   此时发出去只是白白扣费，而内容也没人看得到 —— 丢弃并落本地兜底。
      if (job.opts && typeof job.opts.stillNeeded === 'function') {
        let need = true;
        try { need = !!job.opts.stillNeeded(); } catch (e) { need = true; }
        if (!need) {
          logSdk('info', 'ai:stale-dropped', { scene: job.sceneKey });
          settle({ text: job.fb, fromAi: false, reason: 'stale' });
          continue;
        }
      }
      // 限频等待：排队期间可能早已超过间隔（wait <= 0 → 立即发）
      const wait = aiSys.MIN_CALL_GAP_MS - (Date.now() - aiSys._lastCallTs);
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      // 等待期间玩家可能关掉开关或拒绝授权 —— 再查一次，避免"关了还发出去"
      if (!aiSys.enabled || aiSys.denied) {
        settle({ text: job.fb, fromAi: false, reason: aiSys.denied ? 'denied' : 'off' });
        continue;
      }
      aiSys._lastCallTs = Date.now();
      aiSys.callCount++;
      let out;
      try {
        out = await aiCallOnce(job.sceneKey, job.scene, job.messages, job.fb);
      } catch (e) {
        console.warn('[AI] 调度异常，已降级本地内容：', e);
        out = { text: job.fb, fromAi: false, reason: 'error' };
      }
      settle(out);
    }
  } finally {
    aiSys._pumping = false;
  }
}

// 真正的一次 AI 调用（含预检、错误码降级、超时幂等取回）。只有 aiPump 会调它。
async function aiCallOnce(sceneKey, scene, messages, fb) {
  const sdk = aiGetSdk();
  if (!sdk || !sdk.ai) return { text: fb, fromAi: false, reason: 'no_sdk' };
  try {
    // 预检（失败不阻塞；仅用于 UI 与余额提示）
    try { await aiPrecheck(scene.code); } catch (e) { /* 忽略 */ }
    const res = await sdk.ai.chat({ sceneCode: scene.code, messages: messages });
    const content = (res && typeof res.content === 'string') ? res.content.trim() : '';
    if (content) {
      aiSys.lastBilling = res.billing || null;
      return { text: content, fromAi: true, billing: res.billing || null };
    }
    // 调用成功但正文为空（已扣费）：记 warn 便于判断是否提示词/档位问题
    logSdk('warn', 'ai:empty-reply', { scene: sceneKey });
    return { text: fb, fromAi: false, reason: 'empty' };
  } catch (e) {
    // —— 错误处理：全部按 ai.md 错误码表降级，绝不向上抛 ——
    const isSdkErr = !!(window.GameSDK && typeof window.GameSDK.isPlatformSDKError === 'function'
      && window.GameSDK.isPlatformSDKError(e));
    if (!isSdkErr) {
      logSdk('warn', 'ai:fallback', { scene: sceneKey, reason: 'non_sdk_error' });
      console.warn('[AI] 非 SDK 错误，已降级本地内容：', e);
      return { text: fb, fromAi: false, reason: 'error' };
    }
    const code = e.code;
    // AI 降级统一记一条 warn（带平台错误码）——玩家反馈"AI 没反应"时可据此区分
    // 余额不足 / 限流 / 内容拦截 / 超时 / 场景未建，而不是靠猜
    logSdk('warn', 'ai:fallback', { scene: sceneKey, reason: code || 'unknown' });
    if (code === 'PERMISSION_DENIED') {
      // 拒绝不记忆：此处关闭开关，等玩家主动再开时才会重新弹授权窗，避免自动重试反复骚扰
      aiSys.denied = true;
      aiSys.enabled = false;
      aiNotify('未授权 AI 能力，已关闭');
      return { text: fb, fromAi: false, reason: 'denied' };
    }
    if (code === 'AI_BALANCE_INSUFFICIENT') {
      aiNotify('星光币余额不足，已用本地内容');
      return { text: fb, fromAi: false, reason: 'balance' };
    }
    if (code === 'AI_INPUT_BLOCKED') {
      aiNotify('输入未过审，已用本地内容');
      return { text: fb, fromAi: false, reason: 'input_blocked' };
    }
    if (code === 'AI_OUTPUT_BLOCKED') {
      aiNotify('回复未过审，已用本地内容');
      return { text: fb, fromAi: false, reason: 'output_blocked' };
    }
    if (code === 'AI_RATE_LIMITED') {
      aiNotify('调用过于频繁，请稍后再试');
      return { text: fb, fromAi: false, reason: 'rate_limited' };
    }
    if (code === 'AI_QUOTA_EXCEEDED') {
      // 触发量是 messages 全量字符数，与玩家输入无关；此处不重试，直接本地兜底
      console.warn('[AI] 输入超出档位上限，已降级本地内容：', e.details);
      return { text: fb, fromAi: false, reason: 'quota' };
    }
    if (code === 'AI_CALL_TIMEOUT' || code === 'AI_CALL_ABANDONED' || code === 'AI_NETWORK_ERROR') {
      // 结果未知：必须先用 traceId 幂等取回，确认失败态后才允许重发（禁止直接重发造成双倍扣费）
      const tid = e.traceId || (e.details && e.details.traceId);
      if (typeof tid === 'string' && tid) {
        try {
          const r = await sdk.ai.getResult({ traceId: tid });
          if (r.status === 'success' && r.content) {
            // 超时后经 getResult 幂等取回（未重复扣费）——记一条便于统计超时/恢复率
            logSdk('info', 'ai:recovered', { scene: sceneKey });
            aiSys.lastBilling = r.billing || null;
            return { text: r.content.trim(), fromAi: true, billing: r.billing || null, recovered: true };
          }
        } catch (e2) { /* 取回失败也走兜底 */ }
      }
      aiNotify('AI 未及时回应，已用本地内容');
      return { text: fb, fromAi: false, reason: 'timeout' };
    }
    // AI_SCENE_NOT_FOUND / AI_MODEL_UNAVAILABLE / 其它：一律本地兜底
    aiNotify('AI 暂不可用，已用本地内容');
    return { text: fb, fromAi: false, reason: code || 'error' };
  }
  // busy 的加减交给 aiPump 统一管：排队、丢弃、发送三条出口各自结算，
  //   不会出现"排队中减了、发送时又减一次"这种把计数器减成负数的情况。
}
// 构造 messages：每次独立构造、不累积历史（CDR A1：对话窗口受控）
//   system 固定简短，user 只带本次决策所需最小上下文，远低于档位上限。
function aiMessages(system, user) {
  return [
    { role: 'system', content: String(system || '').slice(0, 400) },
    { role: 'user', content: String(user || '').slice(0, 1200) },
  ];
}
// system 提示词（简短、稳定，控制 input 长度）
//   主题「飘」注入原则（参赛主题一致性）：**只改叙事类，不动功能类**。
//     oracle / eulogy / namer / memory → 加意象锚点（灰烬·羽毛·无根·飘散·回响），字数增量控制在 +20 字内，
//       绝不触碰 input 预算红线（namer 的批次预算 1500 字符有硬性校验）。
//     tactics（只吐一个英文单词）/ advisor（冷峻的功能取舍建议）→ 一个字都不加：
//       给它们灌意象只会让输出变啰嗦，而它们的价值恰恰是"精确"。
const AI_SYS_PROMPT = {
  oracle:  '你是《深渊手稿》中深渊本身的低语。用一句 20 字以内的中文给出不祥的预言或氛围描写，诡谲、克制、不解释。意象偏「飘」：灰烬、羽毛、无根、飘散。只输出这一句话，不要引号。',
  tactics: '你是《深渊手稿》的敌方战术核心。根据玩家状态从 aggressive/defensive/control 中选一个最克制的战术，只输出这个英文单词。',
  advisor: '你是《深渊手稿》的构筑导师。用一句 25 字以内的中文，针对给出的选项给出取舍建议，冷峻、具体。只输出这一句。',
  eulogy:  '你是《深渊手稿》的书记官。为这局冒险写一句 25 字以内的墓志铭，用中文书名号包裹，阴郁而体面，可含灰烬或飘散的意象。只输出这一句。',
  // PHASE 2 · 批量命名：要求返回 JSON 数组（便于一次调用命名 N 个变体）
  namer:   '你是《深渊手稿》的命名者。为每条造物起一个中文名（≤12字，融合原怪物气质与词缀意象，可用「·」连接，可含灰烬/无根/飘散意象）与一句低语（≤20字，阴郁克制）。按输入序号输出JSON数组，每项{"n":"名字","w":"低语"}。只输出JSON，无解释、无代码块。',
  // PHASE 4 · 记忆回响：输入是玩家的历史账本（次数/深度），据此织一句低语。
  //   刻意限制为"一句、不解释、不复述数字"——复述数字会暴露这是模板填充，反而削弱沉浸感。
  //   「又飘回来了」是主题三个方向里最稀缺的那个（记忆·身份·思念）：这是全游戏唯一一处
  //   由 AI 亲口说出"深渊记得你"的地方，值得把意象锚点给足。
  memory:  '你是《深渊手稿》中深渊的记忆。根据玩家的历史，用一句 22 字以内的中文说出深渊对他的印象，克制、阴郁、像旧识重逢，可带「又飘回来了」的意味。只输出这一句话，不要引号，不要复述具体数字。',
};

// ==================== AI 文字样式统一层 ====================
// 五个会产出「给玩家看的句子」的 AI 场景：深渊低语 / 构筑导师 / 记忆回响 / 墓志铭 / 万象命名。
//   此前各写各的：紫的、暗灰的、金的、白的都有 —— 最刺眼的是同一句低语，
//   AI 给的显示紫色、本地兜底显示灰色，玩家一眼能分辨"这句是机器编的还是内置的"，
//   等于把实现细节暴露在了叙事层：**同样的内容不该有两种脸色**。
//   统一规范 —— 同一色系、同一字号、同一对齐、同一无描边，**只用明度区分来源**：
//     AI 真产出 → gold  中金（深渊"亲口"说的）
//     本地兜底 → goldDim 暗金（深渊"记得"的）
//   取金而非紫的理由：金是本作既有的**叙事色**（ABYSSUS / Flow / 墓志铭 / 图鉴条目），
//   紫留给 UI 控件（无尽回响按钮、AI 开关）—— 叙事归叙事色，控件归控件色。
const AI_LINE = { size: 13, aiAlpha: 235, localAlpha: 170 };
// opt: { fromAi, size, alpha, alignX, alignY }
function drawAiLine(str, x, y, opt) {
  const s = String((str === undefined || str === null) ? '' : str).trim();
  if (!s) return;
  const o = opt || {};
  const fromAi = !!o.fromAi;
  const a = (o.alpha !== undefined) ? o.alpha : (fromAi ? AI_LINE.aiAlpha : AI_LINE.localAlpha);
  push();
  noStroke();
  textAlign(o.alignX || CENTER, o.alignY || CENTER);
  textSize(o.size || AI_LINE.size);
  textStyle(NORMAL);
  cFill(fromAi ? 'gold' : 'goldDim', a);
  text(s, x, y);
  pop();
}

// ==================== PHASE 2 · 变体 AI 命名（scene: variant_namer） ====================
// 一句话设计：**数学负责无限的"组合"，AI 只为组合起一次名字，图鉴负责永久记住。**
//   命中图鉴 = 零调用 = 零费用 → 边际成本随游玩递减（第 1 局约 4–6 币，后期趋近 0）。
//
// 关键契约（依据 ai.md CDR A1–A10）：
//   A1 input 受控：自适应缩批 + 硬预算 —— 绝不触 AI_QUOTA_EXCEEDED（该错误不会因重试好转）。
//   A3/A5 不重试风暴：失败即降级为模板名，绝不自动重发同一批（重发会二次扣费）。
//   A6  自限频：只在「攒够一批」或「一局终了」时被玩家进程推进而发起，绝不在渲染循环内调用。
//   永不阻塞：玩家当场就看到模板名，AI 回来后才把"真名"写进图鉴；AI 全程不可用时游戏照常进行。
const NAMER_SYS = {
  enabled: true,
  batch: 5,            // 一次调用命名几个（1 币 ÷ 5 = 0.2 币/个）
  maxCallsPerRun: 6,   // 单局调用上限，硬保护玩家余额（gs.reset 时清零）
  inputBudget: 1500,   // input 字符硬预算（2K 档上限 2000，留 25% 余量 —— CDR A1）
  maxTitleLen: 14,     // 称号长度上限（再长会溢出信息面板）
  maxWhisperLen: 44,
  // —— 内存态 ——
  _queue: [],          // 待命名：[{ b: 基底id, k: 词缀组合key, tags, base, d }]
  _pending: false,     // 是否有批在飞（防重入并发）
  _callsThisRun: 0,
  _namedThisRun: 0,
  _failedThisRun: 0,
  _lastErr: '',
};

// 「能否入列」与「能否发起」是两件事，必须分开：
//   入列只要求 AI 可用且本局还剩额度 —— **刻意不因「有批在飞」而拒绝**。
//   否则一次调用在飞的 1–3 秒里新发现的变体会被静默丢弃（它虽会留待下次遭遇再补，
//   但白白少了一次"当场赐名"的机会）。队列长度用「还能发几批」显式封顶，不会无限堆积。
function namerCanEnqueue() {
  try {
    if (!NAMER_SYS.enabled || !NAMER_SYS._queue) return false;
    if (!aiSys.enabled || aiSys.denied) return false;      // 玩家开关关闭 / 拒绝授权 → 零调用
    if (NAMER_SYS._callsThisRun >= NAMER_SYS.maxCallsPerRun) return false;   // 本局额度已尽
    if (NAMER_SYS._queue.length >= NAMER_SYS.batch * NAMER_SYS.maxCallsPerRun) return false;
    const sdk = aiGetSdk();
    return !!(sdk && sdk.ai);
  } catch (e) { return false; }
}
// 「能否发起」额外要求当前没有批在飞 —— 禁止并发批次（CDR A6）
function namerCanRequest() {
  return namerCanEnqueue() && !NAMER_SYS._pending;
}

// 入列一个待命名变体（在判定为「跨局首次发现」之后调用）
function namerEnqueue(baseId, affixKey, tags, baseName, depth) {
  try {
    if (!NAMER_SYS.enabled || !baseId || !affixKey) return false;
    if (!namerCanEnqueue()) return false;
    if (NAMER_SYS._queue.some(q => q && q.b === baseId && q.k === affixKey)) return false;  // 已在队列
    NAMER_SYS._queue.push({ b: baseId, k: affixKey, tags: String(tags || ''), base: String(baseName || ''), d: depth || 0 });
    // 攒够一批才发起：既压缩了单条成本，也天然节流（CDR A6）
    if (NAMER_SYS._queue.length >= NAMER_SYS.batch) namerFlush(false);
    return true;
  } catch (e) { return false; }
}

function namerUserHead() { return '为下列深渊造物各起一个名字与一句低语，按序号对应，只输出JSON数组。\n'; }
function namerLine(idx, it) { return idx + '|' + it.base + '|' + it.tags + '\n'; }

// 自适应缩批：逐条累加字符数，超预算就停 —— 保证 input 永远低于 inputBudget（CDR A1）。
//   注意名额触 AI_QUOTA_EXCEEDED 是"确定性失败"，重试必然再失败，必须从源头不让额度超。
function namerTakeBatch() {
  const q = NAMER_SYS._queue;
  if (!q.length) return [];
  let total = namerUserHead().length, take = 0;
  for (let i = 0; i < q.length && take < NAMER_SYS.batch; i++) {
    const len = namerLine(i + 1, q[i]).length;
    if (total + len > NAMER_SYS.inputBudget) break;
    total += len; take++;
  }
  if (!take) take = 1;                       // 至少带 1 条，避免永远卡住
  return q.splice(0, take);
}

function namerBuildMessages(batch) {
  let user = namerUserHead();
  for (let i = 0; i < batch.length; i++) user += namerLine(i + 1, batch[i]);
  return aiMessages(AI_SYS_PROMPT.namer, user);
}
// 单个字段清洗：去控制字符、去首尾引号/书名号（模型爱带），截断到上限
function namerSanitize(v, maxLen) {
  if (typeof v !== 'string') return '';
  let s = v.replace(/[\u0000-\u001f\u007f]/g, '').replace(/^["'「」《》]+|["'「」《》]+$/g, '').trim();
  if (s.length > maxLen) s = s.slice(0, maxLen);
  return s;
}
// 容错解析：模型可能带 ```json 围栏、前后废话、末尾截断、甚至裸控制字符 —— 全部兼容，绝不抛错
function namerParseReply(text, expect) {
  try {
    // 先整体消毒：JSON 字符串里不能含**裸**控制字符（模型经常在值里打真正的换行），
    //   留着它会让下面两条解析路径同时失败、名字整个丢失。替换为空格不影响 {} 结构。
    let s = String(text || '').replace(/[\u0000-\u001f\u007f]/g, ' ').trim();
    if (!s) return [];
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) s = fence[1].trim();
    // 路径 A：整体当成 JSON 数组解析
    let arr = null;
    const a = s.indexOf('['), b = s.lastIndexOf(']');
    if (a >= 0 && b > a) {
      try { arr = JSON.parse(s.slice(a, b + 1)); } catch (e) { arr = null; }
    }
    // 路径 B：退化为逐个 {...} 抽取
    if (!Array.isArray(arr)) {
      arr = [];
      (s.match(/\{[^{}]*\}/g) || []).forEach(o => { try { arr.push(JSON.parse(o)); } catch (e2) {} });
    }
    // 路径 C：输出被截断时（小模型撞输出上限很常见）对象可能没闭合，
    //   此时直接按顺序抓 "n" / "w" 键值对 —— 能救回几条算几条
    const usable = arr.filter(it => it && typeof it.n === 'string' && it.n.trim()).length;
    if (usable < expect) {
      const loose = namerLoosePairs(s, expect);
      if (loose.length > usable) arr = loose;
    }
    const out = [];
    for (let i = 0; i < Math.min(arr.length, expect); i++) {
      const it = arr[i] || {};
      const n = namerSanitize(it.n, NAMER_SYS.maxTitleLen);
      out.push(n ? { n: n, w: namerSanitize(it.w, NAMER_SYS.maxWhisperLen) } : null);
    }
    return out;
  } catch (e) { return []; }
}
// 顺序抓取 "n":"…" / "w":"…" 键值对 —— JSON 整体损坏/截断时的最后兜底
function namerLoosePairs(text, expect) {
  try {
    const ns = [], ws = [];
    let m;
    const ren = /"n"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
    while ((m = ren.exec(text)) !== null && ns.length < expect) ns.push(m[1]);
    const rew = /"w"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
    while ((m = rew.exec(text)) !== null && ws.length < expect) ws.push(m[1]);
    return ns.map((n, i) => ({ n: n, w: ws[i] || '' }));
  } catch (e) { return []; }
}

// 把 AI 命名写回图鉴（永久缓存 → 下次遭遇零费用），并尽量让场上这只立刻改名
function namerApplyResults(batch, parsed) {
  let applied = 0;
  try {
    if (!CODEX_SYS._index) return 0;
    for (let i = 0; i < batch.length; i++) {
      const it = batch[i], res = parsed[i];
      if (!res || !res.n) continue;                        // 这条没解析出来 → 保留模板名
      const item = CODEX_SYS._index.get(codexKey(it.b, it.k));
      if (!item) continue;                                 // 已被 FIFO 淘汰，无需再写
      item.t = res.n;
      if (res.w) item.w = res.w;
      applied++;
      // 当场改名：若此刻正在打的就是这一只，玩家会看到「模板名 → 真名」的转变
      try {
        const cs = (typeof gs !== 'undefined' && gs.combatState) ? gs.combatState : null;
        const e = cs && cs.enemyData;
        if (e && e._variant && e._variant.baseId === it.b
            && (e._variant.affixes || []).slice().sort().join('+') === it.k) {
          e._variant.title = res.n;
          e._variant.whisper = res.w || '';
          e._variant.aiNamed = true;
          e.name = res.n;
          if (res.w) {
            e.desc = '【' + (e._variant.tags || []).join('·') + '】' + (e._variant.desc || '') + '「' + res.w + '」';
          }
        }
      } catch (e2) { /* 改名失败无所谓，下次遭遇自然会用到 */ }
    }
    if (applied) { CODEX_SYS._dirty = true; codexFlush(); }
    NAMER_SYS._namedThisRun += applied;
  } catch (e) { /* 永不因命名回写影响主流程 */ }
  return applied;
}

// 发起一次批量命名。force=true 时不足一批也发（局终时离场前用掉余额上限内的最后一次）。
//   ⚠️ 失败不重发：AI 调用"发起即计费"，自动重试会让玩家为同一批内容付两次钱（CDR A3/A5）。
async function namerFlush(force) {
  if (NAMER_SYS._pending || !NAMER_SYS._queue.length) return 0;
  if (!namerCanRequest()) return 0;
  if (!force && NAMER_SYS._queue.length < NAMER_SYS.batch) return 0;
  const batch = namerTakeBatch();
  if (!batch.length) return 0;
  NAMER_SYS._pending = true;
  NAMER_SYS._callsThisRun++;
  let applied = 0;
  try {
    const res = await aiRequest('namer', namerBuildMessages(batch), '');
    if (res && res.fromAi) {
      applied = namerApplyResults(batch, namerParseReply(res.text, batch.length));
      if (applied) logSdk('info', 'namer:named', { n: applied, call: NAMER_SYS._callsThisRun });
      else logSdk('warn', 'namer:no-parse', { n: batch.length, call: NAMER_SYS._callsThisRun });
    } else {
      NAMER_SYS._failedThisRun++;
      NAMER_SYS._lastErr = (res && res.reason) || 'unknown';
      logSdk('warn', 'namer:fallback', { reason: NAMER_SYS._lastErr, n: batch.length });
    }
  } catch (e) {
    NAMER_SYS._failedThisRun++;
    logSdk('warn', 'namer:fallback', { reason: 'throw' });
  } finally {
    NAMER_SYS._pending = false;
  }
  return applied;
}

// 查图鉴里有没有 AI 给的"真名" —— 命中即零费用
function namerLookup(baseId, affixKey) {
  try {
    if (!baseId || !affixKey || !CODEX_SYS._index) return null;
    const it = CODEX_SYS._index.get(codexKey(baseId, affixKey));
    return (it && it.t) ? { title: it.t, whisper: it.w || '' } : null;
  } catch (e) { return null; }
}

// 一局终了：清空待命名队列与计数（下局重新有额度）
function namerResetRun() {
  NAMER_SYS._queue = [];
  NAMER_SYS._pending = false;
  NAMER_SYS._callsThisRun = 0;
  NAMER_SYS._namedThisRun = 0;
  NAMER_SYS._failedThisRun = 0;
}
function namerStats() {
  return {
    queued: NAMER_SYS._queue.length, calls: NAMER_SYS._callsThisRun,
    named: NAMER_SYS._namedThisRun, failed: NAMER_SYS._failedThisRun,
    max: NAMER_SYS.maxCallsPerRun, batch: NAMER_SYS.batch, lastErr: NAMER_SYS._lastErr,
  };
}
