    if (!D) return;
    const S = FLOW_STYLE.drag;
    // 保险：鼠标在画布外松开时 p5 可能不派发 mouseReleased —— 这里兜底收尾，避免字"粘"在手上
    if (D.dragging && typeof mouseIsPressed !== 'undefined' && !mouseIsPressed) this._releaseFlow();
    if (D.dragging) {
      const a = this.flowAnchorScreen();
      let nx = mx() - D.gdx - a.x;
      let ny = my() - D.gdy - a.y;
      // 软夹紧：字心始终留在画面内（留 pad 呼吸边）—— 拖不丢，也不用写死边界
      const minX = S.pad - a.x, maxX = GAME_W - S.pad - a.x;
      const minY = S.pad - a.y, maxY = GAME_H - S.pad - a.y;
      nx = Math.max(minX, Math.min(maxX, nx));
      ny = Math.max(minY, Math.min(maxY, ny));
      // 记录手速：松手时延续为初速，"甩"出去的手感。
      //   T249：刻意做滑动平均而不是取瞬时值 —— 松手前那 1~3 帧的自然停顿不该把手速清零，
      //   否则"先飞出一小段再往回飘"这个设计等于没写。副作用（好的那面）：拖拽时的
      //   侧倾姿态不再随单帧采样抖动而抽动。
      D.vx = D.vx * S.tossMemory + (nx - D.ox) * (1 - S.tossMemory);
      D.vy = D.vy * S.tossMemory + (ny - D.oy) * (1 - S.tossMemory);
      D.ox = nx; D.oy = ny;
      D.moved += Math.abs(D.vx) + Math.abs(D.vy);
      return;
    }
    if (!D.returning) return;
    // T247：步进归一化 —— 所有下面的常量都是"按 60fps 一帧"标定的，
    //   于是一次推进 = 真实经过时间 ÷ 16.67ms。30fps 机器上每帧走 2 步、120fps 上走 0.5 步，
    //   回位总时长就稳定在 4.4s 左右，而不是被帧率拉成 9s 或压成 2s。
    //   （T244 的战报停留已踩过同一个坑：帧数不是秒数。这条教训同样适用于动效。）
    //   钳到 [0.25, 3]：切后台回来时 deltaTime 可能是几千毫秒，不钳会把字瞬间吸回原点。
    const _dt = (typeof deltaTime === 'number' && deltaTime > 0) ? deltaTime : 16.667;
    const _steps = constrain(_dt / 16.667, 0.25, 3);
    D.retT += _steps;
    // 随机晃动：两个独立 Perlin 通道分别驱动 x / y。
    //   ⚠️ 晃动是**叠加量**而非累加进基准位置 —— 噪声若累加会持续漂移，
    //   缓动曲线就失去对位置的控制（字可能永远回不到「A」正下方）。
    D.wt += S.wanderSpeed * _steps;
    let _p = 0;
    if (D.retT <= S.inertiaFrames) {
      // ① 甩手余韵：松手瞬间延续手速 —— 字先"飞出去"一小段，才开始往回飘
      const _tk = Math.pow(S.tossDecay, _steps);
      D.vx *= _tk; D.vy *= _tk;
      D.bx += D.vx * _steps; D.by += D.vy * _steps;
    } else {
      // ② 缓动回位：从余韵结束处沿 easeOut 曲线回到 (0,0)。
      //    速度严格单调递减 —— 这正是用户要的"逐步减慢"；最后一段几乎贴着走，
      //    是"被风轻轻放下来"而不是"撞上去"。
      if (!D.easeSet) { D.ax = D.bx; D.ay = D.by; D.easeSet = true; }   // 记下缓动起点
      _p = Math.min(1, (D.retT - S.inertiaFrames) / S.returnFrames);
      const _ease = 1 - Math.pow(1 - _p, S.returnPow);
      D.bx = D.ax * (1 - _ease);
      D.by = D.ay * (1 - _ease);
    }
    // T248：晃动幅度挂在**剩余路程**上 —— 离家越近晃得越小，落地那一刻恰好归零。
    //   这比"另开一条指数衰减"干净得多：衰减速度与回位速度天然同步，不存在
    //   "字到家了还在抖"的收尾。（旧的 wanderDecay / wanderStop 因此退役。）
    const _wv = D.wamp * Math.pow(1 - _p, S.wanderTail);
    D.ox = D.bx + nz1(D.wt) * _wv;
    D.oy = D.by + nz1(D.wt + 37.7) * _wv;
    const _done = _p >= 1;
    // T243：姿态 —— 拖拽时顺着手速侧倾（像被风拎着走），回飘时随晃动自由摆。
    //   角度永远是被"lerp 追"上去的，不是直接赋值 —— 姿态变化比位置慢半拍，才有纸片的迟滞感。
    let _ta;
    if (D.dragging) _ta = constrain(D.vx * S.poseFromV, -S.poseAngMax, S.poseAngMax);
    else if (D.returning) {
      D.pt += S.poseSpeed * _steps;   // T247：与位置晃动分开的慢通道
      // T248：目标角也乘包络 → 落地前平滑收到 ~0，
      //   于是"到家站正"是自然收敛而不是最后一帧的硬切。
      _ta = (nz1(D.pt + 71.3) * (S.poseBase + _wv * S.poseNoise)
             + D.vx * S.poseFromV * 0.5) * Math.pow(1 - _p, 0.5);
    }
    else _ta = 0;
    D.ang = lerp(D.ang, _ta, D.dragging ? S.poseLerpDrag : S.poseLerpBack);
    // 纵向压缩：倾得越狠压得越扁（纸片侧过去离我们远去），封顶 10% 免得变形
    D.sy = 1 - Math.min(S.poseSquashCap, Math.abs(D.ang) * S.poseSquash);
    // 归位判定：缓动走完（此时包络也必然同时为 0）→ 干脆利落地归零，避免永远差 0.1px 抖
    if (_done) {
      D.ox = 0; D.oy = 0; D.bx = 0; D.by = 0; D.ax = 0; D.ay = 0;
      D.vx = 0; D.vy = 0; D.returning = false; D.wamp = 0; D.retT = 0; D.easeSet = false;
      // T243：姿态一并归位 —— 到家就站正，不许歪着定格
      D.ang = 0; D.sy = 1;
    }
  }
  // T243：当前姿态（绘制侧用）。未初始化时返回"站正"，调用方无需判空。
  flowPose() {
    const D = this.flowDrag;
    return D ? { ang: D.ang, sy: D.sy } : { ang: 0, sy: 1 };
  }
  // T241：抓住 Flow。刻意放在「开 AI」判定**之前**且不立即触发 AI ——
  //   到底算点击还是拖拽，要等松手时看位移才知道（见 _releaseFlow）。
  _grabFlow() {
    const D = this.flowDrag;
    if (!D) return false;
    const a = this.flowAnchorScreen();
    D.dragging = true;
    D.returning = false;
    D.gdx = mx() - (a.x + D.ox);   // 抓哪儿就从哪儿跟，字不会跳到鼠标中心
    D.gdy = my() - (a.y + D.oy);
    D.moved = 0; D.vx = 0; D.vy = 0;
    D.px = mx(); D.py = my();
    return true;
  }
  // T241：松开 Flow —— 轻点走旧的"开 AI"语义，真拖过则启动回飘。
  _releaseFlow() {
    const D = this.flowDrag;
    if (!D || !D.dragging) return;
    D.dragging = false;
    const S = FLOW_STYLE.drag;
    const dist = Math.hypot(mx() - D.px, my() - D.py);
    D.returning = true;
    // T245：缓动状态复位 —— 基准位置从当前偏移起步，余韵计时归零
    D.retT = 0;
    D.easeSet = false;
    D.pt = Math.random() * 100;    // T247：姿态相位也随机（否则每次"摇"的起手都一样）
    D.bx = D.ox; D.by = D.oy;
    D.ax = D.ox; D.ay = D.oy;
    D.wt = Math.random() * 100;    // 每次相位不同 → 晃动轨迹不重样
    if (dist <= S.clickSlop) {
      // 轻点：保留 T228 的语义（点 Flow **开启** AI + 三角淡出），只给一点点晃动作反馈。
      //   ⚠️ T250 修真实缺陷：这里原来是 `if (this.aiHintVisible()) this.dismissAiHint();`
      //   —— 三角淡完之后 _aiHintDismissed 永远为 true（单例场景跨局不清零），
      //   于是**第二次起再点 Flow 毫无反应**，AI 再也点不开（实测：enabled 不变）。
      //   引导消失可以是永久的，主入口不能跟着一起失效 —— 判空挪进 dismissAiHint 内部。
      //   语义刻意是"开启"而非"开关"：文案写的是「按我开启 AI」，关闭请用右下角呼吸灯。
      this.dismissAiHint();
      D.wamp = 3;
    } else {
      // 真拖过：晃动幅度随拖拽距离略增（拖得越远，飘回来的路上晃得越久）
      D.wamp = S.wanderAmp * Math.min(1.6, 0.55 + dist / 260);
      D.vx = constrain(D.vx, -S.tossCap, S.tossCap);
      D.vy = constrain(D.vy, -S.tossCap, S.tossCap);
    }
  }
  mouseReleased() {
    // T241：由全局 mouseReleased() 转发进来
    this._releaseFlow();
  }
  // Flow 副标题 + 下方指示三角的**合并**点击热区（屏幕坐标）。
  //   **实时**按当前 titleY（入场动画）/ tilt（鼠标视差）/ frameCount（正弦漂浮相位）计算 ——
  //   标题在动、字在飘，任何缓存的 stale 坐标都会点不准（硬约束 #19：绘制 hover 与点击都调本方法）。
  flowHitRect() {
    const _tf = FLOW_STYLE.tiltFactor;
    const _phase = frameCount * FLOW_STYLE.bobSpeed;
    const _o = this.flowOff();   // T241：热区跟着字走（字被拖到哪，哪里就能抓/能 hover）
    const cx = GAME_W / 2 + this.flowAnchor() + this.tiltX * _tf + _o.x;
    const wordCY = this.titleY + FLOW_STYLE.baseY + Math.sin(_phase) * FLOW_STYLE.bobAmp + this.tiltY * _tf + _o.y;
    const triCY  = this.titleY + FLOW_STYLE.triBaseY + Math.sin(_phase) * FLOW_STYLE.triAmp + this.tiltY * _tf + _o.y;
    let fw;
    push(); textSize(FLOW_STYLE.size); textStyle(BOLD); fw = textWidth('Flow'); pop();
    const w = fw + 26;                                        // 左右各 13px 宽容边
    const top = wordCY - FLOW_STYLE.size / 2 - 6;
    const bot = triCY + FLOW_STYLE.triHalf * 0.6 + 6;
    return { x: cx - w / 2, y: top, w, h: bot - top };
  }
  // 点是否落在 Flow 热区内（draw 的 hover 增亮与 mousePressed 的点击判定共用）
  _pointInFlow(x, y) {
    const r = this.flowHitRect();
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }
  // 点中 Flow：**开启 AI**（右下呼吸灯随即转绿）+ 指示三角启动淡出
  dismissAiHint() {
    // T250：三角淡出是一次性的（已经淡完就不必再走一次淡出流程），开启 AI 不是。
    if (!this._aiHintDismissed) this._aiHintFading = true;
    try {
      if (typeof aiSys !== 'undefined' && !aiSys.enabled) {
        // 复用既有的开关函数：它会顺带清拒绝标记、发提示、存盘，行为与点呼吸灯完全一致
        if (typeof aiToggleEnabled === 'function') aiToggleEnabled();
        else aiSys.enabled = true;
      }
    } catch (e) { /* AI 开启失败也不影响三角淡出 */ }
  }
  mousePressed() {
    // T228：命中 Flow 副标题（含下方三角热区）→ 开启 AI，三角由明转暗后消失。
    //   刻意排在「继续游戏 / 进入深渊」之前：它在标题区，与下方按钮不重叠，先判更安全。
    try {
      // T241：命中 Flow 即"抓住"（无论 AI 是否已开启 —— 抓取是常驻的小交互）。
      //   旧逻辑的"点一下开 AI"改到 mouseReleased 里按位移判定，避免拖完手一松就误开。
      if (this._pointInFlow(mx(), my())) {
        this._grabFlow();
        return;
      }
    } catch (e) { /* Flow 判定失败不影响正常按钮 */ }
    // 继续游戏按钮:有存档且点击命中时触发异步读档
    //   读档成功 → 切到存档场景(enter 会触发 autoSave 钩子,但内容相同无害)
    //   读档失败 → 回退到新游戏(reset + map)
    if (saveManager && saveManager._hasSaveCache && this.startAlpha > 0) {
      let cbx = GAME_W / 2 - 80;
      let cby = GAME_H * 0.55;
      let chovered = mx() > cbx && mx() < cbx + 160 && my() > cby && my() < cby + 44;
      if (chovered) {
        saveManager.loadAndRestore().then(ok => {
          if (!ok) {
            // 读档失败:回退到新游戏流程
            gs.reset();
            gs.scene = 'map';
          }
          // 读档成功:gs.scene 已被 loadAndRestore 设为存档场景
          currentScene = scenes[gs.scene];
          if (abyss) abyss._lastScene = gs.scene;
          currentScene.enter();
        });
        return;  // 命中继续游戏,不再触发「进入深渊」
      }
    }
    // T205：在 mousePressed 实时重算按钮命中（不要复用 draw 帧写入的 stale hovered）：
    //   原 T204 仅判 this.startBtn.hovered，但该值是 draw 帧采样的；若用户将鼠标从按钮上移开再点击，
    //   startBtn.hovered 仍为 true（来自上一帧），导致任意位置点击都触发 gs.reset+scene=map。
    //   现在用与 draw 完全一致的 hit-test 逻辑（bx, by, 160x44）实时重算，避免 stale 状态。
    if (this.startAlpha > 0) {
      let bx = GAME_W / 2 - 80;
      let by = GAME_H * 0.62;
      let hovered = mx() > bx && mx() < bx + 160 && my() > by && my() < by + 44;
      if (hovered) {
        gs.reset();
        gs.scene = 'map';
      }
    }
  }
  keyPressed() {
    // 按任意键开始游戏
    gs.reset();
    gs.scene = 'map';
  }
}

// 数字转罗马数字（1-39）
//   < 1 或 > 39 退化为阿拉伯数字
function toRoman(num) {
  if (num < 1 || num > 39) return String(num);
  const lookup = [
    ['X', 10], ['IX', 9], ['V', 5], ['IV', 4], ['I', 1]
  ];
  let result = '';
  for (const [letter, value] of lookup) {
    while (num >= value) {
      result += letter;
      num -= value;
    }
  }
  return result;
}

// ==================== 地图场景 ====================
class MapScene extends Scene {
  enter() {
    super.enter();
    audio.playMapBGM();
    // 主题层「飘」：新局开场迎接遮罩（T235 —— 首局灰烬诗 / 回归玩家「第 N 次」，均为全屏遮罩）。
    //   只在 gs.reset() 置位后的首帧触发（读档继续 / 从战斗返回都不触发），消费即清零。
    //   ⚠️ 必须排在下方 currentLayer>=layers.length 的跨区分派之前：新局 currentLayer=0，
    //   那条路径不会执行，故不会覆盖 intro 转场。
    if (gs._freshRun) {
      gs._freshRun = false;
      try { if (typeof driftOnRunStart === 'function') driftOnRunStart(); } catch (e) {}
    }
    // 双区域地图系统：若 gs.mapData 为空或区域变更，重新生成地图
    if (!gs.mapData || gs.mapData.region !== gs.currentRegion) {
      gs.mapData = generateMap(gs.currentRegion);
      gs.currentLayer = 0;
      gs.currentNodeId = null;
      gs.mapPath = [];
    }
    this.mapConfig = gs.mapData;
    // 检查是否所有层都已完成（当前区域内）
    if (gs.currentLayer >= this.mapConfig.layers.length) {
      // 当前区域 Boss 已击败，进入下一区域或全局胜利
      // PHASE 3：无尽回响开启后永远为真 —— 层数不再有上限
      if (echoHasNextRegion()) {
        // 进入下一区域
        gs.currentRegion++;
        gs.mapData = generateMap(gs.currentRegion);
        gs.currentLayer = 0;
        gs.currentNodeId = null;
        gs.mapPath = [];
        this.mapConfig = gs.mapData;
        echoMarkDepth();   // PHASE 3：跨区域后刷新最深纪录
        gs.regionTransition = { active: true, timer: 180, region: gs.currentRegion };
      } else {
        // 全部区域完成，全局胜利
        gs.scene = 'victory';
        return;
      }
    }
    this.currentLayer = gs.currentLayer;
    this.hoveredNode = null;
    this.selectedNode = null;
    this.nodeAnimations = {};
    this.bgParticles = [];
    // 漂浮符号渐隐：maxLife 字段控制首尾 12% 渐显/渐隐，中段 76% 全亮
    for (let i = 0; i < 20; i++) {
      let maxLife = 200 + rand(0, 300);
      this.bgParticles.push({
        x: rand(0, GAME_W), y: rand(0, GAME_H),
        vx: rand(-0.2, 0.2), vy: rand(-0.4, -0.1),
        life: maxLife,           // 当前生命（每帧 -1）
        maxLife: maxLife,        // 初始最大生命（用于计算 fadeAlpha）
        glyph: pick(['☿','♁','♃','⚗','⛤','✠','✢','✦','◈','●']),
        size: rand(10, 24),
      });
    }
  }
  getNodePos(node) {
    return { x: node.x * GAME_W, y: node.y * GAME_H };
  }
  getNodeTypeInfo(type) {
    switch (type) {
      case 'battle': return { icon: '⚔', label: '战斗', color: COLORS.red };
      case 'elite': return { icon: '⛨', label: '精英', color: COLORS.orange };
      case 'boss': return { icon: '✠', label: 'BOSS', color: '#ff2060' };
      case 'shop': return { icon: '💰', label: '商店', color: COLORS.gold };
      case 'event': return { icon: '?', label: '事件', color: COLORS.purple };
      case 'rest': return { icon: '☤', label: '休息', color: COLORS.green };
      case 'treasure': return { icon: '★', label: '宝藏', color: COLORS.goldBright };
      case 'artisan': return { icon: '⚒', label: '工匠', color: COLORS.blueBright };
      case 'relic_swap': return { icon: '⇄', label: '遗物交换', color: COLORS.purpleBright };
      default: return { icon: '○', label: '???', color: COLORS.white };
    }
  }
  update() {
    super.update();
    this.bgParticles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.life--;
      // 生命耗尽重生 + 重置 maxLife
      if (p.life <= 0) {
        let newMax = 200 + rand(0, 300);
        p.x = rand(0, GAME_W); p.y = GAME_H + 20;
        p.life = newMax; p.maxLife = newMax;
      }
    });
    // 区域过渡期间禁止交互
    if (gs.regionTransition && gs.regionTransition.active) {
      this.hoveredNode = null;
      return;
    }
    this.hoveredNode = null;
    let layer = this.mapConfig.layers[this.currentLayer];
    if (!layer) return;
    // 获取可到达的节点
    let reachableIds = new Set();
    if (gs.currentNodeId) {
      // 搜索所有层的连接来找到当前节点能到达的目标
      for (let l of this.mapConfig.layers) {
        (l.connections || []).forEach(([from, to]) => {
          if (from === gs.currentNodeId) reachableIds.add(to);
        });
      }
    } else {
      layer.nodes.forEach(n => reachableIds.add(n.id));
    }
    layer.nodes.forEach(node => {
      if (!reachableIds.has(node.id)) return;
      let pos = this.getNodePos(node);
      let r = node.type === 'boss' ? 35 : 25;
      let d = dist(mx(), my(), pos.x, pos.y);
      if (d < r) this.hoveredNode = node;
    });
  }
  draw() {
    abyssVeil();
    // 背景粒子：fadeAlpha * 255
    this.bgParticles.forEach(p => {
      // 渐隐规则（12%/76%/12%）：前 12% 渐显 → 中 76% 保持 1 → 后 12% 渐隐
      let lifeRatio = p.life / p.maxLife;
      let fadeAlpha;
      if (lifeRatio > 0.88) {
        fadeAlpha = (1 - lifeRatio) / 0.12;
      } else if (lifeRatio < 0.12) {
        fadeAlpha = lifeRatio / 0.12;
      } else {
        fadeAlpha = 1;
      }
      cFill('goldDim', fadeAlpha * 255);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(p.size);
      text(p.glyph, p.x, p.y);
    });
    // 绘制连接线 - 发光能量脉络（贝塞尔曲线）
    for (let li = 0; li < this.mapConfig.layers.length; li++) {
      let conns = this.mapConfig.layers[li].connections || [];
      conns.forEach(([fromId, toId]) => {
        let fromNode = this.findNode(fromId);
        let toNode = this.findNode(toId);
        if (!fromNode || !toNode) return;
        let from = this.getNodePos(fromNode);
        let to = this.getNodePos(toNode);
        let visited = gs.mapPath.includes(fromId) && gs.mapPath.includes(toId);
        let available = gs.currentNodeId === fromId || (!gs.currentNodeId && li === gs.currentLayer);
        // 贝塞尔曲线控制点（中点偏移产生弧度）
        let midX = (from.x + to.x) / 2;
        let midY = (from.y + to.y) / 2;
        let curveOffset = Math.abs(to.x - from.x) * 0.15;
        let ctrlX = midX + (to.y > from.y ? curveOffset : -curveOffset);
        let ctrlY = midY;
        // 能量流动动画
        let flowOffset = (frameCount * 0.5) % 20;
        if (visited) {
          // 已访问：金色发光脉络
          cStroke('gold', 60);
          strokeWeight(6);
          noFill();
          bezier(from.x, from.y, ctrlX, ctrlY, ctrlX, ctrlY, to.x, to.y);
          cStroke('goldBright', 200);
          strokeWeight(2);
          bezier(from.x, from.y, ctrlX, ctrlY, ctrlX, ctrlY, to.x, to.y);
        } else if (available) {
          // 可达：暗金色虚线脉络
          cStroke('goldDim', 100);
          strokeWeight(2);
          noFill();
          drawingContext.setLineDash([6, 4]);
          drawingContext.lineDashOffset = -flowOffset;
          bezier(from.x, from.y, ctrlX, ctrlY, ctrlX, ctrlY, to.x, to.y);
          drawingContext.setLineDash([]);
        } else {
          // 锁定：灰色淡线
          cStroke('textDim', 40);
          strokeWeight(1);
          noFill();
          bezier(from.x, from.y, ctrlX, ctrlY, ctrlX, ctrlY, to.x, to.y);
        }
      });
    }
    // 绘制节点 - 怪诞符文风格
    for (let li = 0; li < this.mapConfig.layers.length; li++) {
      let layer = this.mapConfig.layers[li];
      let isCurrentLayer = li === this.currentLayer;
      // 判断哪些节点可到达
      let reachableIds = new Set();
      if (isCurrentLayer) {
        if (gs.currentNodeId) {
          for (let l of this.mapConfig.layers) {
            (l.connections || []).forEach(([from, to]) => {
              if (from === gs.currentNodeId) reachableIds.add(to);
            });
          }
        } else {
          layer.nodes.forEach(n => reachableIds.add(n.id));
        }
      }
      layer.nodes.forEach(node => {
        let pos = this.getNodePos(node);
        let info = this.getNodeTypeInfo(node.type);
        let visited = gs.mapPath.includes(node.id);
        let reachable = reachableIds.has(node.id);
        let isCurrent = node.id === gs.currentNodeId;
        let r = node.type === 'boss' ? 35 : 25;
        push();
        translate(pos.x, pos.y);
        // 脉冲动画
        let pulse = 1 + Math.sin(frameCount * 0.05 + pos.x * 0.01) * 0.08;
        if (isCurrent || this.hoveredNode === node) pulse = 1 + Math.sin(frameCount * 0.1) * 0.15;
        // 光晕（当前/悬停节点）
        if (isCurrent || this.hoveredNode === node) {
          for (let i = 3; i >= 0; i--) {
            let rgb = hexToRgb(info.color);
            fill(rgb.r, rgb.g, rgb.b, 20 - i * 4);
            noStroke();
            ellipse(0, 0, (r + i * 6) * 2 * pulse, (r + i * 6) * 2 * pulse);
          }
        }
        // 符文圆环外圈（怪诞风格）
        if (visited || reachable) {
          noFill();
          cStroke(visited ? 'gold' : info.color, visited ? 200 : 120);
          strokeWeight(1);
          let runeCount = node.type === 'boss' ? 8 : 6;
          for (let i = 0; i < runeCount; i++) {
            let a = (i / runeCount) * Math.PI * 2 + frameCount * 0.005;
            let rx = Math.cos(a) * (r + 5) * pulse;
            let ry = Math.sin(a) * (r + 5) * pulse;
            // 符文点
            point(rx, ry);
            // 小符文标记
            if (i % 2 === 0) {
              push();
              translate(rx, ry);
              rotate(a);
              noStroke();
              cFill(visited ? 'gold' : info.color, 150);
              ellipse(0, 0, 3, 3);
              pop();
            }
          }
        }
        // 节点主体 - 符文圆盘
        if (visited) {
          fill(color(info.color));
          cStroke('gold');
          strokeWeight(2.5);
        } else if (reachable) {
          cFill('bgLight');
          stroke(color(info.color));
          strokeWeight(2);
        } else {
          cFill('bg');
          cStroke('textDim', 80);
          strokeWeight(1);
        }
        ellipse(0, 0, r * 2 * pulse, r * 2 * pulse);
        // 内部符文图案（六芒星/三角阵）
        if (visited || reachable) {
          noFill();
          cStroke(visited ? 'goldBright' : info.color, 100);
          strokeWeight(1);
          let innerR = r * 0.5 * pulse;
          // 倒三角
          beginShape();
          for (let i = 0; i < 3; i++) {
            let a = (i / 3) * Math.PI * 2 + Math.PI / 2;
            vertex(Math.cos(a) * innerR, Math.sin(a) * innerR);
          }
          endShape(CLOSE);
          // 正三角
          beginShape();
          for (let i = 0; i < 3; i++) {
            let a = (i / 3) * Math.PI * 2 - Math.PI / 2;
            vertex(Math.cos(a) * innerR, Math.sin(a) * innerR);
          }
          endShape(CLOSE);
        }
        // 图标
        fill(visited ? 0 : color(info.color));
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(node.type === 'boss' ? 22 : 16);
        text(info.icon, 0, 0);
        // 标签
        if (visited) cFill('gold'); else if (reachable) cFill('text'); else cFill('textDim');
        noStroke();
        textSize(10);
        text(info.label, 0, r + 14);
        // 当前节点标记 - 旋转光环
        if (isCurrent) {
          noFill();
          cStroke('goldBright', 150);
          strokeWeight(2);
          let rotR = (r + 8) * pulse;
          // 旋转的弧线段
          for (let i = 0; i < 4; i++) {
            let startA = frameCount * 0.02 + (i / 4) * Math.PI * 2;
            let endA = startA + Math.PI / 3;
            arc(0, 0, rotR * 2, rotR * 2, startA, endA);
          }
        }
        pop();
      });
    }
    // 区域标签（罗马数字列最上方）—— 艺术化大字 + 副标题
    //   删除"第N区域："前缀，仅保留区域名；移动至左侧罗马数字列顶部，与层级视觉系统对齐
    let regionBig = gs.currentRegion === 0 ? '腐朽密林' : '虚空深渊';
    // 取最后一层（Boss 层）罗马数字 Y 作为"顶部基准"，区域名置于其上方（与层级同 X 基线 LEFT 对齐）
    let lastLayer = this.mapConfig.layers[this.mapConfig.layers.length - 1];
    let bossLayerY = lastLayer.nodes[0].y * GAME_H;
    let regionTopY = bossLayerY - 50; // Boss 层罗马数字上方预留 50px 艺术区
    noStroke();
    // 主标题大字（24pt BOLD，亮金色，接地阴影同开始页 ABYSSUS 风格）
    //   伪 3D 微缩：2 层偏移堆叠 + 顶层核心高亮
    cFill('bg', 200);
    textSize(24);
    textStyle(BOLD);
    text(regionBig, 70, regionTopY + 22);
    cFill('goldDim');
    textSize(24);
    text(regionBig, 69, regionTopY + 21);
    cFill('goldBright');
    textSize(24);
    text(regionBig, 68, regionTopY + 20);
    textStyle(NORMAL);
    // 步骤 3：艺术分割线（罗马数字列同款 goldDim stroke 短横线装饰，接罗马数字层级分割线的视觉链）
    cStroke('goldDim', 60);
    strokeWeight(1);
    line(90, regionTopY + 48, 150, regionTopY + 48);
    noStroke();
    // PHASE 3 无尽回响：仅回响层显示「深度 N · 回响 X」。
    //   主线刻意不显示 —— 老玩家的界面一个像素都不变，进入回响才多出这一行。
    if (typeof echoTierNow === 'function' && echoTierNow() > 0) {
      push();
      noStroke();
      textAlign(LEFT, CENTER);
      textStyle(NORMAL);
      cFill('purpleBright', 225);
      textSize(11);
      text(echoDepthLabel(), 68, regionTopY + 38);
      pop();
    }
    // 层标签
    // 层级文本：罗马数字
    cFill('gold');
    textAlign(LEFT, CENTER);
    textSize(24);
    noStroke();
    for (let li = 0; li < this.mapConfig.layers.length; li++) {
      let y = this.mapConfig.layers[li].nodes[0].y * GAME_H;
      let label = toRoman(li + 1);  // 1 → I, 2 → II, ..., 7 → VII
      text(label, 20, y);
      cStroke('goldDim', 40);
      strokeWeight(1);
      line(90, y, 120, y);
      noStroke();
    }
    // 玩家信息
    this.drawPlayerInfo();
    // 区域过渡叙事覆盖层（T235：新局迎接 intro 遮罩也走这里，见 drawRegionTransition 分派）
    if (gs.regionTransition && gs.regionTransition.active) {
      this.drawRegionTransition();
    }
    super.draw();
  }
  // 绘制区域过渡叙事覆盖层
  drawRegionTransition() {
    let rt = gs.regionTransition;
    // 倒计时
    rt.timer--;
    if (rt.timer <= 0) { gs.regionTransition = null; return; }
    // 淡入淡出 alpha
    let alpha = 255;
    if (rt.timer > 200) alpha = (240 - rt.timer) * 12; // 前40帧淡入
    else if (rt.timer < 60) alpha = rt.timer * 4.25;    // 后60帧淡出
    alpha = clamp(alpha, 0, 255);
    // T236：灰烬风遮罩仅用于新局开场（标题页→第一张地图，rt.intro）；
    //   intro=true 用默认灰烬诗；intro=[两句] 为回归玩家「第 N 次」。
    //   REGIO I→II（rt.region===1，击败首区 Boss / 无尽回响再经 region 1）恢复 T234 之前的原始三句与白字样式，见下。
    if (rt.intro) { this.drawAshCrossover(alpha, rt.intro); return; }
    // 黑色半透明背景
    noStroke();
    fill(0, 0, 0, alpha * 0.7);
    rect(0, 0, GAME_W, GAME_H);
    // 叙事文本（T236 恢复原始文案：region 1 三句，其余区域通用两句）
    let texts = rt.region === 1
      ? ['深渊手稿的低语渐沉...', '你踏入虚空深渊的边界。', '此地不再有光，唯有真名回响。']
      : ['未知领域...', '新的征途开始。'];
    cFill('text', alpha);
    textAlign(CENTER, CENTER);
    textSize(22);
    textStyle(BOLD);
    noStroke();
    for (let i = 0; i < texts.length; i++) {
      text(texts[i], GAME_W / 2, GAME_H / 2 - 40 + i * 36);
    }
    textStyle(NORMAL);
  }
  // T234/T235/T236 · 主题「飘」：灰烬风全屏叙事遮罩（T236 起仅新局开场 intro 使用）。
  //   复用 drawRegionTransition 的倒计时/alpha 包络（前40帧淡入、末60帧淡出）与同一绘制层位
  //   （地图与玩家信息之后、super.draw 之前 → 层级契约不动，交互屏蔽沿用既有路径）。
  //   intro 形参：true（首局开场）→ 默认灰烬诗两句；
  //               [上句, 下句]（回归玩家）→ 「你又一次飘了回来，/这是第 N 次坠向同一卷书页」。
  //   上句 gold 叙事，下句 goldBright 轻提；金辉光透明度随包络缩放，淡出时不留硬光晕。
  drawAshCrossover(alpha, intro) {
    const _l1 = Array.isArray(intro) ? intro[0] : '边缘燃烧炼成的第一捧灰烬撒入深渊，';
    const _l2 = Array.isArray(intro) ? intro[1] : '你纵身飘入书页间逸散的第一缕未知';
    noStroke();
    fill(0, 0, 0, alpha * 0.7);
    rect(0, 0, GAME_W, GAME_H);
    push();
    textAlign(CENTER, CENTER);
    textStyle(BOLD);
    textSize(24);
    const _ctx = drawingContext;
    _ctx.save();
    _ctx.shadowColor = 'rgba(201,168,76,' + (alpha / 255 * 0.75).toFixed(3) + ')';
    _ctx.shadowBlur = 12;
    cFill('gold', alpha);
    text(_l1, GAME_W / 2, GAME_H / 2 - 26);
    cFill('goldBright', alpha);
    text(_l2, GAME_W / 2, GAME_H / 2 + 22);
    _ctx.restore();
    // 底饰：暗金小纹，存在感压到最低（不抢诗句）
    textStyle(NORMAL);
    textSize(11);
    cFill('goldDim', Math.floor(alpha * 0.8));
    text('— ✦ —', GAME_W / 2, GAME_H / 2 + 66);
    pop();
  }
  drawPlayerInfo() {
    // 右上角状态栏
    const PI_X = GAME_W - 160;  // PlayerInfo 区域起点 X
    const PI_Y = 22;            // 顶部 Y（避开顶部电影黑边）
    const PI_W = 150;           // 区域宽度

    // HP 血条
    const HP_BAR_H = 20;
    cFill('panel');
    cStroke('panelEdge');
    strokeWeight(1);
    rect(PI_X, PI_Y, PI_W, HP_BAR_H, 4);
    const hpFillW = (gs.hp / gs.maxHp) * (PI_W - 4);
    cFill('red');
    noStroke();
    rect(PI_X + 2, PI_Y + 2, hpFillW, HP_BAR_H - 4, 3);
    cFill('white');
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(11);
    textStyle(BOLD);
    text(`${gs.hp}/${gs.maxHp}`, PI_X + PI_W * 0.5, PI_Y + HP_BAR_H * 0.5);
    textStyle(NORMAL);

    // Gold 行：菱形 icon + 数字
    const GOLD_Y = PI_Y + HP_BAR_H + 6;   // 36
    const G_CX   = PI_X + 9;
    const G_CY   = GOLD_Y + 9;
    cFill('gold');
    noStroke();
    beginShape();
    vertex(G_CX,       G_CY - 7);  // 顶
    vertex(G_CX + 5,   G_CY);      // 右
    vertex(G_CX,       G_CY + 7);  // 底
    vertex(G_CX - 5,   G_CY);      // 左
    endShape(CLOSE);
    // 十字高光（极简）
    cFill('goldBright');
    rect(G_CX - 0.5, G_CY - 4, 1, 8);
    rect(G_CX - 4,   G_CY - 0.5, 8, 1);
    // 数字（金色，与 icon 配色统一）
    cFill('gold');
    noStroke();
    textAlign(LEFT, CENTER);
    textSize(13);
    text(`× ${gs.gold}`, PI_X + 22, GOLD_Y + 9);

    // Deck 行：堆叠矩形 icon + 数字
    const DECK_Y = GOLD_Y + 20;   // 56
    const D_CX   = PI_X + 9;
    const D_CY   = DECK_Y + 9;
    // 底卡
    cFill('textDim');
    noStroke();
    rect(D_CX - 4, D_CY - 3, 10, 14, 1.5);
    // 顶卡
    cFill('text');
    rect(D_CX - 6, D_CY - 5, 10, 14, 1.5);
    // 数字
    cFill('text');
    noStroke();
    textAlign(LEFT, CENTER);
    textSize(13);
    text(`× ${gs.deck.length} `, PI_X + 22, DECK_Y + 11);
  }
  findNode(id) {
    for (let layer of this.mapConfig.layers) {
      for (let node of layer.nodes) {
        if (node.id === id) return node;
      }
    }
    return null;
  }
  mousePressed() {
    if (this.hoveredNode) {
      let node = this.hoveredNode;
      // T252：战斗类节点——在提交节点状态**之前**同步落一份「进入前安全快照」。
      //   此刻 gs.scene 仍为 'map'，mapPath/currentNodeId/currentLayer 全部是进入前态；
      //   进入战斗后一切 autoSave 都被 saveCurrent 拒存，因此战斗中退出重进读到的就是
      //   「节点未进入」状态：本节点仍可点、重打该场，不会逃课，boss 也不会死锁。
      //   不 await：_set() 的 localStorage 保底写位于首个 await 之前，调用即同步落盘；云端分片异步追赶。
      if (node.type === 'battle' || node.type === 'elite' || node.type === 'boss') {
        try { if (typeof saveManager !== 'undefined' && saveManager) saveManager.saveCurrent(); } catch (e) { /* 快照失败不阻断游戏 */ }
      }
      gs.mapPath.push(node.id);
      gs.currentNodeId = node.id;
      // 进入对应场景
      switch (node.type) {
        case 'battle': gs.scene = 'battle'; gs.combatState = null; break;
        case 'elite': gs.scene = 'battle'; gs.combatState = null; break;
        case 'boss': gs.scene = 'battle'; gs.combatState = null; break;
        case 'shop': gs.scene = 'shop'; break;
        case 'event': gs.scene = 'event'; break;
        case 'rest': gs.scene = 'rest'; break;
        case 'treasure': gs.scene = 'treasure'; break;
        case 'artisan': gs.scene = 'artisan'; break;       // 工匠铺独立场景
        case 'relic_swap': gs.scene = 'event'; break;   // 遗物交换复用事件场景
        default: gs.scene = 'battle'; gs.combatState = null; break;
      }
      // 只有非Boss节点且不在最后一层时才前进层级
      if (node.type !== 'boss' && gs.currentLayer < this.mapConfig.layers.length - 1) {
        gs.currentLayer++;
      }
      // PHASE 3：每前进一步刷新本局最深纪录（结算页与存档列表展示用）
      echoMarkDepth();
    }
  }
}

// ==================== 战斗场景 ====================
// ==================== T244：最后一回合的战报 ====================
//   上一版把战报放在 VictoryScene / DefeatScene —— 但那已经是"结局页"了，玩家看到数据时
//   过程早被顶掉，而且只有通关/陨落两条路才会走到。真正的答案是：**最后一个回合打完的那一刻**
//   就在战斗现场浮出战报：战斗画面压暗退后，战报浮在中央，看够了点一下进奖励。
const RUN_RECAP_STYLE = {
  w: 540, h: 306,
  fadeIn: 18,    // 面板浮入帧数（0.3s，短动画用帧即可）
  rollMs: 1250,  // 数字滚动时长（ms）—— 比面板慢，让"数数"成为独立于浮入的第二拍
                 //   停留整体拉长后，滚动也放缓一点，读数的节奏才不会显得"急躁"。
  holdMs: 4700,  // 总停留时长（ms）后自动进奖励；期间点击任意处可提前收起。
                 //   ⚠️ 刻意用**真实时间**而非帧数：低帧率机器上 170 帧会变成 4.7s，
                 //   停留时长属于 UX 承诺，不该被帧率左右。
                 //   节奏账：浮入 0.3s → 滚动读完 1.25s → 余下约 3.4s 让玩家把六项数据
                 //   和判词真正"读完两遍"。嫌慢随时点一下面板即可跳过（这条出口没动）。
  colA: 0.28, colB: 0.73,   // 两列数据的横向比例位置
};

// 本场增量：出牌 / 承伤的"这场打了多少"。用**开局快照**做差，不额外新增采集点 ——
//   累计量已在 runStats 里，减一下就行（零维护成本，也不会与既有埋点打架）。
function recapBattleDelta() {
  const s = (typeof gs !== 'undefined' && gs && gs.runStats) ? gs.runStats : null;
  if (!s) return { cards: 0, taken: 0, turns: 0 };
  return {
    cards: Math.max(0, (s.cardsPlayed  || 0) - (s._cardsAt || 0)),
    taken: Math.max(0, (s.damageTaken  || 0) - (s._takenAt || 0)),
    turns: (gs.turnNumber || 0) + 1,
  };
}

class BattleScene extends Scene {
  enter() {
    super.enter();
    audio.playBattleBGM();
    this.initCombat();
    this.cardAnimations = [];
    // T194：奖励页面卡牌动画状态（hover 阻尼/3D 倾斜/drift 等），与 drawCardGridCommon 同套模式
    this.rewardCardStates = {};
    this.enemyAnim = { shakeX: 0, shakeY: 0, scale: 1, flashAlpha: 0, hitDeform: 0, deathProgress: 0, defendAnim: 0, blockHitFlash: 0, shieldShatter: 0, defendPulse: 0 };
    this.intentAnimY = null; // 意图栏位 Y 缓动值（dampApproach 驱动，有异常上移/无异常下移）
    this.playerAnim = { shakeX: 0, shakeY: 0, flashAlpha: 0, breathPhase: 0, attackAnim: 0, defendAnim: 0, blockHitFlash: 0, shieldShatter: 0, defendPulse: 0 };
    this.hoveredCard = null;
    this.selectedCard = null;
    this.hoveredEnemy = null; // T208：敌人悬停状态（null 表示无悬停）
    this.enemyIntent = null;
    // 连击数字 pop 动效状态
    this.lastComboCount = 0;
    this.comboPopStart  = 0;
    this.generateEnemyIntent();
    // T244：战报浮层状态 —— 每场战斗重新计，绝不跨场残留
    this.showRunRecap = false;
    this.runRecapT = 0;
    this._recapAt = 0;
    this._rewardReady = false;
    this.bgGlyphs = [];
    for (let i = 0; i < 15; i++) {
      this.bgGlyphs.push({ x: rand(0, GAME_W), y: rand(0, GAME_H), vx: rand(-0.15, 0.15), vy: rand(-0.3, -0.05), glyph: pick(['☿','♁','⚗','⛤','✠','✦','◈','●']), size: rand(8, 20), alpha: rand(10, 30) });
    }
    // 视差背景层初始化
    this.bgLayers = [];
    // Layer 0: 森林&星空层（depth 0.02）
    // 层级架构：forestSky(0) → arch(1) → ground(2) → crack(3) → pillar(4) → fog(5) → glyph(6) — 共 7 层
    // 4 类子元素：stars（星空）+ forest（森林剪影 3 层纵深）+ giantRune（巨型符文，移自 arch）+ runeStrip（顶部符文饰带，移自 crack）
    // 星空：60 颗星分布于画面上 60%（避开森林），含闪烁/光晕/十字光芒
    // 森林：3 层纵深（远/中/近），统一深紫色调，noise 控制树高，不遮挡过多星空
    // 巨型符文：呼吸圆形光晕（5 层同心圆）+ 细线条（0.5-0.7px），参考 hangCharm 风格
    // 符文饰带：与巨符文同色系金
    let forestSkyData = [];
    // 1) 星空：60 颗星，y 范围 [0, GAME_H*0.62]（不与森林重叠）
    //    亮度 0.6-1.0、尺寸 1-2.8、闪烁频率 0.02-0.07、异步相位
    for (let i = 0; i < 60; i++) {
      forestSkyData.push({
        kind: 'star',
        x: noise(i * 13.7) * GAME_W,
        y: noise(i * 7.3 + 100) * GAME_H * 0.62,
        size: 1 + noise(i * 3.1 + 200) * 1.8,
        brightness: 0.6 + noise(i * 5.9 + 300) * 0.4,
        twinkleSpeed: 0.02 + noise(i * 11.1 + 400) * 0.05,
        twinklePhase: i * 0.7,
        noiseSeed: i,
      });
    }
    // 2) 森林剪影：3 层纵深，统一深紫色调
    //    远景（最矮最亮，y=0.78）、中景（中高中亮，y=0.72）、前景（最高最暗，y=0.68）
    forestSkyData.push({
      kind: 'forest', y: GAME_H * 0.80, height: GAME_H * 0.22,
      fillRGB: [40, 28, 58], alpha: 200, noiseSeed: 100,
    });
    forestSkyData.push({
      kind: 'forest', y: GAME_H * 0.74, height: GAME_H * 0.30,
      fillRGB: [26, 16, 44], alpha: 225, noiseSeed: 200,
    });
    forestSkyData.push({
      kind: 'forest', y: GAME_H * 0.70, height: GAME_H * 0.38,
      fillRGB: [16, 8, 28], alpha: 245, noiseSeed: 300,
    });
    // 巨型符文
    // 呼吸圆形光晕（5 层同心圆）+ 细线条（0.5-0.7px）
    forestSkyData.push({
      kind: 'giantRune', x: GAME_W * 0.40, y: GAME_H * 0.28,
      w: 170, h: 230, lean: -0.15, alpha: 200, fillRGB: [220, 180, 100], noiseSeed: 333,
    });
    forestSkyData.push({
      kind: 'giantRune', x: GAME_W * 0.72, y: GAME_H * 0.32,
      w: 200, h: 280, lean: 0.18, alpha: 180, fillRGB: [220, 180, 100], noiseSeed: 444,
    });
    // 顶部符文饰带
    forestSkyData.push({
      kind: 'runeStrip', x: 50, y: 30, symbols: '☿♁⚗⛤✠', angle: 0.1,
    });
    forestSkyData.push({
      kind: 'runeStrip', x: GAME_W - 50, y: 30, symbols: '✦◈●✠⛤', angle: -0.1,
    });
    this.bgLayers.push({ depth: 0.02, offsetX: 0, offsetY: 0, targetOffsetX: 0, targetOffsetY: 0, type: 'forestSky', elements: forestSkyData });

    // Layer 1: 远景圣殿群（depth 0.05）
    // 圣殿层几乎不透明：所有塔楼 alpha 240-255
    // 渲染顺序：5 塔楼（无前置元素遮挡 → 完整可见）
    let archData = [];
    // 5 座塔楼
    // 景深逻辑：近大远小（width/height）、近清晰远朦胧（alpha 240→250）、近暗远亮或反之
    // 倾斜角差异化：-0.05 / 0.04 / -0.03 / 0.05 / -0.04，模拟建筑老化/视角偏差
    let towerConfigs = [
      // 塔 1：左边缘，中等大小，左倾
      {x: -0.05, w: 60, h: 0.58, lean: -0.05, alpha: 250, fillRGB: [26, 10, 42]},
      // 塔 2：左中，最小，右倾（远景，alpha 较低）
      {x: 0.18, w: 48, h: 0.42, lean:  0.04, alpha: 235, fillRGB: [20, 8, 35]},
      // 塔 3：中偏左，大，左倾
      {x: 0.34, w: 72, h: 0.68, lean: -0.03, alpha: 250, fillRGB: [26, 10, 42]},
      // 塔 5：中偏右，中大，右倾
      {x: 0.60, w: 55, h: 0.52, lean:  0.05, alpha: 240, fillRGB: [22, 9, 38]},
      // 塔 6：右边缘，最大，左倾
      {x: 0.80, w: 65, h: 0.74, lean: -0.04, alpha: 250, fillRGB: [26, 10, 42]},
    ];
    for (let i = 0; i < towerConfigs.length; i++) {
      let cfg = towerConfigs[i];
      archData.push({
        kind: 'tower', x: GAME_W * cfg.x, baseY: GAME_H * 0.78,
        w: cfg.w, h: GAME_H * cfg.h,
        lean: cfg.lean, alpha: cfg.alpha, fillRGB: cfg.fillRGB,
        noiseSeed: i * 13,
      });
    }
    // 1 座残破塔楼（中偏右，最高最不透明，作为"主塔"）
    archData.push({
      kind: 'tower', x: GAME_W * 0.46, baseY: GAME_H * 0.78,
      w: 60, h: GAME_H * 0.74, lean: 0.02, alpha: 255, fillRGB: [24, 10, 40],
      noiseSeed: 99,
    });
    this.bgLayers.push({ depth: 0.05, offsetX: 0, offsetY: 0, targetOffsetX: 0, targetOffsetY: 0, type: 'arch', elements: archData });

    // Layer 2: 地面弧形层（depth 0.08）
    // 层级：可被 pillar 遮挡（pillar 之后绘制） + 可遮挡 arch 底部（arch 之后绘制）
    // 形状：6 个不同大小的椭圆拼接（顶部为"地平线"曲线，底部超出画面）
    // 配色：1-2 种相近色（深紫 75,55,95 主色 + 暗紫 58,42,78 阴影色），贴合哥特怪诞艺术风格
    // 视觉：每弧顶部高光细线（亮一档） + 主色主体填充（不透明）
    // 暗紫阴影斑块
    //   - 每椭圆 2-3 处暗紫阴影斑（位于上半部可见区域）
    //   - 2 层结构：主色 28,18,38 + 内层高光 50,35,60（参考石柱 12,6,18 / 28,18,34，色调偏柔以匹配地面中调）
    //   - 尺寸比石柱凹陷大（地面半径 300-380 vs 石柱宽 60-75），斑块 16-24 适配
    let groundData = [];
    let groundConfigs = [
      // 弧 1：左边缘，主色，最大
      { x: 0.06, y: GAME_H + 30, rx: 350, ry: 290, fillRGB: [75, 55, 95], alpha: 255, highlight: true },
      // 弧 2：左中，阴影色，中
      { x: 0.22, y: GAME_H + 50, rx: 300, ry: 240, fillRGB: [58, 42, 78], alpha: 250, highlight: false },
      // 弧 3：中偏左，主色，最大
      { x: 0.40, y: GAME_H + 20, rx: 380, ry: 320, fillRGB: [75, 55, 95], alpha: 255, highlight: true },
      // 弧 4：中偏右，阴影色，中大
      { x: 0.58, y: GAME_H + 40, rx: 320, ry: 270, fillRGB: [58, 42, 78], alpha: 250, highlight: false },
      // 弧 5：右中，主色，大
      { x: 0.75, y: GAME_H + 30, rx: 360, ry: 300, fillRGB: [75, 55, 95], alpha: 255, highlight: true },
      // 弧 6：右边缘，阴影色，中
      { x: 0.92, y: GAME_H + 25, rx: 300, ry: 260, fillRGB: [58, 42, 78], alpha: 250, highlight: false },
    ];
    // 每椭圆暗紫阴影斑块配置（2-3 处/椭圆，theta 单位为弧度）
    // theta 范围 PI+0.4 ~ 2*PI-0.3（椭圆上半部可见区域）
    // ratio 范围 0.28-0.42（占椭圆半径的比例，确保斑块完全在椭圆内）
    // size 为 [width, height]，适配椭圆尺寸差异化
    let groundSpotsConfigs = [
      // 椭圆 0（主色，最大）：3 处斑块
      [
        { theta: PI + 0.45, ratio: 0.32, size: [20, 16] },
        { theta: PI + 1.20, ratio: 0.40, size: [22, 17] },
        { theta: PI + 1.85, ratio: 0.30, size: [18, 14] },
      ],
      // 椭圆 1（阴影色，中）：2 处斑块
      [
        { theta: PI + 0.65, ratio: 0.35, size: [16, 13] },
        { theta: PI + 1.55, ratio: 0.28, size: [18, 14] },
      ],
      // 椭圆 2（主色，最大）：3 处斑块
      [
        { theta: PI + 0.40, ratio: 0.30, size: [22, 17] },
        { theta: PI + 1.10, ratio: 0.42, size: [24, 19] },
        { theta: PI + 1.80, ratio: 0.32, size: [20, 16] },
      ],
      // 椭圆 3（阴影色，中大）：2 处斑块
      [
        { theta: PI + 0.75, ratio: 0.30, size: [18, 14] },
        { theta: PI + 1.60, ratio: 0.36, size: [20, 16] },
      ],
      // 椭圆 4（主色，大）：3 处斑块
      [
        { theta: PI + 0.50, ratio: 0.33, size: [21, 16] },
        { theta: PI + 1.30, ratio: 0.40, size: [23, 18] },
        { theta: PI + 1.95, ratio: 0.28, size: [17, 13] },
      ],
      // 椭圆 5（阴影色，中）：2 处斑块
      [
        { theta: PI + 0.70, ratio: 0.32, size: [17, 13] },
        { theta: PI + 1.50, ratio: 0.30, size: [19, 15] },
      ],
    ];
    for (let i = 0; i < groundConfigs.length; i++) {
      let cfg = groundConfigs[i];
      groundData.push({
        kind: 'ground',
        x: cfg.x * GAME_W,
        y: cfg.y,
        rx: cfg.rx,
        ry: cfg.ry,
        fillRGB: cfg.fillRGB,
        alpha: cfg.alpha,
        highlight: cfg.highlight,
        spots: groundSpotsConfigs[i] || [],  // 暗紫阴影斑块
      });
    }
    this.bgLayers.push({ depth: 0.08, offsetX: 0, offsetY: 0, targetOffsetX: 0, targetOffsetY: 0, type: 'ground', elements: groundData });

    // Layer 3: 裂纹 + 悬挂物（depth 0.4）
    // 渲染顺序：forestSky(0) → arch(1) → ground(2) → crack(3) → pillar(4) → fog(5) → glyph(6)
    // hangCharm：摆动线长度差异化、起点画面外、摆动异步、幅度差异化
    let crackData = [];
    // 5 个顶部悬挂坠饰
    // yStart: 摆动线起点 y 坐标（负值=画面外顶部）
    // lineLen: 摆动线长度（差异化 200-380px）
    // swingFreq: 摆动频率（差异化 0.018-0.040）
    // swingPhase: 摆动初始相位（异步 0-2π）
    // swingAmp: 摆动幅度（差异化 4-10px）
    // charmSize: 24-40
    // glyphSize: 12-18
    // glowAlpha: 100-140
    for (let i = 0; i < 5; i++) {
      crackData.push({
        kind: 'hangCharm', x: 200 + i * 220, y: 0, idx: i,
        yStart: -180 - i * 40,                       // 起点 y=-180~−340（更深画面外）
        lineLen: 200 + (i * 45) % 180,               // 长度 200-380（差异化）
        swingFreq: 0.022 + (i * 0.0043) % 0.018,     // 频率 0.022-0.040（差异化）
        swingPhase: i * 1.27,                          // 异步相位 0/1.27/2.54/3.81/5.08
        swingAmp: 4 + (i * 1.4) % 6,                  // 幅度 4-10（差异化）
        charmSize: 24 + (i * 3.8) % 16,               // 圆坠 24-40
        glyphSize: 12 + (i * 1.5) % 6,                // 符文 12-18
        glowAlpha: 100 + (i * 9) % 40,                // 光晕 100-140
      });
    }
    this.bgLayers.push({ depth: 0.4, offsetX: 0, offsetY: 0, targetOffsetX: 0, targetOffsetY: 0, type: 'crack', elements: crackData });

    // Layer 4: 中景石柱群（depth 0.15）
    let pillarData = [];
    // 4 根纵向延伸石柱：y=GAME_H+60, h=GAME_H*1.25 → 顶 y=-GAME_H*0.25, 底 y=GAME_H+60（均超出画面）
    // 柱间距自检（GAME_W=1280）：1→2 gap=212px / 2→3 gap=342px / 3→4 gap=242px → 充裕不重叠，背景层可见
    let pillarConfigs = [
      {x: 0.08, w: 75, tilt: -0.08, glyph: '☿'},
      {x: 0.30, w: 65, tilt:  0.10, glyph: '♁'},
      {x: 0.62, w: 70, tilt: -0.05, glyph: '⚗'},
      {x: 0.86, w: 60, tilt:  0.12, glyph: '⛤'},
    ];
    for (let i = 0; i < pillarConfigs.length; i++) {
      let cfg = pillarConfigs[i];
      pillarData.push({
        kind: 'pillar', x: GAME_W * cfg.x, y: GAME_H + 60,
        w: cfg.w, h: GAME_H * 1.25,
        tilt: cfg.tilt, breakLevel: 0.42, // 保留字段
        glyph: cfg.glyph, noiseSeed: i * 7,
      });
    }
    // 1 个倾斜拱门（拉长跨越整个画面）
    pillarData.push({
      kind: 'archway', x: GAME_W * 0.50, y: GAME_H + 30,
      w: 160, h: GAME_H * 1.15, tilt: -0.06, alpha: 200, noiseSeed: 555,
    });
    this.bgLayers.push({ depth: 0.15, offsetX: 0, offsetY: 0, targetOffsetX: 0, targetOffsetY: 0, type: 'pillar', elements: pillarData });

    // ---------- Layer 2: 雾气 + 克苏鲁眼睛（4 雾团 + 3 隐藏眼睛）----------
    let fogData = [];
    let fogConfigs = [
      {x: 0.15, y: 0.40, w: 350, h: 180, a: 12, cr: 90,  cg: 42,  cb: 122},
      {x: 0.40, y: 0.30, w: 280, h: 160, a: 10, cr: 90,  cg: 42,  cb: 122},
      {x: 0.65, y: 0.45, w: 320, h: 180, a: 11, cr: 48,  cg: 64,  cb: 160},
      {x: 0.88, y: 0.32, w: 300, h: 170, a: 10, cr: 90,  cg: 42,  cb: 122},
    ];
    for (let i = 0; i < fogConfigs.length; i++) {
      let cfg = fogConfigs[i];
      fogData.push({
        kind: 'fog',
        baseX: GAME_W * cfg.x, baseY: GAME_H * cfg.y,
        w: cfg.w, h: cfg.h, alpha: cfg.a,
        cr: cfg.cr, cg: cfg.cg, cb: cfg.cb,
        speed: 0.15 + i * 0.05, phase: i * 1.7,
      });
    }
    // 3 只克苏鲁眼睛（雾中窥视）
    let eyeConfigs = [
      {x: 0.22, y: 0.32, s: 24},
      {x: 0.55, y: 0.40, s: 18},
      {x: 0.78, y: 0.28, s: 14},
    ];
    for (let i = 0; i < eyeConfigs.length; i++) {
      let cfg = eyeConfigs[i];
      fogData.push({
        kind: 'eye', x: GAME_W * cfg.x, y: GAME_H * cfg.y, size: cfg.s,
        noiseSeed: 800 + i,
      });
    }
    this.bgLayers.push({ depth: 0.25, offsetX: 0, offsetY: 0, targetOffsetX: 0, targetOffsetY: 0, type: 'fog', elements: fogData });

    // ---------- Layer 3: 浮动符文层（光晕版，复用 bgGlyphs）----------
    this.bgLayers.push({ depth: 0.35, offsetX: 0, offsetY: 0, targetOffsetX: 0, targetOffsetY: 0, type: 'glyph', elements: [] });

    floatingTexts.clear();
    particles.clear();
    this.turnStartDelay = 30;
    this.enemyTurnDelay = 0;
    this.enemyActionQueue = [];
    this.battleEnding = false;
    this.battleResult = null;
    this._battleEnded = false; // 重置幂等标志，供下一场战斗使用
    this._battleEndHandled = false; // 重置 onBattleEnd 幂等标志
    this.statusIconHits = []; // 状态图标命中区域（每帧重置）
    this.handCardStates = {}; // 手牌动画状态表：key=card.id+实例身份(n数字uid/r字符串_uid，T251)
    this.deckCardStates = {}; // 牌库动画状态表（复用手牌结构与同款 key，战斗内副本）
  }
  initCombat() {
    let node = this.findCurrentNode();
    let enemyId = this.selectEnemy(node);
    let enemyData = ENEMY_DATA[enemyId];
    // 难度缩放：按当前档位生成敌人数值副本（原型 ENEMY_DATA 不被污染；战斗中切档不影响本场）
    let scaledEnemy = applyDifficultyToEnemy(enemyData);
    // PHASE 0 · 无尽回响：变体词条叠加（纯确定性组合，零 AI 费用）
    //   放在难度缩放之后 —— 先按档位定基准值，再由词缀做相对修饰，保证难度语义不被破坏。
    const variantAffixes = planVariant(scaledEnemy, node);
    if (variantAffixes) {
      scaledEnemy = applyVariantToEnemy(scaledEnemy, variantAffixes);
      // PHASE 1：记入图鉴（跨局持久）。返回 true = 跨局首次发现。
      //   基底 id 取变体元数据里的 baseId（applyVariantToEnemy 写入），拿不到就退回 enemyId。
      const _vbase = (scaledEnemy._variant && scaledEnemy._variant.baseId) || enemyId;
      const _vkey = variantAffixes.slice().sort().join('+');
      const _codexNew = codexRecord(_vbase, _vkey, scaledEnemy.name, abyssDepth());
      // PHASE 4：世界记忆 —— 累计"这个组合被遭遇过几次"，是「它认得你」叙事的依据。
      //   注意这是**事实账本**（次数），不是 AI 生成的内容，永远确定、可审计。
      memoryRecord('seen:' + _vkey, 1);
      logSdk('info', 'variant:spawn', {
        enemy: enemyId, affixes: _vkey, count: variantAffixes.length,
        depth: abyssDepth(), layer: gs.currentLayer || 0, region: gs.currentRegion,
        firstSeen: !!VARIANT_SYS._lastWasNew, codexNew: !!_codexNew,
        codexTotal: CODEX_SYS._total,
      });
      // PHASE 2：把还没被 AI 命过名的组合推进命名队列（攒够 batch 才真正发起一次调用）。
      //   这里不入列"已有真名"的组合 —— 那正是图鉴缓存省下的那一次费用。
      if (!namerLookup(_vbase, _vkey)) {
        namerEnqueue(
          _vbase, _vkey,
          (scaledEnemy._variant && scaledEnemy._variant.tags || []).join('·'),
          scaledEnemy._variant ? scaledEnemy._variant.baseName : scaledEnemy.name,
          abyssDepth()
        );
      }
      // 让玩家「看见」无限：仅在本局**初见**该组合时给一条提示。
      //   变体率已提到 55%+，若每场都飘就成噪音了；只在"没见过"时提示，
      //   玩家的感受才会是「又是新东西」，而不是「又来」。
      if (VARIANT_SYS._lastWasNew) {
        try {
          if (typeof floatingTexts !== 'undefined' && floatingTexts) {
            const tags = (scaledEnemy._variant && scaledEnemy._variant.tags || []).join('·');
            // 跨局首见 → 带上图鉴编号（"第 N 号造物"），把"无限"变成可数的进度；
            // 只是本局初见、图鉴里已有 → 沿用「初见」措辞，不制造虚假进度。
            const label = _codexNew
              ? ('◈ 图鉴 #' + CODEX_SYS._total + ' · ' + tags)
              : ('◈ 初见 · ' + tags);
            floatingTexts.add(GAME_W / 2, GAME_H * 0.24, label, COLORS.goldBright, 14);
          }
        } catch (e) { /* 提示失败绝不影响战斗 */ }
      }
    }
    // 回合计数重置：每次新战斗从回合 1 开始（显示用 turnNumber+1）
    gs.turnNumber = 0;
    // T242：战报 · 场数 + 造物名。失败时这一行就是"终结你的是谁"。
    try {
      if (gs.runStats) {
        gs.runStats.battles++;
        gs.runStats.lastEnemy = String(scaledEnemy.name || '');
        // T244：本场起点快照 —— 战报里的"本场出牌/本场承伤"靠它做差
        gs.runStats._cardsAt = gs.runStats.cardsPlayed || 0;
        gs.runStats._takenAt = gs.runStats.damageTaken || 0;
      }
    } catch (e) {}
    gs.combatState = {
      enemyId: enemyId,
      enemyData: scaledEnemy,
      enemyHp: scaledEnemy.maxHp,
      enemyBlock: 0,
      enemyMaxHp: scaledEnemy.maxHp,
      enemyStatuses: {}, // { burn: stacks, freeze: stacks, corrode: stacks, vulnerable: stacks, weak: stacks }
      enemyStunStacks: 0,
      playerBlock: 0,
      ap: gs.getMaxAp(),
      maxAp: gs.getMaxAp(),
      comboCount: 0,
      comboWindow: 4, // 先攻牌自身消耗1后剩3张，符合"启动3张连击窗口"文本
      lastPlayedKeyword: null,
      cardsPlayedThisTurn: [],
      drawPile: shuffle([...gs.deck]),
      hand: [],
      discardPile: [],
      exhaustPile: [],
      turnPhase: 'player', // 'player' | 'enemy' | 'animating'
      enemyFirstAttackHalved: gs.hasRelic('void_mask'),
      enemyPreDmg: gs.hasRelic('philosopher_stone') ? 10 : 0,
      bossPhase2: false,
      enemyIntentIndex: 0,
      playerStatuses: {},
      _enemyStrength: 0, // 敌人力量增益累计层数（供状态栏显示）
      _read: { turns: 0, blockTurns: 0, burstTurns: 0, comboPeak: 0, lastBlock: 0, lastCombo: 0 }, // PHASE 1a：玩家行为侧写（读牌）
      _intentHistory: [], // PHASE 1a：近期意图历史（重复抑制，避免被背板）
    };
    // PHASE 0 · 无尽回响：变体词条的开局状态注入（如「剧毒」开场上腐蚀）
    //   只改战斗状态初值，不触碰任何结算逻辑；失败也不影响战斗进行。
    applyVariantOpening(gs.combatState, scaledEnemy);
    // 遗物效果 - 战斗开始
    gs.relics.forEach(r => { if (r.onCombatStart) r.onCombatStart(gs); });
    // 先攻之印
    if (gs.hasRelic('first_strike_charm')) {
      gs.combatState.cardsPlayedThisTurn = []; // 让所有卡都有先攻效果
    }
    // 贤者之石
    if (gs.combatState.enemyPreDmg > 0) {
      gs.combatState.enemyHp -= gs.combatState.enemyPreDmg;
      floatingTexts.add(GAME_W * 0.65, GAME_H * 0.35, '-' + gs.combatState.enemyPreDmg, COLORS.orange);
    }
    // 洗牌并抽牌（起手张数随难度：低语 6 / 回响·深渊 5 / 湮灭 4）
    this.drawCards(getDifficulty().drawPerTurn);
    // —— AI 接入点：深渊战术 + 深渊低语 ——
    // 只在精英 / 首领战触发，普通杂兵不消耗调用（兼顾玩家成本与体验密度）。
    // AI 关闭（红灯）时这两个请求**根本不会发起网络调用**，直接回落本地预制内容 —— 零费用。
    gs.aiTactic = null;
    gs.aiTacticFromAi = false;
    gs.aiOracle = null;
    const isBoss = !!(scaledEnemy.isBoss || scaledEnemy.isVoidSovereign);
    const isElite = !!scaledEnemy.isElite;
    // 精英/首领战是关键业务节点，记一条便于复盘难度曲线（敌人名为静态配置，非玩家输入）
    if (isElite || isBoss) {
      logSdk('info', isBoss ? 'battle:boss-start' : 'battle:elite-start', {
        enemy: scaledEnemy.name, floor: gs.floorNumber || 0, region: gs.currentRegion,
        difficulty: gs.difficulty,
      });
    }
    // 两个请求同时入队即可，先后由 aiPump 按优先级决定（oracle 先发、tactics 后发），
    //   不必再靠「人肉错开 1.5s」这种时序巧合来保证低语不被战术挤掉。
    //   stillNeeded：真要发时若玩家已离开战斗，就别发了 —— 内容没人看，钱照扣。
    const stillInBattle = () => gs.scene === 'battle';
    if (isElite || isBoss) this.requestAiTactics(scaledEnemy, stillInBattle);
    if (isBoss)            this.requestAiOracle(scaledEnemy, stillInBattle);
  }

  // AI 战术：让精英/首领针对玩家当前状态选择战术倾向，影响其**出招偏好**（不改数值，保平衡）
  // 异步、不阻塞开战；失败或关闭时静默回落本地战术，玩家感知不到中断。
  async requestAiTactics(enemyData, stillNeeded) {
    const local = () => aiPickLocal('tactics', (gs.floorNumber || 0) + (enemyData.maxHp || 0));
    if (!aiSys.enabled) { gs.aiTactic = local(); gs.aiTacticFromAi = false; return; }   // 红灯：零调用
    const ctx = `敌人=${enemyData.name} 敌人HP=${enemyData.maxHp} 玩家HP=${gs.hp}/${gs.maxHp} 难度=${getDifficulty().name}`;
    const r = await aiRequest('tactics', aiMessages(AI_SYS_PROMPT.tactics, ctx), local,
      stillNeeded ? { stillNeeded: stillNeeded } : undefined);
    const t = String(r.text || '').trim().toLowerCase();
    // 只接受三个既定战术键。AI 返回任何其它内容都不强行解释，回落本地——
    // 既防止长文本被当成战术，也避免模型跑偏时污染玩法。
    const okTactic = (t === 'aggressive' || t === 'defensive' || t === 'control');
    gs.aiTactic = okTactic ? t : local();
    gs.aiTacticFromAi = !!(r && r.fromAi) && okTactic;   // 仅真实 AI 产出才赋予"AI 话语权"
    // 战术以飘字告知玩家：AI 产出用霓虹紫，本地兜底用暗灰 —— 一眼可辨这次到底有没有真的调用 AI
    try {
      const label = { aggressive: '它决定猛攻', defensive: '它决定固守', control: '它决定施诡' }[gs.aiTactic] || '';
      if (label && gs.scene === 'battle') {
        // 样式统一层：AI 战术播报与本地兜底同为**金色系**，只差明度。
        //   （此前 AI 给紫、本地给灰 —— 同一句播报两种脸色，等于把实现来源写在玩家脸上）
        floatingTexts.add(GAME_W * 0.72, GAME_H * 0.30, label, r.fromAi ? COLORS.gold : COLORS.goldDim, 14);
      }
    } catch (e) { /* 提示失败不影响战斗 */ }
  }

  // AI 低语：首领战开场的一句话凶兆（纯氛围层，失败不影响战斗任何数值）
  async requestAiOracle(enemyData, stillNeeded) {
    const local = () => aiPickLocal('oracle', (gs.floorNumber || 0) + (gs.currentLayer || 0));
    if (!aiSys.enabled) { gs.aiOracle = local(); return; }   // 红灯：零调用
    const ctx = `首领=${enemyData.name} 玩家HP=${gs.hp}/${gs.maxHp} 楼层=${gs.floorNumber || 0}`;
    const r = await aiRequest('oracle', aiMessages(AI_SYS_PROMPT.oracle, ctx), local,
      stillNeeded ? { stillNeeded: stillNeeded } : undefined);
    gs.aiOracle = String(r.text || local()).slice(0, 60);    // 限长，防止 AI 长文本撑坏排版
    // 低语以飘字呈现（不占布局、不挡操作）；异步返回时可能已离开战斗，用场景守卫兜住
    try {
      if (gs.scene === 'battle' && gs.aiOracle) {
        // 样式统一层：AI 句与本地句同色系，只差明度（此前紫 vs 灰，来源被一眼看穿）
        floatingTexts.add(GAME_W / 2, GAME_H * 0.16, gs.aiOracle, r.fromAi ? COLORS.gold : COLORS.goldDim, 14);
      }
    } catch (e) { /* 提示失败不影响战斗 */ }
  }

  selectEnemy(node) {
    if (!node) return 'void_spawn';
    // 区域下标夹紧：越界一律按最后一区处理，避免 REGION_* 配表漏项时拿到 undefined
    const ri = Math.max(0, Math.min(gs.currentRegion || 0, REGION_BOSS.length - 1));
    // Boss 按区域分配：第一区域 codex_abyssus，第二区域 void_sovereign
    if (node.type === 'boss') {
      return REGION_BOSS[ri] || 'codex_abyssus';
    }
    if (node.type === 'elite') {
      // 精英：从本区精英池随机（原本每区固定 1 只，现已扩为每区 2 只）
      const ep = (REGION_ELITE[ri] || []).filter(id => ENEMY_DATA[id]);
      if (ep.length) return pick(ep);
      return ri >= 1 ? 'nightmare_knight' : 'bound_abomination';
    }
    // 普通战斗：从本区敌人池随机
    let pool = (REGION_BATTLE_POOL[ri] || []).filter(id => ENEMY_DATA[id]);
    // 过滤掉未定义的敌人（防止 ENEMY_DATA 中不存在）
    if (pool.length === 0) pool = ['void_spawn'];
    return pick(pool);
  }
  findCurrentNode() {
    // 优先使用动态生成的地图数据，回退到 MAP_CONFIG
    let mapData = gs.mapData || MAP_CONFIG;
    for (let layer of mapData.layers) {
      for (let node of layer.nodes) {
        if (node.id === gs.currentNodeId) return node;
      }
    }
    return null;
  }
  // ② 读牌：玩家行为采样（巧妙性来源）——必须在 endEnemyTurn 重置 _turnBlockGained 之前调用
  snapshotPlayerRead() {
    const cs = gs.combatState;
    if (!cs) return null;
    const r = cs._read || (cs._read = { turns: 0, blockTurns: 0, burstTurns: 0, comboPeak: 0, lastBlock: 0, lastCombo: 0 });
    const blockGained = cs._turnBlockGained || 0;
    const combo = cs.comboCount || 0;
    r.turns++;
    r.lastBlock = blockGained;
    r.lastCombo = combo;
    if (blockGained >= 12) r.blockTurns++;   // 重防御回合
    if (combo >= 5) r.burstTurns++;           // 高连击（爆发）回合
    if (combo > r.comboPeak) r.comboPeak = combo;
    return r;
  }
  // ③ 规则评分层：对候选意图打分（越高越优先）
  //    只影响【选哪个意图】，绝不改动任何数值 —— 平衡仍由难度系统与敌人模板守底线
  scoreIntent(candidate) {
    const cs = gs.combatState, ed = cs.enemyData || {};
    const tm = ENEMY_TEMPERAMENT[getEnemyTemperament(ed)] || ENEMY_TEMPERAMENT.adaptive;
    const read = cs._read || { turns: 0, blockTurns: 0, burstTurns: 0 };
    let s = 0;
    const eHpPct = cs.enemyHp / Math.max(1, cs.enemyMaxHp);
    const pHpPct = gs.hp / Math.max(1, gs.maxHp);
    const combo = cs.comboCount || 0;
    const growth = cs._diffGrowth || 0;
    // 本回合实际能打出的攻击伤害（与 enemyTakeTurn 结算口径一致：易伤×1.5 → 虚弱×0.75）
    let atkDmg = (ed.attackDmg || 0) + growth;
    if (cs.bossPhase2 && ed.bossPhase2) atkDmg = ed.bossPhase2.attackDmg + growth;
    if (cs.bossPhase3 && ed.bossPhase3) atkDmg = ed.bossPhase3.attackDmg + growth;
    if ((cs.playerStatuses.vulnerable || 0) > 0) atkDmg = Math.floor(atkDmg * 1.5);
    if ((cs.enemyStatuses.weak || 0) > 0) atkDmg = Math.floor(atkDmg * 0.75);
    const spDmg = (ed.special && ed.special.type === 'attack') ? ((ed.special.dmg || 0) + growth) : 0;

    if (candidate === 'attack') {
      s += 1;
      // 【巧妙·斩杀线】能一击致命 → 倾巢而出
      if (gs.hp <= atkDmg) s += 6;
      else if (gs.hp <= atkDmg + spDmg) s += 3;
      if (pHpPct < 0.35) s += 2;
      // 【巧妙·破盾判断】玩家格挡足以完全吸收 → 硬打等于浪费回合
      if (atkDmg > 0 && cs.playerBlock >= atkDmg) s -= 3;
      if ((cs.playerStatuses.vulnerable || 0) > 0) s += 2;   // 易伤：攻击被放大
      if ((cs.enemyStatuses.weak || 0) > 0) s -= 2;          // 自身虚弱：攻击贬值
      if ((cs._enemyStrength || 0) >= 4) s += 2;             // 力量雪球：继续压制
      if (ed.comboReflect && combo > 0) s += 2;              // 反伤特性：越打越赚
      // 【读牌·反龟壳】玩家常年重防御 → 攻击收益低
      if (read.turns >= 2 && read.blockTurns / read.turns > 0.5) s -= 2;
    }
    if (candidate === 'defend') {
      if (eHpPct < 0.30) s += 3;                             // 自身危险 → 自保
      if (cs.enemyBlock > 0) s -= 4;                         // 已有格挡 → 不重复叠
      if (combo >= 5) s += 2;                                // 玩家连击蓄势 → 备防
      if (read.turns >= 2 && read.burstTurns / read.turns > 0.4) s += 2; // 读牌：爆发型玩家 → 提前备防
      if ((cs.enemyStatuses.weak || 0) > 0) s += 1;          // 虚弱期适合苟
      if (pHpPct > 0.8 && eHpPct > 0.7) s -= 1;              // 双方健康 → 别龟着
    }
    if (candidate === 'special') {
      const sp = ed.special || {};
      if (sp.type === 'heal') {
        if (eHpPct < 0.40) s += 4; else s -= 3;              // 残血才治，血满别浪费
      } else if (sp.type === 'buff') {
        if (eHpPct > 0.55 && combo < 3) s += 2; else s -= 2; // 安全期才叠力量
      } else if (sp.type === 'debuff') {
        const immune = ed.statusImmune || [];
        if (immune.includes(sp.debuffType)) s -= 99;         // 防呆：对该异常免疫
        const already = (cs.playerStatuses[sp.debuffType] || 0);
        if (already > 0) s -= 3;                             // 已挂着 → 不重复
        if (sp.debuffType === 'vulnerable') {
          if (combo >= 3) s += 3;                            // 配合爆发窗口
          if (gs.hp <= atkDmg * 1.5) s += 2;                 // 易伤 = 斩杀铺垫
          if (atkDmg > 0 && cs.playerBlock >= atkDmg) s += 3;// 【巧妙·破墙】龟壳厚 → 上易伤而非硬撞
        }
        if (sp.debuffType === 'weak' && cs.playerBlock > 0) s += 2;
      } else if (sp.type === 'attack') {
        if (gs.hp <= spDmg) s += 6;                          // 特殊攻击可斩杀
        else if (pHpPct < 0.4) s += 2;
        if (spDmg > 0 && cs.playerBlock >= spDmg) s -= 3;
        if ((cs.playerStatuses.vulnerable || 0) > 0) s += 2;
      }
    }
    // 【巧妙·连击威胁响应】玩家连击蓄势（≥5）＝ 爆发将至
    // 关键：comboSiphon / comboBreakTurns / comboReflect 都是【被动】特性（不由意图选择触发），
    // 因此正确对策是——自带反制手段的敌人有恃无恐继续压制，没有的则先备防扛过爆发。
    if (combo >= 5) {
      const hasAntiCombo = !!(ed.comboSiphon || ed.comboBreakTurns);
      if (candidate === 'attack') s += hasAntiCombo ? 2.0 : -1.0;
      if (candidate === 'defend') s += hasAntiCombo ? -0.5 : 2.0;
    }
    // 下回合连击将被被动清空 → 有恃无恐放手压制（turnNumber 在意图生成后才 +1，故用 +1 预判）
    if (ed.comboBreakTurns && combo > 0 && ((gs.turnNumber + 1) % ed.comboBreakTurns === 0)) {
      if (candidate === 'attack') s += 2.0;
    }
    return s + (tm[candidate] || 0);  // ① 战术人格加成（多样性来源 1）
  }
  // ④ 加权随机选择（多样性来源 2）：softmax 抽样，而非死板取第一 —— 避免被玩家背板
  pickWeightedIntent(scored, variety) {
    if (!scored || scored.length === 0) return 'attack';
    const t = Math.max(0.4, variety || 1.0);   // variety 越大越随机（诡诈人格最难预测）
    const top = scored.slice(0, 3);
    const weights = top.map(x => Math.exp((x.s - top[0].s) / t));
    const sum = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * sum;
    for (let i = 0; i < top.length; i++) {
      r -= weights[i];
      if (r <= 0) return top[i].c;
    }
    return top[0].c;
  }
  generateEnemyIntent() {
    let cs = gs.combatState;
    let pattern = cs.enemyData.intentPattern;
    if (!Array.isArray(pattern) || pattern.length === 0) pattern = ['attack'];
    let intentType;
    // 候选去重（intentPattern 常含重复项，如 ['attack','attack','defend']）
    const candidates = Array.from(new Set(pattern));
    if (candidates.length === 1) {
      intentType = candidates[0];
    } else {
      // —— PHASE 1a：状态感知规则评分层 ——
      let scored = candidates.map(c => ({ c, s: this.scoreIntent(c) }));
      // 云端 AI 战术（enemy_tactics）与规则分【线性混合】：w=0 纯规则层，w=1 纯 AI 偏好
      // w 由难度档位决定（低语 0.2 → 湮灭 0.8），即"AI 在敌人意图决策中的话语权"。
      // 只有真实 AI 产出（gs.aiTacticFromAi）才参与加权；AI 关闭或调用失败回落本地时 w=0，
      // 退化为纯规则层 —— 保证"AI 增色但不是硬依赖"。
      const tactic = gs.aiTactic;
      if (tactic) {
        const want = (tactic === 'aggressive') ? 'attack'
                   : (tactic === 'defensive') ? 'defend'
                   : (tactic === 'control') ? 'special' : null;
        const w = gs.aiTacticFromAi ? getAiTacticWeight() : 0;
        if (want && w > 0 && scored.some(x => x.c === want)) {
          const base = Math.max(...scored.map(x => x.s));
          scored.forEach(x => {
            const aiScore = base + ((x.c === want) ? AI_PREF_SEP : -AI_PREF_SEP);
            x.s = x.s * (1 - w) + aiScore * w;
          });
        }
      }
      // ③ 重复抑制（多样性来源 3）：连续两回合同一意图 → 降权，避免"背板"
      const hist = cs._intentHistory || (cs._intentHistory = []);
      scored.forEach(x => {
        const recent = hist.slice(-2);
        if (recent.length >= 2 && recent[0] === x.c && recent[1] === x.c) x.s -= 2.5;
      });
      scored.sort((a, b) => b.s - a.s);
      const tm = ENEMY_TEMPERAMENT[getEnemyTemperament(cs.enemyData)] || ENEMY_TEMPERAMENT.adaptive;
      intentType = this.pickWeightedIntent(scored, tm.variety);
      hist.push(intentType);
      if (hist.length > 6) hist.shift();
    }
    // 特殊行动概率（保留随机性，防止敌人被完全预测 —— 方案 §7"可玩性被读牌破坏"）
    if (intentType === 'special' || (cs.enemyData.specialChance && Math.random() < cs.enemyData.specialChance)) {
      intentType = 'special';
    }
    let intent = { type: intentType };
    // 难度·敌人每回合成长（独立于 attackDmg，因此不会被首领阶段切换时的赋值覆盖）
    const growth = cs._diffGrowth || 0;
    switch (intentType) {
      case 'attack':
        intent.dmg = cs.enemyData.attackDmg + growth;
        if (cs.bossPhase2 && cs.enemyData.bossPhase2) intent.dmg = cs.enemyData.bossPhase2.attackDmg + growth;
        break;
      case 'defend':
        intent.block = cs.enemyData.blockAmt;
        break;
      case 'special':
        let sp = cs.enemyData.special || {};
        if (sp.type === 'attack') {
          intent.type = 'attack';
          intent.dmg = (sp.dmg || 0) + growth;
        } else if (sp.type === 'buff') {
          intent.type = 'buff';
          intent.buffType = sp.buffType;
          intent.amt = sp.amt;
        } else if (sp.type === 'debuff') {
          intent.type = 'debuff';
          intent.debuffType = sp.debuffType;
          intent.amt = sp.amt;
        } else if (sp.type === 'heal') {
          intent.type = 'heal';
          intent.amt = sp.amt;
        }
        break;
    }
    this.enemyIntent = intent;
  }
  drawCards(n) {
    let cs = gs.combatState;
    for (let i = 0; i < n; i++) {
      if (cs.drawPile.length === 0) {
        if (cs.discardPile.length === 0) break;
        cs.drawPile = shuffle(cs.discardPile);
        cs.discardPile = [];
        floatingTexts.add(GAME_W * 0.3, GAME_H * 0.85, '洗牌', COLORS.textDim, 14);
      }
      if (cs.drawPile.length > 0) {
        let card = cs.drawPile.pop();
        // 先攻特性：第一回合更高概率抽到
        if (gs.turnNumber === 0 && card.keywords.includes('先攻')) {
          cs.hand.unshift(card); // 放到手牌前面
        } else {
          cs.hand.push(card);
        }
      }
    }
    // 手牌上限随难度收紧（低语 12 / 回响 10 / 深渊 9 / 湮灭 7）
    const handLimit = (typeof getDifficulty === 'function') ? getDifficulty().handLimit : 10;
    while (cs.hand.length > handLimit) {
      let overflow = cs.hand.pop();
      // 销毁卡不进入弃牌堆
      if (!overflow.destroy) cs.discardPile.push(overflow);
    }
  }
  canPlayCard(card) {
    let cs = gs.combatState;
    if (cs.turnPhase !== 'player') return false;
    let cost = card.cost;
    // 先攻：本回合第一张牌，消耗-1
    if (card.keywords.includes('先攻') && cs.cardsPlayedThisTurn.length === 0) {
      cost = Math.max(0, cost - 1);
    }
    // 先攻之印遗物
    if (gs.hasRelic('first_strike_charm') && !card.keywords.includes('先攻') && cs.cardsPlayedThisTurn.length === 0) {
      cost = Math.max(0, cost - 1);
    }
    // T177 深度思考折扣
    if (card._discountCost) cost = Math.max(0, cost - card._discountCost);
    if (cs.ap < cost) return false;
    // playCondition 校验（如火山需10层灼烧）
    if (card.playCondition && card.playCondition.enemyBurnGte) {
      let burnLvl = (cs.enemyStatuses && cs.enemyStatuses.burn) || 0;
      if (burnLvl < card.playCondition.enemyBurnGte) return false;
    }
    return true;
  }
  // ==================== 通用卡牌升级函数 ====================
  // 根据卡牌类型和关键词差异化应用升级效果
  // 调用后 card.upgraded = true，且对应数值字段被修改
  // opts.replay = 双倍卡的「原样重放」模式：同一张牌再走一遍**完整效果流程**。
  //   豁免的都是"打出一张牌时才该发生一次"的动作（费用 / 音效 / 动画 / 离手 / 进堆 / 计数），
  //   重放只是"效果再来一遍"，它不是又打了一张牌。
  //   ⚠️ 其中最要命的是 hand.splice：重放时这张牌早已离手，indexOf 返回 -1，
  //      splice(-1, 1) 会删掉**手牌最后一张无辜的牌** —— 漏掉这条守卫就是毁存档级的 bug。
  playCard(card, opts) {
    const REPLAY = !!(opts && opts.replay);
    // T242：战报 · 出牌数。重放不计 —— 它是双倍卡付过费买来的回声，不是玩家的新决策。
    try { if (!REPLAY && gs.runStats) gs.runStats.cardsPlayed++; } catch (e) {}
    let cs = gs.combatState;
    let cost = card.cost;
    if (REPLAY) {
      cost = 0;   // 重放 0 费：多出来的那几次是双倍卡付过费买来的，不该再收一遍
    } else {
      // 先攻减费
      if (card.keywords.includes('先攻') && cs.cardsPlayedThisTurn.length === 0) {
        cost = Math.max(0, cost - 1);
      }
      if (gs.hasRelic('first_strike_charm') && cs.cardsPlayedThisTurn.length === 0) {
        cost = Math.max(0, cost - 1);
      }
      // T177 深度思考：被折扣的卡牌本回合费用降低
      if (card._discountCost) cost = Math.max(0, cost - card._discountCost);
    }
    cs.ap -= cost;
    if (!REPLAY) audio.playSFX('card_play');   // 重放不叠音（同一帧两声会爆音）
    if (!REPLAY && card.playCondition && card.playCondition.enemyBurnGte) {
      let burnLvl = (cs.enemyStatuses && cs.enemyStatuses.burn) || 0;
      if (burnLvl < card.playCondition.enemyBurnGte) {
        // 退还 AP
        cs.ap += cost;
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.5, `需 ${card.playCondition.enemyBurnGte} 层灼烧!`, COLORS.red, 16);
        return;
      }
    }
    // T177 双倍卡：捕获并清除待触发次数（下一张牌效果重复触发）
    let pendingDouble = 0;
    // 重放**不捕获**蓄能：否则重放自己会把刚清空的蓄能再抓一次 → 无限递归。
    if (!REPLAY && card.effect !== 'next_card_double' && cs._doubleNextTimes && cs._doubleNextTimes > 0) {
      pendingDouble = cs._doubleNextTimes;
      cs._doubleNextTimes = 0;
    }
    // 卡牌动画
    let handIdx = cs.hand.indexOf(card);
    // —— 重放豁免区：离手 / 出牌动画 / 出牌计数 ——
    //   splice 那条见函数头注释：重放时 indexOf 为 -1，不豁免就会误删手牌末位。
    //   计数不累加：本回合"打出的牌数"是玩家的操作量，不该被双倍虚增
    //   （否则先攻减费、按出牌数触发的遗物都会被一张牌冒充两张牌骗到）。
    if (!REPLAY) {
      this.cardAnimations.push({
        type: 'play',
        card: card,
        fromX: GAME_W * 0.25 + handIdx * 110,
        fromY: GAME_H * 0.78,
        toX: GAME_W * 0.45,
        toY: GAME_H * 0.5,
        progress: 0,
        duration: 20,
      });
      cs.hand.splice(handIdx, 1);
      cs.cardsPlayedThisTurn.push(card);
    }
    // 触发角色动画
    if (isOffensiveCard(card)) this.playerAnim.attackAnim = 1.0;
    if (isDefensiveCard(card)) this.playerAnim.defendAnim = 1.0;
    // 处理卡牌特性
    let dmg = card.baseDmg || 0;
    let block = card.baseBlock || 0;
    let keywords = card.keywords || [];
    let totalDmg = 0;
    // 连击计数修改
    let comboAdded = 0;
    let comboConsumed = 0;
    // 每次出牌重置窗口刚启动标记
    if (!keywords.includes('先攻')) {
      cs._windowJustOpened = false;
      cs._windowOpenerCard = null;
    }
    // 先攻处理
    if (keywords.includes('先攻')) {
      cs.lastPlayedKeyword = '先攻';
      cs.comboWindow = Math.max(cs.comboWindow, 4); // 先攻牌自身消耗1后剩3张符合"3张连击窗口"文本
      floatingTexts.add(GAME_W * 0.5, GAME_H * 0.32, '先攻! 连击窗口启动', COLORS.gold, 16);
      // 标记先攻牌本张牌刚启动的窗口
      cs._windowJustOpened = true;
      cs._windowOpenerCard = card;
      // 先攻牌自身也获得 +1 连击计数
      comboAdded += 1;
    }
    // 连击 keyword 牌永远 +1
    if (keywords.includes('连击')) {
      let isChained = cs.lastPlayedKeyword === '先攻' || cs.lastPlayedKeyword === '连击' || cs.lastPlayedKeyword === '流转';
      if (isChained) {
        if (card.comboBonus) dmg += card.comboBonus;
        if (card.comboBlock) block += card.comboBlock;
        // ===== T177 新增连击体系字段处理 =====
        // 连击翻倍（combo_storm）：连击触发时连击计数翻倍（在 comboCount += comboAdded 之前翻倍）
        if (card.comboDouble) {
          cs.comboCount *= 2;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.28, '连击翻倍!', COLORS.combo, 18);
        }
        // 连击获取（combo_focus）：连击触发时额外 +comboGain 连击
        if (card.comboGain) {
          comboAdded += card.comboGain;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.32, `+${card.comboGain}连击`, COLORS.combo, 14);
        }
        // 连击吸血（life_steal_combo）：连击触发时每层连击回 comboLifeSteal HP
        if (card.comboLifeSteal && cs.comboCount > 0) {
          let heal = cs.comboCount * card.comboLifeSteal;
          gs.hp = Math.min(gs.maxHp, gs.hp + heal);
          floatingTexts.add(GAME_W * 0.35, GAME_H * 0.5, `+${heal}❤`, COLORS.greenBright, 14);
        }
        // 连击回AP（combo_charge）：连击触发时每层连击回 1 AP，上限 apPerComboMax
        if (card.apPerCombo && cs.comboCount > 0) {
          let apGain = Math.min(cs.comboCount * card.apPerCombo, card.apPerComboMax || 3);
          cs.ap += apGain;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.32, `+${apGain}AP`, COLORS.gold, 14);
        }
        // 连击抽牌（combo_draw）：连击触发时每层连击多抽 1 张，上限 drawPerComboMax
        if (card.drawPerCombo && cs.comboCount > 0) {
          let extraDrawN = Math.min(cs.comboCount * card.drawPerCombo, card.drawPerComboMax || 3);
          this.drawCards(extraDrawN);
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.32, `+${extraDrawN}抽牌`, COLORS.gold, 14);
        }
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.3, '连击!', COLORS.combo, 16);
        audio.playSFX('combo');
        // 连击引擎遗物（链式触发）
        gs.relics.forEach(r => { if (r.onComboTrigger) r.onComboTrigger(gs); });
      }
      comboAdded += 1;
      cs.lastPlayedKeyword = '连击';
    }
    // 连击窗口：消耗窗口 + 窗口加成
    // 守卫：非连击keyword且能造伤才消耗窗口
    let isSelfOpenedWindow = cs._windowJustOpened && cs._windowOpenerCard === card;
    if (cs.comboWindow > 0 && !isSelfOpenedWindow && (!keywords.includes('连击') ? canDealDirectDamage(card) : true)) {
      let prevLastKeyword = cs.lastPlayedKeyword; // 保存，避免下方覆盖
      cs.comboWindow--;
      if (cs.comboWindow <= 0) {
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.35, '连击窗口结束', COLORS.textDim, 12);
      }
      // 排除普通防御牌（无连击 keyword 且不造伤）误触发连击计数
      // 异常牌由异常keyword块独立+1，窗口块不重复
      if (!keywords.includes('连击') && !keywords.includes('异常')) {
        // 窗口内非连击keyword牌只+1
        // 避免"先攻启动窗口后立刻打普通攻击牌"误判为链式而 +2
        comboAdded += 1;
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.3, '连击!', COLORS.combo, 16);
        audio.playSFX('combo');
        gs.relics.forEach(r => { if (r.onComboTrigger) r.onComboTrigger(gs); });
      } else if (keywords.includes('异常')) {
        gs.relics.forEach(r => { if (r.onComboTrigger) r.onComboTrigger(gs); });
      }
    }
    // 流转处理
    if (keywords.includes('流转')) {
      if (cs.lastPlayedKeyword === '猛击') {
        // 猛击后流转：恢复AP和抽牌
        let consumed = cs.comboCount;
        let lastComboConsumed = cs._lastComboConsumed || 0;
        let apRestore = Math.floor(lastComboConsumed * (card.apRestorePerCombo || 0.4));
        if (gs.hasRelic('flow_catalyst')) apRestore += 1;
        if (card.threshold && lastComboConsumed >= card.threshold) apRestore += (card.thresholdExtraAp || 1);
        cs.ap += apRestore;
        if (card.drawCards) this.drawCards(card.drawCards);
        if (card.retainCombo) cs.comboCount = Math.floor(lastComboConsumed * card.retainCombo);
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.28, `流转 +${apRestore}AP`, COLORS.greenBright, 16);
        audio.playSFX('draw');
      } else if (cs.lastPlayedKeyword === '连击' || cs.lastPlayedKeyword === '先攻') {
        // 连击后流转：算作连击
        comboAdded += (card.comboBonus || 0) + 1;
        if (card.comboDouble) {
          cs.comboCount *= 2;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.28, '连击翻倍!', COLORS.combo, 18);
        }
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.3, '流转·连击!', COLORS.greenBright, 16);
        audio.playSFX('combo');
      } else if (cs.lastPlayedKeyword === '流转') {
        // 流转接流转：flow_cascade 回 1 AP
        if (card.flowApRefund && !card.eternalCycle) {
          cs.ap += card.flowApRefund;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.28, `流转 +${card.flowApRefund}AP`, COLORS.greenBright, 16);
          audio.playSFX('draw');
        }
        // eternal_flow 激活：本回合流转牌全部回 1 AP
        if (card.eternalFlow) {
          cs._eternalFlowActive = true;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.25, '永恒流转!', COLORS.blueBright, 18);
        }
        if (cs._eternalFlowActive && !card.eternalFlow) {
          cs.ap += 1;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.28, '永恒 +1AP', COLORS.blueBright, 14);
        }
        // T177 流转抽牌：前张为流转时再抽 flowBonusDraw 张
        if (card.flowBonusDraw) {
          this.drawCards(card.flowBonusDraw);
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.3, `流转+${card.flowBonusDraw}抽`, COLORS.greenBright, 14);
        }
      } else {
        // 流转作为起始
        block += 3;
        // eternal_flow 起始也激活
        if (card.eternalFlow) {
          cs._eternalFlowActive = true;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.25, '永恒流转!', COLORS.blueBright, 18);
        }
      }
      // T177 永恒循环激活：本回合流转牌回AP + 连击（能力牌首次打出时设置标记）
      if (card.eternalCycle) {
        cs._eternalCycleActive = true;
        cs._eternalCycleApRefund = card.flowApRefund || 1;
        cs._eternalCycleComboGain = card.flowComboGain || 1;
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.25, '永恒循环!', COLORS.blueBright, 18);
      }
      // T177 永恒循环收益：非激活牌本张触发回AP + 连击
      if (cs._eternalCycleActive && !card.eternalCycle) {
        if (cs._eternalCycleApRefund) {
          cs.ap += cs._eternalCycleApRefund;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.28, `循环+${cs._eternalCycleApRefund}AP`, COLORS.blueBright, 14);
        }
        if (cs._eternalCycleComboGain) {
          comboAdded += cs._eternalCycleComboGain;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.3, `循环+${cs._eternalCycleComboGain}连击`, COLORS.blueBright, 14);
        }
      }
      // T177 流转打击：升级后流转触发时额外 +flowComboExtra 连击
      if (card.flowAsCombo && card.flowComboExtra) {
        comboAdded += card.flowComboExtra;
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.3, `+${card.flowComboExtra}连击`, COLORS.greenBright, 14);
      }
      // 所有流转分支统一设置 lastPlayedKeyword（修复猛击→流转 / 连击→流转 分支未更新）
      cs.lastPlayedKeyword = '流转';
    }
    // 猛击处理
    if (keywords.includes('猛击')) {
      let consumed = cs.comboCount;
      cs._lastComboConsumed = consumed;
      comboConsumed = consumed;
      let smashDmg = dmg + consumed * (card.comboScale || 4);
      if (gs.hasRelic('smash_hammer')) smashDmg = Math.floor(smashDmg * 1.5);
      if (card.threshold && consumed >= card.threshold) {
        smashDmg += card.thresholdBonus || 0;
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.25, '临界突破!', COLORS.orangeBright, 18);
      }
      // 处决效果
      if (card.executeThreshold && cs.enemyHp <= cs.enemyMaxHp * card.executeThreshold) {
        smashDmg = Math.floor(smashDmg * (card.executeMultiplier || 2));
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.22, '处决!', COLORS.redBright, 20);
      }
      totalDmg = smashDmg;
      // 相位迁跃者：猛击吃掉的是连击的**快照**，连击本身保留 → 一回合内可连续猛击
      if (!comboNoConsumeNow()) cs.comboCount = 0;
      cs.lastPlayedKeyword = '猛击';
      audio.playSFX('smash');
      screenShake.trigger(6, 8);
      // 衔尾蛇之戒
      gs.relics.forEach(r => { if (r.onSmashConsume) r.onSmashConsume(gs, consumed); });
    }
    // 震慑处理
    if (keywords.includes('震慑')) {
      // T177 震慑共鸣：基于现有震慑层数施加，不消耗连击
      if (card.stunResonance) {
        let baseStun = card.baseStun || 2;
        let extraStun = cs.enemyStunStacks; // 每有1层敌方震慑额外+1
        let totalStun = baseStun + extraStun;
        cs.enemyStunStacks += totalStun;
        floatingTexts.add(GAME_W * 0.5, GAME_H * 0.25, `震慑 +${totalStun}`, COLORS.purpleBright, 16);
        cs.lastPlayedKeyword = '震慑';
        audio.playSFX('stun');
      } else {
        let consumed = cs.comboCount;
        cs._lastComboConsumed = consumed;
        comboConsumed = consumed;
        let stunDmg = dmg + consumed * (card.comboScale || 2);
        // T177 震慑斩：对震慑敌人额外造成震慑层数×stunDmgPerStack伤害
        if (card.stunDmgPerStack && cs.enemyStunStacks > 0) {
          let bonusDmg = cs.enemyStunStacks * card.stunDmgPerStack;
          stunDmg += bonusDmg;
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.22, `震慑增伤+${bonusDmg}`, COLORS.purpleBright, 14);
        }
        // 碎裂打击：对震慑状态敌人+50%伤害
        if (card.shatterBonus && cs.enemyStunStacks > 0) {
          stunDmg = Math.floor(stunDmg * card.shatterBonus);
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.22, '碎裂!', COLORS.purpleBright, 18);
        }
        totalDmg = stunDmg;
        let stunStacks = consumed * (card.stunPerCombo || 1);
        cs.enemyStunStacks += stunStacks;
        // 震慑不消耗连击（仅 stunPerCombo>0 时才消耗）
        //   相位迁跃者：连这个消耗也免掉
        if (stunStacks > 0 && !comboNoConsumeNow()) {
          cs.comboCount = 0;
        }
        cs.lastPlayedKeyword = '震慑';
        audio.playSFX('stun');
        if (stunStacks > 0) {
          floatingTexts.add(GAME_W * 0.5, GAME_H * 0.25, `震慑 +${stunStacks}`, COLORS.purpleBright, 16);
        }
      }
    }
    // 异常处理
    if (keywords.includes('异常')) {
      // 检查敌人是否异常免疫
      let immune = cs.enemyData.statusImmune || [];
      // 异常施加辅助函数（考虑免疫）
      let applyStatus = (type, amt) => {
        if (immune.includes(type)) {
          floatingTexts.add(GAME_W * 0.65, GAME_H * 0.32, '免疫!', COLORS.textDim, 14);
          return;
        }
        cs.enemyStatuses[type] = (cs.enemyStatuses[type] || 0) + amt;
        let statusName = { burn: '灼烧', freeze: '冻结', corrode: '腐蚀' }[type] || type;
        floatingTexts.add(GAME_W * 0.65, GAME_H * 0.35, `${statusName} +${amt}`, COLORS[type] || COLORS.purple, 14);
      };
      if (card.statusType === 'random') {
        // 异常迸发：随机施加 statusCount 种异常各 statusAmt 层
        let allTypes = ['burn', 'freeze', 'corrode'];
        let available = allTypes.filter(t => !immune.includes(t));
        let count = Math.min(card.statusCount || 2, available.length);
        let picked = shuffle(available).slice(0, count);
        picked.forEach(t => applyStatus(t, card.statusAmt));
      } else if (card.statusType === 'all') {
        // 全息爆发：施加全部异常
        ['burn', 'freeze', 'corrode'].forEach(t => applyStatus(t, card.statusAmt));
      } else if (card.statusType && card.statusAmt) {
        // 单一异常（原有逻辑）
        let amt = card.statusAmt;
        if (comboAdded > 0 || cs.comboCount > 0) {
          amt += Math.floor((comboAdded + cs.comboCount) / 2);
        }
        if (card.statusPerCombo && cs.comboCount > 0) {
          amt += cs.comboCount * card.statusPerCombo;
        }
        applyStatus(card.statusType, amt);
      }
      // T177 冰盾：每层敌方冻结额外 +blockPerFreeze 格挡
      if (card.blockPerFreeze && cs.enemyStatuses.freeze > 0) {
        let extraBlock = cs.enemyStatuses.freeze * card.blockPerFreeze;
        block += extraBlock;
        floatingTexts.add(GAME_W * 0.35, GAME_H * 0.55, `冰盾+${extraBlock}🛡`, COLORS.freeze, 14);
      }
      // 异常keyword仅在连击窗口开放时才累计连击计数
      if (cs.comboWindow > 0) {
        comboAdded += 1;
      }
      cs.lastPlayedKeyword = '异常';
    }
    // T177 非异常keyword的纯状态牌（vulnerable_mark 易伤标记等）
    if (!keywords.includes('异常') && card.statusType && card.statusAmt
        && card.statusType !== 'random' && card.statusType !== 'multi' && card.statusType !== 'all') {
      let immune = cs.enemyData.statusImmune || [];
      if (immune.includes(card.statusType)) {
        floatingTexts.add(GAME_W * 0.65, GAME_H * 0.32, '免疫!', COLORS.textDim, 14);
      } else {
        cs.enemyStatuses[card.statusType] = (cs.enemyStatuses[card.statusType] || 0) + card.statusAmt;
